<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>出荷・配送</title>
<link rel="icon" type="image/svg+xml" href="favicon_ship.svg">
<link rel="stylesheet" href="hanaoka_theme.css?v=20261004"><!-- 色・フォントは共通ファイル -->
<script src="https://cdn.jsdelivr.net/npm/@azure/msal-browser@3.10.0/lib/msal-browser.min.js" crossorigin="anonymous"></script>
<script src="hanaoka_auth.js"></script>
<script src="ship_core.js?v=7"></script>
<link rel="stylesheet" href="ship_search.css?v=8">
</head>
<body>

<div id="loginScreen">
  <div class="login-card">
    <div class="logo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h11v10H3z"/><path d="M14 9h4l3 3v4h-7"/><circle cx="7" cy="18" r="1.8"/><circle cx="17" cy="18" r="1.8"/></svg></div>
    <h1>出荷・配送</h1>
    <p>花岡車輌 業務アプリ</p>
    <button id="loginBtn" data-ha-login>Microsoft アカウントでサインイン</button>
    <div id="loginError"></div>
    <div class="login-foot">出荷した荷物の送り状番号を、注文番号・得意先・品目などから探します<br>受注と出荷がつながって見られます</div>
  </div>
</div>

<header class="app-hdr">
  <a class="hub-home" href="hanaoka_hub.html" title="HANAOKA HUBへ"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10v9a1 1 0 0 0 1 1h11a1 1 0 0 0 1-1v-9"/></svg>HUB</a>
  <h1><span class="dot"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h11v10H3z"/><path d="M14 9h4l3 3v4h-7"/><circle cx="7" cy="18" r="1.8"/><circle cx="17" cy="18" r="1.8"/></svg></span>出荷・配送</h1>
  <div class="grow"></div>
  <div class="userchip"><span class="avatar" id="sp-avatar"></span><span id="sp-user"></span></div>
  <a class="hbtn" href="ship_help.html" target="_blank" rel="noopener" style="text-decoration:none" title="使い方・カードの見方・困ったとき">使い方</a>
  <button class="hbtn" id="btn-reload" title="SharePoint の検索用データを読み直す">↻ 更新</button>
</header>
<div id="statusBar"><span id="sp-status">未サインイン</span></div>
<div id="warnBox" hidden></div>

<div class="wrap">
  <div class="panel">
    <form id="searchForm" class="srow" autocomplete="off">
      <input type="search" id="f-q" placeholder="売上№・受注№・客先注番・送り状番号・得意先・納品先・品目（空白で区切ると、すべてを含むものだけ）" aria-label="検索">
      <button class="btn" type="submit">検索</button>
      <button class="btn sec" type="button" id="btn-clear">クリア</button>
    </form>
    <div class="srow filters">
      <div class="row" id="periods" style="gap:6px"></div>
      <label class="muted">出荷日 <input type="date" id="f-from"> ～ <input type="date" id="f-to"></label>
      <label class="muted">状態 <select id="f-status"></select></label>
    </div>
    <div class="srow filters"><div class="row" id="carriers" style="gap:6px"></div></div>
  </div>

  <div id="summary" class="muted"></div>
  <div id="list"></div>
  <div id="moreBox" hidden><button class="btn sec" id="btn-more">さらに表示</button></div>

  <details class="panel" id="unmatchedBox" hidden>
    <summary><b id="unmatchedTitle"></b></summary>
    <div class="muted" style="margin:6px 0">運送会社のデータにあって、SMILE の出荷明細に、同じ売上№が見つからない送り状です。SMILE の出力が追いついていない（出荷したばかり）か、売上№の違いが考えられます。</div>
    <div id="unmatchedList"></div>
  </details>

  <details class="panel" id="stateBox">
    <summary><b>データの状態</b></summary>
    <div id="stateList" class="muted" style="margin-top:6px"></div>
  </details>
</div>
<div id="detailBackdrop" hidden></div>
<aside id="detailPanel" hidden aria-label="伝票の詳細">
  <div class="np-hd"><b>伝票の詳細</b><button type="button" class="np-x" id="dt-close" aria-label="閉じる">×</button></div>
  <div class="dt-body" id="detailBody"></div>
</aside>
<div id="noticeBackdrop" hidden></div>
<aside id="noticePanel" hidden aria-label="出荷連絡">
  <div class="np-hd"><b>出荷連絡</b><button type="button" class="np-x" id="np-close" aria-label="閉じる">×</button></div>
  <div class="np-body">
    <div id="np-warn" hidden></div>
    <label for="np-subject" class="muted">件名</label>
    <input type="text" id="np-subject">
    <label for="np-text" class="muted">本文（ここで直してから、コピー・メール作成ができます）</label>
    <textarea id="np-text" rows="16"></textarea>
    <div id="np-note" class="muted"></div>
  </div>
  <div class="np-ft"><button type="button" class="btn" id="np-copy">本文をコピー</button><button type="button" class="btn sec" id="np-mail">メールを作成（Outlook）</button></div>
</aside>
<script src="ship_search.js?v=14"></script>
</body>
</html>

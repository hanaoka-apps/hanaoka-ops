<style>
  :root {
    color-scheme: light;
    --bg: #f7f7f5; --panel: #ffffff; --border: #e3e2de; --text: #1f1e1c; --muted: #767468; --accent: #b8622f;
    --ok: #2f6b3a; --warn: #a8712f; --bad: #b03636;
  }
  * { box-sizing: border-box; }
  html, body { height:100%; }
  body { margin:0; background:var(--bg); color:var(--text); font-family:-apple-system,"Hiragino Sans","Yu Gothic",sans-serif;
    display:flex; flex-direction:column; overflow:hidden; }
  #appRoot { display:flex; flex-direction:column; flex:1; min-height:0; }
  header { padding:14px 24px; border-bottom:1px solid var(--border); display:flex; align-items:center; gap:12px; flex-wrap:wrap; flex-shrink:0; }
  h1 { font-size:16px; margin:0; font-weight:600; }
  select, input { padding:6px 10px; border-radius:6px; border:1px solid var(--border); background:var(--panel); color:var(--text); font-size:13px; }
  button { font:inherit; font-size:13px; padding:6px 12px; border-radius:6px; border:1px solid var(--border); background:var(--panel); color:var(--text); cursor:pointer; }
  button:hover { border-color:var(--accent); }
  button.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
  .tabs { display:flex; gap:4px; }
  .tab-btn { padding:6px 16px; color:var(--muted); }
  .tab-btn.active { background:var(--accent); color:#fff; border-color:var(--accent); }
  .spacer { flex:1; }
  .muted { color:var(--muted); }
  .note { color:var(--muted); font-size:12px; }
  .banner { padding:8px 24px; font-size:12.5px; flex-shrink:0; border-bottom:1px solid var(--border); }
  .banner.warn { background:color-mix(in srgb, var(--warn) 14%, var(--panel)); }
  .banner.lock { background:color-mix(in srgb, var(--ok) 14%, var(--panel)); }
  main { padding:14px 24px; flex:1; min-height:0; overflow:auto; display:flex; flex-direction:column; gap:12px; }
  .cards { display:grid; grid-template-columns:repeat(auto-fit, minmax(200px, 1fr)); gap:10px; }
  .card { background:var(--panel); border:1px solid var(--border); border-radius:10px; padding:10px 14px; }
  .card .lab { font-size:12px; color:var(--muted); }
  .card .val { font-size:20px; font-weight:600; margin-top:2px; }
  .card .sub { font-size:11.5px; color:var(--muted); margin-top:2px; }
  .filters { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  .scrollx { overflow:auto; border:1px solid var(--border); border-radius:10px; background:var(--panel); flex:1; min-height:0; }
  table { border-collapse:collapse; white-space:nowrap; font-size:13px; width:100%; }
  th, td { padding:7px 9px; text-align:left; border-bottom:1px solid var(--border); }
  thead th { color:var(--muted); font-weight:600; position:sticky; top:0; z-index:2; background:var(--panel); }
  td.num, th.num { text-align:right; font-variant-numeric:tabular-nums; }
  tbody tr.row { cursor:pointer; }
  tbody tr.row:hover td { background:color-mix(in srgb, var(--accent) 6%, var(--panel)); }
  .dept-sep td { background:color-mix(in srgb, var(--accent) 8%, var(--panel)); font-weight:600; color:var(--accent); cursor:default; }
  select.rank { padding:3px 6px; font-weight:600; }
  select.rank.jump { background:color-mix(in srgb, var(--warn) 22%, var(--panel)); }
  .diff { color:var(--warn); }
  .reason { font-size:11px; color:var(--muted); }
  .pill { display:inline-block; padding:2px 10px; border-radius:999px; font-size:12px; font-weight:600; border:1px solid var(--border); background:var(--panel); color:var(--muted); cursor:pointer; }
  .pill.on { background:color-mix(in srgb, var(--ok) 18%, var(--panel)); color:var(--ok); border-color:transparent; }
  /* ポップアップ */
  #pop { position:fixed; inset:0; background:rgba(0,0,0,.35); display:flex; align-items:flex-start; justify-content:center; padding:40px 16px; overflow:auto; z-index:50; }
  #pop .box { background:var(--panel); border-radius:12px; width:min(860px, 100%); padding:18px 22px; }
  #pop h2 { font-size:16px; margin:0; }
  #pop h3 { font-size:13px; color:var(--muted); margin:16px 0 6px; font-weight:600; }
  .kv { display:grid; grid-template-columns:repeat(auto-fit, minmax(180px, 1fr)); gap:4px 16px; font-size:13px; }
  .formula { font-size:13px; line-height:1.9; }
  .formula b { font-weight:600; }
  .small-table td, .small-table th { padding:4px 8px; font-size:12.5px; }
  /* ポップアップの中の表は見出しを固定しない（一覧の固定がかかって見出しが消えていた） */
  #pop thead th { position:static; color:var(--muted); background:transparent; font-weight:600; border-bottom:1px solid var(--border); }
  .small-table tr.strong td { font-weight:600; }
  .small-table td.hit { color:var(--warn); font-weight:600; }
  .comment { margin-top:8px; font-size:13px; line-height:1.7; }
  .decide { display:grid; grid-template-columns:repeat(5, minmax(0, 1fr)) auto; gap:10px; margin-top:14px; padding:12px 14px; border-radius:10px;
    background:color-mix(in srgb, var(--accent) 5%, var(--panel)); align-items:start; }
  .decide .lab { font-size:11.5px; color:var(--muted); margin-bottom:4px; }
  .decide .big { font-size:17px; font-weight:600; font-variant-numeric:tabular-nums; }
  select.big-select { font-size:15px; padding:5px 8px; }
  .big-pill { font-size:13px; padding:4px 14px; }
  @media (max-width:720px) { .decide { grid-template-columns:repeat(3, minmax(0, 1fr)); } }
  select.rank.changed { border:2px solid var(--accent); color:var(--accent); }
  th.sortable { cursor:pointer; user-select:none; }
  th.sortable:hover, th.sorted { color:var(--accent); }
  button:disabled { opacity:.4; cursor:default; }
  td.sub { color:var(--muted); font-size:12px; }
  .legend { display:flex; gap:16px; flex-wrap:wrap; font-size:12px; color:var(--muted); align-items:center; }
  .legend .sw { display:inline-block; width:14px; height:14px; border-radius:4px; vertical-align:-2px; margin-right:5px; }
  .sw-changed { border:2px solid var(--accent); }
  .sw-jump { background:color-mix(in srgb, var(--warn) 22%, var(--panel)); }
  .sw-diff { background:var(--warn); }
  .dept-sep .sum { float:right; font-weight:500; color:var(--muted); font-size:12px; }
  .okbtn { font-weight:600; padding:6px 14px; }
  .okbtn.on { background:color-mix(in srgb, var(--ok) 16%, var(--panel)); color:var(--ok); border-color:transparent; }
  .lockmsg { margin-top:10px; padding:8px 12px; border-radius:8px; font-size:12.5px; background:color-mix(in srgb, var(--ok) 12%, var(--panel)); }
  .decide-actions { display:flex; flex-direction:column; gap:6px; align-items:stretch; }
  .decide-actions button { white-space:nowrap; }
  textarea { width:100%; min-height:60px; font:inherit; font-size:13px; padding:8px; border-radius:6px; border:1px solid var(--border); }
  /* 設定 */
  .set-grid { display:grid; grid-template-columns:repeat(auto-fit, minmax(240px, 1fr)); gap:12px; }
  .set-grid label { display:flex; flex-direction:column; gap:4px; font-size:12.5px; color:var(--muted); }
  .set-grid input, .set-grid select { width:100%; }
  .set-section { background:var(--panel); border:1px solid var(--border); border-radius:10px; padding:14px 16px; }
  .set-section h2 { font-size:14px; margin:0 0 10px; }
  #gate { padding:80px 24px; text-align:center; overflow:auto; flex:1; min-height:0; }
  #gate .btn { padding:10px 22px; border-color:var(--accent); background:var(--accent); color:#fff; }
  #gateError { color:var(--bad); margin-top:14px; font-size:13px; white-space:pre-wrap; }
  #toast { position:fixed; right:20px; bottom:20px; background:var(--text); color:#fff; padding:8px 14px; border-radius:8px; font-size:13px; z-index:60; }
  .hide { display:none !important; }
</style>

<script src="payroll_graph.js?v=20261004"></script>
<script>
"use strict";
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const yen = v => Math.round(v).toLocaleString('ja-JP');
const DEMO = new URLSearchParams(location.search).get('demo') === '1';   // 架空の見本データで画面を確かめる（サインイン不要・保存しない）

/* ---------------- 計算（scripts/bonus_calc.py と同じ式。数字はすべて設定から） ---------------- */
function rnd(x, mode, places) {
  const p = Math.pow(10, places || 0);
  const v = Math.round(x * p * 1e6) / 1e6;    // 小数の誤差を消してから丸める
  if (mode === '切り上げ') return Math.sign(v) * Math.ceil(Math.abs(v)) / p;
  if (mode === '切り捨て') return Math.sign(v) * Math.floor(Math.abs(v)) / p;
  return Math.sign(v) * Math.floor(Math.abs(v) + 0.5) / p;
}
function rankRates(s) {
  const a = s['賞与月数'] * s['考課の割合'] * s['A倍率'];
  const out = {};
  RANKS.forEach((r, i) => {
    out[r] = i === 0 ? a : r === 'E' ? 0 : rnd(a - a * s['1段の下げ幅'] * i, '切り上げ', s['ランク率の桁']);
  });
  return out;
}
function calc(p, rank, s) {
  const fixM = s['賞与月数'] * (1 - s['考課の割合']);
  const rr = rankRates(s);
  const fix = rnd(p.基準内 * fixM, s['固定分の端数']);
  const kouka = rank in rr ? rnd(p.基準内 * rr[rank], s['考課分の端数']) : 0;
  const hyoka = fix + kouka;
  const base = { '固定分': fix, '評価額': hyoka, '基準内': p.基準内 }[s['減額の元']];
  const lateDays = Math.floor(p.遅早回数 / s['遅早何回で1日']);
  const days = lateDays + p.欠勤日数;
  const genka = days * base / s['減額の除数'];
  const sashi = hyoka - genka;
  const hiwari = p.支給率 < 1 ? rnd(sashi * (1 - p.支給率) * -1, s['日割りの端数']) : 0;
  const raw = sashi + hiwari;
  return { fixM, rate: rr[rank], fix, kouka, hyoka, lateDays, days, base, genka, sashi, hiwari, raw, pay: rnd(raw, s['支給額の端数']) };
}

/* ---------------- データ ---------------- */
let RANKS = [], DATA = null, SET = null, DEC = null, SEASON = '', ROLE = '閲覧', ME = '';
const etag = {};
const ROOT = '賞与/';
const emptyDec = () => ({ ランク: {}, OK: {}, 社長コメント: {}, 履歴: [], FIX: null });

async function driveItem(rel) {
  const id = await payrollDriveId();
  return graphGet('/drives/' + id + '/root:/給与データ/' + encodeURI(rel), { allow404: true });
}
async function readWithTag(rel) {
  if (DEMO) return null;
  const meta = await driveItem(rel);
  if (!meta) { etag[rel] = null; return null; }
  etag[rel] = meta.eTag;
  return payrollGetFile(rel);
}
/** 別の人が先に保存していたら（412）止める。上書きで相手の変更を消さないため */
async function writeWithTag(rel, obj) {
  if (DEMO) return;
  const id = await payrollDriveId();
  const token = await payrollGetToken();
  const headers = { Authorization: 'Bearer ' + token, 'Content-Type': 'application/json' };
  if (etag[rel]) headers['If-Match'] = etag[rel];
  const res = await fetch(GRAPH_BASE + '/drives/' + id + '/root:/給与データ/' + encodeURI(rel) + ':/content',
    { method: 'PUT', headers, body: JSON.stringify(obj, null, 1) });
  if (res.status === 412) { const e = new Error('conflict'); e.conflict = true; throw e; }
  if (res.status === 403) throw new Error('書き込み権がありません。');
  if (!res.ok) throw new Error('[' + res.status + '] 保存できませんでした');
  etag[rel] = (await res.json()).eTag;
}

/** 決定（ランク・OK・コメント）の変更は1件ずつ保存。ぶつかったら最新を読み直して、その1件だけ当て直す */
async function saveDecision(apply, logItem) {
  apply(DEC);
  if (logItem) DEC.履歴.push(Object.assign({ 日時: new Date().toISOString(), 誰: ME }, logItem));
  render();
  const rel = ROOT + SEASON + '/決定.json';
  for (let i = 0; i < 3; i++) {
    try { await writeWithTag(rel, DEC); toast('保存しました'); return; }
    catch (e) {
      if (!e.conflict) { toast('保存できませんでした：' + e.message); return; }
      DEC = (await readWithTag(rel)) || emptyDec();
      apply(DEC);
      if (logItem) DEC.履歴.push(Object.assign({ 日時: new Date().toISOString(), 誰: ME }, logItem));
      render();
    }
  }
  toast('ほかの人の保存と重なりました。画面を開き直してください');
}

function canEditRank() { return !DEC.FIX && (ROLE === '社長' || ROLE === '管理者'); }
function isAdmin() { return ROLE === '管理者'; }

function rankOf(p) { return DEC.ランク[p.社員番号] || p.部門評価 || ''; }
function prevRank(p) { return (p.ランク履歴 && p.ランク履歴[0] && p.ランク履歴[0].ランク) || ''; }
function jump(p) {
  const a = RANKS.indexOf(prevRank(p)), b = RANKS.indexOf(rankOf(p));
  return a >= 0 && b >= 0 && Math.abs(a - b) >= 2;
}
/** 一覧に出す短い理由（詳しくはポップアップ） */
function reasonOf(p, r) {
  const a = [];
  if (r.days) a.push('欠勤' + r.days + '日');
  if (p.支給率 < 1) {
    const kind = /休職/.test(p.支給率の理由 || '') ? '休職' : /試用/.test(p.支給率の理由 || '') ? '試用明け' : '日割り';
    a.push(kind + ' ' + Math.round(p.支給率 * 100) + '%');
  }
  return a.join('・');
}
/** 詳しい理由（ポップアップ） */
function reasonLong(p, r) {
  const a = [];
  if (r.days) a.push('欠勤' + r.days + '日' + (r.lateDays ? '（遅早' + p.遅早回数 + '回を含む）' : ''));
  if (p.支給率 < 1) a.push(p.支給率の理由 || ('日割り ' + p.支給率));
  return a.join('・');
}

/* ---------------- 一覧 ---------------- */
let siteFilter = '';
let sortKey = '部署', sortDir = 1;   // 見出しを押すと並べ替え。「部署」のときだけ部署ごとの見出しを出す
const SITE_ORDER = { '本社': 0, '工場': 1 };
const rankIdx = r => { const i = RANKS.indexOf(r); return i < 0 ? 99 : i; };   // A が先、ランクなしは最後
const gradeNum = g => { const m = /(\d)-(\d)/.exec(g || ''); return m ? Number(m[1]) * 10 + Number(m[2]) : 0; };
function sorted(rows) {
  const val = {
    '氏名': p => p.氏名,
    '決定ランク': p => rankIdx(rankOf(p)),
    '部門評価': p => rankIdx(p.部門評価),
    '前回': p => rankIdx(prevRank(p)),
    '等級': p => -gradeNum(p.等級),   // 等級の高い順
    '年齢': p => -(Number(p.年齢) || 0),   // 年上が先
    '勤続': p => p.入社日 || '9999',   // 勤続の長い順（入社日の古い順）
    'OK': p => (DEC.OK[p.社員番号] ? 1 : 0),   // 未確認が先
    '評価額': p => calc(p, rankOf(p), SET).hyoka,
    '支給額': p => calc(p, rankOf(p), SET).pay,
  }[sortKey];
  // 部署順：拠点 → 部署 → 等級の高い順 → 社員番号（ほかの列で並べたときも、同じ値の中はこの順）
  const deptCmp = (a, b) => (SITE_ORDER[a.拠点] ?? 9) - (SITE_ORDER[b.拠点] ?? 9) || String(a.部署).localeCompare(String(b.部署), 'ja')
    || gradeNum(b.等級) - gradeNum(a.等級) || Number(a.社員番号) - Number(b.社員番号);
  return rows.slice().sort((a, b) => {
    if (!val) return deptCmp(a, b);
    const x = val(a), y = val(b);
    return (typeof x === 'string' ? x.localeCompare(y, 'ja') : x - y) * sortDir || deptCmp(a, b);
  });
}
function filtered() {
  const dept = $('#deptSel').value, q = $('#nameSearch').value.trim(), only = $('#onlyNotOk').checked;
  return sorted(DATA.対象者.filter(p =>
    (!siteFilter || p.拠点 === siteFilter) && (!dept || p.部署 === dept) &&
    (!q || p.氏名.replace(/\s/g, '').includes(q.replace(/\s/g, ''))) && (!only || !DEC.OK[p.社員番号])));
}
function render() {
  if (!DATA) return;
  let total = 0, totalH = 0, ok = 0;
  const dist = {};
  DATA.対象者.forEach(p => {
    const r = calc(p, rankOf(p), SET);
    total += r.pay; totalH += r.hyoka;
    const k = rankOf(p) || '未';
    dist[k] = (dist[k] || 0) + 1;
    if (DEC.OK[p.社員番号]) ok++;
  });
  $('#cTotal').textContent = yen(total) + '円';
  $('#cTotal2').textContent = '評価額の合計 ' + yen(totalH) + '円｜社保込みの見込み 約' + yen(total * 1.15 / 10000) + '万円';
  $('#cDist').textContent = RANKS.concat(['未']).filter(r => dist[r]).map(r => r + ' ' + dist[r]).join('・');
  $('#cOk').textContent = ok + ' / ' + DATA.対象者.length + '人';

  const rows = filtered();
  const edit = canEditRank();
  const th = (key, lab, cls) => `<th class="sortable ${cls || ''} ${sortKey === key ? 'sorted' : ''}" data-sort="${key}">${lab}${sortKey === key && key !== '部署' ? (sortDir > 0 ? ' ▲' : ' ▼') : ''}</th>`;
  let html = '<thead><tr>' + th('氏名', '氏名') + th('部署', '部署') + th('等級', '等級') + th('年齢', '年齢', 'num') + th('勤続', '勤続', 'num') + th('部門評価', '部門評価') + th('前回', '前回')
    + th('決定ランク', '決定ランク') + th('評価額', '評価額', 'num') + th('支給額', '支給額', 'num') + th('OK', 'OK') + '</tr></thead><tbody>';
  let curDept = null;
  const sums = {};
  rows.forEach(p => {
    const r = calc(p, rankOf(p), SET), k = p.拠点 + p.部署;

  });
  rows.forEach(p => {
    if (sortKey === '部署' && p.拠点 + p.部署 !== curDept) {
      curDept = p.拠点 + p.部署;

      html += `<tr class="dept-sep"><td colspan="11">${esc(p.拠点)}｜${esc(p.部署)}<span class="sum">${s.n}人　評価額 ${yen(s.h)}　支給額 ${yen(s.pay)}</span></td></tr>`;
    }

    const opts = ['<option value="">—</option>'].concat(RANKS.map(x => `<option ${x === rk ? 'selected' : ''}>${x}</option>`)).join('');
    const changed = DEC.ランク[p.社員番号] && DEC.ランク[p.社員番号] !== p.部門評価;
    const tip = (changed ? '部門評価 ' + (p.部門評価 || '—') + ' から変更' : '') + (jump(p) ? '（前回から2段以上）' : '');
    html += `<tr class="row" data-code="${esc(p.社員番号)}">
      <td>${esc(p.氏名)}</td><td>${esc(p.部署)}</td><td>${esc(gradeLabel(p.等級))}</td>
      <td class="num sub">${esc(p.年齢 || '')}</td><td class="num sub">${esc(tenureShort(p.勤続))}</td>
      <td>${esc(p.部門評価 || '—')}</td><td>${esc(prevRank(p) || '—')}</td>
      <td><select class="rank ${changed ? 'changed' : ''} ${jump(p) ? 'jump' : ''}" data-rank="${esc(p.社員番号)}" ${edit ? '' : 'disabled'} aria-label="決定ランク" title="${esc(tip)}">${opts}</select></td>
      <td class="num">${yen(r.hyoka)}</td>
      <td class="num ${r.pay !== r.hyoka ? 'diff' : ''}">${yen(r.pay)}${why ? `<div class="reason">${esc(why)}</div>` : ''}</td>
      <td><span class="pill ${DEC.OK[p.社員番号] ? 'on' : ''}" data-ok="${esc(p.社員番号)}">${DEC.OK[p.社員番号] ? 'OK' : '未'}</span></td></tr>`;
  });
  $('#listTable').innerHTML = html + '</tbody>';
  renderBanners();
  if (POP) openPop(POP, true);   // 開いているポップアップも新しい数字に
}

function renderBanners() {
  const fb = $('#fixBanner');
  if (DEC.FIX) { fb.textContent = `FIX 済み（${fmtDate(DEC.FIX.日時)}・${shortName(DEC.FIX.誰)}）。ランクと計算ルールは変えられません。`; fb.classList.remove('hide'); }
  else fb.classList.add('hide');
  const diff = Object.keys(DATA.初期設定).filter(k => String(DATA.初期設定[k]) !== String(SET[k]));
  const rb = $('#ruleBanner');
  if (diff.length) { rb.textContent = '計算ルールが最初の設定から変わっています：' + diff.map(k => `${k} ${DATA.初期設定[k]}→${SET[k]}`).join('、'); rb.classList.remove('hide'); }
  else rb.classList.add('hide');
  const fixBtn = $('#fixBtn');
  fixBtn.classList.toggle('hide', !isAdmin());
  fixBtn.textContent = DEC.FIX ? 'FIX を外す' : 'FIX（確定）';
}
const fmtDate = s => s ? new Date(s).toLocaleString('ja-JP', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' }) : '';
const shortName = s => String(s || '').split('@')[0];   // メールアドレスは @ の前だけ出す
/** 等級は辞令と同じ書き方で出す（データの「MGR1-2」→「R1-2」。専門・専任はそのまま。データは変えない） */
/** 勤続は一覧では「41年」のように年だけ（詳しくはポップアップ） */
const tenureShort = t => { const m = /(\d+)年/.exec(t || ''); return m ? m[1] + '年' : ''; };
const gradeLabel = g => String(g || '').replace(/^MGR/, 'R');

/* 決定ランク・OK の変更（一覧とポップアップで共通） */
function setRank(code, after) {
  const p = DATA.対象者.find(x => x.社員番号 === code);
  const before = rankOf(p);
  if (before === after) return;
  saveDecision(d => { if (after === p.部門評価 || !after) delete d.ランク[code]; else d.ランク[code] = after; },
    { 社員番号: code, 項目: '決定ランク', 前: before, 後: after });
}
function toggleOk(code) {
  if (ROLE === '閲覧') { toast('OK を付けられるのは社長と管理者です'); return; }
  if (DEC.FIX) { toast('FIX 済みのため変えられません'); return; }
  const on = !DEC.OK[code];
  saveDecision(d => { if (on) d.OK[code] = { 誰: ME, 日時: new Date().toISOString() }; else delete d.OK[code]; },
    { 社員番号: code, 項目: 'OK', 前: on ? '未' : 'OK', 後: on ? 'OK' : '未' });
}

$('#listTable').addEventListener('change', e => { if (e.target.dataset.rank) setRank(e.target.dataset.rank, e.target.value); });
$('#listTable').addEventListener('click', e => {
  const s = e.target.closest('[data-sort]');
  if (s) {
    if (sortKey === s.dataset.sort && s.dataset.sort !== '部署') sortDir = -sortDir;
    else { sortKey = s.dataset.sort; sortDir = s.dataset.sort === '評価額' || s.dataset.sort === '支給額' ? -1 : 1; }
    render(); return;
  }
  if (e.target.dataset.ok) { toggleOk(e.target.dataset.ok); return; }
  if (e.target.closest('select')) return;
  const tr = e.target.closest('tr.row');
  if (tr) openPop(tr.dataset.code);
});

/** 書きかけのコメントを保存する（保存ボタンを押さずに次へ進んでも消えないように） */
function saveCommentIfChanged(force) {
  const box = $('#popComment');
  if (!POP || !box || box.disabled) return;
  const code = POP, txt = box.value.trim(), before = (DEC.社長コメント[code] || '').trim();
  if (txt === before && !force) return;
  if (txt === before) { toast('変更はありません'); return; }
  saveDecision(d => { if (txt) d.社長コメント[code] = txt; else delete d.社長コメント[code]; },
    { 社員番号: code, 項目: '社長コメント', 前: before ? '（あり）' : '', 後: txt ? '（更新）' : '（削除）' });
}
function movePop(step, saved) {
  if (!saved) saveCommentIfChanged();
  const list = filtered(), i = list.findIndex(x => x.社員番号 === POP);
  const n = list[i + step];
  if (n) openPop(n.社員番号);
}
/** 給与の「6月分」は 5/16〜6/15 の勤怠（締めは15日） */
function monthNote(ym) {
  if (!ym) return '';
  const m = Number(ym.slice(5)), prev = m === 1 ? 12 : m - 1;
  return `「${m}月分」は ${prev}/16〜${m}/15 の勤怠です（給与の締めと同じ）。`;
}
function closePop() { saveCommentIfChanged(); $('#pop').classList.add('hide'); POP = null; }
function lastChange(code) {
  const l = DEC.履歴.filter(x => x.社員番号 === code).slice(-1)[0];
  return l ? `最終更新：${shortName(l.誰)}（${fmtDate(l.日時)}）${l.項目} ${l.前 || ''}→${l.後 || ''}` : '';
}
document.addEventListener('keydown', e => {
  if (!POP) return;
  if (e.key === 'Escape') { closePop(); return; }
  if (/^(TEXTAREA|SELECT|INPUT)$/.test(document.activeElement && document.activeElement.tagName)) return;
  if (e.key === 'ArrowLeft') movePop(-1);
  if (e.key === 'ArrowRight') movePop(1);
});

async function saveSettings() {
  SET._更新 = { 誰: ME, 日時: new Date().toISOString() };
  try { await writeWithTag(ROOT + SEASON + '/設定.json', SET); toast('計算ルールを保存しました'); }
  catch (e) { toast(e.conflict ? 'ほかの人が先にルールを保存しました。画面を開き直してください' : '保存できませんでした：' + e.message); }
  renderSettings();
}

/* ---------------- 対象外・確認 ---------------- */
function renderExcluded() {
  const errs = DATA.考課の読み取りエラー || [];
  const noKouka = DATA.対象者.filter(p => !p.部門評価);
  $('#vExcluded').innerHTML = `
  <div class="set-section"><h2>考課表から読み取れなかったもの（${errs.length}件）</h2>
    ${errs.length ? `<table class="small-table"><thead><tr><th>ファイル</th><th>シート</th><th>理由</th></tr></thead><tbody>${errs.map(e => `<tr><td>${esc(e.ファイル)}</td><td>${esc(e.シート)}</td><td>${esc(e.理由)}</td></tr>`).join('')}</tbody></table>` : '<div class="note">なし</div>'}
    <div class="note" style="margin-top:6px">部門評価がない人（${noKouka.length}人）：${esc(noKouka.map(p => p.氏名).join('、') || 'なし')}。一覧の「決定ランク」で直接選べます。</div></div>
  <div class="set-section"><h2>対象外（${DATA.対象外.length}人）</h2>
    <table class="small-table"><thead><tr><th>社員番号</th><th>氏名</th><th>拠点</th><th>部署</th><th>理由</th></tr></thead><tbody>
    ${DATA.対象外.map(o => `<tr><td>${esc(o.社員番号)}</td><td>${esc(o.氏名)}</td><td>${esc(o.拠点)}</td><td>${esc(o.部署 || '')}</td><td>${esc(o.理由)}</td></tr>`).join('')}</tbody></table></div>
  <div class="set-section"><h2>変更の記録（新しい順）</h2>
    <table class="small-table"><thead><tr><th>日時</th><th>誰</th><th>社員</th><th>項目</th><th>前</th><th>後</th></tr></thead><tbody>
    ${DEC.履歴.slice().reverse().slice(0, 300).map(l => `<tr><td>${fmtDate(l.日時)}</td><td>${esc(shortName(l.誰))}</td><td>${esc(nameOf(l.社員番号))}</td><td>${esc(l.項目)}</td><td>${esc(l.前)}</td><td>${esc(l.後)}</td></tr>`).join('')}</tbody></table></div>`;
}
const nameOf = c => (DATA.対象者.find(p => p.社員番号 === c) || { 氏名: c || '' }).氏名;

/* ---------------- 出力・FIX ---------------- */
$('#csvBtn').onclick = () => {
  const head = ['社員番号', '氏名', '拠点', '部署', '等級', '決定ランク', '基準内', '固定分', '考課分', '評価額', '欠勤減額日数', '欠勤減額', '支給率', '支給額', '社長OK'];
  const lines = [head].concat(DATA.対象者.map(p => {
    const rk = rankOf(p), r = calc(p, rk, SET);
    return [p.社員番号, p.氏名, p.拠点, p.部署, p.等級, rk, p.基準内, r.fix, r.kouka, r.hyoka, r.days, Math.round(r.genka), p.支給率, r.pay, DEC.OK[p.社員番号] ? 'OK' : ''];
  }));
  const csv = '﻿' + lines.map(l => l.map(v => /[",\n]/.test(String(v)) ? '"' + String(v).replace(/"/g, '""') + '"' : v).join(',')).join('\r\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv' }));
  a.download = `賞与_${SEASON}_${DEC.FIX ? '確定' : '途中'}.csv`;
  a.click();
  if (typeof UsageLog !== 'undefined' && UsageLog.log) UsageLog.log('賞与CSV', DEC.FIX ? '確定' : '途中');
};
$('#fixBtn').onclick = () => {
  if (!isAdmin()) return;
  if (DEC.FIX) {
    if (!confirm('FIX を外して、ランクとルールを変えられる状態に戻しますか？')) return;
    saveDecision(d => { d.FIX = null; }, { 社員番号: '', 項目: 'FIX', 前: 'FIX', 後: '解除' });
  } else {
    const notOk = DATA.対象者.filter(p => !DEC.OK[p.社員番号]).length;
    if (!confirm((notOk ? `社長OKが付いていない人が ${notOk}人 います。\n` : '') + 'この内容で FIX（確定）しますか？計算ルールも一緒に記録します。')) return;
    saveDecision(d => { d.FIX = { 誰: ME, 日時: new Date().toISOString(), 計算ルール: Object.assign({}, SET) }; }, { 社員番号: '', 項目: 'FIX', 前: '', 後: 'FIX' });
  }
};

/* ---------------- 画面の切り替え ---------------- */
document.querySelectorAll('header .tab-btn').forEach(b => b.addEventListener('click', () => {
  document.querySelectorAll('header .tab-btn').forEach(x => x.classList.toggle('active', x === b));
  $('#vList').classList.toggle('hide', b.dataset.view !== 'list');
  $('#vSettings').classList.toggle('hide', b.dataset.view !== 'settings');
  $('#vExcluded').classList.toggle('hide', b.dataset.view !== 'excluded');
  if (b.dataset.view === 'settings') renderSettings();
  if (b.dataset.view === 'excluded') renderExcluded();
}));
$('#siteTabs').addEventListener('click', e => {
  const b = e.target.closest('[data-site]');
  if (!b) return;
  siteFilter = b.dataset.site;
  $('#siteTabs').querySelectorAll('.tab-btn').forEach(x => x.classList.toggle('active', x === b));
  fillDepts(); render();
});
function fillDepts() {
  const ds = [...new Set(DATA.対象者.filter(p => !siteFilter || p.拠点 === siteFilter).map(p => p.部署))];
  $('#deptSel').innerHTML = '<option value="">すべての部署</option>' + ds.map(d => `<option>${esc(d)}</option>`).join('');
}
['#deptSel', '#nameSearch', '#onlyNotOk'].forEach(s => $(s).addEventListener('input', render));

let toastTimer;
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.remove('hide'); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.add('hide'), 2500); }

/* ---------------- 読み込み ---------------- */
async function seasons() {
  if (DEMO) return ['見本'];
  const id = await payrollDriveId();
  const r = await graphGet('/drives/' + id + '/root:/給与データ/' + encodeURI('賞与') + ':/children', { allow404: true });
  /* 新しい回を上に。同じ年は 冬（12月）を 夏（6月）より上にする */
  const key = n => { const m = /^(\d{4})(夏|冬)/.exec(n); return m ? Number(m[1]) * 10 + (m[2] === '冬' ? 2 : 1) : 0; };
  return r ? r.value.filter(x => x.folder).map(x => x.name).sort((a, b) => key(b) - key(a) || b.localeCompare(a)) : [];
}
async function loadSeason(name) {
  SEASON = name;
  if (DEMO) {
    DATA = await (await fetch('sample/bonus_demo.json')).json();
    SET = Object.assign({}, DATA.初期設定); DEC = emptyDec();
  } else {
    DATA = await readWithTag(ROOT + name + '/対象者.json');
    if (!DATA) throw new Error('「給与データ/賞与/' + name + '/対象者.json」がありません。');
    SET = (await readWithTag(ROOT + name + '/設定.json')) || Object.assign({}, DATA.初期設定);
    DEC = (await readWithTag(ROOT + name + '/決定.json')) || emptyDec();
  }
  RANKS = DATA.ランク;
  const roles = DATA.権限 || {};
  ROLE = DEMO ? (new URLSearchParams(location.search).get('role') || '管理者')
    : (Object.keys(roles).length ? (roles[ME.toLowerCase()] || '閲覧') : '管理者');
  $('#whoami').textContent = (DEMO ? '見本データ（保存しません）｜' : '') + (ME ? shortName(ME) + '｜' : '') + ROLE + (Object.keys(roles).length || DEMO ? '' : '（権限が未設定のため全員が管理者）');
  fillDepts(); render();
}
async function loadDataAndShow() {
  $('#gateMsg').textContent = '読み込み中…';
  $('#signInBtn').disabled = true;
  ME = DEMO ? 'demo@example.com' : String((_account && _account.username) || '');
  const list = await seasons();
  if (!list.length) throw new Error('「給与データ/賞与」に賞与の回のフォルダがありません。');
  const want = new URLSearchParams(location.search).get('season');
  $('#seasonSel').innerHTML = list.map(s => `<option ${s === want ? 'selected' : ''}>${esc(s)}</option>`).join('');
  $('#seasonSel').onchange = () => loadSeason($('#seasonSel').value).catch(showGateError);
  await loadSeason(want && list.includes(want) ? want : list[0]);
  $('#gateError').textContent = '';
  $('#gate').classList.add('hide');
  $('#appRoot').classList.remove('hide');
}
function showGateError(e) {
  $('#gateError').textContent = e.message || String(e);
  $('#gateMsg').textContent = '役員・総務幹部限定のデータです。Microsoftアカウントでサインインしてください。';
  $('#signInBtn').disabled = false;
}
async function boot() {
  if (DEMO) { try { await loadDataAndShow(); } catch (e) { showGateError(e); } return; }
  const signedIn = await payrollInitAuth();
  if (signedIn) { try { await loadDataAndShow(); } catch (e) { showGateError(e); } }
}
$('#signInBtn').addEventListener('click', async () => {
  $('#gateError').textContent = '';
  try { await payrollSignIn(); await loadDataAndShow(); } catch (e) { showGateError(e); }
});
boot();
</script>

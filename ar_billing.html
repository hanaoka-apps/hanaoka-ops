<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>請求・入金・違算 — 花岡車輌</title>
<link rel="icon" type="image/svg+xml" href="favicon_billing.svg"><!-- レシート（請求書） -->
<script src="https://cdn.jsdelivr.net/npm/@azure/msal-browser@3.10.0/lib/msal-browser.min.js" crossorigin="anonymous"></script>
<script src="hanaoka_auth.js"></script>
<script src="ar_billing_core.js?v=20261009b"></script>
<link rel="stylesheet" href="hanaoka_theme.css?v=20261004"><!-- 色・フォントは共通ファイル -->
<style>
  /* 色・角丸・影・フォントは hanaoka_theme.css（全アプリ共通）のトークンだけを使う。ここに色の値は書かない */
  :root{
    --navy-hi:#3b3fd0;                                         /* 紺マークのグラデーション終点（テーマの .hx-mark と同じ） */
    --glow:0 4px 12px rgba(35,38,143,.25);
    --green-ink:color-mix(in srgb,var(--green) 70%,black);
    --red-ink:color-mix(in srgb,var(--red) 75%,black);
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;font-family:var(--font);background:var(--bg);color:var(--txt);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
  .num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
  .mono{font-family:"Consolas",monospace}
  .muted{color:var(--sub)}
  .nowrap{white-space:nowrap}

  /* ---- ログイン画面 ---- */
  #loginScreen{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:100}
  .login-card{background:var(--surface);border-radius:16px;padding:40px 44px;width:380px;max-width:90vw;box-shadow:var(--shadow);text-align:center}
  .login-card .logo{width:54px;height:54px;border-radius:12px;margin:0 auto 16px;color:#fff;
    background:linear-gradient(135deg,var(--navy),var(--navy-hi));box-shadow:var(--glow);display:flex;align-items:center;justify-content:center}
  .login-card .logo svg{width:28px;height:28px}
  .login-card h1{font-size:19px;margin:0 0 4px;color:var(--navy);font-weight:800}
  .login-card p{color:var(--sub);font-size:13px;margin:0 0 24px}
  .login-card button{width:100%;padding:12px;border:none;border-radius:10px;cursor:pointer;background:var(--navy);color:#fff;font-size:15px;font-weight:700;font-family:inherit}
  .login-card button:hover{background:var(--navy-deep)}
  #loginError{display:none;margin-top:16px;color:var(--red-ink);font-size:13px;background:var(--red-soft);border-radius:8px;padding:10px}
  .login-foot{margin-top:20px;font-size:11px;color:var(--sub);line-height:1.6}

  /* ---- 枠 ---- */
  #app{display:none;flex-direction:column;height:100vh}
  header{background:var(--surface);border-bottom:1px solid var(--line);padding:0 16px;height:52px;display:flex;align-items:center;gap:14px;flex-shrink:0}
  header h1{font-size:15px;margin:0;font-weight:800;white-space:nowrap;display:flex;align-items:center;gap:9px}
  header h1 .dot{width:26px;height:26px;border-radius:7px;color:#fff;display:inline-flex;align-items:center;justify-content:center;
    background:linear-gradient(135deg,var(--navy),var(--navy-hi));box-shadow:0 3px 8px rgba(35,38,143,.25)}
  header h1 .dot svg{width:15px;height:15px}
  .hub-home{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border:1px solid var(--line-strong);border-radius:7px;background:var(--surface);color:var(--navy);font-size:12px;font-weight:700;text-decoration:none;white-space:nowrap;flex-shrink:0}
  .hub-home:hover{background:var(--navy-soft)}
  .hub-home svg{width:15px;height:15px}
  .tabs{display:flex;gap:6px}
  .tab{border:1px solid var(--line-strong);background:var(--surface);border-radius:999px;padding:5px 18px;cursor:pointer;font-size:13px;font-weight:600;color:var(--sub);white-space:nowrap;font-family:inherit}
  .tab:not(.active):hover{background:var(--bg);color:var(--txt)}
  .tab.active{background:var(--navy);color:#fff;border-color:var(--navy);font-weight:700;box-shadow:var(--glow)}
  .tab .cnt{display:inline-block;margin-left:6px;font-size:11px;padding:0 7px;border-radius:999px;background:var(--red);color:#fff}
  .grow{flex:1}
  .hdr-actions{display:flex;align-items:center;gap:10px}
  .userchip{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--sub)}
  .avatar{width:26px;height:26px;border-radius:50%;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px}
  .btn{border:1px solid var(--line-strong);background:var(--surface);border-radius:8px;padding:5px 11px;cursor:pointer;font-size:12px;font-weight:600;color:var(--txt);font-family:inherit;white-space:nowrap}
  .btn:hover{background:var(--bg)}
  .btn.pri{background:var(--navy);color:#fff;border-color:var(--navy)}
  .btn.pri:hover{background:var(--navy-deep)}
  .menu-btn{display:none}

  #statusBar{padding:6px 16px;font-size:12px;background:var(--surface);color:var(--sub);border-bottom:1px solid var(--line);flex-shrink:0;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  #statusBar.loading{background:var(--amber-soft);color:var(--amber)}
  #statusBar.error{background:var(--red-soft);color:var(--red-ink)}
  #statusBar .asof{margin-left:auto;display:flex;align-items:center;gap:6px;color:var(--sub)}
  #statusBar input[type=date]{border:1px solid var(--line-strong);border-radius:6px;padding:2px 6px;font-family:inherit;font-size:12px;color:var(--txt);background:var(--surface)}
  .spin{width:12px;height:12px;border:2px solid currentColor;border-top-color:transparent;border-radius:50%;animation:sp .7s linear infinite;display:inline-block}
  @keyframes sp{to{transform:rotate(360deg)}}

  main{flex:1;overflow:hidden;display:flex}
  .view{flex:1;display:none;overflow:hidden}
  .view.active{display:flex}

  /* ---- 得意先別：左の一覧 ---- */
  .list-pane{width:370px;min-width:280px;border-right:1px solid var(--line);display:flex;flex-direction:column;background:var(--surface)}
  .searchbar{padding:12px 12px 8px}
  .searchbar input{width:100%;border:1px solid var(--line-strong);border-radius:10px;padding:9px 12px;font-size:14px;outline:none;font-family:inherit;color:var(--txt);background:var(--surface)}
  input:focus,select:focus{border-color:var(--navy)!important;box-shadow:0 0 0 3px var(--navy-soft);outline:none}
  .filters{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:2px 12px 10px}
  .filters label{font-size:11px;font-weight:600;color:var(--sub);display:flex;flex-direction:column;gap:3px;min-width:0}
  select{border:1px solid var(--line-strong);border-radius:8px;padding:6px;font-size:12.5px;background:var(--surface);color:var(--txt);font-family:inherit;min-width:0;width:100%}
  .listmeta{padding:7px 14px;font-size:12px;color:var(--sub);border-top:1px solid var(--line);border-bottom:1px solid var(--line);background:var(--bg)}
  .list{flex:1;overflow-y:auto}
  .row{padding:10px 14px;border-bottom:1px solid var(--line);cursor:pointer;display:flex;gap:8px;align-items:center}
  .row:hover{background:var(--bg)}
  .row.sel{background:var(--navy-soft);box-shadow:inset 3px 0 0 var(--navy)}
  .row .rmain{flex:1;min-width:0}
  .row .code{font-family:"Consolas",monospace;color:var(--navy);font-weight:700;font-size:12px}
  .row .name{font-weight:700;margin:1px 0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .row .sub{font-size:12px;color:var(--sub);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .pill{flex-shrink:0;font-size:11.5px;font-weight:700;padding:2px 10px;border-radius:999px;white-space:nowrap;border:1px solid transparent}
  .pill.under{background:var(--red-soft);color:var(--red-ink)}
  .pill.over{background:var(--amber-soft);color:var(--amber)}
  .pill.ok{background:var(--green-soft);color:var(--green-ink)}
  .pill.wait{background:var(--navy-soft);color:var(--navy)}
  .pill.na{background:var(--bg);border-color:var(--line-strong);color:var(--sub)}

  /* ---- 得意先別：右の詳細 ---- */
  .detail-pane{flex:1;overflow-y:auto;background:var(--bg)}
  .placeholder{padding:60px 24px;text-align:center;color:var(--sub)}
  .back-btn{display:none}
  .dhead{background:var(--surface);border-bottom:1px solid var(--line);padding:18px 24px}
  .dcode{font-family:"Consolas",monospace;color:var(--navy);font-weight:700;font-size:13px}
  .dname{font-size:22px;font-weight:800;margin:2px 0 4px;line-height:1.3}
  .dname2{font-size:13px;color:var(--sub);margin-bottom:8px}
  .chips{display:flex;gap:6px;flex-wrap:wrap}
  .chip{display:inline-flex;gap:5px;align-items:baseline;background:var(--bg);border:1px solid var(--line-strong);border-radius:6px;padding:2px 10px;font-size:12px;font-weight:600}
  .chip i{font-style:normal;color:var(--sub);font-weight:500;font-size:11px}
  .chk{flex-direction:row!important;align-items:center;gap:6px!important;font-size:12.5px!important;color:var(--txt)!important;font-weight:500!important}
  .selbar{display:flex;align-items:center;gap:10px;padding:10px 16px;border-top:1px solid var(--line);background:var(--navy-soft);font-size:13px;flex-wrap:wrap}
  .selbar b{font-variant-numeric:tabular-nums}
  td.ck,th.ck{width:30px;padding-right:0}
  .form{padding:16px 20px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 16px}
  .form label{font-size:12px;font-weight:600;color:var(--sub);display:flex;flex-direction:column;gap:4px}
  .form input,.form textarea{border:1px solid var(--line-strong);border-radius:8px;padding:7px 10px;font-size:14px;font-family:inherit;color:var(--txt);background:var(--surface)}
  .form input[readonly]{background:var(--bg)}
  .form .full{grid-column:1/-1}
  .form .hint{font-size:11.5px;color:var(--sub);font-weight:500}
  .ferr{color:var(--red-ink);font-size:13px;padding:0 20px 10px}
  .fu{font-size:12px;line-height:1.5;max-width:340px}
  .fu .cause{color:var(--txt);white-space:pre-wrap}
  .fu .meta{color:var(--sub)}
  .fu .late{color:var(--red-ink);font-weight:700}
  tr.crow td{background:var(--bg);border-bottom:none;padding-top:10px}
  tr.prow td:first-child{padding-left:22px}
  .hist{padding:4px 20px 12px;font-size:12px;color:var(--sub);max-height:160px;overflow:auto}
  .hist div{padding:3px 0;border-bottom:1px dashed var(--line)}
  .hist b{color:var(--txt);font-weight:600}
  .form select{border:1px solid var(--line-strong);border-radius:8px;padding:7px 10px;font-size:14px;font-family:inherit;color:var(--txt);background:var(--surface)}
  .pill.sp{background:var(--purple-soft);color:var(--purple)}
  .tnote{margin-top:8px;font-size:12.5px;background:var(--amber-soft);color:var(--amber);border-radius:8px;padding:6px 10px;display:inline-block}
  .tnote b{font-weight:700}
  .dbody{padding:16px 24px 40px;display:flex;flex-direction:column;gap:16px}
  .cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
  .card{background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px 16px;border-top:3px solid var(--line-strong)}
  .card.under{border-top-color:var(--red)}
  .card.over{border-top-color:var(--orange)}
  .card.ok{border-top-color:var(--green)}
  .card.next{border-top-color:var(--navy)}
  .card .k{font-size:12px;color:var(--sub);font-weight:600}
  .card .v{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums;margin:2px 0}
  .card .s{font-size:12px;color:var(--sub)}
  .panel{background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
  .panel h3{font-size:14px;margin:0;padding:12px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
  .panel h3 small{font-weight:500;color:var(--sub);font-size:12px}
  .panel .note{padding:10px 16px;font-size:12px;color:var(--sub);border-top:1px solid var(--line);line-height:1.7}
  .tw{overflow-x:auto}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th{background:var(--bg);color:var(--sub);font-weight:600;font-size:11.5px;text-align:left;padding:7px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
  td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
  tr:last-child td{border-bottom:none}
  tr.click{cursor:pointer}
  tr.click:hover td{background:var(--bg)}
  tr.sub td{background:var(--bg);font-size:12px;padding:4px 10px 4px 28px;color:var(--sub)}
  tr.dim td{color:var(--sub)}
  .inv-link{color:var(--navy);font-weight:700;text-decoration:none;border-bottom:1px dashed var(--navy);cursor:pointer;white-space:nowrap}
  .neg{color:var(--red-ink)}
  .empty{padding:18px 16px;color:var(--sub);font-size:13px}

  /* ---- 請求書（SMILE の「請求明細書」画面に近い並び） ---- */
  #invModal{position:fixed;inset:0;background:rgba(22,26,61,.35);display:none;align-items:flex-start;justify-content:center;z-index:50;padding:40px 16px;overflow-y:auto}
  #invModal.show{display:flex}
  .inv{background:var(--surface);border-radius:14px;box-shadow:var(--shadow);width:1100px;max-width:100%}
  .inv-head{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap}
  .inv-head h2{margin:0;font-size:17px}
  .inv-head .meta{font-size:12.5px;color:var(--sub);margin-top:4px;display:flex;gap:14px;flex-wrap:wrap}
  .inv-tot{margin-left:auto;display:grid;grid-template-columns:auto auto;gap:2px 16px;font-size:13px}
  .inv-tot b{text-align:right;font-variant-numeric:tabular-nums}
  .inv table td{padding:6px 10px}
  .inv .sum td{background:var(--amber-soft);font-weight:700}
  .inv-foot{padding:10px 20px;display:flex;gap:8px;justify-content:flex-end;border-top:1px solid var(--line)}

  /* ---- 請求書の見た目（SMILE で印刷する請求書と同じ並び）。社内確認用で、送る請求書ではない ---- */
  .inv.sheetmode{background:transparent;box-shadow:none;width:900px}
  .sheetbar{display:flex;gap:8px;align-items:center;justify-content:flex-end;margin-bottom:10px;flex-wrap:wrap}
  .sheetbar .grow{flex:1}
  .sheet{background:var(--surface);color:var(--txt);border-radius:4px;box-shadow:0 2px 6px rgba(22,26,61,.12),0 18px 40px rgba(22,26,61,.10);
    padding:40px 44px 36px;position:relative;font-size:12.5px;line-height:1.55}
  .sheet .stamp{position:absolute;top:18px;right:20px;font-size:11px;font-weight:700;color:var(--red-ink);border:1.5px solid var(--red);border-radius:4px;padding:2px 8px;letter-spacing:.08em}
  .sheet h1{font-size:26px;letter-spacing:.6em;text-align:center;margin:0 0 4px;font-weight:700;padding-left:.6em}
  .sheet h1 span{border-bottom:2px solid var(--txt);padding:0 10px 2px}
  .sheet .subt{text-align:center;color:var(--sub);font-size:11.5px;margin-bottom:22px}
  .sheet .top{display:grid;grid-template-columns:1fr 1fr;gap:24px;align-items:start}
  .sheet .to{font-size:12px}
  .sheet .to .nm{font-size:17px;font-weight:700;margin-top:10px;border-bottom:1px solid var(--txt);padding-bottom:4px;display:inline-block;min-width:70%}
  .sheet .to .nm small{font-size:13px;font-weight:500;margin-left:10px}
  .sheet .from{text-align:right;font-size:11.5px;color:var(--txt)}
  .sheet .from .co{font-size:17px;font-weight:700;letter-spacing:.06em;margin:4px 0 2px}
  .sheet .lead{margin:18px 0 8px;font-size:12px}
  .sheet .boxes{display:grid;grid-template-columns:1fr 1.2fr;gap:18px;align-items:end;margin-bottom:16px}
  .sheet table.kv,.sheet table.amt{border-collapse:collapse;width:100%}
  .sheet table.kv th,.sheet table.kv td,.sheet table.amt th,.sheet table.amt td{border:1px solid var(--txt);padding:4px 8px;text-align:center;font-size:12px;background:transparent;color:var(--txt)}
  .sheet table.kv th,.sheet table.amt th{background:var(--bg);font-weight:600;font-size:11px}
  .sheet table.amt td{font-size:15px;font-weight:700;font-variant-numeric:tabular-nums;text-align:right}
  .sheet table.amt td.big{font-size:19px;background:var(--navy-soft)}
  .sheet table.lines{border-collapse:collapse;width:100%;border:1px solid var(--txt)}
  .sheet table.lines th{background:var(--bg);color:var(--txt);border:1px solid var(--txt);font-size:11px;text-align:center;padding:5px 6px;font-weight:600}
  .sheet table.lines td{border-left:1px solid var(--txt);border-right:1px solid var(--txt);border-bottom:1px dotted var(--line-strong);padding:6px 8px;vertical-align:top;font-size:12px}
  .sheet table.lines td.num{font-variant-numeric:tabular-nums}
  .sheet table.lines .code{color:var(--sub);font-size:11px;font-family:"Consolas",monospace}
  .sheet table.lines .sub2{color:var(--sub);font-size:11px}
  .sheet table.lines .sub2 span{margin-right:14px;white-space:nowrap}
  .sheet table.lines .sub2 i{font-style:normal;margin-right:4px;opacity:.8}
  .sheet table.lines tr.tot td{border-top:1px solid var(--txt);border-bottom:none;font-weight:700}
  .sheet table.lines tr.tot td.lab{text-align:right;color:var(--txt)}
  .sheet .foot{margin-top:14px;font-size:11px;color:var(--sub);display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}
  .sheet .note2{margin-top:10px;font-size:11.5px;background:var(--amber-soft);color:var(--amber);border-radius:6px;padding:6px 10px}
  @media (max-width:760px){
    #invModal{padding:10px 6px}
    .sheetbar .btn{padding:5px 8px}
    .sheet{padding:22px 10px 16px;font-size:12px}
    .sheet .stamp{top:8px;right:8px}
    .sheet .subt{padding:0 40px}
    .sheet table.kv th,.sheet table.kv td,.sheet table.amt th{padding:3px 3px;font-size:10.5px}
    .sheet table.amt td{font-size:13px;padding:3px 5px}
    .sheet table.amt td.big{font-size:15px}
    .sheet table.lines td{padding:5px 5px}
    .sheet table.lines .sub2 span{white-space:normal}
    .sheet h1{font-size:20px}
    .sheet .top,.sheet .boxes{grid-template-columns:1fr}
    .sheet .from{text-align:left}
    .sheet table.lines th.hide-sm,.sheet table.lines td.hide-sm{display:none}
  }
  /* 印刷：請求書の紙だけを出す */
  @media print{
    body *{visibility:hidden!important}
    .sheet,.sheet *{visibility:visible!important}
    .sheet{position:absolute;left:0;top:0;width:100%;box-shadow:none;padding:12mm 10mm}
    #invModal{position:static;overflow:visible;background:none;padding:0}
    @page{size:A4;margin:8mm}
  }

  /* ---- 違算一覧 ---- */
  .gview{flex-direction:column;overflow-y:auto}
  .gbar{background:var(--surface);border-bottom:1px solid var(--line);padding:12px 20px;display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap;position:sticky;top:0;z-index:2}
  .gbar label{font-size:11px;font-weight:600;color:var(--sub);display:flex;flex-direction:column;gap:3px}
  .gbar select,.gbar input{width:auto;min-width:130px}
  .gbar input[type=search]{border:1px solid var(--line-strong);border-radius:8px;padding:6px 10px;font-size:13px;font-family:inherit;min-width:200px;background:var(--surface);color:var(--txt)}
  .seg{display:flex;border:1px solid var(--line-strong);border-radius:8px;overflow:hidden}
  .seg button{border:none;background:var(--surface);padding:6px 12px;font-size:12.5px;font-weight:600;color:var(--sub);cursor:pointer;font-family:inherit}
  .seg button+button{border-left:1px solid var(--line-strong)}
  .seg button.on{background:var(--navy);color:#fff}
  .gbody{padding:16px 20px 40px;display:flex;flex-direction:column;gap:16px}
  .kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
  .basehead{display:flex;align-items:center;gap:10px}
  .basehead .tot{margin-left:auto;font-size:12.5px;color:var(--sub);font-weight:500}
  .basehead .tot b{color:var(--txt)}
  .reason{font-size:12px;color:var(--sub);margin-top:2px}

  @media (max-width:1000px){
    .cards,.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  }
  /* 幅が狭いとき：ヘッダーのボタンは「⋯」の中へ */
  @media (max-width:1000px){
    .menu-btn{display:inline-block}
    .hdr-actions{display:none;position:absolute;top:52px;right:8px;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:10px;flex-direction:column;align-items:stretch;z-index:20}
    header.menu-open .hdr-actions{display:flex}
  }
  /* スマホ：一覧 → 詳細の2画面 */
  @media (max-width:760px){
    header{gap:8px;padding:0 10px}
    header h1{display:none}
    .hub-home span{display:none}
    .tabs{gap:4px}
    .tab{padding:4px 9px;font-size:12px}

<!-- 請求書の明細 -->
<div id="invModal"><div class="inv" id="invBody"></div></div>
<input type="file" id="fileInput" accept=".csv,.txt" multiple style="display:none">

<script>
"use strict";
// ============================================================
// 設定 — マスタビューワーと同じ SharedMasters を読む（読み取りだけ）
// ============================================================
const MSAL_CONFIG = HanaokaAuth.msalConfig();
// 特別請求をリストに書くので ReadWrite（書けるかどうかは SharePoint の権限で決まる。画面では判定しない）
const SCOPES = ['User.Read', 'Sites.ReadWrite.All', 'Files.Read.All'];
const SITE_ID = 'hanaokacorp.sharepoint.com,57813f25-8b28-40ac-affa-1e7d06d56802,eb428e92-6c63-46a9-a144-f6a2283a2f23';
const FALLBACK_DRIVE_ID = 'b!JT-BVyiLrECvh59BtVoApKOQutjbKlGoUT2oig6LyO5ej8pUQ4QQIYH904CzeZ8';
// SMILE から出すファイル（名前を変えたらここも直す）
const FILES = {
  detail:    { name:'請求明細出力.txt', label:'請求明細' },   // 請求明細出力（条件パターン SharedMaster）
  payments:  { name:'入金明細出力.csv', label:'入金明細' },   // 入金明細出力（総務が入金を登録したら出す）
  customers: { name:'得意先マスタ.csv', label:'得意先マスタ' },
  staff:     { name:'担当者マスタ.csv', label:'担当者マスタ' },
};

// 書き込む先（SharedMasters と同じサイトのリスト）。1 件 ＝ 1 行。
//   絞り込みに使う値だけ列にして、中身は Data 列に JSON で入れる。
//   誰が書けるかは SharePoint のリストの権限で決める（画面では判定しない）。権限を分けられるようにリストを分けている
//     special … 特別請求（SMILE の締めとは別に作った請求書）。総務だけが書く
//     follow  … 違算のフォロー（原因・責任・入金予定日）。営業と総務が書く
//     setting … 回収の設定（特別請求だけで判定する得意先など）。総務が書く
const DATA_COL = {name:'Data',text:{allowMultipleLines:true,textType:'plain'}};
const LISTS = {
  special: { name:'AR_特別請求', label:'特別請求', cols:[
    {name:'CustCode',text:{}}, {name:'InvoiceNo',text:{}}, {name:'IssueDate',text:{}}, {name:'DueDate',text:{}},
    {name:'NetAmount',number:{}}, {name:'TaxAmount',number:{}}, {name:'Status',text:{}}, DATA_COL ] },
  setting: { name:'AR_回収設定', label:'回収の設定', cols:[
    {name:'CustCode',text:{}}, {name:'Mode',text:{}}, {name:'FromDate',text:{}}, {name:'Status',text:{}}, DATA_COL ] },
  follow: { name:'AR_違算フォロー', label:'違算のフォロー', cols:[
    {name:'CustCode',text:{}}, {name:'DueDate',text:{}}, {name:'Responsibility',text:{}}, {name:'ExpectedDate',text:{}},
    {name:'Status',text:{}}, DATA_COL ] },
};
const listIds={}, listErr={};
let specialErr='';
let msalInstance=null, account=null, driveId=null;
let SRC={};          // 読み込んだ行（キーは FILES と同じ）
let SRCINFO={};      // ファイルの更新日時
let M=null;          // ARCore.build の結果
let asofOverride=''; // 判定日を手で変えたとき
let selCode='';
let view='cust';
let gKind='';

// ============================================================
// サインイン（hanaoka_auth.js）
// ============================================================
async function init(){
  if(typeof msal==='undefined'){ showLoginError('MSALライブラリを読み込めませんでした。再読み込みしてください。'); return; }
  msalInstance=new msal.PublicClientApplication(MSAL_CONFIG);
  await msalInstance.initialize();
  await msalInstance.handleRedirectPromise();
  // ボタンは確認（restore）より先に有効にする（確認中にサインインボタンが出ても押せるように）
  document.getElementById('loginBtn').onclick=login;
  document.getElementById('logoutBtn').onclick=logout;
  document.getElementById('reloadBtn').onclick=loadAll;
  account=await HanaokaAuth.restore(msalInstance,SCOPES);
  if(account){ showApp(); await loadAll(); }
}
async function login(){
  try{ hideLoginError(); account=await HanaokaAuth.login(msalInstance,SCOPES); showApp(); await loadAll(); }
  catch(e){ showLoginError('サインインに失敗しました: '+e.message); }
}
function logout(){
  HanaokaAuth.done();
  msalInstance.logoutPopup({account});
  document.getElementById('app').style.display='none';
  document.getElementById('loginScreen').style.display='flex';
}
async function getToken(){
  try{ const r=await msalInstance.acquireTokenSilent({scopes:SCOPES,account}); return r.accessToken; }
  catch{ const r=await msalInstance.acquireTokenPopup({scopes:SCOPES}); return r.accessToken; }
}
function showApp(){
  document.getElementById('loginScreen').style.display='none';
  document.getElementById('app').style.display='flex';
  const n=account.name||account.username;
  document.getElementById('userName').textContent=n;
  document.getElementById('userAvatar').textContent=(n||'?').charAt(0);
}
function showLoginError(m){ HanaokaAuth.done(); const e=document.getElementById('loginError'); e.textContent=m; e.style.display='block'; }
function hideLoginError(){ document.getElementById('loginError').style.display='none'; }
function setStatus(type,html,spin){
  const b=document.getElementById('statusBar'); b.className=type||'';
  document.getElementById('statusText').innerHTML=(spin?'<span class="spin"></span> ':'')+html;
}

// ============================================================
// SharedMasters から読む
// ============================================================
async function graphGet(url){
  const token=await getToken();
  const r=await fetch('https://graph.microsoft.com/v1.0'+url,{headers:{Authorization:'Bearer '+token}});
  if(!r.ok) throw new Error(`Graph ${r.status}: ${url}`);
  return r.json();
}
async function graphSend(method,url,body){
  const token=await getToken();
  const r=await fetch('https://graph.microsoft.com/v1.0'+url,{method,headers:{Authorization:'Bearer '+token,'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined});
  if(!r.ok){ const t=await r.text(); throw new Error(`Graph ${r.status}: ${t.slice(0,200)}`); }
  return r.status===204?{}:r.json();
}
// リストを名前で探す（なければ null）
async function findList(key){
  if(listIds[key]) return listIds[key];
  const d=await graphGet(`/sites/${SITE_ID}/lists?$select=id,displayName&$top=200`);
  const hit=(d.value||[]).find(l=>l.displayName===LISTS[key].name);
  listIds[key]=hit?hit.id:null; return listIds[key];
}
async function createList(key){
  const d=await graphSend('POST',`/sites/${SITE_ID}/lists`,{displayName:LISTS[key].name,columns:LISTS[key].cols,list:{template:'genericList'}});
  listIds[key]=d.id; return d.id;
}
// すべての行を { spId, f:列の値, data:Data列のJSON } で返す。リストがまだなければ []
async function readList(key){
  const id=await findList(key); if(!id) return [];
  const out=[]; let url=`/sites/${SITE_ID}/lists/${id}/items?expand=fields&$top=500`;
  while(url){
    const d=await graphGet(url);
    (d.value||[]).forEach(v=>{ const f=v.fields||{}; let data={}; try{ data=JSON.parse(f.Data||'{}'); }catch(e){} out.push({spId:v.id,f,data}); });
    url=d['@odata.nextLink']?d['@odata.nextLink'].replace('https://graph.microsoft.com/v1.0',''):null;
  }
  return out;
}
// 1行を書く（spId があれば上書き）。リストがなければ、確認してから作る
async function writeList(key,spId,fields){
  let id=await findList(key);
  if(!id){
    if(!confirm(LISTS[key].label+'の保存先（SharePoint のリスト「'+LISTS[key].name+'」）がまだありません。作りますか？')) return false;
    id=await createList(key);
  }
  if(spId) await graphSend('PATCH',`/sites/${SITE_ID}/lists/${id}/items/${spId}/fields`,fields);
  else await graphSend('POST',`/sites/${SITE_ID}/lists/${id}/items`,{fields});
  return true;
}
async function loadSpecials(){
  specialErr='';
  try{
    SRC.specials=(await readList('special')).map(({spId,f,data})=>({ spId, id:spId, cust:f.CustCode||'', no:f.InvoiceNo||'', issue:f.IssueDate||'', due:f.DueDate||'',
      net:Number(f.NetAmount)||0, tax:Number(f.TaxAmount)||0, status:f.Status||'登録', lines:data.lines||[], memo:data.memo||'',
      custName:data.custName||'', createdBy:data.createdBy||'', createdAt:data.createdAt||'', updatedBy:data.updatedBy||'' }));
  }catch(e){ console.warn('特別請求',e); specialErr='特別請求を読めませんでした（'+e.message.slice(0,80)+'）'; SRC.specials=SRC.specials||[]; }
}
// 回収の設定：いまは「特別請求だけで判定する得意先」（分割請求・前金で、SMILE の請求書と特別請求書が1対1にならない）
let settingErr='';
async function loadSettings(){
  settingErr='';
  try{
    SRC.settings=(await readList('setting')).map(({spId,f,data})=>({ spId, cust:f.CustCode||'', mode:f.Mode||'', from:f.FromDate||'', status:f.Status||'有効',
      memo:data.memo||'', updatedBy:data.updatedBy||'', updatedAt:data.updatedAt||'' }));
  }catch(e){ console.warn('回収設定',e); settingErr='回収の設定を読めませんでした（'+e.message.slice(0,80)+'）'; SRC.settings=SRC.settings||[]; }
}
function openSpecialOnlyForm(c){
  const cur=(SRC.settings||[]).find(x=>x.cust===c.code&&x.mode==='特別請求のみ');
  const on=cur&&cur.status!=='取消';
  document.querySelector('#invModal .inv').classList.remove('sheetmode');
  document.getElementById('invBody').innerHTML=`
    <div class="inv-head"><div><h2>特別請求だけで判定する　${esc(c.name)}</h2>
      <div class="meta"><span>分割請求・前金などで、SMILE の請求書と特別請求書が1対1にならない得意先に使います</span></div></div></div>
    <div class="form">
      <label>この日以降に締めた SMILE の請求書は判定に使わない<input id="oFrom" type="date" value="${esc(cur&&cur.from||M.dataStart)}"></label>
      <label>状態<input readonly value="${on?'特別請求だけで判定中':'設定なし'}"></label>
      <label class="full">メモ<textarea id="oMemo" rows="2" placeholder="例）JAL は伝票の一部の台数ずつ特別請求している">${esc(cur&&cur.memo||'')}</textarea></label>
      <div class="full hint">設定すると、SMILE の請求書は表示だけになり、特別請求書の金額と回収予定日で入金を確かめます。特別請求は「金額だけで作る」で登録します。</div>
    </div>
    <div class="ferr" id="fErr"></div>
    <div class="inv-foot">${on?'<button class="btn" id="oOff" style="margin-right:auto;color:var(--red-ink)">設定をやめる</button>':''}<button class="btn" id="fClose">やめる</button><button class="btn pri" id="oSave">${on?'保存':'設定する'}</button></div>`;
  const modal=document.getElementById('invModal'); modal.classList.add('show');
  document.getElementById('fClose').onclick=()=>modal.classList.remove('show');
  const save=async status=>{
    const btns=[...document.querySelectorAll('#invBody .inv-foot button')]; btns.forEach(b=>b.disabled=true);
    try{
      const data={ memo:document.getElementById('oMemo').value.trim(), custName:c.name, updatedBy:account&&account.name||'', updatedAt:new Date().toISOString() };
      const ok=await writeList('setting',cur&&cur.spId,{ Title:c.code+'-特別請求のみ', CustCode:c.code, Mode:'特別請求のみ', FromDate:document.getElementById('oFrom').value, Status:status, Data:JSON.stringify(data) });
      if(!ok){ btns.forEach(b=>b.disabled=false); return; }
      modal.classList.remove('show'); await loadSettings(); rebuild();
    }catch(e){ document.getElementById('fErr').textContent='保存できませんでした：'+e.message; btns.forEach(b=>b.disabled=false); }
  };
  document.getElementById('oSave').onclick=()=>save('有効');
  const off=document.getElementById('oOff'); if(off) off.onclick=()=>{ if(confirm('特別請求だけで判定するのをやめますか？')) save('取消'); };
}

// 違算のフォロー：キーは「請求先ｺｰﾄﾞ|回収予定日」（違算 Excel の 1 件と同じ単位）
let FOLLOW={}, followErr='';
function followKey(code,due){ return code+'|'+due; }
async function loadFollows(){
  followErr='';
  try{
    const F={};
    (await readList('follow')).forEach(({spId,f,data})=>{ const k=followKey(f.CustCode||'',f.DueDate||'');
      F[k]={ spId, key:k, cust:f.CustCode||'', due:f.DueDate||'', resp:f.Responsibility||'', expected:f.ExpectedDate||'', status:f.Status||'',
        cause:data.cause||'', measure:data.measure||'', amount:data.amount, custName:data.custName||'', history:data.history||[],
        updatedBy:data.updatedBy||'', updatedAt:data.updatedAt||'' }; });
    FOLLOW=F;
  }catch(e){ console.warn('違算フォロー',e); followErr='違算のフォローを読めませんでした（'+e.message.slice(0,80)+'）'; }
}
async function resolveDriveId(){
  if(driveId) return driveId;
  try{
    const data=await graphGet(`/sites/${SITE_ID}/drives?$select=id,name,webUrl&$top=100`);
    const hit=(data.value||[]).find(d=>d.name==='SharedMasters')||(data.value||[]).find(d=>/SharedMasters/i.test((d.name||'')+(d.webUrl||'')));
    if(hit){ driveId=hit.id; return driveId; }
  }catch(e){ console.warn('drive解決失敗、フォールバックID使用',e); }
  driveId=FALLBACK_DRIVE_ID; return driveId;
}
function decodeText(buf){
  let t=new TextDecoder('utf-8').decode(buf);
  if((t.match(/�/g)||[]).length>5){ try{ t=new TextDecoder('shift_jis').decode(buf); }catch(e){} }
  return t.charCodeAt(0)===0xFEFF?t.slice(1):t;
}
async function fetchFile(fname){
  const did=await resolveDriveId();
  const meta=await graphGet(`/drives/${did}/root:/${encodeURIComponent(fname)}`);
  const r=await fetch(meta['@microsoft.graph.downloadUrl']);
  if(!r.ok) throw new Error(`${fname}: ${r.status}`);
  return { text:decodeText(await r.arrayBuffer()), modified:meta.lastModifiedDateTime };
}
async function loadAll(){
  setStatus('loading','SharePoint（SharedMasters）から読み込み中…',true);
  const missing=[];
  await Promise.all(Object.entries(FILES).map(async([k,f])=>{
    try{ const r=await fetchFile(f.name); SRC[k]=ARCore.toObjects(r.text); SRCINFO[k]={modified:r.modified,from:'SharePoint'}; }
    catch(e){ console.warn(f.name,e); if(!SRC[k]) missing.push(f.name); }
  }).concat([loadSpecials(),loadFollows(),loadSettings()]));
  if(!SRC.detail||!SRC.customers){
    setStatus('error','読み込めませんでした: '+esc(missing.join('、'))+'　右上の「ファイルを選ぶ」で手元のファイルからも開けます。'); return;
  }
  rebuild();
  if(missing.length) setStatus('error','読み込めなかったファイル: '+esc(missing.join('、'))+'（入金がないものとして表示しています）　／　'+summaryText());
}
// 手元のファイルを選んだとき（SharePoint に置く前の確認用）。ファイル名で振り分ける
document.getElementById('fileBtn').onclick=()=>document.getElementById('fileInput').click();
document.getElementById('fileInput').onchange=async e=>{
  const files=[...e.target.files]; let n=0;
  for(const f of files){
    const key=Object.keys(FILES).find(k=>f.name.includes(FILES[k].name.replace(/\.(csv|txt)$/,'')));
    if(!key) continue;
    SRC[key]=ARCore.toObjects(decodeText(await f.arrayBuffer())); SRCINFO[key]={modified:new Date(f.lastModified).toISOString(),from:'手元のファイル'}; n++;
  }
  e.target.value='';
  if(!n){ alert('ファイル名から種類がわかりませんでした。\n'+Object.values(FILES).map(f=>f.name).join('\n')+'\nのどれかの名前にしてください。'); return; }
  if(SRC.detail&&SRC.customers) rebuild(); else setStatus('error','請求明細と得意先マスタは必ず要ります。');
};

function rebuild(){
  M=ARCore.build(SRC,{asof:asofOverride||undefined});
  document.getElementById('asofInput').value=M.asof;
  fillFilters();
  const n=M.list.filter(isGap).length;
  const cnt=document.getElementById('gapCnt'); cnt.textContent=n; cnt.hidden=!n;
  setStatus('success',summaryText());
  readHash();
  render();
}
function summaryText(){
  const md=s=>s&&s!=='9999-99-99'?`${+s.slice(5,7)}/${+s.slice(8,10)}`:'—';
  const mod=k=>SRCINFO[k]&&SRCINFO[k].modified?new Date(SRCINFO[k].modified).toLocaleString('ja-JP',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'}):'';
  const sp=(SRC.specials||[]).filter(x=>x.status!=='取消').length;
  return `請求明細 ${md(M.dataStart)}〜${md(M.dataEnd)}（${mod('detail')}更新）　入金明細 ${SRC.payments?md(M.payStart)+'〜'+md(M.payEnd)+'（'+mod('payments')+'更新）':'なし'}　特別請求 ${sp}件`
    +[specialErr,followErr,settingErr].filter(Boolean).map(e=>'　<b>'+esc(e)+'</b>').join('');
}
document.getElementById('asofInput').onchange=e=>{ asofOverride=e.target.value; if(M) rebuild(); };

// ============================================================
// 共通
// ============================================================
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function yen(n){ return (n<0?'−':'')+Math.abs(Math.round(n||0)).toLocaleString('ja-JP'); }
function md(s){ return s?`${+s.slice(5,7)}/${+s.slice(8,10)}`:''; }
function ymdJ(s){ return s?`${s.slice(0,4)}/${+s.slice(5,7)}/${+s.slice(8,10)}`:''; }
// 半角カナ・全角カナ・ひらがなのどれで入力しても同じになるように
function norm(s){ return (s||'').normalize('NFKC').toLowerCase().replace(/[ぁ-ゖ]/g,c=>String.fromCharCode(c.charCodeAt(0)+0x60)).replace(/[\s　()（）㈱]/g,''); }
function isGap(c){ return !c.excludeReason && c.diff!==0; }
function pillOf(c){
  if(c.excludeReason) return '<span class="pill na">対象外</span>';
  if(c.diff>0) return `<span class="pill under">未入金 ${yen(c.diff)}</span>`;
  if(c.diff<0) return `<span class="pill over">過入金 ${yen(-c.diff)}</span>`;
  if(c.next) return `<span class="pill wait">${md(c.next.due)} 予定</span>`;
  if(c.periods.some(p=>p.judged)) return '<span class="pill ok">入金済</span>';
  return '';
}
function periodState(p,c){
  if(c.excludeReason) return '<span class="pill na">対象外</span>';
  if(p.partial) return '<span class="pill na" title="データの最初の日より前の売上を含むため、請求額がわかりません">判定なし</span>';
  if(!p.usable) return '<span class="pill na" title="入金明細の期間より前のため判定しません">判定なし</span>';
  if(!p.judged) return p.paid?`<span class="pill wait">一部入金</span>`:`<span class="pill wait">入金待ち</span>`;
  if(p.diff>0) return '<span class="pill under">未入金</span>';
  if(p.diff<0) return '<span class="pill over">過入金</span>';
  return '<span class="pill ok">入金済</span>';
}

function fillFilters(){
  const bases=ARCore.BASES.filter(b=>M.list.some(c=>c.base===b));
  const staffs=[...new Set(M.list.map(c=>c.staffName).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'ja'));
  const opt=(v,l)=>`<option value="${esc(v)}">${esc(l)}</option>`;
  for(const id of ['fBase','gBase']){ const el=document.getElementById(id),cur=el.value; el.innerHTML=opt('','すべて')+bases.map(b=>opt(b,b)).join(''); el.value=cur; }
  for(const id of ['fStaff','gStaff']){ const el=document.getElementById(id),cur=el.value; el.innerHTML=opt('','すべて')+staffs.map(s=>opt(s,s)).join(''); el.value=cur; }
}
['search','fBase','fStaff','fShow'].forEach(id=>document.getElementById(id).addEventListener('input',renderList));
['gBase','gStaff','gSearch','gFollow'].forEach(id=>document.getElementById(id).addEventListener('input',renderGap));
document.querySelectorAll('#gKind button').forEach(b=>b.onclick=()=>{ gKind=b.dataset.k; document.querySelectorAll('#gKind button').forEach(x=>x.classList.toggle('on',x===b)); renderGap(); });
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{ setView(t.dataset.view); writeHash(); });
function setView(v){
  view=v;
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t.dataset.view===v));
  document.getElementById('viewCust').classList.toggle('active',v==='cust');
  document.getElementById('viewGap').classList.toggle('active',v==='gap');
  document.getElementById('viewSp').classList.toggle('active',v==='sp');
  document.getElementById('viewRecon').classList.toggle('active',v==='recon');
  if(v==='recon') renderRecon();
}
function render(){ setView(view); renderList(); renderDetail(); renderGap(); renderSpList(); }
['spSearch','spShowCancel'].forEach(id=>document.getElementById(id).addEventListener('input',renderSpList));

// URL の # で得意先を開く（例：ar_billing.html#c=110201）。営業にリンクで渡せるように
function readHash(){
  const h=new URLSearchParams(location.hash.slice(1));
  if(h.get('c')&&M.customers[h.get('c')]){ selCode=h.get('c'); view='cust'; document.getElementById('viewCust').classList.add('show-detail'); }
  else if(['gap','sp','recon'].includes(h.get('v'))) view=h.get('v');
}
window.addEventListener('hashchange',()=>{ if(!M) return; readHash(); render(); });
function writeHash(){
  const h=view!=='cust'?'v='+view:(selCode?'c='+selCode:'');
  history.replaceState(null,'',h?'#'+h:location.pathname+location.search);
}

// ============================================================
// 得意先別：一覧
// ============================================================
function renderList(){
  if(!M) return;
  const q=norm(document.getElementById('search').value), base=document.getElementById('fBase').value,
        st=document.getElementById('fStaff').value, show=document.getElementById('fShow').value;
  let L=M.list.filter(c=>{
    if(base&&c.base!==base) return false;
    if(st&&c.staffName!==st) return false;
    if(show==='gap'&&!isGap(c)) return false;
    if(show==='billed'&&!c.invoiceList.length&&!c.unbilled.length) return false;
    if(q&&!norm(c.code+' '+c.name+' '+c.name2+' '+c.short+' '+c.kana+' '+c.staffName+' '+Object.values(c.children).join(' ')).includes(q)) return false;
    return true;
  });
  // 違算 → 金額の大きい順、それ以外はコード順
  L.sort((a,b)=>(isGap(b)-isGap(a))||(isGap(a)?Math.abs(b.diff)-Math.abs(a.diff):a.code.localeCompare(b.code)));
  document.getElementById('listMeta').textContent=`${L.length.toLocaleString()} 件`+(L.length>400?'（先頭400件を表示。検索で絞ってください）':'');
  document.getElementById('list').innerHTML=L.slice(0,400).map(c=>`
    <div class="row${c.code===selCode?' sel':''}" data-c="${esc(c.code)}">
      <div class="rmain"><div class="code">${esc(c.code)}</div><div class="name">${esc(c.name)}</div>
        <div class="sub">${esc([c.staffName,c.base,c.closeLabel&&c.closeLabel+(c.termsLabel?'・'+c.termsLabel:'')].filter(Boolean).join('　'))}</div></div>
      ${pillOf(c)}
    </div>`).join('')||'<div class="empty">該当する得意先がありません</div>';
  document.querySelectorAll('#list .row').forEach(r=>r.onclick=()=>openCust(r.dataset.c));
  const sel=document.querySelector('#list .row.sel'); if(sel) sel.scrollIntoView({block:'nearest'});
}
function openCust(code){
  selCode=code; setView('cust');
  document.getElementById('viewCust').classList.add('show-detail');
  writeHash(); renderList(); renderDetail();
  document.getElementById('detail').scrollTop=0;
}

function renderDetail(){
  const el=document.getElementById('detail');
  const c=M&&M.customers[selCode];
  if(!c){ el.innerHTML='<div class="placeholder">左の一覧から得意先を選んでください</div>'; return; }
  const chip=(k,v)=>v?`<span class="chip"><i>${k}</i>${esc(v)}</span>`:'';
  const kids=Object.entries(c.children);

  // カード：今の違算／次の入金予定／未締めの売上
  let card1;
  if(c.excludeReason) card1=`<div class="card"><div class="k">違算</div><div class="v" style="font-size:16px">対象外</div><div class="s">${esc(c.excludeReason)}</div></div>`;
  else if(c.diff>0) card1=`<div class="card under"><div class="k">違算（未入金）</div><div class="v neg">${yen(c.diff)}</div><div class="s">${ymdJ(c.oldestDue)} 回収予定の分から ${c.daysOver}日</div></div>`;
  else if(c.diff<0) card1=`<div class="card over"><div class="k">違算（過入金）</div><div class="v">${yen(-c.diff)}</div><div class="s">${ymdJ(c.oldestDue)} 回収予定の分から ${c.daysOver}日</div></div>`;
  else card1=`<div class="card ok"><div class="k">違算</div><div class="v" style="color:var(--green-ink)">なし</div><div class="s">${M.asof?ymdJ(M.asof)+' 時点':''}</div></div>`;

               :`<div class="card"><div class="k">次の入金予定</div><div class="v" style="font-size:16px">—</div><div class="s">締め済みの請求で、回収予定日が先のものはありません</div></div>`;
  const card3=`<div class="card"><div class="k">まだ締めていない売上</div><div class="v">${yen(c.unbilledAmount)}</div><div class="s">${c.unbilled.length} 行（次の請求書に載る予定・税抜）</div></div>`;

  // 回収予定日ごと（新しい順）
  const P=[...c.periods].reverse();
  const prow=P.map((p,i)=>{
    const invs=p.invoices.map(v=>`<a class="inv-link" data-no="${esc(v.no)}">${esc(v.label)}</a> <span class="muted">${v.special?md(v.close)+'請求':md(v.close)+'締'}</span>`).join('<br>');
    const pays=p.payments.map(x=>`<tr class="sub"><td colspan="3">${ymdJ(x.date)}　${esc(x.kind)}${x.memo?'　'+esc(x.memo):''}${x.due?'　決済 '+ymdJ(x.due):''}</td><td class="num">${yen(x.amount)}</td><td colspan="3"></td></tr>`).join('');
    return `<tr class="click${p.judged||p.partial?'':' '}" data-p="${i}">
      <td>${ymdJ(p.due)}${p.bound!==p.due?`<div class="reason">休日のため ${md(p.bound)} まで</div>`:''}${p.invoices.some(v=>v.rule)?`<div class="reason">追記の条件で ${md(p.invoices.find(v=>v.rule).baseDue)} から後ろへ</div>`:''}</td>
      <td>${invs}</td>
      <td class="num">${yen(p.amount)}</td>
      <td class="num">${yen(p.paid)}${p.payments.length?` <span class="muted">(${p.payments.length})</span>`:''}</td>
      <td class="num ${p.diff&&p.judged?'neg':''}">${p.judged?yen(p.diff):''}</td>
      <td class="num">${p.cum==null?'':yen(p.cum)}</td>
      <td>${periodState(p,c)}</td>
      <td>${(p.judged&&p.diff!==0)||fuOf(c,p)?`${fuOf(c,p)?fuCell(fuOf(c,p)):''}<button class="btn" data-fu="${esc(c.code)}|${esc(p.due)}">${fuOf(c,p)?'直す':'フォローを書く'}</button>`:''}</td></tr>
      <tr class="paydetail" data-for="${i}" hidden><td colspan="8" style="padding:0"><table>${pays||'<tr class="sub"><td>この期間の入金はありません</td></tr>'}</table></td></tr>`;
  }).join('');

  // 請求書の一覧（請求書番号ごと）
  const irow=[...c.invoiceList].reverse().map(v=>`<tr class="click" data-no="${esc(v.no)}">
      <td><a class="inv-link" data-no="${esc(v.no)}">${esc(v.label)}</a>${v.special?' <span class="pill sp">特別請求</span>':''}${v.specialOut?`<div class="reason">特別請求に回した分 ${yen(v.specialOut)} を除く</div>`:''}</td><td>${ymdJ(v.close)}</td><td>${ymdJ(v.due)||'—'}${v.rule?`<div class="reason">${esc(v.rule)}</div>`:''}</td>
      <td class="num">${v.lines.length}</td><td class="num">${yen(v.net)}</td><td class="num">${yen(v.tax)}</td><td class="num"><b>${yen(v.amount)}</b></td>
      <td>${v.partial?'<span class="pill na" title="データの最初の日より前の売上は載っていません">一部のみ</span>':''}${v.excluded?`<span class="pill na" title="${esc(v.excluded)}">判定に使わない</span>`:''}${v.missing?'<span class="pill na" title="伝票が明細の期間外です。登録したときの内容を出しています">期間外</span>':''}</td></tr>`).join('');

  // まだ締めていない売上
  const urow=c.unbilled.map(l=>`<tr><td class="ck"><input type="checkbox" class="uck" data-k="${esc(l.key)}"></td><td>${ymdJ(l.date)}</td><td class="mono">${esc(l.slip)}</td>${kids.length?`<td>${esc(l.custName)}</td>`:''}<td>${esc(l.kind)}</td><td>${esc(l.itemName)}</td><td>${esc(l.po)}</td><td class="num">${l.qty}</td><td class="num">${yen(l.net)}</td></tr>`).join('');

        ${kids.length?chip('納品先の得意先',kids.length+'件'):''}${c.inMaster?'':chip('','得意先マスタにありません')}
      </div>
      ${c.termsNote?`<div class="tnote"><b>支払条件追記</b>　${esc(c.termsNote)}${c.termRules.length?'<br>→ 計算に使った条件：'+c.termRules.map(r=>esc(ARCore.ruleLabel(r))).join('、'):''}</div>`:''}
    </div>
    <div class="dbody">
      <div class="cards">${card1}${card2}${card3}</div>
      <div class="panel">

          <tbody>${prow||'<tr><td colspan="8" class="empty">締め済みの請求がありません</td></tr>'}</tbody>
        </table></div>

          それより遅い入金は次の回に入るため、その回は過入金に見えます。<b>累計が 0 に戻れば解消</b>です。</div>
      </div>
      <div class="panel">
        <h3>発行した請求書 <small>番号を押すと明細</small></h3>
        <div class="tw"><table>
          <thead><tr><th>請求書</th><th>締日</th><th>回収予定日</th><th class="num">行数</th><th class="num">税抜</th><th class="num">消費税</th><th class="num">請求額</th><th></th></tr></thead>
          <tbody>${irow||'<tr><td colspan="8" class="empty">ありません</td></tr>'}</tbody>
        </table></div>
      </div>
      <div class="panel">
        <h3>まだ締めていない売上 <small>次の請求書に載る予定</small></h3>
        ${urow?`<div class="tw"><table><thead><tr><th class="ck"></th><th>伝票日付</th><th>伝票№</th>${kids.length?'<th>得意先</th>':''}<th>取引</th><th>品目</th><th>客先注番</th><th class="num">数量</th><th class="num">税抜金額</th></tr></thead><tbody>${urow}</tbody></table></div>
          <div class="selbar" id="uSel" hidden><span>選んだ伝票 <b id="uSelN">0</b> 行・税抜 <b id="uSelAmt">0</b> 円</span><button class="btn pri" id="uSelBtn">特別請求を作る</button></div>`:'<div class="empty">ありません</div>'}
      </div>
      ${specialPanel(c)}
    </div>`;
  const bb=document.getElementById('backBtn');
  if(bb) bb.onclick=()=>{ document.getElementById('viewCust').classList.remove('show-detail'); selCode=''; writeHash(); renderList(); };
  el.querySelectorAll('[data-fu]').forEach(b=>b.onclick=e=>{ e.stopPropagation(); const [code,due]=b.dataset.fu.split('|'); openFollowForm(code,due); });

    const d=el.querySelector(`tr.paydetail[data-for="${tr.dataset.p}"]`); d.hidden=!d.hidden;

  const ob=document.getElementById('spOnlyBtn'); if(ob) ob.onclick=()=>openSpecialOnlyForm(c);
}

// ============================================================
// 請求書の明細（SMILE「請求明細書」と同じ並び：日付・伝票ごと）
// ============================================================
// 会社の情報（請求書の右上）。振込先の口座は載せない（社内確認用の画面で、リポジトリは公開のため）
const COMPANY={ name:'花岡車輌 株式会社', zip:'〒135-0021', addr:'東京都江東区白河2丁目17番10号', tel:'TEL 03-3643-5272　FAX 03-3643-5270', reg:'登録番号：T9010601007789' };
function openInvoice(c,no){
  const v=c.invoices[no]; if(!v) return;
  const lines=[...v.lines].filter(l=>l.taxKind!=='消費税').sort((a,b)=>(a.date+String(a.slip).padStart(8,'0')+String(a.row).padStart(3,'0')).localeCompare(b.date+String(b.slip).padStart(8,'0')+String(b.row).padStart(3,'0')));
  const multi=new Set(lines.map(l=>l.cust)).size>1;
  let prevD='',prevS='';
  const rows=lines.map(l=>{
    const d=l.date!==prevD?ymdJ(l.date):'', sl=(l.date+l.slip)!==prevS?esc(l.slip):'';
    prevD=l.date; prevS=l.date+l.slip;
    const sub=[l.po&&`<i>客先注番</i>${esc(l.po)}`, l.drawing&&`<i>図番</i>${esc(l.drawing)}`, l.model&&`<i>型番</i>${esc(l.model)}`,
      (multi||l.dest)&&`<i>納品先</i>${esc(l.dest||l.custName)}`].filter(Boolean).map(x=>`<span>${x}</span>`).join('');
    const qty=l.qty.toLocaleString('ja-JP',{minimumFractionDigits:2});
    return `<tr><td class="nowrap">${d}</td><td class="num mono hide-sm">${sl}</td><td class="nowrap hide-sm">${esc(l.kind)}</td>
      <td>${l.item?`<span class="code">(${esc(l.item)})</span> `:''}${esc(l.itemName)}${sub?`<div class="sub2">${sub}</div>`:''}</td>
      <td class="num nowrap">${qty}<span class="muted"> ${esc(l.unit)}</span></td><td class="num nowrap hide-sm">${l.price.toLocaleString('ja-JP',{minimumFractionDigits:2})}</td><td class="num nowrap">${yen(l.net)}</td></tr>`;
  }).join('');
  const title=v.special?'特 別 請 求 書':'請 求 書';
  document.getElementById('invBody').innerHTML=`
    <div class="sheetbar">
      <span class="muted grow" style="font-size:12.5px">${v.partial?'※ データの最初の日（'+ymdJ(M.dataStart)+'）より前の売上は載っていません':''}</span>
      ${v.special?'':'<button class="btn" id="toTable">表で見る（伝票を選んで特別請求に）</button>'}
      <button class="btn" id="invPrint">印刷</button><button class="btn" id="invCsv">CSVに出す</button><button class="btn pri" id="invClose">閉じる</button>
    </div>
    <div class="sheet">
      <div class="stamp">社内確認用</div>
      <h1><span>${title}</span></h1>
      <div class="subt">SMILE のデータから作った確認用の画面です。お客様に送る請求書ではありません</div>
      <div class="top">
        <div class="to">${c.zip?esc(c.zip)+'<br>':''}${esc(c.addr1)}${c.addr2?'<br>'+esc(c.addr2):''}${c.addr3?'<br>'+esc(c.addr3):''}
          <div class="nm">${esc(c.name)}${c.name2?' '+esc(c.name2):''}<small>様</small></div></div>
        <div class="from"><div class="co">${COMPANY.name}</div>${COMPANY.zip} ${COMPANY.addr}<br>${COMPANY.tel}<br>${COMPANY.reg}</div>
      </div>
      <div class="boxes">
        <div><div class="lead">下記の通りご請求申し上げます。</div>
          <table class="kv"><tr><th>お客様コード</th><th>${v.special?'請求日':'締日'}</th><th>請求書番号</th><th>お支払予定日</th></tr>
            <tr><td class="mono">${esc(c.code)}</td><td>${ymdJ(v.close)}</td><td>${esc(v.special?(v.special.no||'—'):v.no)}</td><td>${ymdJ(v.due)||'—'}</td></tr></table></div>
        <table class="amt"><tr><th>請求額（税抜）</th><th>消費税額</th><th>請求額（税込）</th></tr>
          <tr><td>${yen(v.net)}</td><td>${yen(v.tax)}</td><td class="big">¥${yen(v.amount)}</td></tr></table>
      </div>
      <table class="lines">
        <thead><tr><th style="width:84px">日付</th><th class="hide-sm" style="width:64px">伝票番号</th><th class="hide-sm" style="width:58px">取引区分</th><th>商品名</th><th style="width:96px">数量</th><th class="hide-sm" style="width:92px">単価</th><th style="width:96px">金額</th></tr></thead>
        <tbody>${rows||'<tr><td colspan="7" class="muted">明細がありません</td></tr>'}
          <tr class="tot"><td colspan="4" class="lab hide-sm">（税率10%）</td><td class="lab">【御買上額】</td><td class="hide-sm"></td><td class="num">${yen(v.net)}</td></tr>
          <tr class="tot"><td colspan="4" class="hide-sm" style="border-top:none"></td><td class="lab" style="border-top:none">【消費税等】</td><td class="hide-sm" style="border-top:none"></td><td class="num" style="border-top:none">${yen(v.tax)}</td></tr>
        </tbody></table>
      ${v.specialOut?`<div class="note2">この請求書から、特別請求に回した ${yen(v.specialOut)} 円（税込）を除いて表示しています。</div>`:''}
      ${v.special&&v.special.memo?`<div class="note2">メモ：${esc(v.special.memo)}</div>`:''}
      <div class="foot"><span>担当 ${esc(c.staffName)}　${esc(c.closeLabel)}・${esc(c.termsLabel)}</span><span>${M.asof?'データ '+ymdJ(M.dataEnd)+' 時点':''}</span></div>
    </div>`;
  const box=document.querySelector('#invModal .inv'); box.classList.add('sheetmode');
  const modal=document.getElementById('invModal'); modal.classList.add('show'); modal.scrollTop=0;
  document.getElementById('invClose').onclick=()=>modal.classList.remove('show');
  document.getElementById('invPrint').onclick=()=>window.print();
  document.getElementById('invCsv').onclick=()=>invoiceCsv(c,v,lines);
  const tt=document.getElementById('toTable'); if(tt) tt.onclick=()=>openInvoiceTable(c,no);
}
function invoiceCsv(c,v,lines){
  downloadCsv(`請求明細_${c.code}_${v.special?'特別'+(v.special.no||v.special.id):'No'+v.no}.csv`,
    [['日付','伝票№','得意先','取引区分','品目コード','品目','型番','図番','客先注番','数量','単位','単価','金額']]
      .concat(lines.map(l=>[l.date,l.slip,l.custName,l.kind,l.item,l.itemName,l.model,l.drawing,l.po,l.qty,l.unit,l.price,l.net]))
      .concat([['','','','','','','','','','','','御買上額',v.net],['','','','','','','','','','','','消費税等',v.tax]]));
}
// 表で見る（伝票を選んで特別請求にするとき）
function openInvoiceTable(c,no){
  const v=c.invoices[no]; if(!v) return;
  document.querySelector('#invModal .inv').classList.remove('sheetmode');
  const canPick=!v.special;
  const lines=[...v.lines].filter(l=>!(l.taxKind==='消費税')).sort((a,b)=>(a.date+String(a.slip).padStart(8,'0')+String(a.row).padStart(3,'0')).localeCompare(b.date+String(b.slip).padStart(8,'0')+String(b.row).padStart(3,'0')));
  const multi=new Set(lines.map(l=>l.cust)).size>1;
  let prevD='',prevS='';
  const rows=lines.map(l=>{
    const d=l.date!==prevD?ymdJ(l.date):'', s=(l.date+l.slip)!==prevS?esc(l.slip):'';
    prevD=l.date; prevS=l.date+l.slip;
    return `<tr>${canPick?`<td class="ck"><input type="checkbox" class="ick" data-k="${esc(l.key)}"></td>`:''}<td class="nowrap">${d}</td><td class="mono num">${s}</td>${multi?`<td>${esc(l.custName)}</td>`:''}<td>${esc(l.kind)}</td><td class="mono">${esc(l.item)}</td><td>${esc(l.itemName)}</td>
      <td>${esc(l.model)}</td><td class="mono">${esc(l.drawing)}</td><td class="mono">${esc(l.po)}</td><td class="num">${l.qty.toLocaleString('ja-JP',{minimumFractionDigits:2})}</td><td>${esc(l.unit)}</td>
      <td class="num">${l.price.toLocaleString('ja-JP',{minimumFractionDigits:2})}</td><td class="num">${yen(l.net)}</td></tr>`;
  }).join('');
  const span=(multi?12:11)+(canPick?1:0);
  document.getElementById('invBody').innerHTML=`
    <div class="inv-head">
      <div><h2>${esc(c.name)}　${v.special?'特別請求 '+esc(v.special.no||''):'請求書 '+esc(v.label)}</h2>
        <div class="meta"><span>得意先 ${esc(c.code)}</span><span>${ymdJ(v.close)} ${v.special?'請求':'締'}</span><span>回収予定 ${ymdJ(v.due)||'—'}</span><span>担当 ${esc(c.staffName)}</span></div>
        ${v.partial?'<div class="reason">※ データの最初の日（'+ymdJ(M.dataStart)+'）より前の売上は、この画面には載っていません</div>':''}</div>
      <div class="inv-tot"><span>御買上額</span><b>${yen(v.net)}</b><span>消費税等</span><b>${yen(v.tax)}</b><span>請求額</span><b>${yen(v.amount)}</b></div>
    </div>
    <div class="tw"><table>
      <thead><tr>${canPick?'<th class="ck"></th>':''}<th>日付</th><th class="num">伝票№</th>${multi?'<th>得意先</th>':''}<th>取引区分</th><th>品目コード</th><th>品目</th><th>型番</th><th>図番</th><th>客先注番</th><th class="num">数量</th><th>単位</th><th class="num">単価</th><th class="num">金額</th></tr></thead>
      <tbody>${rows}
        <tr class="sum"><td colspan="${span}" class="num">【御買上額】</td><td class="num">${yen(v.net)}</td></tr>
        <tr class="sum"><td colspan="${span}" class="num">【消費税等】</td><td class="num">${yen(v.tax)}</td></tr>
      </tbody></table></div>
    <div class="inv-foot">${canPick?'<span class="muted" id="iSelTxt" style="margin-right:auto;font-size:12.5px">伝票を選ぶと、この請求書から外して特別請求にできます</span><button class="btn" id="iSelBtn" disabled>選んだ伝票で特別請求を作る</button>':''}<button class="btn" id="toSheet">請求書で見る</button><button class="btn" id="invCsv">CSVに出す</button><button class="btn pri" id="invClose">閉じる</button></div>`;
  const modal=document.getElementById('invModal'); modal.classList.add('show');
  document.getElementById('invClose').onclick=()=>modal.classList.remove('show');
  if(canPick){
    const pick=()=>{ const ks=[...document.querySelectorAll('.ick:checked')].map(x=>x.dataset.k); const L=lines.filter(l=>ks.includes(l.key));
      document.getElementById('iSelBtn').disabled=!L.length;
      document.getElementById('iSelTxt').textContent=L.length?`選んだ伝票 ${L.length} 行・税抜 ${yen(L.reduce((s,l)=>s+l.net,0))} 円`:'伝票を選ぶと、この請求書から外して特別請求にできます';
      return L; };
    document.querySelectorAll('.ick').forEach(x=>x.onchange=pick);
    document.getElementById('iSelBtn').onclick=()=>openSpecialForm(c,pick());
  }
  document.getElementById('invCsv').onclick=()=>invoiceCsv(c,v,lines);
  document.getElementById('toSheet').onclick=()=>openInvoice(c,no);
}
document.getElementById('invModal').onclick=e=>{ if(e.target.id==='invModal') e.currentTarget.classList.remove('show'); };
document.addEventListener('keydown',e=>{ if(e.key==='Escape') document.getElementById('invModal').classList.remove('show'); });

// ============================================================
// 特別請求の登録・修正・取消（総務が入力。いずれは特別請求稟議のワークフローとつなぐ）
// ============================================================
function today(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function defaultDue(c,issue){ return c.cycle==null||!issue?'':ARCore.addMonths(issue,c.cycle,c.payDay); }
// 保存する伝票の中身（明細の期間から外れても特別請求の中身を出せるように）
function snap(l){ const o={}; ['key','date','slip','row','cust','custName','kind','item','itemName','qty','unit','price','net','po','drawing','model'].forEach(k=>o[k]=l[k]); return o; }
function openSpecialForm(c,lines,sp,opt){
  const edit=!!sp;
  lines=edit?(sp.lines||[]):lines.filter(l=>l.taxKind!=='消費税');
  // 金額だけ（伝票なし）：分割請求・前金など、SMILE の伝票と1対1にならないもの
  const amountOnly=edit?!lines.length:!!(opt&&opt.amountOnly);
  if(!lines.length&&!amountOnly){ alert('伝票を選んでください'); return; }
  // ほかの特別請求に入っている伝票は選べない
  const used={}; (SRC.specials||[]).filter(x=>x.status!=='取消'&&(!sp||x.id!==sp.id)).forEach(x=>(x.lines||[]).forEach(l=>used[l.key]=x));
  const dup=lines.filter(l=>used[l.key]);
  if(dup.length){ alert('次の伝票は、すでに特別請求「'+(used[dup[0].key].no||'')+'」に入っています。\n'+dup.map(l=>l.date+' 伝票'+l.slip).join('\n')); return; }
  let net=amountOnly?(edit?sp.net:0):lines.reduce((s,l)=>s+(Number(l.net)||0),0);
  const issue=edit?sp.issue:today();
  document.querySelector('#invModal .inv').classList.remove('sheetmode');
  document.getElementById('invBody').innerHTML=`
    <div class="inv-head"><div><h2>${edit?'特別請求を直す':'特別請求を作る'}　${esc(c.name)}</h2>
      <div class="meta"><span>得意先 ${esc(c.code)}</span><span>${amountOnly?'金額だけ（伝票なし）':'伝票 '+lines.length+' 行'}</span><span>回収条件 ${esc(c.closeLabel)} ${esc(c.termsLabel)}</span></div></div></div>
    <div class="form">
      <label>特別請求の番号<input id="fNo" value="${esc(edit?sp.no:'')}" placeholder="請求書に書いた番号・稟議番号など"></label>
      <label>請求日<input id="fIssue" type="date" value="${esc(issue)}"></label>
      <label>回収予定日<input id="fDue" type="date" value="${esc(edit?sp.due:defaultDue(c,issue))}"><span class="hint">得意先マスタの回収条件から入れています。違う場合は直してください</span></label>
      <label>税抜${amountOnly?`<input id="fNet" type="number" value="${net||''}"><span class="hint">請求書の税抜金額</span>`:`<input id="fNet" readonly value="${yen(net)}">`}</label>
      <label>消費税<input id="fTax" type="number" value="${edit?sp.tax:Math.floor(net*0.1)}"><span class="hint">税抜の10%（切り捨て）。違う場合は直してください</span></label>
      <label>請求額<input id="fTot" readonly></label>
      <label class="full">メモ<textarea id="fMemo" rows="2">${esc(edit?sp.memo:'')}</textarea></label>
    </div>
    ${amountOnly?'':`<div class="tw" style="max-height:220px;overflow:auto;border-top:1px solid var(--line)"><table><thead><tr><th>伝票日付</th><th>伝票№</th><th>品目</th><th>客先注番</th><th class="num">税抜</th></tr></thead><tbody>
      ${lines.map(l=>`<tr><td>${ymdJ(l.date)}</td><td class="mono">${esc(l.slip)}</td><td>${esc(l.itemName)}</td><td class="mono">${esc(l.po)}</td><td class="num">${yen(l.net)}</td></tr>`).join('')}</tbody></table></div>`}
    <div class="ferr" id="fErr"></div>
    <div class="inv-foot">${edit&&sp.status!=='取消'?'<button class="btn" id="fCancelSp" style="margin-right:auto;color:var(--red-ink)">この特別請求を取り消す</button>':''}<button class="btn" id="fClose">やめる</button><button class="btn pri" id="fSave">${edit?'保存':'登録'}</button></div>`;
  const modal=document.getElementById('invModal'); modal.classList.add('show');
  const tot=()=>{ document.getElementById('fTot').value=yen(net+(Number(document.getElementById('fTax').value)||0)); };
  tot(); let taxTouched=edit; document.getElementById('fTax').oninput=()=>{ taxTouched=true; tot(); };
  if(amountOnly) document.getElementById('fNet').oninput=e=>{ net=Math.round(Number(e.target.value)||0); if(!taxTouched) document.getElementById('fTax').value=Math.floor(net*0.1); tot(); };
  let dueTouched=edit; document.getElementById('fDue').oninput=()=>dueTouched=true;
  document.getElementById('fIssue').oninput=e=>{ if(!dueTouched) document.getElementById('fDue').value=defaultDue(c,e.target.value); };
  document.getElementById('fClose').onclick=()=>modal.classList.remove('show');
  const cb=document.getElementById('fCancelSp');
  if(cb) cb.onclick=async()=>{ if(!confirm('この特別請求を取り消しますか？\n伝票は元の SMILE の請求書（または未請求）に戻ります。')) return;
    await saveSpecial(c,sp,{Status:'取消'}); };
  document.getElementById('fSave').onclick=async()=>{
    const v={ no:document.getElementById('fNo').value.trim(), issue:document.getElementById('fIssue').value, due:document.getElementById('fDue').value,
      tax:Math.round(Number(document.getElementById('fTax').value)||0), memo:document.getElementById('fMemo').value.trim() };
    if(!v.issue||!v.due){ document.getElementById('fErr').textContent='請求日と回収予定日を入れてください'; return; }
    if(amountOnly&&!net){ document.getElementById('fErr').textContent='税抜金額を入れてください'; return; }
    const data={ lines:lines.map(snap), memo:v.memo, custName:c.name,
      createdBy:edit?sp.createdBy:(account&&account.name||''), createdAt:edit?sp.createdAt:new Date().toISOString(),
      updatedBy:account&&account.name||'', updatedAt:new Date().toISOString() };
    await saveSpecial(c,sp,{ Title:c.code+'-'+(v.no||v.issue), CustCode:c.code, InvoiceNo:v.no, IssueDate:v.issue, DueDate:v.due,
      NetAmount:net, TaxAmount:v.tax, Status:edit?sp.status:'登録', Data:JSON.stringify(data) });
  };
}
async function saveSpecial(c,sp,fields){
  const btns=[...document.querySelectorAll('#invBody .inv-foot button')]; btns.forEach(b=>b.disabled=true);
  try{
    if(sp&&fields.Status==='取消') fields.Data=JSON.stringify({lines:sp.lines,memo:sp.memo,custName:sp.custName,createdBy:sp.createdBy,createdAt:sp.createdAt,
      updatedBy:account&&account.name||'',updatedAt:new Date().toISOString()});
    if(!await writeList('special',sp&&sp.spId,fields)){ btns.forEach(b=>b.disabled=false); return; }
    document.getElementById('invModal').classList.remove('show');
    setStatus('loading','保存しました。読み直しています…',true);
    await loadSpecials(); rebuild();
  }catch(e){
    console.error(e);
    document.getElementById('fErr').textContent='保存できませんでした：'+e.message+'（書き込みの権限がない場合は総務に依頼してください）';
    btns.forEach(b=>b.disabled=false);
  }
}

// 特別請求の一覧（全得意先）
function renderSpList(){
  const el=document.getElementById('spBody'); if(!M){ el.innerHTML=''; return; }
  const q=norm(document.getElementById('spSearch').value), showCancel=document.getElementById('spShowCancel').checked;
  const rows=(SRC.specials||[]).filter(sp=>showCancel||sp.status!=='取消').map(sp=>{
    const c=M.customers[sp.cust]; const p=c&&c.periods.find(p=>p.invoices.some(v=>v.special&&v.special.id===sp.id));
    return {sp,c,p};
  }).filter(x=>!q||norm(x.sp.cust+' '+(x.c?x.c.name:x.sp.custName)+' '+x.sp.no+' '+x.sp.memo).includes(q))
    .sort((a,b)=>(b.sp.issue||'').localeCompare(a.sp.issue||''));
  el.innerHTML=`<div class="panel"><h3>特別請求 <small>${rows.length}件　登録は得意先の画面で、伝票を選んでから</small></h3>
    ${rows.length?`<div class="tw"><table><thead><tr><th>得意先</th><th>番号</th><th>請求日</th><th>回収予定日</th><th class="num">請求額</th><th class="num">入金額</th><th>状態</th><th>メモ</th><th>登録</th></tr></thead><tbody>
    ${rows.map(({sp,c,p})=>`<tr class="click${sp.status==='取消'?' dim':''}" data-c="${esc(sp.cust)}"><td><div class="mono muted" style="font-size:12px">${esc(sp.cust)}</div><b>${esc(c?c.name:sp.custName)}</b></td>
      <td>${esc(sp.no)}</td><td>${ymdJ(sp.issue)}</td><td>${ymdJ(sp.due)}</td><td class="num">${yen(sp.net+sp.tax)}</td><td class="num">${p?yen(p.paid):''}</td>
      <td>${sp.status==='取消'?'<span class="pill na">取消</span>':(p&&c?periodState(p,c):'')}</td><td class="muted" style="max-width:240px">${esc(sp.memo)}</td>
      <td class="muted" style="font-size:12px">${esc(sp.createdBy)}${sp.createdAt?'<br>'+ymdJ(sp.createdAt.slice(0,10)):''}</td></tr>`).join('')}
    </tbody></table></div>`:'<div class="empty">まだありません。得意先の画面の「まだ締めていない売上」か、請求書の明細で伝票を選んで作ります。</div>'}
    <div class="note">特別請求に入れた伝票は、SMILE の締めの請求書から外し、登録した回収予定日で入金を確かめます（消費税も特別請求のぶんを SMILE の請求書から差し引きます）。
    同じ回収予定日の入金は、SMILE の請求書と合わせて充てます。${specialErr?'<br><b>'+esc(specialErr)+'</b>':''}</div></div>`;
  el.querySelectorAll('tr[data-c]').forEach(tr=>tr.onclick=()=>openCust(tr.dataset.c));
}


// ============================================================
// 特別請求を CSV でまとめて登録（過去の特別請求書・稟議書から書き出した一覧を一度に入れる）
//   列：請求先ｺｰﾄﾞ, 番号, 請求日, 回収予定日, 伝票№（複数は「/」区切り）, 消費税（空なら税抜の10%切り捨て）, メモ
//   伝票№から、その請求先の明細の行を探す（同じ伝票№が年をまたいで出たら、請求日より前でいちばん近い日付）
// ============================================================
//   伝票№が空の行は「金額だけ」の特別請求（分割請求・前金）。その場合は「請求額」（税込）から税抜を出す
const BULK_COLS=['請求先ｺｰﾄﾞ','番号','請求日','回収予定日','伝票№','請求額','消費税','メモ'];
function netFromTotal(total,tax){ if(tax!=='') return total-Math.round(+tax); for(let n=Math.floor(total/1.1)-3;n<=Math.floor(total/1.1)+3;n++) if(n+Math.floor(n*0.1)===total) return n; return Math.round(total/1.1); }
function bulkDate(v){ v=String(v||'').trim().replace(/\//g,'-'); const m=v.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/); return m?m[1]+'-'+m[2].padStart(2,'0')+'-'+m[3].padStart(2,'0'):''; }
function bulkPlan(rows){
  const active=(SRC.specials||[]).filter(x=>x.status!=='取消');
  const used={}; active.forEach(x=>(x.lines||[]).forEach(l=>used[l.key]=x));
  return rows.map((r,i)=>{
    const code=String(r['請求先ｺｰﾄﾞ']||'').trim().padStart(6,'0');
    // 売上も入金もない得意先（損害賠償金など）は M にいないので、得意先マスタにあれば最小限の形で扱う
    const mr=!M.customers[code]&&(SRC.customers||[]).find(x=>x['得意先ｺｰﾄﾞ']===code);
    const c=M.customers[code]||(mr?{code,name:mr['得意先名１']||code,invoices:{},unbilled:[]}:null);
    const p={ i, code, c, no:String(r['番号']||'').trim(), issue:bulkDate(r['請求日']), due:bulkDate(r['回収予定日']), memo:String(r['メモ']||'').trim(),
      slips:String(r['伝票№']||'').split(/[\/、,\s]+/).map(x=>x.trim()).filter(Boolean), taxIn:String(r['消費税']==null?'':r['消費税']).replace(/,/g,'').trim(), lines:[], problems:[] };
    if(!c){ p.problems.push('請求先がありません'); return p; }
    if(!p.issue||!p.due) p.problems.push('請求日・回収予定日を確認');
    if(active.some(x=>x.cust===code&&p.no&&x.no===p.no)) p.problems.push('同じ番号で登録済み');
    const all=Object.values(c.invoices).filter(v=>!v.special).flatMap(v=>v.lines).concat(c.unbilled).filter(l=>l.taxKind!=='消費税');
    p.slips.forEach(sl=>{
      const hit=all.filter(l=>String(l.slip)===sl);
      if(!hit.length){ p.problems.push('伝票'+sl+'が明細にありません'); return; }
      const dates=[...new Set(hit.map(l=>l.date))].sort(); const before=dates.filter(d=>!p.issue||d<=p.issue);
      const d=(before.length?before[before.length-1]:dates[0]);
      hit.filter(l=>l.date===d).forEach(l=>{
        if(used[l.key]) p.problems.push('伝票'+sl+'は特別請求「'+(used[l.key].no||'')+'」に'+(used[l.key].batch?'この一覧の上の行で':'')+'登録済み');
        else p.lines.push(l); });
    });
    p.total=Math.round(+String(r['請求額']||'').replace(/,/g,'')||0);
    p.amountOnly=!p.slips.length;
    if(p.amountOnly){
      if(!p.total) p.problems.push('伝票№も請求額もありません');
      p.net=netFromTotal(p.total,p.taxIn); p.tax=p.total-p.net;
    }else{
      p.net=p.lines.reduce((s,l)=>s+l.net,0);
      p.tax=p.taxIn!==''&&!isNaN(+p.taxIn)?Math.round(+p.taxIn):Math.floor(p.net*0.1);
      if(p.total&&p.net+p.tax!==p.total) p.problems.push('伝票の合計 '+yen(p.net+p.tax)+' が請求額と合いません');
    }
    p.ok=!p.problems.length&&(p.lines.length>0||p.amountOnly);
    // 同じ CSV の中で同じ伝票を2回使わない（上の行を優先）
    if(p.ok) p.lines.forEach(l=>used[l.key]={no:p.no,batch:true});
    return p;
  });
}

  return new Promise((res,rej)=>{ const sc=document.createElement('script'); sc.src='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
    sc.onload=res; sc.onerror=()=>rej(new Error('Excel を読む部品を読み込めませんでした')); document.head.appendChild(sc); });

// ============================================================
// 違算一覧（拠点ごと。違算 Excel のシート分けと同じ）
//   1 行 ＝ 違算 1 件（得意先 × 回収予定日）。営業が原因・責任・入金予定日を書き、総務が確認する
// ============================================================
const RESP=['当方','先方','双方','調査中'];
const FSTATUS=['対応中','解消見込み','総務確認済'];
function fuOf(c,p){ return FOLLOW[followKey(c.code,p.due)]; }
function fuState(f){
  if(!f) return 'none';
  if(f.status==='総務確認済') return 'done';
  if(f.expected&&M&&f.expected<M.asof) return 'late';
  return 'wait';
}
function fuCell(f){
  if(!f) return '<span class="pill na">未記入</span>';
  const late=f.expected&&f.expected<M.asof&&f.status!=='総務確認済';
  const pill=f.status==='総務確認済'?'<span class="pill ok">総務確認済</span>':f.status==='解消見込み'?'<span class="pill wait">解消見込み</span>':'<span class="pill over">対応中</span>';
  return `<div class="fu">${pill}${f.resp?' <b>'+esc(f.resp)+'</b>':''}${f.expected?` <span class="${late?'late':'meta'}">入金予定 ${md(f.expected)}${late?'（過ぎています）':''}</span>`:''}
    ${f.cause?`<div class="cause">${esc(f.cause.length>80?f.cause.slice(0,80)+'…':f.cause)}</div>`:''}
    <div class="meta">${esc(f.updatedBy)} ${f.updatedAt?md(f.updatedAt.slice(0,10)):''}</div></div>`;
}
function gapRows(){
  if(!M) return [];
  const base=document.getElementById('gBase').value, st=document.getElementById('gStaff').value, q=norm(document.getElementById('gSearch').value),
        fs=document.getElementById('gFollow').value;
  return M.list.filter(c=>isGap(c)
    &&(!base||c.base===base)&&(!st||c.staffName===st)&&(!gKind||c.status===gKind)
    &&(!q||norm(c.code+c.name+c.short).includes(q))
    &&(!fs||c.openPeriods.some(p=>fuState(fuOf(c,p))===fs)))
    .sort((a,b)=>Math.abs(b.diff)-Math.abs(a.diff));
}
function renderGap(){
  const el=document.getElementById('gapBody');
  if(!M){ el.innerHTML=''; return; }
  const L=gapRows();
  const under=L.filter(c=>c.diff>0), over=L.filter(c=>c.diff<0);
  const sum=a=>a.reduce((s,c)=>s+c.diff,0);
  const items=L.flatMap(c=>c.openPeriods.map(p=>({c,p,f:fuOf(c,p)})));
  const kpi=(k,v,s,cls)=>`<div class="card ${cls||''}"><div class="k">${k}</div><div class="v">${v}</div><div class="s">${s}</div></div>`;
  let html=`<div class="kpis">
    ${kpi('違算の得意先',L.length+' 件',ymdJ(M.asof)+' 時点・'+L.filter(c=>c.daysOver>=30).length+'件は30日以上')}
    ${kpi('未入金',under.length+' 件',yen(sum(under))+' 円','under')}
    ${kpi('過入金',over.length+' 件',yen(-sum(over))+' 円','over')}
    ${kpi('フォロー未記入',items.filter(x=>!x.f).length+' 件',`入金予定日を過ぎた ${items.filter(x=>fuState(x.f)==='late').length} 件・総務確認済 ${items.filter(x=>fuState(x.f)==='done').length} 件`,items.some(x=>!x.f)?'under':'ok')}
  </div>`;
  for(const b of ARCore.BASES){
    const G=L.filter(c=>c.base===b); if(!G.length) continue;
    html+=`<div class="panel"><h3 class="basehead">${esc(b)} <small>${G.length}件</small>
      <span class="tot">未入金 <b>${yen(sum(G.filter(c=>c.diff>0)))}</b>　過入金 <b>${yen(-sum(G.filter(c=>c.diff<0)))}</b></span></h3>
      <div class="tw"><table><thead><tr><th>回収予定日</th><th class="num">経過</th><th class="num">請求額</th><th class="num">入金額</th><th class="num">差額</th><th>フォロー（原因・過失責任・入金予定日）</th><th></th></tr></thead><tbody>
      ${G.map(c=>`<tr class="crow click" data-c="${esc(c.code)}"><td colspan="4"><span class="mono muted" style="font-size:12px">${esc(c.code)}</span> <b>${esc(c.name)}</b>
          <span class="muted" style="font-size:12px">　${esc(c.staffName)}　${esc(c.closeLabel)}・${esc(c.termsLabel)}</span>
          ${c.termsNote?`<div class="reason">${esc(c.termsNote)}</div>`:''}</td>
          <td class="num"><b class="${c.diff>0?'neg':''}">${yen(Math.abs(c.diff))}</b></td><td colspan="2">${c.diff>0?'<span class="pill under">未入金</span>':'<span class="pill over">過入金</span>'}</td></tr>`
        +c.openPeriods.map(p=>`<tr class="prow"><td>${ymdJ(p.due)}<div class="reason">${p.invoices.map(v=>esc(v.label)).join('・')}</div></td>
          <td class="num">${ARCore.daysBetween(p.due,M.asof)}日</td><td class="num">${yen(p.amount)}</td><td class="num">${yen(p.paid)}</td>
          <td class="num ${p.diff>0?'neg':''}">${yen(p.diff)}</td><td>${fuCell(fuOf(c,p))}</td>
          <td><button class="btn" data-fu="${esc(c.code)}|${esc(p.due)}">記入</button></td></tr>`).join('')).join('')}
      </tbody></table></div></div>`;
  }
  if(!L.length) html+='<div class="panel"><div class="empty">この条件の違算はありません</div></div>';
  html+=resolvedPanel();
  html+=`<div class="panel"><div class="note">
    <b>違算の判定</b>：回収予定日（得意先マスタの締日・入金サイクル・入金日から計算。休日なら翌営業日）を過ぎても、請求額と入金額が合わないもの。
    「支払条件追記」に「○万以上 N日後振込」とある得意先は、その金額以上の請求の回収予定日を N 日後にしています（でんさい・期日指定はいつもの期日に受け取るのでそのまま）。
    遅れて入金があり、累計が 0 に戻ったものは一覧から消え、フォローを書いたものは下の「解消したもの」に移ります。<br>
    <b>フォロー</b>：違算 1 件（得意先×回収予定日）ごとに、営業が原因・過失責任・対策・入金予定日を書き、総務が確認したら「総務確認済」にします。書いた人と日時は履歴に残ります。<br>
    <b>対象外</b>：回収管理を「行わない」得意先、EC・店頭販売、回収条件が登録されていない得意先（海外など）。
    データの最初の日（請求明細 ${ymdJ(M.dataStart)}）より前の売上を含む請求書は、請求額がわからないため判定していません。</div></div>`;
  el.innerHTML=html;
  el.querySelectorAll('tr[data-c]').forEach(tr=>tr.onclick=()=>openCust(tr.dataset.c));
  el.querySelectorAll('[data-fu]').forEach(b=>b.onclick=e=>{ e.stopPropagation(); const [code,due]=b.dataset.fu.split('|'); openFollowForm(code,due); });
}
// 解消したもの（フォローを書いたが、今は違算でなくなったもの）。Excel の「前月違算解消分」にあたる
function resolvedPanel(){
  const open=new Set(); M.list.forEach(c=>c.openPeriods.forEach(p=>open.add(followKey(c.code,p.due))));
  const from=ARCore.addMonths(M.asof,-6,1);
  const R=Object.values(FOLLOW).filter(f=>!open.has(f.key)&&f.due>=from).sort((a,b)=>b.due.localeCompare(a.due));
  if(!R.length) return '';
  return `<div class="panel"><h3>解消したもの <small>フォローを書いた違算で、今は請求額と入金額が合っているもの（回収予定日が直近6か月）</small></h3>
    <div class="tw"><table><thead><tr><th>得意先</th><th>回収予定日</th><th class="num">記入したときの差額</th><th>フォロー</th><th></th></tr></thead><tbody>
    ${R.map(f=>{ const c=M.customers[f.cust]; return `<tr class="click" data-c="${esc(f.cust)}"><td><span class="mono muted" style="font-size:12px">${esc(f.cust)}</span> <b>${esc(c?c.name:f.custName)}</b></td>
      <td>${ymdJ(f.due)}</td><td class="num">${f.amount==null?'':yen(f.amount)}</td><td>${fuCell(f)}</td><td><button class="btn" data-fu="${esc(f.cust)}|${esc(f.due)}">見る</button></td></tr>`; }).join('')}
    </tbody></table></div></div>`;
}

// フォローの記入
function openFollowForm(code,due){
  const c=M.customers[code]; if(!c) return;
  const p=c.periods.find(x=>x.due===due);
  const f=FOLLOW[followKey(code,due)]||null;
  const opt=(arr,v,blank)=>(blank?`<option value="">${blank}</option>`:'')+arr.map(x=>`<option${x===v?' selected':''}>${esc(x)}</option>`).join('');
  document.querySelector('#invModal .inv').classList.remove('sheetmode');
  document.getElementById('invBody').innerHTML=`
    <div class="inv-head"><div><h2>違算のフォロー　${esc(c.name)}</h2>
      <div class="meta"><span>得意先 ${esc(c.code)}</span><span>担当 ${esc(c.staffName)}</span><span>回収予定日 ${ymdJ(due)}</span>
        ${p?`<span>請求書 ${p.invoices.map(v=>esc(v.label)).join('・')}</span>`:''}</div></div>
      ${p?`<div class="inv-tot"><span>請求額</span><b>${yen(p.amount)}</b><span>入金額</span><b>${yen(p.paid)}</b><span>差額</span><b class="${p.diff>0?'neg':''}">${yen(p.diff)}</b></div>`:''}</div>
    <div class="form">
      <label>過失責任<select id="uResp">${opt(RESP,f&&f.resp,'選んでください')}</select></label>
      <label>入金予定日<input id="uExp" type="date" value="${esc(f?f.expected:'')}"><span class="hint">過入金で返金・相殺する場合はその予定日</span></label>
      <label class="full">原因・内容<textarea id="uCause" rows="3" placeholder="例）先方の計上漏れ。8/31 計上とのこと">${esc(f?f.cause:'')}</textarea></label>
      <label class="full">対策<textarea id="uMeasure" rows="2" placeholder="例）締め日前に先方へ再確認を依頼">${esc(f?f.measure:'')}</textarea></label>
      <label>状態<select id="uStatus">${opt(FSTATUS,f?f.status:'対応中')}</select><span class="hint">「総務確認済」は総務が確認したときに</span></label>
      <label>今回のひとこと（履歴に残ります）<input id="uNote" placeholder="例）先方経理に電話。来月10日に入金"></label>
    </div>
    ${f&&f.history.length?`<div class="hist">${[...f.history].reverse().map(h=>`<div><b>${esc(h.by)}</b> ${esc((h.at||'').slice(0,16).replace('T',' '))}　${esc(h.text||'')}${h.status?'　['+esc(h.status)+']':''}</div>`).join('')}</div>`:''}
    <div class="ferr" id="fErr"></div>
    <div class="inv-foot"><button class="btn" id="uOpen" style="margin-right:auto">得意先の画面を開く</button><button class="btn" id="fClose">やめる</button><button class="btn pri" id="uSave">保存</button></div>`;
  const modal=document.getElementById('invModal'); modal.classList.add('show');
  document.getElementById('fClose').onclick=()=>modal.classList.remove('show');
  document.getElementById('uOpen').onclick=()=>{ modal.classList.remove('show'); openCust(code); };
  document.getElementById('uSave').onclick=async()=>{
    const v={ resp:document.getElementById('uResp').value, expected:document.getElementById('uExp').value, cause:document.getElementById('uCause').value.trim(),
      measure:document.getElementById('uMeasure').value.trim(), status:document.getElementById('uStatus').value, note:document.getElementById('uNote').value.trim() };
    if(!v.cause&&!v.note){ document.getElementById('fErr').textContent='原因・内容か、今回のひとことを書いてください'; return; }
    const by=account&&account.name||'', at=new Date().toISOString();
    // 履歴：何を変えたかが追えるように、ひとことと状態・責任・予定日を残す
    const changed=[]; if(!f||f.status!==v.status) changed.push(v.status); if(!f||f.resp!==v.resp) v.resp&&changed.push('責任 '+v.resp);
    if(!f||f.expected!==v.expected) v.expected&&changed.push('予定日 '+v.expected);
    const history=(f?f.history:[]).concat([{by,at,text:v.note||(f?'内容を更新':'記入'),status:changed.join('・')}]);
    const data={ cause:v.cause, measure:v.measure, amount:p?p.diff:(f?f.amount:null), custName:c.name, history, updatedBy:by, updatedAt:at };
    const btns=[...document.querySelectorAll('#invBody .inv-foot button')]; btns.forEach(b=>b.disabled=true);
    try{
      const ok=await writeList('follow',f&&f.spId,{ Title:followKey(code,due), CustCode:code, DueDate:due, Responsibility:v.resp, ExpectedDate:v.expected, Status:v.status, Data:JSON.stringify(data) });
      if(!ok){ btns.forEach(b=>b.disabled=false); return; }
      modal.classList.remove('show');
      await loadFollows(); render();
    }catch(e){
      console.error(e);
      document.getElementById('fErr').textContent='保存できませんでした：'+e.message+'（書き込みの権限がない場合は総務に依頼してください）';
      btns.forEach(b=>b.disabled=false);
    }
  };
}
document.getElementById('csvBtn').onclick=()=>{
  const rows=[['拠点','得意先コード','得意先','担当','締め','回収条件','支払条件追記','回収予定日','経過日数','請求書','請求額','入金額','差額','得意先の違算額','状態','過失責任','原因・内容','対策','入金予定日','フォローの状態','最終更新']];
  gapRows().forEach(c=>c.openPeriods.forEach((p,i)=>{ const f=fuOf(c,p)||{};
    rows.push([c.base,c.code,c.name,c.staffName,c.closeLabel,c.termsLabel,c.termsNote,p.due,ARCore.daysBetween(p.due,M.asof),p.invoices.map(v=>v.label).join('・'),
      p.amount,p.paid,p.diff,i===0?Math.abs(c.diff):'',i===0?c.status:'',f.resp||'',f.cause||'',f.measure||'',f.expected||'',f.status||'未記入',
      f.updatedBy?f.updatedBy+' '+(f.updatedAt||'').slice(0,10):'']); }));
  downloadCsv(`違算一覧_${M.asof}.csv`,rows);
};
function downloadCsv(name,rows){
  const csv='﻿'+rows.map(r=>r.map(x=>'"'+String(x==null?'':x).replace(/"/g,'""')+'"').join(',')).join('\r\n');
  const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'})); a.download=name; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}

// スマホ：右上の「⋯」でボタンを開く
(()=>{ const header=document.querySelector('header'), mb=document.getElementById('menuBtn');
  mb.onclick=e=>{ e.stopPropagation(); mb.setAttribute('aria-expanded',header.classList.toggle('menu-open')); };
  document.addEventListener('click',e=>{ if(!e.target.closest('#hdrActions')) header.classList.remove('menu-open'); });
})();

init();
</script>

<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<title>出図・出荷検索</title>
<meta name="viewport" content="width=device-width,initial-scale=1" />
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@azure/msal-browser@3.10.0/lib/msal-browser.min.js" crossorigin="anonymous"></script>
<style>
:root{--brand:#ff6b81;--brand-dark:#e8556d;--bg:#fff7fb;--line:#e6e6e9;--soft:#f7fbff;
  --muted:#666;--faint:#98989f;--danger:#d64545;--text:#222;
  --ok:#1f7a4d;--ok-soft:#e6f5ec;--ok-line:#b6e0c7;
  --warn:#8a5a00;--warn-soft:#fff7df;--warn-line:#ffe3a3}
*{box-sizing:border-box}
body{margin:0;font-family:"Noto Sans JP","Segoe UI","Hiragino Kaku Gothic ProN",sans-serif;
  background:var(--bg);color:var(--text);font-size:15px;line-height:1.75}
.container{max-width:1100px;margin:18px auto;padding:0 14px}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px;
  box-shadow:0 8px 22px rgba(255,107,129,.08)}
.header{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:flex-start}
h1{margin:0;color:var(--brand);font-size:22px}
.note,.muted{color:var(--muted);font-size:13px}
.faint{color:var(--faint)}
.badge{display:inline-block;padding:5px 10px;border:1px solid var(--line);border-radius:999px;
  background:var(--soft);font-weight:700;margin-left:6px;font-size:12.5px}
button{padding:9px 14px;border:0;background:var(--brand);color:#fff;border-radius:10px;cursor:pointer;font:inherit;font-weight:700}
button:hover{background:var(--brand-dark)}
button.ghost{background:#fff;border:1px solid var(--line);color:#333}
button.ghost:hover{background:#f7f7f9}
button:focus-visible{outline:2px solid var(--brand);outline-offset:2px}

/* サインイン前 */
.gate{display:none;flex-direction:column;align-items:center;gap:14px;padding:52px 20px;text-align:center}
.gate h2{margin:0;font-size:19px;font-weight:800}
.gate p{margin:0;color:var(--muted);font-size:14px;line-height:1.8}
.gate button{padding:13px 30px;font-size:15px}
body:not(.ready) .gate{display:flex}
body:not(.ready) .app{display:none}

/* タブ */
nav.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);flex-wrap:wrap;margin:14px 0 18px}
nav.tabs button{background:none;border:0;border-bottom:2px solid transparent;color:var(--muted);
  padding:11px 16px;margin-bottom:-1px;font-weight:500}
nav.tabs button[aria-selected="true"]{color:var(--text);border-bottom-color:var(--brand);font-weight:800}
nav.tabs button:hover{color:var(--text)}
.panel{display:none}.panel.on{display:block}
.cnt2{margin-left:auto;color:var(--faint);font-size:12px}
.dtbl{width:100%;border-collapse:collapse;font-size:13px}
.dtbl th{text-align:left;color:var(--faint);font-size:11px;font-weight:700;
 padding:0 8px 6px;border-bottom:1px solid var(--line);white-space:nowrap}
.dtbl td{padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
.dtbl tbody tr:hover{background:#f7f9fc}
.dtbl tr.clk{cursor:pointer}
.tall2{max-height:540px;overflow:auto}
.chip2{display:inline-block;border-radius:6px;padding:1px 8px;font-size:11px;font-weight:700;
 white-space:nowrap;background:#eef2f7;color:#4a5568}
.chip2.sh{background:#fdf0e4;color:#a85a11}
.chip2.rv{background:#e8f1fc;color:#1d3a8a}
.figwrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;padding:10px;background:#fff}
.figwrap svg{min-width:960px}
button.sw{font-size:12.5px;padding:5px 12px}
button.sw.on{background:#1d3a8a;color:#fff;border-color:#1d3a8a}
.dsum{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:10px;font-size:12.5px;color:var(--muted)}
.dsum b{color:#1d3a8a;font-size:17px;font-weight:700}

/* 検索 */
.searchbox{display:flex;flex-direction:column;gap:9px;margin-bottom:18px}
.searchbox label{font-size:13px;font-weight:700;color:#444}
input[type=text]{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:10px;
  background:#fff;font:inherit;font-size:17px;font-variant-numeric:tabular-nums}
input:focus{outline:2px solid var(--brand);outline-offset:-1px;border-color:var(--brand)}
.hint{font-size:12.5px;color:var(--faint);display:flex;gap:7px;flex-wrap:wrap;align-items:center}
.ex{background:#f0f0f3;border:0;color:#555;padding:3px 9px;border-radius:6px;cursor:pointer;
  font-size:12.5px;font-weight:500;font-variant-numeric:tabular-nums}
.ex:hover{color:var(--brand);background:#fff0f3}

/* たどった経路 */
.trail{display:flex;align-items:center;gap:7px;flex-wrap:wrap;font-size:12px;color:var(--faint);margin-bottom:14px}
.trail span.node{background:#fff;border:1px solid var(--line);padding:3px 10px;border-radius:999px;color:#555}
.trail span.node.hit{border-color:var(--brand);color:var(--brand-dark);font-weight:700}

/* ブロック */
.blk{background:#fff;border:1px solid var(--line);border-radius:12px;margin-bottom:14px;overflow:hidden}
.blk>h3{margin:0;font-size:12.5px;font-weight:800;letter-spacing:.03em;color:var(--muted);
  padding:11px 16px;background:#fbfbfd;border-bottom:1px solid var(--line)}
.blk .body{padding:16px}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:13px 20px}
.kv div{display:flex;flex-direction:column;min-width:0}
.kv .k{font-size:11.5px;color:var(--faint)}
.kv .v{font-size:16px;font-weight:700;overflow-wrap:anywhere;line-height:1.5}
.kv .v.big{font-size:23px;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.kv .v.na{color:var(--faint);font-weight:400;font-size:14px}
.pill{display:inline-block;font-size:11.5px;padding:2px 9px;border-radius:6px;font-weight:700}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}

/* 図面 */
.dgroup{font-size:11.5px;font-weight:800;letter-spacing:.05em;color:var(--faint);padding:11px 16px 3px}
.drow{display:grid;grid-template-columns:1fr auto;gap:8px 14px;align-items:center;
  padding:9px 16px;border-bottom:1px solid #f2f2f5}
.drow:last-child{border-bottom:0}
.drow .fn{font-size:13.5px;overflow-wrap:anywhere;font-weight:500}
.drow .fn .meta{display:block;font-size:11.5px;color:var(--faint);font-weight:400;font-variant-numeric:tabular-nums}
.drow .fn .tag{display:inline-block;margin-left:6px;font-size:11px;padding:1px 7px;border-radius:5px;
  background:#fff0f3;color:var(--brand-dark);font-weight:700}
.drow a.open{font-size:12.5px;font-weight:700;text-decoration:none;padding:6px 13px;border-radius:8px;
  border:1px solid var(--brand);color:var(--brand-dark);background:#fff;white-space:nowrap}
.drow a.open:hover{background:#fff0f3}
.caution{display:flex;gap:9px;padding:11px 16px;background:var(--warn-soft);
  border-bottom:1px solid var(--warn-line);font-size:12.5px;line-height:1.8;color:#5a4a20}
.caution b{color:var(--warn);white-space:nowrap;font-size:11.5px}

/* 表 */
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:640px}
th,td{padding:9px 14px;text-align:left;border-bottom:1px solid #f2f2f5;white-space:nowrap}
thead th{background:#fbfbfd;font-size:11.5px;color:var(--muted);font-weight:800;
  border-bottom:1px solid var(--line);position:sticky;top:0}
tbody tr:last-child td{border-bottom:0}
tbody tr.click{cursor:pointer}
tbody tr.click:hover{background:#fffafc}
td.m{font-variant-numeric:tabular-nums}
.scroll-y{max-height:460px;overflow-y:auto}
.empty{padding:36px 16px;text-align:center;color:var(--faint);font-size:14px;line-height:1.9}
.spin{display:inline-block;width:13px;height:13px;border:2px solid var(--line);
  border-top-color:var(--brand);border-radius:50%;animation:sp .7s linear infinite;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){.spin{animation:none}}
@media(max-width:640px){.drow{grid-template-columns:1fr}.drow a.open{justify-self:start}}

/* --- 図面の履歴パネル（右からスライド） --- */
.side{position:fixed;top:0;right:0;bottom:0;width:min(440px,100%);background:#fff;
  z-index:960;box-shadow:-14px 0 40px rgba(0,0,0,.18);transform:translateX(102%);
  transition:transform .18s ease;overflow:auto;padding:22px 24px}
.side.on{transform:none}
.side h2{margin:0 0 2px;font-size:17px}
.side .zu{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px;color:var(--faint)}
.side .close{position:absolute;top:16px;right:18px;border:1px solid var(--line);background:#fff;
  color:#888;border-radius:8px;width:30px;height:30px;line-height:1;padding:0;font-size:16px;cursor:pointer}
.ver{border-top:1px solid #f0f0f2;padding:13px 0}
.ver:first-of-type{border-top:none}
.ver .vh{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap}
.ver .vn{font-weight:800;font-size:15px}
.ver .vd{color:var(--faint);font-size:12.5px}
.ver .vlatest{background:#fff0f3;color:var(--brand-dark,#e8556d);border-radius:6px;
  padding:1px 7px;font-size:10.5px;font-weight:700}
.ver .vmemo{font-size:13.5px;margin:3px 0 6px;white-space:pre-wrap}
.ver .vmemo.na{color:#aaa}
.ver .vfile{font-size:11px;color:#aaa;word-break:break-all;margin-bottom:6px}
.ver a.open{font-size:13px;font-weight:700;text-decoration:none;padding:6px 13px;border-radius:8px;
  border:1px solid var(--line);color:var(--brand);display:inline-block}
button.hist{border:1px solid var(--line);background:#fff;color:#555;border-radius:7px;
  padding:5px 11px;font-size:12px;font-weight:700;white-space:nowrap;cursor:pointer;
  font-family:inherit}
button.hist:hover{border-color:var(--brand);color:var(--brand)}
.drow .rgt{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.drow .vtag{display:inline-block;background:var(--soft);border:1px solid var(--line);
  border-radius:6px;padding:1px 7px;font-size:11px;color:#666;font-weight:700;margin-left:6px}
</style>
</head>
<body>
<div class="container"><div class="card">

  <div class="header">
    <div><h1>出図・出荷検索</h1>
      <div class="note">製造番号・車体番号・図番から、出図情報と図面をたどれます</div></div>
    <div>
      <span id="authBadge" class="badge" style="background:#fff7df;border-color:#ffe3a3;color:#614900">未サインイン</span>
      <button id="btnAuth" class="ghost" style="padding:5px 11px;margin-left:6px;font-size:13px">サインイン</button>
    </div>
  </div>

  <div class="gate">
    <h2 id="gateTitle">サインインしてください</h2>
    <p id="gateMsg">会社のアカウントでサインインすると、出図と図面を検索できます。</p>
    <button id="btnGateSignIn">サインイン</button>
  </div>

  <div class="app">
    <nav class="tabs" role="tablist">
      <button role="tab" aria-selected="true" data-p="p1">1台を探す</button>
      <button role="tab" aria-selected="false" data-p="p2">出図から探す</button>
      <button role="tab" aria-selected="false" data-p="p3">図面リスト</button>
      <button role="tab" aria-selected="false" data-p="p4">改訂</button>
      <button role="tab" aria-selected="false" data-p="p5">変遷</button>
    </nav>

    <div class="panel on" id="p1">
      <div class="searchbox">
        <label for="q">製造番号 または 車体番号</label>
        <input type="text" id="q" placeholder="81167 / CD-25-424" autocomplete="off" inputmode="search">
        <div class="hint"><span>銘板に打たれている番号がそのまま入口になります</span></div>
      </div>
      <div id="result"><div class="blk"><div class="empty">
        製造番号か車体番号を入力してください。<br>
        お客様から届く銘板の情報がそのまま入口になります。
      </div></div></div>
    </div>

    <div class="panel" id="p2">
      <div class="searchbox">
        <label for="q2">出図の絞り込み</label>
        <input type="text" id="q2" placeholder="受注先・型式・図番・出図番号など" autocomplete="off">
      </div>
      <div id="shutsuzuList"></div>
    </div>

    <!-- 図面リスト：部品表から起こした図番の索引。図面ファイルそのものは持たない -->
    <div class="panel" id="p3">
      <div class="searchbox">
        <label for="q3">図番・名称で探す</label>
        <input type="text" id="q3" placeholder="ラチェット / H240111" autocomplete="off">
        <div class="hint">
          <label style="font-weight:400"><input type="checkbox" id="f3s"> 2つ以上の仕様で共有されているものだけ</label>
          <label style="font-weight:400;margin-left:12px"><input type="checkbox" id="f3r"> 改訂があるものだけ</label>
          <span id="c3" class="cnt2"></span></div>
      </div>
      <div id="drawList"></div>
    </div>

    <!-- 改訂：部品表の「変区／変更日／変更内容」から起こしたもの -->
    <div class="panel" id="p4">
      <div class="searchbox">
        <label for="q4">変更内容・図番で探す</label>
        <input type="text" id="q4" placeholder="共通化 / 寸法 / H560105" autocomplete="off">
        <div class="hint"><span>部品表に書かれている変更履歴です</span><span id="c4" class="cnt2"></span></div>
      </div>
      <div id="revList"></div>
    </div>

    <!-- 変遷：同じデータを時間の上に置いたもの -->
    <div class="panel" id="p5">
      <div class="searchbox" style="padding-bottom:10px">
        <div class="hint" style="margin:0">
          <button class="ghost small sw on" data-tr="prod">製品の変遷</button>
          <button class="ghost small sw" data-tr="part">部品の変遷</button>
          <span id="c5" style="margin-left:8px"></span></div>
      </div>
      <div id="trWrap" class="figwrap"></div>
    </div>
  </div>

  <div class="note faint" style="margin-top:22px;border-top:1px solid var(--line);padding-top:14px">
    参照専用の画面です。ここからデータを書き換えることはできません。<br>
    図面を開くには DocuWorks Viewer Light とブラウザ拡張機能が必要です。
  </div>
</div></div>

<script>
/* ============================================================
   図面リスト・改訂・変遷（部品表から起こしたもの）
   ------------------------------------------------------------
   いまは部品表60冊を読んだ結果をこのファイルに持たせている。
   SharePoint にリストを作ったら、BOM をそこからの読み込みに
   差し替えるだけで、下の描画はそのまま使える。
   ここも参照専用。図面ファイルの実体は「図面ライブラリ」側にある。

/* ---------- 変遷 ---------- */
function famsOf2(r){
  const f=new Set();
  r.specs.forEach(sp=>{ const q=SMAP2[sp]; if(q&&q.fam) f.add(q.fam) });
  return [...f];
}
const REVF2 = BOM.revs.map(r=>Object.assign({fams:famsOf2(r)},r));

function axis2(X,d0,d1,H,L,R){
  let s="";
  for(let y=new Date(d0).getFullYear(); y<=new Date(d1).getFullYear(); y++){
    const x=X(y+"-01-01");
    if(x>L-30&&x<R+30) s+='<line x1="'+x.toFixed(0)+'" y1="42" x2="'+x.toFixed(0)+'" y2="'+(H-20)+
      '" stroke="#e6e9ef"/><text x="'+(x+6).toFixed(0)+'" y="34" font-size="12" '+
      'font-weight="700" fill="#98989f">'+y+'年</text>';
  }
  return s;
}

function drawTrend(){
  $("trWrap").innerHTML = TREND==="prod" ? prodSVG2() : partSVG2();
  $("c5").textContent = TREND==="prod"
    ? "製品ごとに、いつ何かが変わったか。丸を押すとその日の中身が出ます。"
    : "図面ごとに、いつ変わったか。丸を押すと、その図面の詳細が出ます。";
  document.querySelectorAll("[data-ev2]").forEach(el=>el.onclick=()=>openEv2(el.dataset.ev2));
  document.querySelectorAll("[data-dz]").forEach(el=>el.onclick=()=>openDraw(el.dataset.dz));
}

function prodSVG2(){
  const fams=[...new Set(REVF2.flatMap(r=>r.fams))].sort();
  const byFD={};
  REVF2.forEach(r=>r.fams.forEach(f=>{ (byFD[f+"|"+r.date]=byFD[f+"|"+r.date]||[]).push(r) }));
  const ds=BOM.revs.map(r=>+new Date(r.date));
  const d0=Math.min(...ds)-86400e3*30, d1=Math.max(...ds)+86400e3*30;
  const L=150,R=900,TOP=66,RH=38, X=d=>L+(+new Date(d)-d0)*(R-L)/(d1-d0);
  const H=TOP+fams.length*RH+22, W=1020;
  let s='<svg viewBox="0 0 '+W+' '+H+'" width="100%" xmlns="http://www.w3.org/2000/svg" '+
    'font-family="system-ui, sans-serif">'+axis2(X,d0,d1,H,L,R);
  fams.forEach((f,i)=>{
    const y=TOP+i*RH;
    s+='<line x1="'+L+'" y1="'+y+'" x2="'+R+'" y2="'+y+'" stroke="#e6e9ef" stroke-width="1.6"/>'+
       '<text x="'+(L-12)+'" y="'+(y+5)+'" text-anchor="end" font-size="13.5" font-weight="700" '+
       'fill="#222">'+E2(f)+'</text>';
    const keys=Object.keys(byFD).filter(k=>k.startsWith(f+"|"));
    const n=keys.reduce((a,k)=>a+byFD[k].length,0);
    s+='<text x="'+(R+14)+'" y="'+(y+5)+'" font-size="11.5" fill="#666" font-weight="700">'+n+'件</text>';
    keys.forEach(k=>{
      const g=byFD[k], d=k.split("|")[1], rr=5+Math.sqrt(g.length)*2.1, c=KIND2(g[0].what)[1];
      s+='<g data-ev2="'+E2(k)+'" style="cursor:pointer">'+
         '<circle cx="'+X(d).toFixed(1)+'" cy="'+y+'" r="'+rr.toFixed(1)+'" fill="'+c+
         '" fill-opacity=".88" stroke="#fff" stroke-width="1.6"/>'+
         (g.length>1?'<text x="'+X(d).toFixed(1)+'" y="'+(y+3.4)+'" text-anchor="middle" '+
           'font-size="9.5" fill="#fff" font-weight="700">'+g.length+'</text>':'')+
         '<title>'+E2(d+"　"+g.length+"件")+'</title></g>';
    });
  });
  return s+'</svg>';
}

function partSVG2(){
  const R2=BOM.revs.filter(r=>r.zu);
  const zus=[...new Set(R2.map(r=>r.zu))];
  const base={}; zus.forEach(z=>{ const b=z.split("-")[0]; (base[b]=base[b]||[]).push(z) });
  const ds=R2.map(r=>+new Date(r.date));
  const d0=Math.min(...ds)-86400e3*20, d1=Math.max(...ds)+86400e3*20;
  const L=160,Rx=810,TOP=62,RH=18, X=d=>L+(+new Date(d)-d0)*(Rx-L)/(d1-d0);
  let rows=[],i=0;
  Object.keys(base).sort().forEach(b=>{ rows.push({t:"g",k:b,i:i++});
    base[b].sort((a,c)=>(RMAP2[c]||[]).length-(RMAP2[a]||[]).length)
      .forEach(z=>rows.push({t:"z",k:z,i:i++})); });
  const Y=n=>TOP+n*RH, H=Y(i)+20, W=1020;
  const pos={}; rows.forEach(r=>{ if(r.t==="z") pos[r.k]=Y(r.i) });
  let s='<svg viewBox="0 0 '+W+' '+H+'" width="100%" xmlns="http://www.w3.org/2000/svg" '+
    'font-family="system-ui, sans-serif">'+axis2(X,d0,d1,H,L,Rx);
  const grp={}; R2.forEach(r=>{ const k=r.date+"|"+r.what; (grp[k]=grp[k]||[]).push(r) });
  Object.values(grp).filter(g=>g.length>1).forEach(g=>{
    const ys=g.map(r=>pos[r.zu]).sort((a,b)=>a-b), x=X(g[0].date);
    s+='<line x1="'+x.toFixed(1)+'" y1="'+ys[0]+'" x2="'+x.toFixed(1)+'" y2="'+ys[ys.length-1]+
       '" stroke="'+KIND2(g[0].what)[1]+'" stroke-width="'+(g.length>=3?6:3)+'" stroke-opacity=".24"/>';
  });
  rows.forEach(r=>{
    const y=Y(r.i);
    if(r.t==="g"){ s+='<text x="10" y="'+(y+4)+'" font-size="11" font-weight="700" fill="#1d3a8a">'+
      E2(r.k)+'</text><line x1="10" y1="'+(y+8)+'" x2="'+(Rx+6)+'" y2="'+(y+8)+'" stroke="#eef1f5"/>'; return }
    const v=(RMAP2[r.k]||[]).slice().sort((a,b)=>a.date<b.date?-1:1);
    s+='<line x1="'+L+'" y1="'+y+'" x2="'+Rx+'" y2="'+y+'" stroke="#eef1f5"/>';
    if(v.length>1) s+='<line x1="'+X(v[0].date).toFixed(1)+'" y1="'+y+'" x2="'+
      X(v[v.length-1].date).toFixed(1)+'" y2="'+y+'" stroke="#1d3a8a" stroke-width="2.2"/>';
    v.forEach(x=>{ const rr=3.2+Math.sqrt(x.specs.length)*1.25;
      s+='<circle cx="'+X(x.date).toFixed(1)+'" cy="'+y+'" r="'+rr.toFixed(1)+'" fill="'+KIND2(x.what)[1]+
         '" fill-opacity=".9" stroke="#fff" stroke-width="1" data-dz="'+E2(r.k)+
         '" style="cursor:pointer"><title>'+E2(x.date+" "+x.what)+'</title></circle>'; });
    const d=DMAP2[r.k];
    s+='<text x="'+(L-8)+'" y="'+(y+4)+'" text-anchor="end" font-size="10" font-weight="700" '+
       'fill="#222" data-dz="'+E2(r.k)+'" style="cursor:pointer">'+E2(r.k)+'</text>'+
       '<text x="'+(Rx+12)+'" y="'+(y+4)+'" font-size="10.5" fill="#666">'+
       E2((d&&d.name)||v[0].name)+'</text>';
  });
  return s+'</svg>';
}

function openEv2(key){
  const i=key.indexOf("|"), fam=key.slice(0,i), date=key.slice(i+1);
  const list=REVF2.filter(r=>r.date===date&&r.fams.includes(fam));
  $("sideTitle").textContent=fam+"　"+date;

    '</tr></thead><tbody>'+list.map(r=>{ const k=KIND2(r.what);
      return '<tr'+(r.zu?' class="clk" data-dz2="'+E2(r.zu)+'"':'')+'>'+
      '<td class="mono">'+E2(r.zu)+'</td>'+
      '<td>'+(r.zu?E2(r.name):'<span style="color:#98989f">仕様ぜんたい</span>')+'</td>'+
      '<td><span class="chip2" style="background:'+k[1]+'1a;color:'+k[1]+'">'+E2(r.what)+'</span></td>'+
      '<td>'+r.specs.length+'仕様<br><span style="font-size:11px;color:#98989f">'+
        E2(r.fams.join(" "))+'</span></td></tr>';

  document.querySelectorAll("[data-dz2]").forEach(el=>el.onclick=()=>openDraw(el.dataset.dz2));

const MSAL_CONFIG={auth:{clientId:"d338d61b-01dc-4c7c-ac6b-aecf7f30d716",

/* ---- Graph ---- */
async function gGet(path,extra){
  const t=await getToken();
  const r=await fetch(GRAPH_BASE+path,{headers:{Authorization:"Bearer "+t,...(extra||{})}});
  if(!r.ok){const e=new Error(`[${r.status}] GET ${path}`);e.status=r.status;e.body=await r.text();throw e}
  return r.json();
}
async function gGetAll(path,extra){
  let out=[],next=path;
  while(next){const d=await gGet(next,extra);out=out.concat(d.value||[]);
    next=d["@odata.nextLink"]?d["@odata.nextLink"].replace(GRAPH_BASE,""):null}
  return out;
}
async function spInit(){
  SITE_ID=(await gGet(`/sites/${SP_HOST}:${SP_PATH}`)).id;
  const lists=await gGetAll(`/sites/${SITE_ID}/lists?$select=id,name,displayName,webUrl`);
  const pick=n=>lists.find(x=>x.displayName===n||x.name===n);
  const a=pick(LIST_SHUTSUZU),b=pick(LIST_UNITS);
  if(!a||!b){const e=new Error("出図マスタ／製造番号明細が見つかりません");e.status=404;throw e}
  ID_SHUTSUZU=a.id; ID_UNITS=b.id; UNITS_URL=b.webUrl||"";
  /* 図面ライブラリのドライブ。ファイル名から直接引くのでリストは使わない */
  try{
    const drives=await gGetAll(`/sites/${SITE_ID}/drives?$select=id,name`);
    const d=drives.find(x=>x.name===LIB_DRAWINGS||x.name==="Drawings");
    DRIVE_ID=d?d.id:null;
  }catch(e){DRIVE_ID=null;console.warn("図面ライブラリを開けませんでした",e)}
}

async function loadShutsuzu(){
  const items=await gGetAll(`/sites/${SITE_ID}/lists/${ID_SHUTSUZU}/items?expand=fields&$top=500`);
  SHUTSUZU=items.map(it=>{const f=it.fields||{};return {
    no:f.Title||"",date:(f.ShutsuzuDate||"").slice(0,10),tanto:f.Tanto||"",
    customer:f.Customer||"",destination:f.Destination||"",
    product:f.ProductName||"",model:f.Model||"",drawing:f.DrawingNo||"",spec:f.SpecNo||"",
    units:f.UnitCount==null?"":String(f.UnitCount),serial:f.SerialRange||"",carNo:f.CarNoRange||"",
    surface:f.Surface||"",wt:f.WTDisplay||"",note:f.Remarks||"",
    dims:[f.LengthMM,f.WidthMM,f.HeightMM].filter(v=>v!=null).join(" × "),
    capacity:f.Capacity==null?"":String(f.Capacity),
    meisai:(()=>{try{return JSON.parse(f.MeisaiJson||"[]")}catch(e){return []}})()
  }}).sort((a,b)=>String(b.no).localeCompare(String(a.no)));
}
/* 図面はフォルダを作らずフラットに置いてある。
   ファイル名だけでなく、図番・名称・版番号などの列も読む。 */
async function loadFiles(){
  if(!DRIVE_ID){FILES=[];return}
  const sel="id,name,size,webUrl,lastModifiedDateTime,file,folder";
  let items=[];
  try{
    items=await gGetAll(`/drives/${DRIVE_ID}/root/children?$select=${sel}&$expand=listItem($expand=fields)&$top=999`);
  }catch(e){
    console.warn("図面の列を一緒に取れませんでした。ファイル情報だけ読みます。",e);
    try{items=await gGetAll(`/drives/${DRIVE_ID}/root/children?$select=${sel}&$top=999`)}
    catch(e2){FILES=[];console.warn("図面の一覧を取得できませんでした",e2);return}
  }
  FILES=items.filter(x=>x.file&&!x.folder).map(x=>{
    const f=(x.listItem&&x.listItem.fields)||{};
    const stem=x.name.replace(/\.[^.]+$/,"");
    return {name:x.name,url:x.webUrl,size:x.size||0,
      mtime:(x.lastModifiedDateTime||"").slice(0,10),stem:stem,
      zu:f.DrawingNo||"",rev:f.RevNo||"",title:f.Title||"",
      cat:f.Category||"",memo:f.Memo||"",old:f.OldFileName||"",
      parent:f.ParentZu||"",sort:(f.SortNo==null?0:Number(f.SortNo)||0),
      revised:(f.RevisedOn||"").slice(0,10)};
  });
}
/* 製造番号明細は1万件を超えるので、全件は読まず1件ずつ引く */
async function findUnit(key){
  const H={Prefer:"HonorNonIndexedQueriesWarningMayFailRandomly"};
  const base=`/sites/${SITE_ID}/lists/${ID_UNITS}/items?expand=fields&$top=50&$filter=`;
  let v=await gGetAll(base+`fields/Title eq '${encodeURIComponent(key)}'`,H);
  if(!v.length) v=await gGetAll(base+`fields/CarNo eq '${encodeURIComponent(key)}'`,H);
  return v.map(it=>({id:it.id,...(it.fields||{})}));
}

/* ---- 図面の突き合わせ ---- */
function modelCode(zu){const m=String(zu||"").match(/^H\d{6}/);return m?m[0]:""}
function verNo(f){return parseInt(f.rev,10)||1}
function byRevDesc(a,b){return verNo(b)-verNo(a)}
function jpDate(v){const t=String(v||"").slice(0,10);return t?t.replace(/-/g,"/"):""}

/* 図番ごとにまとめる。列が空のファイルはファイル名から推測して寄せる。 */
function fileZu(f){
  if(f.zu)return f.zu;
  const m=f.stem.match(/^(H\d{6}[A-Za-z]-\d{3,5})/)
        ||f.stem.match(/^(H\d{6}-(?:\d{5}|\d{4}[A-Za-z]|\d{3,4}))/)
        ||f.stem.match(/^(H\d{6}[A-Za-z]?)/);
  return m?m[1]:"";
}
function fileName2(f){
  if(f.title)return f.title;
  const zu=fileZu(f);
  const rest=zu?f.stem.slice(zu.length).replace(/^[_\s\-–—]+/,"").replace(/^\d{3,4}$/,""):f.stem;
  return rest||zu||f.name;
}
function drawingGroups(){
  const m=new Map();
  FILES.forEach(f=>{
    const k=fileZu(f)||"（図番なし）";
    if(!m.has(k))m.set(k,[]);
    m.get(k).push(f);
  });
  return [...m.entries()].map(([zu,vs])=>{
    vs.sort(byRevDesc);
    return {zu:zu,vers:vs,latest:vs[0],
      title:fileName2(vs[0]),
      cat:vs[0].cat||"",parent:vs[0].parent||"",sort:vs[0].sort||0};
  }).sort((a,b)=>a.zu.localeCompare(b.zu,"ja"));
}
/* ============================================================
   営業に出すのは【全体図】だけ。
   ------------------------------------------------------------
   ・機種コードで寄せない。同じ機種を複数の客先に納めているため、
     寄せると別の客先の図面が混ざる（H080401 は17社）。
   ・部品図・塗装図は資材までのもので、営業には出さない。
   ・図番が完全に一致する全体図だけを出す。当て推量はしない。
   ※これは画面上の線引きであって、鍵ではない。実際の歯止めは
     SharePointの権限。
   ============================================================ */
function drawingsFor(zu){
  zu=String(zu||"").trim();
  const gs=drawingGroups();
  const hit=gs.filter(g=>g.zu===zu);
  const product=hit.filter(g=>g.cat==="全体図"||!g.cat);
  const held=hit.length-product.length;
  return {product:product,parts:[],exact:product.length>0,held:held};
}
function drawRows(list,zu){
  if(!list.length)return "";
  return list.map(g=>{
    const f=g.latest;
    return '<div class="drow"><div class="fn">'+esc(g.title||g.zu)+
      (g.zu===zu?' <span class="tag">図番一致</span>':"")+
      '<span class="vtag">Ver.'+verNo(f)+'</span>'+
      '<span class="meta">'+esc(g.zu)+' ・ '+Math.round(f.size/1024).toLocaleString()+' KB'+
      (g.vers.length>1?(' ・ 過去の版 '+(g.vers.length-1)+'件'):'')+
      ' ・ 更新 '+esc(jpDate(f.revised||f.mtime))+'</span></div>'+
      '<div class="rgt">'+
      (g.vers.length>1?'<button type="button" class="hist" data-zu="'+esc(g.zu)+'">履歴</button>':'')+
      '<a class="open" href="'+esc(f.url)+'" target="_blank" rel="noopener">図面を開く</a>'+
      '</div></div>';
  }).join("");
}
function drawingBlock(zu){
  if(!DRIVE_ID)return '<div class="blk"><h3>図面</h3><div class="empty">'+
    '図面ライブラリを開けませんでした。<br>総務までご連絡ください。</div></div>';
  if(!FILES.length)return '<div class="blk"><h3>図面</h3><div class="empty">'+
    '図面ライブラリにファイルが1件もありません。<br>総務までご連絡ください。</div></div>';
  const d=drawingsFor(zu),total=d.product.length;
  if(!total)return '<div class="blk"><h3>図面</h3><div class="empty">'+
    '図番 '+esc(zu)+' の全体図は、まだ登録されていません。'+
    '<span class="meta">（ライブラリには '+FILES.length+' 点あります。'+
    'この画面に出るのは全体図だけです。製作図が必要なときは技術部にご相談ください）</span></div></div>';
  return '<div class="blk"><h3>全体図　'+total+'点<span class="meta" style="font-weight:400;color:var(--faint)">　最新版を表示しています</span></h3>'+
    drawRows(d.product,zu)+
    '<div class="caution"><b>お願い</b><span>ここに出るのは<b>全体図だけ</b>です。'+
    '製作図は社内のみの扱いで、この画面には出ません。'+
    'また、全体図を<b>社外に出すときは技術部の承認</b>を受けてください。</span></div>'+
    '</div>';
}

/* ---- 過去の版（右からスライド） ---- */
function showHistory(zu){
  const g=drawingGroups().find(x=>x.zu===zu);
  if(!g)return;
  document.getElementById("sideTitle").textContent=g.title||"（名称なし）";
  document.getElementById("sideZu").textContent=g.zu+"　"+(g.cat||"");
  document.getElementById("sideBody").innerHTML=g.vers.map((f,i)=>
    '<div class="ver"><div class="vh"><span class="vn">Ver.'+verNo(f)+'</span>'+
      '<span class="vd">'+esc(jpDate(f.revised||f.mtime))+'</span>'+
      (i===0?'<span class="vlatest">最新</span>':'')+'</div>'+
    '<div class="vmemo'+(f.memo?"":" na")+'">'+esc(f.memo||"（メモなし）")+'</div>'+
    (f.old?'<div class="vfile">旧ファイル名: '+esc(f.old)+'</div>':'')+
    '<div class="vfile">'+esc(f.name)+'　'+Math.round(f.size/1024).toLocaleString()+' KB</div>'+
    '<a class="open" href="'+esc(f.url)+'" target="_blank" rel="noopener">この版を開く</a></div>').join("");
  document.getElementById("dwSide").classList.add("on");
}
function hideHistory(){document.getElementById("dwSide").classList.remove("on")}

/* ---- 1台のカルテ ---- */
const kv=(k,v,cls)=>'<div><span class="k">'+esc(k)+'</span><span class="v '+(trim(v)?(cls||""):"na")+'">'+
  (trim(v)?esc(v):"—")+'</span></div>';
function unitCard(u){
  const reg=SHUTSUZU.find(s=>s.no===u.ShutsuzuNo);
  const zu=u.DrawingNo||(reg&&reg.drawing)||"";
  const d=drawingsFor(zu),total=d.product.length+d.parts.length;
  const trail='<div class="trail">'+
    '<span class="node hit">製造番号 '+esc(u.Title)+'</span><span>→</span>'+
    '<span class="node hit">製造番号明細</span><span>→</span>'+
    '<span class="node '+(zu?"hit":"")+'">図番 '+esc(zu||"未登録")+'</span><span>→</span>'+
    (reg?'<span class="node hit">出図 No.'+esc(reg.no)+'</span>':'<span class="node">出図記録なし</span>')+
    '<span>→</span>'+
    (total?'<span class="node hit">図面 '+total+'点</span>':'<span class="node">図面未登録</span>')+
    '</div>';
  const shipped=!!u.ShipDate;
  const ship='<div class="blk"><h3>この1台</h3><div class="body"><div class="kv">'+
    kv("製造番号",u.Title,"big")+kv("車体番号",u.CarNo)+
    '<div><span class="k">状態</span><span class="v">'+
      (shipped?'<span class="pill ok">出荷済</span>':'<span class="pill warn">未出荷</span>')+'</span></div>'+
    kv("出荷日",(u.ShipDate||"").slice(0,10))+
    kv("受注先",u.Customer)+kv("納入先 / 行先",[u.DeliveryTo,u.Destination].filter(Boolean).join(" / "))+
    kv("型式",u.Model)+kv("品名",u.ProductName)+
    kv("図番",zu)+kv("図面仕様番号",u.SpecNo)+
    kv("自重 (kg)",u.ActualWeight==null?"":String(u.ActualWeight))+
    kv("最大積載 (kg)",u.Capacity==null?"":String(u.Capacity))+
    kv("備考",u.Remarks)+
    '</div></div></div>';
  const regBlk=reg
    ? '<div class="blk"><h3>出図情報　No.'+esc(reg.no)+'</h3><div class="body"><div class="kv">'+
      kv("出図日",reg.date)+kv("担当",reg.tanto)+kv("台数（台口）",reg.units?reg.units+" 台":"")+
      kv("仕向地",reg.destination)+kv("表面処理",reg.surface)+kv("WT表示",reg.wt)+
      kv("寸法 (mm)",reg.dims)+kv("製造番号（全体）",reg.serial)+kv("備考",reg.note)+
      '</div></div></div>'
    : '<div class="blk"><h3>出図情報</h3><div class="empty">'+
      'この製造番号に対応する出図の記録がありません。<br>過去分の出図表が取り込まれると、ここも埋まります。</div></div>';
  return trail+ship+regBlk+drawingBlock(zu);
}

/* ---- 検索 ---- */
let searchTimer=null,lastQuery="";
function onSearchInput(){
  clearTimeout(searchTimer);
  const q=trim($("q").value);
  if(!q){$("result").innerHTML='<div class="blk"><div class="empty">製造番号か車体番号を入力してください。</div></div>';return}
  if(q.length<3){$("result").innerHTML='<div class="blk"><div class="empty">3文字以上入力してください。</div></div>';return}
  $("result").innerHTML='<div class="blk"><div class="empty"><span class="spin"></span>　探しています…</div></div>';
  searchTimer=setTimeout(()=>doSearch(q),350);
}
async function doSearch(q){
  lastQuery=q;
  try{
    const hits=await findUnit(q);
    if(lastQuery!==q)return;
    if(!hits.length){
      $("result").innerHTML='<div class="blk"><div class="empty">「'+esc(q)+'」は見つかりませんでした。<br>'+
        '製造番号は5桁の数字、車体番号は CD-25-424 のような形です。</div></div>';
      return;
    }
    if(hits.length===1){$("result").innerHTML=unitCard(hits[0]);return}
    /* 車体番号は年度をまたいで重複することがあるので、候補を出して選ばせる */
    $("result").innerHTML='<div class="blk"><h3>「'+esc(q)+'」は '+hits.length+'台に一致します</h3>'+
      '<div class="body"><p class="note" style="margin:0">車体番号は年度をまたいで重複することがあります。製造番号を選んでください。</p></div>'+
      '<div class="tw"><table><thead><tr><th>製造番号</th><th>車体番号</th><th>出荷日</th><th>受注先</th><th>行先</th><th>図番</th></tr></thead><tbody>'+
      hits.map(h=>'<tr class="click" data-sn="'+esc(h.Title)+'"><td class="m">'+esc(h.Title)+'</td>'+
        '<td class="m">'+esc(h.CarNo||"")+'</td><td class="m">'+esc((h.ShipDate||"").slice(0,10))+'</td>'+
        '<td>'+esc(h.Customer||"")+'</td><td>'+esc(h.Destination||"")+'</td>'+
        '<td class="m">'+esc(h.DrawingNo||"")+'</td></tr>').join("")+
      '</tbody></table></div></div>';
    $("result").querySelectorAll("tr.click").forEach(tr=>{
      tr.addEventListener("click",()=>{$("q").value=tr.dataset.sn;doSearch(tr.dataset.sn)});
    });
  }catch(e){
    $("result").innerHTML='<div class="blk"><div class="empty">検索に失敗しました。<br>'+
      '<span style="font-size:12px;color:#999">'+esc(e.message||e)+'</span></div></div>';
    console.error(e,e.body);
  }
}

/* ---- 出図の一覧（こちらが既定の見え方） ---- */
function renderShutsuzuList(){
  const q=trim($("q2").value).toLowerCase();
  const rows=SHUTSUZU.filter(s=>!q||[s.no,s.date,s.customer,s.product,s.model,s.drawing,s.spec,s.destination]
    .join(" ").toLowerCase().includes(q));
  if(!rows.length){
    $("shutsuzuList").innerHTML='<div class="blk"><div class="empty">'+
      (SHUTSUZU.length?'該当する出図がありません。':'出図がまだ登録されていません。')+'</div></div>';
    return;
  }
  $("shutsuzuList").innerHTML='<div class="blk"><h3>出図　'+rows.length+'件'+
    (q?'（全'+SHUTSUZU.length+'件中）':"")+'</h3>'+
    '<div class="tw scroll-y"><table><thead><tr>'+
    '<th>出図番号</th><th>出図日</th><th>受注先</th><th>品名</th><th>型式</th><th>図番</th><th>台数</th><th>仕向地</th><th>図面</th>'+
    '</tr></thead><tbody>'+
    rows.map(s=>{
      const d=drawingsFor(s.drawing),n=d.product.length+d.parts.length;
      const dests=(s.meisai||[]).map(r=>r.dest).filter(Boolean);
      return '<tr class="click" data-no="'+esc(s.no)+'">'+
        '<td class="m">'+esc(s.no)+'</td><td class="m">'+esc(s.date)+'</td>'+
        '<td>'+esc(s.customer)+'</td><td>'+esc(s.product)+'</td><td>'+esc(s.model)+'</td>'+
        '<td class="m">'+esc(s.drawing)+'</td><td class="m">'+esc(s.units)+'</td>'+
        '<td>'+esc(dests.length?dests.join("・"):s.destination)+'</td>'+
        '<td class="m">'+(n?n+"点":'<span class="faint">—</span>')+'</td></tr>';
    }).join("")+'</tbody></table></div></div><div id="shutsuzuDetail"></div>';
  $("shutsuzuList").querySelectorAll("tr.click").forEach(tr=>{
    tr.addEventListener("click",()=>showShutsuzu(tr.dataset.no));
  });
}
function showShutsuzu(no){
  const s=SHUTSUZU.find(x=>x.no===no); if(!s)return;
  const meisai=(s.meisai||[]).filter(r=>r.dest||r.qty||r.snFrom);
  const m=meisai.length
    ? '<div class="tw"><table><thead><tr><th>仕向地</th><th>台数</th><th>製造番号</th><th>仕様・備考</th></tr></thead><tbody>'+
      meisai.map(r=>'<tr><td>'+esc(r.dest||"—")+'</td><td class="m">'+esc(r.qty||"")+'</td>'+
        '<td class="m">'+esc(r.snFrom?(r.snTo&&r.snTo!==r.snFrom?r.snFrom+"～"+r.snTo:r.snFrom):"")+'</td>'+
        '<td>'+esc(r.spec||"")+'</td></tr>').join("")+'</tbody></table></div>'
    : '<div class="body"><p class="note" style="margin:0">仕向地ごとの明細は登録されていません。製造番号：'+esc(s.serial||"—")+'</p></div>';
  $("shutsuzuDetail").innerHTML=
    '<div class="blk"><h3>出図 No.'+esc(s.no)+'　'+esc(s.date)+'　'+esc(s.customer)+'　'+esc(s.model)+'</h3>'+
    '<div class="body"><div class="kv">'+
      kv("台数（台口）",s.units?s.units+" 台":"")+kv("担当",s.tanto)+kv("図番",s.drawing)+
      kv("図面仕様番号",s.spec)+kv("表面処理",s.surface)+kv("WT表示",s.wt)+
      kv("寸法 (mm)",s.dims)+kv("最大積載 (kg)",s.capacity)+kv("備考",s.note)+
    '</div></div>'+m+
    (UNITS_URL?'<div class="body" style="border-top:1px solid var(--line)">'+
      '<button class="ghost" onclick="openUnits(\''+esc(s.no)+'\')">この出図の製造番号明細を開く</button></div>':"")+
    '</div>'+drawingBlock(s.drawing);
  $("shutsuzuDetail").scrollIntoView({behavior:"smooth",block:"start"});
}
function openUnits(no){
  if(!UNITS_URL)return;
  const base=/\.aspx$/i.test(UNITS_URL)?UNITS_URL:(UNITS_URL+"/AllItems.aspx");
  window.open(base+"?FilterField1=ShutsuzuNo&FilterValue1="+encodeURIComponent(no)+"&FilterType1=Text",
    "_blank","noopener");
}

/* ---- 起動 ---- */
document.addEventListener("DOMContentLoaded",()=>{
  document.addEventListener("click",e=>{
    const b=e.target.closest&&e.target.closest("button.hist");
    if(b){showHistory(b.dataset.zu);return}
    if(e.target.id==="btnSideClose")hideHistory();
  });
  document.addEventListener("keydown",e=>{if(e.key==="Escape")hideHistory()});

  document.querySelectorAll("nav.tabs button").forEach(b=>{
    b.addEventListener("click",()=>{
      document.querySelectorAll("nav.tabs button").forEach(x=>x.setAttribute("aria-selected",x===b?"true":"false"));
      document.querySelectorAll(".panel").forEach(p=>p.classList.toggle("on",p.id===b.dataset.p));
      if(b.dataset.p==="p3") drawDrawList();
      if(b.dataset.p==="p4") drawRevList();
      if(b.dataset.p==="p5") drawTrend();
    });
  });
  $("q3").addEventListener("input",drawDrawList);
  $("f3s").addEventListener("change",drawDrawList);
  $("f3r").addEventListener("change",drawDrawList);
  $("q4").addEventListener("input",drawRevList);
  document.querySelectorAll("[data-tr]").forEach(b=>b.addEventListener("click",()=>{
    document.querySelectorAll("[data-tr]").forEach(x=>x.classList.toggle("on",x===b));
    TREND=b.dataset.tr; drawTrend();
  }));
  $("btnAuth").onclick=()=>currentAccount?signOut():signIn();
  $("btnGateSignIn").onclick=()=>signIn();
  $("q").addEventListener("input",onSearchInput);
  $("q2").addEventListener("input",renderShutsuzuList);
  initMsal().catch(e=>{showGateError(e);console.error(e)});
});
</script>

  <button type="button" class="close" id="btnSideClose" aria-label="閉じる">×</button>
  <h2 id="sideTitle">履歴</h2>
  <div class="zu" id="sideZu"></div>
  <div id="sideBody" style="margin-top:14px"></div>
</div>

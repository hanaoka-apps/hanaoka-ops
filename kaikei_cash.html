<style>
  :root { --primary:#1a5fa8; --bg:#f4f6f9; --card-bg:#fff; --border:#dde2ec; --text:#1e2533; --muted:#6b7a99;
          --shadow:0 1px 4px rgba(0,0,0,.08); --head:#eef2f8; --sub:#f7f9fc; --bad:#c0392b; --good:#2e7d52;
          --hl:rgba(26,95,168,.07); --hl-strong:rgba(26,95,168,.20); }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:'Meiryo','Hiragino Sans',sans-serif; background:var(--bg); color:var(--text); }
  nav { background:#1f1e1c;color:#fff;padding:8px 24px;font-size:13px;display:flex;gap:18px;align-items:center;flex-wrap:wrap; }
  nav a { color:#fff;text-decoration:none;opacity:.75; }
  nav a.on { opacity:1; font-weight:700; }
  #login-view { display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:70vh; gap:16px; }
  #login-view button { background:var(--primary); color:#fff; border:none; padding:12px 32px; border-radius:6px; font-size:15px; font-weight:700; cursor:pointer; }
  #app-view { display:none; padding:16px 20px 60px; }
  .bar { display:flex; align-items:center; gap:12px; background:var(--card-bg); border:1px solid var(--border);
         border-radius:8px; padding:10px 14px; margin-bottom:14px; box-shadow:var(--shadow); flex-wrap:wrap; }
  .bar select { border:1px solid var(--border); border-radius:4px; padding:5px 10px; font-size:13px; }
  .bar .sp { margin-left:auto; font-size:12px; color:var(--muted); }
  .warn { background:#fff3cd; border:1px solid #ffc107; border-radius:6px; padding:8px 12px; font-size:12px; margin-bottom:10px; color:#664d00; }
  .kpi-row { display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-bottom:14px; }
  @media(max-width:900px){ .kpi-row{ grid-template-columns:repeat(2,1fr);} }
  .kpi { background:var(--card-bg); border:1px solid var(--border); border-radius:10px; padding:12px 14px; box-shadow:var(--shadow); }
  .kpi .lbl { font-size:12px; color:var(--muted); font-weight:600; }
  .kpi .val { font-size:20px; font-weight:800; margin-top:4px; font-variant-numeric:tabular-nums; }
  .kpi .sub { font-size:11px; margin-top:4px; color:var(--muted); }
  .kpi .sub b.good { color:var(--good); } .kpi .sub b.bad { color:var(--bad); }
  .panel { background:var(--card-bg); border:1px solid var(--border); border-radius:10px; padding:16px; box-shadow:var(--shadow); margin-bottom:16px; }
  .panel h3 { font-size:14px; color:var(--primary); margin-bottom:10px; display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  .panel h3 select { font-size:12px; font-weight:400; border:1px solid var(--border); border-radius:4px; padding:3px 8px; }
  .conclusion { background:#eaf1fb; border:1px solid #cfe0f5; border-radius:8px; padding:10px 14px; font-size:13px; font-weight:600; margin-bottom:10px; color:#134680; }
  .chart-wrap { position:relative; height:300px; }
  .note { font-size:12px; color:var(--muted); margin-bottom:8px; }
  .tbl-wrap { overflow-x:auto; }
  table { border-collapse:collapse; font-size:12px; white-space:nowrap; }
  th, td { padding:4px 8px; border-bottom:1px solid var(--border); }
  thead th { background:var(--head); color:var(--primary); position:sticky; top:0; z-index:2; font-size:11px; }
  td.lbl, th.lbl { position:sticky; left:0; background:var(--card-bg); text-align:left; min-width:200px; z-index:1; }
  thead th.lbl { background:var(--head); z-index:3; }
  td.num { text-align:right; font-variant-numeric:tabular-nums; }
  td.neg { color:var(--bad); }
  tr.section td { background:var(--sub); font-weight:700; }
  tr.section td.lbl { background:var(--sub); }
  tr.total td { font-weight:700; border-top:2px solid var(--primary); }
  tr.balance td { font-weight:800; background:#f0f5fc; }
  tr.balance td.lbl { background:#f0f5fc; }
  td.cum { background:#f4f7fc; font-weight:700; }
  .indent { padding-left:22px; color:var(--muted); }
  #cashTbl tbody tr:hover > td { background:var(--hl); }
  #cashTbl tbody tr:hover > td.lbl { background:#e9eff8; }
  #cashTbl td.clickable { cursor:pointer; }
  #cashTbl td.clickable:hover { outline:2px solid var(--primary); outline-offset:-2px; }
  #drawer { position:fixed; top:0; right:0; height:100vh; width:min(680px,92vw); background:var(--card-bg);
            border-left:1px solid var(--border); box-shadow:-6px 0 24px rgba(0,0,0,.14); z-index:50;
            transform:translateX(100%); transition:transform .22s ease; display:flex; flex-direction:column; }
  #drawer.open { transform:translateX(0); }
  #drawerOverlay { position:fixed; inset:0; background:rgba(0,0,0,.18); z-index:49; display:none; }
  #drawerOverlay.open { display:block; }
  #drawer .dh { padding:14px 18px; border-bottom:1px solid var(--border); background:var(--head); position:relative; }
  #drawer .dh .title { font-size:15px; font-weight:800; color:var(--primary); }
  #drawer .dh .sub { font-size:12px; color:var(--muted); margin-top:3px; }
  #drawer .dh .amt { font-size:20px; font-weight:800; margin-top:6px; font-variant-numeric:tabular-nums; }
  #drawer .dh .close { position:absolute; top:12px; right:16px; border:none; background:transparent; font-size:22px; color:var(--muted); cursor:pointer; }
  #drawer .dbody { flex:1; overflow:auto; padding:0 6px 18px; }
  #drawer table { width:100%; white-space:normal; }
  #drawer th { position:sticky; top:0; background:var(--card-bg); border-bottom:1px solid var(--border); padding:8px; text-align:left; color:var(--muted); font-size:11px; z-index:1; }
  #drawer td { padding:6px 8px; vertical-align:top; }
  #drawer td.num { white-space:nowrap; }
  #drawer .neg { color:var(--bad); }
  #drawer .msg { padding:30px 18px; color:var(--muted); font-size:13px; text-align:center; }
  .empty-msg { color:var(--muted); font-size:13px; padding:30px 0; text-align:center; }
</style>

<script src="kaikei_graph.js"></script>
<script>
/* ============ 科目の分類 ============ */
const CASH_CODES   = ['100', '101', '104', '105', '106', '107', '108', '109'];
const AR_CODES     = ['122', '124', '150', '929'];              // 売上債権（受取手形・売掛金・貸倒引当金・不渡手形）
const INV_CODES    = ['132', '133', '134', '135', '136', '137']; // 棚卸資産
const AP_CODES     = ['300', '301', '304'];                      // 仕入債務（支払手形・割引手形・買掛金）
const LOAN_CODES   = ['307', '325', '326'];                      // 借入金・社債
const LEASE_CODES  = ['941', '945', '327'];                      // リース債務・長期未払金
const TAX_BS_CODES = ['145', '315', '939', '318'];               // 消費税・未払法人税等
const DEP_CODES    = ['544', '689'];                             // 減価償却費
const PAYROLL_BS   = ['312', '317'];                             // 未払費用・預り金（給与・社保の支払がほとんど）
const LABOR_CODES  = ['510', '511', '512', '513', '514', '515', '516', '967', '968', '969', '970',
                      '641', '643', '644', '645', '646', '647', '981', '982', '983', '984'];
const PURCHASE_PL  = ['501', '502', '503', '507', '613', '614', '615', '616', '617'];

let accountMaster = {}, opening = null;
const summaries = {};   // month -> summary
const journals = {};    // month -> 明細（パネルを開いたときだけ）
let months = [];
let unit = 1000;

/** 資金繰り表の行（相手科目コード → 行名）。上から順に判定する */
function cashLineOf(code) {
  const c = String(code);
  if (CASH_CODES.includes(c)) return '預金間振替';
  if (c === '124') return '売掛金回収';
  if (c === '122') return '手形期日入金';
  if (c === '313') return '前受金';
  if (c === '304') return '買掛金支払';
  if (c === '300' || c === '301') return '支払手形決済';
  if (LOAN_CODES.includes(c)) return '借入金（借入・返済）';
  if (LEASE_CODES.includes(c)) return 'リース・割賦';
  if (TAX_BS_CODES.includes(c)) return '税金';
  if (PAYROLL_BS.includes(c) || LABOR_CODES.includes(c)) return '人件費';
  if (PURCHASE_PL.includes(c)) return '仕入（直接払い）';
  const am = accountMaster[c];
  if (am) {
    if (am.section === '売上高') return '現金売上';
    if (am.section === '営業外収益' || am.section === '特別利益') return '営業外収入';
    if (am.section === '営業外費用') return '支払利息・割引料等';
    if (am.section === '法人税等') return '税金';
    if (am.section === '特別損失') return 'その他の収支';
    return '経費';
  }
  const ob = opening && opening.accounts[c];
  if (ob) {
    if (ob.section === '有形固定資産' || ob.section === '無形固定資産') return '設備投資';
    if (ob.section === '投資その他') return '投資・保険積立';
    if (ob.section === '純資産') return '資本取引';
  }
  return 'その他の収支';
}

const CASH_LAYOUT = [
  { section: '経常収入', lines: ['売掛金回収', '手形期日入金', '前受金', '現金売上', '営業外収入'] },
  { section: '経常支出', lines: ['買掛金支払', '支払手形決済', '仕入（直接払い）', '人件費', '経費', '支払利息・割引料等', '税金', 'その他の収支'] },
  { section: '設備・投資', lines: ['設備投資', '投資・保険積立'] },
  { section: '財務', lines: ['借入金（借入・返済）', 'リース・割賦', '資本取引'] },
];

/** 貸借対照表の残高の区分（ブリッジと残高推移に使う） */
function bsGroupOf(code) {
  const c = String(code);
  if (CASH_CODES.includes(c)) return '現預金';
  if (AR_CODES.includes(c)) return '売上債権';
  if (INV_CODES.includes(c)) return '棚卸資産';
  if (AP_CODES.includes(c)) return '仕入債務';
  if (LOAN_CODES.includes(c)) return '借入金';
  if (LEASE_CODES.includes(c)) return 'リース・割賦';
  if (TAX_BS_CODES.includes(c)) return '税金';
  const ob = opening && opening.accounts[c];
  if (ob) {
    if (ob.section === '有形固定資産' || ob.section === '無形固定資産') return '固定資産';
    if (ob.section === '投資その他') return '投資その他';
    if (ob.section === '純資産') return '純資産';
  }
  return 'その他';
}

/** 期首残高ファイルにない科目の貸借の向き（コード帯でおおまかに判定） */
function sideOf(code) {
  const ob = opening && opening.accounts[String(code)];
  if (ob) return ob.side;
  const n = parseInt(code, 10);
  return (n < 300 || (n >= 900 && n < 939)) ? 'debit' : 'credit';
}

/* ============ 集計 ============ */
const fmt = n => (n === null || n === undefined || isNaN(n)) ? '—' : Math.round(n / unit).toLocaleString('ja-JP');
const fmtYen = n => Math.round(n).toLocaleString('ja-JP') + '円';

/** その月の資金繰り表の各行の金額（入金+ / 出金−） */
function cashLines(month) {
  const s = summaries[month];
  if (!s || !s.cashByAite) return null;
  const out = {};
  for (const [code, v] of Object.entries(s.cashByAite)) {
    const line = cashLineOf(code);
    out[line] = (out[line] || 0) + v.net;
  }
  return out;
}

/** 月末残高（期首残高＋その月までの動きの累計）。途中の月が欠けていたらnull */
const balanceCache = {};
function balancesAt(month) {
  if (balanceCache[month] !== undefined) return balanceCache[month];
  if (!opening) return (balanceCache[month] = null);
  const bal = {};
  for (const [c, a] of Object.entries(opening.accounts)) bal[c] = a.balance;
  const start = opening.asOf;
  if (month === start) return (balanceCache[month] = bal);
  if (!months.includes(month)) return (balanceCache[month] = null);   // まだデータのない月は空欄にする
  const list = months.filter(m => m > start && m <= month);
  if (!list.length || list[0] !== nextMonth(start)) return (balanceCache[month] = null);
  for (let i = 0; i < list.length; i++) {
    if (i > 0 && list[i] !== nextMonth(list[i - 1])) return (balanceCache[month] = null);   // 欠けている月がある
    const s = summaries[list[i]];
    if (!s) return (balanceCache[month] = null);
    for (const [c, a] of Object.entries(s.byAccount || {})) {
      if (accountMaster[c]) continue;   // 損益の科目は残高に含めない
      const mv = sideOf(c) === 'debit' ? a.debit - a.credit : a.credit - a.debit;
      bal[c] = (bal[c] || 0) + mv;
    }
  }
  return (balanceCache[month] = bal);
}
function groupBalance(bal, group) {
  if (!bal) return null;
  let t = 0;
  for (const [c, v] of Object.entries(bal)) if (bsGroupOf(c) === group) t += v;
  return t;
}
function nextMonth(ym) {
  let y = parseInt(ym.slice(0, 4), 10), m = parseInt(ym.slice(4), 10) + 1;
  if (m > 12) { m = 1; y++; }
  return String(y) + String(m).padStart(2, '0');
}
function prevMonth(ym) {
  let y = parseInt(ym.slice(0, 4), 10), m = parseInt(ym.slice(4), 10) - 1;
  if (m < 1) { m = 12; y--; }
  return String(y) + String(m).padStart(2, '0');
}

/** 利益→現金ブリッジ：現預金以外の全科目の(貸方−借方)を区分ごとに合計すると、現預金の増減に一致する */
function bridgeOf(monthList) {
  const b = { 営業利益: 0, 減価償却費: 0, 売上債権: 0, 棚卸資産: 0, 仕入債務: 0, その他運転資金: 0,
              営業外特別税: 0, 設備投資: 0, 投資その他: 0, 借入リース: 0, その他: 0, 現預金増減: 0 };
  for (const m of monthList) {
    const s = summaries[m];
    if (!s) return null;
    for (const [c, a] of Object.entries(s.byAccount || {})) {
      const crdr = a.credit - a.debit;
      if (CASH_CODES.includes(c)) { b.現預金増減 += a.debit - a.credit; continue; }
      const am = accountMaster[c];
      if (am) {
        if (['売上高', '売上原価', '販管費'].includes(am.section)) b.営業利益 += crdr;
        else b.営業外特別税 += crdr;
        if (DEP_CODES.includes(c)) b.減価償却費 += a.debit - a.credit;
        continue;
      }
      const g = bsGroupOf(c);
      if (g === '売上債権') b.売上債権 += crdr;
      else if (g === '棚卸資産') b.棚卸資産 += crdr;
      else if (g === '仕入債務') b.仕入債務 += crdr;
      else if (g === '固定資産') b.設備投資 += crdr;
      else if (g === '投資その他') b.投資その他 += crdr;
      else if (g === '借入金' || g === 'リース・割賦') b.借入リース += crdr;
      else if (g === '税金' || g === 'その他') b.その他運転資金 += crdr;
      else b.その他 += crdr;   // 純資産など
    }
  }
  b.設備投資 -= b.減価償却費;   // 固定資産の減少のうち償却分を「減価償却費」として別に見せる
  return b;
}

/* ============ 表示: KPI ============ */
function renderKpis() {
  const last = months[months.length - 1];
  const bal = balancesAt(last), balPrev = balancesAt(prevMonth(last));
  const cash = groupBalance(bal, '現預金'), cashPrev = groupBalance(balPrev, '現預金');
  const loan = groupBalance(bal, '借入金');
  const lines = cashLines(last);
  const ordinary = lines ? ['経常収入', '経常支出'].reduce((s, sec) =>
    s + CASH_LAYOUT.find(x => x.section === sec).lines.reduce((t, l) => t + (lines[l] || 0), 0), 0) : null;
  const card = (lbl, val, sub) => `<div class="kpi"><div class="lbl">${lbl}</div><div class="val">${val}</div><div class="sub">${sub}</div></div>`;
  const diff = (a, b) => (a === null || b === null) ? '' : `前月比 <b class="${a - b >= 0 ? 'good' : 'bad'}">${a - b >= 0 ? '+' : ''}${fmtYen(a - b)}</b>`;
  const ymLabel = `${last.slice(0, 4)}年${parseInt(last.slice(4), 10)}月末`;
  document.getElementById('kpiRow').innerHTML =
    card(`現預金残高（${ymLabel}）`, cash === null ? '—' : fmtYen(cash), diff(cash, cashPrev) || '期首残高が未登録') +
    card('借入金残高', loan === null ? '—' : fmtYen(loan), '短期＋長期') +
    card('実質借入（借入−現預金）', (cash === null || loan === null) ? '—' : fmtYen(loan - cash), 'マイナスなら実質無借金') +
    card(`経常収支（${parseInt(last.slice(4), 10)}月）`, ordinary === null ? '—' : fmtYen(ordinary), '営業活動で増えた（減った）現預金');
}

/* ============ 表示: 資金繰り実績表 ============ */
let tableRows = [];   // 明細パネルが参照する行定義
function fyMonths(fy) {
  const out = [];
  for (let i = 0; i < 12; i++) {
    const y = fy + Math.floor((3 + i) / 12), m = ((3 + i) % 12) + 1;
    out.push(String(y) + String(m).padStart(2, '0'));
  }
  return out;
}

function renderCashTable(fy) {
  const ms = fyMonths(fy);
  const lineData = {};
  for (const m of ms) lineData[m] = cashLines(m);
  const secSum = (m, sec) => {
    const d = lineData[m];
    if (!d) return null;
    return CASH_LAYOUT.find(x => x.section === sec).lines.reduce((t, l) => t + (d[l] || 0), 0);
  };
  const total = m => lineData[m] ? Object.values(lineData[m]).reduce((a, b) => a + b, 0) : null;
  const cashAt = m => groupBalance(balancesAt(m), '現預金');

  const rows = [];
  rows.push({ label: '前月より繰越（現預金）', get: m => cashAt(prevMonth(m)), cls: 'balance', noCum: true });
  for (const blk of CASH_LAYOUT) {
    rows.push({ label: '〔' + blk.section + '〕', section: true });
    for (const l of blk.lines) rows.push({ label: l, get: m => lineData[m] ? (lineData[m][l] || 0) : null, indent: true, line: l });
    if (blk.section === '経常支出') {
      rows.push({ label: '経常収支', get: m => secSum(m, '経常収入') === null ? null : secSum(m, '経常収入') + secSum(m, '経常支出'), cls: 'total' });
    }
    if (blk.section === '財務') rows.push({ label: '財務収支', get: m => secSum(m, '財務'), cls: 'total' });
  }
  rows.push({ label: '預金間振替（手数料等の端数）', get: m => lineData[m] ? (lineData[m]['預金間振替'] || 0) : null, indent: true, line: '預金間振替' });
  rows.push({ label: '総合収支（現預金の増減）', get: total, cls: 'total' });
  rows.push({ label: '翌月へ繰越（現預金）', get: m => cashAt(m), cls: 'balance', noCum: true });
  tableRows = rows;

  let html = '<thead><tr><th class="lbl">項目</th>' + ms.map(m => `<th>${parseInt(m.slice(4), 10)}月</th>`).join('') + '<th>累計</th></tr></thead><tbody>';
  rows.forEach((r, ri) => {
    const cls = [r.section ? 'section' : '', r.cls || ''].join(' ');
    html += `<tr class="${cls}"><td class="lbl${r.indent ? ' indent' : ''}">${r.label}</td>`;
    if (r.section) { html += `<td colspan="${ms.length + 1}"></td></tr>`; return; }
    let cum = 0, has = false;
    for (const m of ms) {
      const v = r.get(m);
      if (v !== null && v !== undefined) { cum += v; has = true; }
      const click = r.line && v !== null && v !== undefined && Math.abs(v) >= 1;
      html += `<td class="num${v < 0 ? ' neg' : ''}${click ? ' clickable' : ''}"${click ? ` data-ri="${ri}" data-m="${m}"` : ''}>${fmt(v)}</td>`;
    }
    html += `<td class="num cum${cum < 0 ? ' neg' : ''}">${r.noCum ? '' : (has ? fmt(cum) : '—')}</td></tr>`;
  });
  html += '</tbody>';
  document.getElementById('cashTbl').innerHTML = html;
}

/* ============ 表示: 利益→現金ブリッジ ============ */
let bridgeChart = null;
function renderBridge(key) {
  const fy = parseInt(document.getElementById('fy-select').value, 10);
  const list = key === 'fy' ? fyMonths(fy).filter(m => months.includes(m)) : [key];
  const b = bridgeOf(list);
  const canvas = document.getElementById('bridgeChart');
  if (bridgeChart) bridgeChart.destroy();
  if (!b) { document.getElementById('bridgeConclusion').style.display = 'none'; return; }

  const steps = [
    ['減価償却費', b.減価償却費], ['売上債権の増減', b.売上債権], ['棚卸資産の増減', b.棚卸資産],
    ['仕入債務の増減', b.仕入債務], ['その他運転資金・税', b.その他運転資金], ['営業外・特別損益', b.営業外特別税],
    ['設備投資', b.設備投資], ['投資・保険積立', b.投資その他], ['借入・リース', b.借入リース],
  ];
  if (Math.abs(b.その他) >= 1) steps.push(['その他', b.その他]);
  const labels = ['営業利益', ...steps.map(s => s[0]), '現預金の増減'];
  const data = [], colors = [];
  data.push([0, b.営業利益]); colors.push('#1a5fa8');
  let run = b.営業利益;
  for (const [, v] of steps) {
    data.push([Math.min(run, run + v), Math.max(run, run + v)]);
    colors.push(Math.abs(v) < 1 ? '#8a94a8' : (v > 0 ? '#2e7d52' : '#c0392b'));
    run += v;
  }
  data.push([0, b.現預金増減]); colors.push('#1a5fa8');
  const deltas = [b.営業利益, ...steps.map(s => s[1]), b.現預金増減];

  bridgeChart = new Chart(canvas.getContext('2d'), {
    type: 'bar',
    data: { labels, datasets: [{ data, backgroundColor: colors, borderRadius: 3 }] },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: { legend: { display: false },
        tooltip: { callbacks: { label: ctx => {
          const i = ctx.dataIndex, v = deltas[i];
          return (i === 0 || i === labels.length - 1 ? '' : '増減 ') + (v >= 0 && i > 0 && i < labels.length - 1 ? '+' : '') + fmtYen(v);
        } } } },
      scales: { x: { ticks: { font: { size: 10 }, maxRotation: 0, autoSkip: false,
                  callback: function (v) { const l = this.getLabelForValue(v); return l.length > 6 ? [l.slice(0, 6), l.slice(6)] : l; } } },
                y: { ticks: { callback: v => (v / 10000).toLocaleString() + '万' } } },
    },
  });

  // 検算（区分の合計＝現預金の増減）と結論の一文
  const sum = b.営業利益 + steps.reduce((t, s) => t + s[1], 0);
  const top = [...steps].sort((a, c) => Math.abs(c[1]) - Math.abs(a[1]))[0];
  const el = document.getElementById('bridgeConclusion');
  el.style.display = 'block';
  el.textContent = `営業利益 ${fmtYen(b.営業利益)} に対し、現預金は ${b.現預金増減 >= 0 ? '+' : ''}${fmtYen(b.現預金増減)}。`
    + `差の最大要因は「${top[0]}」（${top[1] >= 0 ? '+' : ''}${fmtYen(top[1])}）。`
    + (Math.abs(sum - b.現預金増減) >= 1 ? `【検算不一致 ${fmtYen(sum - b.現預金増減)}】` : '');
}

/* ============ 表示: 月末残高の推移 ============ */
let balanceChart = null;
function renderBalanceChart() {
  const ms = months.filter(m => balancesAt(m));
  const series = [
    ['現預金', '#1a5fa8'], ['借入金', '#c0392b'], ['売上債権', '#2e7d52'], ['棚卸資産', '#e89c3f'], ['仕入債務', '#8b5cf6'],
  ];
  if (balanceChart) balanceChart.destroy();
  balanceChart = new Chart(document.getElementById('balanceChart').getContext('2d'), {
    type: 'line',
    data: {
      labels: ms.map(m => `${m.slice(2, 4)}/${m.slice(4)}`),
      datasets: series.map(([g, color]) => ({
        label: g, data: ms.map(m => groupBalance(balancesAt(m), g)), borderColor: color, backgroundColor: color,
        tension: .2, pointRadius: 2, borderWidth: 2,
      })),
    },
    options: {
      responsive: true, maintainAspectRatio: false, interaction: { mode: 'index', intersect: false },
      plugins: { tooltip: { callbacks: { label: ctx => `${ctx.dataset.label}: ${fmtYen(ctx.parsed.y)}` } } },
      scales: { y: { ticks: { callback: v => (v / 1e8).toFixed(1) + '億' } } },
    },
  });
}

/* ============ 明細パネル ============ */
const drawer = document.getElementById('drawer'), overlay = document.getElementById('drawerOverlay');
function closeDrawer() { drawer.classList.remove('open'); overlay.classList.remove('open'); }
document.getElementById('drawerClose').addEventListener('click', closeDrawer);
overlay.addEventListener('click', closeDrawer);
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeDrawer(); });

async function openDetail(ri, month) {
  const row = tableRows[ri];
  if (!row || !row.line) return;
  document.getElementById('dTitle').textContent = row.label;
  document.getElementById('dSub').textContent = `${month.slice(0, 4)}年${parseInt(month.slice(4), 10)}月度　現金・預金の入出金`;
  document.getElementById('dAmt').textContent = fmtYen(row.get(month));
  document.getElementById('dBody').innerHTML = '<div class="msg">読み込み中...</div>';
  drawer.classList.add('open'); overlay.classList.add('open');

  if (journals[month] === undefined) {
    const d = await kaikeiGetFile('monthly/' + month + '.json', { allow404: true });
    journals[month] = (d && d.journal) || [];
  }
  const j = journals[month];
  if (j.length && j[0].length < 10) {
    document.getElementById('dBody').innerHTML = '<div class="msg">この月の明細は古い形式です。元帳CSVを取り込み直すと表示できます。</div>';
    return;
  }
  const lines = j.filter(r => CASH_CODES.includes(r[0]) && r[9] && cashLineOf(r[9]) === row.line)
    .map(r => ({ date: r[1], acct: (accountMaster[r[0]] || {}).name || ({ 100: '現金', 104: '当座預金', 105: '普通預金', 107: '定期預金' }[r[0]] || r[0]),
                 aite: r[5], tekiyo: r[6], amt: r[2] === '借方' ? r[3] : -r[3] }))
    .sort((a, b) => Math.abs(b.amt) - Math.abs(a.amt));
  if (!lines.length) { document.getElementById('dBody').innerHTML = '<div class="msg">該当する明細がありません。</div>'; return; }
  const sum = lines.reduce((s, l) => s + l.amt, 0);
  const d = (s) => s && s.length === 8 ? `${s.slice(4, 6)}/${s.slice(6)}` : s;
  document.getElementById('dBody').innerHTML =
    '<table><thead><tr><th>日付</th><th>口座</th><th>相手科目</th><th>摘要</th><th style="text-align:right;">入出金</th></tr></thead><tbody>'
    + lines.map(l => `<tr><td>${d(l.date)}</td><td>${l.acct}</td><td>${l.aite}</td><td>${l.tekiyo}</td><td class="num${l.amt < 0 ? ' neg' : ''}">${Math.round(l.amt).toLocaleString()}</td></tr>`).join('')
    + `</tbody></table><div style="padding:10px 8px;font-size:12px;color:var(--muted);">${lines.length.toLocaleString()}件　合計 ${fmtYen(sum)}　${Math.abs(sum - row.get(month)) < 1 ? '表の金額と一致' : '<span class="neg">表の金額との差 ' + fmtYen(sum - row.get(month)) + '</span>'}</div>`;
}
document.getElementById('cashTbl').addEventListener('click', e => {
  const td = e.target.closest('td.clickable');
  if (td) openDetail(parseInt(td.dataset.ri, 10), td.dataset.m);
});
// マウス位置の列を薄くハイライト（月次資料と同じ方式）
const hoverStyle = document.createElement('style');
document.head.appendChild(hoverStyle);
document.getElementById('cashTbl').addEventListener('mouseover', e => {
  const cell = e.target.closest('td,th'); if (!cell) return;
  const n = cell.cellIndex + 1;
  hoverStyle.textContent = `#cashTbl tbody td:nth-child(${n}), #cashTbl thead th:nth-child(${n}) { background:var(--hl); }`
    + `#cashTbl tbody tr:hover > td:nth-child(${n}) { background:var(--hl-strong); }`;
});
document.getElementById('cashTbl').addEventListener('mouseleave', () => { hoverStyle.textContent = ''; });

/* ============ 起動 ============ */
function renderAll() {
  const fy = parseInt(document.getElementById('fy-select').value, 10);
  const warn = [];
  if (!opening) warn.push('期首残高（opening_balances.json）が未登録のため、繰越・残高は表示できません。「データ取り込み」の初回セットアップから登録してください。');
  if (months.some(m => summaries[m] && !summaries[m].cashByAite)) warn.push('資金繰り表のデータがない月があります。元帳CSVを取り込み直してください（取り込み処理を更新したため）。');
  document.getElementById('warnBox').innerHTML = warn.map(w => `<div class="warn">${w}</div>`).join('');
  renderKpis();
  renderCashTable(fy);
  renderBalanceChart();
  const sel = document.getElementById('bridge-select');
  const fyList = fyMonths(fy).filter(m => months.includes(m));
  const prevKey = sel.value;
  sel.innerHTML = `<option value="fy">${fy}年度累計</option>` + fyList.map(m => `<option value="${m}">${m.slice(0, 4)}年${parseInt(m.slice(4), 10)}月</option>`).join('');
  sel.value = [...sel.options].some(o => o.value === prevKey) ? prevKey : (fyList[fyList.length - 1] || 'fy');
  renderBridge(sel.value);
}

async function boot() {
  if (!(await kaikeiInitAuth())) return;
  document.getElementById('login-view').style.display = 'none';
  document.getElementById('app-view').style.display = 'block';
  document.getElementById('status').textContent = '読み込み中...';

  const [am, ob, idx] = await Promise.all([
    kaikeiGetFile('account_master.json', { allow404: true }),
    kaikeiGetFile('opening_balances.json', { allow404: true }),
    kaikeiGetFile('monthly/_index.json', { allow404: true }),
  ]);
  accountMaster = am || {};
  opening = ob;
  months = ((idx && idx.months) || []).slice().sort();
  await Promise.all(months.map(async m => { summaries[m] = await kaikeiGetFile('summary/' + m + '.json', { allow404: true }); }));
  document.getElementById('status').textContent = `${months.length}ヶ月分`;

  const fys = [...new Set(months.map(m => parseInt(m.slice(4), 10) >= 4 ? +m.slice(0, 4) : +m.slice(0, 4) - 1))].sort().reverse();
  const fySel = document.getElementById('fy-select');
  fySel.innerHTML = fys.map(y => `<option value="${y}">${y}年度</option>`).join('');
  fySel.addEventListener('change', renderAll);
  document.getElementById('unit-select').addEventListener('change', e => { unit = +e.target.value; renderAll(); });
  document.getElementById('bridge-select').addEventListener('change', e => renderBridge(e.target.value));
  if (months.length) renderAll();
  else document.getElementById('cashTbl').innerHTML = '<tbody><tr><td class="empty-msg">まだデータが取り込まれていません。</td></tr></tbody>';
}

document.getElementById('login-btn').addEventListener('click', async () => {
  try { await kaikeiSignIn(); await boot(); }
  catch (e) { document.getElementById('login-err').textContent = e.message || String(e); }
});
boot();
</script>

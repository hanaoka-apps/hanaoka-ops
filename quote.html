<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>見積・受注 — 花岡車輌</title>
<link rel="icon" type="image/svg+xml" href="favicon_quote.svg"><!-- 書類 -->
<script src="https://cdn.jsdelivr.net/npm/@azure/msal-browser@3.10.0/lib/msal-browser.min.js" crossorigin="anonymous"></script>
<script src="hanaoka_auth.js"></script>
<script src="price_core.js?v=20261114c"></script>
<script src="quote_core.js?v=20261115i"></script>
<script src="quote_store.js?v=20261115b"></script>
<script src="quote_ai.js?v=20261115b"></script>
<link rel="stylesheet" href="hanaoka_theme.css?v=20261004"><!-- 色・フォントは共通ファイル -->
<style>
  /* 色・角丸・影・フォントは hanaoka_theme.css の変数だけを使う。ここに色の値は書かない */
  *{box-sizing:border-box}
  [hidden]{display:none!important}
  body{margin:0;background:var(--bg);color:var(--txt);font-family:var(--font);font-size:14px;line-height:1.6}
  button,input,select,textarea{font:inherit;color:inherit}
  .btn{border:1px solid var(--line-strong);background:var(--surface);border-radius:8px;padding:7px 14px;cursor:pointer}
  .btn:hover{border-color:var(--navy)}
  .btn.pri{background:var(--navy);border-color:var(--navy);color:var(--surface)}
  .btn.pri:hover{background:var(--navy-deep)}
  .btn.sm{padding:3px 10px;font-size:12px}
  .link{background:none;border:0;padding:0;color:var(--navy);cursor:pointer;font-size:12px;text-decoration:underline}
  input[type=text],input[type=number],input[type=date],select,textarea{border:1px solid var(--line-strong);border-radius:8px;padding:6px 9px;background:var(--surface);width:100%}
  input:focus,select:focus,textarea:focus{outline:2px solid var(--navy-soft);border-color:var(--navy)}
  .num{text-align:right;font-variant-numeric:tabular-nums}

  /* 上の帯 */
  .top{display:flex;align-items:center;gap:18px;padding:10px 20px;background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
  .brand{display:flex;align-items:center;gap:8px;font-weight:600}
  .brand img{width:26px;height:26px}
  .tabs{display:flex;gap:4px}
  .tab{border:0;background:none;padding:6px 14px;border-radius:8px;cursor:pointer;color:var(--sub)}
  .tab.on{background:var(--navy-soft);color:var(--navy);font-weight:600}
  .top .sp{flex:1}
  .badge{font-size:11px;padding:2px 8px;border-radius:8px;background:var(--amber-soft);color:var(--amber)}
  .who{font-size:12px;color:var(--sub)}

  #loginScreen{min-height:100vh;display:flex;align-items:center;justify-content:center}
  .loginCard{background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);padding:36px 44px;text-align:center}
  #loginError{display:none;color:var(--red);margin-top:12px;font-size:13px}
  #app{display:none}
  #status{padding:8px 20px;font-size:13px;color:var(--sub)}
  #status.error{color:var(--red)}

  /* 作る */
  .edit{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(320px,1fr);gap:20px;padding:4px 20px 60px;max-width:1280px;margin:0 auto}
  .card{background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px 22px}
  .dochead{display:flex;align-items:center;gap:10px;margin-bottom:6px;flex-wrap:wrap}
  .dochead h1{font-size:18px;margin:0;font-weight:600}
  .dochead .no{color:var(--sub)}
  .dochead select{width:auto;padding:3px 8px;font-size:12px}
  .from{font-size:12px;color:var(--sub);margin-left:auto}
  .aibox{border:1px dashed var(--line-strong);border-radius:8px;padding:10px 12px;margin:8px 0 2px}
  .aibox.over{border-color:var(--navy);background:var(--navy-soft)}
  .aibox textarea{border:0;padding:2px;resize:vertical;min-height:38px;background:none}
  .aibox textarea:focus{outline:none}
  .airow{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--sub);margin-top:4px;flex-wrap:wrap}
  .airow .sp{flex:1}
  .aidone{display:flex;align-items:center;gap:10px;font-size:13px;flex-wrap:wrap}
  .aisrc{white-space:pre-wrap;font-size:12px;color:var(--sub);background:var(--bg);border-radius:8px;padding:10px 12px;margin-top:8px;max-height:180px;overflow:auto}
  .spin{display:inline-block;width:12px;height:12px;border:2px solid var(--line-strong);border-top-color:var(--navy);border-radius:50%;animation:sp 0.8s linear infinite;vertical-align:-2px}
  @keyframes sp{to{transform:rotate(360deg)}}
  .sec{padding:14px 0;border-top:1px solid var(--line)}
  .sec:first-of-type{border-top:0}
  .lab{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--sub);margin-bottom:8px}
  .n{width:20px;height:20px;border-radius:50%;background:var(--navy-soft);color:var(--navy);display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:600}
  .picked{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .picked b{font-size:15px}
  .pill{font-size:11px;padding:2px 9px;border-radius:8px;background:var(--navy-soft);color:var(--navy)}
  .pill.warn{background:var(--amber-soft);color:var(--amber)}
  .hint{font-size:12px;color:var(--sub)}
  .row2{display:grid;grid-template-columns:minmax(0,1fr) 90px;gap:8px;margin-top:8px}
  .sug{position:relative}
  .sugList{position:absolute;left:0;right:0;top:100%;margin-top:4px;background:var(--surface);border:1px solid var(--line-strong);border-radius:8px;box-shadow:var(--shadow);z-index:30;max-height:320px;overflow:auto}
  .sugItem{padding:7px 11px;cursor:pointer;display:flex;gap:10px;align-items:baseline}
  .sugItem.on,.sugItem:hover{background:var(--navy-soft)}
  .sugItem .s{color:var(--sub);font-size:12px;margin-left:auto;white-space:nowrap}
  .sugFoot{padding:7px 11px;border-top:1px solid var(--line);color:var(--navy);cursor:pointer;font-size:13px}

  .lhead,.lrow{display:grid;grid-template-columns:minmax(0,1fr) 64px 62px 96px 96px 24px;gap:8px;align-items:center}
  .lhead{font-size:11px;color:var(--mute);margin-bottom:4px}
  .line{padding:6px 0}
  .line .why{font-size:12px;color:var(--sub);margin:3px 0 0 2px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .line .why s{color:var(--mute)}
  .line .why .prev{color:var(--navy)}
  .price{padding:6px 2px}
  .del{border:0;background:none;color:var(--mute);cursor:pointer;font-size:16px;padding:0}
  .del:hover{color:var(--red)}
  .detail{margin:8px 0 4px;padding:12px 14px;background:var(--bg);border-radius:8px;display:grid;grid-template-columns:1fr 1fr;gap:10px 14px}
  .detail label{font-size:12px;color:var(--sub);display:block;margin-bottom:3px}
  .detail .wide{grid-column:1/-1}
  .chips{display:flex;gap:6px;flex-wrap:wrap}
  .chip{border:1px solid var(--line-strong);background:var(--surface);border-radius:8px;padding:3px 10px;font-size:12px;cursor:pointer}
  .chip.on{background:var(--navy);border-color:var(--navy);color:var(--surface)}
  .grid3{display:grid;grid-template-columns:minmax(0,1.4fr) 130px 150px;gap:8px}
  .chk{display:flex;align-items:center;gap:6px;font-size:13px;margin-top:8px}
  .chk input{width:auto}
  .fare{margin-top:10px;font-size:13px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .fare input{width:110px}
  details summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:8px;font-size:12px;color:var(--sub)}
  details summary::-webkit-details-marker{display:none}
  details summary .cur{color:var(--mute)}
  .cond{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px;margin-top:12px}
  .cond label{font-size:12px;color:var(--sub);display:block;margin-bottom:3px}
  .cond .wide{grid-column:1/-1}
  .acts{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}

  /* 右：できあがりの見積書 */
  .side{position:sticky;top:64px;align-self:start}
  .sheetWrap{background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
  .sheetScale{transform-origin:top left;width:794px}
  .inner{font-size:12px;color:var(--sub);margin:10px 4px}
  /* 見積書を出すまで あと○項目 */
  .todo{background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px 18px;margin-bottom:12px;font-size:13px}
  .todo h2{font-size:15px;margin:0 0 8px;font-weight:600}
  .todo .bar{height:6px;border-radius:8px;background:var(--line);overflow:hidden}
  .todo .bar i{display:block;height:100%;background:var(--navy);border-radius:8px}
  .todo .cnt{font-size:12px;color:var(--sub);margin:4px 0 6px}
  .todo .ok{color:var(--green)}
  .todo .it{display:block;width:100%;text-align:left;border:0;background:none;padding:3px 0;cursor:pointer;color:var(--txt)}
  .todo .it:hover{color:var(--navy);text-decoration:underline}
  .todo .it::before{content:"○";margin-right:8px;color:var(--mute)}
  .todo .btn{width:100%;margin-top:10px}
  .todo .notes{margin-top:10px;padding-top:8px;border-top:1px solid var(--line);font-size:12px;color:var(--sub)}
  .todo .notes div+div{margin-top:2px}

  /* 見積書（A4。右のプレビューと印刷で同じものを使う） */
  .sheet{width:794px;min-height:1000px;padding:44px 48px;background:var(--surface);color:var(--txt);font-size:12px;line-height:1.5}
  .sheet h2{text-align:center;font-size:26px;letter-spacing:.3em;margin:0;font-weight:500}
  .sheet .en{text-align:center;font-size:10px;letter-spacing:.15em;border-bottom:1px solid var(--txt);padding-bottom:8px;margin-bottom:20px}
  .sheet .cols{display:grid;grid-template-columns:1.1fr 1fr;gap:36px}
  .sheet .to{font-size:16px;font-weight:600;border-bottom:1px solid var(--txt);padding-bottom:3px;display:flex;justify-content:space-between;gap:10px}
  .sheet .to span:last-child{font-weight:400;font-size:12px;align-self:flex-end;white-space:nowrap}
  .sheet .kv{display:grid;grid-template-columns:84px 1fr;border-bottom:1px solid var(--line-strong);padding:5px 0;align-items:end}
  .sheet .kv small{display:block;font-size:8px;color:var(--sub);letter-spacing:.05em}
  .sheet .co{font-size:15px;font-weight:600;margin:6px 0 2px}
  .sheet .co img{height:22px;display:block;margin-bottom:6px}
  .sheet .addr{font-size:10.5px}
  .sheet .kv2{display:grid;grid-template-columns:70px 1fr;margin-top:8px;align-items:end}
  .sheet .kv2 b{font-size:13px;text-align:center}
  .sheet .remarks{border:1.5px solid var(--txt);min-height:110px;margin-top:14px;padding:10px 12px;display:grid;grid-template-columns:62px 1fr;gap:8px;white-space:pre-wrap}
  .sheet .remarks small{font-size:8px;color:var(--sub);display:block}
  .sheet table{width:100%;border-collapse:collapse}
  .sheet th{background:var(--bg);border:1px solid var(--line-strong);font-weight:500;padding:4px 6px;font-size:11px}
  .sheet th small{display:block;font-size:8px;color:var(--sub);font-weight:400}
  .sheet td{border:1px solid var(--line-strong);padding:7px 6px;vertical-align:bottom}
  .sheet .sum td{text-align:center;font-size:14px;padding:12px 6px 4px}
  .sheet .sum td:last-child{font-weight:600}
  .sheet .bank{text-align:right;font-size:10.5px;margin-top:4px}
  .sheet .items{margin-top:22px}
  .sheet .items td.r{text-align:right}
  .sheet .items td.c{text-align:center}
  .sheet .items .nt{display:block;font-size:10.5px;color:var(--sub)}
  .sheet .items td.lead{font-size:10px}

  /* 一覧 */
  .list{padding:4px 20px 60px;max-width:1280px;margin:0 auto}
  .lbar{display:flex;gap:10px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
  .lbar input[type=text]{max-width:340px}
  .lbar select{width:auto}
  .tbl{width:100%;border-collapse:collapse}
  .tbl th{text-align:left;font-size:12px;color:var(--sub);font-weight:500;padding:8px 10px;border-bottom:1px solid var(--line-strong)}
  .tbl td{padding:9px 10px;border-bottom:1px solid var(--line)}
  .tbl tbody tr{cursor:pointer}
  .tbl tbody tr:hover{background:var(--navy-soft)}
  .empty{padding:36px;text-align:center;color:var(--sub)}

  /* 設定の小窓・お知らせ */
  #modal{display:none;position:fixed;inset:0;background:color-mix(in srgb,var(--txt) 35%,transparent);z-index:50;align-items:center;justify-content:center}
  #modal .dlg{background:var(--surface);border-radius:var(--radius);padding:22px 26px;width:min(560px,92vw);max-height:88vh;overflow:auto}
  #modal h3{margin:0 0 4px;font-size:16px}
  #modal label{font-size:12px;color:var(--sub);display:block;margin:10px 0 3px}
  #toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--txt);color:var(--surface);padding:9px 18px;border-radius:8px;font-size:13px;display:none;z-index:60}

  /* 計算のしくみ */
  .rules{max-width:860px;margin:0 auto;padding:4px 20px 60px}
  .tryrow{display:flex;gap:8px;flex-wrap:wrap}
  .tryrow>*{flex:1 1 130px;min-width:0}
  .tryrow>.sug{flex:2 1 200px}
  .tryrow>#rQty{flex:0 0 70px}
  .step{display:grid;grid-template-columns:28px minmax(0,1fr);gap:12px;margin-top:10px;background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px 18px;border-left:4px solid transparent}
  .step.used{border-left-color:var(--navy)}
  .step.skip>.n,.step.skip .st,.step.skip .sr{opacity:.55}
  .step .st{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .step .sr{font-size:13px;color:var(--sub);margin-top:2px}
  .step .res{margin-top:6px;padding:6px 10px;background:var(--navy-soft);border-radius:8px;font-size:13px}
  .step.over .res,.step.skip .res{background:var(--bg);color:var(--sub)}
  .step details{margin-top:8px}
  .rlist{margin-top:6px}
  .rlist input{max-width:320px;margin-bottom:4px}
  .rlist .it{font-size:12px;padding:6px 0;border-top:1px solid var(--line)}
  @media (max-width:900px){ .edit{grid-template-columns:1fr} .side{position:static} }
  @media print{
    @page{size:A4;margin:8mm}
    body{background:var(--surface)}
    .top,#status,.formCol,.inner,.todo,#vList,#toast,#modal{display:none!important}
    .edit{display:block;padding:0;max-width:none}
    .side{position:static}
    .sheetWrap{box-shadow:none;border-radius:0;height:auto!important;overflow:visible}
    .sheetScale{transform:none!important}
    .sheet{padding:10mm 8mm;min-height:0}
  }
</style>
</head>
<body>

<div id="loginScreen">
  <div class="loginCard">
    <div class="brand" style="justify-content:center;font-size:18px;margin-bottom:6px"><img src="favicon_quote.svg" alt="">見積・受注</div>
    <p class="hint" data-ha-login>花岡車輌のアカウントでサインインしてください</p>
    <button class="btn pri" id="loginBtn" data-ha-login>サインイン</button>
    <div id="loginError"></div>
  </div>
</div>

<div id="app">
  <div class="top">
    <div class="brand"><img src="favicon_quote.svg" alt="">見積・受注</div>
    <div class="tabs">
      <button class="tab on" data-view="edit">作る</button>
      <button class="tab" data-view="list">一覧</button>
      <button class="tab" data-view="rules">計算のしくみ</button>
    </div>
    <span class="sp"></span>
    <span class="badge" id="demoBadge" hidden>見本のデータ</span>
    <button class="link" id="setBtn">会社の情報</button>
    <span class="who" id="who"></span>
  </div>
  <div id="status"></div>

  <div id="vEdit" class="edit">
    <div class="card formCol" id="form"></div>
    <div class="side">
      <div class="todo" id="todo"></div>
      <div class="sheetWrap" id="sheetWrap"><div class="sheetScale" id="sheetScale"><div class="sheet" id="sheet"></div></div></div>
      <div class="inner" id="inner"></div>

    </div>
  </div>

  <div id="vList" class="list" hidden>
    <div class="lbar">
      <button class="btn pri" id="newBtn">＋ 見積を作る</button>
      <input type="text" id="lq" placeholder="番号・取引先・件名で探す">
      <select id="lmine"><option value="">みんなの分</option><option value="1">自分の分</option></select>
      <select id="lstatus"><option value="">状態：すべて</option></select>
    </div>
    <div class="card" style="padding:6px 12px"><table class="tbl"><thead><tr><th>番号</th><th>日付</th><th>取引先</th><th>件名</th><th class="num">合計（税込）</th><th>状態</th><th>担当</th></tr></thead><tbody id="lbody"></tbody></table><div class="empty" id="lempty" hidden></div></div>
  </div>


  <div id="vRules" class="rules" hidden>
    <div class="card">
      <div class="lab">単価と送料は、下の ①〜⑥ の順に決まります。取引先と型式を入れると、その組み合わせでどの段が働いたかが分かります。</div>
      <div class="tryrow">
        <div class="sug"><input type="text" id="rCust" placeholder="取引先"></div>
        <div class="sug"><input type="text" id="rCode" placeholder="型式"></div>
        <input type="number" id="rQty" class="num" min="1" title="数量">
        <select id="rPref" title="届け先の県"></select>
        <input type="date" id="rDate" title="この日の定価で計算します">
      </div>
    </div>
    <div id="rFlow"></div>
  </div>
</div>

<div id="modal"><div class="dlg" id="dlg"></div></div>
<div id="toast"></div>

<script>
"use strict";
// ============================================================
// 見積・受注：画面。計算は quote_core.js（単価と送料は price_core.js）、読み書きは quote_store.js
//   ?demo=1 … 架空の見本データで動かす（サインインなし。quote_demo.js）
//   ?doc=ID … 保存してある書類を開く　?customer=得意先コード　?case=案件ID … 最初の値を入れて開く
// ============================================================
const Q = QuoteCore, P = PriceCore;
const SCOPES = ['User.Read', 'Sites.ReadWrite.All', 'Files.Read.All'];
const UNITS = ['台', '個', '枚', '本', '式', 'セット'];
const PARAMS = new URLSearchParams(location.search);
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const yen = v => Q.fmt(v);
const today = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; };

let msalInstance = null, account = null, store = null;
let DATA = null, ENV = null, CUST = [], CUSTMAP = {}, ITEMS = {}, SET = QuoteStore.DEFAULT_SETTINGS, HEADS = [];
let custRows = [], itemRows = [];
let DOC = null, COMP = null, dirty = false, openLine = -1, fareOpen = false;
let AI = null, aiFiles = [], aiBusy = false, aiOpen = false, aiSrcOpen = false;

// ---------- はじまり ----------
async function init() {
  $('loginBtn').onclick = login;
  if (PARAMS.has('demo')) {
    await new Promise((ok, ng) => { const s = document.createElement('script'); s.src = 'quote_demo.js?v=20261115b'; s.onload = ok; s.onerror = ng; document.head.appendChild(s); });
    account = QuoteDemo.user; store = QuoteStore.demo(QuoteDemo); AI = QuoteAI.mock(QuoteDemo); $('demoBadge').hidden = false;
    return start();
  }
  if (typeof msal === 'undefined') return loginError('サインインの部品を読み込めませんでした。もう一度開いてください。');
  msalInstance = new msal.PublicClientApplication(HanaokaAuth.msalConfig());
  await msalInstance.initialize();
  await msalInstance.handleRedirectPromise();
  account = await HanaokaAuth.restore(msalInstance, SCOPES);
  if (account) startReal();
}
async function login() {
  try { $('loginError').style.display = 'none'; account = await HanaokaAuth.login(msalInstance, SCOPES); startReal(); }
  catch (e) { loginError('サインインできませんでした：' + e.message); }
}
function loginError(m) { HanaokaAuth.done(); $('loginError').textContent = m; $('loginError').style.display = 'block'; }
async function getToken() {
  try { return (await msalInstance.acquireTokenSilent({ scopes: SCOPES, account })).accessToken; }
  catch { return (await msalInstance.acquireTokenPopup({ scopes: SCOPES })).accessToken; }
}
function startReal() { store = QuoteStore.create({ getToken, P, Q, confirm: m => confirm(m) }); AI = QuoteAI.relay({ call: store.call }); return start(); }

async function start() {
  $('loginScreen').style.display = 'none'; $('app').style.display = 'block';
  $('who').textContent = account.name || account.username || '';
  status('読み込んでいます…');
  const errs = [], safe = (p, name, fallback) => p.catch(e => { console.warn(name, e); errs.push(name); return fallback; });
  const [rules, cust, items, set, heads] = await Promise.all([
    safe(store.loadRules(), '価格のルール', { prices: [], classes: [], exceptions: [], fares: [], assembly: [], costs: [] }),
    safe(store.loadCustomers(), '得意先マスタ', []), safe(store.loadItems(), '品目マスタ', {}),

// 商品を探すための一覧：定価リストの型式と、品目マスタの品目コード
function buildItemRows() {
  const seen = {}; itemRows = [];
  const add = (code, name, extra) => {
    if (!code || seen[code]) return; seen[code] = 1;
    const rc = Q.resolveCode(code, ITEMS, ENV.index);
    itemRows.push({ key: Q.norm(code + ' ' + name + ' ' + (extra || '')), head: Q.norm(code), code, name, priced: !!rc.code && !rc.noPrice });
  };
  DATA.prices.forEach(p => { if (P.num(p.定価) !== null) add(p.型式, p.品名 || (ITEMS[p.型式] || {}).name || ''); });
  Object.keys(ITEMS).forEach(c => { const it = ITEMS[c]; if (!/使用禁止|廃番/.test(it.kaihai || '')) add(c, it.name, it.kakaku); });

// ---------- 計算のしくみ ----------
// 今のルールがどう働くかを、6つの段で見せる。文は quote_core.js の flow と price_core.js の文（決まりを文にしたもの）をそのまま使う
let RT = null, rOpen = {}, rBound = false;
function openRules() {
  if (!RT) {
    // 最初に開いたときは、今作っている見積の内容を入れておく
    const l = Q.usedLines(DOC)[0] || {};
    RT = { cust: DOC.cust && !DOC.cust.isNew ? DOC.cust : null, code: l.code || '', qty: l.qty || 1, pref: DOC.dest.pref || '', date: Q.priceDateOf(DOC) || today() };
  }
  if (!rBound) {
    rBound = true;
    $('rPref').innerHTML = '<option value="">届け先の県</option>' + P.PREFS.map(p => `<option>${p}</option>`).join('');
    suggest($('rCust'), q => Q.search(custRows, q, 8).map(r => ({ label: r.c.fullName || r.c.name, sub: (Q.rankLabel(r.c.kakeName) || r.c.kakeName) + '　' + r.c.code, pick: () => { RT.cust = r.c; $('rCust').value = r.c.fullName || r.c.name; renderRules(); } })));
    suggest($('rCode'), q => Q.search(itemRows, q, 8).map(r => ({ label: r.code, sub: (r.name || '') + (r.priced ? '' : '　定価なし'), pick: () => { RT.code = r.code; $('rCode').value = r.code; renderRules(); } })));
    $('rCust').addEventListener('input', e => { if (!e.target.value.trim() && RT.cust) { RT.cust = null; renderRules(); } });
    $('rCode').addEventListener('input', e => { RT.code = e.target.value.trim(); renderRules(); });
    $('rQty').oninput = e => { RT.qty = Number(e.target.value) || 1; renderRules(); };
    $('rPref').onchange = e => { RT.pref = e.target.value; renderRules(); };
    $('rDate').onchange = e => { RT.date = e.target.value || today(); renderRules(); };
    $('rFlow').addEventListener('toggle', e => { const k = e.target.dataset && e.target.dataset.k; if (k) { rOpen[k] = e.target.open; if (e.target.open) fillRuleList(k); } }, true);
    $('rFlow').addEventListener('input', e => { const k = e.target.dataset.q; if (k) fillRuleList(k, e.target.value); });
  }
  $('rCust').value = RT.cust ? (RT.cust.fullName || RT.cust.name) : ''; $('rCode').value = RT.code; $('rQty').value = RT.qty; $('rPref').value = RT.pref; $('rDate').value = RT.date;
  renderRules();
}
function rulesComp() {
  if (!RT.code) return null;
  return Q.compute(DATA, Object.assign(Q.blank('quote', RT.date, ''), { cust: RT.cust, dest: { name: '', pref: RT.pref, personal: false }, lines: [{ code: RT.code, qty: RT.qty || 1 }] }), ENV);
}
function renderRules() {
  const comp = rulesComp(), steps = Q.flow(DATA, comp);
  const said = { used: s => /rank|cls|exc/.test(s.key) ? 'ここで掛け率が決まった' : '使った', over: () => 'あとの段が優先', skip: () => '当てはまらない' };
  const more = { price: '定価の移り変わりを見る', cls: '今入っている決まりを見る', exc: '今入っている決まりを見る' };
  $('rFlow').innerHTML = steps.map((s, i) => `<div class="step ${s.state}">
    <span class="n">${i + 1}</span>
    <div>
      <div class="st"><b>${esc(s.title)}</b>${s.state ? `<span class="${s.state === 'used' ? 'pill' : s.state === 'over' ? 'pill warn' : 'hint'}">${said[s.state](s)}</span>` : ''}<span class="hint">${esc(s.stat)}</span></div>
      <div class="sr">${esc(s.rule)}</div>
      ${s.result.map(r => `<div class="res">${esc(r)}</div>`).join('')}
      ${more[s.key] && (s.key !== 'price' || (comp && comp.lines[0].listCode)) ? `<details data-k="${s.key}"${rOpen[s.key] ? ' open' : ''}><summary><span class="link">${more[s.key]}</span></summary><div class="rlist" id="rl_${s.key}"></div></details>` : ''}
    </div></div>`).join('');

}
// 段の中の「今入っている決まり」。件数が多いので、探す欄で絞る（例外は、選んだ型式のものを先に出す）
function fillRuleList(k, q) {
  const box = $('rl_' + k); if (!box) return;
  if (k === 'price') {
    const code = rulesComp().lines[0].listCode;
    box.innerHTML = P.priceHistory(DATA.prices, code).filter(p => P.num(p.定価) !== null).map(p => `<div class="it">${esc(P.ymd(p.適用開始日))} から　${yen(P.num(p.定価))}</div>`).join('');
    return;
  }
  const rows = k === 'cls' ? DATA.classes : DATA.exceptions, say = k === 'cls' ? P.clsSentence : P.excSentence;
  const comp = rulesComp(), def = k === 'exc' && comp && comp.lines[0].listCode ? comp.lines[0].listCode : '';
  if (q === undefined) { const old = box.querySelector('input'); q = old ? old.value : def; }
  const nq = Q.norm(q), hit = rows.map(r => ({ text: say(r), memo: [r.メモ, r.出典].filter(Boolean).join('／') })).filter(x => !nq || Q.norm(x.text + ' ' + x.memo).includes(nq));
  if (!box.querySelector('input')) box.innerHTML = `<input type="text" data-q="${k}" value="${esc(q)}" placeholder="取引先・型式で絞る"><div></div>`;
  box.lastElementChild.innerHTML = (hit.slice(0, 30).map(x => `<div class="it">${esc(x.text)}${x.memo ? `<div class="hint">メモ：${esc(x.memo)}</div>` : ''}</div>`).join('') || '<div class="it hint">当てはまる決まりはありません</div>')
    + (hit.length > 30 ? `<div class="it hint">ほか ${hit.length - 30} 件。上の欄で絞ってください</div>` : '');
}

// AI は読み取るだけ。当てはめるのは QuoteAI.apply、値段はルール。読み取ったあとは、ふつうの入力と同じ
function aiBoxHtml() {
  if (aiBusy) return `<div class="aidone"><span class="spin"></span>読み取っています…（1分ほどかかることがあります）</div>`;
  if (DOC.ai && !aiOpen) return `<div class="aidone"><span class="pill">AIが読み取りました</span><span class="hint">内容を確かめてください</span><span class="sp" style="flex:1"></span>

  return `<textarea id="aiText" rows="2" placeholder="メール・FAX・注文書の文面を貼ると、下の欄が埋まります（ファイルはここに置けます）"></textarea>
    <div class="airow"><span id="aiFiles">${aiFiles.length ? '添付：' + esc(aiFiles.map(f => f.name).join('、')) + ' <button class="link" id="aiClear">外す</button>' : ''}</span><span class="sp"></span>
      <label class="link">ファイルを選ぶ<input type="file" id="aiFile" multiple accept=".pdf,image/*" hidden></label>

}
function drawAiBox() { $('aiBox').innerHTML = aiBoxHtml(); bindAiBox(); }
function bindAiBox() {
  const box = $('aiBox'), on = (id, f) => { const el = $(id); if (el) el.onclick = f; };
  on('aiGo', runAI);
  on('aiClear', () => { aiFiles = []; keepText(drawAiBox); });
  on('aiSrc', () => { aiSrcOpen = !aiSrcOpen; drawAiBox(); });
  on('aiOk', () => { DOC.ai.notes = []; touch(); drawAiBox(); refresh(); });
  on('aiAgain', () => { aiOpen = true; drawAiBox(); $('aiText').value = DOC.ai.text || ''; $('aiText').focus(); });
  if ($('aiFile')) $('aiFile').onchange = e => addAiFiles(e.target.files);
  box.ondragover = e => { e.preventDefault(); box.classList.add('over'); };
  box.ondragleave = () => box.classList.remove('over');
  box.ondrop = e => { e.preventDefault(); box.classList.remove('over'); if (!$('aiText')) { aiOpen = true; drawAiBox(); } addAiFiles(e.dataTransfer.files); };
}
function keepText(f) { const v = $('aiText') ? $('aiText').value : ''; f(); if ($('aiText')) $('aiText').value = v; }
function addAiFiles(list) {
  const ok = [...list].filter(f => /pdf|image\//.test(f.type) || /\.(pdf|png|jpe?g|webp)$/i.test(f.name));
  if (ok.length < list.length) toast('PDF と画像だけ読めます');
  aiFiles = aiFiles.concat(ok); keepText(drawAiBox);
}
const b64 = f => new Promise((ok, ng) => { const r = new FileReader(); r.onload = () => ok(String(r.result).split(',')[1] || ''); r.onerror = () => ng(r.error); r.readAsDataURL(f); });
async function runAI() {
  const text = $('aiText').value.trim();
  if (!text && !aiFiles.length) return toast('文面を貼るか、ファイルを置いてください');
  if (aiFiles.reduce((s, f) => s + f.size, 0) > 20 * 1024 * 1024) return toast('ファイルが大きすぎます（合わせて20MBまで）');
  const used = DOC.cust || Q.usedLines(DOC).length;
  if (used && !confirm('今の取引先・商品・届け先を、読み取った内容で置きかえます。よろしいですか？')) return;
  aiBusy = true; drawAiBox();
  try {
    const files = []; for (const f of aiFiles) files.push({ data: await b64(f), type: f.type, name: f.name });
    const r = await AI.read({ text, files, today: today(), kind: DOC.kind }, account.name || account.username || '');
    const a = QuoteAI.apply(DOC, r, { custRows, itemRows, prefOf: P.prefOf, prefs: P.PREFS, today: today() });
    DOC = a.doc; DOC.ai = { at: new Date().toISOString(), by: account.name || '', text: text.slice(0, 8000), files: aiFiles.map(f => f.name), notes: a.notes };
    aiBusy = false; aiOpen = false; aiFiles = []; openLine = -1; touch(); renderForm(); refresh();
    if (a.custQuery && $('custQ')) { $('custQ').value = a.custQuery; $('custQ').focus(); $('custQ').dispatchEvent(new Event('input')); }
  } catch (e) { console.error(e); aiBusy = false; drawAiBox(); if ($('aiText')) $('aiText').value = text; toast(e.message || 'AI の読み取りに失敗しました'); }
}

    ${kind === 'once' ? `<div class="wide"><label>理由</label><div class="chips">${Q.REASONS.map(r => `<button class="chip${ov.reason === r ? ' on' : ''}" data-reason="${esc(r)}">${esc(r)}</button>`).join('')}</div></div>` : ''}
    <div class="wide"><label>${kind === 'wrong' ? '正しくはどう決まりますか（必ずひとこと。ルールを直す人が読みます）' : 'ひとこと（社内だけ）'}</label><input type="text" data-o="memo" value="${esc(ov.memo ?? '')}"></div>

    <div><label>出荷のしかた（送料の計算が変わります）</label><select data-f="ship"><option value="">段ボール梱包（ふつう）</option><option value="組立出荷"${l.ship === '組立出荷' ? ' selected' : ''}>組立出荷（修理品預り・デモなど）</option></select></div>

// 明細の中の入力・ボタン（1か所で受ける）
document.addEventListener('input', e => {
  const line = e.target.closest && e.target.closest('#lines .line'); if (!line) return;
  const i = +line.dataset.i, l = DOC.lines[i], f = e.target.dataset.f, o = e.target.dataset.o;
  if (f === 'code') { const v = e.target.value.trim(); if (v !== (l.code || '')) { l.code = v; l.name = ''; } }
  else if (f === 'qty') l.qty = e.target.value === '' ? null : Number(e.target.value);
  else if (f === 'price') l.price = e.target.value === '' ? null : Number(e.target.value);
  else if (f === 'unitName' || f === 'note' || f === 'lead' || f === 'ship') l[f] = e.target.value;
  else if (o) { l.ov = l.ov || {}; l.ov[o] = o === 'memo' ? e.target.value : (e.target.value === '' ? null : Number(e.target.value)); if (o === 'price' && l.ov.price !== null) clearOther(line, l, 'k'); if (o === 'k' && l.ov.k !== null) clearOther(line, l, 'price'); }
  else return;
  touch(); refresh();
});
function clearOther(line, l, name) { l.ov[name] = null; const el = line.querySelector(`[data-o=${name}]`); if (el) el.value = ''; }
document.addEventListener('click', e => {
  const line = e.target.closest && e.target.closest('#lines .line'); if (!line) return;
  const i = +line.dataset.i, l = DOC.lines[i], a = e.target.dataset.a;
  if (a === 'del') { DOC.lines.splice(i, 1); if (!DOC.lines.length) DOC.lines.push({ code: '', qty: 1 }); openLine = -1; }
  else if (a === 'open') openLine = openLine === i ? -1 : i;
  else if (a === 'reset') { l.ov = null; }
  else if (a === 'prev') {
    // 前回の受注単価にする。基本の単価がある行は「今回だけ特別・継続の特価」として記録に残る。ない行は、単価の欄に入れる
    const c = COMP.lines[DOC.lines.slice(0, i).filter(x => x.code || x.name || P.num(x.price) !== null).length];
    if (!c || !c.prev) return;
    if (c.base && c.base.price !== null) l.ov = Object.assign({}, l.ov, { price: c.prev.unit, k: null, once: true, reason: l.ov && Q.REASONS.includes(l.ov.reason) ? l.ov.reason : '継続の特価' });
    else l.price = c.prev.unit;
  }
  else if (e.target.dataset.kind) { l.ov = l.ov || {}; const k = e.target.dataset.kind, was = l.ov.reason === Q.WRONG ? 'wrong' : l.ov.once ? 'once' : ''; l.ov.once = k === 'once' && was !== 'once'; l.ov.reason = k === 'wrong' && was !== 'wrong' ? Q.WRONG : (k === 'once' && Q.REASONS.includes(l.ov.reason) ? l.ov.reason : ''); }
  else if (e.target.dataset.reason) { l.ov = l.ov || {}; l.ov.reason = l.ov.reason === e.target.dataset.reason ? '' : e.target.dataset.reason; }
  else return;
  touch(); renderLines(); refresh();
});

// 入力欄の下に候補を出す。rowsOf(q) → [{ label, sub, pick }]、footOf(q) → いちばん下の1行（なくてもよい）
function suggest(input, rowsOf, footOf) {
  const box = input.parentElement; let list = null, rows = [], foot = null, cur = 0;
  const close = () => { if (list) { list.remove(); list = null; } };
  const draw = () => {
    close(); rows = rowsOf(input.value); foot = footOf ? footOf(input.value) : null; cur = 0;
    if (!rows.length && !foot) return;
    list = document.createElement('div'); list.className = 'sugList';
    list.innerHTML = rows.map((r, i) => `<div class="sugItem${i === 0 ? ' on' : ''}" data-i="${i}"><span>${esc(r.label)}</span><span class="s">${esc(r.sub || '')}</span></div>`).join('') + (foot ? `<div class="sugFoot">${esc(foot.label)}</div>` : '');
    list.onmousedown = e => { e.preventDefault(); const it = e.target.closest('.sugItem'); close(); if (it) rows[+it.dataset.i].pick(); else if (e.target.closest('.sugFoot')) foot.pick(); };
    box.appendChild(list);
  };
  input.addEventListener('input', draw);
  input.addEventListener('focus', () => { if (input.value && !list) draw(); });
  input.addEventListener('blur', () => setTimeout(close, 120));
  input.addEventListener('keydown', e => {
    if (!list) return;
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); cur = Math.max(0, Math.min(rows.length - 1, cur + (e.key === 'ArrowDown' ? 1 : -1))); list.querySelectorAll('.sugItem').forEach((el, i) => el.classList.toggle('on', i === cur)); }
    else if (e.key === 'Enter') { e.preventDefault(); const r = rows[cur]; close(); if (r) r.pick(); else if (foot) foot.pick(); }
    else if (e.key === 'Escape') close();
  });
}

// ---------- 計算し直して、変わる所だけ書き直す ----------
function refresh() {
  COMP = Q.compute(DATA, DOC, ENV);
  // 明細：計算した結果は、入力のある行にだけ対応する（空の行は飛ばされている）
  let k = 0;
  DOC.lines.forEach((l, i) => {
    const el = lineEl(i); if (!el) return;
    const used = !!(l.code || l.name || P.num(l.price) !== null), c = used ? COMP.lines[k++] : null;
    const unitBox = el.querySelector('[data-c=unit]'), needInput = c && (c.manual || c.noRule);
    if (needInput) { if (!unitBox.querySelector('input')) unitBox.innerHTML = `<input type="number" class="num" data-f="price" value="${esc(l.price ?? '')}" placeholder="単価">`; }
    else unitBox.innerHTML = `<div class="num price">${c && c.unit !== null ? yen(c.unit) : ''}</div>`;
    el.querySelector('[data-c=amount]').textContent = c && c.amount !== null ? yen(c.amount) : '';
    el.querySelector('[data-c=why]').innerHTML = !c ? '' : whyHtml(c, i);
  });
  // 送料
  const f = COMP.fare, how = [f.carrier, f.region, f.kg ? f.kg + 'kg' : ''].filter(Boolean).join('・');
  $('fare').innerHTML = fareOpen
    ? `送料 <input type="number" class="num" id="fareIn" value="${esc(DOC.fareManual ?? (f.rule ?? ''))}"> <span class="hint">基本 ${f.rule === null ? 'なし' : yen(f.rule)}${how ? '（' + esc(how) + '）' : ''}</span> <button class="link" id="fareReset">基本に戻す</button>${fareWhy()}`
    : `送料 <b>${f.amount === null ? '—' : yen(f.amount)}</b> <span class="hint">${f.changed ? `基本 ${f.rule === null ? 'なし' : yen(f.rule)} から変更` : esc(how)}</span> <button class="link" id="fareEdit">変える</button>${f.changed ? fareWhy() : ''}`;
  if (fareOpen) {
    $('fareIn').oninput = e => { DOC.fareManual = e.target.value === '' ? null : Number(e.target.value); touch(); refreshSide(); };
    $('fareReset').onclick = () => { DOC.fareManual = null; DOC.fareReason = ''; DOC.fareMemo = ''; fareOpen = false; touch(); refresh(); };
  } else $('fareEdit').onclick = () => { fareOpen = true; refresh(); $('fareIn').focus(); };
  $('fare').querySelectorAll('[data-fk]').forEach(b => b.onclick = () => { DOC.fareReason = DOC.fareReason === b.dataset.fk ? '' : b.dataset.fk; touch(); refresh(); if (fareOpen) $('fareIn').focus(); });
  if ($('fareMemo')) $('fareMemo').oninput = e => { DOC.fareMemo = e.target.value; touch(); refreshSide(); };
  $('condCur').textContent = [DOC.title, '期限 ' + DOC.expiry, DOC.notes ? '備考あり' : '備考なし'].filter(Boolean).join('・');
  refreshSide();
}
// 送料を変えたときの2択（単価と同じ）
function fareWhy() {
  return `<span class="chips">${[Q.ONCE, Q.WRONG].map(r => `<button class="chip${DOC.fareReason === r ? ' on' : ''}" data-fk="${r}">${r}</button>`).join('')}</span>`
    + (DOC.fareReason === Q.WRONG ? `<input type="text" id="fareMemo" style="flex:1 1 100%;width:100%" value="${esc(DOC.fareMemo ?? '')}" placeholder="正しくはどう決まりますか（必ずひとこと。ルールを直す人が読みます）">` : '');
}
// 前回の受注単価（同じ取引先・同じ品目）。今の単価と違うときは、押すとその単価になる
function prevHtml(c) {
  const p = c.prev; if (!p) return '';
  const same = c.unit === p.unit;
  return `<span class="prev">${p.from === 'sha' ? '同じ社名の前回' : '前回の受注'} ${yen(p.unit)}（${esc(p.date)}）${same ? '・同じ' : ''}</span>${same ? '' : '<button class="link" data-a="prev">この単価にする</button>'}`;
}
function whyHtml(c, i) {
  const open = `<button class="link" data-a="open">${openLine === i ? '閉じる' : (c.base && c.base.price !== null ? '変える' : '補足・納期')}</button>`;
  if (c.changed) return `<s>基本 ${yen(c.base.price)}</s><span>→ 今回 ${yen(c.unit)}</span><span class="pill warn">${esc(c.reason || '理由を選んでください')}</span>${prevHtml(c)}${open}`;
  if (c.base && c.base.price !== null) return `<span>${esc(c.base.why)}${c.via ? '（' + esc(c.listCode) + ' の定価）' : ''}</span>${prevHtml(c)}${open}`;
  if (c.variantOf) return `<span>${esc(c.variantOf)} の枝番つき（キャスター変更・特注など）です。単価を入れてください${c.refPrice !== null ? '（' + esc(c.variantOf) + ' なら ' + yen(c.refPrice) + '）' : ''}</span>${prevHtml(c)}${open}`;
  if (c.base && c.base.list !== null) return `<span>定価 ${yen(c.base.list)}。掛け率が決まらないので、単価を入れてください</span>${prevHtml(c)}${open}`;
  return `<span>${c.manual ? '' : '定価リストにない品です。単価を入れてください'}</span>${prevHtml(c)}${open}`;
}
function refreshSide() {
  COMP = Q.compute(DATA, DOC, ENV);
  $('sheet').innerHTML = sheetHtml();
  const m = COMP.margin;
  $('inner').textContent = m ? `社内だけ：利益率 ${Math.round(m.rate * 100)}％${m.all ? '' : '（原価がわかる ' + m.lines + ' 行で計算）'}` : '';
  renderTodo();
  fitSheet();
}
// 右上の「見積書を出すまで あと○項目」。残っている項目を押すと、その欄に飛ぶ
function renderTodo() {
  const t = Q.todo(DOC, COMP), all = t.items.length, done = all - t.left, kindName = DOC.kind === 'order' ? '受注伝票' : '見積書';
  const ok = t.items.filter(x => x.done).map(x => x.label).join('・');
  $('todo').innerHTML = `<h2>${t.left ? `${kindName}を出すまで あと ${t.left} 項目` : `${kindName}を出せます`}</h2>
    <div class="bar"><i style="width:${Math.round(done / all * 100)}%"></i></div>
    <div class="cnt">${done} / ${all} 完了</div>
    ${ok ? `<div class="ok">✓ ${esc(ok)}</div>` : ''}
    ${t.items.filter(x => !x.done).map(x => `<button class="it" data-k="${x.key}" data-l="${x.line}">${esc(x.label)}</button>`).join('')}
    <button class="btn pri" id="printBtn">${kindName}を出す →</button>
    ${t.notes.length ? `<div class="notes">${t.notes.map(s => `<div>${esc(s)}</div>`).join('')}</div>` : ''}`;
  $('printBtn').onclick = printSheet;
  $('todo').querySelectorAll('.it').forEach(b => b.onclick = () => jumpTo(b.dataset.k, +b.dataset.l));
}
// 計算した行の番号（空の行は飛ばされている）を、画面の行の番号に直す
function docLineOf(k) { let n = -1; for (let i = 0; i < DOC.lines.length; i++) { const l = DOC.lines[i]; if (l.code || l.name || P.num(l.price) !== null) n++; if (n === k) return i; } return 0; }
function jumpTo(key, k) {
  const go = el => { if (el) { el.scrollIntoView({ block: 'center', behavior: 'smooth' }); el.focus({ preventScroll: true }); } };
  const i = k >= 0 ? docLineOf(k) : 0;
  if (key === 'cust') go($('custQ') || $('custChange'));
  else if (key === 'pref') go($('fPref'));
  else if (key === 'lines') go(lineEl(i).querySelector(k >= 0 ? '[data-f=qty]' : '[data-f=code]'));
  else if (key === 'price') go(lineEl(i).querySelector('[data-f=price]') || lineEl(i).querySelector('[data-f=code]'));
  else if (key === 'reason') { openLine = i; renderLines(); refresh(); go(lineEl(i).querySelector('[data-kind]')); }
  else if (key === 'fareReason') { fareOpen = true; refresh(); go($('fareIn')); }
}
// 右の見積書を、欄の幅に合わせて縮める（印刷のときは元の大きさ）
function fitSheet() {
  const w = $('sheetWrap').clientWidth; if (!w) return;
  const s = Math.min(1, w / 794);
  $('sheetScale').style.transform = `scale(${s})`;
  $('sheetWrap').style.height = Math.ceil($('sheet').offsetHeight * s) + 'px';
}

async function printSheet() {
  const warn = COMP.checks.filter(c => c.level === 'warn');
  if (warn.length && !confirm('確認することが残っています。\n・' + warn.map(c => c.text).join('\n・') + '\n\nこのまま見積書を出しますか？')) return;
  if (!(await save(true))) return;
  fitSheet(); window.print();
}

// ---------- 保存・複製 ----------
async function save(quiet) {
  try {
    if (!DOC.no) { HEADS = await store.listDocs(); DOC.no = Q.nextNumber(DOC.kind, DOC.date, HEADS.map(h => h.no)); }
    COMP = Q.compute(DATA, DOC, ENV);
    const rec = Q.toRecord(DOC, COMP, account.name || account.username || '', new Date().toISOString());
    const id = await store.saveDoc(rec.fields, DOC.spId);
    if (!id) { if (!DOC.spId) DOC.no = ''; return false; }
    DOC.spId = id; dirty = false;
    renderForm(); refresh();
    if (!quiet) toast(DOC.no + ' を保存しました');
    return true;
  } catch (e) { console.error(e); toast('保存できませんでした：' + e.message); return false; }
}
function copyDoc() { if (!leaveOk()) return; DOC = Q.duplicate(DOC, today(), account.name || ''); openLine = -1; dirty = true; renderForm(); refresh(); toast('複製しました。保存すると新しい番号が付きます'); }

async function refreshList() { try { HEADS = await store.listDocs(); } catch (e) { toast('一覧を読めませんでした'); } renderList(); }
function renderList() {
  const q = Q.norm($('lq').value), mine = $('lmine').value, st = $('lstatus').value, me = account.name || '';
  const rows = HEADS.filter(h => (!q || Q.norm(h.no + ' ' + h.customer + ' ' + h.subject + ' ' + h.customerCode).includes(q)) && (!mine || h.owner === me) && (!st || h.status === st))
    .sort((a, b) => a.date < b.date ? 1 : a.date > b.date ? -1 : (a.no < b.no ? 1 : -1));
  $('lbody').innerHTML = rows.map(h => `<tr data-id="${esc(h.spId)}"><td>${esc(h.no)}</td><td>${esc(h.date)}</td><td>${esc(h.customer)}</td><td>${esc(h.subject)}</td><td class="num">${yen(h.total)}</td><td>${esc(h.status)}</td><td>${esc(h.owner)}</td></tr>`).join('');
  $('lempty').hidden = !!rows.length;
  $('lempty').textContent = HEADS.length ? '当てはまる書類がありません' : 'まだ書類がありません。「＋ 見積を作る」から始めます';
  $('lbody').querySelectorAll('tr').forEach(tr => tr.onclick = async () => { if (!leaveOk()) return; try { openDoc(await store.getDoc(tr.dataset.id)); } catch (e) { toast('書類を開けませんでした'); } });
}

  $('sSave').onclick = async () => {
    const next = Object.assign({}, SET, { company: $('sCompany').value.trim(), regNo: $('sReg').value.trim(), bank: $('sBank').value.trim(),
      offices: $('sOffices').value.split('\n').map(l => l.split(/[｜|]/).map(x => x.trim())).filter(a => a[0]).map(a => ({ name: a[0], zip: a[1] || '', addr: a[2] || '', tel: a[3] || '', fax: a[4] || '' })) });
    try { if (await store.saveSettings(next)) { SET = next; closeModal(); renderForm(); refresh(); toast('保存しました'); } }
    catch (e) { toast('保存できませんでした：' + e.message); }
  };
}
function closeModal() { $('modal').style.display = 'none'; }

init();
</script>
</body>
</html>

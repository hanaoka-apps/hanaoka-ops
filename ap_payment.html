<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>支払（決裁・出力） | 花岡車輌</title>
<script src="https://cdn.jsdelivr.net/npm/@azure/msal-browser@3.10.0/lib/msal-browser.min.js" crossorigin="anonymous"></script>
<script src="ap_smile.js"></script>
<script src="nav.js" defer></script>
<style>
/* 見た目は支払決済アプリ（settle-proto）にそろえる */
:root{--pri:#1a5fa8;--pri-l:#e3edf9;--bg:#f4f6f9;--card:#fff;--line:#dde2ec;--txt:#1e2533;--sub:#6b7a99;--up:#c0392b;--up-l:#fbe7e5;--down:#1e8449;--down-l:#e3f4e8;--warn:#a0520c;--warn-l:#fdf0e1;--flag:#7a3db8;--flag-l:#f1e8fb}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--txt);font:14px/1.5 "Yu Gothic UI","Meiryo",system-ui,sans-serif}
header{background:#fff;border-bottom:1px solid var(--line);padding:10px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;position:sticky;top:0;z-index:5}
header h1{font-size:18px;margin:0;color:var(--pri)}header .sp{flex:1}
select,input,button,textarea{font:inherit}select,input{border:1px solid var(--line);border-radius:6px;padding:5px 8px;background:#fff}
button{border:1px solid var(--line);background:#fff;border-radius:6px;padding:5px 12px;cursor:pointer}button.pri{background:var(--pri);border-color:var(--pri);color:#fff}button:disabled{opacity:.45;cursor:not-allowed}
.grp{display:flex;gap:4px;flex-wrap:wrap}.grp button.on{background:var(--pri);border-color:var(--pri);color:#fff}
main{padding:16px 20px;display:grid;gap:14px;grid-template-columns:minmax(0,1fr)}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px;min-width:0;overflow-x:auto}
.card h2{font-size:14px;margin:0 0 10px;color:var(--sub);font-weight:600}
.big{font-size:30px;font-weight:700}.big small{font-size:14px;font-weight:500;color:var(--sub)}
.depts{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.dept{background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;cursor:pointer}
.dept.sel{border-color:var(--pri);box-shadow:0 0 0 2px var(--pri-l)}.dept h3{margin:0;font-size:15px}
.dept .amt{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}.dept .s{font-size:12px;color:var(--sub)}
.st{display:inline-block;font-size:11.5px;padding:1px 8px;border-radius:9px;font-weight:600}
.st-prep{background:#eef0f4;color:#666}.st-ready{background:var(--pri-l);color:var(--pri)}.st-wait{background:var(--warn-l);color:var(--warn)}.st-back{background:var(--up-l);color:var(--up)}.st-ok{background:var(--down-l);color:var(--down)}.st-out{background:#e8e3f6;color:var(--flag)}
table{border-collapse:collapse;width:100%}th,td{padding:5px 8px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{font-size:12px;color:var(--sub);font-weight:600;background:#fafbfd;position:sticky;top:0}td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
.tag{display:inline-block;font-size:11px;padding:0 6px;border-radius:8px;font-weight:600;margin-left:4px}.t-new{background:var(--warn-l);color:var(--warn)}.t-up{background:var(--up-l);color:var(--up)}.t-pri{background:var(--pri-l);color:var(--pri)}
.checks{list-style:none;margin:0;padding:0}.checks li{padding:2px 0}.ok{color:var(--down);font-weight:700}.ng{color:var(--up);font-weight:700}.info{color:var(--warn);font-weight:700}
.out{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.prog{height:6px;background:var(--pri-l);border-radius:3px;overflow:hidden}.prog i{display:block;height:100%;background:var(--pri);width:0}
details>summary{cursor:pointer;color:var(--sub);font-size:12.5px;font-weight:600}
#log{white-space:pre-wrap;font-size:12.5px;background:#fafbfd;border:1px solid var(--line);border-radius:8px;padding:8px 10px;display:none}
#snackbar{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#323232;color:#fff;padding:10px 20px;border-radius:6px;font-size:13px;display:none;z-index:99;white-space:pre-wrap}
@media (max-width:600px){main{padding:10px}}
</style>
</head>
<body>
<div id="login-view" style="display:none;padding:60px;text-align:center"><h2 style="color:#1a5fa8">支払（決裁・出力）</h2><button class="pri" onclick="signIn()">サインイン</button></div>
<div id="app-view" style="display:none">
<div id="app-nav-slot"></div>
<header>
  <h1>支払（決裁・出力）</h1>
  <select id="month"></select>
  <div class="grp" id="rounds"></div>
  <span class="sp"></span>
  <span id="status" style="color:var(--sub);font-size:12px"></span>
  <span id="who" style="color:var(--sub);font-size:13px"></span>
</header>
<main id="main"></main>
</div>
<div id="snackbar"></div>
<script>
'use strict';
/* 支払（決裁・出力）：支払回 × 部門 ごとに 支払指図を作る → 「決裁に回す」→（ワークフローの「支払決済」で室長・社長）→ 出力
   ・決裁に回す：その部門の支払指図を固定（スナップショット＋照合の鍵）して AP_SettleBatch に残し、口座を除いた明細と請求書 PDF のコピーを
     自分の受付フォルダ（ワークフローの WF_Upload）に置き、wf_app の「支払決済」申請を中身入りで開く（申請は wf_app で確かめて出す）
   ・決裁の状態はワークフローの申請（WF_Request）を読みにいく（フローは足さない）
   ・出力の直前に照合：申請が「決裁済」／今の支払指図から作った鍵＝決裁バッチの鍵＝申請に付けた明細の鍵／振込先がマスタと変わっていない
     → 通ったものだけ「社長承認済」にして、全銀・でんさい・SMILE 支払伝票を出す
   決め事は 08_支払決裁.md（ワークフロー作成）③。画面に業務データを書かない */
const MSAL_CONFIG={auth:{clientId:'d338d61b-01dc-4c7c-ac6b-aecf7f30d716',authority:'https://login.microsoftonline.com/3933e8a0-c945-4e97-ae67-c82131087cad',redirectUri:new URL('auth.html',window.location.href).href},cache:{cacheLocation:'sessionStorage'}};
const SCOPES=['User.Read','Sites.ReadWrite.All','Files.ReadWrite.All'];
const GRAPH='https://graph.microsoft.com/v1.0';
const AP_SITE='hanaokacorp.sharepoint.com,d80378dd-76a4-43f0-b939-1af66345d19d,8eaeb70b-2495-4029-affb-eabe80e021bb';
const WF_SITE_PATH='hanaokacorp.sharepoint.com:/sites/msteams_7aab51:';   // ワークフローのサイト（wf_app と同じ）
const FINAL='社長承認済';
const ROUNDS=['10日','20日','月末'],DEPTS_END=['工場','国内営業','ソリューション','総務'];
const MOCK=window.AP_MOCK||null;   // dev だけ
const $=id=>document.getElementById(id);
let msalApp=null,acct=null,ME='';
const PI={fmap:{},id:null,items:[]},INV={fmap:{},id:null,items:[]},VB={fmap:{},id:null,byCode:{}},SP={fmap:{},id:null,items:[]},SB={fmap:{},id:null,items:[]},PM={fmap:{},id:null,items:[]},SL={fmap:{},id:null,byInv:{}};
let EXR={};   // 経費の決まり（AP_Setting の expense.rules）：会計仕訳の貸方・税コード
let WF={siteId:null,settings:{},reqs:[]};
const st={round:'月末',dept:null,verified:{}};

// ---------- 認証・Graph ----------
async function boot(){if(MOCK){acct=MOCK.account;await showApp();return;}
  msalApp=new msal.PublicClientApplication(MSAL_CONFIG);await msalApp.initialize();await msalApp.handleRedirectPromise();const a=msalApp.getAllAccounts();if(a.length){acct=a[0];msalApp.setActiveAccount(acct);await showApp();}else $('login-view').style.display='block';}
async function signIn(){try{const r=await msalApp.loginPopup({scopes:SCOPES});acct=r.account;msalApp.setActiveAccount(acct);await showApp();}catch(e){if(e.errorCode!=='user_cancelled')snack('サインインエラー: '+e.message,true);}}
async function token(){try{const r=await msalApp.acquireTokenSilent({scopes:SCOPES,account:acct});return r.accessToken;}catch{const r=await msalApp.acquireTokenPopup({scopes:SCOPES});acct=r.account;return r.accessToken;}}
async function call(method,p,body,ctype,raw){
  if(MOCK)return MOCK.call(method,p,body,raw);
  const t=await token();const h={Authorization:'Bearer '+t};if(body!=null&&!ctype)h['Content-Type']='application/json';if(ctype)h['Content-Type']=ctype;
  const r=await fetch(p.startsWith('http')?p:GRAPH+p,{method,headers:h,body:body==null?null:(ctype?body:JSON.stringify(body))});
  if(!r.ok){const e=new Error('['+r.status+'] '+(await r.text()).slice(0,300));e.status=r.status;throw e;}
  if(raw)return r.blob();const x=await r.text();return x?JSON.parse(x):{};}
const gget=p=>call('GET',p),gpost=(p,b)=>call('POST',p,b),gpatch=(p,b)=>call('PATCH',p,b);
async function fetchAll(siteId,listId,filter){let all=[],n=`/sites/${siteId}/lists/${listId}/items?$expand=fields&$top=500`+(filter?'&$filter='+encodeURIComponent(filter):'');
  while(n){const d=await gget(n);all=all.concat(d.value||[]);n=d['@odata.nextLink']?d['@odata.nextLink'].replace(GRAPH,''):null;}return all;}
const F=(o,d)=>o.fmap[d]||d;
const pv=(p,d)=>p.f[F(PI,d)];
function snack(m,e){const el=$('snackbar');el.textContent=m;el.style.background=e?'#c0392b':'#323232';el.style.display='block';clearTimeout(snack.t);snack.t=setTimeout(()=>el.style.display='none',e?8000:4000);}
function msg(t){$('status').textContent=t;}
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function yen(n){return (Math.round(Number(n)||0)).toLocaleString('ja-JP');}
const man=n=>Math.round((+n||0)/10000).toLocaleString('ja-JP')+'万';
function logOut(t){const el=$('log');if(!el)return;el.style.display='block';el.textContent=t;}

async function showApp(){
  $('login-view').style.display='none';$('app-view').style.display='block';$('who').textContent=acct.name||acct.username;ME=String(acct.username||'').toLowerCase();
  initMonth();
  try{msg('読み込み中...');await fetchCfg();await resolveLists();await loadShiharai();await reload();}catch(e){msg('エラー');snack(e.message,true);}}
function initMonth(){const s=$('month');const n=new Date();for(let i=-1;i<6;i++){const d=new Date(n.getFullYear(),n.getMonth()-i,1);const v=d.getFullYear()+'/'+String(d.getMonth()+1).padStart(2,'0');const o=document.createElement('option');o.value=v;o.textContent=v.replace('/','年')+'月払い';if(i===0)o.selected=true;s.appendChild(o);}
  const q=new URLSearchParams(location.search);const qm=q.get('month');if(qm){if(![...s.options].some(o=>o.value===qm)){const o=document.createElement('option');o.value=qm;o.textContent=qm.replace('/','年')+'月払い';s.insertBefore(o,s.firstChild);}s.value=qm;}
  if(ROUNDS.includes(q.get('round')))st.round=q.get('round');
  s.onchange=()=>{st.dept=null;st.verified={};reload();};}
function month(){return $('month').value;}
async function resolveLists(){
  const ls=await gget(`/sites/${AP_SITE}/lists?$select=id,displayName`);const find=n=>ls.value.find(x=>x.displayName===n);
  const need={AP_PaymentInstruction:PI,AP_Invoice:INV,AP_VendorBank:VB,AP_SmilePay:SP,AP_SettleBatch:SB,AP_PaymentSlip:SL};
  for(const [n,o] of Object.entries(need)){const l=find(n);if(!l)throw new Error(n+' がありません（Provision-SmileAP.ps1 -Apply で作ってください）');o.id=l.id;}
  const pm=find('AP_PurchaseMatch');if(pm)PM.id=pm.id;
  for(const o of [PI,INV,VB,SP,SB,SL].concat(PM.id?[PM]:[])){const c=await gget(`/sites/${AP_SITE}/lists/${o.id}/columns?$select=name,displayName`);o.fmap={};c.value.forEach(x=>o.fmap[x.displayName]=x.name);}
  // 決まり（手数料・サイトと期日）は AP_Setting の smile.rules（仕入の画面と同じ）
  const d=await gget(`/sites/${AP_SITE}/lists/AP_Setting/items?$expand=fields&$top=100`);const it=(d.value||[]).find(x=>x.fields&&x.fields.Title==='smile.rules');
  if(it)APSmile.setRules(JSON.parse(it.fields.Value||'{}'));
  const ex=(d.value||[]).find(x=>x.fields&&x.fields.Title==='expense.rules');EXR=ex?JSON.parse(ex.fields.Value||'{}'):{};
  // ワークフロー（申請の状態を読む・受付フォルダに置く）
  try{WF.siteId=(await gget(`/sites/${WF_SITE_PATH}`)).id;const wl=await gget(`/sites/${WF.siteId}/lists?$select=id,displayName`);WF.lists={};wl.value.forEach(x=>WF.lists[x.displayName]=x.id);
    const ss=await fetchAll(WF.siteId,WF.lists.WF_Setting);ss.forEach(x=>{WF.settings[x.fields.Title]=x.fields.Value;});}
  catch(e){snack('ワークフローのサイトを読めませんでした（決裁に回す・決裁の確認ができません）：'+e.message,true);}}
async function reload(){
  msg('読み込み中...');
  PI.items=(await fetchAll(AP_SITE,PI.id)).map(it=>({id:it.id,f:it.fields}));
  INV.items=(await fetchAll(AP_SITE,INV.id)).map(it=>({id:it.id,f:it.fields}));
  SP.items=(await fetchAll(AP_SITE,SP.id,`fields/${F(SP,'決済月')} eq '${month()}'`)).map(it=>({id:it.id,f:it.fields}));
  SB.items=(await fetchAll(AP_SITE,SB.id,`fields/${F(SB,'決済月')} eq '${month()}'`)).map(it=>({id:it.id,f:it.fields}));
  PM.items=PM.id?(await fetchAll(AP_SITE,PM.id)).map(it=>({id:it.id,f:it.fields})):[];
  SL.byInv={};(await fetchAll(AP_SITE,SL.id)).forEach(it=>{const k=String(it.fields[F(SL,'請求書ID')]||'');if(k)(SL.byInv[k]=SL.byInv[k]||[]).push(it.fields);});
  Object.values(SL.byInv).forEach(a=>a.sort((x,y)=>(+x[F(SL,'明細行番号')]||0)-(+y[F(SL,'明細行番号')]||0)));
  VB.byCode={};(await fetchAll(AP_SITE,VB.id)).forEach(it=>{const c=(it.fields[F(VB,'仕入先コード')]||'').trim();if(c)VB.byCode[c]=it.fields;});
  await syncBatches();msg('');render();}

// ---------- 仕入先マスタ（でんさい番号・SMILE の仕入先名） ----------
const SM_DRIVE='b!JT-BVyiLrECv-h59BtVoApKOQutjbKlGoUT2oig6LyO5ej8pUQ4QQIYH904CzeZ8',SM_FILE='仕入先マスタ.csv';
let SH={byCode:{}};
function parseCSV(text){return APSmile.parseCSV(text);}
const normCode=c=>String(c==null?'':c).trim().replace(/^0+/,'');
// でんさい利用者番号は9桁の英数字（例 00000PJE1）。数字だけのものは CSV で先頭の0が落ちるので補う。「対応不可」などのメモは番号なし
const padDen=s=>{s=String(s||'').trim();if(/^\d{1,9}$/.test(s))return /^0+$/.test(s)?'':s.padStart(9,'0');if(/^[0-9A-Za-z]{9}$/.test(s))return s.toUpperCase();return '';};
async function loadShiharai(){
  try{const b=await call('GET',`/drives/${SM_DRIVE}/root:/${encodeURIComponent(SM_FILE)}:/content`,null,null,true);
    const rows=parseCSV(new TextDecoder('utf-8').decode(await b.arrayBuffer()));
    const h=rows[0].map(x=>String(x==null?'':x).trim());const ix=n=>h.indexOf(n);
    const ci={code:ix('仕入先ｺｰﾄﾞ'),site:ix('手形サイト(日)'),den:ix('でんさい利用者番号'),bank:ix('振込口座　金融機関ｺｰﾄﾞ'),branch:ix('振込口座　金融機関支店ｺｰﾄﾞ'),atype:ix('振込口座　口座区分'),ano:ix('振込口座　口座番号'),name1:ix('仕入先名１')};
    const v=(r2,i)=>(i>=0&&i<r2.length?(r2[i]||''):'');SH.byCode={};
    for(let i=1;i<rows.length;i++){const r2=rows[i];if(!r2||!v(r2,ci.code))continue;
      SH.byCode[normCode(v(r2,ci.code))]={site:v(r2,ci.site),den:padDen(v(r2,ci.den)),bank:v(r2,ci.bank),branch:v(r2,ci.branch),atype:v(r2,ci.atype),ano:v(r2,ci.ano),name1:v(r2,ci.name1),rawcode:v(r2,ci.code)};}
  }catch(e){/* 取れなければ でんさい・SMILE 支払伝票のときに知らせる */}}
function eomonth(d,n){return new Date(d.getFullYear(),d.getMonth()+n+1,0);}
function densaiDue(base,site){const r=APSmile.dueDate(`${base.getFullYear()}-${String(base.getMonth()+1).padStart(2,'0')}`,Number(site));return r?new Date(r+'T00:00:00'):null;}
function ymd8(d){return d.getFullYear()+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0');}
function monthEnd(ym){const [y,m]=ym.split('/').map(Number);return new Date(y,m,0);}
// 実支払日：支払回→日付（土日は前営業日へ。祝日は未対応＝要目視）
function payDate(ym,due){const [y,mo]=ym.split('/').map(Number);let day=due==='10日'?10:due==='20日'?20:new Date(y,mo,0).getDate();let d=new Date(y,mo-1,day);while(d.getDay()===0||d.getDay()===6)d.setDate(d.getDate()-1);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
const iv=(f,d)=>f[F(INV,d)];
function vbSnap(code){const b=VB.byCode[code];if(!b)return {};return {BankCode:b[F(VB,'銀行コード')]||'',BranchCode:b[F(VB,'支店コード')]||'',AcctType:b[F(VB,'口座区分')]||'',AcctNo:b[F(VB,'口座番号')]||'',AcctHolder:b[F(VB,'口座名義カナ')]||''};}

// ---------- 支払回 × 部門 ----------
const deptOf=p=>pv(p,'決裁の部門')||(pv(p,'拠点')==='工場'?'工場':'総務');
const piOf=(round,dept)=>PI.items.filter(p=>pv(p,'決済月')===month()&&pv(p,'支払日区分')===round&&(!dept||deptOf(p)===dept));
const sbv=(b,d)=>b.f[F(SB,d)];
// この部門の最新の決裁バッチ（取り下げは除く）
function batchOf(round,dept){return SB.items.filter(b=>sbv(b,'支払日区分')===round&&sbv(b,'部門')===dept&&sbv(b,'状態')!=='取り下げ')
  .sort((a,b)=>String(sbv(b,'回した日時')).localeCompare(String(sbv(a,'回した日時'))))[0]||null;}
const LOCKED=['決裁中','決裁済み','出力済み'];
function deptsOf(round){const s=new Set(round==='月末'?DEPTS_END:['総務']);piOf(round).forEach(p=>s.add(deptOf(p)));return [...s];}
// 確認がまだの元（仕入＝仕入（SMILE）で未確認、経費＝確定前の請求書）
function pendingOf(round,dept){
  const sp=SP.items.filter(x=>{const f=x.f,g=d=>f[F(SP,d)];if((g('支払日区分')||'月末')!==round||g('取り込みの状態')==='なくなった')return false;
    const lines=(()=>{try{return JSON.parse(g('分け方の上書き')||g('分け方（計算）')||'[]')||[];}catch{return [];}})();
    if(!lines.some(l=>+l.amount)&&!(+g('支払額')>0))return false;return (g('決裁の部門')||'総務')===dept&&g('確認済み')!==true;}).length;
  const ex=INV.items.filter(x=>{const f=x.f,c=iv(f,'支払区分')||'';if(c!=='本社経費'&&c!=='工場経費')return false;
    if(iv(f,'アーカイブフラグ')===true||(iv(f,'対象年月')||'')!==month()||(iv(f,'支払日区分')||'')!==round)return false;
    const d=c==='工場経費'?'工場':'総務';const s=iv(f,'支払ステータス')||'';return d===dept&&s!=='確定済（ロック）'&&s!=='先行支払済';}).length;
  return {sp,ex};}
function stateOf(round,dept){
  const b=batchOf(round,dept),rows=piOf(round,dept),pd=pendingOf(round,dept);
  if(b){const s=sbv(b,'状態');return {b,s,cls:s==='決裁済み'?'st-ok':s==='出力済み'?'st-out':s==='差し戻し'?'st-back':s==='申請前'?'st-wait':'st-wait',label:s};}
  if(!rows.length&&!pd.sp&&!pd.ex)return {s:'支払なし',cls:'st-prep',label:'支払なし'};
  if(pd.sp||pd.ex)return {s:'準備中',cls:'st-prep',label:'準備中'};

async function generate(){

    if(iv(f,'仕分け済')!==true||iv(f,'アーカイブフラグ')===true||(iv(f,'対象年月')||'')!==ym||(iv(f,'支払日区分')||'')!==due)return;
    const pst=iv(f,'支払ステータス')||'';if(pst!=='確定済（ロック）'&&pst!=='先行支払済')return;
    const code=iv(f,'支払先コード')||'',name=iv(f,'支払先名')||'',method=iv(f,'支払手段')||'総合振込',loc=cat==='工場経費'?'工場':'本社';
    add({code,name,method,amount:+iv(f,'金額_税込')||0,loc,dept:loc==='工場'?'工場':'総務',ids:[String(x.id)],prepaid:pst==='先行支払済',ppdate:iv(f,'先行支払日')||'',due:'',source:'経費',key:(code||name)+'|'+method+'|'});});
  // 仕入：「仕入（SMILE）」で確認OKの仕入先。分け方（振込・でんさい・相殺・調整・現金・海外送金・口座振替）ごとに1行
  const MM={振込:'総合振込',でんさい:'でんさい',手形:'でんさい',相殺:'相殺',調整:'調整',現金:'現金',海外送金:'海外送金',口座振替:'口座振替'};
  const pj=s=>{try{return JSON.parse(s||'null');}catch{return null;}};let unchecked=0;
  SP.items.forEach(x=>{const f=x.f,g=d=>f[F(SP,d)];if((g('支払日区分')||'月末')!==due||g('取り込みの状態')==='なくなった')return;
    const code=g('仕入先コード'),name=g('仕入先名'),dept=g('決裁の部門')||'総務',ov=pj(g('分け方の上書き'));
    let lines=ov&&ov.length?ov.map(l=>({method:l.method,amount:+l.amount||0,due:(l.method==='でんさい'||l.method==='手形')?APSmile.dueDate(ym.replace('/','-'),l.site):''}))
      :(pj(g('分け方（計算）'))||[]).map(l=>({method:l.method,amount:+l.amount||0,due:l.due||''}));
    if(!lines.some(l=>l.amount))return;if(g('確認済み')!==true){unchecked++;return;}
    const tr=lines.filter(l=>l.method==='振込').reduce((s,l)=>s+l.amount,0),fo=g('手数料の上書き');
    let fee=(fo!==''&&fo!=null)?+fo||0:(ov&&ov.length?APSmile.transferFeeOf(tr,g('手数料区分')):+g('振込手数料（計算）')||0);
    lines.forEach(l=>{if(!l.amount)return;const lf=l.method==='振込'?fee:0;fee-=lf;
      add({code,name,method:MM[l.method]||l.method,amount:l.amount-lf,fee:lf,loc:dept==='工場'?'工場':'本社',dept,ids:[],due:l.due,smileId:String(x.id),source:'仕入（SMILE取込）',key:code+'|'+(MM[l.method]||l.method)+'|'+(l.due||'')});});});
  if(unchecked)log.push(`⚠ 仕入（SMILE）で未確認の ${unchecked} 社は作っていません`);
  if(lockedDept.size)log.push(`決裁中・決裁済みの部門は変えていません：${[...lockedDept].join('・')}`);
  // 今ある支払指図と突き合わせる：同じキーは額などを直す、無いものは足す、元が無くなった自動の行は消す（決裁中・決裁済みの部門は触らない）
  const cur=piOf(due).filter(p=>!lockedDept.has(deptOf(p)));
  const keyOfPI=p=>(pv(p,'支払先コード')||pv(p,'支払先名')||'')+'|'+(pv(p,'支払手段')||'')+'|'+(pv(p,'期日')||'')+'|'+(pv(p,'支払状態')==='先行支払済'?'P':'N');
  const byKey={};cur.forEach(p=>byKey[keyOfPI(p)]=p);let made=0,upd=0,del=0;
  for(const [k,dft] of Object.entries(drafts)){const ex=byKey[k];delete byKey[k];
    const fields={};const set=(d,v)=>{if(PI.fmap[d]||['決済月','支払日区分','実支払日','支払先名','支払先コード','支払手段','支払額','拠点','元請求書ID','承認状態','支払状態','メモ'].includes(d))fields[F(PI,d)]=v;};
    set('支払額',dft.amount);set('振込手数料',dft.fee||0);set('決裁の部門',dft.dept);set('期日',dft.due||'');set('元',dft.source);set('AP_SmilePayの行ID',dft.smileId||'');set('元請求書ID',dft.ids.join(','));
    const snap=vbSnap(dft.code);set('銀行コード',snap.BankCode||'');set('支店コード',snap.BranchCode||'');set('預金種目',snap.AcctType||'');set('口座番号',snap.AcctNo||'');set('受取人カナ',snap.AcctHolder||'');
    if(ex){const same=Object.entries(fields).every(([c,v])=>String(ex.f[c]??'')===String(v??''));if(same)continue;
      fields[F(PI,'承認状態')]='起票';fields[F(PI,'決裁バッチ')]='';
      try{await gpatch(`/sites/${AP_SITE}/lists/${PI.id}/items/${ex.id}/fields`,fields);upd++;log.push(`✏ ${dft.name}／${dft.method}／${yen(dft.amount)}`);}catch(e){log.push(`❌ ${dft.name}：${e.message}`);}continue;}
    fields.Title=`${ym} ${due} ${dft.name}`;set('決済月',ym);set('支払日区分',due);set('実支払日',dft.prepaid&&dft.ppdate?dft.ppdate:payDate(ym,due));set('支払先名',dft.name);set('支払先コード',dft.code);set('支払手段',dft.method);set('拠点',dft.loc);
    set('承認状態','起票');set('支払状態',dft.prepaid?'先行支払済':'未');
    const memo=[];if(dft.prepaid)memo.push('経費側で先行支払済（急ぎ振込）');if(dft.method==='総合振込'&&!snap.BankCode&&!dft.prepaid)memo.push('⚠振込先口座未登録（AP_VendorBank）');if(dft.fee)memo.push(`振込手数料 ${dft.fee} 円を差し引き（先方負担）`);
    if(memo.length)set('メモ',memo.join(' '));
    try{await gpost(`/sites/${AP_SITE}/lists/${PI.id}/items`,{fields});made++;log.push(`✅ ${dft.name}／${dft.method}／${yen(dft.amount)}`);}catch(e){log.push(`❌ ${dft.name}：${e.message}`);}}
  for(const p of Object.values(byKey)){const src=pv(p,'元')||'';if(src!=='仕入（SMILE取込）'&&src!=='経費')continue;if(['EB出力済','支払済'].includes(pv(p,'支払状態')))continue;
    try{await call('DELETE',`/sites/${AP_SITE}/lists/${PI.id}/items/${p.id}`);del++;log.push(`🗑 ${pv(p,'支払先名')}／${pv(p,'支払手段')}（元が無くなった）`);}catch(e){log.push(`❌ ${pv(p,'支払先名')} を消せません：${e.message}`);}}
  await reload();logOut(`【${ym} ${due} 支払指図】作成 ${made}・更新 ${upd}・削除 ${del}\n`+log.join('\n'));snack(`支払指図：作成 ${made}・更新 ${upd}・削除 ${del}`);}

// ---------- 照合の鍵 ----------
// 決裁した内容を表すもの：支払先・方法・金額・手数料・期日・振込先口座・先行支払。並べ替えて SHA-256
function keyRows(pis){return pis.map(p=>[pv(p,'支払先コード')||pv(p,'支払先名')||'',pv(p,'支払手段')||'',Math.round(+pv(p,'支払額')||0),Math.round(+pv(p,'振込手数料')||0),pv(p,'期日')||'',
  pv(p,'銀行コード')||'',pv(p,'支店コード')||'',pv(p,'預金種目')||'',pv(p,'口座番号')||'',pv(p,'受取人カナ')||'',pv(p,'支払状態')==='先行支払済'?'P':''].join('|')).sort();}
async function sha256(s){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');}
const hashOf=pis=>sha256(keyRows(pis).join('\n'));
const payeeKey=p=>(pv(p,'支払先コード')||pv(p,'支払先名')||'');
function prevRows(round,dept,n){const [y,m]=month().split('/').map(Number);const d=new Date(y,m-1-n,1);const ym=d.getFullYear()+'/'+String(d.getMonth()+1).padStart(2,'0');
  const o={};PI.items.filter(p=>pv(p,'決済月')===ym&&pv(p,'支払日区分')===round&&deptOf(p)===dept).forEach(p=>{const k=payeeKey(p);o[k]=(o[k]||0)+(+pv(p,'支払額')||0);});return o;}

function fileKey(name){const safe=name.replace(/["*:<>?/\\|#%~&{}\u0000-\u001f]/g,'_').replace(/\.{2,}/g,'.').replace(/^[\s.]+|[\s.]+$/g,'').slice(-100)||'file';
  const d=new Date(),p=n=>String(n).padStart(2,'0');return `${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}_${Math.random().toString(36).slice(2,6)}_${safe}`;}
// 受付フォルダ（WF_Upload/自分/）に置く。無ければフローに作ってもらう（wf_app と同じ「フォルダ準備」）

function typeCode(t){t=String(t==null?'':t);if(/普通/.test(t))return '1';if(/当座/.test(t))return '2';if(/貯蓄/.test(t))return '4';if(/^[0-9]$/.test(t))return t;return '9';}
function buildZengin(list,ym,due,cfg){
  const mmdd=payDate(ym,due).slice(5).replace('-','');  // 取組日=支払日 MMDD
  const header='1'+'21'+'0'+padL0(cfg.itaku,10)+padR(cfg.itakuName,40)+mmdd+padL0(cfg.bankNo,4)+padR(cfg.bankName,15)+padL0(cfg.branchNo,3)+padR(cfg.branchName,15)+typeCode(cfg.acctType)+padL0(cfg.acctNo,7)+padR('',17);
  const data=list.map(p=>{const amt=+pv(p,'支払額')||0;
    return '2'+padL0(pv(p,'銀行コード'),4)+padR('',15)+padL0(pv(p,'支店コード'),3)+padR('',15)+'0000'+typeCode(pv(p,'預金種目'))+padL0(pv(p,'口座番号'),7)+padR(pv(p,'受取人カナ'),30)+padL0(amt,10)+'0'+padR('',10)+padR('',10)+'7'+' '+padR('',7);});
  const total=list.reduce((s,p)=>s+(+pv(p,'支払額')||0),0);
  const trailer='8'+padL0(list.length,6)+padL0(total,12)+padR('',101),end='9'+padR('',119);
  const recs=[header,...data,trailer,end];const bad=recs.find(r=>r.length!==120);if(bad!==undefined)throw new Error('レコード長が120でない（不具合）：'+bad.length);
  const bytes=[];recs.forEach((r,i)=>{if(i>0)bytes.push(0x0D,0x0A);toBytes(r).forEach(b=>bytes.push(b));});bytes.push(0x0D,0x0A);
  return {bytes:new Uint8Array(bytes),count:list.length,total};}
function downloadBytes(bytes,fname){const blob=new Blob([bytes],{type:'text/plain'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=fname;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);}
function ts(){const d=new Date();const p=n=>String(n).padStart(2,'0');return d.getFullYear()+p(d.getMonth()+1)+p(d.getDate())+p(d.getHours())+p(d.getMinutes())+p(d.getSeconds());}
async function outputZengin(){
  const ym=month(),due=st.round,cfg=loadCfg();if(!cfgReady(cfg))return;const list=outList('総合振込');if(!list)return;
  if(!list.length){snack('総合振込の支払がありません');return;}
  const valid=list.filter(p=>pv(p,'銀行コード')),missing=list.length-valid.length;
  if(missing&&!confirm(missing+'件が振込先口座未登録です。除外して出力しますか？'))return;if(!valid.length){snack('出力対象なし（全件が口座未登録）');return;}
  const {bytes,count,total}=buildZengin(valid,ym,due,cfg);downloadBytes(bytes,`FB_${ym.replace('/','')}_${due}_${ts()}.txt`);
  if(confirm(`全銀ファイルを出力しました（${count}件・${yen(total)} 円）。\nこれらを「EB出力済」に更新しますか？（実際に銀行へ取り込んだ後に押してください）`)){
    for(const p of valid){try{await gpatch(`/sites/${AP_SITE}/lists/${PI.id}/items/${p.id}/fields`,{[F(PI,'支払状態')]:'EB出力済',[F(PI,'EB出力日時')]:new Date().toISOString()});}catch(e){}}await markOutput();await reload();}
  snack(`全銀出力：${count}件 ${yen(total)} 円`);}
async function outputDensai(){
  const ym=month(),cfg=loadCfg();if(!cfgReady(cfg))return;const list=outList('でんさい');if(!list)return;
  if(!list.length){snack('でんさいの支払がありません');return;}
  if(!Object.keys(SH.byCode).length){snack('仕入先マスタ（SharedMasters）を読めません',true);return;}
  const base=monthEnd(ym),hatsu=ymd8(base),rows=[],warns=[],okRows=[];let total=0;
  for(const p of list){const code=normCode(pv(p,'支払先コード'));const m=SH.byCode[code];
    if(!m){warns.push(`${pv(p,'支払先名')}：マスタ未登録`);continue;}if(!m.den){warns.push(`${pv(p,'支払先名')}：でんさい利用者番号なし`);continue;}
    const dd=pv(p,'期日');const due2=dd?new Date(dd+'T00:00:00'):densaiDue(base,m.site);if(!due2){warns.push(`${pv(p,'支払先名')}：サイト「${m.site}」の期日の決まりがない`);continue;}
    const amt=+pv(p,'支払額')||0;total+=amt;okRows.push(p);
    const y=due2.getFullYear(),mo=String(due2.getMonth()+1).padStart(2,'0'),da=String(due2.getDate()).padStart(2,'0');
    rows.push(['2','11',m.den,String(Number(m.bank)||m.bank),String(Number(m.branch)||m.branch),String(Number(m.atype)||m.atype),String(Number(m.ano)||m.ano),String(amt),ymd8(due2),hatsu,'','',`${y}.${mo}.${da}(${m.site})C${code}`]);}
  if(!rows.length){snack('出力対象なし（'+warns.join(' / ')+'）',true);return;}
  const header=['1',String(Number(cfg.bankNo)||cfg.bankNo),cfg.branchNo,typeCode(cfg.acctType),String(Number(cfg.acctNo)||cfg.acctNo),'','','','','','','',''];
  const all=[header,...rows,['8',String(rows.length),String(total),'','','','','','','','','',''],['9','','','','','','','','','','','','']];
  downloadBytes(new Uint8Array(toBytes(all.map(r=>r.join(',')).join('\r\n')+'\r\n')),`densai_${ym.replace('/','')}_${st.round}_${ts()}.csv`);
  logOut(`でんさい：${rows.length}件 ${yen(total)} 円`+(warns.length?`\n⚠ 除外 ${warns.length}件：\n`+warns.join('\n'):''));
  if(confirm(`でんさい CSV を出力しました（${rows.length}件・${yen(total)} 円）。${warns.length?'\n⚠ '+warns.length+'件除外。':''}\nこれらを「EB出力済」に更新しますか？（銀行に取り込んだ後に）`)){
    for(const p of okRows){try{await gpatch(`/sites/${AP_SITE}/lists/${PI.id}/items/${p.id}/fields`,{[F(PI,'支払状態')]:'EB出力済',[F(PI,'EB出力日時')]:new Date().toISOString()});}catch(e){}}await markOutput();await reload();}}
// ===== SMILE販売 支払伝票（取込専用レイアウト・タブ区切り・75列）。取引区分: 1現金 2振込 3相殺 4でんさい 5値引 6調整 =====
const SMILE_HEAD=(()=>{const core=['伝票日付','伝票No','処理連番','行','仕入先コード','仕入先名1','仕入先名2','部門コード','営業所コード','取引区分','取引区分属性','支払額','決済予定日','備考コード','備考','データ発生区分','相手処理連番'];
  const ext=[];for(let i=1;i<=20;i++)ext.push('伝票拡張項目'+i);ext.push('伝票付箋色');for(let i=1;i<=20;i++)ext.push('明細拡張項目'+i);ext.push('明細付箋色');
  const tail=['振込区分','チェックマーク区分','PORTNeT伝票区分','PORTNeT連番1','PORTNeT連番2','PORTNeT行番号1','PORTNeT行番号2','通貨コード','レート種類','レート','支払額(外貨)','決算時評価替区分','仕入円貨金額','仕入レート','仕入レート種類','でんさいデータ作成済区分'];
  return core.concat(ext,tail);})();
function kubunOf(method){if(method==='でんさい'||method==='手形')return '4';if(method==='相殺')return '3';if(method==='調整')return '6';if(method==='現金')return '1';return '2';}
function smileRow(o){const r=new Array(SMILE_HEAD.length).fill('');const set=(n,v)=>{const i=SMILE_HEAD.indexOf(n);if(i>=0)r[i]=(v==null?'':String(v));};
  set('伝票日付',o.denpyoDate);set('処理連番',o.renban);set('行',o.line);set('仕入先コード',o.code);set('仕入先名1',o.name1);set('部門コード',o.deptc);
  set('取引区分',o.k);set('取引区分属性',o.k);set('支払額',o.amount);set('決済予定日',o.dueday||'0');set('備考',o.memo||'');set('データ発生区分','0');set('相手処理連番','0');return r.join('\t');}
async function outputSmileDenpyo(){
  const ym=month();if(!Object.keys(SH.byCode).length){snack('仕入先マスタ（SharedMasters）を読めません',true);return;}
  const all=outList(null);if(!all)return;
  // 仕入（SMILE の仕入先コードがあるもの）。先行支払済も SMILE には記録する
  const list=piOf(st.round).filter(p=>pv(p,'承認状態')===FINAL&&SH.byCode[normCode(pv(p,'支払先コード'))]);
  if(!list.length){snack('仕入の支払指図がありません');return;}
  const ym6=ym.replace('/',''),base=monthEnd(ym),renbanBase=Number(ym6)*10000+(ROUNDS.indexOf(st.round)+1)*1000;
  const rows=[],warns=[];let sum=0,idx=0;
  for(const p of list){const code=normCode(pv(p,'支払先コード'));const m=SH.byCode[code]||{};const method=pv(p,'支払手段')||'総合振込';
    idx++;const renban=renbanBase+idx;const denpyoDate=(pv(p,'実支払日')||'').replace(/-/g,'')||ym6+'30';
    const deptc=(deptOf(p)==='工場')?'003110':'001110';
    const fromSmile=pv(p,'元')==='仕入（SMILE取込）';
    const pm=!fromSmile&&PM.id?PM.items.find(x=>x.f[F(PM,'対象年月')]===ym&&normCode(x.f[F(PM,'仕入先コード')])===code):null;
    const adj=pm?Math.round(+pm.f[F(PM,'調整額')]||0):0,feeD=Math.round(+pv(p,'振込手数料')||0),mainAmt=Math.round(+pv(p,'支払額')||0)-adj;
    let dueday='0';if(method==='でんさい'||method==='手形'){const dd=pv(p,'期日');const d=dd?new Date(dd+'T00:00:00'):densaiDue(base,m.site);if(d)dueday=ymd8(d);else warns.push(`${pv(p,'支払先名')}：でんさいの期日が決まらない`);}
    const name1=m.name1||pv(p,'支払先名'),rcode=m.rawcode||code;let line=0;
    rows.push(smileRow({denpyoDate,renban,line:++line,code:rcode,name1,deptc,k:kubunOf(method),amount:mainAmt,dueday,memo:method==='調整'?'消費税端数調整':''}));sum+=mainAmt;
    if(adj)rows.push(smileRow({denpyoDate,renban,line:++line,code:rcode,name1,deptc,k:'6',amount:adj,dueday:'0',memo:'消費税端数調整'})),sum+=adj;
    // 先方負担の振込手数料は「値引」（取引区分5）で記録する（今の SMILE の付け方と同じ：振込は差し引いた後の額）
    if(feeD)rows.push(smileRow({denpyoDate,renban,line:++line,code:rcode,name1,deptc,k:'5',amount:feeD,dueday:'0',memo:'振込手数料（先方負担）'})),sum+=feeD;}
  const out=[SMILE_HEAD.join('\t'),...rows].join('\r\n')+'\r\n';const body=new TextEncoder().encode(out);const bytes=new Uint8Array(3+body.length);bytes.set([0xEF,0xBB,0xBF]);bytes.set(body,3);
  downloadBytes(bytes,`smile_shiharai_${ym6}_${st.round}_${ts()}.txt`);
  logOut(`SMILE 支払伝票（取込専用・タブ区切り）：${rows.length}行 / 合計 ${yen(sum)} 円`+(warns.length?`\n⚠ ${warns.join(' / ')}`:'')+'\n※SMILE の取込は「テキストファイル取込専用レイアウト」・「1件目のデータはタイトル」にチェック・文字コード UTF-8。取り込んだら、翌月の仕入（SMILE）の照合で一致を確かめます。');}
// ---------- 会計仕訳（経費）：SMILE 会計の仕訳明細取込（設計書 v2.5 6-7。仕入は SMILE 支払伝票から連動するので作らない） ----------
// 1 伝票＝1 請求書、行＝経費の画面で確かめた仕訳（借方）。貸方は支払方法の口座、税コード・貸方は AP_Setting の expense.rules
const JNL_HEAD=['伝票区切','処理連番','伝票日付','伝票No','決算区分','行番号','借方科目コード','借方内訳コード','借方税コード','借方部門コード','借方金額','借方消費税','借方税区分','借方摘要コード','借方摘要','借方C/F除外区分',
  '貸方科目コード','貸方内訳コード','貸方税コード','貸方部門コード','貸方金額','貸方消費税','貸方税区分','貸方摘要コード','貸方摘要','貸方C/F除外区分','仕訳入力区分'];
async function outputJournal(){
  const ym=month(),J=EXR.journal||{};if(!J.credit){snack('AP_Setting に expense.rules（仕訳の貸方）がありません',true);return;}
  if(!outList(null))return;
  const list=piOf(st.round).filter(p=>pv(p,'承認状態')===FINAL&&pv(p,'元')==='経費');if(!list.length){snack('経費の支払指図がありません');return;}
  const q=v=>{v=v==null?'':String(v);return /[,"\r\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;};
  const cut=s=>{s=String(s||'');let n=0,o='';for(const c of s){n+=/[ -~｡-ﾟ]/.test(c)?1:2;if(n>80)break;o+=c;}return o;};   // 摘要は80バイト（全角40字）まで
  const rows=[],warns=[];let seq=0,sum=0;
  for(const p of list){const ids=String(pv(p,'元請求書ID')||'').split(',').filter(Boolean),date=(pv(p,'実支払日')||'').replace(/-/g,''),method=pv(p,'支払手段')||'総合振込',cr=J.credit[method]||J.credit['総合振込']||{};
    for(const id of ids){const x=INV.items.find(i=>String(i.id)===id);const lines=SL.byInv[id]||[];const payee=x?iv(x.f,'支払先名')||'':pv(p,'支払先名');
      if(!lines.length){warns.push(`${payee}：仕訳がありません（経費の画面で入れてください）`);continue;}
      const tot=lines.reduce((s,l)=>s+(+l[F(SL,'金額_税込')]||0),0);if(x&&Math.round(tot)!==Math.round(+iv(x.f,'金額_税込')||0))warns.push(`${payee}：仕訳の合計 ${yen(tot)} が請求額 ${yen(iv(x.f,'金額_税込'))} と違います`);
      seq++;lines.forEach((l,k)=>{const g=d=>l[F(SL,d)];const excl=Math.round(+g('金額_税抜')||0),tax=Math.round(+g('消費税')||0),incl=excl+tax,tm=g('税区分')==='税抜'?'0':'1';
        if(!g('勘定科目コード'))warns.push(`${payee}：科目コードがない行があります`);
        const memo=cut(`${payee} ${g('摘要')||''}`.trim()),crAmt=J.creditAmount==='incl'?incl:excl;
        rows.push([k===0?1:0,seq,date,'',1,k+1,g('勘定科目コード')||'','000000',(J.taxCodes||{})[g('税率区分')]||'000',g('部門コード')||'',excl,tm==='1'?tax:'',tm,'000000',memo,0,
          cr.code||'',cr.sub||'','','',crAmt,'',0,'000000',memo,0,J.inputKind||30].map(q).join(','));sum+=incl;});}}
  if(!rows.length){snack('出力する仕訳がありません'+(warns.length?'：'+warns[0]:''),true);return;}
  const body=new TextEncoder().encode([JNL_HEAD.join(','),...rows].join('\r\n')+'\r\n');const bytes=new Uint8Array(3+body.length);bytes.set([0xEF,0xBB,0xBF]);bytes.set(body,3);
  downloadBytes(bytes,`smile_shiwake_${ym.replace('/','')}_${st.round}_${ts()}.csv`);
  logOut(`会計仕訳（経費・SMILE 会計の仕訳明細取込）：${seq}伝票 ${rows.length}行 / 税込 ${yen(sum)} 円`+(warns.length?`\n⚠ ${warns.join('\n⚠ ')}`:'')+'\n※SMILE V 会計 → 随時業務 → 仕訳明細取込（UTF-8・タイトル行あり）。初めての取り込みは1伝票で試し、金額（税抜・税込の扱い）と税コードを確かめてください。');}
boot().catch(e=>{console.error(e);snack('起動エラー: '+e.message,true);});

<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>支払一覧・承認 | 花岡車輌</title>
<script src="https://cdn.jsdelivr.net/npm/@azure/msal-browser@3.10.0/lib/msal-browser.min.js" crossorigin="anonymous"></script>
<script src="nav.js" defer></script>
<style>
:root{--primary:#1a5fa8;--border:#d7dde6;--muted:#6b7683;--card-bg:#fff;--bg:#f4f6f9;--danger:#c0392b;--ok:#2e7d32;--warn:#e67e22}
*{box-sizing:border-box}body{margin:0;font-family:"Segoe UI","Meiryo",sans-serif;background:var(--bg);color:#222;font-size:14px}
header{background:var(--primary);color:#fff;padding:10px 18px;display:flex;align-items:center;gap:14px}
header h1{font-size:16px;margin:0;font-weight:600}header .sp{margin-left:auto;display:flex;gap:12px;align-items:center;font-size:13px}
header a{color:#fff}
button{cursor:pointer;font-family:inherit}
.btn{background:var(--primary);color:#fff;border:none;padding:6px 14px;border-radius:5px;font-size:13px}
.btn.g{background:#fff;color:var(--primary);border:1px solid var(--primary)}
.btn.ok{background:var(--ok);color:#fff;border:none}
.btn.d{background:#fff;color:var(--danger);border:1px solid var(--danger)}
.wrap{padding:16px 20px}
.toolbar{display:flex;gap:12px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
select,input{font-family:inherit;font-size:13px;border:1px solid var(--border);border-radius:4px;padding:4px 7px}
.chip{border:1px solid var(--border);background:#fff;border-radius:16px;padding:5px 12px;font-size:12px;cursor:pointer}
.chip.on{background:var(--primary);color:#fff;border-color:var(--primary)}
table{width:100%;border-collapse:collapse;background:#fff;border-radius:8px;overflow:hidden}
th,td{padding:7px 9px;border-bottom:1px solid #eef1f5;text-align:left;font-size:13px}
th{background:#f0f4f9;color:#445;font-weight:600;font-size:12px}
td.num,th.num{text-align:right}
.grp{background:#eaf1f9;font-weight:700;padding:7px 10px;font-size:13px;border-top:2px solid #cddcec}
.st{display:inline-block;padding:1px 8px;border-radius:10px;font-size:11px;font-weight:600}
.s-draft{background:#eee;color:#666}.s-mid{background:#fff3cd;color:#8a6d00}.s-ok{background:#e6f4ea;color:#2e7d32}.s-rej{background:#fdecea;color:#c0392b}.s-paid{background:#e8f0fb;color:#1a5fa8}
.snack{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#323232;color:#fff;padding:10px 20px;border-radius:6px;display:none;z-index:100}
.empty{padding:30px;text-align:center;color:var(--muted)}
.sumbar{display:flex;gap:18px;flex-wrap:wrap;background:#fff;border:1px solid var(--border);border-radius:8px;padding:10px 14px;margin-bottom:12px}
.sumbar b{font-size:15px}
</style>
</head>
<body>
<div id="login-view" style="display:none;padding:60px;text-align:center"><h1>支払一覧・承認</h1><button class="btn" onclick="signIn()">サインイン</button></div>
<div id="app-view" style="display:none">
  <header><h1>支払一覧・承認</h1><span class="sp"><span id="user-name"></span><a href="#" onclick="signOut();return false">サインアウト</a></span></header>
  <div id="app-nav-slot"></div>
  <div class="wrap">
    <div class="toolbar">
      <label>決済月</label><select id="month-select" onchange="reload()"></select>
      <span style="margin-left:8px">締め回:</span>
      <span id="due-chips"></span>
      <button class="btn" onclick="generate()" style="margin-left:auto">▶ 支払指図を生成</button>
      <button class="btn ok" onclick="outputZengin()">📤 全銀ファイル出力</button>
      <button class="btn g" onclick="outputDensai()">📤 でんさいCSV</button>
      <button class="btn g" onclick="outputSmileDenpyo()">📤 SMILE支払伝票</button>
      <button class="btn g" onclick="reload()">🔄 再読込</button>
    </div>
    <details style="margin-bottom:12px"><summary style="cursor:pointer;font-size:12px;color:var(--primary)">⚙ 振込元（全銀ヘッダー）設定</summary>
      <div style="display:flex;gap:10px;flex-wrap:wrap;background:#fff;border:1px solid var(--border);border-radius:8px;padding:10px;margin-top:6px">
        <label style="font-size:12px">委託者コード<br><input id="z-itaku" style="width:120px"></label>
        <label style="font-size:12px">委託者名(半角ｶﾅ)<br><input id="z-itakuName" style="width:200px"></label>
        <label style="font-size:12px">仕向銀行番号<br><input id="z-bankNo" style="width:70px"></label>
        <label style="font-size:12px">仕向銀行名(ｶﾅ)<br><input id="z-bankName" style="width:120px"></label>
        <label style="font-size:12px">仕向支店番号<br><input id="z-branchNo" style="width:70px"></label>
        <label style="font-size:12px">仕向支店名(ｶﾅ)<br><input id="z-branchName" style="width:120px"></label>
        <label style="font-size:12px">預金種目<br><select id="z-acctType"><option value="1">普通</option><option value="2">当座</option></select></label>
        <label style="font-size:12px">口座番号<br><input id="z-acctNo" style="width:100px"></label>
        <button class="btn g" onclick="saveCfg()" style="align-self:flex-end">保存</button>
      </div>
    </details>
    <div id="gen-result" style="display:none;background:#f0f4f9;border:1px solid var(--border);border-radius:6px;padding:10px 14px;margin-bottom:12px;white-space:pre-wrap;font-size:13px"></div>
    <div class="sumbar" id="sumbar"></div>
    <div id="list"></div>
  </div>
</div>
<div id="snackbar" class="snack"></div>

<script>
const MSAL_CONFIG={auth:{clientId:'d338d61b-01dc-4c7c-ac6b-aecf7f30d716',authority:'https://login.microsoftonline.com/3933e8a0-c945-4e97-ae67-c82131087cad',redirectUri:new URL('auth.html',window.location.href).href},cache:{cacheLocation:'sessionStorage'}};
const SCOPES=['User.Read','Sites.ReadWrite.All','Files.ReadWrite.All'];
const GRAPH='https://graph.microsoft.com/v1.0';
const AP_SITE='hanaokacorp.sharepoint.com,d80378dd-76a4-43f0-b939-1af66345d19d,8eaeb70b-2495-4029-affb-eabe80e021bb';
const STAGES=['起票','安部確認済','碓井確認済','福田承認済']; // 将来: '室長確認済','社長承認済'
const FINAL='福田承認済'; // 現状の最終承認（Ph4出力の対象）
let msalApp=null,acct=null,dueFilter='月末';
let PI={fmap:{},id:null,items:[]}, INV={fmap:{},id:null,items:[]}, PM={fmap:{},id:null,items:[]}, VB={fmap:{},id:null,byCode:{}};

async function boot(){msalApp=new msal.PublicClientApplication(MSAL_CONFIG);await msalApp.initialize();await msalApp.handleRedirectPromise();const a=msalApp.getAllAccounts();if(a.length){acct=a[0];msalApp.setActiveAccount(acct);await showApp();}else document.getElementById('login-view').style.display='block';}
async function signIn(){try{const r=await msalApp.loginPopup({scopes:SCOPES});acct=r.account;msalApp.setActiveAccount(acct);await showApp();}catch(e){if(e.errorCode!=='user_cancelled')snack('サインインエラー: '+e.message,true);}}
function signOut(){msalApp.logoutPopup({account:acct});}
async function token(){try{const r=await msalApp.acquireTokenSilent({scopes:SCOPES,account:acct});return r.accessToken;}catch{const r=await msalApp.acquireTokenPopup({scopes:SCOPES});acct=r.account;return r.accessToken;}}
async function gget(p){const t=await token();const r=await fetch(GRAPH+p,{headers:{Authorization:'Bearer '+t}});if(!r.ok)throw new Error('['+r.status+'] '+p);return r.json();}
async function gpatch(p,b){const t=await token();const r=await fetch(GRAPH+p,{method:'PATCH',headers:{Authorization:'Bearer '+t,'Content-Type':'application/json'},body:JSON.stringify(b)});if(!r.ok)throw new Error('['+r.status+'] '+await r.text());return r.json();}
async function gpost(p,b){const t=await token();const r=await fetch(GRAPH+p,{method:'POST',headers:{Authorization:'Bearer '+t,'Content-Type':'application/json'},body:JSON.stringify(b)});if(!r.ok)throw new Error('['+r.status+'] '+await r.text());return r.json();}

// SharedMasters（サイト:花岡車輌/msteams_7aab51）の 仕入先マスタ.csv を常に最新で読む
const SM_DRIVE='b!JT-BVyiLrECv-h59BtVoApKOQutjbKlGoUT2oig6LyO5ej8pUQ4QQIYH904CzeZ8';
const SM_FILE='仕入先マスタ.csv';
let SH={byCode:{}};  // 仕入先マスタ（取決条件・サイト・でんさい利用者番号・口座・基準額）
function parseCSV(text){if(text.charCodeAt(0)===0xFEFF)text=text.slice(1);const rows=[];let row=[],cur='',q=false;for(let i=0;i<text.length;i++){const c=text[i];if(q){if(c==='"'){if(text[i+1]==='"'){cur+='"';i++;}else q=false;}else cur+=c;}else{if(c==='"')q=true;else if(c===','){row.push(cur);cur='';}else if(c==='\n'){row.push(cur);rows.push(row);row=[];cur='';}else if(c==='\r'){}else cur+=c;}}if(cur!==''||row.length){row.push(cur);rows.push(row);}return rows;}
const normCode=c=>String(c==null?'':c).trim().replace(/^0+/,'');
async function loadShiharai(){
  try{
    const t=await token();
    const r=await fetch(`${GRAPH}/drives/${SM_DRIVE}/root:/${encodeURIComponent(SM_FILE)}:/content`,{headers:{Authorization:'Bearer '+t}});
    if(!r.ok)throw new Error('['+r.status+'] 仕入先マスタ.csv');
    const rows=parseCSV(new TextDecoder('utf-8').decode(await r.arrayBuffer()));
    const h=rows[0].map(x=>String(x==null?'':x).trim());const ix=n=>h.indexOf(n);
    const ci={code:ix('仕入先ｺｰﾄﾞ'),term:ix('取決条件名'),termc:ix('取決条件ｺｰﾄﾞ'),site:ix('手形サイト(日)'),den:ix('でんさい利用者番号'),
      base:ix('支払設定１　基準額設定　基準額'),bank:ix('振込口座　金融機関ｺｰﾄﾞ'),branch:ix('振込口座　金融機関支店ｺｰﾄﾞ'),
      atype:ix('振込口座　口座区分'),ano:ix('振込口座　口座番号'),kana:ix('振込口座　口座名義'),
      name1:ix('仕入先名１'),ryaku:ix('仕入先名略称'),janc:ix('仕入先ｼﾞｬﾝﾙｺｰﾄﾞ'),jann:ix('仕入先ｼﾞｬﾝﾙ名'),scomc:ix('仕入先社名ｺｰﾄﾞ'),scomn:ix('仕入先社名名'),mjc:ix('支払明細ｼﾞｬﾝｺｰﾄﾞ'),mjn:ix('支払明細ｼﾞｬﾝ名')};
    const v=(r2,i)=>(i>=0&&i<r2.length?(r2[i]||''):'');
    SH.byCode={};
    for(let i=1;i<rows.length;i++){const r2=rows[i];if(!r2||!v(r2,ci.code))continue;
      SH.byCode[normCode(v(r2,ci.code))]={term:v(r2,ci.term),termc:v(r2,ci.termc),site:v(r2,ci.site),base:Number(v(r2,ci.base))||0,den:v(r2,ci.den),bank:v(r2,ci.bank),branch:v(r2,ci.branch),atype:v(r2,ci.atype),ano:v(r2,ci.ano),kana:v(r2,ci.kana),name1:v(r2,ci.name1),ryaku:v(r2,ci.ryaku),janc:v(r2,ci.janc),jann:v(r2,ci.jann),scomc:v(r2,ci.scomc),scomn:v(r2,ci.scomn),mjc:v(r2,ci.mjc),mjn:v(r2,ci.mjn),rawcode:v(r2,ci.code)};}
  }catch(e){/* 取得失敗なら でんさい/判定時に警告 */}
}
// 支払期日：EOMONTH(基準日,n)＝基準月+nヶ月の末日。ユーザー提供のSWITCHロジック。
function eomonth(d,n){return new Date(d.getFullYear(),d.getMonth()+n+1,0);}
function densaiDue(base,site){site=Number(site);let e;switch(site){
  case 60:return eomonth(base,2);case 90:return eomonth(base,3);case 120:return eomonth(base,4);
  case 125:e=eomonth(base,5);return new Date(e.getFullYear(),e.getMonth(),5);
  case 135:e=eomonth(base,5);return new Date(e.getFullYear(),e.getMonth(),15);
  case 150:return eomonth(base,5);
  case 155:e=eomonth(base,6);return new Date(e.getFullYear(),e.getMonth(),5);
  case 161:e=eomonth(base,6);return new Date(e.getFullYear(),e.getMonth(),11);
  default:return null;}}
function ymd8(d){return d.getFullYear()+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0');}
function monthEnd(ym){const [y,m]=ym.split('/').map(Number);return new Date(y,m,0);}
function yen(n){return '¥'+(Number(n)||0).toLocaleString();}
function snack(m,e){const el=document.getElementById('snackbar');el.textContent=m;el.style.background=e?'#c0392b':'#323232';el.style.display='block';setTimeout(()=>el.style.display='none',4000);}

async function showApp(){document.getElementById('login-view').style.display='none';document.getElementById('app-view').style.display='block';document.getElementById('user-name').textContent=acct.name||acct.username;
  initMonth();loadCfg();await resolveLists();await loadShiharai();await reload();}
function initMonth(){const s=document.getElementById('month-select');const n=new Date();for(let i=-1;i<6;i++){const d=new Date(n.getFullYear(),n.getMonth()-i,1);const v=d.getFullYear()+'/'+String(d.getMonth()+1).padStart(2,'0');const o=document.createElement('option');o.value=v;o.textContent=v;if(i===0)o.selected=true;s.appendChild(o);}var qm=new URLSearchParams(location.search).get('month');if(qm){if(!Array.prototype.some.call(s.options,function(o){return o.value===qm;})){var oo=document.createElement('option');oo.value=qm;oo.textContent=qm;s.insertBefore(oo,s.firstChild);}s.value=qm;}}
function month(){return document.getElementById('month-select').value;}
function setDue(d){dueFilter=d;renderChips();renderList();}
function renderChips(){document.getElementById('due-chips').innerHTML=['10日','20日','月末'].map(d=>`<button class="chip ${dueFilter===d?'on':''}" onclick="setDue('${d}')">${d}</button>`).join(' ');}

async function resolveLists(){
  const ls=await gget(`/sites/${AP_SITE}/lists?$select=id,displayName`);
  const find=n=>ls.value.find(x=>x.displayName===n);
  PI.id=find('AP_PaymentInstruction').id; INV.id=find('AP_Invoice').id; PM.id=find('AP_PurchaseMatch').id; VB.id=find('AP_VendorBank').id;
  for(const o of [PI,INV,PM,VB]){const c=await gget(`/sites/${AP_SITE}/lists/${o.id}/columns?$select=name,displayName`);o.fmap={};c.value.forEach(x=>o.fmap[x.displayName]=x.name);}
}
const F=(o,d)=>o.fmap[d]||d;
async function fetchAll(listId){let all=[],n=`/sites/${AP_SITE}/lists/${listId}/items?$expand=fields&$top=500`;while(n){const d=await gget(n);all=all.concat(d.value||[]);n=d['@odata.nextLink']?d['@odata.nextLink'].replace(GRAPH,''):null;}return all;}

async function reload(){
  try{
    PI.items=(await fetchAll(PI.id)).map(it=>({id:it.id,f:it.fields}));
    INV.items=(await fetchAll(INV.id)).map(it=>({id:it.id,f:it.fields}));
    PM.items=(await fetchAll(PM.id)).map(it=>({id:it.id,f:it.fields}));
    VB.byCode={};(await fetchAll(VB.id)).forEach(it=>{const c=(it.fields[F(VB,'仕入先コード')]||'').trim();if(c)VB.byCode[c]=it.fields;});
    renderChips();renderList();
  }catch(e){snack('読込エラー: '+e.message,true);}
}

// 実支払日：締め回→日付（土日は前営業日へ。祝日は未対応＝要目視）
function payDate(ym,due){const [y,mo]=ym.split('/').map(Number);let day=due==='10日'?10:due==='20日'?20:new Date(y,mo,0).getDate();let d=new Date(y,mo-1,day);while(d.getDay()===0||d.getDay()===6)d.setDate(d.getDate()-1);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function iv(f,d){return f[F(INV,d)];}
function vbSnap(code){const b=VB.byCode[code];if(!b)return {};return {BankCode:b[F(VB,'銀行コード')]||'',BranchCode:b[F(VB,'支店コード')]||'',AcctType:b[F(VB,'口座区分')]||'',AcctNo:b[F(VB,'口座番号')]||'',AcctHolder:b[F(VB,'口座名義カナ')]||''};}

async function generate(){
  const ym=month(),due=dueFilter;
  // 既存（決済月×締め回×支払先×手段）
  const exist=new Set(PI.items.filter(p=>p.f[F(PI,'決済月')]===ym&&p.f[F(PI,'支払日区分')]===due).map(p=>(p.f[F(PI,'支払先コード')]||p.f[F(PI,'支払先名')]||'')+'|'+(p.f[F(PI,'支払手段')]||'')));
  const drafts={}; // key → {name,code,method,amount,loc,ids[]}
  const add=(code,name,method,amount,loc,invId,prepaid,ppdate)=>{const k=(code||name)+'|'+method+'|'+(prepaid?'P':'N');drafts[k]=drafts[k]||{code,name,method,amount:0,loc,ids:[],prepaid:!!prepaid,ppdate:ppdate||''};drafts[k].amount+=amount;if(invId)drafts[k].ids.push(String(invId));if(prepaid&&ppdate&&!drafts[k].ppdate)drafts[k].ppdate=ppdate;};
  // 経費：確定済（ロック）or 先行支払済・経費系・当月・当締め回
  INV.items.forEach(x=>{const f=x.f;const cat=iv(f,'支払区分')||'';if(cat!=='本社経費'&&cat!=='工場経費')return;
    if(iv(f,'仕分け済')!==true||iv(f,'アーカイブフラグ')===true)return;
    if((iv(f,'対象年月')||'')!==ym||(iv(f,'支払日区分')||'')!==due)return;
    const pst=iv(f,'支払ステータス')||'';if(pst!=='確定済（ロック）'&&pst!=='先行支払済')return;
    add(iv(f,'支払先コード')||'',iv(f,'支払先名')||'',iv(f,'支払手段')||'総合振込',Number(iv(f,'金額_税込'))||0,cat.indexOf('工場')>=0?'工場':'本社',x.id,pst==='先行支払済',iv(f,'先行支払日'));});
  // 仕入：受領済・突合済（締め回=月末のみ。仕入先ごと）
  if(due==='月末'){
    PM.items.forEach(x=>{const f=x.f;if((f[F(PM,'対象年月')]||'')!==ym)return;const stt=f[F(PM,'突合状態')]||'';if(stt!=='一致'&&stt!=='差異あり')return;if(f[F(PM,'請求書受領')]!==true)return;
      const code=(f[F(PM,'仕入先コード')]||'').trim();const name=f[F(PM,'仕入先名')]||'';const amt=(Number(f[F(PM,'請求書税込')])||0)+(Number(f[F(PM,'調整額')])||0);if(!amt)return;
      // 手段は仕入先マスタで判定（請求書の支払手段ではない）：取決条件=でんさい かつ 金額>基準額 → でんさい、それ以外 → 総合振込
      const m=SH.byCode[normCode(code)];
      const method=(m&&m.term==='でんさい'&&(m.base<=0||amt>m.base))?'でんさい':'総合振込';
      add(code,name,method,amt,'',null);});
  }
  const keys=Object.keys(drafts).filter(k=>!exist.has(k));
  if(!Object.keys(drafts).length){snack(`${ym} ${due}：対象なし（経費は確定済ロック・仕入は受領済が対象）`);return;}
  const log=[];let made=0,skip=Object.keys(drafts).length-keys.length;
  for(const k of keys){const dft=drafts[k];const snap=vbSnap(dft.code);
    const fields={};
    fields['Title']=`${ym} ${due} ${dft.name}`;
    fields[F(PI,'決済月')]=ym;fields[F(PI,'支払日区分')]=due;fields[F(PI,'実支払日')]=payDate(ym,due);
    fields[F(PI,'支払先名')]=dft.name;fields[F(PI,'支払先コード')]=dft.code;fields[F(PI,'支払手段')]=dft.method;
    fields[F(PI,'支払額')]=dft.amount;fields[F(PI,'拠点')]=dft.loc||'本社';
    fields[F(PI,'元請求書ID')]=dft.ids.join(',');
    fields[F(PI,'銀行コード')]=snap.BankCode||'';fields[F(PI,'支店コード')]=snap.BranchCode||'';fields[F(PI,'預金種目')]=snap.AcctType||'';fields[F(PI,'口座番号')]=snap.AcctNo||'';fields[F(PI,'受取人カナ')]=snap.AcctHolder||'';
    fields[F(PI,'承認状態')]='起票';fields[F(PI,'支払状態')]=dft.prepaid?'先行支払済':'未';
    if(dft.prepaid&&dft.ppdate)fields[F(PI,'実支払日')]=dft.ppdate;
    if(dft.prepaid)fields[F(PI,'メモ')]='経費側で先行支払済（急ぎ振込）';
    if(dft.method==='総合振込'&&!snap.BankCode&&!dft.prepaid)fields[F(PI,'メモ')]='⚠振込先口座未登録（AP_VendorBank）';

const ZCFG_DEF={itaku:'4828535100',itakuName:'ﾊﾅｵｶｼﾔﾘﾖｳ(ｶ',bankNo:'0009',bankName:'ﾐﾂｲｽﾐﾄﾓ',branchNo:'779',branchName:'ｳｴﾉ',acctType:'2',acctNo:'0274005'};
function loadCfg(){let c;try{c=Object.assign({},ZCFG_DEF,JSON.parse(localStorage.getItem('zengin_cfg')||'{}'));}catch{c={...ZCFG_DEF};}
  ['itaku','itakuName','bankNo','bankName','branchNo','branchName','acctType','acctNo'].forEach(k=>{const el=document.getElementById('z-'+k);if(el)el.value=c[k];});return c;}
function saveCfg(){const c={};['itaku','itakuName','bankNo','bankName','branchNo','branchName','acctType','acctNo'].forEach(k=>c[k]=document.getElementById('z-'+k).value);localStorage.setItem('zengin_cfg',JSON.stringify(c));snack('振込元設定を保存しました');}
function sjisByte(ch){const c=ch.charCodeAt(0);if(c>=0x20&&c<=0x7E)return c;if(c>=0xFF61&&c<=0xFF9F)return c-0xFF61+0xA1;if(ch==='　')return 0x20;return 0x3F;}
function toBytes(s){const o=[];for(const ch of s)o.push(sjisByte(ch));return o;}
function padR(s,n){s=String(s==null?'':s);if(s.length>n)s=s.slice(0,n);return s.padEnd(n,' ');}
function padL0(s,n){s=String(s==null?'':s).replace(/[^0-9]/g,'');if(s.length>n)s=s.slice(-n);return s.padStart(n,'0');}
function typeCode(t){t=String(t==null?'':t);if(/普通/.test(t))return '1';if(/当座/.test(t))return '2';if(/貯蓄/.test(t))return '4';if(/^[0-9]$/.test(t))return t;return '9';}
function buildZengin(list,ym,due,cfg){
  const mmdd=payDate(ym,due).slice(5).replace('-','');  // 取組日=支払日 MMDD
  const header='1'+'21'+'0'+padL0(cfg.itaku,10)+padR(cfg.itakuName,40)+mmdd+padL0(cfg.bankNo,4)+padR(cfg.bankName,15)+padL0(cfg.branchNo,3)+padR(cfg.branchName,15)+typeCode(cfg.acctType)+padL0(cfg.acctNo,7)+padR('',17);
  const data=list.map(p=>{const f=p.f;const amt=Number(f[F(PI,'支払額')])||0;
    // 被仕向銀行名・支店名は空欄（銀行コードで解決される。要ればカナ名マスタを追加）
    return '2'+padL0(f[F(PI,'銀行コード')],4)+padR('',15)+padL0(f[F(PI,'支店コード')],3)+padR('',15)+'0000'+typeCode(f[F(PI,'預金種目')])+padL0(f[F(PI,'口座番号')],7)+padR(f[F(PI,'受取人カナ')],30)+padL0(amt,10)+'0'+padR('',10)+padR('',10)+'7'+' '+padR('',7);});
  const total=list.reduce((s,p)=>s+(Number(p.f[F(PI,'支払額')])||0),0);
  const trailer='8'+padL0(list.length,6)+padL0(total,12)+padR('',101);
  const end='9'+padR('',119);
  const recs=[header,...data,trailer,end];
  const bad=recs.find(r=>r.length!==120); if(bad!==undefined)throw new Error('レコード長が120でない（不具合）：'+bad.length);
  const bytes=[];recs.forEach((r,i)=>{if(i>0){bytes.push(0x0D,0x0A);}toBytes(r).forEach(b=>bytes.push(b));});bytes.push(0x0D,0x0A);
  return {bytes:new Uint8Array(bytes),count:list.length,total};
}
function downloadBytes(bytes,fname){const blob=new Blob([bytes],{type:'text/plain'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=fname;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);}
function ts(){const d=new Date();const p=n=>String(n).padStart(2,'0');return d.getFullYear()+p(d.getMonth()+1)+p(d.getDate())+p(d.getHours())+p(d.getMinutes())+p(d.getSeconds());}

    rows.push(smileRow({denpyoDate,renban,line:++line,code:rcode,name1,deptc,k:kubunOf(method),amount:mainAmt,dueday}));sum+=mainAmt;

  snack(msg.split('\n')[0]);

<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>人事情報</title>
<script src="https://cdn.jsdelivr.net/npm/@azure/msal-browser@3.10.0/lib/msal-browser.min.js" crossorigin="anonymous"></script>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f7f7f5; --panel: #ffffff; --border: #e3e2de; --text: #1f1e1c; --muted: #767468; --accent: #b8622f;
    --ok: #2f6b3a; --warn: #a8712f;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg:#1b1a18; --panel:#242320; --border:#3a3833; --text:#ece9e2; --muted:#a6a296; --accent:#e0925c; --ok:#5fae70; --warn:#e0a95c; }
  }
  :root[data-theme="dark"] { --bg:#1b1a18; --panel:#242320; --border:#3a3833; --text:#ece9e2; --muted:#a6a296; --accent:#e0925c; --ok:#5fae70; --warn:#e0a95c; }
  * { box-sizing: border-box; }
  html, body { height:100%; }
  body { margin:0; background:var(--bg); color:var(--text); font-family:-apple-system,"Hiragino Sans","Yu Gothic",sans-serif;
    display:flex; flex-direction:column; overflow:hidden; }
  #appRoot { display:flex; flex-direction:column; flex:1; min-height:0; }
  header { padding:16px 24px; border-bottom:1px solid var(--border); display:flex; align-items:center; gap:14px; flex-wrap:wrap; flex-shrink:0; }
  h1 { font-size:16px; margin:0; font-weight:600; }
  select, input[type="search"] { padding:6px 10px; border-radius:6px; border:1px solid var(--border); background:var(--panel); color:var(--text); font-size:13px; }
  .month-stepper { display:flex; align-items:center; gap:2px; background:var(--panel); border:2px solid var(--accent); border-radius:10px; padding:3px; }
  .month-stepper button { background:none; border:none; color:var(--accent); font-size:15px; font-weight:700; cursor:pointer; padding:6px 10px; border-radius:7px; line-height:1; }
  .month-stepper button:hover:not(:disabled) { background:color-mix(in srgb, var(--accent) 15%, transparent); }
  .month-stepper button:disabled { opacity:.3; cursor:default; }
  .month-stepper select { border:none; background:none; font-size:15px; font-weight:700; color:var(--text); padding:4px; cursor:pointer; text-align:center; }
  .theme-btn { padding:6px 10px; border-radius:6px; border:1px solid var(--border); background:var(--panel); color:var(--text); font-size:13px; cursor:pointer; }
  .tabs { display:flex; gap:4px; }
  .tab-btn { padding:6px 16px; border-radius:6px; border:1px solid var(--border); background:var(--panel); color:var(--muted); font-size:13px; cursor:pointer; }
  .tab-btn.active { background:var(--accent); color:#fff; border-color:var(--accent); }
  label.chk { display:flex; align-items:center; gap:6px; font-size:13px; color:var(--muted); }
  .spacer { flex:1; }
  .warn-banner { background:#7a3b1a22; border:1px solid var(--accent); color:var(--text); padding:8px 24px; font-size:12.5px; flex-shrink:0; }
  main { padding:16px 24px; flex:1; min-height:0; overflow:auto; display:flex; flex-direction:column; gap:20px; }
  h2 { font-size:14px; margin:0 0 8px; }
  .note { color:var(--muted); font-size:12px; margin:0 0 8px; }
  .scrollx { overflow:auto; border:1px solid var(--border); border-radius:10px; background:var(--panel); }
  #rosterWrap.scrollx { flex:1; min-height:0; }
  table { border-collapse:collapse; white-space:nowrap; font-size:12.5px; width:100%; }
  th, td { padding:6px 9px; text-align:left; border-bottom:1px solid var(--border); }
  th:nth-child(4), td:nth-child(4), th:nth-child(9), td:nth-child(9), th:nth-child(12), td:nth-child(12) { text-align:right; }
  th:first-child, td:first-child, th:nth-child(2), td:nth-child(2) {
    position:sticky; background:var(--panel); z-index:2;
  }
  th:first-child, td:first-child { left:0; }
  th:nth-child(2), td:nth-child(2) { left:90px; }
  thead th { color:var(--muted); font-weight:600; position:sticky; top:0; z-index:3; background:var(--panel); }
  thead th:first-child, thead th:nth-child(2) { z-index:4; }
  .dept-sep td { background:color-mix(in srgb, var(--accent) 8%, var(--panel)); font-weight:600; color:var(--accent); }
  .retired td { color:var(--muted); }
  .pill { display:inline-block; padding:1px 8px; border-radius:999px; font-size:11.5px; font-weight:600; }
  .p-on { background:color-mix(in srgb, var(--ok) 18%, var(--panel)); color:var(--ok); }
  .p-off { background:color-mix(in srgb, var(--muted) 18%, var(--panel)); color:var(--muted); }
  th.row-hover, td.row-hover, th.col-hover, td.col-hover { background:color-mix(in srgb, var(--accent) 6%, var(--panel)) !important; }
  th.cell-hover, td.cell-hover { background:color-mix(in srgb, var(--accent) 16%, var(--panel)) !important; }
  #gate { padding:80px 24px; text-align:center; overflow:auto; flex:1; min-height:0; }
  #gate .btn { font:inherit; font-size:14px; padding:10px 22px; border-radius:6px; border:1px solid var(--accent); background:var(--accent); color:#fff; cursor:pointer; }
  #gateError { color:#b03636; margin-top:14px; font-size:13px; white-space:pre-wrap; }
  .hide { display:none !important; }
</style>
</head>
<body>
<nav style="background:#1f1e1c;color:#fff;padding:8px 24px;font:13px -apple-system,'Hiragino Sans',sans-serif;display:flex;gap:18px;align-items:center;">
  <strong style="opacity:.55;font-weight:600;">給与・労務アプリ</strong>
  <a href="payroll_dashboard.html" style="color:#fff;text-decoration:none;opacity:.75;">給与前月対比</a>
  <a href="payroll_detail.html" style="color:#fff;text-decoration:none;opacity:.75;">支給控除一覧表</a>
  <a href="payroll_leave.html" style="color:#fff;text-decoration:none;opacity:.75;">年次有給休暇管理</a>
  <a href="payroll_people.html" style="color:#fff;text-decoration:none;font-weight:700;">人事情報</a>
</nav>

<div id="gate">
  <p id="gateMsg">役員・総務幹部限定のデータです。Microsoftアカウントでサインインしてください。</p>
  <button class="btn" id="signInBtn">サインイン</button>
  <div id="gateError"></div>
</div>

<div id="appRoot" class="hide">
<div class="warn-banner">⚠ 従業員の個人情報（氏名・年齢・生年月日・入社日など）です。役員・総務幹部限定での共有・保管としてください。</div>
<header>
  <h1>人事情報</h1>
  <div class="month-stepper">
    <button id="prevMonthBtn" aria-label="前月" type="button">◀</button>
    <select id="monthSel"></select>
    <button id="nextMonthBtn" aria-label="次月" type="button">▶</button>
  </div>
  <div class="tabs">
    <button class="tab-btn active" data-site="すべて" id="tabAll">すべて</button>
    <button class="tab-btn" data-site="本社" id="tabHonsha">本社</button>
    <button class="tab-btn" data-site="工場" id="tabKoujou">工場</button>
  </div>
  <select id="deptSel"></select>
  <input type="search" id="nameSearch" placeholder="氏名で絞り込む">
  <label class="chk"><input type="checkbox" id="showRetired"> 退職者を含める</label>
  <div class="spacer"></div>
  <button class="theme-btn" id="themeBtn">☀ ライト</button>
</header>
<main>
  <section style="display:flex; flex-direction:column; flex:1; min-height:0;">
    <div class="note" id="rosterNote"></div>
    <div class="scrollx" id="rosterWrap"><table id="rosterTable"></table></div>
  </section>

  <section>
    <h2>所属異動履歴（データが蓄積した範囲で検出）</h2>
    <p class="note" id="movesNote"></p>
    <div class="scrollx"><table id="movesTable">
      <thead><tr><th>氏名</th><th>拠点</th><th>変更前部門</th><th>変更前所属</th><th>→</th><th>変更後部門</th><th>変更後所属</th><th>検出月</th></tr></thead>
      <tbody></tbody>
    </table></div>
  </section>
</main>
</div>

<script src="payroll_graph.js"></script>
<script>
"use strict";
const $ = s => document.querySelector(s);

(function initTheme() {
  let saved;
  try { saved = localStorage.getItem('payrollPeopleTheme'); } catch (e) { saved = null; }
  const theme = saved || 'light';
  document.documentElement.setAttribute('data-theme', theme);
  const btn = $('#themeBtn');
  function updateBtn() {
    const cur = document.documentElement.getAttribute('data-theme');
    btn.textContent = cur === 'dark' ? '🌙 ダーク' : '☀ ライト';
  }
  updateBtn();
  btn.addEventListener('click', () => {
    const cur = document.documentElement.getAttribute('data-theme');
    const next = cur === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', next);
    try { localStorage.setItem('payrollPeopleTheme', next); } catch (e) {}
    updateBtn();
  });
})();

document.addEventListener('mouseover', (e) => {
  const cell = e.target.closest('td,th');
  const table = cell && cell.closest('table');
  if (!table) return;
  const idx = cell.cellIndex;
  cell.closest('tr').querySelectorAll('td,th').forEach(c => c.classList.add('row-hover'));
  table.querySelectorAll('tr').forEach(row => {
    const c = row.children[idx];
    if (c) c.classList.add('col-hover');
  });
  cell.classList.add('cell-hover');
});
document.addEventListener('mouseout', (e) => {
  if (!e.target.closest('table')) return;
  document.querySelectorAll('.row-hover').forEach(c => c.classList.remove('row-hover'));
  document.querySelectorAll('.col-hover').forEach(c => c.classList.remove('col-hover'));
  document.querySelectorAll('.cell-hover').forEach(c => c.classList.remove('cell-hover'));
});

const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

let EMPLOYEES = [];
let months = [];
let currentSite = 'すべて';
const monthSel = $('#monthSel');

function monthsOf() { return [...new Set(EMPLOYEES.map(r => r.年月))].sort(); }

function updateStepperButtons() {
  const idx = months.indexOf(monthSel.value);
  $('#prevMonthBtn').disabled = idx <= 0;
  $('#nextMonthBtn').disabled = idx < 0 || idx >= months.length - 1;
}
function stepMonth(delta) {
  const idx = months.indexOf(monthSel.value) + delta;
  if (idx < 0 || idx >= months.length) return;
  monthSel.value = months[idx];
  render();
}
$('#prevMonthBtn').addEventListener('click', () => stepMonth(-1));
$('#nextMonthBtn').addEventListener('click', () => stepMonth(1));

function setSite(s) {
  currentSite = s;
  $('#tabAll').classList.toggle('active', s === 'すべて');
  $('#tabHonsha').classList.toggle('active', s === '本社');
  $('#tabKoujou').classList.toggle('active', s === '工場');
  render();
}
$('#tabAll').addEventListener('click', () => setSite('すべて'));
$('#tabHonsha').addEventListener('click', () => setSite('本社'));
$('#tabKoujou').addEventListener('click', () => setSite('工場'));

function fillDeptSelect(rows) {
  const keep = $('#deptSel').value;
  const depts = [...new Set(rows.map(r => r.部門).filter(Boolean))].sort((a, b) => a.localeCompare(b, 'ja'));
  $('#deptSel').innerHTML = '<option value="">部門：すべて</option>' + depts.map(d => `<option>${esc(d)}</option>`).join('');
  if (depts.includes(keep)) $('#deptSel').value = keep;
}

function render() {
  updateStepperButtons();
  const ym = monthSel.value;
  let rows = EMPLOYEES.filter(r => r.年月 === ym);

  fillDeptSelect(rows);

  if (currentSite !== 'すべて') rows = rows.filter(r => r.拠点 === currentSite);
  if (!$('#showRetired').checked) rows = rows.filter(r => r.在職区分名称 === '在職');
  const dept = $('#deptSel').value;
  if (dept) rows = rows.filter(r => r.部門 === dept);
  const q = $('#nameSearch').value.trim();
  if (q) rows = rows.filter(r => (r.従業員名 || '').replace(/\s/g, '').includes(q.replace(/\s/g, '')));

  rows.sort((a, b) => (a.部門 || '').localeCompare(b.部門 || '', 'ja') || a.従業員コード.localeCompare(b.従業員コード, undefined, {numeric:true}));

  $('#rosterNote').textContent = `${ym} 時点　${rows.length}名を表示`;

  let thead = '<thead><tr><th>従業員コード</th><th>氏名</th><th>拠点</th><th>部門</th><th>所属</th>'
    + '<th>在職区分</th><th>役職</th><th>給与種別</th><th>性別</th><th>年齢</th><th>生年月日</th><th>入社年月日</th><th>勤続年数</th><th>退職年月日</th></tr></thead>';

  let tbody = '<tbody>';
  let lastDept = null;
  for (const r of rows) {
    if (r.部門 !== lastDept) {
      lastDept = r.部門;
      tbody += `<tr class="dept-sep"><td colspan="14">${esc(lastDept || '（部門不明）')}</td></tr>`;
    }
    const retired = r.在職区分名称 !== '在職';
    tbody += `<tr class="${retired ? 'retired' : ''}">`
      + `<td>${esc(r.従業員コード)}</td><td>${esc(r.従業員名)}</td><td>${esc(r.拠点)}</td>`
      + `<td>${esc(r.部門)}</td><td>${esc(r.所属)}</td>`
      + `<td><span class="pill ${retired ? 'p-off' : 'p-on'}">${esc(r.在職区分名称)}</span></td>`
      + `<td>${esc(r.役職)}</td><td>${esc(r.給与種別名称)}</td><td>${esc(r.性別)}</td>`
      + `<td>${esc(r.年齢)}</td><td>${esc(r.生年月日)}</td><td>${esc(r.入社年月日)}</td>`
      + `<td>${esc(r.勤続年数)}</td><td>${esc(r.退職年月日)}</td>`
      + `</tr>`;
  }
  if (!rows.length) tbody += '<tr><td colspan="14" class="note">該当者なし</td></tr>';
  tbody += '</tbody>';
  $('#rosterTable').innerHTML = thead + tbody;

  renderMoves();
}

function renderMoves() {
  const moves = [];
  for (let i = 1; i < months.length; i++) {
    const prevYm = months[i - 1], curYm = months[i];
    const prevMap = new Map();
    for (const r of EMPLOYEES) if (r.年月 === prevYm) prevMap.set(r.拠点 + '|' + r.従業員コード, r);
    for (const r of EMPLOYEES) {
      if (r.年月 !== curYm || r.在職区分名称 !== '在職') continue;
      const prev = prevMap.get(r.拠点 + '|' + r.従業員コード);
      if (!prev || prev.在職区分名称 !== '在職') continue;
      if (prev.部門 !== r.部門 || prev.所属 !== r.所属) {
        moves.push({
          氏名: r.従業員名, 拠点: r.拠点,
          前部門: prev.部門, 前所属: prev.所属, 後部門: r.部門, 後所属: r.所属,
          検出月: `${prevYm}→${curYm}`,
        });
      }
    }
  }
  moves.reverse();
  $('#movesNote').textContent = moves.length
    ? `${moves.length}件の異動を検出（新しい順）`
    : `検出できた異動はありません（現在保存されている ${months.length} ヶ月分の範囲では変化なし。データが増えるほど検出精度が上がります）`;
  $('#movesTable tbody').innerHTML = moves.map(m => `<tr>
    <td>${esc(m.氏名)}</td><td>${esc(m.拠点)}</td>
    <td>${esc(m.前部門)}</td><td>${esc(m.前所属)}</td><td>→</td>
    <td>${esc(m.後部門)}</td><td>${esc(m.後所属)}</td><td>${esc(m.検出月)}</td>
  </tr>`).join('');
}

$('#deptSel').addEventListener('change', render);
$('#nameSearch').addEventListener('input', render);
$('#showRetired').addEventListener('change', render);

async function loadDataAndShow() {
  $('#gateMsg').textContent = '読み込み中…';
  $('#signInBtn').disabled = true;
  EMPLOYEES = await payrollGetFile('history/employee_master.json');
  months = monthsOf();
  monthSel.innerHTML = months.map(m => `<option value="${m}">${m}</option>`).join('');
  monthSel.value = months[months.length - 1];
  monthSel.addEventListener('change', render);
  render();

  $('#gate').classList.add('hide');
  $('#appRoot').classList.remove('hide');
}

async function boot() {
  const signedIn = await payrollInitAuth();
  if (signedIn) { try { await loadDataAndShow(); } catch (e) { showGateError(e); } }
}
function showGateError(e) {
  $('#gateError').textContent = e.message || String(e);
  $('#gateMsg').textContent = '役員・総務幹部限定のデータです。Microsoftアカウントでサインインしてください。';
  $('#signInBtn').disabled = false;
}
$('#signInBtn').addEventListener('click', async () => {
  $('#gateError').textContent = '';
  try {
    await payrollSignIn();
    await loadDataAndShow();
  } catch (e) { showGateError(e); }
});
boot();
</script>
</body>
</html>

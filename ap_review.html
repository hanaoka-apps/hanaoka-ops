<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>支払確認・承認（経費） | 花岡車輌</title>
<script src="https://cdn.jsdelivr.net/npm/@azure/msal-browser@3.10.0/lib/msal-browser.min.js" crossorigin="anonymous"></script>
<script src="nav.js" defer></script>
<style>
  :root{--primary:#1a5fa8;--primary-dk:#134680;--accent:#e8412e;--success:#2e7d52;--warning:#c07a00;--danger:#c0392b;--bg:#f4f6f9;--card:#fff;--border:#dde2ec;--text:#1e2533;--muted:#6b7a99;}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'Meiryo','Hiragino Sans',sans-serif;background:var(--bg);color:var(--text);}
  header{background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 24px;height:52px;position:sticky;top:0;z-index:100;box-shadow:0 2px 8px rgba(0,0,0,.2);}
  header .logo{font-size:16px;font-weight:700;}header .logo span{opacity:.7;font-weight:400;font-size:13px;margin-left:10px;}
  header .user-info{display:flex;align-items:center;gap:12px;font-size:13px;}
  header button{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.3);color:#fff;padding:5px 14px;border-radius:4px;cursor:pointer;font-size:12px;}
  #login-view{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:calc(100vh - 52px);gap:20px;}
  #login-btn{background:var(--primary);color:#fff;border:none;padding:12px 36px;border-radius:6px;font-size:15px;font-weight:700;cursor:pointer;display:flex;gap:8px;align-items:center;}
  #app-view{display:none;}
  .topbar{display:flex;align-items:center;gap:12px;padding:10px 20px;background:var(--card);border-bottom:1px solid var(--border);flex-wrap:wrap;}
  .topbar label{font-size:13px;color:var(--muted);font-weight:600;}
  .topbar select{border:1px solid var(--border);border-radius:4px;padding:4px 10px;font-size:14px;}
  .seg{display:inline-flex;border:1px solid var(--border);border-radius:6px;overflow:hidden;}
  .seg button{background:#fff;border:none;padding:5px 14px;font-size:13px;cursor:pointer;color:var(--muted);}
  .seg button.on{background:var(--primary);color:#fff;font-weight:700;}
  .topbar .links{margin-left:auto;display:flex;gap:14px;}
  .topbar .links a{font-size:13px;color:var(--primary);text-decoration:none;}
  .main{display:grid;grid-template-columns:290px 1fr;height:calc(100vh - 52px - 50px);}
  @media(max-width:900px){.main{grid-template-columns:1fr;height:auto;}}
  .list-pane{border-right:1px solid var(--border);overflow-y:auto;background:#fbfcfe;}
  .list-filter{padding:9px 14px;border-bottom:1px solid var(--border);font-size:12px;color:var(--muted);}
  .grp-h{padding:6px 14px;background:#eef2f8;font-size:11px;font-weight:700;color:var(--primary-dk);position:sticky;top:0;}
  .inv-card{padding:11px 14px;border-bottom:1px solid var(--border);cursor:pointer;}
  .inv-card:hover{background:#eef3fb;}
  .inv-card.active{background:#e4edf9;border-left:3px solid var(--primary);}
  .inv-card .pname{font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .inv-card .meta{font-size:11px;color:var(--muted);margin-top:3px;display:flex;justify-content:space-between;}
  .inv-card .amt{font-weight:700;color:var(--text);}
  .badge{display:inline-block;padding:1px 7px;border-radius:10px;font-size:10px;font-weight:700;margin-left:4px;}
  .b-review{background:#fdecea;color:var(--danger);}.b-locked{background:#cfe9dd;color:#14532d;}.b-wait{background:#fff3cd;color:#664d00;}.b-flag{background:#fde2cf;color:#9a4a00;}
  .detail-pane{overflow-y:auto;padding:14px 18px;}
  .empty{color:var(--muted);text-align:center;padding:60px;font-size:14px;}
  /* 2ペイン：左=主/従、右=PDF */
  .two-col{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:16px;align-items:start;}
  @media(max-width:1150px){.two-col{grid-template-columns:1fr;}}
  /* 主：支払確定カード */
  .pay-card{background:var(--card);border:1px solid var(--primary);border-radius:10px;padding:14px 16px;}
  .pay-top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px;}
  .pay-amt{display:flex;align-items:baseline;gap:10px;margin:6px 0 12px;}
  .pay-amt .lbl{font-size:12px;color:var(--muted);}
  .pay-amt .val{font-size:28px;font-weight:700;}
  .pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px 12px;}
  .fld{display:flex;flex-direction:column;gap:2px;}
  .fld label{font-size:11px;color:var(--muted);font-weight:600;}
  .fld input,.fld select{border:1px solid var(--border);border-radius:4px;padding:5px 6px;font-size:13px;background:#fff;}
  .fld input:disabled,.fld select:disabled{background:#f3f5f9;color:#888;}
  .flags{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:10px 0 2px;}
  .review-bar{background:#fdecea;border:1px solid var(--danger);color:var(--danger);border-radius:6px;padding:8px 12px;font-size:13px;margin:8px 0 0;}
  .actions{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap;}
  .btn-primary{background:var(--primary);color:#fff;border:none;padding:9px 20px;border-radius:6px;font-size:13px;font-weight:700;cursor:pointer;}
  .btn-approve{background:var(--success);color:#fff;border:none;padding:9px 22px;border-radius:6px;font-size:14px;font-weight:700;cursor:pointer;}
  .btn-reject{background:#fff;color:var(--danger);border:1px solid var(--danger);padding:9px 16px;border-radius:6px;font-size:13px;font-weight:700;cursor:pointer;}
  .btn-ghost{background:#fff;color:var(--primary);border:1px solid var(--primary);padding:5px 12px;border-radius:5px;font-size:12px;cursor:pointer;}
  .btn-approve:disabled,.btn-primary:disabled{opacity:.5;cursor:default;}
  /* 従：仕訳プレビュー */
  .jnl{margin-top:16px;}
  .jnl-h{display:flex;align-items:center;gap:10px;margin-bottom:6px;}
  .jnl-h .t{font-size:12px;color:var(--muted);}
  .diff-ok{color:var(--success);font-size:12px;}.diff-ng{color:var(--danger);font-weight:700;font-size:12px;}
  .jnl-box{background:#fbfcfe;border:1px solid var(--border);border-radius:8px;overflow-x:auto;}
  table.jnl-t{width:100%;border-collapse:collapse;font-size:12px;min-width:560px;}
  table.jnl-t th{background:#f1f4f9;padding:6px 6px;text-align:left;color:var(--muted);font-weight:600;font-size:11px;white-space:nowrap;}
  table.jnl-t td{padding:5px 6px;border-top:1px solid #eef2f8;}
  table.jnl-t td.num,table.jnl-t th.num{text-align:right;white-space:nowrap;}
  table.jnl-t tr.low td{background:#fffaf0;}
  table.jnl-t input,table.jnl-t select{width:100%;border:1px solid var(--border);border-radius:4px;padding:3px 4px;font-size:12px;}
  table.jnl-t input.num{text-align:right;}
  table.jnl-t input[readonly]{background:#eef1f6;border:none;font-weight:700;}
  .ask{background:#e9f2fc;border:1px solid #9ec5ee;border-radius:6px;padding:9px 11px;margin-top:8px;font-size:12px;color:var(--primary-dk);}
  .ask b{color:var(--danger);}
  /* PDF */
  .pdf-pane h3{font-size:13px;color:var(--primary);margin-bottom:6px;}
  .pdf-chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px;}
  .pdf-chip{font-size:11px;border:1px solid var(--border);background:#fff;border-radius:5px;padding:3px 8px;cursor:pointer;max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .pdf-chip.on{background:var(--primary);color:#fff;border-color:var(--primary);}
  .pdf-frame{width:100%;height:82vh;min-height:520px;border:1px solid var(--border);border-radius:8px;background:#fafbfd;}
  .pdf-link{display:inline-block;margin-bottom:6px;font-size:13px;color:var(--primary);}
  #snackbar{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#323232;color:#fff;padding:10px 20px;border-radius:6px;font-size:13px;display:none;z-index:999;}
</style>
</head>
<body>
<header>
  <div class="logo">花岡車輌<span>支払確認・承認（経費）</span></div>
  <div class="user-info"><span id="user-name"></span><button onclick="signOut()">サインアウト</button></div>
</header>

<div id="login-view">
  <h2 style="color:#1a5fa8">支払確認・承認（経費）</h2>
  <p style="color:#6b7a99">花岡車輌の Microsoft アカウントでサインインしてください</p>
  <button id="login-btn" onclick="signIn()">
    <svg width="18" height="18" viewBox="0 0 21 21"><path d="M10 0H0v10h10V0z" fill="#F25022"/><path d="M21 0H11v10h10V0z" fill="#7FBA00"/><path d="M10 11H0v10h10V11z" fill="#00A4EF"/><path d="M21 11H11v10h10V11z" fill="#FFB900"/></svg>
    サインイン
  </button>
</div>

<div id="app-view">
  <div id="app-nav-slot"></div>
  <div class="topbar">
    <div class="seg">
      <button id="mode-review" class="on" onclick="setMode('review')">未チェック</button>
      <button id="mode-all" onclick="setMode('all')">全期間</button>
      <button id="mode-month" onclick="setMode('month')">月ごと</button>
      <button id="mode-arch" onclick="setMode('arch')">🗄 対象外</button>
    </div>
    <label style="font-size:12px;color:var(--muted)">月ごとの月</label>
    <select id="month-select" onchange="renderList()"></select>
    <span id="status-msg" style="font-size:12px;color:var(--muted)"></span>
    <div class="links"><a href="ap_dashboard.html">📊 ダッシュボード</a><a href="ap_purchase_match.html">🔗 仕入突合</a><a href="ap_entry.html">✏ 手入力</a></div>
  </div>
  <div id="due-chips" style="display:flex;gap:8px;align-items:center;padding:8px 16px;flex-wrap:wrap;border-bottom:1px solid var(--border);background:#fafbfc"></div>
  <div class="main">
    <div class="list-pane" id="list-pane"></div>
    <div class="detail-pane" id="detail-pane"><div class="empty">左の請求書を選択してください</div></div>
  </div>
</div>
<div id="snackbar"></div>

<script>
const MSAL_CONFIG={auth:{clientId:'d338d61b-01dc-4c7c-ac6b-aecf7f30d716',authority:'https://login.microsoftonline.com/3933e8a0-c945-4e97-ae67-c82131087cad',redirectUri:new URL('auth.html',window.location.href).href},cache:{cacheLocation:'sessionStorage'}};
const SCOPES=['User.Read','Sites.ReadWrite.All','Files.Read.All'];
const GRAPH='https://graph.microsoft.com/v1.0';
const SITE='hanaokacorp.sharepoint.com,d80378dd-76a4-43f0-b939-1af66345d19d,8eaeb70b-2495-4029-affb-eabe80e021bb';
const LIST_H='AP_Invoice', LIST_L='AP_PaymentSlip';
let msalApp=null,acct=null,mode='review',selected=null,editMode=false,dueFilter='all';
let H={fmap:{},id:null,inv:[]};
let L={fmap:{},id:null,byInv:{}};
let revCache={};
const DEPTS=[['001110','全社'],['002220','東京本社'],['002230','大阪'],['002240','名古屋'],['003110','工場全体'],['003210','第一工場'],['003220','第二工場'],['003230','第三工場'],['003310','技術部'],['003410','品質管理部'],['003510','工場総務'],['004110','本社総務部'],['005110','本社']];
const PAYMETHODS=['でんさい','総合振込','口座振替','海外送金','現金'];
const PAYCATS=['本社経費','本社仕入','工場経費','工場仕入'];
const PAYDATES=['10日','20日','月末'];
const ACCOUNTS=[
  ['給料手当','000641'],['旅費交通費','000648'],['通信費','000650'],['荷造運賃','000652'],['交際費','000656'],['修繕費','000657'],['水道光熱費','000658'],['消耗品費','000659'],['消耗事務費','000660'],['リース料','000661'],['車輛消耗油脂費','000662'],['賃借料','000663'],['租税公課','000664'],['保険料','000665'],['業務委託手数料','000667'],['支払手数料','000668'],['顧問料','000670'],['諸会費','000671'],['新聞図書費','000672'],['研修費','000673'],['会議費','000675'],['減価償却費','000689'],['雑費','000690'],
  ['外注加工費','000507'],['給料手当（工場）','000510'],['旅費交通費（工場）','000519'],['通信費（工場）','000520'],['運搬費','000521'],['交際費（工場）','000522'],['修繕費（工場）','000523'],['機械修繕費','000524'],['水道光熱費（工場）','000525'],['消耗品費（工場）','000526'],['消耗工具備品費','000527'],['消耗油脂費','000528'],['車輛消耗油脂費（工場）','000529'],['リース料（工場）','000530'],['租税公課（工場）','000531'],['保険料（工場）','000532'],['支払手数料（工場）','000533'],['消耗事務費（工場）','000541'],['会議費（工場）','000542'],['減価償却費（工場）','000544'],['雑費（工場）','000545'],
  ['リース債務','000941'],['支払手形（でんさい）','000300'],['買掛金','000310'],['前払費用','000170'],['仮払金','000180'],
];

async function boot(){msalApp=new msal.PublicClientApplication(MSAL_CONFIG);await msalApp.initialize();await msalApp.handleRedirectPromise();const a=msalApp.getAllAccounts();if(a.length){acct=a[0];msalApp.setActiveAccount(acct);await showApp();}}
async function signIn(){try{const r=await msalApp.loginPopup({scopes:SCOPES});acct=r.account;msalApp.setActiveAccount(acct);await showApp();}catch(e){if(e.errorCode!=='user_cancelled')snack('サインインエラー: '+e.message,true);}}
function signOut(){msalApp.logoutPopup({account:acct});}
async function token(){try{const r=await msalApp.acquireTokenSilent({scopes:SCOPES,account:acct});return r.accessToken;}catch{const r=await msalApp.acquireTokenPopup({scopes:SCOPES});acct=r.account;return r.accessToken;}}
async function gget(p){const t=await token();const r=await fetch(GRAPH+p,{headers:{Authorization:'Bearer '+t}});if(!r.ok)throw new Error('['+r.status+'] '+p);return r.json();}
async function gpatch(p,body){const t=await token();const r=await fetch(GRAPH+p,{method:'PATCH',headers:{Authorization:'Bearer '+t,'Content-Type':'application/json'},body:JSON.stringify(body)});if(!r.ok)throw new Error('['+r.status+'] '+await r.text());return r.json();}
async function gpost(p,body){const t=await token();const r=await fetch(GRAPH+p,{method:'POST',headers:{Authorization:'Bearer '+t,'Content-Type':'application/json'},body:JSON.stringify(body)});if(!r.ok)throw new Error('['+r.status+'] '+await r.text());return r.json();}

async function ensureMaps(){
  if(H.id&&L.id)return;
  const ls=await gget(`/sites/${SITE}/lists?$select=id,displayName`);
  const lh=ls.value.find(x=>x.displayName===LIST_H),ll=ls.value.find(x=>x.displayName===LIST_L);
  if(!lh)throw new Error('AP_Invoice が見つかりません');if(!ll)throw new Error('AP_PaymentSlip が見つかりません');
  H.id=lh.id;L.id=ll.id;
  const ch=await gget(`/sites/${SITE}/lists/${H.id}/columns?$select=name,displayName`);ch.value.forEach(x=>H.fmap[x.displayName]=x.name);
  const cl=await gget(`/sites/${SITE}/lists/${L.id}/columns?$select=name,displayName`);cl.value.forEach(x=>L.fmap[x.displayName]=x.name);
}
const hv=(f,d)=>{const k=H.fmap[d];return k?(f[k]??''):'';};
const lv=(f,d)=>{const k=L.fmap[d];return k?(f[k]??''):'';};
const hi=d=>H.fmap[d]||d, li=d=>L.fmap[d]||d;
function esc(s){return String(s==null?'':s).replace(/"/g,'&quot;');}
function yen(n){return '¥'+(parseFloat(n)||0).toLocaleString();}
function deptName(c){const d=DEPTS.find(x=>x[0]===c);return d?d[1]:(c||'');}
function debitYmd(f){const v=hv(f,'引落予定日');return v?String(v).slice(0,10):'';}

async function showApp(){
  document.getElementById('login-view').style.display='none';document.getElementById('app-view').style.display='block';
  document.getElementById('user-name').textContent=acct.name||acct.username;
  initMonth();
  const q=new URLSearchParams(location.search);const qm=q.get('month'),qi=q.get('inv');
  if(qm){const sel=document.getElementById('month-select');if(![...sel.options].some(o=>o.value===qm)){const o=document.createElement('option');o.value=qm;o.textContent=qm;sel.insertBefore(o,sel.firstChild);}sel.value=qm;}
  if(qi){selected=qi;mode='all';['review','due','all'].forEach(x=>document.getElementById('mode-'+x).classList.toggle('on',x==='all'));}
  await ensureMaps();await loadData();
}
function initMonth(){const s=document.getElementById('month-select');const n=new Date();for(let i=0;i<6;i++){const d=new Date(n.getFullYear(),n.getMonth()-i,1);const v=d.getFullYear()+'/'+String(d.getMonth()+1).padStart(2,'0');const o=document.createElement('option');o.value=v;o.textContent=v;if(i===0)o.selected=true;s.appendChild(o);}var qm=new URLSearchParams(location.search).get('month');if(qm){if(!Array.prototype.some.call(s.options,function(o){return o.value===qm;})){var oo=document.createElement('option');oo.value=qm;oo.textContent=qm;s.insertBefore(oo,s.firstChild);}s.value=qm;}}
function month(){return document.getElementById('month-select').value;}
function setMode(m){mode=m;['review','all','month','arch'].forEach(x=>document.getElementById('mode-'+x).classList.toggle('on',x===m));renderList();}
function setDue(d){dueFilter=d;renderList();}

async function loadData(){
  const msg=document.getElementById('status-msg');msg.textContent='読み込み中...';
  try{
    await ensureMaps();
    let hs=[],n=`/sites/${SITE}/lists/${H.id}/items?$expand=fields&$top=500`;
    while(n){const d=await gget(n);hs=hs.concat(d.value||[]);n=d['@odata.nextLink']?d['@odata.nextLink'].replace(GRAPH,''):null;}
    // 全期間の経費（仕分け済）を保持。月フィルタは「月ごと」モードと締日チップ側で行う。
    H.inv=hs.filter(it=>{const c=hv(it.fields,'支払区分');return hv(it.fields,'仕分け済')===true && (c==='本社経費'||c==='工場経費');}).map(it=>({id:it.id,f:it.fields}));
    let lsx=[],n2=`/sites/${SITE}/lists/${L.id}/items?$expand=fields&$top=2000`;
    while(n2){const d=await gget(n2);lsx=lsx.concat(d.value||[]);n2=d['@odata.nextLink']?d['@odata.nextLink'].replace(GRAPH,''):null;}
    L.byInv={};
    lsx.forEach(it=>{const k=String(lv(it.fields,'請求書ID')||'');if(!k)return;(L.byInv[k]=L.byInv[k]||[]).push({id:it.id,f:it.fields});});
    Object.values(L.byInv).forEach(arr=>arr.sort((a,b)=>(parseFloat(lv(a.f,'明細行番号'))||0)-(parseFloat(lv(b.f,'明細行番号'))||0)));
    renderList();
    msg.textContent=`${H.inv.length}請求書`;
    if(selected){renderDetail(H.inv.find(x=>x.id===selected)||null);}
  }catch(e){msg.textContent='エラー';snack('取得エラー: '+e.message,true);}
}

function invMeta(inv){
  const f=inv.f, lines=L.byInv[String(inv.id)]||[];
  const total=lines.length?lines.reduce((s,l)=>s+(parseFloat(lv(l.f,'金額_税込'))||0),0):(parseFloat(hv(f,'金額_税込'))||0);
  return {payee:hv(f,'支払先名'),paydate:hv(f,'支払日区分'),method:hv(f,'支払手段'),cat:hv(f,'支払区分'),
    status:hv(f,'支払ステータス')||'確認待',review:hv(f,'要確認フラグ')===true,reason:hv(f,'要確認理由'),
    offset:hv(f,'相殺対象フラグ')===true,acctchg:hv(f,'口座変更フラグ')===true,dup:hv(f,'二重請求フラグ')===true,
    doc:hv(f,'DOCコード'),archived:hv(f,'アーカイブフラグ')===true,total,nlines:lines.length};
}
function badge(m){if(m.status==='確定済（ロック）')return '<span class="badge b-locked">確定</span>';if(m.review)return '<span class="badge b-review">要確認</span>';if(m.status==='差戻し')return '<span class="badge b-flag">差戻し</span>';return '<span class="badge b-wait">確認待</span>';}
function cardHtml(inv){const m=invMeta(inv);const fl=[m.offset?'相殺':'',m.acctchg?'口座変更':'',m.dup?'二重':''].filter(Boolean).map(x=>`<span class="badge b-flag">${x}</span>`).join('');
  return `<div class="inv-card ${inv.id===selected?'active':''}" onclick="select('${inv.id}')"><div class="pname">${m.payee||'(不明)'} ${badge(m)}${fl}</div><div class="meta"><span>${m.paydate||'-'}・${m.cat||''}・${m.nlines}明細</span><span class="amt">${yen(m.total)}</span></div></div>`;}
function baseArr(){ // モード別の基礎集合（締日フィルタ前）
  let arr=H.inv.slice();
  if(mode==='arch') return arr.filter(x=>invMeta(x).archived);

  return arr;
}

    let html=`<div class="list-filter">${label} ${arr.length}件</div>`;const seen={};let cur=null;
    arr.forEach(x=>{const ym=hv(x.f,'対象年月')||'(月なし)';if(ym!==cur){cur=ym;const g=arr.filter(y=>(hv(y.f,'対象年月')||'(月なし)')===ym);const sum=g.reduce((s,y)=>s+invMeta(y).total,0);html+=`<div class="grp-h">${ym}　${g.length}件　${yen(sum)}</div>`;}html+=cardHtml(x);});

async function resolvePdf(doc){
  if(!doc)return null;
  const name=doc.split('?')[0].split('/').pop();
  try{const d=await gget(`/sites/${SITE}/drive/root:/BILLS/processed/${encodeURIComponent(name)}?$select=id,webUrl`);
    const t=await token();const r=await fetch(`${GRAPH}/sites/${SITE}/drive/items/${d.id}/content`,{headers:{Authorization:'Bearer '+t}});
    if(r.ok){const b=await r.blob();return {web:d.webUrl,embed:URL.createObjectURL(b)};}return {web:d.webUrl,embed:null};
  }catch(e){return {web:(/^https?:\/\//.test(doc)?doc:null),embed:null};}
}

function histHtml(inv){
  const payee=hv(inv.f,'支払先名');const thisYm=hv(inv.f,'対象年月')||'';
  if(!payee)return '';
  const byYm={};H.inv.forEach(x=>{if(hv(x.f,'支払先名')!==payee)return;const ym=hv(x.f,'対象年月')||'';byYm[ym]=(byYm[ym]||0)+invMeta(x).total;});
  const yms=Object.keys(byYm).sort((a,b)=>b.localeCompare(a));
  if(yms.length<=1)return '';
  let idx=yms.indexOf(thisYm);if(idx<0)idx=0;
  const seq=yms.slice(idx,idx+3);const lbl=['今回','前月','前々月'];
  let warn='';
  if(seq.length>=2){const d=byYm[seq[0]]-byYm[seq[1]];const pct=byYm[seq[1]]?d/byYm[seq[1]]*100:0;if(Math.abs(pct)>=10)warn=`<div style="color:#c0392b;font-size:12px;margin-top:4px">⚠ 前月比 ${pct>0?'+':''}${pct.toFixed(0)}%（${d>0?'+':''}${yen(d)}）— 請求書をご確認ください</div>`;}
  const rows=seq.map((ym,i)=>{let diff='';if(i===0&&seq[1]!=null){const d=byYm[ym]-byYm[seq[1]];diff=` <span style="color:${d>0?'#c0392b':'#2e7d32'};font-size:12px">(${d>0?'+':''}${yen(d)})</span>`;}return `<div style="display:flex;justify-content:space-between;padding:2px 0;font-size:13px"><span>${lbl[i]||''} ${ym}</span><span><b>${yen(byYm[ym])}</b>${diff}</span></div>`;}).join('');

async function persist(inv){
  const grid=document.getElementById('detail-lines');
  let sumExcl=0,sumTax=0,sumIncl=0;
  if(grid){ // 編集モード：明細を保存
    const trs=[...grid.querySelectorAll('tr')];let n=0;
    for(const tr of trs){const lf=lineFields(tr);n++;sumExcl+=lf[li('金額_税抜')];sumTax+=lf[li('消費税')];sumIncl+=lf[li('金額_税込')];
      if(tr.dataset.id==='NEW'){lf[li('請求書ID')]=String(inv.id);lf[li('明細行番号')]=n;await gpost(`/sites/${SITE}/lists/${L.id}/items`,{fields:lf});}
      else{await gpatch(`/sites/${SITE}/lists/${L.id}/items/${tr.dataset.id}/fields`,lf);}}
  }else{ // プレビュー：明細は触らず合計だけ算出
    const lines=L.byInv[String(inv.id)]||[];
    lines.forEach(it=>{sumExcl+=parseFloat(lv(it.f,'金額_税抜'))||0;sumTax+=parseFloat(lv(it.f,'消費税'))||0;sumIncl+=parseFloat(lv(it.f,'金額_税込'))||0;});
  }
  const hf=collectHeader();hf[hi('金額_税抜')]=sumExcl;hf[hi('消費税')]=sumTax;hf[hi('金額_税込')]=sumIncl;
  await gpatch(`/sites/${SITE}/lists/${H.id}/items/${inv.id}/fields`,hf);
}

  try{await gpatch(`/sites/${SITE}/lists/${H.id}/items/${inv.id}/fields`,{[hi('支払ステータス')]:'差戻し',[hi('差戻し理由')]:r});snack('↩ 差戻しました');await loadData();}catch(e){snack('差戻しエラー: '+e.message,true);}}
async function unlock(){const inv=H.inv.find(x=>x.id===selected);if(!inv)return;if(!confirm('確定（ロック）を解除して確認待に戻します。よろしいですか？'))return;
  try{await gpatch(`/sites/${SITE}/lists/${H.id}/items/${inv.id}/fields`,{[hi('支払ステータス')]:'確認待'});snack('🔓 ロック解除しました');await loadData();}catch(e){snack('解除エラー: '+e.message,true);}}
async function untriage(){const inv=H.inv.find(x=>x.id===selected);if(!inv)return;if(!confirm('仕分けに戻します（ダッシュボードの仕分けリストに表示され、経費/仕入を選び直せます）。よろしいですか？'))return;
  try{await gpatch(`/sites/${SITE}/lists/${H.id}/items/${inv.id}/fields`,{[hi('仕分け済')]:false,[hi('アーカイブフラグ')]:false});snack('↩ 仕分けに戻しました');await loadData();}catch(e){snack('エラー: '+e.message,true);}}
async function archive(){const inv=H.inv.find(x=>x.id===selected);if(!inv)return;const r=prompt('アーカイブ理由（重複/今月対象外/誤依頼 等）');if(r===null)return;
  try{await gpatch(`/sites/${SITE}/lists/${H.id}/items/${inv.id}/fields`,{[hi('アーカイブフラグ')]:true,[hi('アーカイブ理由')]:r});snack('🗄 アーカイブしました');await loadData();}catch(e){snack('アーカイブエラー: '+e.message,true);}}
async function unarchive(){const inv=H.inv.find(x=>x.id===selected);if(!inv)return;
  try{await gpatch(`/sites/${SITE}/lists/${H.id}/items/${inv.id}/fields`,{[hi('アーカイブフラグ')]:false});snack('📤 アーカイブ解除しました');await loadData();}catch(e){snack('解除エラー: '+e.message,true);}}
function snack(m,e=false){const el=document.getElementById('snackbar');el.textContent=m;el.style.background=e?'#c0392b':'#323232';el.style.display='block';setTimeout(()=>el.style.display='none',4000);}

boot().catch(e=>{console.error(e);snack('認証エラー: '+e.message,true);});
</script>

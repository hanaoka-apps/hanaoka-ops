<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>支払確認・承認 | 花岡車輌</title>
<script src="https://cdn.jsdelivr.net/npm/@azure/msal-browser@3.10.0/lib/msal-browser.min.js" crossorigin="anonymous"></script>
<style>
  :root{--primary:#1a5fa8;--primary-dk:#134680;--accent:#e8412e;--success:#2e7d52;--warning:#c07a00;--danger:#c0392b;--bg:#f4f6f9;--card:#fff;--border:#dde2ec;--text:#1e2533;--muted:#6b7a99;--shadow:0 1px 4px rgba(0,0,0,.08);}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'Meiryo','Hiragino Sans',sans-serif;background:var(--bg);color:var(--text);}
  header{background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 24px;height:52px;position:sticky;top:0;z-index:100;box-shadow:0 2px 8px rgba(0,0,0,.2);}
  header .logo{font-size:16px;font-weight:700;}header .logo span{opacity:.7;font-weight:400;font-size:13px;margin-left:10px;}
  header .user-info{display:flex;align-items:center;gap:12px;font-size:13px;}
  header button{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.3);color:#fff;padding:5px 14px;border-radius:4px;cursor:pointer;font-size:12px;}
  #login-view{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:calc(100vh - 52px);gap:20px;}
  #login-btn{background:var(--primary);color:#fff;border:none;padding:12px 36px;border-radius:6px;font-size:15px;font-weight:700;cursor:pointer;display:flex;gap:8px;align-items:center;}
  #app-view{display:none;}
  .topbar{display:flex;align-items:center;gap:12px;padding:10px 20px;background:var(--card);border-bottom:1px solid var(--border);flex-wrap:wrap;}
  .topbar label{font-size:13px;color:var(--muted);font-weight:600;}
  .topbar select{border:1px solid var(--border);border-radius:4px;padding:4px 10px;font-size:14px;}
  .seg{display:inline-flex;border:1px solid var(--border);border-radius:6px;overflow:hidden;}
  .seg button{background:#fff;border:none;padding:5px 14px;font-size:13px;cursor:pointer;color:var(--muted);}
  .seg button.on{background:var(--primary);color:#fff;font-weight:700;}
  .topbar .links{margin-left:auto;display:flex;gap:14px;}
  .topbar .links a{font-size:13px;color:var(--primary);text-decoration:none;}
  .main{display:grid;grid-template-columns:300px 1fr;height:calc(100vh - 52px - 50px);}
  @media(max-width:900px){.main{grid-template-columns:1fr;height:auto;}}
  .list-pane{border-right:1px solid var(--border);overflow-y:auto;background:#fbfcfe;}
  .list-filter{padding:9px 14px;border-bottom:1px solid var(--border);font-size:12px;color:var(--muted);}
  .grp-h{padding:6px 14px;background:#eef2f8;font-size:11px;font-weight:700;color:var(--primary-dk);position:sticky;top:0;}
  .inv-card{padding:11px 14px;border-bottom:1px solid var(--border);cursor:pointer;}
  .inv-card:hover{background:#eef3fb;}
  .inv-card.active{background:#e4edf9;border-left:3px solid var(--primary);}
  .inv-card .pname{font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .inv-card .meta{font-size:11px;color:var(--muted);margin-top:3px;display:flex;justify-content:space-between;}
  .inv-card .amt{font-weight:700;color:var(--text);}
  .badge{display:inline-block;padding:1px 7px;border-radius:10px;font-size:10px;font-weight:700;margin-left:4px;}
  .b-review{background:#fdecea;color:var(--danger);}
  .b-locked{background:#cfe9dd;color:#14532d;}
  .b-wait{background:#fff3cd;color:#664d00;}
  .b-flag{background:#fde2cf;color:#9a4a00;}
  .detail-pane{overflow-y:auto;padding:14px 18px;}
  .empty{color:var(--muted);text-align:center;padding:60px;font-size:14px;}
  .hgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(135px,1fr));gap:6px 12px;margin-bottom:8px;}
  .hgrid .fld{display:flex;flex-direction:column;gap:2px;}
  .hgrid label{font-size:11px;color:var(--muted);font-weight:600;}
  .hgrid input,.hgrid select{border:1px solid var(--border);border-radius:4px;padding:4px 6px;font-size:13px;}
  .hgrid input:disabled,.hgrid select:disabled{background:#f3f5f9;color:#888;}
  .hgrid input[readonly]{background:#eef1f6;border-style:dashed;color:#444;font-weight:700;}
  .flags{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:2px 0 6px;}
  .review-bar{background:#fdecea;border:1px solid var(--danger);color:var(--danger);border-radius:6px;padding:8px 12px;font-size:13px;margin:6px 0;}
  /* 左=明細 / 右=PDF。PDFを広く(約55%)＋高く。明細は横スクロールで保護。 */
  .detail-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);gap:14px;align-items:start;}
  @media(max-width:1200px){.detail-grid{grid-template-columns:1fr;}}
  .lines-scroll{overflow-x:auto;border:1px solid var(--border);border-radius:8px;}
  table.lines{width:100%;border-collapse:collapse;font-size:12px;min-width:680px;}
  table.lines th{background:#f8f9fc;padding:7px 5px;text-align:left;color:var(--muted);font-weight:600;font-size:11px;border-bottom:1px solid var(--border);white-space:nowrap;}
  table.lines td{padding:4px 4px;border-bottom:1px solid #f0f3fa;vertical-align:middle;}
  table.lines tr.low td{background:#fffaf0;}
  table.lines input,table.lines select{width:100%;border:1px solid var(--border);border-radius:4px;padding:4px 4px;font-size:12px;}
  table.lines input.num{text-align:right;}
  table.lines input[readonly]{background:#eef1f6;border:none;color:#333;font-weight:700;}
  .conf{font-weight:700;padding:1px 6px;border-radius:8px;font-size:11px;}
  .conf-hi{background:#d4edda;color:var(--success);}.conf-lo{background:#fdecea;color:var(--danger);}.conf-mid{background:#fff3cd;color:#664d00;}
  .totals{margin-top:8px;font-size:13px;text-align:right;}
  .totals b{font-size:16px;}
  .pdf-pane h3{font-size:13px;color:var(--primary);margin-bottom:6px;}
  .pdf-frame{width:100%;height:80vh;min-height:520px;border:1px solid var(--border);border-radius:8px;background:#fafbfd;}
  .pdf-link{display:inline-block;margin-bottom:6px;font-size:13px;color:var(--primary);}
  .actions{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap;}
  .btn-primary{background:var(--primary);color:#fff;border:none;padding:9px 22px;border-radius:6px;font-size:13px;font-weight:700;cursor:pointer;}
  .btn-approve{background:var(--success);color:#fff;border:none;padding:9px 22px;border-radius:6px;font-size:13px;font-weight:700;cursor:pointer;}
  .btn-reject{background:#fff;color:var(--danger);border:1px solid var(--danger);padding:9px 18px;border-radius:6px;font-size:13px;font-weight:700;cursor:pointer;}
  .btn-add{background:#fff;color:var(--primary);border:1px solid var(--primary);padding:5px 12px;border-radius:5px;font-size:12px;cursor:pointer;margin-top:6px;}
  .btn-primary:disabled,.btn-approve:disabled{opacity:.5;cursor:default;}
  #snackbar{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#323232;color:#fff;padding:10px 20px;border-radius:6px;font-size:13px;display:none;z-index:999;}
</style>
</head>
<body>
<header>
  <div class="logo">花岡車輌<span>支払確認・承認</span></div>
  <div class="user-info"><span id="user-name"></span><button onclick="signOut()">サインアウト</button></div>
</header>

<div id="login-view">
  <h2 style="color:#1a5fa8">支払確認・承認</h2>
  <p style="color:#6b7a99">花岡車輌の Microsoft アカウントでサインインしてください</p>
  <button id="login-btn" onclick="signIn()">
    <svg width="18" height="18" viewBox="0 0 21 21"><path d="M10 0H0v10h10V0z" fill="#F25022"/><path d="M21 0H11v10h10V0z" fill="#7FBA00"/><path d="M10 11H0v10h10V11z" fill="#00A4EF"/><path d="M21 11H11v10h10V11z" fill="#FFB900"/></svg>
    サインイン
  </button>
</div>

<div id="app-view">
  <div class="topbar">
    <label>対象年月</label>
    <select id="month-select" onchange="loadData()"></select>
    <div class="seg">
      <button id="mode-review" class="on" onclick="setMode('review')">未確認</button>
      <button id="mode-due" onclick="setMode('due')">当月（締日別）</button>
      <button id="mode-all" onclick="setMode('all')">全件</button>
    </div>
    <span id="status-msg" style="font-size:12px;color:var(--muted)"></span>
    <div class="links"><a href="ap_dashboard.html">📊 ダッシュボード</a><a href="ap_entry.html">✏ 手入力</a></div>
  </div>
  <div class="main">
    <div class="list-pane" id="list-pane"></div>
    <div class="detail-pane" id="detail-pane"><div class="empty">左の請求書を選択してください</div></div>
  </div>
</div>
<div id="snackbar"></div>

<script>
const MSAL_CONFIG={auth:{clientId:'d338d61b-01dc-4c7c-ac6b-aecf7f30d716',authority:'https://login.microsoftonline.com/3933e8a0-c945-4e97-ae67-c82131087cad',redirectUri:window.location.origin+window.location.pathname},cache:{cacheLocation:'sessionStorage'}};
const SCOPES=['User.Read','Sites.ReadWrite.All','Files.Read.All'];
const GRAPH='https://graph.microsoft.com/v1.0';
const SITE='hanaokacorp.sharepoint.com,d80378dd-76a4-43f0-b939-1af66345d19d,8eaeb70b-2495-4029-affb-eabe80e021bb';
const LIST_H='AP_Invoice', LIST_L='AP_PaymentSlip';
let msalApp=null,acct=null,mode='review',selected=null;
let H={fmap:{},id:null,inv:[]};
let L={fmap:{},id:null,byInv:{}};
const DEPTS=[['001110','全社'],['002220','東京本社'],['002230','大阪'],['002240','名古屋'],['003110','工場全体'],['003210','第一工場'],['003220','第二工場'],['003230','第三工場'],['003310','技術部'],['003410','品質管理部'],['003510','工場総務'],['004110','本社総務部'],['005110','本社']];
const PAYMETHODS=['でんさい','総合振込','口座振替','海外送金','現金'];
const PAYCATS=['本社経費','本社仕入','工場経費','工場仕入','口座振替'];
const PAYDATES=['10日','20日','月末'];
// 勘定科目マスタ（ドロップダウン用。本社経費＋工場経費＋特殊）。一覧に無いAI出力値は行ごとに保持。
const ACCOUNTS=[
  ['給料手当','000641'],['旅費交通費','000648'],['通信費','000650'],['荷造運賃','000652'],['交際費','000656'],['修繕費','000657'],['水道光熱費','000658'],['消耗品費','000659'],['消耗事務費','000660'],['リース料','000661'],['車輛消耗油脂費','000662'],['賃借料','000663'],['租税公課','000664'],['保険料','000665'],['業務委託手数料','000667'],['支払手数料','000668'],['顧問料','000670'],['諸会費','000671'],['新聞図書費','000672'],['研修費','000673'],['会議費','000675'],['減価償却費','000689'],['雑費','000690'],
  ['外注加工費','000507'],['給料手当（工場）','000510'],['旅費交通費（工場）','000519'],['通信費（工場）','000520'],['運搬費','000521'],['交際費（工場）','000522'],['修繕費（工場）','000523'],['機械修繕費','000524'],['水道光熱費（工場）','000525'],['消耗品費（工場）','000526'],['消耗工具備品費','000527'],['消耗油脂費','000528'],['車輛消耗油脂費（工場）','000529'],['リース料（工場）','000530'],['租税公課（工場）','000531'],['保険料（工場）','000532'],['支払手数料（工場）','000533'],['消耗事務費（工場）','000541'],['会議費（工場）','000542'],['減価償却費（工場）','000544'],['雑費（工場）','000545'],
  ['リース債務','000941'],['支払手形（でんさい）','000300'],['買掛金','000310'],['前払費用','000170'],['仮払金','000180'],
];

async function boot(){msalApp=new msal.PublicClientApplication(MSAL_CONFIG);await msalApp.initialize();await msalApp.handleRedirectPromise();const a=msalApp.getAllAccounts();if(a.length){acct=a[0];msalApp.setActiveAccount(acct);await showApp();}}
async function signIn(){try{const r=await msalApp.loginPopup({scopes:SCOPES});acct=r.account;msalApp.setActiveAccount(acct);await showApp();}catch(e){if(e.errorCode!=='user_cancelled')snack('サインインエラー: '+e.message,true);}}
function signOut(){msalApp.logoutPopup({account:acct});}
async function token(){try{const r=await msalApp.acquireTokenSilent({scopes:SCOPES,account:acct});return r.accessToken;}catch{const r=await msalApp.acquireTokenPopup({scopes:SCOPES});acct=r.account;return r.accessToken;}}
async function gget(p){const t=await token();const r=await fetch(GRAPH+p,{headers:{Authorization:'Bearer '+t}});if(!r.ok)throw new Error('['+r.status+'] '+p);return r.json();}
async function gpatch(p,body){const t=await token();const r=await fetch(GRAPH+p,{method:'PATCH',headers:{Authorization:'Bearer '+t,'Content-Type':'application/json'},body:JSON.stringify(body)});if(!r.ok)throw new Error('['+r.status+'] '+await r.text());return r.json();}

async function ensureMaps(){
  if(H.id&&L.id)return;
  const ls=await gget(`/sites/${SITE}/lists?$select=id,displayName`);
  const lh=ls.value.find(x=>x.displayName===LIST_H),ll=ls.value.find(x=>x.displayName===LIST_L);
  if(!lh)throw new Error('AP_Invoice が見つかりません');if(!ll)throw new Error('AP_PaymentSlip が見つかりません');
  H.id=lh.id;L.id=ll.id;
  const ch=await gget(`/sites/${SITE}/lists/${H.id}/columns?$select=name,displayName`);ch.value.forEach(x=>H.fmap[x.displayName]=x.name);
  const cl=await gget(`/sites/${SITE}/lists/${L.id}/columns?$select=name,displayName`);cl.value.forEach(x=>L.fmap[x.displayName]=x.name);
}
const hv=(f,d)=>{const k=H.fmap[d];return k?(f[k]??''):'';};
const lv=(f,d)=>{const k=L.fmap[d];return k?(f[k]??''):'';};
const hi=d=>H.fmap[d]||d, li=d=>L.fmap[d]||d;

async function showApp(){
  document.getElementById('login-view').style.display='none';document.getElementById('app-view').style.display='block';
  document.getElementById('user-name').textContent=acct.name||acct.username;
  initMonth();
  // ダッシュボード等からのリンク（?inv=ID&month=YYYY/MM）でその請求書を開く
  const q=new URLSearchParams(location.search);const qm=q.get('month'),qi=q.get('inv');
  if(qm){const sel=document.getElementById('month-select');if(![...sel.options].some(o=>o.value===qm)){const o=document.createElement('option');o.value=qm;o.textContent=qm;sel.insertBefore(o,sel.firstChild);}sel.value=qm;}
  if(qi){selected=qi;mode='all';['review','due','all'].forEach(x=>document.getElementById('mode-'+x).classList.toggle('on',x==='all'));}
  await ensureMaps();await loadData();
}
function initMonth(){const s=document.getElementById('month-select');const n=new Date();for(let i=0;i<6;i++){const d=new Date(n.getFullYear(),n.getMonth()-i,1);const v=d.getFullYear()+'/'+String(d.getMonth()+1).padStart(2,'0');const o=document.createElement('option');o.value=v;o.textContent=v;if(i===0)o.selected=true;s.appendChild(o);}}
function month(){return document.getElementById('month-select').value;}
function setMode(m){mode=m;['review','due','all'].forEach(x=>document.getElementById('mode-'+x).classList.toggle('on',x===m));renderList();}

async function loadData(){
  const msg=document.getElementById('status-msg');msg.textContent='読み込み中...';
  try{
    await ensureMaps();
    let hs=[],n=`/sites/${SITE}/lists/${H.id}/items?$expand=fields&$top=500`;
    while(n){const d=await gget(n);hs=hs.concat(d.value||[]);n=d['@odata.nextLink']?d['@odata.nextLink'].replace(GRAPH,''):null;}
    const m=month();
    H.inv=hs.filter(it=>hv(it.fields,'対象年月')===m).map(it=>({id:it.id,f:it.fields}));
    let lsx=[],n2=`/sites/${SITE}/lists/${L.id}/items?$expand=fields&$top=2000`;
    while(n2){const d=await gget(n2);lsx=lsx.concat(d.value||[]);n2=d['@odata.nextLink']?d['@odata.nextLink'].replace(GRAPH,''):null;}
    L.byInv={};
    lsx.forEach(it=>{const k=String(lv(it.fields,'請求書ID')||'');if(!k)return;(L.byInv[k]=L.byInv[k]||[]).push({id:it.id,f:it.fields});});
    Object.values(L.byInv).forEach(arr=>arr.sort((a,b)=>(parseFloat(lv(a.f,'明細行番号'))||0)-(parseFloat(lv(b.f,'明細行番号'))||0)));
    renderList();
    msg.textContent=`${H.inv.length}請求書`;
    if(selected){renderDetail(H.inv.find(x=>x.id===selected)||null);}
  }catch(e){msg.textContent='エラー';snack('取得エラー: '+e.message,true);}
}

function invMeta(inv){
  const f=inv.f, lines=L.byInv[String(inv.id)]||[];
  const total=lines.length?lines.reduce((s,l)=>s+(parseFloat(lv(l.f,'金額_税込'))||0),0):(parseFloat(hv(f,'金額_税込'))||0);
  return {
    payee:hv(f,'支払先名'),paydate:hv(f,'支払日区分'),method:hv(f,'支払手段'),cat:hv(f,'支払区分'),
    status:hv(f,'支払ステータス')||'確認待',review:hv(f,'要確認フラグ')===true,reason:hv(f,'要確認理由'),
    offset:hv(f,'相殺対象フラグ')===true,acctchg:hv(f,'口座変更フラグ')===true,dup:hv(f,'二重請求フラグ')===true,
    doc:hv(f,'DOCコード'),total,nlines:lines.length
  };
}
function badge(meta){
  if(meta.status==='確定済（ロック）')return '<span class="badge b-locked">確定</span>';
  if(meta.review)return '<span class="badge b-review">要確認</span>';
  if(meta.status==='差戻し')return '<span class="badge b-flag">差戻し</span>';
  return '<span class="badge b-wait">確認待</span>';
}
function cardHtml(inv){
  const m=invMeta(inv);const flags=[m.offset?'相殺':'',m.acctchg?'口座変更':'',m.dup?'二重':''].filter(Boolean).map(x=>`<span class="badge b-flag">${x}</span>`).join('');
  return `<div class="inv-card ${inv.id===selected?'active':''}" onclick="select('${inv.id}')">
    <div class="pname">${m.payee||'(不明)'} ${badge(m)}${flags}</div>
    <div class="meta"><span>${m.paydate||'-'}・${m.cat||''}・${m.nlines}明細</span><span class="amt">¥${m.total.toLocaleString()}</span></div></div>`;
}
function renderList(){
  const pane=document.getElementById('list-pane');
  let arr=H.inv.slice();
  if(mode==='review'){
    arr=arr.filter(x=>{const m=invMeta(x);return m.status!=='確定済（ロック）'&&m.status!=='支払済'&&(m.review||m.status==='確認待'||m.status==='差戻し');});
    arr.sort((a,b)=>{const ma=invMeta(a),mb=invMeta(b);return (mb.review-ma.review)||(mb.total-ma.total);});
    pane.innerHTML=`<div class="list-filter">未確認 ${arr.length}件</div>`+(arr.length?arr.map(cardHtml).join(''):'<div class="empty" style="padding:30px">未確認なし 🎉</div>');
  }else if(mode==='due'){
    pane.innerHTML=`<div class="list-filter">${month()} 締日別</div>`;
    PAYDATES.forEach(pd=>{
      const g=arr.filter(x=>invMeta(x).paydate===pd);if(!g.length)return;
      const sum=g.reduce((s,x)=>s+invMeta(x).total,0);
      pane.innerHTML+=`<div class="grp-h">${pd}　${g.length}件　¥${sum.toLocaleString()}</div>`+g.map(cardHtml).join('');
    });
    const none=arr.filter(x=>!PAYDATES.includes(invMeta(x).paydate));
    if(none.length)pane.innerHTML+=`<div class="grp-h">未設定　${none.length}件</div>`+none.map(cardHtml).join('');
  }else{
    pane.innerHTML=`<div class="list-filter">全件 ${arr.length}件</div>`+arr.map(cardHtml).join('');
  }
}
function select(id){selected=id;renderList();renderDetail(H.inv.find(x=>x.id===id));}

function confClass(v){v=parseFloat(v)||0;return v>=85?'conf-hi':v>=70?'conf-mid':'conf-lo';}
function esc(s){return String(s==null?'':s).replace(/"/g,'&quot;');}
function acctOpts(curName,curCode){
  let opts=ACCOUNTS.slice();
  if(curName && !opts.some(a=>a[0]===curName)) opts=[[curName,curCode||'']].concat(opts);
  return opts.map(a=>`<option value="${esc(a[0])}|${esc(a[1])}" ${a[0]===curName?'selected':''}>${a[0]}</option>`).join('');
}
function onAcct(sel){const c=sel.value.split('|')[1];const code=sel.closest('tr').querySelector('.e-acctcode');if(code&&c)code.value=c;}
function recalc(tr){const ex=parseFloat(tr.querySelector('.e-excl').value)||0;const tx=parseFloat(tr.querySelector('.e-tax').value)||0;tr.querySelector('.e-incl').value=ex+tx;updTotals();}
function updTotals(){
  const trs=[...document.querySelectorAll('#detail-lines tr')];let s=0;
  trs.forEach(tr=>{const ie=tr.querySelector('.e-incl');if(ie)s+=parseFloat(ie.value)||0;});
  const lt=document.getElementById('lines-total');if(lt)lt.textContent='¥'+s.toLocaleString();
  const hd=document.getElementById('hdr-incl');if(hd)hd.value=s; // 合計税込＝明細合計（自動）
}

async function resolvePdf(doc){
  if(!doc)return null;
  const name=doc.split('?')[0].split('/').pop();
  try{
    const d=await gget(`/sites/${SITE}/drive/root:/BILLS/processed/${encodeURIComponent(name)}?$select=id,webUrl`);
    const t=await token();
    const r=await fetch(`${GRAPH}/sites/${SITE}/drive/items/${d.id}/content`,{headers:{Authorization:'Bearer '+t}});
    if(r.ok){const b=await r.blob();return {web:d.webUrl,embed:URL.createObjectURL(b)};}
    return {web:d.webUrl,embed:null};
  }catch(e){return {web:(/^https?:\/\//.test(doc)?doc:null),embed:null};}
}

function renderDetail(inv){
  const d=document.getElementById('detail-pane');
  if(!inv){d.innerHTML='<div class="empty">左の請求書を選択してください</div>';return;}
  const f=inv.f,m=invMeta(inv),lines=L.byInv[String(inv.id)]||[],locked=m.status==='確定済（ロック）';
  const dis=locked?'disabled':'';
  const opt=(arr,sel)=>'<option value=""></option>'+arr.map(x=>`<option ${x===sel?'selected':''}>${x}</option>`).join('');
  const deptOpt=(sel)=>'<option value="">―</option>'+DEPTS.map(x=>`<option value="${x[0]}" ${x[0]===sel?'selected':''}>${x[1]}</option>`).join('');
  const locOpt=(s)=>['本社','工場'].map(x=>`<option ${x===s?'selected':''}>${x}</option>`).join('');
  const taxmOpt=(s)=>['税抜','税込'].map(x=>`<option ${x===s?'selected':''}>${x}</option>`).join('');
  const rateOpt=(s)=>['課税10%','軽減8%','非課税','対象外'].map(x=>`<option ${x===s?'selected':''}>${x}</option>`).join('');
  const rows=lines.map(it=>{const lf=it.f;const conf=parseFloat(lv(lf,'AI信頼スコア'))||0;
    return `<tr data-id="${it.id}" class="${conf&&conf<70?'low':''}">
      <td style="width:54px"><select class="e-loc" ${dis}>${locOpt(lv(lf,'拠点'))}</select></td>
      <td style="width:120px"><select class="e-acct" onchange="onAcct(this)" ${dis}>${acctOpts(lv(lf,'勘定科目名'),lv(lf,'勘定科目コード'))}</select></td>
      <td style="width:58px"><input class="e-acctcode" value="${esc(lv(lf,'勘定科目コード'))}" ${dis}></td>
      <td style="width:96px"><select class="e-dept" ${dis}>${deptOpt(lv(lf,'部門コード'))}</select></td>
      <td style="width:56px"><select class="e-taxm" ${dis}>${taxmOpt(lv(lf,'税区分'))}</select></td>
      <td style="width:74px"><select class="e-rate" ${dis}>${rateOpt(lv(lf,'税率区分'))}</select></td>
      <td style="width:76px"><input class="num e-excl" type="number" value="${lv(lf,'金額_税抜')||0}" oninput="recalc(this.closest('tr'))" ${dis}></td>
      <td style="width:66px"><input class="num e-tax" type="number" value="${lv(lf,'消費税')||0}" oninput="recalc(this.closest('tr'))" ${dis}></td>
      <td style="width:80px"><input class="num e-incl" type="number" value="${lv(lf,'金額_税込')||0}" readonly title="税抜＋消費税の自動計算"></td>
      <td style="min-width:130px"><input class="e-note" value="${esc(lv(lf,'摘要'))}" ${dis}></td>
      <td style="width:34px"><span class="conf ${confClass(conf)}">${conf||'-'}</span></td></tr>`;}).join('');
  d.innerHTML=`
    <div class="hgrid">
      <div class="fld"><label>支払先名</label><input id="h-payee" value="${esc(hv(f,'支払先名'))}" ${dis}></div>
      <div class="fld"><label>支払先コード</label><input id="h-pcode" value="${esc(hv(f,'支払先コード'))}" ${dis}></div>
      <div class="fld"><label>登録番号</label><input id="h-reg" value="${esc(hv(f,'登録番号'))}" ${dis}></div>
      <div class="fld"><label>対象年月(引落月)</label><input id="h-month" value="${esc(hv(f,'対象年月'))}" ${dis}></div>
      <div class="fld"><label>支払日区分</label><select id="h-paydate" ${dis}>${opt(PAYDATES,hv(f,'支払日区分'))}</select></div>
      <div class="fld"><label>支払手段</label><select id="h-method" ${dis}>${opt(PAYMETHODS,hv(f,'支払手段'))}</select></div>
      <div class="fld"><label>支払区分</label><select id="h-cat" ${dis}>${opt(PAYCATS,hv(f,'支払区分'))}</select></div>
      <div class="fld"><label>請求NO</label><input id="h-invno" value="${esc(hv(f,'請求NO'))}" ${dis}></div>
      <div class="fld"><label>合計税込(明細自動)</label><input id="hdr-incl" type="number" value="${hv(f,'金額_税込')||0}" readonly title="明細の税込合計（自動計算）"></div>
    </div>
    <div class="flags">
      <span style="font-size:12px;color:var(--muted)">AI確信度 <b>${hv(f,'AI確信度')||'-'}</b></span>
      ${m.offset?'<span class="badge b-flag">相殺対象</span>':''}${m.acctchg?'<span class="badge b-flag">口座変更</span>':''}${m.dup?'<span class="badge b-review">二重請求疑い</span>':''}
    </div>
    ${m.review?`<div class="review-bar">⚠ 要確認：${m.reason||'AIが確認を要すると判断'}</div>`:''}
    <div class="detail-grid">
      <div>
        <div class="lines-scroll"><table class="lines"><thead><tr><th>拠点</th><th>勘定科目</th><th>コード</th><th>部門</th><th>税区分</th><th>税率</th><th>税抜</th><th>消費税</th><th>税込</th><th>摘要</th><th>信頼</th></tr></thead>
        <tbody id="detail-lines">${rows||'<tr><td colspan="11" style="padding:14px;color:#888">明細なし</td></tr>'}</tbody></table></div>
        ${locked?'':'<button class="btn-add" onclick="addRow()">＋ 明細追加</button>'}
        <div class="totals">明細 ${lines.length} 件 ／ 合計(税込) <b id="lines-total">¥${m.total.toLocaleString()}</b></div>
        <div class="actions">
          <button class="btn-primary" onclick="saveAll()" ${dis}>💾 保存</button>
          <button class="btn-approve" onclick="approve()" ${dis}>✓ 承認（確定）</button>
          ${locked?'<button class="btn-reject" onclick="unlock()">🔓 ロック解除</button>':'<button class="btn-reject" onclick="reject()">↩ 差戻し</button>'}
        </div>
      </div>
      <div class="pdf-pane"><h3>請求書</h3><div id="pdf-host"><div class="empty">読込中...</div></div></div>
    </div>`;
  updTotals();
  const host=document.getElementById('pdf-host');
  resolvePdf(m.doc).then(p=>{if(!p){host.innerHTML='<div class="empty">証憑リンクなし（DOCコード未設定）</div>';return;}
    host.innerHTML=`<a class="pdf-link" href="${p.web}" target="_blank">📄 新しいタブで開く</a>`+(p.embed?`<iframe class="pdf-frame" src="${p.embed}"></iframe>`:'<div class="empty">プレビュー不可（リンクから開いてください）</div>');});
}

function addRow(){const tb=document.getElementById('detail-lines');if(tb.querySelector('td[colspan]'))tb.innerHTML='';
  const tr=document.createElement('tr');tr.dataset.id='NEW';
  const locOpt=['本社','工場'].map(x=>`<option>${x}</option>`).join('');
  const deptOpt='<option value="">―</option>'+DEPTS.map(x=>`<option value="${x[0]}">${x[1]}</option>`).join('');
  const taxmOpt=['税込','税抜'].map(x=>`<option>${x}</option>`).join('');
  const rateOpt=['課税10%','軽減8%','非課税','対象外'].map(x=>`<option>${x}</option>`).join('');
  tr.innerHTML=`<td><select class="e-loc">${locOpt}</select></td>
   <td><select class="e-acct" onchange="onAcct(this)"><option value="|"></option>${acctOpts('','')}</select></td>
   <td><input class="e-acctcode"></td>
   <td><select class="e-dept">${deptOpt}</select></td><td><select class="e-taxm">${taxmOpt}</select></td><td><select class="e-rate">${rateOpt}</select></td>
   <td><input class="num e-excl" type="number" value="0" oninput="recalc(this.closest('tr'))"></td><td><input class="num e-tax" type="number" value="0" oninput="recalc(this.closest('tr'))"></td>
   <td><input class="num e-incl" type="number" value="0" readonly></td><td><input class="e-note"></td><td><span class="conf conf-mid">新</span></td>`;
  tb.appendChild(tr);
}

function collectHeader(){return {
  [hi('支払先名')]:document.getElementById('h-payee').value,[hi('支払先コード')]:document.getElementById('h-pcode').value,
  [hi('登録番号')]:document.getElementById('h-reg').value,[hi('対象年月')]:document.getElementById('h-month').value,
  [hi('支払日区分')]:document.getElementById('h-paydate').value,[hi('支払手段')]:document.getElementById('h-method').value,
  [hi('支払区分')]:document.getElementById('h-cat').value,[hi('請求NO')]:document.getElementById('h-invno').value,
};}
function lineFields(tr){
  const acctSel=tr.querySelector('.e-acct'); const nm=acctSel?acctSel.value.split('|')[0]:'';
  return {
  [li('拠点')]:tr.querySelector('.e-loc').value,[li('勘定科目名')]:nm,
  [li('勘定科目コード')]:tr.querySelector('.e-acctcode').value,[li('部門コード')]:tr.querySelector('.e-dept').value,
  [li('税区分')]:tr.querySelector('.e-taxm').value,[li('税率区分')]:tr.querySelector('.e-rate').value,
  [li('金額_税抜')]:parseFloat(tr.querySelector('.e-excl').value)||0,[li('消費税')]:parseFloat(tr.querySelector('.e-tax').value)||0,
  [li('金額_税込')]:parseFloat(tr.querySelector('.e-incl').value)||0,[li('摘要')]:tr.querySelector('.e-note').value,
};}
async function persist(inv){
  const trs=[...document.querySelectorAll('#detail-lines tr')].filter(t=>t.dataset.id);
  let sumExcl=0,sumTax=0,sumIncl=0,n=0;
  for(const tr of trs){if(tr.querySelector('td[colspan]'))continue;const lf=lineFields(tr);
    sumExcl+=lf[li('金額_税抜')];sumTax+=lf[li('消費税')];sumIncl+=lf[li('金額_税込')];n++;
    if(tr.dataset.id==='NEW'){lf[li('請求書ID')]=String(inv.id);lf[li('明細行番号')]=n;
      await (async()=>{const t=await token();const r=await fetch(`${GRAPH}/sites/${SITE}/lists/${L.id}/items`,{method:'POST',headers:{Authorization:'Bearer '+t,'Content-Type':'application/json'},body:JSON.stringify({fields:lf})});if(!r.ok)throw new Error('明細作成 '+r.status+' '+await r.text());})();
    }else{await gpatch(`/sites/${SITE}/lists/${L.id}/items/${tr.dataset.id}/fields`,lf);}
  }
  const hf=collectHeader();hf[hi('金額_税抜')]=sumExcl;hf[hi('消費税')]=sumTax;hf[hi('金額_税込')]=sumIncl;
  await gpatch(`/sites/${SITE}/lists/${H.id}/items/${inv.id}/fields`,hf);
}
async function saveAll(){const inv=H.inv.find(x=>x.id===selected);if(!inv)return;try{await persist(inv);snack('✅ 保存しました');await loadData();}catch(e){snack('保存エラー: '+e.message,true);}}
async function approve(){const inv=H.inv.find(x=>x.id===selected);if(!inv)return;const m=invMeta(inv);
  if(!confirm(`「${m.payee}」を承認（確定・ロック）します。よろしいですか？`))return;
  try{await persist(inv);await gpatch(`/sites/${SITE}/lists/${H.id}/items/${inv.id}/fields`,{[hi('支払ステータス')]:'確定済（ロック）',[hi('要確認フラグ')]:false,[hi('入力者')]:(acct.name||acct.username)});snack('✓ 承認しました（確定）');await loadData();}catch(e){snack('承認エラー: '+e.message,true);}}
async function reject(){const inv=H.inv.find(x=>x.id===selected);if(!inv)return;const r=prompt('差戻し理由を入力してください');if(r===null)return;
  try{await gpatch(`/sites/${SITE}/lists/${H.id}/items/${inv.id}/fields`,{[hi('支払ステータス')]:'差戻し',[hi('差戻し理由')]:r});snack('↩ 差戻しました');await loadData();}catch(e){snack('差戻しエラー: '+e.message,true);}}
async function unlock(){const inv=H.inv.find(x=>x.id===selected);if(!inv)return;if(!confirm('確定（ロック）を解除して確認待に戻します。よろしいですか？'))return;
  try{await gpatch(`/sites/${SITE}/lists/${H.id}/items/${inv.id}/fields`,{[hi('支払ステータス')]:'確認待'});snack('🔓 ロック解除しました');await loadData();}catch(e){snack('解除エラー: '+e.message,true);}}
function snack(m,e=false){const el=document.getElementById('snackbar');el.textContent=m;el.style.background=e?'#c0392b':'#323232';el.style.display='block';setTimeout(()=>el.style.display='none',4000);}

boot().catch(e=>{console.error(e);snack('認証エラー: '+e.message,true);});
</script>

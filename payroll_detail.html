<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>支給控除一覧表（個人別）</title>
<script src="https://cdn.jsdelivr.net/npm/@azure/msal-browser@3.10.0/lib/msal-browser.min.js" crossorigin="anonymous"></script>
<script src="hanaoka_auth.js"></script>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f7f7f5; --panel: #ffffff; --border: #e3e2de; --text: #1f1e1c; --muted: #767468; --accent: #b8622f;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg:#1b1a18; --panel:#242320; --border:#3a3833; --text:#ece9e2; --muted:#a6a296; --accent:#e0925c; }
  }
  :root[data-theme="dark"] { --bg:#1b1a18; --panel:#242320; --border:#3a3833; --text:#ece9e2; --muted:#a6a296; --accent:#e0925c; }
  * { box-sizing: border-box; }
  html, body { height:100%; }
  body { margin:0; background:var(--bg); color:var(--text); font-family:-apple-system,"Hiragino Sans","Yu Gothic",sans-serif;
    display:flex; flex-direction:column; overflow:hidden; }
  /* ヘッダー類は常に画面上部に固定し、表本体（.scrollx）だけが縦横にスクロールする。
     これにより横スクロールバーが常に画面内（表の下端）に見える状態を保つ。 */
  #appRoot { display:flex; flex-direction:column; flex:1; min-height:0; }
  header { padding:16px 24px; border-bottom:1px solid var(--border); display:flex; align-items:center; gap:16px; flex-wrap:wrap; flex-shrink:0; }
  h1 { font-size:16px; margin:0; font-weight:600; }
  select { padding:6px 10px; border-radius:6px; border:1px solid var(--border); background:var(--panel); color:var(--text); font-size:13px; }
  .month-stepper { display:flex; align-items:center; gap:2px; background:var(--panel); border:2px solid var(--accent); border-radius:10px; padding:3px; }
  .month-stepper button { background:none; border:none; color:var(--accent); font-size:15px; font-weight:700; cursor:pointer; padding:6px 10px; border-radius:7px; line-height:1; }
  .month-stepper button:hover:not(:disabled) { background:color-mix(in srgb, var(--accent) 15%, transparent); }
  .month-stepper button:disabled { opacity:.3; cursor:default; }
  .month-stepper select { border:none; background:none; font-size:15px; font-weight:700; color:var(--text); padding:4px; cursor:pointer; text-align:center; }
  .theme-btn { padding:6px 10px; border-radius:6px; border:1px solid var(--border); background:var(--panel); color:var(--text); font-size:13px; cursor:pointer; }
  .tabs { display:flex; gap:4px; margin-left:auto; }
  .tab-btn { padding:6px 16px; border-radius:6px; border:1px solid var(--border); background:var(--panel); color:var(--muted); font-size:13px; cursor:pointer; }
  .tab-btn.active { background:var(--accent); color:#fff; border-color:var(--accent); }
  .sort-toggle { display:flex; gap:4px; }
  .warn-banner { background:#7a3b1a22; border:1px solid var(--accent); color:var(--text); padding:8px 24px; font-size:12.5px; flex-shrink:0; }
  main { padding:16px 24px; flex:1; min-height:0; display:flex; flex-direction:column; }
  .scrollx { overflow:auto; border:1px solid var(--border); border-radius:10px; background:var(--panel); flex:1; min-height:0; }
  table { border-collapse:collapse; white-space:nowrap; font-size:12px; }
  th, td { padding:6px 9px; text-align:right; border-bottom:1px solid var(--border); }
  th:first-child, td:first-child, th:nth-child(2), td:nth-child(2), th:nth-child(3), td:nth-child(3) {
    text-align:left; position:sticky; background:var(--panel); z-index:2;
  }
  th:first-child, td:first-child { left:0; }
  th:nth-child(2), td:nth-child(2) { left:70px; }
  th:nth-child(3), td:nth-child(3) { left:150px; }
  thead th { color:var(--muted); font-weight:600; position:sticky; top:0; z-index:3; background:var(--panel); }
  thead th:first-child, thead th:nth-child(2), thead th:nth-child(3) { z-index:4; }
  .dept-sep td { background:color-mix(in srgb, var(--accent) 8%, var(--panel)); font-weight:600; color:var(--accent); }
  .subtotal-row td { font-weight:600; background:var(--panel); border-top:1px solid var(--border); border-bottom:2px solid var(--border); }
  .grandtotal-row td { font-weight:700; background:color-mix(in srgb, var(--accent) 14%, var(--panel)); border-top:2px solid var(--accent); }
  th.row-hover, td.row-hover, th.col-hover, td.col-hover { background:color-mix(in srgb, var(--accent) 6%, var(--panel)) !important; }
  th.cell-hover, td.cell-hover { background:color-mix(in srgb, var(--accent) 16%, var(--panel)) !important; }
  #gate { padding:80px 24px; text-align:center; overflow:auto; flex:1; min-height:0; }
  #gate .btn { font:inherit; font-size:14px; padding:10px 22px; border-radius:6px; border:1px solid var(--accent); background:var(--accent); color:#fff; cursor:pointer; }
  #gateError { color:#b03636; margin-top:14px; font-size:13px; white-space:pre-wrap; }
  .hide { display:none !important; }
  /* 納付書用ビュー：必要な項目だけを本社・工場・合計で並べる */
  #taxView { overflow:auto; flex:1; min-height:0; display:flex; flex-direction:column; gap:16px; }
  .tax-card { background:var(--panel); border:1px solid var(--border); border-radius:10px; padding:14px 18px; max-width:760px; }
  .tax-card h2 { font-size:14px; margin:0 0 4px; }
  .tax-card .sub { color:var(--muted); font-size:12px; margin:0 0 10px; }
  .tax-card table { width:100%; font-size:13px; }
  .tax-card th, .tax-card td { position:static !important; padding:7px 10px; }
  .tax-card th:first-child, .tax-card td:first-child { text-align:left; }
  .tax-card th:not(:first-child), .tax-card td:not(:first-child) { text-align:right !important; font-variant-numeric:tabular-nums; }
  .tax-card td.sec { text-align:left !important; }
  .tax-card thead th { position:static; }
  .tax-card tr.total td { font-weight:700; border-top:2px solid var(--accent); background:color-mix(in srgb, var(--accent) 8%, var(--panel)); }
  .tax-card td.lbl { color:var(--muted); }
  .tax-card td.sec { font-weight:600; color:var(--accent); padding-top:12px; }
  .tax-note { color:var(--muted); font-size:12px; line-height:1.7; margin:10px 0 0; }
  .tax-actions { display:flex; gap:8px; margin-top:10px; }
  .tax-actions button { font:inherit; font-size:12.5px; padding:5px 12px; border-radius:6px; border:1px solid var(--border); background:var(--panel); color:var(--text); cursor:pointer; }
  /* 個人の給与明細ドロワー */
  tr.emp-row { cursor:pointer; }
  tr.emp-sel td { background:color-mix(in srgb, var(--accent) 12%, var(--panel)) !important; }
  #drawerShade { position:fixed; inset:0; background:rgba(15,20,30,.18); z-index:40; }
  #drawer { position:fixed; top:0; right:0; bottom:0; width:min(520px, 96vw); background:var(--panel); border-left:1px solid var(--border);
    box-shadow:-12px 0 32px rgba(0,0,0,.14); z-index:41; display:flex; flex-direction:column; transform:translateX(105%); transition:transform .22s ease; }
  #drawer.open { transform:none; }
  .dw-head { display:flex; justify-content:space-between; align-items:flex-start; gap:12px; padding:18px 20px 12px; border-bottom:1px solid var(--border); }
  .dw-name { font-size:18px; font-weight:700; }
  .dw-sub { color:var(--muted); font-size:12.5px; margin-top:3px; }
  .dw-nav { display:flex; gap:4px; }
  .dw-nav button { font:inherit; font-size:13px; width:32px; height:32px; border-radius:6px; border:1px solid var(--border); background:var(--panel); color:var(--text); cursor:pointer; }
  .dw-tabs { display:flex; gap:4px; align-items:center; padding:10px 20px 0; }
  .dw-tabs button { font:inherit; font-size:13px; padding:6px 14px; border-radius:6px 6px 0 0; border:1px solid var(--border); border-bottom:none; background:var(--panel); color:var(--muted); cursor:pointer; }
  .dw-tabs button.on { background:var(--accent); color:#fff; border-color:var(--accent); }
  .dw-zero { margin-left:auto; font-size:12px; color:var(--muted); display:flex; align-items:center; gap:4px; }
  .dw-body { overflow:auto; flex:1; padding:14px 20px 28px; border-top:1px solid var(--border); }
  .dw-sec { margin:0 0 16px; }
  .dw-sec h3 { font-size:12.5px; color:var(--accent); margin:0 0 6px; padding-bottom:4px; border-bottom:2px solid var(--accent); }
  .dw-sec table { width:100%; font-size:13px; white-space:normal; }
  .dw-sec th, .dw-sec td { position:static !important; padding:5px 6px; border-bottom:1px solid var(--border); text-align:right !important; background:none !important; font-variant-numeric:tabular-nums; }
  .dw-sec th:first-child, .dw-sec td:first-child { text-align:left !important; }
  .dw-sec thead th { color:var(--muted); font-weight:600; font-size:11.5px; }
  .dw-sec tr.tot td { font-weight:700; border-top:1px solid var(--text); }
  .dw-sec td.up { color:#b3261e; } .dw-sec td.down { color:#1f5fa8; }
  .dw-net { display:flex; justify-content:space-between; align-items:baseline; background:color-mix(in srgb, var(--accent) 10%, var(--panel)); border-radius:8px; padding:10px 14px; margin:0 0 16px; }
  .dw-net b { font-size:22px; font-variant-numeric:tabular-nums; }
  .dw-kv { display:grid; grid-template-columns:110px 1fr; gap:6px 12px; font-size:13px; }
  .dw-kv dt { color:var(--muted); } .dw-kv dd { margin:0; }
  .dw-note { color:var(--muted); font-size:11.5px; line-height:1.6; }
</style>

<div id="gate">
  <p data-ha-login id="gateMsg">役員・総務幹部限定のデータです。Microsoftアカウントでサインインしてください。</p>
  <button data-ha-login class="btn" id="signInBtn">サインイン</button>
  <div id="gateError"></div>
</div>

<div id="appRoot" class="hide">
<div class="warn-banner">⚠ 従業員個人の給与・勤怠明細（氏名を含む）です。役員・総務幹部限定での共有・保管としてください。</div>
<header>
  <h1>支給控除一覧表（個人別）</h1>
  <div class="month-stepper">
    <button id="prevMonthBtn" aria-label="前月" type="button">◀</button>
    <select id="monthSel"></select>
    <button id="nextMonthBtn" aria-label="次月" type="button">▶</button>
  </div>
  <div class="sort-toggle">
    <button class="tab-btn active" id="sortDept">所属順</button>
    <button class="tab-btn" id="sortCode">従業員番号順</button>
  </div>
  <div class="tabs">
    <button class="tab-btn active" data-dept="本社" id="tabHonsha">本社</button>
    <button class="tab-btn" data-dept="工場" id="tabKoujou">工場</button>
    <button class="tab-btn" id="tabTax">納付書用（源泉・住民税）</button>
  </div>
  <button class="theme-btn" id="themeBtn">☀ ライト</button>
</header>
<main>
  <div class="scrollx" id="detailWrap"><table id="detailTable"></table></div>
  <div id="taxView" class="hide"></div>
</main>

<div id="drawerShade" class="hide"></div>
<aside id="drawer" aria-hidden="true">
  <div class="dw-head">
    <div><div class="dw-name" id="dwName"></div><div class="dw-sub" id="dwSub"></div></div>
    <div class="dw-nav">
      <button type="button" id="dwPrev" title="前の人（↑）">▲</button>

<script src="payroll_graph.js?v=20261004"></script>
<script>
const ATTENDANCE_COLS = ["勤怠_出勤日数","勤怠_欠勤日数","勤怠_有給日数","勤怠_有給残日数","勤怠_休日出勤日数","勤怠_代休日数","勤怠_特別休暇日数","勤怠_就労時間","勤怠_普通残業","勤怠_深夜残業","勤怠_法定内残業時間","勤怠_休日勤務時間","勤怠_遅早回数","勤怠_遅早時間","勤怠_有給換算時間","勤怠_本給","税制扶養数"];
const PAY_COLS = ["基本給","役付手当","営業手当","家族手当","課税通勤手当","調整手当","その他手当","普通残業","賞与手当分","深夜残業","休日出勤手当","60H超過分","法定内残業","欠勤控除","遅早控除","課税支給合計","非課税通勤手当","立替経費","慶弔金","非課税支給合計","現金支給額","支給合計","健康保険","介護保険","厚生年金","雇用保険","子ども子育て支援金","社保控除合計","課税対象額","所得税","住民税","定額減税","組合費","財形貯蓄","通勤手当控除","賄費","その他控除","その他控除合計","調整保険","年調精算額","控除合計","差引支給額","振込支給額"];
const SUM_COLS = [...ATTENDANCE_COLS, ...PAY_COLS];
// 勤怠側の残業時間は金額側の同名列（支給・控除の円額）と見分けがつくよう単位を明示する
const ATTENDANCE_LABEL_OVERRIDES = { "勤怠_普通残業": "普通残業(時間)", "勤怠_深夜残業": "深夜残業(時間)" };
const detailCache = {}; // "年月_部門" -> 配列（取得済みキャッシュ）
let months = [];

(function initTheme() {
  let saved;
  try { saved = localStorage.getItem('payrollDetailTheme'); } catch (e) { saved = null; }
  const theme = saved || 'light';
  document.documentElement.setAttribute('data-theme', theme);
  const btn = document.getElementById('themeBtn');
  function updateBtn() {
    const cur = document.documentElement.getAttribute('data-theme');
    btn.textContent = cur === 'dark' ? '🌙 ダーク' : '☀ ライト';
  }
  updateBtn();
  btn.addEventListener('click', () => {
    const cur = document.documentElement.getAttribute('data-theme');
    const next = cur === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', next);
    try { localStorage.setItem('payrollDetailTheme', next); } catch (e) {}
    updateBtn();
  });
})();

document.addEventListener('mouseover', (e) => {
  const cell = e.target.closest('td,th');
  const table = cell && cell.closest('table');
  if (!table) return;
  const idx = cell.cellIndex;
  cell.closest('tr').querySelectorAll('td,th').forEach(c => c.classList.add('row-hover'));
  table.querySelectorAll('tr').forEach(row => {
    const c = row.children[idx];
    if (c) c.classList.add('col-hover');
  });
  cell.classList.add('cell-hover');
});
document.addEventListener('mouseout', (e) => {
  if (!e.target.closest('table')) return;
  document.querySelectorAll('.row-hover').forEach(c => c.classList.remove('row-hover'));
  document.querySelectorAll('.col-hover').forEach(c => c.classList.remove('col-hover'));
  document.querySelectorAll('.cell-hover').forEach(c => c.classList.remove('cell-hover'));
});

const monthSel = document.getElementById('monthSel');
let currentDept = '本社';
let currentSort = 'dept';

function fmt(n) {
  if (n === null || n === undefined || n === '') return '';
  const s = Math.abs(n).toLocaleString('ja-JP');
  return n < 0 ? '△' + s : s;
}

function sumRow(emps, label, cls) {
  let row = `<tr class="${cls}"><td></td><td>${label}</td><td></td>`;
  for (const c of SUM_COLS) {
    const total = emps.reduce((s, e) => s + ((e.内訳 || {})[c] || 0), 0);
    row += `<td>${fmt(Math.round(total * 100) / 100)}</td>`;
  }
  return row + '</tr>';
}

async function fetchDetail(ym, dept) {
  const key = ym + '_' + dept;
  if (detailCache[key]) return detailCache[key];
  const data = await payrollGetFile(`history/payroll_detail/${key}.json`, { allow404: true });
  detailCache[key] = data || [];
  return detailCache[key];
}

async function render() {
  updateStepperButtons();
  const tax = currentView === 'tax';
  document.getElementById('detailWrap').classList.toggle('hide', tax);
  document.getElementById('taxView').classList.toggle('hide', !tax);
  document.querySelector('.sort-toggle').classList.toggle('hide', tax);
  if (tax) return renderTax();
  const ym = monthSel.value;
  const t = document.getElementById('detailTable');
  t.innerHTML = '<tr><td style="padding:20px">読み込み中…</td></tr>';
  const emps = [...await fetchDetail(ym, currentDept)];

  if (currentSort === 'dept') {
    emps.sort((a, b) => (a.所属 || '').localeCompare(b.所属, 'ja') || a.従業員コード.localeCompare(b.従業員コード));
  } else {
    emps.sort((a, b) => a.従業員コード.localeCompare(b.従業員コード));
  }

  let thead = '<thead><tr><th>従業員No</th><th>氏名</th><th>所属</th>';
  for (const c of ATTENDANCE_COLS) thead += `<th>${ATTENDANCE_LABEL_OVERRIDES[c] || c.replace('勤怠_','')}</th>`;
  for (const c of PAY_COLS) thead += `<th>${c}</th>`;
  thead += '</tr></thead>';

  let tbody = '<tbody>';
  let lastDept = null;
  let deptBucket = [];
  for (const e of emps) {
    if (currentSort === 'dept' && e.所属 !== lastDept) {
      if (deptBucket.length) tbody += sumRow(deptBucket, `${lastDept || '（所属不明）'}　小計`, 'subtotal-row');
      lastDept = e.所属;
      deptBucket = [];
      tbody += `<tr class="dept-sep"><td colspan="${3 + ATTENDANCE_COLS.length + PAY_COLS.length}">${lastDept || '（所属不明）'}</td></tr>`;
    }
    deptBucket.push(e);
    const v = e.内訳 || {};
    tbody += `<tr class="emp-row${e.従業員コード === drawerCode ? ' emp-sel' : ''}" data-code="${e.従業員コード}" title="クリックで給与明細・人事情報を表示"><td>${e.従業員コード}</td><td>${e.氏名 ?? ''}</td><td>${e.所属 ?? ''}</td>`;
    for (const c of ATTENDANCE_COLS) tbody += `<td>${v[c] ?? ''}</td>`;
    for (const c of PAY_COLS) tbody += `<td>${v[c] != null ? fmt(v[c]) : ''}</td>`;
    tbody += '</tr>';
  }
  if (currentSort === 'dept' && deptBucket.length) tbody += sumRow(deptBucket, `${lastDept || '（所属不明）'}　小計`, 'subtotal-row');
  if (emps.length) tbody += sumRow(emps, `${currentDept}　総合計`, 'grandtotal-row');
  else tbody = '<tbody><tr><td>データなし</td></tr>';
  tbody += '</tbody>';
  t.innerHTML = thead + tbody;
  drawerOrder = emps.map(e => e.従業員コード);
  if (drawerCode) openDrawer(drawerCode);  // 月・並び順を変えたら開いている人の明細も更新
}

// ---------------- 個人の給与明細・人事情報（右から開くドロワー） ----------------
let drawerCode = null, drawerOrder = [], drawerTab = 'pay', empMaster = null;
const escH = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
// 給与明細の区切り：支給合計までが支給、控除合計までが控除、残りが差引
const PAY_SEC = PAY_COLS.slice(0, PAY_COLS.indexOf('支給合計') + 1);
const DED_SEC = PAY_COLS.slice(PAY_COLS.indexOf('支給合計') + 1, PAY_COLS.indexOf('控除合計') + 1);
const TOTAL_ITEMS = new Set(['課税支給合計', '非課税支給合計', '支給合計', '社保控除合計', 'その他控除合計', '控除合計']);
async function loadEmpMaster() {
  if (empMaster === null) {
    try { empMaster = (await payrollGetFile('history/employee_master.json', { allow404: true })) || []; } catch (e) { empMaster = []; }
  }
  return empMaster;
}
function prevYm(ym) { const i = months.indexOf(ym); return i > 0 ? months[i - 1] : null; }
async function openDrawer(code) {
  drawerCode = code;
  document.querySelectorAll('tr.emp-row').forEach(tr => tr.classList.toggle('emp-sel', tr.dataset.code === code));
  const ym = monthSel.value, pym = prevYm(ym);
  const cur = (await fetchDetail(ym, currentDept)).find(e => e.従業員コード === code);
  const prev = pym ? (await fetchDetail(pym, currentDept)).find(e => e.従業員コード === code) : null;
  if (!cur) { closeDrawer(); return; }
  document.getElementById('dwName').textContent = cur.氏名 || '';
  document.getElementById('dwSub').textContent = `${code}　${cur.所属 || ''}　／　${currentDept}　${ym.slice(0, 4)}年${Number(ym.slice(5))}月分`;
  document.getElementById('dwPrev').disabled = drawerOrder.indexOf(code) <= 0;
  document.getElementById('dwNext').disabled = drawerOrder.indexOf(code) >= drawerOrder.length - 1;
  document.querySelectorAll('[data-dwtab]').forEach(b => b.classList.toggle('on', b.dataset.dwtab === drawerTab));
  document.querySelector('.dw-zero').classList.toggle('hide', drawerTab !== 'pay');
  document.getElementById('dwBody').innerHTML = drawerTab === 'pay' ? payslipHtml(cur, prev, pym) : await hrHtml(code, ym, cur);
  document.getElementById('drawer').classList.add('open');
  document.getElementById('drawer').setAttribute('aria-hidden', 'false');
  document.getElementById('drawerShade').classList.remove('hide');
}
function closeDrawer() {
  drawerCode = null;
  document.getElementById('drawer').classList.remove('open');
  document.getElementById('drawer').setAttribute('aria-hidden', 'true');
  document.getElementById('drawerShade').classList.add('hide');
  document.querySelectorAll('tr.emp-sel').forEach(tr => tr.classList.remove('emp-sel'));
}
function payslipHtml(cur, prev, pym) {
  const v = cur.内訳 || {}, pv = (prev && prev.内訳) || {};
  const showZero = document.getElementById('dwZero').checked;
  const num = (x, unit) => x == null || x === '' ? '' : (unit ? (Math.round(x * 100) / 100) + unit : fmt(x));
  const section = (title, items, unit) => {
    const rows = items.filter(k => showZero || TOTAL_ITEMS.has(k) || (v[k] || 0) !== 0 || (pv[k] || 0) !== 0).map(k => {
      const a = v[k] || 0, b = pv[k] || 0, d = Math.round((a - b) * 100) / 100;
      const label = ATTENDANCE_LABEL_OVERRIDES[k] || k.replace('勤怠_', '');
      return `<tr class="${TOTAL_ITEMS.has(k) ? 'tot' : ''}"><td>${escH(label)}</td><td>${num(a, unit)}</td><td>${prev ? num(b, unit) : ''}</td>
        <td class="${d > 0 ? 'up' : d < 0 ? 'down' : ''}">${prev && d ? (d > 0 ? '+' : '') + (unit ? d + unit : fmt(d)) : ''}</td></tr>`;
    }).join('');
    return rows ? `<div class="dw-sec"><h3>${title}</h3><table><thead><tr><th></th><th>今月</th><th>${prev ? '前月' : ''}</th><th>${prev ? '差' : ''}</th></tr></thead><tbody>${rows}</tbody></table></div>` : '';
  };
  const net = v.差引支給額 || 0, pay = v.振込支給額;
  return `<div class="dw-net"><span>差引支給額${pay != null && pay !== net ? `<br><span class="dw-note">振込支給額 ${fmt(pay)}円</span>` : ''}</span><b>${fmt(net)}円</b></div>` +
    section('支給', PAY_SEC) + section('控除', DED_SEC) + section('勤怠', ATTENDANCE_COLS, '') +
    `<p class="dw-note">${prev ? `前月＝${pym.slice(0, 4)}年${Number(pym.slice(5))}月分。` : '前月のデータはありません。'}0円の項目は、上のチェックで表示できます。↑↓キーで前後の人、Escで閉じます。</p>`;
}
async function hrHtml(code, ym, cur) {
  const em = await loadEmpMaster();
  const site = currentDept;
  const mine = em.filter(r => r.拠点 === site && String(r.従業員コード).padStart(6, '0') === code).sort((a, b) => a.年月 < b.年月 ? -1 : 1);
  if (!mine.length) return '<p class="dw-note">従業員マスタ（従業員基本情報）にこの方のデータがありません。</p>';
  const r = mine.filter(x => x.年月 <= ym).pop() || mine[mine.length - 1];
  const tenure = s => {  // 入社日から対象月の末日までの勤続
    const d = new Date(String(s).replace(/\//g, '-') + 'T00:00:00'); if (isNaN(d)) return '';
    const [y, m] = ym.split('-').map(Number), end = new Date(y, m, 0);
    let mo = (end.getFullYear() - d.getFullYear()) * 12 + (end.getMonth() - d.getMonth()); if (end.getDate() < d.getDate()) mo--;
    return mo < 0 ? '' : `（勤続 ${Math.floor(mo / 12)}年${mo % 12}か月）`;
  };
  const kv = [['部門', r.部門], ['所属（等級）', r.所属], ['役職', r.役職], ['給与種別', r.給与種別名称], ['在職区分', r.在職区分名称],
    ['入社日', r.入社年月日 ? r.入社年月日 + tenure(r.入社年月日) : ''], ['年齢', r.年齢 != null && r.年齢 !== '' ? r.年齢 + '歳' : ''], ['性別', r.性別],
    ['退職日', r.退職年月日]].filter(([, x]) => x != null && x !== '');
  // 部門・所属・役職の変化（従業員マスタの月ごとの記録から）
  const changes = [];
  for (let i = 1; i < mine.length; i++) {
    const a = mine[i - 1], b = mine[i];
    ['部門', '所属', '役職'].forEach(k => { if ((a[k] || '') !== (b[k] || '')) changes.push(`${b.年月}：${k} ${a[k] || '—'} → ${b[k] || '—'}`); });
  }
  return `<div class="dw-sec"><h3>人事情報（従業員マスタ ${escH(r.年月)} 時点）</h3><dl class="dw-kv">${kv.map(([k, x]) => `<dt>${escH(k)}</dt><dd>${escH(x)}</dd>`).join('')}</dl></div>` +
    `<div class="dw-sec"><h3>所属・役職の変化</h3>${changes.length ? `<ul class="dw-note" style="margin:0;padding-left:18px">${changes.map(c => `<li>${escH(c)}</li>`).join('')}</ul>` : `<p class="dw-note">記録のある期間（${escH(mine[0].年月)}〜${escH(mine[mine.length - 1].年月)}）に変化はありません。</p>`}</div>` +
    `<p class="dw-note"><a href="payroll_people.html">人事情報のページ</a>で一覧や異動の履歴を見られます。</p>`;
}
document.getElementById('detailTable').addEventListener('click', e => {
  const tr = e.target.closest('tr.emp-row'); if (tr) openDrawer(tr.dataset.code);
});
document.getElementById('dwClose').addEventListener('click', closeDrawer);
document.getElementById('drawerShade').addEventListener('click', closeDrawer);
document.getElementById('dwZero').addEventListener('change', () => { if (drawerCode) openDrawer(drawerCode); });
document.querySelectorAll('[data-dwtab]').forEach(b => b.addEventListener('click', () => { drawerTab = b.dataset.dwtab; if (drawerCode) openDrawer(drawerCode); }));
const stepDrawer = d => { const i = drawerOrder.indexOf(drawerCode) + d; if (i >= 0 && i < drawerOrder.length) openDrawer(drawerOrder[i]); };
document.getElementById('dwPrev').addEventListener('click', () => stepDrawer(-1));
document.getElementById('dwNext').addEventListener('click', () => stepDrawer(1));
document.addEventListener('keydown', e => {
  if (!drawerCode) return;
  if (e.key === 'Escape') closeDrawer();
  else if (e.key === 'ArrowDown') { e.preventDefault(); stepDrawer(1); }
  else if (e.key === 'ArrowUp') { e.preventDefault(); stepDrawer(-1); }
});

function setDept(d) {
  closeDrawer();
  currentDept = d; currentView = 'detail';
  document.getElementById('tabHonsha').classList.toggle('active', d === '本社');
  document.getElementById('tabKoujou').classList.toggle('active', d === '工場');
  document.getElementById('tabTax').classList.remove('active');
  render();
}
function setTaxView() {
  closeDrawer();
  currentView = 'tax';
  ['tabHonsha', 'tabKoujou'].forEach(id => document.getElementById(id).classList.remove('active'));
  document.getElementById('tabTax').classList.add('active');
  render();
}

// ---------------- 納付書用（源泉所得税・住民税） ----------------
// 源泉所得税：給与所得・退職所得等の所得税徴収高計算書（俸給・給料等）に書く 人員・支給額・税額・年末調整の過不足・本税。
// 住民税：特別徴収の納付額の合計（市区町村ごとの内訳は給与データにないため、事業場別の合計のみ）。
let currentView = 'detail';
const pad2 = n => String(n).padStart(2, '0');
const ymd = d => `${d.getFullYear()}/${pad2(d.getMonth() + 1)}/${pad2(d.getDate())}`;
/** 主な祝日（納期限の10日・支給日の25日の前後に関係するもの）。振替休日も考える */
function isHoliday(d) {
  const y = d.getFullYear(), m = d.getMonth() + 1, day = d.getDate(), w = d.getDay();
  const nthMonday = n => w === 1 && Math.ceil(day / 7) === n;
  const fixed = [[1, 1], [2, 11], [2, 23], [4, 29], [5, 3], [5, 4], [5, 5], [8, 11], [11, 3], [11, 23]];
  if (fixed.some(([fm, fd]) => fm === m && fd === day)) return true;
  if ((m === 1 && nthMonday(2)) || (m === 7 && nthMonday(3)) || (m === 9 && nthMonday(3)) || (m === 10 && nthMonday(2))) return true;
  // 振替休日：祝日が日曜なら翌月曜
  if (w === 1) { const prev = new Date(y, m - 1, day - 1); return fixed.some(([fm, fd]) => fm === prev.getMonth() + 1 && fd === prev.getDate()); }
  return false;
}
const isBusinessDay = d => d.getDay() !== 0 && d.getDay() !== 6 && !isHoliday(d);
function payDateOf(ym) {  // 給与の支給日：毎月25日（休日なら前の営業日）
  const [y, m] = ym.split('-').map(Number);
  const d = new Date(y, m - 1, 25);
  while (!isBusinessDay(d)) d.setDate(d.getDate() - 1);
  return d;
}
function dueDateOf(ym) {  // 納期限：支給月の翌月10日（休日なら翌営業日）
  const [y, m] = ym.split('-').map(Number);
  const d = new Date(y, m, 10);
  while (!isBusinessDay(d)) d.setDate(d.getDate() + 1);
  return d;
}
function taxFigures(emps) {
  const v = e => e.内訳 || {};
  const paid = emps.filter(e => (v(e).課税支給合計 || 0) > 0);
  const f = {
    人員: paid.length,
    支給額: paid.reduce((s, e) => s + (v(e).課税支給合計 || 0), 0),
    // 税額：所得税（2024年の定額減税の月は、減税額（マイナス）を差し引いた実際の徴収額）
    税額: emps.reduce((s, e) => s + (v(e).所得税 || 0) + (v(e).定額減税 || 0), 0),
    // 年末調整：年調精算額がプラス＝追加で徴収（不足税額）、マイナス＝還付（超過税額）
    不足税額: emps.reduce((s, e) => s + Math.max(0, v(e).年調精算額 || 0), 0),
    超過税額: emps.reduce((s, e) => s + Math.max(0, -(v(e).年調精算額 || 0)), 0),
    住民税人員: emps.filter(e => (v(e).住民税 || 0) > 0).length,
    住民税: emps.reduce((s, e) => s + (v(e).住民税 || 0), 0),
  };
  f.本税 = f.税額 + f.不足税額 - f.超過税額;
  return f;
}
async function renderTax() {
  const ym = monthSel.value;
  const tv = document.getElementById('taxView');
  tv.innerHTML = '<div class="tax-card">読み込み中…</div>';
  const [h, k] = await Promise.all([fetchDetail(ym, '本社'), fetchDetail(ym, '工場')]);
  const H = taxFigures(h), K = taxFigures(k), T = {};
  Object.keys(H).forEach(key => { T[key] = H[key] + K[key]; });
  const yen = n => (n < 0 ? '△' : '') + Math.abs(n).toLocaleString('ja-JP') + '円';
  const ppl = n => n + '人';
  const row = (label, key, f, cls) => `<tr class="${cls || ''}"><td class="lbl">${label}</td><td>${f(H[key])}</td><td>${f(K[key])}</td><td>${f(T[key])}</td></tr>`;
  const [y, m] = ym.split('-').map(Number);
  const pay = ymd(payDateOf(ym)), due = ymd(dueDateOf(ym));
  const nendo = (T.不足税額 || T.超過税額);
  tv.innerHTML = `
    <div class="tax-card" id="taxCard1">
      <h2>源泉所得税（給与所得・退職所得等の所得税徴収高計算書）</h2>
      <p class="sub">${y}年${m}月支給分／支払年月日 ${pay}／納期限 ${due}</p>
      <table>
        <thead><tr><th>項目</th><th>本社</th><th>工場</th><th>合計</th></tr></thead>
        <tbody>
          <tr><td class="sec" colspan="4">俸給・給料等</td></tr>
          ${row('人員', '人員', ppl)}
          ${row('支給額', '支給額', yen)}
          ${row('税額', '税額', yen)}
          ${nendo ? `<tr><td class="sec" colspan="4">年末調整による過不足税額</td></tr>${row('不足税額', '不足税額', yen)}${row('超過税額', '超過税額', yen)}` : ''}
          ${row('本税（納付額）', '本税', yen, 'total')}
        </tbody>
      </table>
      <p class="tax-note">人員：課税支給がある人の数（役員を含む）。支給額：課税支給合計（非課税の通勤手当・立替経費などを除く）。税額：所得税の徴収額${T.税額 !== h.concat(k).reduce((s, e) => s + ((e.内訳 || {}).所得税 || 0), 0) ? '（定額減税を差し引いた額）' : ''}。<br>
        賞与は給与と別に支給した場合に「賞与」欄へ別記します（このデータは月々の給与分です）。${nendo ? '年末調整は年調精算額がプラスを不足税額、マイナスを超過税額として集計しています。' : ''}</p>
      <div class="tax-actions"><button data-taxcopy="1">表をコピー（Excel貼り付け用）</button></div>
    </div>
    <div class="tax-card" id="taxCard2">
      <h2>住民税（特別徴収）</h2>
      <p class="sub">${y}年${m}月支給分から徴収／納期限 ${due}</p>
      <table>
        <thead><tr><th>項目</th><th>本社</th><th>工場</th><th>合計</th></tr></thead>
        <tbody>
          ${row('人員', '住民税人員', ppl)}
          ${row('納付額', '住民税', yen, 'total')}
        </tbody>
      </table>
      <p class="tax-note">市区町村ごとの内訳は給与データにないため、事業場別の合計です。市区町村ごとの納付書の金額は、特別徴収税額の決定通知書の月額と照合してください（合計がこの納付額と一致するはずです）。</p>
      <div class="tax-actions"><button data-taxcopy="2">表をコピー（Excel貼り付け用）</button></div>
    </div>`;
  // Excelで数値として扱えるよう、コピーは単位・桁区切りを付けない数字（マイナスは -）で出す
  const COPY_ROWS = {
    1: [['俸給・給料等 人員', '人員'], ['俸給・給料等 支給額', '支給額'], ['俸給・給料等 税額', '税額'],
      ...(nendo ? [['年末調整 不足税額', '不足税額'], ['年末調整 超過税額', '超過税額']] : []), ['本税（納付額）', '本税']],
    2: [['人員', '住民税人員'], ['納付額', '住民税']],
  };
  tv.querySelectorAll('[data-taxcopy]').forEach(b => b.onclick = async () => {
    const card = document.getElementById('taxCard' + b.dataset.taxcopy);
    const lines = [card.querySelector('h2').textContent, card.querySelector('.sub').textContent, ['項目', '本社', '工場', '合計'].join('\t'),
      ...COPY_ROWS[b.dataset.taxcopy].map(([label, key]) => [label, H[key], K[key], T[key]].join('\t'))];
    await navigator.clipboard.writeText(lines.join('\n'));
    const t = b.textContent; b.textContent = '✓ コピーしました'; setTimeout(() => { b.textContent = t; }, 1500);
  });
}
function setSort(s) {
  currentSort = s;
  document.getElementById('sortDept').classList.toggle('active', s === 'dept');
  document.getElementById('sortCode').classList.toggle('active', s === 'code');
  render();
}

function updateStepperButtons() {
  const idx = months.indexOf(monthSel.value);
  document.getElementById('prevMonthBtn').disabled = idx <= 0;
  document.getElementById('nextMonthBtn').disabled = idx < 0 || idx >= months.length - 1;
}
function stepMonth(delta) {
  const idx = months.indexOf(monthSel.value) + delta;
  if (idx < 0 || idx >= months.length) return;
  monthSel.value = months[idx];
  render();
}
document.getElementById('prevMonthBtn').addEventListener('click', () => stepMonth(-1));
document.getElementById('nextMonthBtn').addEventListener('click', () => stepMonth(1));

async function loadDataAndShow() {
  document.getElementById('gateMsg').textContent = '読み込み中…';
  document.getElementById('signInBtn').disabled = true;
  const history = await payrollGetFile('history/payroll_history.json');
  months = [...new Set(history.map(r => r.年月))].sort();
  for (const m of months) {
    const opt = document.createElement('option');
    opt.value = m; opt.textContent = m;
    monthSel.appendChild(opt);
  }
  monthSel.value = months[months.length - 1];
  monthSel.addEventListener('change', render);
  document.getElementById('tabHonsha').addEventListener('click', () => setDept('本社'));
  document.getElementById('tabKoujou').addEventListener('click', () => setDept('工場'));
  document.getElementById('tabTax').addEventListener('click', setTaxView);
  document.getElementById('sortDept').addEventListener('click', () => setSort('dept'));
  document.getElementById('sortCode').addEventListener('click', () => setSort('code'));
  await render();

  document.getElementById('gate').classList.add('hide');
  document.getElementById('appRoot').classList.remove('hide');
}

async function boot() {
  const signedIn = await payrollInitAuth();
  if (signedIn) { try { await loadDataAndShow(); } catch (e) { showGateError(e); } }
}
function showGateError(e) {
  document.getElementById('gateError').textContent = e.message || String(e);
  document.getElementById('gateMsg').textContent = '役員・総務幹部限定のデータです。Microsoftアカウントでサインインしてください。';
  document.getElementById('signInBtn').disabled = false;
}
document.getElementById('signInBtn').addEventListener('click', async () => {
  document.getElementById('gateError').textContent = '';
  try {
    await payrollSignIn();
    await loadDataAndShow();
  } catch (e) { showGateError(e); }
});
boot();
</script>

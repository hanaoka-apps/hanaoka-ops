<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>予約状況 全社員の予定 | 花岡車輌</title>
  <script src="https://cdn.jsdelivr.net/npm/@azure/msal-browser@3.10.0/lib/msal-browser.min.js" crossorigin="anonymous"></script>
  <script src="nav.js" defer></script>
  <style>
    :root{
      --primary:#1a5fa8; --primary-dk:#134680; --accent:#e8412e;
      --success:#2e7d52; --warning:#c07a00; --danger:#c0392b;
      --bg:#f4f6f9; --card-bg:#fff; --border:#dde2ec; --text:#1e2533; --muted:#6b7a99;
      --shadow:0 1px 4px rgba(0,0,0,.08);
      --namew:200px; --dayw:128px; --hourw:58px; --lane:26px;
      /* 一覧（gridy風）の1日ぶんの幅。帯と違って文字を読ませるので広くとる */
      --listw:190px;
    }
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Meiryo','Hiragino Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}

    header{background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:space-between;
      padding:0 20px;height:52px;box-shadow:0 2px 8px rgba(0,0,0,.2);position:sticky;top:0;z-index:100}
    header .logo{font-size:16px;font-weight:700;letter-spacing:.04em}
    header .logo span{opacity:.7;font-weight:400;font-size:13px;margin-left:10px}
    header .user-info{display:flex;align-items:center;gap:12px;font-size:13px}
    header button{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.3);color:#fff;
      padding:5px 14px;border-radius:4px;cursor:pointer;font-size:12px}
    header button:hover{background:rgba(255,255,255,.25)}

    #login-view{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:calc(100vh - 52px);gap:20px}
    #login-view h2{font-size:20px;color:var(--primary)}
    #login-view p{color:var(--muted);font-size:14px}
    #login-btn{background:var(--primary);color:#fff;border:none;padding:12px 36px;border-radius:6px;
      font-size:15px;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:8px}
    #login-btn:hover{background:var(--primary-dk)}

    #app-view{display:none;padding:18px}

    .bar{display:flex;align-items:center;gap:9px;flex-wrap:wrap;background:var(--card-bg);padding:11px 14px;
      border-radius:8px;border:1px solid var(--border);box-shadow:var(--shadow);margin-bottom:13px}
    .bar label{font-size:12.5px;color:var(--muted);font-weight:600}
    select,input[type=search],input[type=datetime-local],input[type=text]{border:1px solid var(--border);border-radius:4px;
      padding:5px 9px;font-size:13px;background:#fff;font-family:inherit;max-width:100%}
    button.act{background:#fff;border:1px solid var(--border);border-radius:4px;padding:5px 12px;font-size:13px;
      cursor:pointer;font-family:inherit}
    button.act:hover:not(:disabled){background:#f0f2f5}
    button.pri{background:var(--primary);border-color:var(--primary);color:#fff}
    button.pri:hover:not(:disabled){background:var(--primary-dk)}
    .seg{display:flex;border:1px solid var(--border);border-radius:4px;overflow:hidden}
    .seg button{background:#fff;border:none;padding:5px 15px;font-size:13px;cursor:pointer;font-family:inherit;
      border-left:1px solid var(--border)}
    .seg button:first-child{border-left:none}
    .seg button.on{background:var(--primary);color:#fff;font-weight:700}
    .range{font-weight:700;font-size:14px;min-width:170px;text-align:center}
    .chk{display:flex;align-items:center;gap:5px;color:var(--muted);cursor:pointer;user-select:none;
      white-space:nowrap;font-size:12.5px}
    .spacer{flex:1}
    .cnt{font-size:11.5px;color:var(--muted)}

    /* ============================================================
       部署のトグル
       ------------------------------------------------------------
       ★プルダウンから置き換えた★ 「自部署以外は基本出さない」を
       人ごとに決めたいので、複数選べる形にした。
       絞り込みの手段は1つにしてある（プルダウンは残していない）。
       2つあると「どちらが効いているのか」で必ず迷う。
       ============================================================ */
    #depbar{align-items:flex-start}
    #depToggles{display:flex;gap:7px;flex-wrap:wrap;flex:1}
    .dgrp{display:flex;align-items:center;gap:5px;flex-wrap:wrap;
      border:1px solid var(--border);border-radius:6px;padding:4px 7px;background:#fbfcfe}
    .dgrp>.site{background:#eef2f8;border:1px solid #cdd7e5;color:#48546a;border-radius:4px;
      padding:2px 9px;font-size:11.5px;font-weight:700;cursor:pointer;font-family:inherit}
    .dgrp>.site:hover{background:#dde5f1}
    .dtog{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--border);background:#fff;
      border-radius:12px;padding:2px 10px 2px 7px;font-size:12px;cursor:pointer;user-select:none;
      white-space:nowrap;color:var(--muted)}
    .dtog input{margin:0;cursor:pointer}
    .dtog:hover{background:#f2f5fa}
    .dtog.on{background:#e8f1fc;border-color:var(--primary);color:var(--primary-dk);font-weight:600}
    .dtog .num{font-size:10.5px;opacity:.75;font-variant-numeric:tabular-nums}

    #privacy-note{background:#f6f8fb;border:1px solid var(--border);border-left:5px solid var(--muted);
      border-radius:6px;padding:9px 14px;margin-bottom:13px;font-size:12.5px;line-height:1.7;color:#48505a}
    #privacy-note b{color:var(--text)}

    #status-panel{background:var(--card-bg);border:1px solid var(--border);border-radius:8px;padding:11px 14px;
      margin-bottom:13px;font-size:12.5px;box-shadow:var(--shadow)}
    #status-panel.warn{border-color:var(--warning);background:#fffdf3}
    #status-panel.bad{border-color:var(--danger);background:#fdf4f3}
    #status-panel .st-row{display:flex;gap:8px;align-items:baseline;margin-top:4px;flex-wrap:wrap}
    #status-panel .ok{color:var(--success);font-weight:700}
    #status-panel .ng{color:var(--danger);font-weight:700}
    #status-panel code{background:#eef0f3;padding:1px 4px;border-radius:3px;font-size:11.5px}
    #status-panel details{margin-top:6px}
    #status-panel summary{cursor:pointer;color:var(--primary)}
    #status-panel pre{background:#f6f8fa;border:1px solid var(--border);border-radius:4px;padding:8px;
      margin-top:6px;font-size:11px;overflow:auto;max-height:220px;line-height:1.6}

    .card2{background:var(--card-bg);border:1px solid var(--border);border-radius:8px;padding:11px 14px;
      margin-bottom:13px;font-size:12.5px;box-shadow:var(--shadow)}
    .card2 h4{font-size:13px;color:var(--primary);margin-bottom:7px}
    .card2.oof{border-color:#d98c12}
    .card2.oof h4{color:var(--warning)}
    #seek-panel{display:none;border-color:var(--primary)}
    .grp-line{margin-top:5px;display:flex;gap:6px;flex-wrap:wrap;align-items:baseline}
    .grp-line b{color:var(--muted);font-weight:600;min-width:90px;font-size:11.5px}
    .chip{border:1px solid #a9d3ba;background:#eef6f0;color:#1d6b41;border-radius:11px;padding:1px 9px;
      font-size:11.5px;cursor:pointer}
    .chip:hover{background:#dcefe3}
    .chip.busy{border-color:#e6a8a0;background:#fbdcd9;color:#7d1d13}
    .chip.oof{border-color:#e8c96a;background:#fdf3e3;color:#6d4304}
    .chip.on{outline:2px solid var(--warning);outline-offset:1px}
    .none{color:var(--danger);font-weight:700}

    .legend{display:flex;gap:10px;flex-wrap:wrap;font-size:11.5px;color:var(--muted);align-items:center;margin-bottom:9px}
    .legend i{display:inline-block;width:15px;height:11px;border-radius:2px;margin-right:4px;vertical-align:-1px;border:1px solid}

    .scroll{overflow:auto;max-height:calc(100vh - 210px);background:var(--card-bg);border:1px solid var(--border);
      border-radius:8px;box-shadow:var(--shadow)}
    .grid.wk{min-width:calc(var(--namew) + var(--dayw)*7)}
    .grid.ls{min-width:calc(var(--namew) + var(--listw)*7)}
    .grid.dy{min-width:calc(var(--namew) + var(--hourw)*var(--hours))}
    .hrow{display:flex;position:sticky;top:0;z-index:30;background:#f8f9fc;border-bottom:1px solid var(--border)}
    .hname{flex:0 0 var(--namew);position:sticky;left:0;z-index:31;background:#f8f9fc;border-right:1px solid var(--border);
      padding:7px 11px;font-weight:700;font-size:12px;color:var(--muted);display:flex;align-items:center}
    .hdays{flex:1;display:grid}
    .grid.wk .hdays{grid-template-columns:repeat(7,minmax(var(--dayw),1fr))}
    .grid.ls .hdays{grid-template-columns:repeat(7,minmax(var(--listw),1fr))}
    .grid.dy .hdays{grid-template-columns:repeat(var(--hours),minmax(var(--hourw),1fr))}
    .hd{padding:4px 6px;text-align:center;border-left:1px solid #eef1f6;line-height:1.3}
    .hd .dow{font-size:10.5px;color:var(--muted)}
    .hd .dnum{font-weight:700;font-size:14px}
    .hd.sat{background:#eef4fb}.hd.sat .dow{color:var(--primary)}
    .hd.sun{background:#fdeff0}.hd.sun .dow{color:var(--danger)}
    .hd.today{background:#fff6d9}.hd.today .dnum,.hd.today .dow{color:#8a5a00}
    /* 週表示の日付見出しはクリックできる。押すとその日だけの時間割に切り替わる。
       押せることが分からないと誰も使わないので、下線と手のカーソルで見せる。 */
    .hd.clk{cursor:pointer}
    .hd.clk:hover{background:#dbe8f7;box-shadow:inset 0 -3px 0 var(--primary)}
    .hd.clk:hover .dnum{color:var(--primary-dk)}
    .hd.clk::after{content:"";display:block;height:2px;margin:2px 6px 0;border-radius:1px;background:transparent}
    .hd.clk:hover::after{background:var(--primary)}
    .hd.noon{background:#f2f5fa}

    /* 見出しは2段。拠点（役員／本社／工場）が大、部署が小。
       同じ濃さだとどちらが上位か分からないので、色と太さで差をつける。 */
    .grp{display:flex;background:#d8e2f0;border-bottom:1px solid #b9c9de;border-top:2px solid var(--primary)}
    .grp span{position:sticky;left:0;padding:5px 11px;font-size:12.5px;font-weight:700;color:var(--primary-dk)}
    .grp2{display:flex;background:#eef2f8;border-bottom:1px solid var(--border)}
    .grp2 span{position:sticky;left:0;padding:3px 11px 3px 24px;font-size:11.5px;font-weight:700;color:#5a6478}
    .grp2 span::before{content:"└ ";opacity:.55;font-weight:400}

    .row{display:flex;border-bottom:1px solid #f0f3fa}
    .row:hover{background:#eaf2fd}
    .row:hover .name{background:#d5e5f9;box-shadow:inset 4px 0 0 var(--primary)}
    .row:hover .mn{color:var(--primary-dk)}
    .row.hi{background:#fff6d9}
    .row.hi .name{background:#ffeaa8;box-shadow:inset 4px 0 0 var(--warning)}
    .row.hi .mn{color:#7a5000}
    .row:hover .bg.sat{background:#e4eefb}
    .row:hover .bg.sun{background:#fbeef0}
    .row:hover .bg.today{background:#fdf6e0}
    .row:hover .bg.off{background:#e2ebf6}
    .name{flex:0 0 var(--namew);position:sticky;left:0;z-index:20;background:#fff;border-right:1px solid var(--border);
      padding:4px 10px;display:flex;flex-direction:column;gap:1px;justify-content:center}
    .mn{font-weight:600;line-height:1.28;font-size:12px}
    .meta{font-size:10px;color:var(--muted);display:flex;gap:5px;flex-wrap:wrap;align-items:center}
    .badge{font-size:9.5px;border-radius:3px;padding:0 4px;border:1px solid;line-height:14px;white-space:nowrap}
    .b-dep{background:#f4f6f9;color:var(--muted);border-color:var(--border)}
    .b-also{background:#eef4fb;color:var(--primary);border-color:#bcd4ee}
    .b-free{background:#eef6f0;color:var(--success);border-color:#a9d3ba}
    .b-oof{background:#fdf3e3;color:var(--warning);border-color:#e8c96a}
    .b-err{background:#fbdcd9;color:var(--danger);border-color:#e6a8a0}
    /* 会社共通予定表。人の行と見分けがつくように色を分ける */
    .b-cmn{background:#efe6fb;color:#4a2f8f;border-color:#c9b8ea}
    .row.cmn{background:#f8f5ff;border-bottom:2px solid #c9b8ea}
    .row.cmn:hover{background:#efe6fb}
    .row.cmn .name{background:#f8f5ff}
    .row.cmn:hover .name{background:#e7dcfa;box-shadow:inset 4px 0 0 #7b5cc4}
    .row.cmn:hover .mn{color:#4a2f8f}

    .days{flex:1;position:relative}
    .grid.wk .days{min-width:calc(var(--dayw)*7)}

    /* ============================================================
       一覧（gridy風）
       ------------------------------------------------------------
       ★帯ではなく文字を読ませる表★
       週の帯表示は位置と幅を実時刻に比例させているので、30分の予定は
       幅が十数ピクセルしかなく「16」しか出ない。一覧は比例をやめて、
       1件を1行の文字として積む。そのかわり「どこが空いているか」は
       見えなくなるので、帯の週表示は残してある。
       高さは中身なり。段（lane）の計算はしない。
       ============================================================ */
    .grid.ls .days{min-width:calc(var(--listw)*7);display:grid;
      grid-template-columns:repeat(7,minmax(var(--listw),1fr));position:static}
    .grid.ls .dcell{border-left:1px solid #eef1f6;padding:3px 4px;min-height:32px;display:flex;
      flex-direction:column;gap:2px;justify-content:flex-start}
    .grid.ls .dcell.sat{background:#f8fbfe}
    .grid.ls .dcell.sun{background:#fefafa}
    .grid.ls .dcell.today{background:#fffdf2}
    .row:hover .dcell.sat{background:#e4eefb}
    .row:hover .dcell.sun{background:#fbeef0}
    .row:hover .dcell.today{background:#fdf6e0}
    .li{display:flex;align-items:baseline;gap:5px;font-size:11.5px;line-height:1.45;padding:2px 6px;
      border-radius:3px;border:1px solid;border-left-width:3px;cursor:pointer;white-space:normal;
      word-break:break-word;text-align:left}
    .li:hover{filter:brightness(.95)}
    .li .tm{font-size:10.5px;opacity:.9;white-space:nowrap;font-variant-numeric:tabular-nums}
    .li b{font-weight:600}
    /* 「空いている人を探す」で入れた区間に重なる予定。帯が無いので枠で示す */
    .li.hit{box-shadow:0 0 0 2px var(--warning)}
    .grid.ls .name{justify-content:flex-start;padding-top:6px}
    .grid.dy .days{min-width:calc(var(--hourw)*var(--hours))}
    .bgs{position:absolute;inset:0;display:grid}
    .grid.wk .bgs{grid-template-columns:repeat(7,1fr)}
    .grid.dy .bgs{grid-template-columns:repeat(var(--hours),1fr)}
    .bg{border-left:1px solid #eef1f6;position:relative}
    .grid.wk .bg::after{content:"";position:absolute;left:50%;top:0;bottom:0;border-left:1px dotted #f2f4f8}
    .bg.sat{background:#f8fbfe}.bg.sun{background:#fefafa}.bg.today{background:#fffdf2}
    .bg.off{background:#f7f8fa}
    .nowline{position:absolute;top:0;bottom:0;width:0;border-left:2px solid var(--accent);z-index:11;pointer-events:none}
    .seekband{position:absolute;top:0;bottom:0;background:rgba(26,95,168,.10);
      border-left:1px dashed var(--primary);border-right:1px dashed var(--primary);z-index:1;pointer-events:none}
    .bars{position:absolute;inset:0;pointer-events:none}
    .bar-i{position:absolute;height:calc(var(--lane) - 6px);min-width:24px;border-radius:3px;
      border-style:solid;border-width:1px 1px 1px 3px;padding:0 5px;font-size:11px;
      line-height:calc(var(--lane) - 8px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
      cursor:pointer;pointer-events:auto;display:flex;align-items:center;gap:5px}
    .bar-i:hover{filter:brightness(.95);z-index:12}
    .bar-i b{font-weight:700}
    .bar-i .tm{opacity:.85;font-size:10px;font-variant-numeric:tabular-nums;background:rgba(255,255,255,.55);
      border-radius:2px;padding:0 3px}
    .s-busy  {background:#dbe9fb;border-color:#2f6fd0;color:#12386f}
    .s-tent  {background:#eef2f8;border-color:#8fa6c8;color:#3c5a86;border-left-style:dashed}
    .s-oof   {background:#fdeccd;border-color:#d98c12;color:#6d4304}
    .s-else  {background:#eaf5ee;border-color:#5da37c;color:#1d5a3c}
    .s-unk   {background:#f4f5f7;border-color:#c3c8d0;color:#98a0aa}
    .s-cmn   {background:#efe6fb;border-color:#7b5cc4;color:#3f2a73}
    .cut-l{border-left-style:dashed!important;border-top-left-radius:0;border-bottom-left-radius:0}
    .cut-r{border-right-style:dashed;border-top-right-radius:0;border-bottom-right-radius:0}
    .empty{padding:26px;text-align:center;color:var(--muted);font-size:13px}

    .modal{position:fixed;inset:0;background:rgba(20,26,34,.45);display:none;align-items:center;
      justify-content:center;z-index:200;padding:14px}
    .modal.on{display:flex}
    .card{background:#fff;border-radius:8px;max-width:470px;width:100%;box-shadow:0 12px 40px rgba(0,0,0,.28);
      max-height:92vh;overflow:auto}
    .card h3{margin:0;padding:12px 16px;font-size:14.5px;border-bottom:1px solid var(--border);
      background:#f8f9fc;color:var(--primary)}
    .card .bd{padding:13px 16px;font-size:13px}
    .card dl{margin:0;display:grid;grid-template-columns:80px 1fr;gap:7px 10px}
    .card dt{color:var(--muted)}.card dd{margin:0;word-break:break-all}
    .card .ft{padding:11px 16px;border-top:1px solid var(--border);display:flex;gap:8px;
      justify-content:flex-end;background:#f8f9fc;align-items:center}
    .note{background:#f8f9fc;border-radius:5px;padding:8px 10px;font-size:11.5px;color:var(--muted);
      line-height:1.6;margin-top:9px}

    #snackbar{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#323232;color:#fff;
      padding:10px 20px;border-radius:6px;font-size:13px;display:none;z-index:999;max-width:90vw}

    @media(max-width:700px){
      :root{--namew:132px;--dayw:104px;--hourw:50px}
      #app-view{padding:11px}
    }
    @media print{
      header,.bar,.legend,#status-panel,#privacy-note,#seek-panel{display:none}
      .scroll{overflow:visible;max-height:none;border:none;box-shadow:none}
      .name,.hname,.hrow{position:static}
      body{background:#fff}
      :root{--dayw:88px;--hourw:44px;--namew:150px;--lane:20px}
    }
  </style>
</head>
<body>

<header>
  <div class="logo">花岡車輌<span>予約状況｜全社員の予定</span></div>
  <div class="user-info">
    <span id="user-name"></span>
    <button onclick="signOut()">サインアウト</button>
  </div>
</header>

<div id="login-view">
  <h2>予約状況｜全社員の予定</h2>
  <p>花岡車輌株式会社の Microsoft アカウントでサインインしてください</p>
  <button id="login-btn" onclick="signIn()">
    <svg width="18" height="18" viewBox="0 0 21 21" fill="none"><path d="M10 0H0v10h10V0z" fill="#F25022"/><path d="M21 0H11v10h10V0z" fill="#7FBA00"/><path d="M10 11H0v10h10V11z" fill="#00A4EF"/><path d="M21 11H11v10h10V11z" fill="#FFB900"/></svg>
    Microsoft アカウントでサインイン
  </button>
</div>

<div id="app-view">
  <div id="app-nav-slot"></div>

  <div id="privacy-note">
    <b>この画面は見るだけです。</b>予定の登録・変更は Outlook で行ってください。
    表示されるのは<b>件名・場所・時間帯</b>だけで、<b>本文と添付は表示されません</b>（読む権限もありません）。
    Outlook で予定を<b>「非公開」</b>にすると、この画面では「非公開」と表示され件名は出ません。
  </div>

  <div id="status-panel">読み込み中...</div>

  <div class="bar">
    <div class="seg">
      <button id="vDay" class="on">日</button>
      <button id="vWeek">週</button>
      <button id="vList">一覧</button>
    </div>
    <input type="search" id="q" placeholder="氏名で検索" style="width:140px">
    <button class="act" id="prev">◀</button>
    <button class="act pri" id="todayBtn">今日</button>
    <button class="act" id="next">▶</button>
    <span class="range" id="range"></span>
    <span class="spacer"></span>
    <span class="cnt" id="updated"></span>
    <button class="act" onclick="loadAll()">🔄 更新</button>
    <button class="act" onclick="window.print()">印刷</button>
  </div>

  <!-- 表示する部署。押した内容はこのブラウザに覚える（端末・ブラウザごと） -->
  <div class="bar" id="depbar">
    <label style="padding-top:5px">表示する部署</label>
    <div id="depToggles"></div>
    <div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center">

/* ============================================================
   時刻（JST固定。ブラウザのタイムゾーンに依存しない）
   ============================================================ */
const JST = 9 * 3600e3;
const toJ   = ms => new Date(ms + JST);
const pad   = n => String(n).padStart(2, '0');
const jKey  = ms => { const d = toJ(ms); return `${d.getUTCFullYear()}-${pad(d.getUTCMonth()+1)}-${pad(d.getUTCDate())}`; };
const jHM   = ms => { const d = toJ(ms); return `${pad(d.getUTCHours())}:${pad(d.getUTCMinutes())}`; };
const jFull = ms => `${jKey(ms).replace(/-/g,'/')} ${jHM(ms)}`;
const localToMs = v => v ? Date.parse(v + ':00Z') - JST : NaN;
const msToLocal = ms => { const d = toJ(ms);
  return `${d.getUTCFullYear()}-${pad(d.getUTCMonth()+1)}-${pad(d.getUTCDate())}T${pad(d.getUTCHours())}:${pad(d.getUTCMinutes())}`; };
/* getSchedule は timeZone を別に返すので、Z を足して読む */
const pTZ = x => {
  if (!x || !x.dateTime) return NaN;
  const s = x.dateTime;
  return Date.parse(/[Zz]|[+-]\d\d:?\d\d$/.test(s) ? s : s + 'Z');
};
/* getSchedule に渡す時刻。timeZone: UTC と組で使う */
const toUtcLocal = ms => new Date(ms).toISOString().replace(/\.\d+Z$/, '');
function dayTopMs(ms){ const d = toJ(ms); return Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate()) - JST; }
function weekTopMs(ms){
  const d = toJ(ms);
  const back = (d.getUTCDay() + 6) % 7;
  return Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate() - back) - JST;
}
const DAY = 86400e3, WK = DAY * 7, DOW = ['日','月','火','水','木','金','土'];
const overlaps = (a, s, e) => a.s < e && a.e > s;

/* ============================================================
   会社共通予定表
   ------------------------------------------------------------
   全社で共有している予定（休業日・棚卸など）が入った共有メールボックス。
   ★人ではないので名簿（PEOPLE）には入れない★
     名簿に混ぜると人数に数えられ、「空いている人を探す」にも出てしまう。
     別に持って、表のいちばん上に固定の1行として描く。

/* ★終日の予定は「瞬間」ではなく「日付」★
   Graph は終日の境界を 00:00 / timeZone:"UTC" で返すが、これは
   「その日の 0:00（現地）」という意味の日付表現で、UTC の瞬間ではない。
   そのまま UTC としてパースすると JST では +9時間ずれる。
   （営業車の画面で実際に「9:00〜翌8:59」になった。同じ間違いをしない） */
const dateOnlyToMs = x => {
  const m = String(x && x.dateTime || '').match(/^(\d{4})-(\d{2})-(\d{2})/);
  if (!m) return NaN;
  return Date.UTC(+m[1], +m[2]-1, +m[3]) - JST;
};
function evRange(ev){
  if (ev && ev.isAllDay) {
    const a = dateOnlyToMs(ev.start), b = dateOnlyToMs(ev.end);
    return { s:a, e: (isNaN(a) || isNaN(b) || b <= a) ? (isNaN(a) ? NaN : a + 86400e3) : b };
  }
  return { s: pTZ(ev && ev.start), e: pTZ(ev && ev.end) };
}

/* ============================================================
   Graph
   ============================================================ */
async function gGet(path, extra){
  const t = await getToken();
  const r = await fetch(GRAPH_BASE + path, { headers: { Authorization: 'Bearer ' + t, ...(extra||{}) } });
  if (!r.ok) { const e = new Error(`[${r.status}] ${path}`); e.status = r.status; e.body = await r.text(); throw e; }
  return r.json();
}
async function gGetAll(path, extra){
  let out = [], next = path;
  while (next) {
    const d = await gGet(next, extra);
    out = out.concat(d.value || []);
    next = d['@odata.nextLink'] ? d['@odata.nextLink'].replace(GRAPH_BASE, '') : null;
  }
  return out;
}
/* $batch。1回20リクエストまで */
async function gBatch(requests){
  const t = await getToken(); const out = [];
  for (let i = 0; i < requests.length; i += 20) {
    const chunk = requests.slice(i, i+20).map((r,k) => ({ id: String(i+k), ...r }));
    const res = await fetch(`${GRAPH_BASE}/$batch`, { method:'POST',
      headers:{ Authorization:'Bearer '+t, 'Content-Type':'application/json' },
      body: JSON.stringify({ requests: chunk }) });
    const b = await res.json();
    out.push(...(b.responses || []));
  }
  return out.sort((a,b) => Number(a.id) - Number(b.id));
}

/* ============================================================
   状態
   ============================================================ */
let PEOPLE = [], RES = [], COMMON = [];
/* ★読み込みの追い越し対策★
   loadRes は await をまたいで RES に push する。2つ同時に走ると同じ予定が
   2回入る（営業車の画面で「読めた 26人ぶん / 全13台」のような形で実際に出た）。
   日付の移動・表示の切替・5分ごとの自動更新・空き検索が重なると起きる。
   呼び出しに番号を振って、追い越された古い結果は捨てる。 */
let LOAD_SEQ = 0;
let VIEW = 'day';
let curWeek = weekTopMs(Date.now());
let curDay  = dayTopMs(Date.now());
let SEEK = null, HILITE = null;
let lastLoad = 0, refreshTimer = null;
let SRC = { ok:0, ng:0, errs:[], withSubject:0, items:0, depOk:false, excluded:[], alsoMiss:[], commonErr:'' };

const el = id => document.getElementById(id);

  }

  return {
    deps: (u.get('deps') || u.get('dep') || '').split(',').map(s => s.trim()).filter(Boolean),

  };
}

  const u = new URLSearchParams();

  if (DEPSEL.size && DEPSEL.size < DEP_KEYS.length) u.set('deps', [...DEPSEL].join(','));

/* ============================================================
   名簿：全社員チームのメンバー
   ------------------------------------------------------------
   入退社はチームのメンバーシップに追従するので、名簿を手で保守しない。
   部署は User.Read.All が必要。取れなければ「部署なし」でまとめて動かす。
   ============================================================ */
async function loadPeople(){
  const base = `/groups/${GROUP_ID}/members/microsoft.graph.user`;
  const full = `${base}?$select=id,displayName,mail,userPrincipalName,department,jobTitle,officeLocation&$top=999`;
  let items;
  try { items = await gGetAll(full); SRC.depOk = true; }
  catch (e) {
    /* User.Read.All が無いと department で 403 になる。部署なしで続行する */
    SRC.errs.push('部署の取得に失敗（User.Read.All 未付与の可能性）：' + (e.status || e.message));
    items = await gGetAll(`${base}?$select=id,displayName,mail,userPrincipalName&$top=999`);
    SRC.depOk = false;
  }
  const all = items.map(u => ({
    id  : u.id,
    n   : u.displayName || u.userPrincipalName || '(名前なし)',
    /* mail が無ければ UPN で代用する（getSchedule には UPN でも通る）。
       ただし「mail があるか」は別に覚えておく＝メールボックスの有無の判定に使う。 */
    mail: (u.mail || u.userPrincipalName || '').trim(),
    hasMailbox: !!(u.mail && String(u.mail).trim()),
    dep : (u.department || '').trim(),
    site: (u.officeLocation || '').trim(),   /* 拠点。役員／本社／工場 */
    job : (u.jobTitle || '').trim(),
    src : 'none'
  })).filter(p => p.mail);

  /* 人ではないアカウントを外す。外した中身と理由を控えてパネルに出す */
  SRC.excluded = all.map(p => ({ ...p, why: whyNotPerson(p) })).filter(p => p.why);
  PEOPLE = all.filter(p => !whyNotPerson(p));

  /* 拠点 → 部署 → 氏名 の順。安定ソートなので3回かけて積む。
     「部署なし」「拠点なし」は必ず最後。'んんん' のような番兵は ja の
     かな＜漢字の並びで先頭に来てしまうので、有無で明示的に分ける。 */
  PEOPLE.sort((a,b) => a.n.localeCompare(b.n, 'ja'));
  PEOPLE.sort((a,b) => {
    if (!a.dep !== !b.dep) return a.dep ? -1 : 1;
    return (a.dep || '').localeCompare(b.dep || '', 'ja');
  });
  PEOPLE.sort((a,b) => siteRank(a.site) - siteRank(b.site)
                    || (a.site || '').localeCompare(b.site || '', 'ja'));

  applyAlsoDeps();
}

/* 空白を落として比較する。姓名の順が逆でも同じ人として拾う */
function nameKeys(v){
  const t = String(v || '').trim().split(/[\s\u3000]+/).filter(Boolean);
  const out = new Set([t.join('').toLowerCase()]);
  if (t.length === 2) out.add((t[1] + t[0]).toLowerCase());
  return out;
}
/* 兼務表を名簿にあてる。p.deps＝出てくる部署の全部、p.also＝兼務ぶんだけ */
function applyAlsoDeps(){
  const hit = new Map();
  PEOPLE.forEach(p => {
    p.deps = p.dep ? [p.dep] : [];
    p.also = [];
    const keys = new Set([...nameKeys(p.n), String(p.mail || '').trim().toLowerCase()]);
    ALSO_DEPS.forEach(x => {
      const want = new Set([...nameKeys(x.who), String(x.who || '').trim().toLowerCase()]);
      if (![...want].some(k => k && keys.has(k))) return;
      hit.set(x, (hit.get(x) || 0) + 1);
      (x.deps || []).forEach(d => {
        if (!d || p.deps.includes(d)) return;
        p.deps.push(d); p.also.push(d);
      });
    });
  });
  SRC.alsoMiss = ALSO_DEPS.filter(x => !hit.has(x)).map(x => x.who);
}
/* ============================================================
   部署のトグル
   ------------------------------------------------------------
   DEPSEL＝いま表示する部署の集合。キーは部署名。
   部署が取れない人は '__none__' でまとめる（Entra の department が空）。

   ★初回の既定は「自分の部署だけ」★
     サインインした人を名簿から探して、その部署（兼務も含む）を入れる。
     名簿に見つからなければ全部入れる。何も出ないより良い。
   ★覚えるのはこのブラウザだけ★
     localStorage は端末・ブラウザごと。別のPCでは既定に戻る。
     読み書きは try/catch で囲む（サイトデータをブロックしている設定だと
     参照そのものが例外になる。値が無いのと同じ扱いにして先へ進める）。
   ★アドレスごとに分けて覚える★ 工場の共用PCで人が入れ替わる。
   ★URL に部署が入っていればそれを使う★ 共有されたリンクを開いたときに
     自分の既定で上書きしてしまうと、送った人と違う画面が出る。
     ただし URL で来た内容は覚えない（人の設定を書き換えないため）。
   ============================================================ */
let DEPSEL     = new Set();
let DEP_KEYS   = [];          /* 全部署のキー。画面に出る順 */
let DEP_GROUPS = [];          /* [{ site, keys:[...] }] 拠点ごとのまとまり */
const DEP_SITE = new Map();   /* 部署 → 主な拠点 */
const DEP_LS   = 'hanaoka.staff.deps.v1';

function lsAll(){
  try { const v = JSON.parse(localStorage.getItem(DEP_LS) || '{}'); return (v && typeof v === 'object') ? v : {}; }
  catch { return {}; }
}
function lsMe(){ return String(currentAccount?.username || '').toLowerCase() || '(anon)'; }
function saveDepSel(){
  try { const a = lsAll(); a[lsMe()] = [...DEPSEL]; localStorage.setItem(DEP_LS, JSON.stringify(a)); }
  catch { /* 保存できなくても画面は動く。次に開いたとき既定に戻るだけ */ }
}
function loadDepSel(){
  const v = lsAll()[lsMe()];
  return Array.isArray(v) ? v : null;     /* null＝一度も保存していない */
}

function inDepKey(p, key){
  /* ★「部署なし」は元の部署で見る★ 兼務表で足した部署は所属ではないので、
     ここで数えると、部署が取れていない人が「部署なし」から消えてしまう
     （User.Read.All が無いテナントで、兼務表の人だけ行方不明になる）。 */
  if (key === '__none__') return !p.dep;
  return (p.deps || []).includes(key);
}
/* 表示するかどうか。1つも選んでいなければ誰も出さない（空の表を出す）。
   ★勝手に全員に戻さない★ 「なし」にしたのに全員出てきたら、
   押した意味が分からなくなる。空なのは画面の文言で分かるようにする。 */
function inSel(p){
  if (!DEP_KEYS.length) return true;      /* 部署の情報がまったく無いテナント */
  return DEP_KEYS.some(k => DEPSEL.has(k) && inDepKey(p, k));
}

function buildDepGroups(){
  const deps = [...new Set(PEOPLE.flatMap(p => p.deps || []).filter(Boolean))]
    .sort((a,b) => a.localeCompare(b,'ja'));
  DEP_SITE.clear();
  const bySite = new Map();
  deps.forEach(d => {
    /* ★その部署の人がいちばん多い拠点に置く★ 部署が拠点をまたいでいても
       チップは1か所にだけ出す。同じキーを2か所に出すと、片方を押したときに
       もう片方が付いてこないように見えて壊れて見える。 */
    const c = new Map();
    PEOPLE.forEach(p => { if (inDepKey(p, d)) c.set(p.site || '', (c.get(p.site || '') || 0) + 1); });
    const s = [...c.entries()].sort((a,b) => b[1] - a[1] || siteRank(a[0]) - siteRank(b[0]))[0]?.[0] || '';
    DEP_SITE.set(d, s);
    if (!bySite.has(s)) bySite.set(s, []);
    bySite.get(s).push(d);
  });
  DEP_GROUPS = [...bySite.keys()]
    .sort((a,b) => siteRank(a) - siteRank(b) || (a || '').localeCompare(b || '', 'ja'))
    .map(s => ({ site: s, keys: bySite.get(s) }));
  /* 部署が取れない人。User.Read.All が無いと全員ここに入る */
  if (PEOPLE.some(p => !p.dep)) {
    const tail = DEP_GROUPS.find(g => !g.site);
    if (tail) tail.keys.push('__none__'); else DEP_GROUPS.push({ site:'', keys:['__none__'] });
  }
  DEP_KEYS = DEP_GROUPS.flatMap(g => g.keys);
}

/* サインインしている人の部署。名簿に居なければ空 */
function myDepKeys(){
  const me = String(currentAccount?.username || '').toLowerCase();
  const p = PEOPLE.find(x => (x.mail || '').toLowerCase() === me);
  if (!p) return [];
  const ks = (p.deps || []).filter(d => DEP_KEYS.includes(d));
  if (ks.length) return ks;
  return DEP_KEYS.includes('__none__') ? ['__none__'] : [];
}

/* ①URL ②このブラウザの記憶 ③自部署 ④全部 の順に決める */
function initDepSel(want){
  const ok = a => (a || []).filter(k => DEP_KEYS.includes(k));
  if (want && want.deps && want.deps.length) {
    const k = ok(want.deps);
    if (k.length) { DEPSEL = new Set(k); return; }
  }
  const st = loadDepSel();
  if (st) {
    const k = ok(st);
    /* 覚えていた部署が1つも今の名簿に無い＝部署名が変わった。既定に戻す。
       （空で保存したとき＝「なし」を選んだときは、その空を尊重する） */
    if (k.length || !st.length) { DEPSEL = new Set(k); return; }
  }
  const mine = myDepKeys();
  DEPSEL = new Set(mine.length ? mine : DEP_KEYS);
}

function paintDepToggles(){
  let h = '';
  DEP_GROUPS.forEach((g, gi) => {
    const all = g.keys.every(k => DEPSEL.has(k));
    h += `<div class="dgrp"><button type="button" class="site" data-grp="${gi}"`
       + ` title="${esc(g.site || 'その他')}をまとめて${all ? '外します' : '出します'}">`
       + `${esc(g.site || 'その他')}</button>`;
    g.keys.forEach(k => {
      const on = DEPSEL.has(k);
      h += `<label class="dtog${on ? ' on' : ''}">`
         + `<input type="checkbox" data-dep="${esc(k)}"${on ? ' checked' : ''}>`
         + `${esc(k === '__none__' ? '部署なし' : k)}`
         + `<span class="num">${PEOPLE.filter(p => inDepKey(p, k)).length}</span></label>`;
    });
    h += `</div>`;
  });
  el('depToggles').innerHTML = h;
  el('depCnt').innerHTML = DEPSEL.size
    ? `${DEPSEL.size}/${DEP_KEYS.length}部署　${PEOPLE.filter(p => inSel(p)).length}人`
    : `<span class="ng" style="color:var(--danger);font-weight:700">部署が1つも選ばれていません</span>`;
}

/* その人をどの見出しの下に出すか。
   兼務の人は、選ばれている部署の見出しに入れる。元の部署の見出しに入れると、
   出していない部署名が結果に混ざって見える。
   ★元の部署が選ばれていればそちらを優先★ 所属はあくまで元の部署。 */
function depOf(p){
  if (p.dep && DEPSEL.has(p.dep)) return p.dep;
  return (p.deps || []).find(d => DEPSEL.has(d)) || p.dep;
}
/* 兼務の部署で出しているときは、その部署の拠点の下に入れる。
   元の拠点のままだと「役員 └ 販売企画室」のような見出しになる
   （花岡 雅さんは所属が役員・兼務が本社の販売企画室）。 */
function siteOf(p){
  const d = depOf(p);
  return (d && d !== p.dep) ? (DEP_SITE.get(d) || p.site) : p.site;
}

/* ============================================================
   予定：getSchedule
   ------------------------------------------------------------
   件名が返るかは相手の予定表の権限に依存する（LimitedDetails 以上）。
   1件も件名が取れていなければ権限不足なので、パネルに明示する。
   ============================================================ */
function viewRange(){
  /* 一覧は週と同じ範囲を見る（日ごとに縦に積むだけで、扱う期間は週） */
  if (VIEW === 'day') return [curDay, curDay + DAY];
  return [curWeek, curWeek + WK];
}

async function loadRes(){
  const seq = ++LOAD_SEQ;
  const [v0, v1] = viewRange();
  let f0 = v0, f1 = v1;
  if (SEEK) { f0 = Math.min(f0, SEEK.s); f1 = Math.max(f1, SEEK.e); }

  SRC = { ...SRC, ok:0, ng:0, errs:SRC.errs.filter(x => x.startsWith('部署')), withSubject:0, items:0 };
  RES = [];
  if (!PEOPLE.length) return;

  const body = mails => ({
    schedules: mails,
    startTime: { dateTime: toUtcLocal(f0), timeZone: 'UTC' },
    endTime:   { dateTime: toUtcLocal(f1), timeZone: 'UTC' },
    availabilityViewInterval: VIEW === 'day' ? 30 : 60
  });

  const chunks = [];
  for (let i = 0; i < PEOPLE.length; i += CHUNK) chunks.push(PEOPLE.slice(i, i + CHUNK));

  /* ★会社共通予定表を同じ $batch に載せる★ 往復を増やさない。
     ID で対応づけるので、返る順番に依存しない（Graph は順番を保証しない）。 */
  const COMMON_IX = chunks.length;
  const cq = `startDateTime=${encodeURIComponent(toUtcLocal(f0) + 'Z')}`
           + `&endDateTime=${encodeURIComponent(toUtcLocal(f1) + 'Z')}`
           + `&$select=id,subject,start,end,location,isCancelled,isAllDay,showAs`
           + `&$orderby=start/dateTime&$top=200`;

  const reqs = chunks.map(c => ({
    method: 'POST',
    url: '/me/calendar/getSchedule',
    headers: { 'Content-Type': 'application/json', Prefer: 'outlook.timezone="UTC"' },
    body: body(c.map(p => p.mail))
  }));

  reqs.push({
    method: 'GET',
    url: `/users/${encodeURIComponent(COMMON_CAL.mail)}/calendarView?${cq}`,
    headers: { Prefer: 'outlook.timezone="UTC"' }
  });

  const res = await gBatch(reqs);
  if (seq !== LOAD_SEQ) return;          /* 追い越された。この結果は使わない */

  res.forEach(r => {
    /* ★添字ではなく id で対応づける★
       $batch の応答は要求と同じ順で返る保証がない。順番に頼ると、
       別の人の予定が誰かの行に入りうる。 */
    const ci = Number(r.id);
    if (ci === COMMON_IX) { takeCommon(r); return; }
    const group = chunks[ci];
    if (!group) return;
    if (r.status !== 200 || !r.body || !Array.isArray(r.body.value)) {
      SRC.ng += group.length;
      group.forEach(p => p.src = 'error');
      SRC.errs.push(`${group.length}人ぶん取得失敗：[${r.status}] ${r.body?.error?.code || ''}`);
      return;
    }
    r.body.value.forEach((sc, i) => {
      const person = group[i] || group.find(p => p.mail.toLowerCase() === String(sc.scheduleId||'').toLowerCase());
      if (!person) return;
      if (sc.error) { SRC.ng++; person.src = 'error';
        SRC.errs.push(`${person.n}：${sc.error.message || sc.error.responseCode || 'エラー'}`); return; }
      SRC.ok++; person.src = 'ok';
      (sc.scheduleItems || []).forEach(it => {
        const s = pTZ(it.start), e = pTZ(it.end);
        if (isNaN(s) || isNaN(e)) return;
        const status = it.status || 'unknown';
        if (status === 'free') return;                 /* 空きは占有ではない */
        SRC.items++;
        const priv = !!it.isPrivate;
        const subj = priv ? '' : (it.subject || '');
        if (subj) SRC.withSubject++;
        RES.push({
          rid : `${person.mail}|${s}|${e}`,
          who : person.n, mail: person.mail, dep: person.dep,
          s, e, status,
          priv,
          t   : priv ? '非公開' : (subj || '(件名なし)'),
          loc : priv ? '' : (it.location || '')
        });
      });
    });
  });
}

/* 会社共通予定表の取り込み。人の予定（RES）とは混ぜない。 */
function takeCommon(r){
  COMMON = [];
  if (r.status !== 200 || !r.body || !Array.isArray(r.body.value)) {
    SRC.commonErr = `[${r.status}] ${r.body?.error?.code || r.body?.error?.message || ''}`;
    return;
  }
  SRC.commonErr = '';
  r.body.value.forEach(ev => {
    if (ev.isCancelled) return;
    const { s, e } = evRange(ev);
    if (isNaN(s) || isNaN(e)) return;
    COMMON.push({
      rid : `c:${ev.id}`,
      who : COMMON_CAL.name, mail: COMMON_CAL.mail, dep: '',
      s, e,
      /* ★状態で色を分けない★ 会社の予定は「誰かの空き」ではないので、
         予定あり／不在の区別に意味がない。1色にして人の行と見分けさせる。 */
      status: 'common',
      priv: false,
      allDay: !!ev.isAllDay,
      t   : ev.subject || '(件名なし)',
      loc : (ev.location && ev.location.displayName) || ''
    });
  });
  COMMON.sort((a, b) => a.s - b.s || a.e - b.e);
}

/* ============================================================
   準備状況パネル（管理者だけ。異常時は全員に1行）
   ============================================================ */
function paintPanel(){
  const p = el('status-panel');
  const bad = SRC.ng > 0 || SRC.errs.length > 0 || (SRC.alsoMiss || []).length > 0 || !!SRC.commonErr;
  if (!IS_ADMIN){
    if (!bad) { p.style.display = 'none'; return; }
    p.style.display = ''; p.className = 'bad';
    p.innerHTML = `<b class="ng">一部の人の予定を取得できていません</b>`
      + `<div class="st-row">取得できなかった人の行には「読めず」の印が付きます。総務部までご連絡ください。</div>`;
    return;
  }
  p.style.display = '';
  p.className = bad ? 'bad' : (SRC.items && !SRC.withSubject ? 'warn' : '');
  let h = `<div><b>取得状況</b></div>`
    + `<div class="st-row">名簿：<span class="ok">${PEOPLE.length}人</span>`
    + `<span style="color:var(--muted)">全社員チームのメンバー</span>`
    + (SRC.excluded.length
        ? `　除外：<span class="ok">${SRC.excluded.length}件</span>`
          + `<span style="color:var(--muted)">予定表を持たない／人ではないアカウント</span>`
        : '')
    + `　部署：${SRC.depOk ? '<span class="ok">取得OK</span>' : '<span class="ng">取得できず</span>（<code>User.Read.All</code> 未付与）'}</div>`
    + `<div class="st-row">予定：読めた <span class="${SRC.ng?'ng':'ok'}">${SRC.ok}人</span> / 読めず ${SRC.ng}人`
    + `　この期間の予定 ${SRC.items}件</div>`
    + `<div class="st-row">件名：<span class="${SRC.withSubject?'ok':'ng'}">${SRC.withSubject}件</span>`
    + (SRC.items && !SRC.withSubject
        ? ` — <b>1件も取れていません。</b>予定表の既定権限が <code>LimitedDetails</code> 未満です。`
          + `<code>Set-StaffCalendarPermission.ps1 -GrantLimitedDetails</code> を実行してください`
        : `（非公開の予定は件名が出ません）`) + `</div>`;
  if (SRC.commonErr){
    h += `<div class="st-row"><span class="ng">会社共通予定表が読めません</span>`
       + `<code>${esc(COMMON_CAL.mail)}</code><span style="color:var(--muted)">`
       + `${esc(SRC.commonErr)} — 予定表の既定のアクセス許可が Reviewer 以上か確認してください</span></div>`;
  }
  if ((SRC.alsoMiss || []).length){
    /* ★黙って無視しない★ 氏名が変わった・名簿に居ない、のどちらか。
       出しておかないと「兼務表に書いたのに出てこない」で止まる。 */
    h += `<div class="st-row"><span class="ng">兼務表に書いた人が名簿に見つかりません：`
       + `${esc(SRC.alsoMiss.join('、'))}</span>`
       + `<span style="color:var(--muted)">氏名が変わったか、全社員チームに居ません。`
       + `<code>ALSO_DEPS</code> を直してください</span></div>`;
  }
  if (SRC.excluded.length){
    h += `<details><summary>名簿から外したアカウント ${SRC.excluded.length}件</summary><pre>`
       + esc(SRC.excluded.map(x => `${x.n}\n    ${x.mail}\n    → ${x.why}`).join('\n'))
       + '\n\n「メールボックスなし」＝予定表を持てないアカウント（システム管理用など）。\n'
       + '「共有・RPA用」＝人ではないアカウント。\n'
       + 'ここに人が混ざっていたら EXCLUDE_MAILS / EXCLUDE_RE を直してください。'
       + `</pre></details>`;
  }
  if (SRC.errs.length){
    h += `<details><summary>取得できなかった理由（${SRC.errs.length}件）</summary><pre>${esc(SRC.errs.slice(0,40).join('\n'))}`
      + (SRC.errs.length>40 ? `\n… 他 ${SRC.errs.length-40} 件` : '') + `</pre></details>`;
  }
  p.innerHTML = h;
}

/* ============================================================
   読み込み
   ============================================================ */
async function loadAll(want){
  el('status-panel').style.display = '';
  el('status-panel').className = '';
  el('status-panel').textContent = '読み込み中...';
  try {
    if (!PEOPLE.length) {
      await loadPeople();
      buildDepGroups();
      initDepSel(want);
      paintDepToggles();
      if (want && want.q) el('q').value = want.q;
    }
    await loadRes();
  } catch (e) {
    el('status-panel').className = 'bad';
    el('status-panel').innerHTML = `<b class="ng">読み込みに失敗しました</b><br><code>${esc(e.message)}</code>`
      + `<div class="st-row" style="color:var(--muted)">GroupMember.Read.All / Calendars.Read.Shared の同意が済んでいるか確認してください。</div>`;
    return;
  }
  lastLoad = Date.now();
  paintPanel(); render(); paintSeek(); paintOof(); paintUpdated();
}

/* ============================================================
   今日の不在者
   ============================================================ */
function paintOof(){
  const p = el('oof-panel');
  const [v0, v1] = viewRange();
  /* ★不在の一覧も「表示している部署」に合わせる★
     出していない部署の人が40人並ぶと、自分に関係のある不在が埋もれる。
     部署のトグルと食い違う一覧を2つ置かない。 */
  const sel = new Set(PEOPLE.filter(x => inSel(x)).map(x => x.mail));
  const oof = RES.filter(r => r.status === 'oof' && r.e > v0 && r.s < v1 && sel.has(r.mail));
  if (!oof.length) { p.style.display = 'none'; return; }
  const byWho = new Map();
  oof.forEach(r => { if (!byWho.has(r.who)) byWho.set(r.who, r); });
  const label = VIEW === 'day' ? `${jKey(curDay).replace(/-/g,'/')} の不在・休暇`
                               : 'この週の不在・休暇';   /* 週・一覧は同じ範囲 */
  p.innerHTML = `<h4>${label}　${byWho.size}人</h4><div class="grp-line">`
    + [...byWho.entries()].map(([who, r]) =>
        `<span class="chip oof${who === HILITE ? ' on' : ''}" data-who="${esc(who)}" title="${esc(r.t)} ${jFull(r.s)}〜${jFull(r.e)}">${esc(who)}</span>`
      ).join('')
    + `</div>`;
  p.style.display = 'block';
}

/* ============================================================
   空いている人を探す
   ============================================================ */
function parseSeek(){
  const s = localToMs(el('sFrom').value), e = localToMs(el('sTo').value);
  if (isNaN(s) || isNaN(e) || e <= s) return null;
  return { s, e };
}
async function runSeek(){
  const r = parseSeek();
  if (!r) { showSnack('開始と終了を入れてください（終了は開始より後）'); return; }
  SEEK = r;
  if (VIEW === 'day') curDay = dayTopMs(r.s); else curWeek = weekTopMs(r.s);
  await loadRes(); lastLoad = Date.now();
  paintPanel(); render(); paintSeek(); paintOof(); paintUpdated(); writeUrl();
}
function clearSeek(){
  SEEK = null; HILITE = null;
  el('sFrom').value = msToLocal(dayTopMs(Date.now()) + 13*3600e3);
  el('sTo').value   = msToLocal(dayTopMs(Date.now()) + 14*3600e3);
  render(); paintSeek(); paintOof();
}
function paintSeek(){
  const p = el('seek-panel');
  if (!SEEK) { p.style.display = 'none'; return; }
  /* 仮の予定は「空き」に数えない。別の場所で勤務は打合せ可なので空き扱い */
  const busyWho = new Set(RES.filter(r => ['busy','tentative','oof'].includes(r.status)
                                       && overlaps(r, SEEK.s, SEEK.e)).map(r => r.mail));
  /* ★探す相手は「表示している部署」だけ★ 見ている範囲と探す範囲を合わせる。
     全員から探すと、出していない部署の人が結果に出てきて驚く。 */
  const target = PEOPLE.filter(x => inSel(x));
  const free = target.filter(x => !busyWho.has(x.mail));
  const busy = target.filter(x =>  busyWho.has(x.mail));

  let h = `<h4>${jFull(SEEK.s)} 〜 ${jFull(SEEK.e)}　空いている人 ${free.length}人 / 対象 ${target.length}人`
        + `<span class="cnt">（表示している部署のみ）</span></h4>`;
  if (!target.length) h += `<div class="none">表示する部署が選ばれていないので、探す相手がいません</div>`;
  else if (!free.length) h += `<div class="none">この区間に空いている人はいません</div>`;
  else [...new Set(free.map(x => x.dep))].forEach(D => {
    h += `<div class="grp-line"><b>${esc(D || '部署なし')}</b>`
      + free.filter(x => x.dep === D)
            .map(x => `<span class="chip${x.n === HILITE ? ' on' : ''}" data-who="${esc(x.n)}">${esc(x.n)}</span>`).join('')
      + `</div>`;
  });
  if (busy.length && busy.length <= 40) {
    h += `<div class="grp-line" style="margin-top:8px"><b>予定あり</b>`
      + busy.map(x => {
          const r = RES.find(y => y.mail === x.mail && overlaps(y, SEEK.s, SEEK.e));
          return `<span class="chip busy${x.n === HILITE ? ' on' : ''}" data-who="${esc(x.n)}"`
               + ` title="${esc(r ? r.t : '')} ${r ? jHM(r.s)+'–'+jHM(r.e) : ''}">${esc(x.n)}</span>`;
        }).join('')
      + `<span class="cnt">名前にマウスを乗せると何の予定か出ます</span></div>`;
  } else if (busy.length) {
    h += `<div class="grp-line"><b>予定あり</b><span class="cnt">${busy.length}人（多いので一覧は省略）</span></div>`;
  }
  h += `<div class="cnt" style="margin-top:7px">名前をクリックすると、その行を目立たせて表へスクロールします</div>`;
  p.innerHTML = h;
  p.style.display = 'block';
}

/* ============================================================
   描画
   ============================================================ */
function visiblePeople(inView){
  const q = el('q').value.trim().toLowerCase();
  let list = PEOPLE.filter(p =>
    inSel(p) &&
    (!q || p.n.toLowerCase().includes(q) || (p.deps||[]).join(' ').toLowerCase().includes(q)));
  if (el('onlybusy').checked){
    const has = new Set(inView.map(r => r.mail));
    list = list.filter(p => has.has(p.mail));
  }
  /* ★並びは「出している部署」で決める★ 兼務の人は選ばれている部署の下に
     出すので、PEOPLE の並び（元の部署の順）のままだと、同じ見出しが
     2回出たり、別の部署の人が前の見出しにぶら下がって見える。 */
  list = list.slice().sort((a,b) =>
       siteRank(siteOf(a)) - siteRank(siteOf(b))
    || (siteOf(a) || '').localeCompare(siteOf(b) || '', 'ja')
    || (!depOf(a) !== !depOf(b) ? (depOf(a) ? -1 : 1) : 0)   /* 部署なしは最後 */
    || (depOf(a) || '').localeCompare(depOf(b) || '', 'ja')
    || a.n.localeCompare(b.n, 'ja'));
  return list;
}
function resOf(person, v0, v1){
  return RES.filter(r => r.mail === person.mail && r.e > v0 && r.s < v1).sort((a,b) => a.s - b.s);
}
function laneAssign(rs){
  const lanes = [];
  rs.forEach(r => {
    let i = lanes.findIndex(l => l.every(x => x.e <= r.s || x.s >= r.e));
    if (i < 0) { lanes.push([r]); i = lanes.length - 1; } else lanes[i].push(r);
    r._l = i;
  });
  return Math.max(1, lanes.length);
}
function srcBadge(p){
  if (p.src === 'error') return `<span class="badge b-err">読めず</span>`;
  return '';
}
function barHtml(r, L, R, cutL, cutR){
  const cls = [ (ST[r.status] || ST.unknown)[1], cutL?'cut-l':'', cutR?'cut-r':'' ].join(' ');
  /* 表示範囲の外まで続く予定は、始まりや終わりが「その日の時刻」ではない。
     そのまま 22:00–02:00 と出すと4時間の夜間予定に見えてしまうので、
     切れている側は「…」にする。正確な日時は帯をクリックすれば出る。 */
  /* ★終日は「00:00–00:00」ではなく「終日」と出す★
     終日の予定は 0:00 から翌 0:00 までなので、そのまま時刻を出すと
     0時に始まって0時に終わる1分の予定に見える。 */
  const tm = (r.allDay || (cutL && cutR)) ? '終日'
           : cutL ? `…–${jHM(r.e)}`
           : cutR ? `${jHM(r.s)}–…`
           : `${jHM(r.s)}–${jHM(r.e)}`;
  return `<div class="bar-i ${cls}" style="left:${L}%;width:${Math.max(R-L,0.6)}%;top:calc(var(--lane)*${r._l} + 3px)"
    data-r="${esc(r.rid)}" title="${esc(r.t)}　${jFull(r.s)} 〜 ${jFull(r.e)}">
    <span class="tm">${tm}</span><b>${esc(r.t)}</b></div>`;
}
/* ============================================================
   会社共通予定表の行（表のいちばん上に固定）
   ------------------------------------------------------------
   人ではないので、部署の絞り込み・氏名検索・「予定がある人だけ」の
   どれにも従わない。常に先頭に出す。
   ★読めなかったときは黙って空にしない★ 「読めず」を出す。
     空の行と区別がつかないと、休業日を見落として予約を入れてしまう。
   ============================================================ */
function commonNameCell(n){
  return `<div class="name" style="min-height:calc(var(--lane)*${n})">
      <div class="mn">${esc(COMMON_CAL.name)}</div><div class="meta">
      <span class="badge b-cmn">全社</span>
      ${SRC.commonErr ? '<span class="badge b-err">読めず</span>' : ''}
      </div></div>`;
}
/* 週・日で共通。bgHtml は背景セル、posOf は帯の左右を % で返す */
function commonRow(v0, v1, now, bgHtml, posOf){
  const rs = COMMON.filter(r => r.e > v0 && r.s < v1).sort((a,b) => a.s - b.s);
  const n  = laneAssign(rs);
  let h = `<div class="row cmn" data-who="${esc(COMMON_CAL.name)}">` + commonNameCell(n)
        + `<div class="days" style="height:calc(var(--lane)*${n})"><div class="bgs">`
        + bgHtml + `</div><div class="bars">`;
  rs.forEach(r => {
    const [L, R] = posOf(r);
    if (R <= 0 || L >= 100) return;
    h += barHtml(r, L, R, r.s < v0, r.e > v1);
  });
  if (now >= v0 && now < v1) {
    const [nl] = posOf({ s:now, e:now });
    h += `<div class="nowline" style="left:${nl}%"></div>`;
  }
  return h + `</div></div></div>`;
}

function nameCell(p, rs, n){
  return `<div class="name" style="min-height:calc(var(--lane)*${n})">
      <div class="mn">${esc(p.n)}</div><div class="meta">
      ${p.dep ? `<span class="badge b-dep">${esc(p.dep)}</span>` : ''}
      ${(p.also||[]).map(d => `<span class="badge b-also" title="兼務">${esc(d)}（兼務）</span>`).join('')}${srcBadge(p)}
      ${rs.some(r => r.status === 'oof') ? '<span class="badge b-oof">不在</span>' : ''}
      ${rs.length ? '' : '<span class="badge b-free">予定なし</span>'}
      </div></div>`;
}

function render(){ VIEW === 'list' ? renderList() : VIEW === 'week' ? renderWeek() : renderDay(); }

/* 拠点／部署の見出し。★週と一覧の両方から呼ぶ★
   片方だけ直すと同じ画面で並び順が食い違うので、1か所にまとめてある。
   拠点が変わったら部署の記憶も捨てる。捨てないと、拠点をまたいで同名の
   部署（例：総務部）が続いたときに小見出しが出ず、別の拠点の人が
   前の見出しの下にぶら下がって見える。 */
function grpHtml(p, list, st){
  let h = '';
  const sv = siteOf(p), dv = depOf(p);
  if (sv !== st.site) {
    st.site = sv; st.dep = null;
    h += `<div class="grp"><span>${esc(sv || '拠点が未設定')}`
       + `（${list.filter(x => siteOf(x) === sv).length}）</span></div>`;
  }
  if (dv !== st.dep) {
    st.dep = dv;
    /* 役員のように拠点＝部署のときは小見出しを出さない（同じ言葉が2行続く）。
       ★ただしその拠点に部署が2種類以上あるときは必ず出す★
         出さないと、後ろに続く人が前の小見出しの下にぶら下がって見える。
         部署が取れないテナント（User.Read.All 未付与）で、兼務表の人だけが
         部署名を持つ——という形でこれに当たる。 */
    const many = new Set(list.filter(x => siteOf(x) === sv).map(x => depOf(x) || '')).size > 1;
    if (many || (dv || '') !== (sv || '')) {
      h += `<div class="grp2"><span>${esc(dv || '部署なし')}`
         + `（${list.filter(x => siteOf(x) === sv && depOf(x) === dv).length}）</span></div>`;
    }
  }
  return h;
}

/* 曜日の見出し（週と一覧で共通）。押すとその日だけの時間割に飛ぶ。 */
function headHtml(days, label, todayKey){
  let h = `<div class="hrow"><div class="hname">${label}</div><div class="hdays">`;
  days.forEach(ms => {
    const d = toJ(ms), dow = d.getUTCDay();
    const c = [dow===6?'sat':'', dow===0?'sun':'', jKey(ms)===todayKey?'today':''].join(' ');
    h += `<div class="hd clk ${c}" data-d="${jKey(ms)}" title="クリックするとこの日だけ表示します">`
       + `<div class="dow">${DOW[dow]}</div><div class="dnum">${d.getUTCDate()}</div></div>`;
  });
  return h + `</div></div>`;
}

/* ============================================================
   一覧（gridy風）
   ------------------------------------------------------------
   1件を1行の文字として積む。日をまたぐ予定は、またいだ日すべてに出す
   （その日を丸ごと覆っていれば「終日」、片側だけ切れていれば「…」）。
   ★その日を覆う予定を先に出す★
     時刻順だけで並べると、月曜の朝から水曜まで続く出張が
     月曜の 09:00 の予定より下に来ることがあり、その日の全体像が
     いちばん下まで読まないと分からなくなる。
   ============================================================ */
function coversDay(r, d0, d1){ return (r.s <= d0 && r.e >= d1) ? 0 : 1; }
function liHtml(r, d0, d1){
  const cutL = r.s < d0, cutR = r.e > d1;
  /* その日を丸ごと覆っていれば「終日」。0:00〜翌0:00 をそのまま出さない */
  const tm = (r.s <= d0 && r.e >= d1) ? '終日'
           : (cutL && cutR) ? '終日'
           : cutL ? `…–${jHM(r.e)}`
           : cutR ? `${jHM(r.s)}–…`
           : `${jHM(r.s)}–${jHM(r.e)}`;
  const hit = (SEEK && overlaps(r, SEEK.s, SEEK.e)) ? ' hit' : '';
  return `<div class="li ${(ST[r.status] || ST.unknown)[1]}${hit}" data-r="${esc(r.rid)}"
      title="${esc(r.t)}　${jFull(r.s)} 〜 ${jFull(r.e)}">`
    + `<span class="tm">${tm}</span><b>${esc(r.t)}</b></div>`;
}

function renderList(){
  const now = Date.now(), w0 = curWeek, w1 = w0 + WK;
  const days = Array.from({length:7}, (_,i) => w0 + i*DAY);
  el('range').textContent = `${jKey(w0).replace(/-/g,'/')} 〜 ${jKey(w0+6*DAY).replace(/-/g,'/')}`;
  el('lg-note').textContent = '│ 時刻順に並べた一覧です。クリックすると詳細が出ます。'
    + '上の日付を押すとその日だけの時間割になります';
  const g = el('grid'); g.className = 'grid ls';

  const inView = RES.filter(r => r.e > w0 && r.s < w1);
  const list = visiblePeople(inView);
  el('cnt').textContent = `表示 ${list.length}人 / 全 ${PEOPLE.length}人　この週の予定 ${inView.length}件`;

  const todayKey = jKey(now);
  let h = headHtml(days, `氏名（${list.length}）`, todayKey);
  if (!list.length) h += `<div class="empty">条件に合う人がいません</div>`;

  /* 会社共通予定表は先頭に固定 */
  {
    const rs = COMMON.filter(r => r.e > w0 && r.s < w1);
    let c = `<div class="row cmn" data-who="${esc(COMMON_CAL.name)}">`
          + commonNameCell(0) + `<div class="days">`;
    days.forEach(ms => {
      const d0 = ms, d1 = ms + DAY, d = toJ(ms), dow = d.getUTCDay();
      const cls = [dow===6?'sat':'', dow===0?'sun':'', jKey(ms)===todayKey?'today':''].join(' ');
      const items = rs.filter(r => r.e > d0 && r.s < d1)
        .sort((a,b) => (coversDay(a,d0,d1) - coversDay(b,d0,d1)) || (a.s - b.s) || (a.e - b.e));
      c += `<div class="dcell ${cls}">` + items.map(r => liHtml(r, d0, d1)).join('') + `</div>`;
    });
    h += c + `</div></div>`;
  }

  const gst = { site:null, dep:null };
  list.forEach(p => {
    h += grpHtml(p, list, gst);
    const rs = resOf(p, w0, w1);
    h += `<div class="row${p.n === HILITE ? ' hi' : ''}" data-who="${esc(p.n)}">`
       + nameCell(p, rs, 0) + `<div class="days">`;
    days.forEach(ms => {
      const d0 = ms, d1 = ms + DAY, d = toJ(ms), dow = d.getUTCDay();
      const c = [dow===6?'sat':'', dow===0?'sun':'', jKey(ms)===todayKey?'today':''].join(' ');
      const items = rs.filter(r => r.e > d0 && r.s < d1)
        .sort((a,b) => (coversDay(a,d0,d1) - coversDay(b,d0,d1)) || (a.s - b.s) || (a.e - b.e));
      h += `<div class="dcell ${c}">` + items.map(r => liHtml(r, d0, d1)).join('') + `</div>`;
    });
    h += `</div></div>`;
  });
  g.innerHTML = h;
}

function renderWeek(){
  const now = Date.now(), w0 = curWeek, w1 = w0 + WK;
  const days = Array.from({length:7}, (_,i) => w0 + i*DAY);
  el('range').textContent = `${jKey(w0).replace(/-/g,'/')} 〜 ${jKey(w0+6*DAY).replace(/-/g,'/')}`;
  el('lg-note').textContent = '│ 帯の位置と幅は実時刻に比例（点線＝正午 JST）。上の日付をクリックするとその日だけ表示';
  const g = el('grid'); g.className = 'grid wk';

  const inView = RES.filter(r => r.e > w0 && r.s < w1);
  const list = visiblePeople(inView);
  el('cnt').textContent = `表示 ${list.length}人 / 全 ${PEOPLE.length}人　この週の予定 ${inView.length}件`;

  const todayKey = jKey(now);
  let h = headHtml(days, `氏名（${list.length}）`, todayKey);
  if (!list.length) h += `<div class="empty">条件に合う人がいません</div>`;

  /* 会社共通予定表は拠点の見出しより上。いちばん最初に描く */
  {
    let bg = '';
    days.forEach(ms => {
      const d = toJ(ms), dow = d.getUTCDay();
      const c = [dow===6?'sat':'', dow===0?'sun':'', jKey(ms)===todayKey?'today':''].join(' ');
      bg += `<div class="bg ${c}"></div>`;
    });
    h += commonRow(w0, w1, now, bg, r => [
      Math.max(0, (r.s - w0) / WK * 100), Math.min(100, (r.e - w0) / WK * 100)]);
  }

  const gst = { site:null, dep:null };
  list.forEach(p => {
    h += grpHtml(p, list, gst);
    const rs = resOf(p, w0, w1), n = laneAssign(rs);
    h += `<div class="row${p.n === HILITE ? ' hi' : ''}" data-who="${esc(p.n)}">` + nameCell(p, rs, n)
       + `<div class="days" style="height:calc(var(--lane)*${n})"><div class="bgs">`;
    days.forEach(ms => {
      const d = toJ(ms), dow = d.getUTCDay();
      const c = [dow===6?'sat':'', dow===0?'sun':'', jKey(ms)===todayKey?'today':''].join(' ');
      h += `<div class="bg ${c}"></div>`;
    });
    h += `</div><div class="bars">`;
    rs.forEach(r => {
      const L = Math.max(0, (r.s - w0) / WK * 100), R = Math.min(100, (r.e - w0) / WK * 100);
      h += barHtml(r, L, R, r.s < w0, r.e > w1);
    });
    if (SEEK && SEEK.e > w0 && SEEK.s < w1) {
      const sl = Math.max(0, (SEEK.s - w0)/WK*100), sr = Math.min(100, (SEEK.e - w0)/WK*100);
      h += `<div class="seekband" style="left:${sl}%;width:${Math.max(sr-sl,0.4)}%"></div>`;
    }
    if (now >= w0 && now < w1) h += `<div class="nowline" style="left:${(now-w0)/WK*100}%"></div>`;
    h += `</div></div></div>`;
  });
  g.innerHTML = h;
}

function renderDay(){
  const now = Date.now(), d0 = curDay;
  const inView = RES.filter(r => r.e > d0 && r.s < d0 + DAY);

  /* その日の予定に合わせて時間帯を自動で広げる（既定 8:00〜20:00、最大 0:00〜24:00）

     ★終日の予定（有給休暇など）は広げる計算から除く★
     89人もいれば毎日誰かが終日の休暇を入れている。それを数えると
     毎日 0:00〜24:00 になって、日中の時間割が潰れて読めなくなる。
     終日の帯は cut-l / cut-r で端まで伸びるので、窓を広げなくても見える。 */
  let h0 = DAY_H0, h1 = DAY_H1, allday = 0;
  inView.forEach(r => {
    const a = Math.max(r.s, d0), b = Math.min(r.e, d0 + DAY);
    if (b - a >= 20*3600e3) { allday++; return; }
    h0 = Math.min(h0, Math.floor((a - d0)/3600e3));
    h1 = Math.max(h1, Math.ceil ((b - d0)/3600e3));
  });
  h0 = Math.max(0, h0); h1 = Math.min(24, Math.max(h1, h0 + 1));

  const t0 = d0 + h0*3600e3, t1 = d0 + h1*3600e3, span = t1 - t0, hours = h1 - h0;
  const dd = toJ(d0);
  el('range').textContent = `${jKey(d0).replace(/-/g,'/')}（${DOW[dd.getUTCDay()]}）`;
  const widened = (h0 !== DAY_H0 || h1 !== DAY_H1);
  el('lg-note').textContent = `│ ${h0}:00〜${h1}:00`
    + (widened ? '（予定に合わせて自動で広げています）' : '')
    + (allday ? `。終日の予定 ${allday}件は端まで伸びた帯で表示` : '')
    + '。赤い縦線＝現在時刻';
  const g = el('grid'); g.className = 'grid dy'; g.style.setProperty('--hours', hours);

  const list = visiblePeople(inView);
  el('cnt').textContent = `表示 ${list.length}人 / 全 ${PEOPLE.length}人　この日の予定 ${inView.length}件`;

  let h = `<div class="hrow"><div class="hname">氏名（${list.length}）</div><div class="hdays">`;
  for (let i = 0; i < hours; i++){
    const hh = h0 + i;
    h += `<div class="hd ${hh===12?'noon':''}"><div class="dnum" style="font-size:12px">${pad(hh)}</div><div class="dow">:00</div></div>`;
  }
  h += `</div></div>`;
  if (!list.length) h += `<div class="empty">条件に合う人がいません</div>`;

  {
    let bg = '';
    for (let i = 0; i < hours; i++){ const hh = h0 + i;
      bg += `<div class="bg ${(hh<9||hh>=18)?'off':''}"></div>`; }
    h += commonRow(t0, t1, now, bg, r => [
      Math.max(0, (r.s - t0)/span*100), Math.min(100, (r.e - t0)/span*100)]);
  }

  /* ★見出しは週・一覧と同じ関数で作る★ 以前はここに同じ処理が写してあり、
     兼務の扱いが週表示と食い違っていた（日表示だけ元の部署の下に出ていた）。 */
  const gst = { site:null, dep:null };
  list.forEach(p => {
    h += grpHtml(p, list, gst);
    const rs = resOf(p, d0, d0 + DAY), n = laneAssign(rs);
    h += `<div class="row${p.n === HILITE ? ' hi' : ''}" data-who="${esc(p.n)}">` + nameCell(p, rs, n)
       + `<div class="days" style="height:calc(var(--lane)*${n})"><div class="bgs">`;
    for (let i = 0; i < hours; i++){
      const hh = h0 + i;
      h += `<div class="bg ${(hh<9||hh>=18)?'off':''}"></div>`;
    }
    h += `</div><div class="bars">`;
    rs.forEach(r => {
      const L = Math.max(0, (r.s - t0)/span*100), R = Math.min(100, (r.e - t0)/span*100);
      if (R <= 0 || L >= 100) return;
      h += barHtml(r, L, R, r.s < t0, r.e > t1);
    });
    if (SEEK && SEEK.e > t0 && SEEK.s < t1) {
      const sl = Math.max(0, (SEEK.s - t0)/span*100), sr = Math.min(100, (SEEK.e - t0)/span*100);
      h += `<div class="seekband" style="left:${sl}%;width:${Math.max(sr-sl,0.4)}%"></div>`;
    }
    if (now >= t0 && now < t1) h += `<div class="nowline" style="left:${(now-t0)/span*100}%"></div>`;
    h += `</div></div></div>`;
  });
  g.innerHTML = h;
}

/* ============================================================
   操作
   ============================================================ */
function jumpTo(who){
  HILITE = (HILITE === who) ? null : who;
  /* 不在パネルと空きパネルの両方にチップがあるので、両方塗り直す。
     片方だけだと選択されていない側のチップが古い状態のまま残る。 */
  render(); paintSeek(); paintOof();
  if (HILITE) {
    const row = document.querySelector(`.row[data-who="${CSS.escape(HILITE)}"]`);
    if (row) row.scrollIntoView({ block:'center', behavior:'smooth' });
  }
}
el('seek-panel').addEventListener('click', ev => {
  const c = ev.target.closest('.chip'); if (c) jumpTo(c.dataset.who);
});
el('oof-panel').addEventListener('click', ev => {
  const c = ev.target.closest('.chip'); if (c) jumpTo(c.dataset.who);
});
el('sGo').onclick    = runSeek;
el('sClear').onclick = clearSeek;

function paintViewButtons(){
  el('vDay').classList.toggle('on',  VIEW === 'day');
  el('vWeek').classList.toggle('on', VIEW === 'week');
  el('vList').classList.toggle('on', VIEW === 'list');
}
async function setView(v){
  VIEW = v;
  paintViewButtons();
  await loadRes(); lastLoad = Date.now();
  paintPanel(); render(); paintSeek(); paintOof(); paintUpdated(); writeUrl();
}
el('vWeek').onclick = () => { if (VIEW !== 'week') { curWeek = weekTopMs(curDay); setView('week'); } };
el('vList').onclick = () => { if (VIEW !== 'list') { curWeek = weekTopMs(curDay); setView('list'); } };
el('vDay').onclick  = () => { if (VIEW !== 'day')  { const t = Date.now();
  curDay = (t >= curWeek && t < curWeek + WK) ? dayTopMs(t) : curWeek; setView('day'); } };

async function step(dir){
  if (VIEW === 'day') curDay += dir * DAY; else curWeek += dir * WK;
  await loadRes(); lastLoad = Date.now();
  paintPanel(); render(); paintSeek(); paintOof(); paintUpdated(); writeUrl();
}
el('prev').onclick = () => step(-1);
el('next').onclick = () => step(+1);
el('todayBtn').onclick = async () => {
  curWeek = weekTopMs(Date.now()); curDay = dayTopMs(Date.now());
  await loadRes(); lastLoad = Date.now();
  paintPanel(); render(); paintSeek(); paintOof(); paintUpdated(); writeUrl();
};
el('onlybusy').onchange = () => { render(); paintSeek(); writeUrl(); };
el('q').oninput = () => { render(); writeUrl(); };

/* ---------- 部署のトグル ---------- */
function afterDepChange(){
  saveDepSel();                 /* 押すたびに覚える。「保存」ボタンは作らない */
  paintDepToggles(); render(); paintSeek(); paintOof(); writeUrl();
}
el('depToggles').addEventListener('change', ev => {
  const c = ev.target.closest('input[data-dep]'); if (!c) return;
  if (c.checked) DEPSEL.add(c.dataset.dep); else DEPSEL.delete(c.dataset.dep);
  afterDepChange();
});
el('depToggles').addEventListener('click', ev => {
  /* 拠点のボタン。全部入っていれば全部外す。そうでなければ全部入れる */
  const b = ev.target.closest('button.site'); if (!b) return;
  const g = DEP_GROUPS[+b.dataset.grp]; if (!g) return;
  const all = g.keys.every(k => DEPSEL.has(k));
  g.keys.forEach(k => all ? DEPSEL.delete(k) : DEPSEL.add(k));
  afterDepChange();
});
el('depAll').onclick  = () => { DEPSEL = new Set(DEP_KEYS); afterDepChange(); };
el('depNone').onclick = () => { DEPSEL = new Set(); afterDepChange(); };
el('depMine').onclick = () => {
  const k = myDepKeys();
  if (!k.length) { showSnack('名簿の中にご自身が見つかりません（部署が取れていない可能性があります）'); return; }
  DEPSEL = new Set(k); afterDepChange();
};

/* 週表示で日付の見出しを押したら、その日だけの時間割に切り替える。
   週で全体を見て、気になった日に寄る——という見方が自然にできるようにする。
   日表示の見出しは時刻なので data-d が無く、ここには入らない。 */
function goDay(key){
  const ms = Date.parse(key + 'T00:00:00Z') - JST;
  if (isNaN(ms)) return;
  curDay = dayTopMs(ms);
  setView('day');          /* setView が再取得・再描画・URL更新までやる */
}
el('grid').addEventListener('click', ev => {
  const hd = ev.target.closest('.hd[data-d]');
  if (hd) { goDay(hd.dataset.d); return; }
  const bar = ev.target.closest('.bar-i, .li');
  if (bar) openDetail(bar.dataset.r);
});
function openDetail(rid){
  const r = RES.find(x => x.rid === rid) || COMMON.find(x => x.rid === rid); if (!r) return;
  el('dTitle').textContent = r.t;
  el('dBody').innerHTML = [
    ['氏名',   `${esc(r.who)}${r.dep ? ` <span class="badge b-dep">${esc(r.dep)}</span>` : ''}`],
    ['時間',   `${jFull(r.s)} 〜 ${jFull(r.e)}`],
    ['状態',   esc((ST[r.status] || ST.unknown)[0])],
    ['場所',   esc(r.loc) || '—'],
  ].map(([k,v]) => `<dt>${k}</dt><dd>${v}</dd>`).join('');
  el('dNote').textContent = r.priv
    ? 'この予定は「非公開」に設定されているため、件名と場所は表示されません。'
    : '表示されるのは件名・場所・時間だけです。本文と添付は表示されません。予定の変更は Outlook で行ってください。';
  openM('mDetail');
}
document.querySelectorAll('.modal').forEach(m => m.addEventListener('click', e => { if (e.target === m) m.classList.remove('on'); }));
document.addEventListener('keydown', e => { if (e.key === 'Escape') document.querySelectorAll('.modal.on').forEach(m => m.classList.remove('on')); });

initMsal();
</script>
</body>

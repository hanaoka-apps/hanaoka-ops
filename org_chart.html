<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>組織計画</title>
<!--
  組織計画（役員限定）：年齢入りの組織図を「直せる」ようにしたもの。
  ------------------------------------------------------------
  できること
    ・人の修正（氏名・所属・生年・入社年・退職年・役職の履歴・備考）。年齢は「年 − 生年」で自動計算
    ・案を複数持てる（現状／理想案…）。「新しい案」は今の案をコピーして作る
    ・募集（急募・ゆくゆく）：所属・役職・人数・開始年・年齢の幅・求める人物
    ・役職ごとの役割（求める人物・職務）。人や役職をクリックすると右に出る。右でそのまま直せる
    ・人ごとの役割メモ／追加の役割（例：松島さん＝国内営業部長の職務）
    ・55歳（賃金制度：昇給表がゾーン3に切替）・60歳（定年）の強調
  保存先（ブラウザではなく SharePoint）
    executive-workspace ／ 給与データ／組織計画／org_plan.json（給与の人事情報と同じ場所・同じ権限）
    保存のたびに、読み込み時と中身が変わっていないかを確かめ、初回は backup/ にも控えを置く。
    SharePoint 側にもバージョン履歴が残る。手元用に JSON の書き出し／読み込みもある。
  ★個人情報（氏名・年齢）はこのファイルに書かない。データは SharePoint の org_plan.json だけにある。
  ★?demo=1 を付けると、架空のデータで試せる（サインイン不要・保存されない）。
-->
<script src="https://cdn.jsdelivr.net/npm/@azure/msal-browser@3.10.0/lib/msal-browser.min.js" crossorigin="anonymous"></script>
<script src="hanaoka_auth.js"></script>
<style>
  :root { color-scheme: light dark;
    --bg:#f7f7f5; --panel:#fff; --border:#e3e2de; --text:#1f1e1c; --muted:#767468; --accent:#23268f;
    --warn:#b03636; --ok:#2f6b3a;
    --a1:#7fa6c9; --a2:#5b8c85; --a3:#8f9aa8; --a4:#b0705a; --a5:#7a4b4b; }
  * { box-sizing:border-box; }
  html, body { height:100%; }
  body { margin:0; background:var(--bg); color:var(--text); font-family:-apple-system,"Hiragino Sans","Yu Gothic",sans-serif; font-size:14px; line-height:1.5; display:flex; flex-direction:column; overflow:hidden; }
  .hide { display:none !important; }
  #gate { padding:80px 24px; text-align:center; overflow:auto; flex:1; }
  #gate .btn, .btn { font:inherit; font-size:13px; padding:6px 14px; border-radius:6px; border:1px solid var(--border); background:var(--panel); color:var(--text); cursor:pointer; }
  .btn.pri, #gate .btn { border-color:var(--accent); background:var(--accent); color:#fff; }
  .btn.sm { padding:2px 9px; font-size:12px; }
  .btn.danger { color:var(--warn); border-color:var(--warn); }
  #gateError { color:var(--warn); margin-top:14px; font-size:13px; white-space:pre-wrap; }
  #appRoot { display:flex; flex-direction:column; flex:1; min-height:0; }
  .warn-banner { background:#b0363611; border-bottom:1px solid var(--border); padding:6px 20px; font-size:12px; flex-shrink:0; }
  header.top { padding:10px 20px; display:flex; align-items:center; gap:10px; flex-wrap:wrap; border-bottom:1px solid var(--border); flex-shrink:0; }
  header.top h1 { font-size:16px; margin:0 6px 0 0; }
  select, input, textarea { font:inherit; font-size:13px; padding:5px 8px; border-radius:6px; border:1px solid var(--border); background:var(--panel); color:var(--text); }
  textarea { width:100%; resize:vertical; }
  .spacer { flex:1; }
  #status { font-size:12px; color:var(--muted); }
  #status.dirty { color:var(--warn); font-weight:600; }
  .bar { padding:8px 20px; border-bottom:1px solid var(--border); display:flex; gap:6px; flex-wrap:wrap; align-items:center; flex-shrink:0; }
  .tab, .mode { border:1px solid var(--border); background:var(--panel); color:var(--text); padding:4px 12px; border-radius:999px; cursor:pointer; font-size:13px; }
  .tab.on, .mode.on { background:var(--accent); color:#fff; border-color:var(--accent); }
  .sep { width:1px; height:20px; background:var(--border); margin:0 6px; }
  .yrv { font-size:17px; font-weight:700; color:var(--accent); min-width:60px; }
  .work { display:flex; flex:1; min-height:0; }
  main { flex:1; min-width:0; overflow:auto; padding:14px 20px 40px; }
  aside#panel { width:420px; flex-shrink:0; border-left:1px solid var(--border); background:var(--panel); overflow:auto; padding:14px 16px 40px; display:none; }
  aside#panel.open { display:block; }
  @media (max-width:900px){ aside#panel.open { position:fixed; top:0; right:0; bottom:0; width:min(100%,430px); z-index:40; box-shadow:-6px 0 24px #0003; } }
  .sum { display:grid; grid-template-columns:repeat(auto-fit,minmax(120px,1fr)); gap:10px; margin-bottom:12px; }
  .sc { background:var(--panel); border:1px solid var(--border); border-radius:10px; padding:8px 12px; }
  .sc b { display:block; font-size:21px; } .sc span { font-size:12px; color:var(--muted); }
  .dist { background:var(--panel); border:1px solid var(--border); border-radius:10px; padding:8px 14px; margin-bottom:12px; }
  .drow { display:flex; align-items:center; gap:8px; margin:2px 0; font-size:12px; } .drow .l { width:56px; color:var(--muted); } .drow .b { height:12px; border-radius:3px; }
  .leg { display:flex; gap:10px; flex-wrap:wrap; font-size:12px; color:var(--muted); margin:0 0 10px; } .leg i { display:inline-block; width:10px; height:10px; border-radius:2px; margin-right:4px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(270px,1fr)); gap:12px; align-items:start; }
  .dc { background:var(--panel); border:1px solid var(--border); border-radius:12px; overflow:hidden; }
  .dc h2 { margin:0; padding:7px 12px; font-size:14px; background:var(--accent); color:#fff; display:flex; justify-content:space-between; align-items:center; }
  .dc h2 small { font-weight:400; opacity:.85; }
  .dc h2 button { background:#fff2; color:#fff; border:1px solid #fff6; border-radius:5px; font-size:11px; cursor:pointer; padding:1px 7px; }
  .p { display:grid; grid-template-columns:1fr auto; gap:2px 8px; padding:7px 12px; border-top:1px solid var(--border); align-items:center; cursor:pointer; }
  .p:hover { background:color-mix(in srgb, var(--accent) 6%, var(--panel)); }
  .p.sel { background:color-mix(in srgb, var(--accent) 12%, var(--panel)); }
  .nm { font-weight:600; }
  .chip { display:inline-block; font-size:11.5px; padding:0 8px; border-radius:999px; border:1px solid var(--border); color:var(--muted); margin-left:4px; }
  .chip:hover { border-color:var(--accent); color:var(--accent); }
  .rn { font-size:11.5px; color:var(--muted); }
  .age { font-size:22px; font-weight:700; text-align:right; line-height:1; } .age small { font-size:11px; font-weight:400; color:var(--muted); }
  .tags { grid-column:1/3; display:flex; flex-wrap:wrap; gap:4px; }
  .tag { font-size:11px; padding:0 7px; border-radius:999px; border:1px solid var(--border); color:var(--muted); }
  .tag.r { border-color:var(--warn); color:var(--warn); } .tag.n { border-style:dashed; }
  .urg { display:inline-block; font-size:11px; font-weight:700; padding:0 8px; border-radius:999px; margin-left:4px; }
  .urg.hot { background:var(--warn); color:#fff; } .urg.soon { border:1px solid var(--accent); color:var(--accent); }
  .slot { background:color-mix(in srgb, var(--accent) 4%, var(--panel)); border-top:1px dashed var(--accent); }
  .slot .nm { font-weight:500; color:var(--accent); }
  .tw { overflow:auto; border:1px solid var(--border); border-radius:10px; background:var(--panel); }
  table { border-collapse:collapse; width:100%; font-size:12px; }
  th, td { border:1px solid var(--border); padding:3px 6px; text-align:center; white-space:nowrap; }
  th { background:var(--bg); position:sticky; top:0; z-index:2; }
  td.l, th.l { text-align:left; position:sticky; left:0; background:var(--panel); z-index:1; } th.l { z-index:3; background:var(--bg); }
  tr.dh td { background:var(--bg); font-weight:700; text-align:left; }
  tr[data-pid] { cursor:pointer; } tr[data-pid]:hover td { background:color-mix(in srgb, var(--accent) 6%, var(--panel)); }
  .cur { outline:2px solid var(--accent); outline-offset:-2px; }
  td small { display:block; color:var(--muted); font-size:10px; }
  .issues { background:var(--panel); border:1px solid var(--border); border-radius:10px; padding:10px 16px; margin-top:16px; font-size:13px; }
  .issues h3 { margin:0 0 4px; font-size:14px; } .issues li { margin:3px 0; } .issues a { color:var(--accent); cursor:pointer; text-decoration:underline; }
  /* パネル */
  .ph { display:flex; align-items:center; gap:8px; margin-bottom:8px; } .ph h3 { margin:0; font-size:16px; flex:1; }
  .ptabs { display:flex; gap:4px; margin-bottom:10px; }
  .sec { margin:12px 0; } .sec h4 { margin:0 0 4px; font-size:13px; color:var(--accent); }
  .sec ul { margin:2px 0 0; padding-left:18px; } .sec li { margin:2px 0; }
  .sec .gh { font-weight:600; font-size:12.5px; margin-top:6px; }
  .und li { color:var(--warn); }
  .defbox { border:1px solid var(--border); border-radius:10px; padding:8px 12px; margin-bottom:10px; }
  .frm label { display:block; font-size:12px; color:var(--muted); margin:8px 0 2px; }
  .frm input, .frm select { width:100%; }
  .frm .row { display:flex; gap:6px; align-items:center; margin-bottom:4px; } .frm .row input:first-child { width:84px; flex-shrink:0; }
  .frm .row2 { display:flex; gap:8px; } .frm .row2 > div { flex:1; }
  .muted { color:var(--muted); font-size:12px; }
  .cardgrid { display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:12px; }
  .rc { background:var(--panel); border:1px solid var(--border); border-radius:12px; padding:10px 14px; cursor:pointer; } .rc:hover { border-color:var(--accent); }
  .rc h3 { margin:0 0 4px; font-size:14px; }
  #empty { padding:60px 24px; text-align:center; flex:1; overflow:auto; }
</style>

</div>

<div id="empty" class="hide">

  <p class="muted">SharePoint（給与データ／組織計画）に org_plan.json がまだ無い状態です。<br>初回だけ、用意した org_plan.json を読み込むと、そのまま SharePoint に保存されます。</p>

<div id="appRoot" class="hide">
  <div class="warn-banner" id="banner">⚠ 従業員の個人情報（氏名・年齢）です。役員限定。保存先は SharePoint（給与データ／組織計画）。</div>
  <header class="top">

<script>
"use strict";
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const REMOTE = '組織計画/org_plan.json';
const YMIN = 2025, YMAX = 2045;
const VIEWS = [
  ['all','全社',null], ['so','営業・業務センター',['営業','ソリューション','業務センター']],
  ['s','営業',['営業']], ['sol','ソリューション',['ソリューション']], ['ops','業務センター',['業務センター']],
  ['fac','工場・技術・品質',['工場・技術・品質']], ['mg','経営・総務',['経営・総務']] ];
let DB = null, view = 'all', year = 2026, mode = 'chart', panel = null, dirty = false, demo = false;
let lastKnown = null, backedUp = false, saveTimer = null, saving = false;

const sc = () => DB.scenarios.find(s => s.id === DB.activeId) || DB.scenarios[0];
const findP = id => sc().people.find(p => p.id === id);
const findSlot = id => sc().slots.find(s => s.id === id);
const findRole = k => DB.roleDefs.find(r => r.key === k);
const uid = pre => pre + Math.random().toString(36).slice(2, 8);
const tl = p => (p.titles || []).slice().sort((a, b) => a.from - b.from);
function titleAt(p, y) { let t = null; for (const e of tl(p)) if (e.from <= y) t = e.title; return t; }
const present = (p, y) => (p.join == null || y >= p.join) && (p.retire == null || y < p.retire);
const ageAt = (p, y) => p.birth == null ? null : y - p.birth;
const band = a => a == null ? '' : a < 30 ? 'a1' : a < 40 ? 'a2' : a < 50 ? 'a3' : a < 60 ? 'a4' : 'a5';
function roleFor(title) {
  if (!title) return null;
  for (const r of DB.roleDefs) { if (!r.match) continue; try { if (new RegExp(r.match).test(title)) return r; } catch (e) {} }
  return null;
}
function viewDepts() {
  const v = VIEWS.find(x => x[0] === view); const names = DB.depts;
  return names.filter(d => !v[2] || v[2].includes(d.group));
}

/* ---------- 保存 ---------- */
function setStatus(t, cls) { const s = $('#status'); s.textContent = t; s.className = cls || ''; }
function touch() {
  dirty = true;
  setStatus(demo ? 'デモ（保存されません）' : '未保存の変更あり…', 'dirty');
  if (!demo) { clearTimeout(saveTimer); saveTimer = setTimeout(() => E.save(true), 4000); }
}
window.addEventListener('beforeunload', e => { if (dirty && !demo) { e.preventDefault(); e.returnValue = ''; } });
const stamp = () => { const d = new Date(), z = n => String(n).padStart(2, '0'); return d.getFullYear() + z(d.getMonth() + 1) + z(d.getDate()) + '_' + z(d.getHours()) + z(d.getMinutes()) + z(d.getSeconds()); };

/* ---------- 画面 ---------- */
function stats(depts, y) {
  const ps = []; depts.forEach(d => sc().people.filter(p => p.dept === d.name && present(p, y)).forEach(p => ps.push(p)));
  const ages = ps.map(p => ageAt(p, y)).filter(a => a != null);
  const slots = sc().slots.filter(s => depts.some(d => d.name === s.dept) && y >= s.from);
  return { n: ps.length, avg: ages.length ? ages.reduce((a, b) => a + b, 0) / ages.length : null,
    a55: ages.filter(a => a >= 55).length, a60: ages.filter(a => a >= 60).length, ages,
    slots: slots.reduce((a, s) => a + (s.count || 0), 0), slotKinds: slots.length };
}
function renderBar() {
  $('#tabs').innerHTML = VIEWS.map(v => `<button class="tab${v[0] === view ? ' on' : ''}" data-v="${v[0]}">${v[1]}</button>`).join(' ');
  $('#scSel').innerHTML = DB.scenarios.map(s => `<option value="${esc(s.id)}"${s.id === DB.activeId ? ' selected' : ''}>${esc(s.name)}</option>`).join('');
  $('#scNote').value = sc().note || '';
  $('#yv').textContent = year + '年';
  document.querySelectorAll('.mode').forEach(b => b.classList.toggle('on', b.dataset.m === mode));
}
function personRow(p, y) {
  const a = ageAt(p, y), ok = present(p, y), t = titleAt(p, y), hl = $('#hl').checked;
  const ev = (p.events || []).filter(e => e.y === y);
  const tags = [];
  if (hl && a != null && a >= 60) tags.push('<span class="tag r">60歳〜（定年）</span>');
  else if (hl && a != null && a >= 55) tags.push('<span class="tag r">55歳〜（ゾーン3）</span>');
  ev.forEach(e => tags.push(`<span class="tag r">${esc(e.t)}</span>`));
  if (ok) { const pt = titleAt(p, y - 1); if (t && pt && pt !== t && present(p, y - 1)) tags.push(`<span class="tag r">${y}年 ${esc(pt)}→${esc(t)}</span>`); }
  if (ok && p.retire != null) tags.push(`<span class="tag r">${p.retire}年 退職予定</span>`);
  if (!ok && p.retire != null && y >= p.retire) tags.push('<span class="tag">退職</span>');
  if (!ok && p.join != null && y < p.join) tags.push(`<span class="tag">${p.join}年入社</span>`);
  if (p.flag || p.birth == null) tags.push('<span class="tag n">要確認</span>');
  if (p.note) tags.push(`<span class="tag n" title="${esc(p.note)}">備考</span>`);
  const sel = panel && panel.type === 'person' && panel.id === p.id ? ' sel' : '';
  return `<div class="p${sel}${ok ? '' : ' off'}" data-pid="${esc(p.id)}" style="${ok ? '' : 'opacity:.4'}">
    <div><span class="nm">${esc(p.name)}</span><span class="chip" data-role="${esc(p.id)}">${esc(t || '役職なし')}</span>
    ${p.roleNote ? `<div class="rn">${esc(p.roleNote)}</div>` : ''}</div>
    <div class="age" ${a != null && ok ? `style="color:var(--${band(a)})"` : ''}>${a == null ? '—' : a}<small>歳</small></div>
    ${tags.length ? `<div class="tags">${tags.join('')}</div>` : ''}</div>`;
}
const urgBadge = s => s.urgency === '急募' ? '<span class="urg hot">急募</span>' : s.urgency === 'ゆくゆく' ? '<span class="urg soon">ゆくゆく</span>' : '';
function slotRow(s) {
  const sel = panel && panel.type === 'slot' && panel.id === s.id ? ' sel' : '';
  const ar = s.ageMin || s.ageMax ? `${s.ageMin || ''}〜${s.ageMax || ''}歳` : '';
  return `<div class="p slot${sel}" data-sid="${esc(s.id)}"><div><span class="nm">＋募集</span><span class="chip">${esc(s.title || '役職未定')}</span>${urgBadge(s)}
    <div class="rn">${esc(s.profile || '')}</div></div><div class="age" style="font-size:15px">${s.count ? s.count + '名' : '人数未定'}<small>${ar ? '<br>' + ar : ''}</small></div></div>`;
}
function renderMain() {
  const depts = viewDepts();
  let h = '';
  if (mode === 'chart') h = chartHTML(depts);
  else if (mode === 'table') h = tableHTML(depts);
  else if (mode === 'slots') h = slotsHTML();
  else h = rolesHTML();
  $('#main').innerHTML = h;
}
function chartHTML(depts) {
  const S = stats(depts, year), ghost = $('#ghost').checked;
  const bands = [['〜29', 0, 29, 'a1'], ['30代', 30, 39, 'a2'], ['40代', 40, 49, 'a3'], ['50代', 50, 59, 'a4'], ['60〜', 60, 200, 'a5']];
  const mx = Math.max(1, ...bands.map(b => S.ages.filter(a => a >= b[1] && a <= b[2]).length));
  let h = `<div class="sum"><div class="sc"><b>${S.n}</b><span>人（${year}年）</span></div>
    <div class="sc"><b>${S.avg == null ? '—' : S.avg.toFixed(1)}</b><span>平均年齢</span></div>
    <div class="sc"><b>${S.a55}</b><span>55歳以上</span></div><div class="sc"><b>${S.a60}</b><span>60歳以上</span></div>
    <div class="sc"><b>${S.slots}</b><span>募集（${S.slotKinds}件）</span></div></div>
    <div class="dist">${bands.map(b => { const n = S.ages.filter(a => a >= b[1] && a <= b[2]).length; return `<div class="drow"><span class="l">${b[0]}</span><span class="b" style="width:${n / mx * 220}px;background:var(--${b[3]})"></span><span>${n}</span></div>`; }).join('')}</div>
    <div class="grid">`;
  depts.forEach(d => {
    const ps = sc().people.filter(p => p.dept === d.name && (ghost || present(p, year)));
    const n = ps.filter(p => present(p, year)).length;
    const ages = ps.filter(p => present(p, year)).map(p => ageAt(p, year)).filter(a => a != null);
    const avg = ages.length ? (ages.reduce((a, b) => a + b, 0) / ages.length).toFixed(1) : '—';
    const sl = sc().slots.filter(s => s.dept === d.name && year >= s.from);
    h += `<div class="dc"><h2><span>${esc(d.name)}</span><span><small>${n}人・平均${avg}歳</small> <button data-adds="${esc(d.name)}">＋募集</button></span></h2>`;
    h += ps.map(p => personRow(p, year)).join('') + sl.map(slotRow).join('');
    if (!ps.length && !sl.length) h += '<div class="p"><span class="muted">（いません）</span></div>';
    h += '</div>';
  });
  return h + '</div>' + issuesHTML();
}

/* ---------- 操作 ---------- */
const num = v => v === '' || v == null ? null : Number(v);
const E = {
  rerender() { renderBar(); renderMain(); renderPanel(); },
  after() { touch(); renderMain(); },
  close() { panel = null; renderPanel(); renderMain(); },
  tab(t) { panel.tab = t; renderPanel(); },
  openRole(k) { panel = { type: 'role', key: k }; renderPanel(); },
  p(id, f, v) { const p = findP(id); if (!p) return; p[f] = ['birth', 'join', 'retire'].includes(f) ? num(v) : v; if (f === 'dept') E.after(); else E.after(); },
  retireNow(id) { findP(id).retire = year; touch(); renderMain(); renderPanel(); },
  tl(id, i, f, v) { const p = findP(id), e = tl(p)[i]; if (f === 'from') e.from = Number(v); else e.title = v; touch(); renderMain(); renderPanel(); },
  tlAdd(id) { const p = findP(id); p.titles = p.titles || []; p.titles.push({ from: year, title: titleAt(p, year) || '' }); touch(); renderMain(); renderPanel(); },
  tlDel(id, i) { const p = findP(id), e = tl(p)[i]; p.titles = p.titles.filter(x => x !== e); touch(); renderMain(); renderPanel(); },
  ev(id, i, f, v) { findP(id).events[i][f] = f === 'y' ? Number(v) : v; touch(); renderMain(); },
  evAdd(id) { const p = findP(id); p.events = p.events || []; p.events.push({ y: year, t: '' }); touch(); renderPanel(); },
  evDel(id, i) { findP(id).events.splice(i, 1); touch(); renderMain(); renderPanel(); },
  rk(id, key, on) { const p = findP(id); p.roleKeys = (p.roleKeys || []).filter(x => x !== key); if (on) p.roleKeys.push(key); touch(); },
  delP(id) { const p = findP(id); if (!confirm(p.name + ' をこの案から削除します（現状など他の案には残ります）。よろしいですか？')) return; sc().people = sc().people.filter(x => x.id !== id); panel = null; touch(); renderMain(); renderPanel(); },
  addP(dept) {
    const d = dept || (viewDepts()[0] || DB.depts[0]).name;
    const p = { id: uid('p'), name: '新しい人', dept: d, birth: null, join: null, retire: null, titles: [], events: [], roleNote: '', roleKeys: [], note: '', flag: true };
    sc().people.push(p); panel = { type: 'person', id: p.id, tab: 'edit' }; touch(); renderMain(); renderPanel();
  },
  addSlot(dept) {
    const d = dept || (viewDepts()[0] || DB.depts[0]).name;
    const s = { id: uid('s'), dept: d, title: '', count: 1, urgency: '', from: year, ageMin: null, ageMax: null, profile: '', note: '' };
    sc().slots.push(s); panel = { type: 'slot', id: s.id }; touch(); renderMain(); renderPanel();
  },
  s(id, f, v) { const s = findSlot(id); s[f] = ['count', 'from', 'ageMin', 'ageMax'].includes(f) ? num(v) : v; E.after(); },
  promote(id) {
    const y = Number($('#pq-y').value), t = $('#pq-t').value.trim(); if (!y || !t) { alert('年と役職を入れてください'); return; }
    const p = findP(id); p.titles = (p.titles || []).filter(x => x.from !== y); p.titles.push({ from: y, title: t });
    touch(); renderMain(); renderPanel();
  },
  retirePlan(id) {
    const y = Number($('#pq-r').value); if (!y) { alert('年を入れてください'); return; }
    const p = findP(id); p.retire = y; p.events = (p.events || []).filter(e => e.t !== '退職予定'); p.events.push({ y, t: '退職予定' });
    touch(); renderMain(); renderPanel();
  },
  retireClear(id) { const p = findP(id); p.retire = null; p.events = (p.events || []).filter(e => e.t !== '退職予定'); touch(); renderMain(); renderPanel(); },
  hire(id) {
    const s = findSlot(id); if (!confirm('この募集を、社員（名前は後で入れる）に切り替えます。よろしいですか？')) return;
    const p = { id: uid('p'), name: '新しい人（採用）', dept: s.dept, birth: null, join: s.from, retire: null, titles: [{ from: s.from, title: s.title }], events: [], roleNote: s.profile || '', roleKeys: [], note: s.note || '', flag: true };
    sc().people.push(p); sc().slots = sc().slots.filter(x => x.id !== id); panel = { type: 'person', id: p.id, tab: 'edit' }; touch(); renderMain(); renderPanel();
  },
  delSlot(id) { if (!confirm('この枠を削除します。よろしいですか？')) return; sc().slots = sc().slots.filter(x => x.id !== id); panel = null; touch(); renderMain(); renderPanel(); },
  r(key, f, v) {
    const r = findRole(key);
    if (f === 'profile' || f === 'undecided') r[f] = v.split('\n').map(x => x.trim()).filter(Boolean);
    else if (f === 'duties') { const gs = []; let g = null; v.split('\n').forEach(l => { l = l.trim(); if (!l) return; if (l.startsWith('##')) { g = { h: l.replace(/^#+\s*/, ''), items: [] }; gs.push(g); } else { if (!g) { g = { h: '', items: [] }; gs.push(g); } g.items.push(l); } }); r.groups = gs; }
    else r[f] = v;
    touch(); if (mode === 'roles') renderMain();
  },
  addRole() { const r = { key: uid('r'), name: '新しい役割', match: '', summary: '', profile: [], groups: [], undecided: [], notes: '' }; DB.roleDefs.push(r); touch(); panel = { type: 'role', key: r.key }; renderMain(); renderPanel(); },
  newRoleFor(title) { const r = { key: uid('r'), name: title, match: '^' + title.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '$', summary: '', profile: [], groups: [], undecided: [], notes: '' }; DB.roleDefs.push(r); touch(); panel = { type: 'role', key: r.key }; renderPanel(); },
  delRole(key) { if (!confirm('この役割の定義を削除します。よろしいですか？')) return; DB.roleDefs = DB.roleDefs.filter(r => r.key !== key); DB.scenarios.forEach(s => s.people.forEach(p => p.roleKeys = (p.roleKeys || []).filter(k => k !== key))); panel = null; touch(); renderMain(); renderPanel(); },
  scNew() { const n = prompt('新しい案の名前（今の案をコピーして作ります）', sc().name + ' のコピー'); if (!n) return; const c = JSON.parse(JSON.stringify(sc())); c.id = uid('sc'); c.name = n; c.note = ''; DB.scenarios.push(c); DB.activeId = c.id; panel = null; touch(); E.rerender(); },
  scRen() { const n = prompt('案の名前', sc().name); if (!n) return; sc().name = n; touch(); renderBar(); },
  scDel() { if (DB.scenarios.length < 2) { alert('案が1つだけのときは削除できません。'); return; } if (!confirm('案「' + sc().name + '」を削除します。元に戻せません（SharePointのバージョン履歴から戻せます）。よろしいですか？')) return; DB.scenarios = DB.scenarios.filter(s => s.id !== DB.activeId); DB.activeId = DB.scenarios[0].id; panel = null; touch(); E.rerender(); },
  scNote(v) { sc().note = v; touch(); },
  exp() { const b = new Blob([JSON.stringify(DB, null, 1)], { type: 'application/json' }), a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = 'org_plan_' + stamp() + '.json'; a.click(); },
  imp(inp) {
    const f = inp.files[0]; if (!f) return; const rd = new FileReader();
    rd.onload = () => {
      try {
        const d = JSON.parse(rd.result); if (!d.scenarios || !d.roleDefs || !d.depts) throw new Error('組織計画のデータではありません');
        if (DB && !confirm('今のデータをこのファイルの内容に入れ替えます。よろしいですか？（保存するまで SharePoint は変わりません）')) return;
        DB = d; if (!DB.activeId) DB.activeId = DB.scenarios[0].id; panel = null; showApp(); touch();
      } catch (e) { alert('読み込めませんでした：' + e.message); }
      inp.value = '';
    };
    rd.readAsText(f);
  },
  startBlank() { DB = { v: 1, activeId: 'cur', depts: [{ name: '営業', group: '営業' }], roleDefs: [], scenarios: [{ id: 'cur', name: '現状（実際）', note: '', people: [], slots: [] }] }; showApp(); touch(); },
  async save(auto) {
    if (demo) { setStatus('デモ（保存されません）', 'dirty'); return; }
    if (saving) return; saving = true; clearTimeout(saveTimer); setStatus('保存中…');
    try {
      const remote = await payrollGetFile(REMOTE, { allow404: true });
      if (remote && lastKnown && remote.updated !== lastKnown) {
        if (!confirm('読み込んだあとに、別の場所で組織計画が更新されています（' + remote.updated + '）。\nこのまま上書きすると、その変更は消えます（SharePointの履歴には残ります）。上書きしますか？')) { setStatus('保存を中止しました（未保存）', 'dirty'); saving = false; return; }
      }
      if (!backedUp && remote) { await payrollPutFile('組織計画/backup/org_plan_' + stamp() + '.json', remote); backedUp = true; }
      DB.updated = new Date().toISOString();
      await payrollPutFile(REMOTE, DB);
      lastKnown = DB.updated; dirty = false;
      const d = new Date(); setStatus('SharePointに保存済み ' + d.getHours() + ':' + String(d.getMinutes()).padStart(2, '0'));
    } catch (e) { setStatus('保存できませんでした：' + (e.message || e), 'dirty'); }
    saving = false;
  }
};
window.E = E;

/* ---------- イベント ---------- */
document.addEventListener('click', e => {
  const t = e.target;
  const tab = t.closest('.tab'); if (tab) { view = tab.dataset.v; E.rerender(); return; }
  const md = t.closest('.mode[data-m]'); if (md) { mode = md.dataset.m; renderBar(); renderMain(); return; }
  const ap = t.closest('[data-addp]'); if (ap) { e.stopPropagation(); E.addP(ap.dataset.addp); return; }
  const as = t.closest('[data-adds]'); if (as) { e.stopPropagation(); E.addSlot(as.dataset.adds); return; }
  const m = t.closest('#main'); if (!m) return;
  const rk = t.closest('[data-rkey]'); if (rk) { E.openRole(rk.dataset.rkey); return; }
  const si = t.closest('[data-sid]'); if (si) { panel = { type: 'slot', id: si.dataset.sid }; renderPanel(); renderMain(); return; }
  const pi = t.closest('[data-pid]'); if (pi) { panel = { type: 'person', id: pi.dataset.pid, tab: 'role' }; renderPanel(); renderMain(); }
});
$('#scSel').addEventListener('change', e => { DB.activeId = e.target.value; panel = null; E.rerender(); });
$('#ys').addEventListener('input', e => { year = Number(e.target.value); $('#yv').textContent = year + '年'; renderMain(); if (panel && panel.type === 'person') renderPanel(); });
$('#hl').addEventListener('change', renderMain); $('#ghost').addEventListener('change', renderMain);

/* ---------- 起動 ---------- */
function showApp() {
  $('#gate').classList.add('hide'); $('#empty').classList.add('hide'); $('#appRoot').classList.remove('hide');
  if (demo) $('#banner').textContent = '⚠ デモ表示：すべて架空のデータです。保存されません。';
  E.rerender();
}
function demoDB() {
  const names = [['営業｜本社','営業','山田 太郎',1972,'部長'],['営業｜本社','営業','佐藤 花子',1985,'主任'],['営業｜大阪','営業','鈴木 一郎',1969,'支店長'],
    ['ソリューション','ソリューション','高橋 健',1991,'課長'],['ソリューション','ソリューション','田中 美咲',1999,'MGR1-3'],['業務センター','業務センター','伊藤 大輔',1968,'センター長課長'],['業務センター','業務センター','渡辺 愛',2001,'MGR1-2']];
  const people = names.map((n, i) => ({ id: 'd' + i, name: n[2], dept: n[0], birth: n[3], join: null, retire: i === 5 ? 2028 : null, titles: [{ from: 2025, title: n[4] }], events: i === 5 ? [{ y: 2028, t: '定年' }] : [], roleNote: '', roleKeys: [], note: '', flag: false }));
  const base = JSON.parse(JSON.stringify(window.__seedRoles || []));
  return { v: 1, activeId: 'cur', depts: [{ name: '営業｜本社', group: '営業' }, { name: '営業｜大阪', group: '営業' }, { name: 'ソリューション', group: 'ソリューション' }, { name: '業務センター', group: '業務センター' }],
    roleDefs: [{ key: '部長', name: '部長', match: '部長', summary: '', profile: ['MVV遵守', '自ら考え、決断・行動ができる'], groups: [{ h: '数字・計画', items: ['部全体の数字管理'] }], undecided: ['（デモ）未決の例'], notes: '' },
      { key: '課長', name: '課長', match: '課長|支店長', summary: '', profile: ['部下に明確に指示・指導ができる'], groups: [], undecided: [], notes: '' }],
    scenarios: [{ id: 'cur', name: '現状（実際）', note: 'デモ', people, slots: [] },
      { id: 'ideal', name: '理想案', note: '', people: JSON.parse(JSON.stringify(people)), slots: [{ id: 'ds1', dept: 'ソリューション', title: '一般職', count: 1, from: 2027, ageMin: 22, ageMax: 34, profile: '英語メイン（デモ）', note: '' }] }] };
}
async function loadFromSharePoint() {
  const r = await payrollGetFile(REMOTE, { allow404: true });
  if (!r) { $('#gate').classList.add('hide'); $('#empty').classList.remove('hide'); return; }
  DB = r; lastKnown = r.updated || null; if (!DB.activeId) DB.activeId = DB.scenarios[0].id;
  showApp(); setStatus('SharePointから読み込み済み');
}
function showGateError(e) {
  $('#gateError').textContent = e.message || String(e);
  $('#gateMsg').textContent = '役員限定のデータです。Microsoftアカウントでサインインしてください。';
  $('#signInBtn').disabled = false;
}
async function boot() {
  if (new URLSearchParams(location.search).get('demo') === '1') { demo = true; DB = demoDB(); showApp(); setStatus('デモ（保存されません）'); return; }
  try {
    const ok = await payrollInitAuth();
    if (ok) await loadFromSharePoint();
  } catch (e) { showGateError(e); }
}
$('#signInBtn').addEventListener('click', async () => {
  $('#gateError').textContent = '';
  try { await payrollSignIn(); await loadFromSharePoint(); } catch (e) { showGateError(e); }
});
boot();
</script>
</body>

<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<title>出図管理アプリ</title>
<meta name="viewport" content="width=device-width,initial-scale=1" />
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@azure/msal-browser@3.10.0/lib/msal-browser.min.js" crossorigin="anonymous"></script>
<style>
:root{--brand:#ff6b81;--brand-dark:#e8556d;--bg:#fff7fb;--line:#e6e6e9;--soft:#f7fbff;--muted:#666;--danger:#d64545;--text:#222}
*{box-sizing:border-box}body{margin:0;font-family:"Noto Sans JP","Segoe UI","Hiragino Kaku Gothic ProN",sans-serif;background:var(--bg);color:var(--text)}
.container{max-width:1280px;margin:18px auto;padding:0 14px}.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:0 8px 22px rgba(255,107,129,.08)}
.header{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:flex-start}h1{margin:0;color:var(--brand);font-size:22px}.note,.muted{color:var(--muted);font-size:13px}.badge{display:inline-block;padding:5px 10px;border:1px solid var(--line);border-radius:999px;background:var(--soft);font-weight:700;margin-left:6px}
.form-grid{display:grid;grid-template-columns:160px minmax(0,1fr);gap:10px 12px;align-items:center;margin-top:12px}label{font-size:14px;font-weight:700}
input,select,textarea{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:9px;background:#fff;font-size:14px}input[readonly]{background:#f8f9fb;color:#555}textarea{min-height:86px;resize:vertical}.field-stack{display:flex;flex-direction:column;gap:6px}.application-row{display:grid;grid-template-columns:minmax(180px,1fr) minmax(280px,2fr);gap:10px;align-items:end}.application-field{display:flex;flex-direction:column;gap:5px}.application-field>span{font-size:13px;font-weight:700;color:#444}
.dim-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.dim-stack{display:flex;flex-direction:column;gap:7px}.dim-mm-one-line,.dim-m-one-line{display:flex;align-items:center;gap:7px;flex-wrap:nowrap;white-space:nowrap}.dim-caption{font-size:13px;font-weight:700}.dim-symbol{font-weight:800;color:#555}.box{width:96px;text-align:right}.combined-m{width:240px;text-align:right;background:var(--soft)}.hidden-meter-field{display:none}.dim-m-one-line input[readonly]{background:var(--soft)}
.serial-ranges{display:flex;flex-direction:column;gap:7px}.serial-range-row{display:flex;align-items:center;gap:8px;flex-wrap:nowrap}.serial-range-row.inactive{opacity:.45}.serial-range-row.inactive input{background:#f1f2f4;cursor:not-allowed}.serial-no{width:120px;text-align:center;letter-spacing:.08em}.serial-label{width:40px;color:var(--muted);font-size:13px}.serial-sep{font-weight:800;color:#555;white-space:nowrap}
.meisai-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--soft);padding:10px 12px}
table.meisai{border-collapse:separate;border-spacing:0;width:100%;min-width:560px}
table.meisai th{font-size:11.5px;color:var(--muted);font-weight:700;text-align:left;padding:0 5px 6px;white-space:nowrap}
table.meisai td{padding:3px 5px;vertical-align:middle}
table.meisai input{padding:7px 9px;font-size:13.5px;border-radius:8px}
table.meisai input.mnum{text-align:right}
table.meisai input[readonly]{background:#eef2f7;color:#555}
table.meisai .msep{color:var(--muted);padding:0 1px}
.mdel{border:1px solid var(--line);background:#fff;color:#999;border-radius:7px;width:28px;height:28px;
  cursor:pointer;font-size:14px;line-height:1;padding:0}
.mdel:hover{color:var(--danger);border-color:#f0b5b5}
.mfoot{display:flex;align-items:center;gap:10px 16px;flex-wrap:wrap;margin-top:9px}
.mfoot .mchk{margin-left:auto;font-size:13px;font-weight:700;padding:5px 12px;border-radius:8px;
  background:#e6f5ec;border:1px solid #b6e0c7;color:#1f7a4d}
.mfoot .mchk.ng{background:var(--warn-soft,#fff7df);border-color:#ffe3a3;color:#8a5a00}
button.msmall{padding:7px 13px;font-size:13px;background:#fff;border:1px solid var(--line);color:#333;font-weight:700}
button.msmall:hover{border-color:var(--brand);color:var(--brand)}
.actions,.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.toolbar{padding-top:14px;border-top:1px solid var(--line)}button{padding:9px 14px;border:0;background:var(--brand);color:#fff;border-radius:10px;cursor:pointer;font-weight:700}button:hover{background:var(--brand-dark)}button.ghost{background:#fff;border:1px solid var(--line);color:#333}button.ghost:hover{background:#f7f7f9}button.danger{background:#fff;border:1px solid #f0b5b5;color:var(--danger)}
.search{width:min(420px,100%)}.small-select{width:auto;min-width:150px}.warn{display:none;margin-top:10px;padding:9px 10px;border-radius:10px;background:#fff7df;border:1px solid #ffe3a3;color:#614900;font-size:13px}.invalid{border-color:var(--danger)!important;background:#fff7f7!important}
.table-wrap{overflow:auto;margin-top:14px;border:1px solid var(--line);border-radius:12px;background:#fff}table{width:100%;border-collapse:collapse;min-width:1050px}th,td{border-bottom:1px solid var(--line);padding:10px;text-align:left;font-size:13px;vertical-align:top}th{background:var(--soft);font-weight:800;position:sticky;top:0}.inline-btn{padding:8px 10px;border-radius:7px;background:#fff;border:1px solid var(--line);color:#333;font-size:15px}.details{background:#fbfbff;padding:10px;border-radius:8px;border:1px solid #eef6ff;line-height:1.65}.detail-note{display:block;white-space:pre-wrap;overflow-wrap:anywhere;margin-top:4px;padding:8px 10px;background:#fff;border:1px solid #e8e8ef;border-radius:7px}.hidden-file{display:none}
.gate{display:none;flex-direction:column;align-items:center;gap:14px;padding:52px 20px;text-align:center}
.gate h2{margin:0;font-size:19px;font-weight:800}
.gate p{margin:0;color:var(--muted);font-size:14px;line-height:1.8}
.gate button{padding:13px 30px;font-size:15px}
body:not(.signed-in) .gate{display:flex}
body:not(.signed-in) #mainForm,body:not(.signed-in) .actions,
body:not(.signed-in) .toolbar,body:not(.signed-in) #listContainer,
body:not(.signed-in) #countBadge,body:not(.signed-in) #nextNoBadge{display:none}
body.signed-in #btnAuth{background:#fff;border:1px solid var(--line);color:#666;font-weight:400}
@media(max-width:720px){.form-grid{grid-template-columns:1fr}.actions button,.toolbar button,.small-select,.search{width:100%}.dim-mm-one-line,.dim-m-one-line,.serial-range-row{flex-wrap:wrap;white-space:normal}.box{width:82px}.serial-no{width:110px}.application-row{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="container"><div class="card">
<div class="header"><div><h1>出図管理アプリ</h1><div class="note"></div></div><div><span id="authBadge" class="badge" style="background:#fff7df;border-color:#ffe3a3;color:#614900">未サインイン</span><button id="btnAuth" class="ghost" style="padding:5px 11px;margin-left:6px;font-size:13px">サインイン</button><span id="countBadge" class="badge">0件</span><span id="nextNoBadge" class="badge">次回: 00001</span></div></div>
<div class="gate">
  <h2>サインインしてください</h2>
  <p>このアプリのデータは SharePoint に保存されています。<br>
     会社のアカウントでサインインすると、出図の一覧と登録画面が表示されます。</p>
  <button id="btnGateSignIn">サインイン</button>
</div>
<form id="mainForm" class="form-grid" onsubmit="event.preventDefault(); addOrUpdateEntry();">
<label for="ship_no">出図管理番号</label><input id="ship_no" type="text" readonly placeholder="自動採番（00001〜）">
<label for="date">出図日 <span class="muted">*</span></label><input id="date" type="date" required>
<label for="customer">受注先</label><input id="customer" type="text">
<label for="product_name_select">品名 <span class="muted">*</span></label><div class="field-stack"><select id="product_name_select"></select><input id="product_name_free" type="text" placeholder="自由入力（候補を使わない場合）"></div>
<label for="model_select">型式</label><div class="field-stack"><select id="model_select"></select><input id="model_free" type="text" placeholder="自由入力（候補を使わない場合）"></div>
<label for="destination">仕向地</label><input id="destination" type="text">
<label for="units">台数（台口）</label><input id="units" type="text" inputmode="numeric" value="1" placeholder="1">
<label for="drawing_no">図番 <span class="muted">*</span></label><input id="drawing_no" type="text" required>
<label>寸法（mm）</label><div class="dim-stack"><div class="dim-mm-one-line" aria-label="寸法（mm） 全長×全幅×全高"><span class="dim-caption">全長</span><input id="length_mm" class="box" type="text" inputmode="decimal" placeholder="全長"><span class="dim-symbol">×</span><span class="dim-caption">全幅</span><input id="width_mm" class="box" type="text" inputmode="decimal" placeholder="全幅"><span class="dim-symbol">×</span><span class="dim-caption">全高</span><input id="height_mm" class="box" type="text" inputmode="decimal" placeholder="全高"><span class="muted">mm</span></div><div class="dim-m-one-line" aria-label="寸法（m） 全長×全幅×全高"><span class="dim-caption">全長</span><input id="length_m" class="box" readonly placeholder="全長"><span class="dim-symbol">×</span><span class="dim-caption">全幅</span><input id="width_m" class="box" readonly placeholder="全幅"><span class="dim-symbol">×</span><span class="dim-caption">全高</span><input id="height_m" class="box" readonly placeholder="全高"><span class="muted">m</span><input id="dimensions_m" class="hidden-meter-field" readonly></div></div>
<label for="vehicle_weight">車両重量(kg)</label><input id="vehicle_weight" type="text" list="vehicle_weight_options" placeholder="例：0000kg または 別紙"><datalist id="vehicle_weight_options"><option value="別紙"></option><option value="0000kg"></option></datalist>
<label for="capacity">最大積載量(kg)</label><input id="capacity" type="text" inputmode="numeric" placeholder="数字を直接入力">
<label for="car_no">車体番号</label><input id="car_no" type="text" list="car_no_options" placeholder="確認中・別紙・なし・直接入力"><datalist id="car_no_options"><option value="確認中"></option><option value="別紙"></option><option value="なし"></option></datalist>
<label>製造番号（明細）</label><div class="meisai-wrap">
  <table class="meisai">
    <thead><tr><th style="width:120px">行き先</th><th style="width:70px">台数</th>
      <th colspan="3">製造番号</th><th>仕様・備考</th><th style="width:34px"></th></tr></thead>
    <tbody id="meisaiRows"></tbody>
  </table>
  <div class="mfoot">
    <button type="button" class="msmall" id="btnAddMeisai">＋ 行き先を追加</button>
    <span class="muted" style="font-size:12.5px">台数を入れると終わりの番号が自動で入ります。開始番号は行ごとに直せます。</span>
    <span class="mchk" id="meisaiChk">—</span>
  </div>
</div>
<label for="manufacture_month">製造年月</label><input id="manufacture_month" type="month">
<label for="surface">表面処理</label><select id="surface"><option value="">--選択--</option><option>塗装</option><option>半メッキ</option><option>メッキ</option><option>フルメッキ</option></select>
<label for="wt">WT表示</label><select id="wt"><option value="">--選択--</option><option>実測</option><option>0・5</option><option>表示なし</option><option>1000kg（ANA仕様：自重調整機能付き）</option></select>
<label>申請</label><div class="application-row"><div class="application-field"><span>申請（空港）</span><select id="application_airport"><option value="">--選択--</option><option>申請あり</option><option>申請なし</option></select></div><div class="application-field"><span>申請内容</span><input id="application_content" type="text" list="application_content_options" placeholder="候補を選択または直接入力"><datalist id="application_content_options"><option value="全数4方向"></option><option value="全数4方向+前斜め"></option><option value="先頭車両のみ4方向"></option></datalist></div></div>
<label for="spec_no">図面仕様番号</label><input id="spec_no" type="text">
<label for="note">備考</label><textarea id="note"></textarea>
</form>
<div id="formWarn" class="warn"></div>
<div class="actions"><button id="btnSave">追加 / 保存</button><button id="btnClear" class="ghost">フォームクリア</button><button id="btnDuplicate" class="ghost">選択データを複製</button><button id="btnExportPDF" class="ghost">最新1件をPDF出力</button><button id="btnExportFormPDF" class="ghost">フォームをPDF出力（A4）</button></div>
<div class="toolbar"><input id="q" class="search" placeholder="検索：出図管理番号 図番 品名 型式 受注先 製造番号 など"><select id="sortBy" class="small-select"><option value="createdAt_desc">登録順 新しい順</option><option value="ship_no_asc">出図管理番号 昇順</option><option value="date_desc">出図日 新しい順</option><option value="customer_asc">受注先 昇順</option></select><button id="btnRefresh" class="ghost">再表示</button><button id="btnOpenUnits" class="ghost" disabled>製造番号明細を開く</button><button id="btnExportCSV" class="ghost">CSV出力</button><button id="btnImportCSV" class="ghost">CSV取込</button><button id="btnBackupJSON" class="ghost">JSONバックアップ</button><button id="btnRestoreJSON" class="ghost">JSON復元</button><button id="btnClearAll" class="danger">全データ削除</button></div>
<div id="listContainer" class="table-wrap"></div><input id="fileCsv" class="hidden-file" type="file" accept=".csv"><input id="fileJson" class="hidden-file" type="file" accept=".json">
</div></div>
<script>
/* ============================================================
   保存先
   ------------------------------------------------------------
   localStorage から SharePoint リストへ移した。
   画面のコードは一切変えていない。loadData() は今までどおり
   同期で配列を返すが、その中身は起動時にサーバーから読んだ
   キャッシュ（CACHE）。書き込みだけがサーバーへ飛ぶ。
   ============================================================ */
const MSAL_CONFIG={auth:{clientId:"d338d61b-01dc-4c7c-ac6b-aecf7f30d716",
  authority:"https://login.microsoftonline.com/3933e8a0-c945-4e97-ae67-c82131087cad",
  redirectUri:new URL("auth.html",window.location.href).href},
  cache:{cacheLocation:"sessionStorage",storeAuthStateInCookie:false}};
const SCOPES=["User.Read","Sites.ReadWrite.All"];
const GRAPH_BASE="https://graph.microsoft.com/v1.0";
const SP_HOST="hanaokacorp.sharepoint.com",SP_PATH="/sites/shutsuzu",
      LIST_SHUTSUZU="出図マスタ",LIST_UNITS="製造番号明細";
let SITE_ID=null,LIST_ID=null,LIST_UNITS_ID=null,LIST_UNITS_URL="",CACHE=[];
const DEFAULT_PRODUCTS=["パレットトレーラー","コンテナトレーラー","カーゴカート","20ftトレーラー"],DEFAULT_MODELS=["EE1596S","EE1596N-A","EE1596N-B","EE3096","H･DLC-R","DLE-Ⅱ","SR","H･SEC","H･SET-RL","BCC","BCC-W","BCA"];let editingIndex=-1;const $=id=>document.getElementById(id),trim=s=>(s||"").toString().trim(),esc=s=>String(s||"").replace(/[&<>'"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","'":"&#39;",'"':"&quot;"}[c]));
function toM(mm){const n=Number(mm);return isFinite(n)&&n>0?(n/1000).toFixed(3):""}function pad5(v){const s=trim(v).replace(/\D/g,"").slice(0,5);return s? s.padStart(5,"0") : ""}function unitCount(v){const n=parseInt(v,10);return isFinite(n)&&n>0?n:1}/* ============================================================
   明細（行き先ごとのグループ）
   ------------------------------------------------------------
   もとは 1行目/2・3行目 という決まりで入れていたが、
   実データを見ると1つの出図が複数の行き先に分かれていて
   （例：羽田75／成田48／伊丹18／福岡12）、その内訳は備考の
   自由文にしか残っていなかった。行にすれば構造として残る。
   行数の上限は設けない（4か所に分かれる出図が実在するため）。
   ============================================================ */
function rangeQty(f,t){
  const a=parseInt(f,10),b=parseInt(t||f,10);
  return (isFinite(a)&&isFinite(b)&&b>=a)?String(b-a+1):(trim(f)?"1":"");
}
function normMeisai(list){
  return (Array.isArray(list)?list:[]).map(r=>({
    dest:trim(r.dest),qty:trim(r.qty),
    snFrom:pad5(r.snFrom),snTo:pad5(r.snTo),spec:trim(r.spec)
  })).filter(r=>r.dest||r.qty||r.snFrom||r.spec);
}
/* 旧形式（1行目/2・3行目）と、テキストの製造番号から明細を復元する。
   CSV取込やこれまでの登録分をそのまま読めるようにするため。 */
function meisaiFromLegacy(d){
  const out=[];
  const push=(f,t)=>{f=pad5(f);t=pad5(t);
    if(f||t)out.push({dest:"",qty:rangeQty(f,t),snFrom:f||t,snTo:t||f,spec:""})};
  if(d.serial_no_from1||d.serial_no_to1||d.serial_no_from2||d.serial_no_to2||d.serial_no_from3||d.serial_no_to3){
    push(d.serial_no_from1,d.serial_no_to1);
    push(d.serial_no_from2,d.serial_no_to2);
    push(d.serial_no_from3,d.serial_no_to3);
    return out;
  }
  String(d.serial_no||"").split(/\s*[\/、]\s*/).forEach(p=>{
    p=trim(p); if(!p)return;
    const m=p.split(/\s*[～~]\s*/); push(m[0],m[1]);
  });
  return out;
}
function combinedSerial(d){
  return (d.meisai||[]).map(r=>{
    if(!r.snFrom&&!r.snTo)return "";
    return (r.snTo&&r.snTo!==r.snFrom)?(r.snFrom+"～"+r.snTo):r.snFrom;
  }).filter(Boolean).join(" / ");
}
function meisaiUnits(list){
  return (list||[]).reduce((m,r)=>{const q=parseInt(r.qty,10);return m+(isFinite(q)&&q>0?q:0)},0);
}

/* --- 画面 --- */
function meisaiRowHtml(r){
  r=r||{};
  return '<tr>'+
    '<td><input class="m-dest" type="text" value="'+esc(r.dest||"")+'" placeholder="羽田"></td>'+
    '<td><input class="m-qty mnum" type="text" inputmode="numeric" value="'+esc(r.qty||"")+'"></td>'+
    '<td><input class="m-from mnum" type="text" inputmode="numeric" maxlength="5" value="'+esc(r.snFrom||"")+'" placeholder="00000"></td>'+
    '<td class="msep">～</td>'+
    '<td><input class="m-to mnum" type="text" value="'+esc(r.snTo||"")+'" readonly></td>'+
    '<td><input class="m-spec" type="text" value="'+esc(r.spec||"")+'" placeholder="（任意）"></td>'+
    '<td><button type="button" class="mdel" title="この行を削除" aria-label="この行を削除">×</button></td>'+
  '</tr>';
}
function renderMeisai(list){
  const rows=(list&&list.length)?list:[{}];
  $("meisaiRows").innerHTML=rows.map(meisaiRowHtml).join("");
  recalcMeisai();
}
function readMeisai(){
  return [...$("meisaiRows").querySelectorAll("tr")].map(tr=>({
    dest:tr.querySelector(".m-dest").value,
    qty :tr.querySelector(".m-qty").value,
    snFrom:tr.querySelector(".m-from").value,
    snTo:tr.querySelector(".m-to").value,
    spec:tr.querySelector(".m-spec").value
  }));
}
/* 台数から終わりの番号を出し、開始が空の行は前の行の続きにする。
   ただし開始は手で直せる（別の出図が挟まって番号が飛ぶ例があるため）。 */
function recalcMeisai(){
  let next=null,sum=0;
  $("meisaiRows").querySelectorAll("tr").forEach(tr=>{
    const fEl=tr.querySelector(".m-from"),tEl=tr.querySelector(".m-to");
    const q=parseInt(tr.querySelector(".m-qty").value,10);
    let from=parseInt(fEl.value,10);
    if(!isFinite(from)&&next!==null&&isFinite(q)&&q>0){from=next;fEl.value=pad5(String(from))}
    if(isFinite(from)&&isFinite(q)&&q>0){
      tEl.value=pad5(String(from+q-1)); next=from+q; sum+=q;
    }else{ tEl.value=""; if(isFinite(from))next=from; }
  });
  const total=unitCount($("units").value),el=$("meisaiChk");
  if(!sum){el.textContent="—";el.classList.remove("ng");return}
  const ok=(sum===total);
  el.classList.toggle("ng",!ok);
  el.textContent = ok ? `合計 ${sum}台 ・ 台数と一致 ✓`
    : (sum>total ? `合計 ${sum}台 ・ 台数(${total})を ${sum-total}台 超過`
                 : `合計 ${sum}台 ・ 台数(${total})まであと ${total-sum}台`);
}

/* ============================================================
   製造番号明細（1台=1レコード）への展開
   ------------------------------------------------------------
   出図を保存すると、明細の台数分だけ1台1行を作る。
   いまExcelでコピペして作っている出荷管理台帳が、ここで
   自動的にできあがる。資材が入れるのは出荷日と自重だけ。

   ★出荷実績のある行は絶対に消さない★
   台数を減らす編集をしたとき、対象の行に出荷日か自重が
   入っていたら削除せずに残し、件数を警告として出す。
   消えると復旧できない情報のため。
   ============================================================ */
function expandUnits(e){
  const out=[];
  (e.meisai||[]).forEach(r=>{
    const q=parseInt(r.qty,10),from=parseInt(r.snFrom,10);
    if(!isFinite(q)||q<1||!isFinite(from))return;
    for(let k=0;k<q;k++){
      out.push({
        sn:pad5(String(from+k)), dest:trim(r.dest), spec:trim(r.spec)
      });
    }
  });
  return out;
}
function unitFields(e,u){
  return {
    Title:u.sn, ShutsuzuNo:e.ship_no,
    DrawingNo:e.drawing_no, SpecNo:e.spec_no,
    Model:e.model, ProductName:e.product_name, Customer:e.customer,
    DeliveryTo:u.dest, Destination:u.dest,
    Capacity:numOrNull(e.capacity),
    UnitStatus:"未出荷",
    Remarks:u.spec
    /* 車体番号(CarNo)は入れていない。接頭辞が機種ごとに違い、
       採番規則が未確認のため。確認できたらここで自動採番する。 */
  };
}
async function fetchUnits(shipNo){
  const q=`/sites/${SITE_ID}/lists/${LIST_UNITS_ID}/items?expand=fields&$top=500`+
          `&$filter=fields/ShutsuzuNo eq '${encodeURIComponent(shipNo)}'`;
  return gGetAll(q,{Prefer:"HonorNonIndexedQueriesWarningMayFailRandomly"});
}
/* Graph の $batch は1回20件まで */
async function gBatch(requests){
  const out=[];
  for(let i=0;i<requests.length;i+=20){
    const chunk=requests.slice(i,i+20).map((r,k)=>({id:String(i+k),...r}));
    const b=await gFetch("POST","/$batch",{requests:chunk});
    out.push(...(b.responses||[]));
  }
  return out;
}
async function syncUnits(e,onProgress){
  const want=expandUnits(e), wantBy={};
  want.forEach(u=>wantBy[u.sn]=u);
  const have=await fetchUnits(e.ship_no), haveBy={};
  have.forEach(it=>haveBy[(it.fields||{}).Title]=it);

  const toCreate=[],toUpdate=[],toDelete=[],locked=[];
  want.forEach(u=>{
    const it=haveBy[u.sn];
    if(!it){toCreate.push(u);return}
    const f=it.fields||{};
    if(f.Destination!==u.dest||f.DrawingNo!==e.drawing_no||f.Remarks!==u.spec||f.Model!==e.model)
      toUpdate.push({id:it.id,u});
  });
  have.forEach(it=>{
    const f=it.fields||{};
    if(wantBy[f.Title])return;
    if(f.ShipDate||f.ActualWeight!=null){locked.push(f.Title)}  /* 出荷実績あり。消さない */
    else toDelete.push(it.id);
  });
  const total=toCreate.length+toUpdate.length+toDelete.length;
  if(!total)return {created:0,updated:0,deleted:0,locked:locked.length,skipped:true};

  const label=[];
  if(toCreate.length)label.push(`追加 ${toCreate.length}`);
  if(toUpdate.length)label.push(`更新 ${toUpdate.length}`);
  if(toDelete.length)label.push(`削除 ${toDelete.length}`);
  if(!confirm(`製造番号明細（出荷管理台帳）を更新します。\n\n${label.join(" / ")} 件\n\n実行しますか？`))
    return {cancelled:true};

  const base=`/sites/${SITE_ID}/lists/${LIST_UNITS_ID}/items`;
  const reqs=[]
    .concat(toCreate.map(u=>({method:"POST",url:base,body:{fields:unitFields(e,u)},
             headers:{"Content-Type":"application/json"}})))
    .concat(toUpdate.map(x=>({method:"PATCH",url:`${base}/${x.id}/fields`,body:unitFields(e,x.u),
             headers:{"Content-Type":"application/json"}})))
    .concat(toDelete.map(id=>({method:"DELETE",url:`${base}/${id}`})));

  if(onProgress)onProgress(`製造番号明細を更新中… ${reqs.length}件`);
  const res=await gBatch(reqs);
  const failed=res.filter(r=>r.status>=400);
  if(failed.length)console.error("明細の更新に失敗した分:",failed);
  return {created:toCreate.length,updated:toUpdate.length,deleted:toDelete.length,
          locked:locked.length,failed:failed.length,lockedList:locked};
}
async function deleteUnitsOf(shipNo){
  const have=await fetchUnits(shipNo);
  const del=[],locked=[];
  have.forEach(it=>{const f=it.fields||{};
    if(f.ShipDate||f.ActualWeight!=null)locked.push(f.Title); else del.push(it.id)});
  if(del.length){
    const base=`/sites/${SITE_ID}/lists/${LIST_UNITS_ID}/items`;
    await gBatch(del.map(id=>({method:"DELETE",url:`${base}/${id}`})));
  }
  return {deleted:del.length,locked:locked.length};
}

function parseCSV(t){const rows=[];let row=[],cell="",q=false;for(let i=0;i<t.length;i++){const c=t[i],n=t[i+1];if(c==='"'&&q&&n==='"'){cell+='"';i++}else if(c==='"'){q=!q}else if(c===','&&!q){row.push(cell);cell=""}else if((c==='\n'||c==='\r')&&!q){if(c==='\r'&&n==='\n')i++;row.push(cell);rows.push(row);row=[];cell=""}else cell+=c}if(cell||row.length){row.push(cell);rows.push(row)}return rows.filter(r=>r.some(v=>trim(v)))}

function importCSVFile(file){

/* 取込は「置き換え」ではなく「追記」。
   サーバー側の既存データを黙って消さないため。
   出図管理番号が同じものは上書きする。 */
async function bulkUpload(list,label){
  if(!list.length){toast("データがありません");return}
  if(!confirm(`${label}の ${list.length}件を SharePoint に取り込みます。\n出図管理番号が同じ行は上書きされます。実行しますか？`))return;
  const byNo={};CACHE.forEach(d=>{if(d.ship_no)byNo[d.ship_no]=d});
  let created=0,updated=0,failed=0;
  for(const e of list){
    try{
      const hit=e.ship_no?byNo[e.ship_no]:null;
      if(hit){e._id=hit._id;await spUpdate(e);updated++}
      else{if(!e.ship_no)e.ship_no=nextNo([...CACHE,...list.filter(x=>x.ship_no)]);await spCreate(e);created++}
    }catch(err){failed++;console.error(e.ship_no,err,err.body)}
  }
  await refreshFromServer();renderList();clearForm();
  toast(`${label}取込: 追加${created} / 更新${updated}` + (failed?` / 失敗${failed}（詳細はコンソール）`:""), failed>0);
}

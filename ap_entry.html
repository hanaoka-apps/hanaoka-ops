<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>支払明細入力 | 花岡車輌</title>
  <script src="https://cdn.jsdelivr.net/npm/@azure/msal-browser@3.10.0/lib/msal-browser.min.js" crossorigin="anonymous"></script>
  <style>
    :root {
      --primary:#1a5fa8; --primary-dk:#134680; --accent:#e8412e;
      --success:#2e7d52; --warning:#c07a00; --danger:#c0392b;
      --bg:#f4f6f9; --card:#fff; --border:#dde2ec;
      --text:#1e2533; --muted:#6b7a99; --shadow:0 1px 4px rgba(0,0,0,.08);
    }
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Meiryo','Hiragino Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}

    /* ─── Header ─── */
    header{background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 24px;height:52px;box-shadow:0 2px 8px rgba(0,0,0,.2);position:sticky;top:0;z-index:100}
    header .logo{font-size:16px;font-weight:700}
    header .logo span{opacity:.7;font-weight:400;font-size:13px;margin-left:10px}
    header .right{display:flex;align-items:center;gap:12px;font-size:13px}
    header .nav-btn{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.3);color:#fff;padding:5px 14px;border-radius:4px;cursor:pointer;font-size:12px;text-decoration:none;display:inline-block}
    header .nav-btn:hover{background:rgba(255,255,255,.25)}

    /* ─── Login ─── */
    #login-view{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:calc(100vh - 52px);gap:20px}
    #login-view h2{font-size:20px;color:var(--primary)}
    #login-btn{background:var(--primary);color:#fff;border:none;padding:12px 36px;border-radius:6px;font-size:15px;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:8px}
    #login-btn:hover{background:var(--primary-dk)}

    /* ─── Main ─── */
    #app-view{display:none;padding:24px;max-width:960px;margin:0 auto}

    /* ─── Top bar ─── */
    .top-bar{display:flex;align-items:center;gap:12px;margin-bottom:20px;background:var(--card);padding:12px 16px;border-radius:8px;border:1px solid var(--border);box-shadow:var(--shadow)}
    .top-bar label{font-size:13px;color:var(--muted);font-weight:600}
    .top-bar select{border:1px solid var(--border);border-radius:4px;padding:4px 10px;font-size:14px}
    .top-bar .spacer{flex:1}

    /* ─── タブ ─── */
    .tabs{display:flex;gap:4px;margin-bottom:20px}
    .tab-btn{padding:9px 20px;border:2px solid var(--border);background:var(--card);border-radius:6px 6px 0 0;cursor:pointer;font-size:14px;font-weight:600;color:var(--muted);transition:.15s}
    .tab-btn.active{border-color:var(--primary);border-bottom-color:var(--card);background:var(--card);color:var(--primary)}
    .tab-content{display:none;background:var(--card);border:2px solid var(--border);border-radius:0 8px 8px 8px;padding:24px;margin-bottom:24px;box-shadow:var(--shadow)}
    .tab-content.active{display:block}

    /* ─── フォーム ─── */
    .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
    @media(max-width:640px){.form-grid{grid-template-columns:1fr}}
    .form-group{display:flex;flex-direction:column;gap:5px}
    .form-group.full{grid-column:1/-1}
    .form-group label{font-size:12px;font-weight:700;color:var(--muted)}
    .form-group label .req{color:var(--danger);margin-left:2px}
    .form-group input,.form-group select,.form-group textarea{
      border:1px solid var(--border);border-radius:5px;padding:8px 10px;font-size:14px;font-family:inherit;
      transition:border-color .15s;background:#fff}
    .form-group input:focus,.form-group select:focus,.form-group textarea:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px rgba(26,95,168,.1)}
    .form-group textarea{resize:vertical;min-height:60px}
    .form-group input:disabled,.form-group select:disabled{background:#f8f9fc;color:var(--muted)}
    .amount-row{display:flex;gap:8px;align-items:center}
    .amount-row input{flex:1}
    .amount-row .calc-label{font-size:12px;color:var(--muted);white-space:nowrap}
    .hint{font-size:11px;color:var(--muted);margin-top:2px}
    .section-divider{grid-column:1/-1;border:none;border-top:1px solid var(--border);margin:4px 0}

    .form-actions{display:flex;gap:10px;margin-top:20px;padding-top:16px;border-top:1px solid var(--border)}
    .btn-primary{background:var(--primary);color:#fff;border:none;padding:10px 28px;border-radius:6px;font-size:14px;font-weight:700;cursor:pointer}
    .btn-primary:hover{background:var(--primary-dk)}
    .btn-primary:disabled{background:#a0aec0;cursor:not-allowed}
    .btn-secondary{background:#fff;color:var(--muted);border:1px solid var(--border);padding:10px 20px;border-radius:6px;font-size:14px;cursor:pointer}
    .btn-secondary:hover{background:var(--bg)}
    .btn-danger{background:var(--danger);color:#fff;border:none;padding:6px 14px;border-radius:4px;font-size:12px;cursor:pointer}
    .btn-danger:hover{background:#a93226}
    .btn-edit{background:#f0f4ff;color:var(--primary);border:1px solid #cce;padding:6px 14px;border-radius:4px;font-size:12px;cursor:pointer}

    /* ─── 一覧テーブル ─── */
    .list-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
    .list-header .title{font-size:15px;font-weight:700;color:var(--primary)}
    .table-wrap{background:var(--card);border:1px solid var(--border);border-radius:10px;box-shadow:var(--shadow);overflow-x:auto}
    table{width:100%;border-collapse:collapse;font-size:13px}
    th{background:#f8f9fc;padding:9px 12px;text-align:left;color:var(--muted);font-weight:600;font-size:12px;border-bottom:1px solid var(--border);white-space:nowrap}
    td{padding:9px 12px;border-bottom:1px solid #f0f3fa;vertical-align:middle}
    tr:last-child td{border-bottom:none}
    tr:hover td{background:#f8f9fc}
    .amount-td{font-weight:600;text-align:right;white-space:nowrap}
    .status-badge{display:inline-block;padding:2px 8px;border-radius:12px;font-size:11px;font-weight:600}
    .s-入力中{background:#e9ecef;color:#495057}
    .s-確認待{background:#fff3cd;color:#664d00}
    .s-決裁待{background:#cce5ff;color:#004085}
    .s-支払済{background:#d4edda;color:#155724}
    .s-差戻し{background:#fdecea;color:var(--danger);font-weight:700}
    .empty-msg{text-align:center;color:var(--muted);padding:30px}

    /* ─── スナックバー ─── */
    #snackbar{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);padding:10px 24px;border-radius:6px;font-size:13px;display:none;z-index:999;font-weight:600}
    #snackbar.ok{background:#d4edda;color:#155724;border:1px solid #c3e6cb}
    #snackbar.err{background:#fdecea;color:var(--danger);border:1px solid #f5c6cb}

    /* ─── モーダル ─── */
    .modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:200;align-items:center;justify-content:center}
    .modal-overlay.open{display:flex}
    .modal{background:#fff;border-radius:10px;padding:24px;width:90%;max-width:480px;box-shadow:0 8px 32px rgba(0,0,0,.2)}
    .modal h3{font-size:16px;margin-bottom:16px;color:var(--danger)}
    .modal-actions{display:flex;gap:10px;margin-top:20px;justify-content:flex-end}
  </style>
</head>
<body>

<header>
  <div class="logo">花岡車輌<span>支払管理システム</span></div>
  <div class="right">
    <a href="ap_dashboard.html" class="nav-btn">📊 ダッシュボード</a>
    <span id="user-name" style="opacity:.9;font-size:13px"></span>
    <button class="nav-btn" onclick="signOut()">サインアウト</button>
  </div>
</header>

<div id="login-view">
  <h2>支払明細入力</h2>
  <p style="color:var(--muted);font-size:14px">花岡車輌のMicrosoftアカウントでサインインしてください</p>
  <button id="login-btn" onclick="signIn()">
    <svg width="18" height="18" viewBox="0 0 21 21"><path d="M10 0H0v10h10V0z" fill="#F25022"/><path d="M21 0H11v10h10V0z" fill="#7FBA00"/><path d="M10 11H0v10h10V11z" fill="#00A4EF"/><path d="M21 11H11v10h10V11z" fill="#FFB900"/></svg>
    Microsoft アカウントでサインイン
  </button>
</div>

<div id="app-view">

  <!-- 月選択バー -->
  <div class="top-bar">
    <label>対象年月</label>
    <select id="month-select" onchange="loadList()"></select>
    <div class="spacer"></div>
    <span id="status-msg" style="font-size:12px;color:var(--muted)"></span>
  </div>

  <!-- タブ -->
  <div class="tabs">
    <button class="tab-btn active" onclick="switchTab('keiri')">💰 経費入力</button>
    <button class="tab-btn" onclick="switchTab('koza')">🏦 口座振替入力</button>
  </div>

  <!-- 経費入力タブ -->
  <div id="tab-keiri" class="tab-content active">
    <form id="form-keiri" onsubmit="submitEntry(event, 'keiri')">
      <div class="form-grid">

        <!-- 支払日区分 -->
        <div class="form-group">
          <label>支払日区分<span class="req">*</span></label>
          <select name="支払日区分" required>
            <option value="">選択してください</option>
            <option value="10日">毎月10日</option>
            <option value="20日">毎月20日</option>
            <option value="月末">月末</option>
          </select>
        </div>

        <!-- 支払区分 -->
        <div class="form-group">
          <label>支払区分<span class="req">*</span></label>
          <select name="支払区分" required onchange="onCategoryChange(this, 'keiri')">
            <option value="">選択してください</option>
            <option value="本社経費">本社経費</option>
            <option value="工場経費">工場経費</option>
          </select>
        </div>

        <!-- 拠点（自動補完） -->
        <div class="form-group">
          <label>拠点</label>
          <input name="拠点" type="text" readonly disabled placeholder="支払区分で自動設定">
        </div>

        <!-- 支払先名 -->
        <div class="form-group">
          <label>支払先名<span class="req">*</span></label>
          <input name="支払先名" type="text" required placeholder="例：東京電力エナジーパートナー">
        </div>

        <!-- 支払手段 -->
        <div class="form-group">
          <label>支払手段<span class="req">*</span></label>
          <select name="支払手段" required>
            <option value="">選択してください</option>
            <option value="総合振込">総合振込</option>
            <option value="でんさい">でんさい</option>
            <option value="海外送金">海外送金</option>
            <option value="現金">現金</option>
          </select>
        </div>

        <!-- 金額 -->
        <div class="form-group">
          <label>金額（税抜）<span class="req">*</span></label>
          <div class="amount-row">
            <input name="金額_税抜" type="number" min="0" required placeholder="0" oninput="calcTax(this.closest('form'))">
            <span class="calc-label">円（税抜）</span>
          </div>
        </div>

        <div class="form-group">
          <label>消費税</label>
          <div class="amount-row">
            <input name="消費税" type="number" min="0" placeholder="自動計算" oninput="calcFromTax(this.closest('form'))">
            <span class="calc-label">円</span>
          </div>
          <div class="hint">税抜入力で10%自動計算</div>
        </div>

        <div class="form-group">
          <label>金額（税込）</label>
          <div class="amount-row">
            <input name="金額_税込" type="number" min="0" placeholder="自動計算" readonly disabled>
            <span class="calc-label">円（税込）</span>
          </div>
        </div>

        <hr class="section-divider">

        <!-- 勘定科目 -->
        <div class="form-group">
          <label>勘定科目<span class="req">*</span></label>
          <select name="勘定科目名" id="keiri-account" required onchange="onAccountChange(this, 'keiri')">
            <option value="">支払区分を先に選択</option>
          </select>
        </div>

        <!-- 勘定科目コード（自動） -->
        <div class="form-group">
          <label>勘定科目コード</label>
          <input name="勘定科目コード" type="text" readonly disabled placeholder="科目選択で自動設定">
        </div>

        <!-- 部門 -->
        <div class="form-group">
          <label>部門<span class="req">*</span></label>
          <select name="部門コード" id="keiri-dept" required>
            <option value="">選択してください</option>
            <option value="001110">全社</option>
            <option value="002220">東京本社</option>
            <option value="002230">大阪</option>
            <option value="002240">名古屋</option>
            <option value="003110">工場全体</option>
            <option value="003210">第一工場</option>
            <option value="003220">第二工場</option>
            <option value="003230">第三工場</option>
            <option value="003310">技術部</option>
            <option value="003410">品質管理部</option>
            <option value="003510">工場総務</option>
            <option value="004110">本社総務部</option>
            <option value="005110">本社</option>
          </select>
        </div>

        <!-- 稟議区分 -->
        <div class="form-group">
          <label>稟議区分<span class="req">*</span></label>
          <select name="稟議区分" required onchange="onRingiChange(this, 'keiri')">
            <option value="">選択してください</option>
            <option value="定期">定期（稟議不要）</option>
            <option value="稟議あり">稟議あり</option>
          </select>
        </div>

        <!-- 稟議番号（稟議ありの場合のみ） -->
        <div class="form-group" id="keiri-ringi-no-group" style="display:none">
          <label>稟議番号<span class="req">*</span></label>
          <input name="稟議番号" type="text" placeholder="稟議番号を入力">
        </div>

        <hr class="section-divider">

        <!-- 請求書PDF -->
        <div class="form-group full">
          <label>請求書PDF</label>
          <input type="file" accept="application/pdf" id="keiri-file">
          <div class="hint">選択して登録すると BILLS/processed に保存され、下のDOCコードにリンクが自動入力されます（未選択でも登録可）</div>
        </div>

        <!-- DOCコード／証憑リンク（PDF選択で自動入力・手入力も可） -->
        <div class="form-group full">
          <label>DOCコード／証憑リンク</label>
          <input name="DOCコード" type="text" placeholder="PDFを選ぶと自動入力。手入力も可">
        </div>

        <!-- 摘要 -->
        <div class="form-group full">
          <label>摘要</label>
          <textarea name="摘要" placeholder="内容の補足説明があれば入力"></textarea>
        </div>

      </div><!-- /form-grid -->

      <div class="form-actions">
        <button type="submit" class="btn-primary" id="keiri-submit">💾 登録する</button>
        <button type="button" class="btn-secondary" onclick="resetForm('form-keiri')">リセット</button>
      </div>
    </form>
  </div>

  <!-- 口座振替入力タブ -->
  <div id="tab-koza" class="tab-content">
    <form id="form-koza" onsubmit="submitEntry(event, 'koza')">
      <div class="form-grid">

        <div class="form-group">
          <label>支払日区分<span class="req">*</span></label>
          <select name="支払日区分" required>
            <option value="">選択してください</option>
            <option value="10日">10日（1〜10日引落分）</option>
            <option value="20日">20日（11〜20日引落分）</option>
            <option value="月末">月末（21〜末日引落分）</option>
          </select>
        </div>

        <div class="form-group">
          <label>引落先名<span class="req">*</span></label>
          <input name="支払先名" type="text" required placeholder="例：ソフトバンク株式会社">
        </div>

        <div class="form-group">
          <label>引落予定日<span class="req">*</span></label>
          <input name="引落予定日" type="date" required>
        </div>

        <div class="form-group">
          <label>金額（税込）<span class="req">*</span></label>
          <div class="amount-row">
            <input name="金額_税込" type="number" min="0" required placeholder="0">
            <span class="calc-label">円</span>
          </div>
        </div>

        <div class="form-group">
          <label>勘定科目<span class="req">*</span></label>
          <select name="勘定科目名" id="koza-account" required onchange="onAccountChange(this, 'koza')">
            <option value="">選択してください</option>
            <optgroup label="本社経費（損益科目）">
              <option value="水道光熱費|000658">水道光熱費</option>
              <option value="通信費|000650">通信費</option>
              <option value="リース料|000661">リース料</option>
              <option value="保険料|000665">保険料</option>
              <option value="賃借料|000663">賃借料</option>
              <option value="租税公課|000664">租税公課</option>
              <option value="支払手数料|000668">支払手数料</option>
              <option value="諸会費|000671">諸会費</option>
              <option value="消耗品費|000659">消耗品費</option>
              <option value="修繕費|000657">修繕費</option>
              <option value="車輛消耗油脂費|000662">車輛消耗油脂費</option>
              <option value="雑費|000690">雑費</option>
            </optgroup>
            <optgroup label="工場経費（製造原価）">
              <option value="水道光熱費|000525">水道光熱費（工場）</option>
              <option value="通信費|000520">通信費（工場）</option>
              <option value="リース料|000530">リース料（工場）</option>
              <option value="保険料|000532">保険料（工場）</option>
              <option value="租税公課|000531">租税公課（工場）</option>
              <option value="修繕費|000523">修繕費（工場）</option>
              <option value="機械修繕費|000524">機械修繕費</option>
              <option value="消耗品費|000526">消耗品費（工場）</option>
              <option value="雑費|000545">雑費（工場）</option>
            </optgroup>
          </select>
        </div>

        <div class="form-group">
          <label>勘定科目コード</label>
          <input name="勘定科目コード" type="text" readonly disabled placeholder="科目選択で自動設定">
        </div>

        <div class="form-group">
          <label>部門<span class="req">*</span></label>
          <select name="部門コード" id="koza-dept" required>
            <option value="">選択してください</option>
            <option value="001110">全社</option>
            <option value="002220">東京本社</option>
            <option value="002230">大阪</option>
            <option value="002240">名古屋</option>
            <option value="003110">工場全体</option>
            <option value="003210">第一工場</option>
            <option value="003220">第二工場</option>
            <option value="003230">第三工場</option>
            <option value="003310">技術部</option>
            <option value="003410">品質管理部</option>
            <option value="003510">工場総務</option>
            <option value="004110">本社総務部</option>
            <option value="005110">本社</option>
          </select>
        </div>

        <!-- 請求書PDF -->
        <div class="form-group full">
          <label>請求書PDF</label>
          <input type="file" accept="application/pdf" id="koza-file">
          <div class="hint">選択して登録すると BILLS/processed に保存され、下のDOCコードにリンクが自動入力されます（未選択でも登録可）</div>
        </div>

        <div class="form-group full">
          <label>DOCコード／証憑リンク</label>
          <input name="DOCコード" type="text" placeholder="PDFを選ぶと自動入力。手入力も可">
        </div>

        <div class="form-group full">
          <label>摘要</label>
          <textarea name="摘要" placeholder="補足説明があれば入力（例：〇〇年〇月分 電話代）"></textarea>
        </div>

      </div>

      <div class="form-actions">
        <button type="submit" class="btn-primary" id="koza-submit">💾 登録する</button>
        <button type="button" class="btn-secondary" onclick="resetForm('form-koza')">リセット</button>
      </div>
    </form>
  </div>

  <!-- 今月の入力一覧 -->
  <div class="list-header">
    <span class="title">📋 今月の入力一覧</span>
    <span id="list-count" style="font-size:13px;color:var(--muted)"></span>
  </div>
  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>支払日区分</th>
          <th>支払区分</th>
          <th>支払先名</th>
          <th>金額（税込）</th>
          <th>勘定科目</th>
          <th>ステータス</th>
          <th>操作</th>
        </tr>
      </thead>
      <tbody id="list-tbody"></tbody>
    </table>
  </div>

</div><!-- /app-view -->

<!-- 削除確認モーダル -->
<div class="modal-overlay" id="delete-modal">
  <div class="modal">
    <h3>⚠ 削除の確認</h3>
    <p id="delete-msg" style="font-size:14px;color:var(--text)"></p>
    <div class="modal-actions">
      <button class="btn-secondary" onclick="closeDeleteModal()">キャンセル</button>
      <button class="btn-danger" onclick="confirmDelete()">削除する</button>
    </div>
  </div>
</div>

<div id="snackbar"></div>

<script>
// ============================================================
// 設定
// ============================================================
const MSAL_CONFIG = {
  auth: {
    clientId:   'd338d61b-01dc-4c7c-ac6b-aecf7f30d716',
    authority:  'https://login.microsoftonline.com/3933e8a0-c945-4e97-ae67-c82131087cad',
    redirectUri: window.location.origin + window.location.pathname,
  },
  cache: { cacheLocation: 'sessionStorage', storeAuthStateInCookie: false },
};
const SCOPES     = ['User.Read', 'Sites.ReadWrite.All'];
const GRAPH_BASE = 'https://graph.microsoft.com/v1.0';
const AP_SITE_ID = 'hanaokacorp.sharepoint.com,d80378dd-76a4-43f0-b939-1af66345d19d,8eaeb70b-2495-4029-affb-eabe80e021bb';
const LIST_NAME  = 'AP_PaymentSlip';

let msalInstance = null, currentAccount = null;
let fieldMap = {}, listId = null;
let allEntries = [];
let pendingDeleteId = null;

// ============================================================
// 勘定科目マスタ（拠点別）
// ============================================================
const ACCOUNTS = {
  '本社経費': [
    {name:'給料手当',     code:'000641'}, {name:'旅費交通費',       code:'000648'},
    {name:'通信費',       code:'000650'}, {name:'荷造運賃',         code:'000652'},
    {name:'交際費',       code:'000656'}, {name:'修繕費',           code:'000657'},
    {name:'水道光熱費',   code:'000658'}, {name:'消耗品費',         code:'000659'},
    {name:'消耗事務費',   code:'000660'}, {name:'リース料',         code:'000661'},
    {name:'車輛消耗油脂費',code:'000662'},{name:'賃借料',           code:'000663'},
    {name:'租税公課',     code:'000664'}, {name:'保険料',           code:'000665'},
    {name:'業務委託手数料',code:'000667'},{name:'支払手数料',       code:'000668'},
    {name:'顧問料',       code:'000670'}, {name:'諸会費',           code:'000671'},
    {name:'新聞図書費',   code:'000672'}, {name:'研修費',           code:'000673'},
    {name:'会議費',       code:'000675'}, {name:'減価償却費',       code:'000689'},
    {name:'雑費',         code:'000690'},
  ],
  '工場経費': [
    {name:'外注加工費',   code:'000507'}, {name:'給料手当（工場）', code:'000510'},
    {name:'旅費交通費（工場）',code:'000519'},{name:'通信費（工場）',code:'000520'},
    {name:'運搬費',       code:'000521'}, {name:'交際費（工場）',   code:'000522'},
    {name:'修繕費（工場）',code:'000523'},{name:'機械修繕費',       code:'000524'},
    {name:'水道光熱費（工場）',code:'000525'},{name:'消耗品費（工場）',code:'000526'},
    {name:'消耗工具備品費',code:'000527'},{name:'消耗油脂費',       code:'000528'},
    {name:'車輛消耗油脂費（工場）',code:'000529'},{name:'リース料（工場）',code:'000530'},
    {name:'租税公課（工場）',code:'000531'},{name:'保険料（工場）', code:'000532'},
    {name:'支払手数料（工場）',code:'000533'},{name:'消耗事務費（工場）',code:'000541'},
    {name:'会議費（工場）',code:'000542'},{name:'減価償却費（工場）',code:'000544'},
    {name:'雑費（工場）', code:'000545'},
  ],
};

// ============================================================
// MSAL認証
// ============================================================
async function initMsal() {
  msalInstance = new msal.PublicClientApplication(MSAL_CONFIG);
  await msalInstance.initialize();
  await msalInstance.handleRedirectPromise();
  const accounts = msalInstance.getAllAccounts();
  if (accounts.length > 0) {
    currentAccount = accounts[0];
    msalInstance.setActiveAccount(currentAccount);
    await showApp();
  }
}

async function signIn() {
  try {
    const result = await msalInstance.loginPopup({ scopes: SCOPES });
    currentAccount = result.account;
    msalInstance.setActiveAccount(currentAccount);
    await showApp();
  } catch (e) {
    if (e.errorCode !== 'user_cancelled') showSnack('サインインエラー: ' + e.message, true);
  }
}

function signOut() {
  msalInstance.logoutPopup({ account: currentAccount });
}

async function getToken() {
  try {
    const r = await msalInstance.acquireTokenSilent({ scopes: SCOPES, account: currentAccount });
    return r.accessToken;
  } catch {
    const r = await msalInstance.acquireTokenPopup({ scopes: SCOPES });
    currentAccount = r.account;
    return r.accessToken;
  }
}

// ============================================================
// Graph API
// ============================================================
async function graphRequest(method, path, body = null) {
  const token = await getToken();
  const res = await fetch(`${GRAPH_BASE}${path}`, {
    method,
    headers: { Authorization: `Bearer ${token}`, 'Content-Type': 'application/json' },
    body: body ? JSON.stringify(body) : null,
  });
  if (method === 'DELETE') return;
  const text = await res.text();
  if (!res.ok) throw new Error(`[${res.status}] ${text.slice(0, 200)}`);
  return text ? JSON.parse(text) : {};
}

// ============================================================
// フィールドマップ取得（キャッシュ）
// ============================================================
async function ensureFieldMap() {
  if (Object.keys(fieldMap).length && listId) return;
  const listsData = await graphRequest('GET', `/sites/${AP_SITE_ID}/lists`);
  const list = listsData.value.find(l => l.displayName === LIST_NAME);
  if (!list) throw new Error(`リスト "${LIST_NAME}" が見つかりません`);
  listId = list.id;
  const colData = await graphRequest('GET', `/sites/${AP_SITE_ID}/lists/${listId}/columns`);
  colData.value.forEach(c => { fieldMap[c.displayName] = c.name; });
}

function fi(displayName) { return fieldMap[displayName] || displayName; }

function fv(fields, displayName) {
  const key = fieldMap[displayName];
  return key ? (fields[key] ?? '') : '';
}

// ============================================================
// 初期表示
// ============================================================
async function showApp() {
  document.getElementById('login-view').style.display  = 'none';
  document.getElementById('app-view').style.display    = 'block';
  document.getElementById('user-name').textContent = currentAccount.name || currentAccount.username;
  initMonthSelector();
  await ensureFieldMap();
  await loadList();
}

function initMonthSelector() {
  const sel = document.getElementById('month-select');
  const now = new Date();
  for (let i = 0; i < 6; i++) {
    const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
    const val = `${d.getFullYear()}/${String(d.getMonth()+1).padStart(2,'0')}`;
    const opt = document.createElement('option');
    opt.value = val; opt.textContent = val;
    if (i === 0) opt.selected = true;
    sel.appendChild(opt);
  }
  // フォームの対象年月も設定
  const currentYM = now.getFullYear() + '/' + String(now.getMonth()+1).padStart(2,'0');
  document.querySelectorAll('input[name="対象年月"]').forEach(el => el.value = currentYM);
}

function selectedMonth() { return document.getElementById('month-select').value; }

// ============================================================
// タブ切り替え
// ============================================================
function switchTab(id) {
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
  document.querySelector(`.tab-btn[onclick="switchTab('${id}')"]`).classList.add('active');
  document.getElementById(`tab-${id}`).classList.add('active');
}

// ============================================================
// フォームイベント
// ============================================================
function onCategoryChange(sel, tab) {
  const cat = sel.value;
  const form = sel.closest('form');
  // 拠点自動設定
  const chiikiInput = form.querySelector('input[name="拠点"]');
  if (chiikiInput) {
    chiikiInput.value = cat.startsWith('工場') ? '工場' : '本社';
  }
  // 勘定科目ドロップダウン更新
  const accSel = form.querySelector('select[name="勘定科目名"]');
  if (!accSel) return;
  accSel.innerHTML = '<option value="">選択してください</option>';
  const accts = ACCOUNTS[cat] || [];
  accts.forEach(a => {
    const opt = document.createElement('option');
    opt.value = `${a.name}|${a.code}`;
    opt.textContent = a.name;
    accSel.appendChild(opt);
  });
}

function onAccountChange(sel, tab) {
  const parts = sel.value.split('|');
  const form = sel.closest('form');
  const codeInput = form.querySelector('input[name="勘定科目コード"]');
  if (codeInput) codeInput.value = parts[1] || '';
}

function onRingiChange(sel, tab) {
  const group = document.getElementById(`${tab}-ringi-no-group`);
  if (group) group.style.display = sel.value === '稟議あり' ? 'block' : 'none';
}

function calcTax(form) {
  const excl = parseFloat(form.querySelector('input[name="金額_税抜"]').value) || 0;
  const tax  = Math.floor(excl * 0.1);
  const inc  = excl + tax;
  form.querySelector('input[name="消費税"]').value  = tax || '';
  form.querySelector('input[name="金額_税込"]').value = inc || '';
}

function calcFromTax(form) {
  const excl = parseFloat(form.querySelector('input[name="金額_税抜"]').value) || 0;
  const tax  = parseFloat(form.querySelector('input[name="消費税"]').value)  || 0;
  form.querySelector('input[name="金額_税込"]').value = excl + tax || '';
}

function resetForm(formId) {
  document.getElementById(formId).reset();
  const form = document.getElementById(formId);
  const accSel = form.querySelector('select[name="勘定科目名"]');
  if (accSel) { accSel.innerHTML = '<option value="">支払区分を先に選択</option>'; }
  const codeIn = form.querySelector('input[name="勘定科目コード"]');
  if (codeIn) codeIn.value = '';
  const ringiGroup = form.querySelector('[id$="-ringi-no-group"]');
  if (ringiGroup) ringiGroup.style.display = 'none';
}

// ============================================================
// 請求書PDFアップロード（Shared Documents/BILLS/processed へ）
// ============================================================
async function uploadEvidence(file) {
  const token = await getToken();
  const ts = new Date().toISOString().replace(/[-:T.]/g, '').slice(0, 14);
  const safe = file.name.replace(/[#%*<>?/\\{|}:]/g, '_');
  const fname = `${ts}_${safe}`;
  const res = await fetch(
    `${GRAPH_BASE}/sites/${AP_SITE_ID}/drive/root:/BILLS/processed/${encodeURIComponent(fname)}:/content`,
    { method: 'PUT', headers: { Authorization: `Bearer ${token}`, 'Content-Type': file.type || 'application/pdf' }, body: file }
  );
  if (!res.ok) throw new Error(`PDFアップロード失敗 [${res.status}] ${await res.text()}`);
  const item = await res.json();
  return item.webUrl;
}

// ============================================================
// エントリ登録
// ============================================================
async function submitEntry(e, tab) {
  e.preventDefault();
  const form = e.target;
  const submitBtn = form.querySelector('button[type="submit"]');
  submitBtn.disabled = true;
  submitBtn.textContent = '登録中...';

  try {
    const data = Object.fromEntries(new FormData(form));
    const month = selectedMonth();

    // 勘定科目名からコードを分離
    if (data['勘定科目名']?.includes('|')) {
      const [name, code] = data['勘定科目名'].split('|');
      data['勘定科目名'] = name;
      data['勘定科目コード'] = code;
    }

    // 必須項目の補完
    data['対象年月']   = month;
    data['入力者']     = currentAccount.name || currentAccount.username;
    data['支払ステータス'] = '入力中';
    data['仕訳ステータス'] = '未着手';
    if (tab === 'koza') {
      data['支払区分']  = '口座振替';
      data['支払手段']  = '口座振替';
      data['拠点']      = '本社';
      data['稟議区分']  = '定期';
    }

    // 請求書PDFがあれば BILLS/processed にアップロードし、DOCコードにリンクを格納
    const fileInput = form.querySelector('input[type="file"]');
    const file = fileInput && fileInput.files && fileInput.files[0];
    if (file) {
      submitBtn.textContent = 'PDFアップロード中...';
      data['DOCコード'] = await uploadEvidence(file);
      submitBtn.textContent = '登録中...';
    }

    // SharePointフィールドに変換
    const fields = {};
    const numFields  = new Set(['金額_税抜','消費税','金額_税込']);
    const boolFields = new Set([]);
    const skipFields = new Set(['稟議番号']); // 空の場合はスキップ

    for (const [k, v] of Object.entries(data)) {
      if (skipFields.has(k) && !v) continue;
      const internal = fieldMap[k];
      if (!internal) continue; // マッピングなしはスキップ
      if (numFields.has(k))  fields[internal] = parseFloat(v) || 0;
      else if (boolFields.has(k)) fields[internal] = v === 'true';
      else if (v) fields[internal] = v;
    }

    await graphRequest('POST', `/sites/${AP_SITE_ID}/lists/${listId}/items`, { fields });

    showSnack('✅ 登録しました！');
    resetForm(form.id);
    await loadList();

  } catch (err) {
    showSnack('❌ 登録エラー: ' + err.message, true);
    console.error(err);
  } finally {
    submitBtn.disabled = false;
    submitBtn.textContent = '💾 登録する';
  }
}

// ============================================================
// 一覧読み込み
// ============================================================
async function loadList() {
  const msg = document.getElementById('status-msg');
  msg.textContent = '読み込み中...';
  try {
    await ensureFieldMap();
    const month = selectedMonth();
    let items = [], next = `/sites/${AP_SITE_ID}/lists/${listId}/items?$expand=fields&$top=500`;
    while (next) {
      const data = await graphRequest('GET', next);
      items = items.concat(data.value || []);
      next = data['@odata.nextLink'] ? data['@odata.nextLink'].replace(GRAPH_BASE,'') : null;
    }
    allEntries = items.filter(it => fv(it.fields,'対象年月') === month);
    renderList();
    msg.textContent = `${allEntries.length}件 読込済み`;
  } catch (e) {
    msg.textContent = 'エラー';
    showSnack('データ取得エラー: ' + e.message, true);
  }
}

function renderList() {
  const tbody = document.getElementById('list-tbody');
  document.getElementById('list-count').textContent = `${allEntries.length}件`;

  if (!allEntries.length) {
    tbody.innerHTML = '<tr><td colspan="7" class="empty-msg">まだ入力データがありません</td></tr>';
    return;
  }

  tbody.innerHTML = allEntries.map(item => {
    const f   = item.fields;
    const st  = fv(f,'支払ステータス') || '入力中';
    const amt = parseFloat(fv(f,'金額_税込')) || 0;
    const canEdit = ['入力中','差戻し'].includes(st);
    return `<tr>
      <td>${fv(f,'支払日区分')||'—'}</td>
      <td>${fv(f,'支払区分')||'—'}</td>
      <td style="max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${fv(f,'支払先名')||''}">${fv(f,'支払先名')||'—'}</td>
      <td class="amount-td">¥${amt.toLocaleString()}</td>
      <td style="font-size:12px">${fv(f,'勘定科目名')||'—'}</td>
      <td><span class="status-badge s-${st}">${st}</span></td>
      <td style="white-space:nowrap">
        ${canEdit ? `<button class="btn-danger" onclick="openDeleteModal('${item.id}','${(fv(f,'支払先名')||'').replace(/'/g,"\\'")}')">削除</button>` : '<span style="font-size:11px;color:var(--muted)">変更不可</span>'}
      </td>
    </tr>`;
  }).join('');
}

// ============================================================
// 削除
// ============================================================
function openDeleteModal(id, name) {
  pendingDeleteId = id;
  document.getElementById('delete-msg').textContent = `「${name}」の支払明細を削除します。この操作は元に戻せません。`;
  document.getElementById('delete-modal').classList.add('open');
}

function closeDeleteModal() {
  pendingDeleteId = null;
  document.getElementById('delete-modal').classList.remove('open');
}

async function confirmDelete() {
  if (!pendingDeleteId) return;
  try {
    await graphRequest('DELETE', `/sites/${AP_SITE_ID}/lists/${listId}/items/${pendingDeleteId}`);
    closeDeleteModal();
    showSnack('✅ 削除しました');
    await loadList();
  } catch (e) {
    showSnack('❌ 削除エラー: ' + e.message, true);
  }
}

// ============================================================
// ユーティリティ
// ============================================================
function showSnack(msg, isErr = false) {
  const el = document.getElementById('snackbar');
  el.textContent = msg;
  el.className = isErr ? 'err' : 'ok';
  el.style.display = 'block';
  setTimeout(() => { el.style.display = 'none'; }, 4000);
}

// ============================================================
// 初期化
// ============================================================
initMsal().catch(e => {
  console.error(e);
  showSnack('認証エラー: ' + e.message, true);
});
</script>

<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>仕訳明細 | 花岡車輌</title>
<script src="https://cdn.jsdelivr.net/npm/@azure/msal-browser@3.10.0/lib/msal-browser.min.js" crossorigin="anonymous"></script>
<style>
  :root { --primary:#1a5fa8; --bg:#f4f6f9; --card-bg:#fff; --border:#dde2ec; --text:#1e2533; --muted:#6b7a99; --shadow:0 1px 4px rgba(0,0,0,.08); }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:'Meiryo','Hiragino Sans',sans-serif; background:var(--bg); color:var(--text); }
  nav { background:#1f1e1c;color:#fff;padding:8px 24px;font-size:13px;display:flex;gap:18px;align-items:center; }
  nav a { color:#fff;text-decoration:none;opacity:.75; }
  nav a.on { opacity:1; font-weight:700; }
  #login-view { display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:70vh; gap:16px; }
  #login-view button { background:var(--primary); color:#fff; border:none; padding:12px 32px; border-radius:6px; font-size:15px; font-weight:700; cursor:pointer; }
  #app-view { display:none; padding:20px 24px; max-width:1200px; margin:0 auto; }
  .toolbar { display:flex; gap:10px; flex-wrap:wrap; align-items:center; background:var(--card-bg); border:1px solid var(--border); border-radius:8px; padding:12px 16px; margin-bottom:16px; box-shadow:var(--shadow); }
  .toolbar select, .toolbar input { border:1px solid var(--border); border-radius:4px; padding:6px 10px; font-size:13px; }
  .toolbar input[type=text] { min-width:220px; }
  .summary { font-size:13px; color:var(--muted); margin-bottom:10px; }
  table { width:100%; border-collapse:collapse; background:var(--card-bg); border:1px solid var(--border); border-radius:8px; overflow:hidden; font-size:13px; }
  th, td { padding:8px 10px; border-bottom:1px solid var(--border); text-align:left; }
  th { background:#eef2f8; color:var(--primary); font-size:12px; cursor:pointer; user-select:none; }
  td.num { text-align:right; font-variant-numeric:tabular-nums; }
  tr:hover td { background:#f7f9fc; }
  .empty-msg { color:var(--muted); font-size:13px; padding:40px 0; text-align:center; }
</style>
</head>
<body>
<nav>
  <strong style="opacity:.55;font-weight:600;">会計ダッシュボード</strong>
  <a href="kaikei_dashboard.html">会計サマリー</a>
  <a href="kaikei_ledger.html" class="on">仕訳明細</a>
  <a href="kaikei_budget.html">予算・前年実績</a>
  <a href="kaikei_upload.html">データ取り込み</a>
</nav>

<div id="login-view">
  <h2>仕訳明細</h2>
  <p style="color:var(--muted);font-size:13px;">役員限定です。Microsoftアカウントでサインインしてください。</p>
  <button id="login-btn">サインイン</button>
  <div id="login-err" style="color:#b03636;font-size:13px;"></div>
</div>

<div id="app-view">
  <div class="toolbar">
    <label>対象月度</label>
    <select id="month-select"></select>
    <label>科目</label>
    <select id="account-select"><option value="">すべて</option></select>
    <label>部門</label>
    <select id="bumon-select"><option value="">すべて</option></select>
    <input type="text" id="keyword" placeholder="摘要キーワード">
    <input type="number" id="minAmount" placeholder="金額(税抜) 以上">
  </div>
  <div class="summary" id="summary"></div>
  <table>
    <thead>
      <tr>
        <th data-k="0">科目</th><th data-k="1">伝票日付</th><th data-k="2">貸借</th>
        <th data-k="3">金額(税抜)</th><th data-k="4">部門</th><th data-k="5">相手科目</th>
        <th data-k="6">摘要</th><th data-k="7">担当者</th><th data-k="8">伝票№</th>
      </tr>
    </thead>
    <tbody id="tbody"></tbody>
  </table>
  <div id="emptyMsg" class="empty-msg" style="display:none;"></div>
</div>

<script src="kaikei_graph.js"></script>
<script>
let accountMaster = {};
let journal = [];
let filtered = [];
let sortKey = 1, sortDir = -1;

function qs(name) { return new URLSearchParams(location.search).get(name); }
function fmtDate(d) { if (!d || d.length !== 8) return d; return d.slice(0, 4) + '/' + d.slice(4, 6) + '/' + d.slice(6, 8); }
function fmtYen(n) { return Math.round(n).toLocaleString('ja-JP'); }

function applyFilters() {
  const acc = document.getElementById('account-select').value;
  const bumon = document.getElementById('bumon-select').value;
  const kw = document.getElementById('keyword').value.trim();
  const minAmt = parseFloat(document.getElementById('minAmount').value) || 0;

  filtered = journal.filter(r => {
    if (acc && r[0] !== acc) return false;
    if (bumon && r[4] !== bumon) return false;
    if (kw && !(r[6] || '').includes(kw)) return false;
    if (minAmt && Math.abs(r[3]) < minAmt) return false;
    return true;
  });
  sortAndRender();
}

function sortAndRender() {
  filtered.sort((a, b) => {
    const av = a[sortKey], bv = b[sortKey];
    if (typeof av === 'number') return (av - bv) * sortDir;
    return String(av).localeCompare(String(bv)) * sortDir;
  });
  render();
}

function render() {
  const tbody = document.getElementById('tbody');
  const rows = filtered.slice(0, 2000); // 表示上限（多すぎる場合はキーワード等で絞り込みを促す）
  tbody.innerHTML = rows.map(r => {
    const meta = accountMaster[r[0]] || {};
    return `<tr>
      <td>${meta.name || r[0]}</td>
      <td>${fmtDate(r[1])}</td>
      <td>${r[2]}</td>
      <td class="num">${fmtYen(r[3])}</td>
      <td>${r[4]}</td>
      <td>${r[5]}</td>
      <td>${r[6]}</td>
      <td>${r[7]}</td>
      <td>${r[8]}</td>
    </tr>`;
  }).join('');
  const total = filtered.reduce((s, r) => s + r[3], 0);
  document.getElementById('summary').textContent =
    `${filtered.length.toLocaleString()}件 / 合計 ${fmtYen(total)}円` + (filtered.length > rows.length ? `（先頭${rows.length}件を表示）` : '');
  document.getElementById('emptyMsg').style.display = filtered.length ? 'none' : 'block';
  if (!filtered.length) document.getElementById('emptyMsg').textContent = '条件に一致する明細がありません。';
}

document.querySelectorAll('th[data-k]').forEach(th => {
  th.addEventListener('click', () => {
    const k = parseInt(th.dataset.k, 10);
    sortDir = (sortKey === k) ? -sortDir : 1;
    sortKey = k;
    sortAndRender();
  });
});
['account-select', 'bumon-select'].forEach(id => document.getElementById(id).addEventListener('change', applyFilters));
document.getElementById('keyword').addEventListener('input', applyFilters);
document.getElementById('minAmount').addEventListener('input', applyFilters);

async function loadMonth(month) {
  const data = await kaikeiGetFile('monthly/' + month + '.json', { allow404: true });
  journal = (data && data.journal) || [];

  const accSel = document.getElementById('account-select');
  const codesInJournal = [...new Set(journal.map(r => r[0]))].sort();
  accSel.innerHTML = '<option value="">すべて</option>' + codesInJournal.map(c => {
    const meta = accountMaster[c] || {};
    return `<option value="${c}">${meta.name || c}</option>`;
  }).join('');

  const bumonSel = document.getElementById('bumon-select');
  const bumons = [...new Set(journal.map(r => r[4]).filter(Boolean))].sort();
  bumonSel.innerHTML = '<option value="">すべて</option>' + bumons.map(b => `<option value="${b}">${b}</option>`).join('');

  const initCodes = qs('codes');
  if (initCodes) {
    // 複数科目指定時は最初の1件をプルダウンに反映しつつ、実フィルタは複数科目対応の関数で行う
    const codeList = initCodes.split(',');
    filtered = journal.filter(r => codeList.includes(r[0]));
    sortAndRender();
  } else {
    applyFilters();
  }
}

async function boot() {
  const signedIn = await kaikeiInitAuth();
  if (!signedIn) return;
  document.getElementById('login-view').style.display = 'none';
  document.getElementById('app-view').style.display = 'block';

  accountMaster = await kaikeiGetFile('account_master.json', { allow404: true }) || {};
  const idx = await kaikeiGetFile('monthly/_index.json', { allow404: true }) || { months: [] };
  const sel = document.getElementById('month-select');
  sel.innerHTML = idx.months.map(m => `<option value="${m}">${m.slice(0, 4)}年${m.slice(4)}月</option>`).join('');

  const initMonth = qs('month');
  const startMonth = (initMonth && idx.months.includes(initMonth)) ? initMonth : idx.months[idx.months.length - 1];
  if (startMonth) {
    sel.value = startMonth;
    await loadMonth(startMonth);
  }
  sel.addEventListener('change', () => loadMonth(sel.value));
}

document.getElementById('login-btn').addEventListener('click', async () => {
  document.getElementById('login-err').textContent = '';
  try {
    await kaikeiSignIn();
    await boot();
  } catch (e) { document.getElementById('login-err').textContent = e.message || String(e); }
});
boot();
</script>
</body>
</html>

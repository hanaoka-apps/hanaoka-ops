<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>出荷入力</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@azure/msal-browser@3.10.0/lib/msal-browser.min.js" crossorigin="anonymous"></script>
<style>
/* ============================================================
   出荷入力（資材・松川さん向け）
   ------------------------------------------------------------
   ・入力するのは 出荷日 と 自重 の2つだけ
   ・現場のスマートフォンで押せる大きさにしてある
   ・迷う道を作らない：検索欄は1つ、ボタンは1画面に1つが基本
   ============================================================ */
:root{--brand:#2f7dd1;--brand-dark:#2467ae;--bg:#f4f8fc;--line:#dfe4ea;
  --soft:#f7fafd;--muted:#666e78;--ok:#1f7a4d;--ok-bg:#e9f7ef;--danger:#c33;--text:#1d2126}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--text);
  font-family:"Noto Sans JP","Segoe UI","Hiragino Kaku Gothic ProN",sans-serif;
  font-size:17px;line-height:1.7;-webkit-text-size-adjust:100%}
.wrap{max-width:560px;margin:0 auto;padding:14px 14px 60px}
header{display:flex;align-items:center;gap:10px;padding:6px 2px 14px;flex-wrap:wrap}
header h1{font-size:21px;margin:0;letter-spacing:.01em}
header .who{margin-left:auto;font-size:13px;color:var(--muted)}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px 16px 18px;margin-bottom:14px}
label{display:block;font-weight:700;font-size:15px;margin-bottom:6px}
input,button,select{font-family:inherit;font-size:17px}
input[type=text],input[type=number],input[type=date]{
  width:100%;padding:14px 14px;border:1px solid var(--line);border-radius:11px;
  background:#fff;color:var(--text)}
input:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px rgba(47,125,209,.14)}
button{border:none;border-radius:12px;background:var(--brand);color:#fff;font-weight:700;
  padding:16px 18px;width:100%;cursor:pointer;min-height:56px}
button:active{background:var(--brand-dark)}
button:disabled{background:#b9c4d0}
button.sub{background:#fff;color:var(--brand);border:1.5px solid var(--brand)}
button.plain{background:#fff;color:#555;border:1px solid var(--line);font-weight:500}
.row2{display:flex;gap:10px}
.row2>*{flex:1}
.hint{font-size:13.5px;color:var(--muted);margin:8px 0 0}
.big{font-size:26px;font-weight:800;letter-spacing:.02em}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:15px;margin-top:10px}
.kv .k{color:var(--muted)}
.pill{display:inline-block;border-radius:999px;padding:3px 12px;font-size:13px;font-weight:700}
.pill.yet{background:#fff4e0;color:#8a5a00}
.pill.done{background:var(--ok-bg);color:var(--ok)}
.msg{border-radius:12px;padding:13px 15px;font-size:15px;margin-bottom:14px;display:none}
.msg.on{display:block}
.msg.err{background:#fdecec;border:1px solid #f3c2c2;color:#8d2020}
.msg.ok{background:var(--ok-bg);border:1px solid #b9e3cb;color:var(--ok)}
.done-card{text-align:center;padding:26px 16px}
.done-card .mark{font-size:44px;line-height:1;color:var(--ok)}
.done-card .t{font-size:23px;font-weight:800;margin:8px 0 2px}
.done-card .s{color:var(--muted);font-size:15px;margin-bottom:18px}
.list button.item{background:#fff;color:var(--text);border:1px solid var(--line);
  text-align:left;padding:13px 14px;margin-bottom:8px;font-weight:500;min-height:0}
.list button.item .sn{font-size:18px;font-weight:800;letter-spacing:.02em}
.list button.item .sub2{font-size:13px;color:var(--muted)}
.list button.item.done{background:var(--soft);color:#8a939c}
.gate{text-align:center;padding:34px 18px}
.gate h2{font-size:19px;margin:0 0 8px}
.gate p{color:var(--muted);font-size:15px;margin:0 0 20px}
body:not(.in) .app{display:none}
body.in .gate{display:none}
.spin{display:none;text-align:center;color:var(--muted);font-size:15px;padding:14px}
.spin.on{display:block}
.recent{font-size:14px;color:var(--muted)}
.recent b{color:var(--text)}
.recent div{padding:4px 0;border-top:1px solid #f0f2f5}
.foot{text-align:center;color:var(--muted);font-size:12.5px;margin-top:20px;line-height:1.9}
</style>
</head>
<body>
<div class="wrap">

<header>
  <h1>出荷入力</h1>
  <span class="who" id="who"></span>
</header>

<div class="gate card">
  <h2>サインインしてください</h2>
  <p>会社のアカウントでサインインすると、<br>出荷日と自重を入力できます。</p>
  <button id="btnIn">サインイン</button>
</div>

<div class="app">
  <div class="msg err" id="err"></div>

  <!-- 1. さがす -->
  <div class="card" id="cardFind">
    <label for="q">製造番号を入れてください</label>
    <input id="q" type="text" inputmode="numeric" autocomplete="off"
           placeholder="例）80587" enterkeyhint="search">
    <div style="height:10px"></div>
    <button id="btnFind">さがす</button>
    <p class="hint">車体番号や、出図管理番号でも探せます。<br>
      出図管理番号（例 00002）を入れると、その出図の一覧が出ます。</p>
  </div>

  <div class="spin" id="spin">さがしています…</div>

  <!-- 2. 一覧（出図番号で引いたとき） -->
  <div class="card list" id="cardList" style="display:none">
    <label id="listTitle">未入力の車両</label>
    <div id="listBody"></div>
    <button class="plain" id="btnListBack">別の番号をさがす</button>
  </div>

  <!-- 3. 1台の入力 -->
  <div class="card" id="cardOne" style="display:none">
    <div class="big" id="oneSn"></div>
    <div id="oneStatus" style="margin-top:6px"></div>
    <div class="kv" id="oneKv"></div>
  </div>

  <div class="card" id="cardEdit" style="display:none">
    <label for="shipDate">出荷日</label>
    <div class="row2">
      <input id="shipDate" type="date">
      <button class="plain" id="btnToday" style="max-width:110px">今日</button>
    </div>
    <div style="height:16px"></div>
    <label for="weight">自重（kg）</label>
    <input id="weight" type="text" inputmode="numeric" placeholder="例）1250">
    <div style="height:18px"></div>
    <button id="btnSave">登録する</button>
    <button class="plain" id="btnCancel" style="margin-top:9px">やめる</button>
    <p class="hint" id="editHint"></p>
  </div>

  <!-- 4. 完了 -->
  <div class="card done-card" id="cardDone" style="display:none">
    <div class="mark">✓</div>
    <div class="t">登録しました</div>
    <div class="s" id="doneWhat"></div>
    <button id="btnNext">つづけて入力する</button>
    <button class="sub" id="btnBackList" style="margin-top:9px;display:none">一覧にもどる</button>
  </div>

  <div class="card" id="cardRecent" style="display:none">
    <label>さっき入力した分</label>
    <div class="recent" id="recentBody"></div>
    <p class="hint">まちがえたときは、その製造番号をもう一度さがして入れ直してください。</p>
  </div>

  <div class="foot">
    入力できるのは <b>出荷日</b> と <b>自重</b> だけです。<br>
    ほかの項目は技術部が入れています。
  </div>
</div>

</div>

<script>
/* ============================================================
   つなぎ先
   ============================================================ */
const MSAL_CONFIG={auth:{clientId:"d338d61b-01dc-4c7c-ac6b-aecf7f30d716",
  authority:"https://login.microsoftonline.com/3933e8a0-c945-4e97-ae67-c82131087cad",
  redirectUri:new URL("auth.html",window.location.href).href},
  cache:{cacheLocation:"sessionStorage",storeAuthStateInCookie:false}};
const SCOPES=["User.Read","Sites.ReadWrite.All"];
const GRAPH_BASE="https://graph.microsoft.com/v1.0";
const SP_HOST="hanaokacorp.sharepoint.com",SP_PATH="/sites/shutsuzu";
const LIST_UNITS="製造番号明細";
let msalInstance=null,account=null,SITE_ID=null,UNITS_ID=null;
let CURRENT=null,LIST_CTX=null,RECENT=[];

const $=id=>document.getElementById(id);
const trim=s=>(s||"").toString().trim();
const esc=s=>String(s==null?"":s).replace(/[&<>'"]/g,c=>
  ({"&":"&amp;","<":"&lt;",">":"&gt;","'":"&#39;",'"':"&quot;"}[c]));
/* スマホの日本語入力だと全角数字（１２５０）が入る。
   そのまま数字以外を捨てると桁が消えるので、先に半角へ直す。 */
const toHalf=v=>String(v==null?"":v)
  .replace(/[０-９]/g,c=>String.fromCharCode(c.charCodeAt(0)-0xFEE0))
  .replace(/[Ａ-Ｚａ-ｚ]/g,c=>String.fromCharCode(c.charCodeAt(0)-0xFEE0))
  .replace(/[‐‑‒–—―ー－]/g,"-").replace(/\u3000/g," ");
const digits=v=>toHalf(v).replace(/[^0-9]/g,"");
const today=()=>new Date().toLocaleDateString("sv-SE");   /* YYYY-MM-DD（ローカル日付） */
const jp=v=>{const t=String(v||"").slice(0,10);return t?t.replace(/-/g,"/"):""};

function showErr(m){$("err").textContent=m;$("err").classList.add("on");
  window.scrollTo({top:0,behavior:"smooth"})}
function clearErr(){$("err").classList.remove("on")}
function busy(on){$("spin").classList.toggle("on",!!on)}
function show(id,on){$(id).style.display=on?"":"none"}
function onlyFind(){show("cardFind",true);show("cardList",false);show("cardOne",false);
  show("cardEdit",false);show("cardDone",false)}

/* ---- Graph ---- */
async function token(){
  try{return (await msalInstance.acquireTokenSilent({scopes:SCOPES,account:account})).accessToken}
  catch{const r=await msalInstance.acquireTokenPopup({scopes:SCOPES});account=r.account;return r.accessToken}
}
async function g(method,path,body,extra){
  const t=await token();
  const r=await fetch(GRAPH_BASE+path,{method,
    headers:{Authorization:"Bearer "+t,...(body?{"Content-Type":"application/json"}:{}),...(extra||{})},
    body:body?JSON.stringify(body):undefined});
  if(!r.ok){const e=new Error("["+r.status+"] "+method+" "+path);e.status=r.status;
    e.body=await r.text();throw e}
  return r.status===204?null:r.json();
}
const PREF={Prefer:"HonorNonIndexedQueriesWarningMayFailRandomly"};
async function gAll(path,h){
  let out=[],next=path;
  while(next){const d=await g("GET",next,null,h);out=out.concat(d.value||[]);
    next=d["@odata.nextLink"]?d["@odata.nextLink"].replace(GRAPH_BASE,""):null}
  return out;
}

/* ---- サインイン ---- */
async function init(){
  try{
    msalInstance=new msal.PublicClientApplication(MSAL_CONFIG);
    await msalInstance.initialize();
    const a=msalInstance.getAllAccounts();
    if(a.length){account=a[0];await signedIn()}
  }catch(e){showErr("うまく始められませんでした。画面を読み込み直してください。");console.error(e)}
}
async function signIn(){
  try{const r=await msalInstance.loginPopup({scopes:SCOPES});account=r.account;await signedIn()}
  catch(e){showErr("サインインできませんでした。もう一度お試しください。");console.error(e)}
}
async function signedIn(){
  $("who").textContent=(account.name||account.username||"")+" さん";
  try{
    SITE_ID=(await g("GET","/sites/"+SP_HOST+":"+SP_PATH)).id;
    const lists=await gAll("/sites/"+SITE_ID+"/lists?$select=id,name,displayName");
    const u=lists.find(x=>x.displayName===LIST_UNITS||x.name===LIST_UNITS);
    if(!u)throw new Error("製造番号明細が見つかりません");
    UNITS_ID=u.id;
    document.body.classList.add("in");
    $("shipDate").value=today();
    $("q").focus();
  }catch(e){
    console.error(e);
    document.body.classList.remove("in");
    showErr(e.status===403?"このデータを見る権限がありません。総務にご連絡ください。"
      :"データにつながりませんでした。総務にご連絡ください。");
  }
}

/* ---- さがす ---- */
function unitOf(it){const f=it.fields||{};return {
  id:it.id,sn:f.Title||"",car:f.CarNo||"",shipNo:f.ShutsuzuNo||"",
  model:f.Model||"",product:f.ProductName||"",customer:f.Customer||"",
  dest:f.DeliveryTo||f.Destination||"",zu:f.DrawingNo||"",
  date:(f.ShipDate||"").slice(0,10),weight:f.ActualWeight==null?"":String(f.ActualWeight),
  status:f.UnitStatus||""}}
async function findBy(field,val){
  const q="/sites/"+SITE_ID+"/lists/"+UNITS_ID+"/items?expand=fields&$top=200&$filter=fields/"
    +field+" eq '"+encodeURIComponent(val)+"'";
  return (await gAll(q,PREF)).map(unitOf);
}
async function doFind(){
  clearErr();
  const v=trim(toHalf($("q").value));
  if(v!==trim($("q").value))$("q").value=v;   /* 全角で入れても探せるように */
  if(!v){showErr("番号を入れてください。");return}
  busy(true);show("cardList",false);show("cardOne",false);show("cardEdit",false);show("cardDone",false);
  try{
    let r=await findBy("Title",v);
    if(!r.length)r=await findBy("CarNo",v);
    if(r.length===1){LIST_CTX=null;openOne(r[0]);return}
    if(r.length>1){openList(v+" の車両",r);return}
    /* 出図管理番号として引いてみる */
    const byShip=await findBy("ShutsuzuNo",v);
    if(byShip.length){openList("出図 "+v+"　"+byShip.length+"台",byShip);return}
    showErr("「"+v+"」は見つかりませんでした。番号をご確認ください。");
  }catch(e){
    console.error(e);
    showErr(e.status===403?"このデータを見る権限がありません。総務にご連絡ください。"
      :"うまくさがせませんでした。電波の状態を確かめて、もう一度お試しください。");
  }finally{busy(false)}
}
function openList(title,units){
  units.sort((a,b)=>String(a.sn).localeCompare(String(b.sn)));
  LIST_CTX={title:title,units:units};
  const yet=units.filter(u=>!u.date).length;
  $("listTitle").textContent=title+"　（未入力 "+yet+"台）";
  $("listBody").innerHTML=units.map((u,i)=>
    '<button type="button" class="item'+(u.date?" done":"")+'" data-i="'+i+'">'+
    '<div class="sn">'+esc(u.sn)+'</div>'+
    '<div class="sub2">'+esc(u.dest||"—")+'　'+
      (u.date?("出荷 "+jp(u.date)+(u.weight?("　"+u.weight+"kg"):"")):"未入力")+'</div></button>').join("");
  show("cardFind",false);show("cardList",true);show("cardOne",false);show("cardEdit",false);
}
function openOne(u){
  CURRENT=u;
  $("oneSn").textContent=u.sn;
  $("oneStatus").innerHTML=u.date
    ? '<span class="pill done">入力済</span>'
    : '<span class="pill yet">未入力</span>';
  const rows=[["車体番号",u.car],["品名",u.product],["型式",u.model],
    ["受注先",u.customer],["行き先",u.dest],["図番",u.zu],["出図管理番号",u.shipNo]];
  $("oneKv").innerHTML=rows.filter(r=>trim(r[1]))
    .map(r=>'<div class="k">'+esc(r[0])+'</div><div>'+esc(r[1])+'</div>').join("");
  $("shipDate").value=u.date||today();
  $("weight").value=u.weight||"";
  $("editHint").textContent=u.date
    ? "すでに入っている内容を直すこともできます。"
    : "出荷日を入れて登録すると「出荷済」になります。";
  show("cardFind",false);show("cardList",false);
  show("cardOne",true);show("cardEdit",true);show("cardDone",false);
  window.scrollTo({top:0,behavior:"smooth"});
}

/* ---- 登録 ---- */
async function save(){
  clearErr();
  if(!CURRENT)return;
  const d=$("shipDate").value,w=digits($("weight").value);
  if(!d&&!w){showErr("出荷日か自重のどちらかを入れてください。");return}
  const body={};
  if(d){body.ShipDate=d+"T00:00:00Z";body.UnitStatus="出荷済"}
  if(w)body.ActualWeight=Number(w);
  $("btnSave").disabled=true;$("btnSave").textContent="登録しています…";
  try{
    await g("PATCH","/sites/"+SITE_ID+"/lists/"+UNITS_ID+"/items/"+CURRENT.id+"/fields",body);
    CURRENT.date=d;CURRENT.weight=w;if(d)CURRENT.status="出荷済";
    RECENT.unshift({sn:CURRENT.sn,date:d,weight:w});RECENT=RECENT.slice(0,8);
    renderRecent();
    if(LIST_CTX){const t=LIST_CTX.units.find(x=>x.id===CURRENT.id);
      if(t){t.date=d;t.weight=w;t.status=CURRENT.status}}
    $("doneWhat").textContent="製造番号 "+CURRENT.sn+"　"+
      (d?("出荷日 "+jp(d)):"")+(d&&w?"　":"")+(w?("自重 "+w+"kg"):"");
    show("cardOne",false);show("cardEdit",false);show("cardDone",true);
    show("btnBackList",!!LIST_CTX);
    $("btnBackList").style.display=LIST_CTX?"":"none";
    window.scrollTo({top:0,behavior:"smooth"});
  }catch(e){
    console.error(e);
    showErr(e.status===403?"このデータを直す権限がありません。総務にご連絡ください。"
      :"登録できませんでした。電波の状態を確かめて、もう一度「登録する」を押してください。");
  }finally{$("btnSave").disabled=false;$("btnSave").textContent="登録する"}
}
function renderRecent(){
  if(!RECENT.length){show("cardRecent",false);return}
  show("cardRecent",true);
  $("recentBody").innerHTML=RECENT.map(r=>
    '<div><b>'+esc(r.sn)+'</b>　'+(r.date?jp(r.date):"—")+
    (r.weight?("　"+esc(r.weight)+"kg"):"")+'</div>').join("");
}
function nextOne(){
  if(LIST_CTX){
    const yet=LIST_CTX.units.find(u=>!u.date);
    if(yet){openOne(yet);return}
    openList(LIST_CTX.title,LIST_CTX.units);
    show("cardDone",false);return;
  }
  CURRENT=null;$("q").value="";onlyFind();$("q").focus();
}

/* ---- 配線 ---- */
document.addEventListener("DOMContentLoaded",()=>{
  $("btnIn").onclick=signIn;
  $("btnFind").onclick=doFind;
  $("q").addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();doFind()}});
  $("q").addEventListener("input",e=>{clearErr()});
  $("btnToday").onclick=()=>{$("shipDate").value=today()};
  $("weight").addEventListener("input",e=>{e.target.value=digits(e.target.value)});
  $("btnSave").onclick=save;
  $("btnCancel").onclick=()=>{
    if(LIST_CTX){openList(LIST_CTX.title,LIST_CTX.units);return}
    CURRENT=null;$("q").value="";onlyFind();$("q").focus();
  };
  $("btnNext").onclick=nextOne;
  $("btnBackList").onclick=()=>{show("cardDone",false);openList(LIST_CTX.title,LIST_CTX.units)};
  $("btnListBack").onclick=()=>{LIST_CTX=null;$("q").value="";onlyFind();$("q").focus()};
  $("listBody").addEventListener("click",e=>{
    const b=e.target.closest("button.item");if(!b)return;
    openOne(LIST_CTX.units[+b.dataset.i]);
  });
  init();
});
</script>
</body>
</html>

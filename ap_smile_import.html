<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>仕入の取り込み | 花岡車輌</title>
<script src="https://cdn.jsdelivr.net/npm/@azure/msal-browser@3.10.0/lib/msal-browser.min.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js" crossorigin="anonymous"></script>
<script src="ap_smile.js"></script>
<script src="nav.js" defer></script>
<style>
  :root{--primary:#1a5fa8;--primary-dk:#134680;--ok:#2e7d52;--warn:#b26a00;--danger:#c0392b;--bg:#f4f6f9;--card:#fff;--border:#dde2ec;--text:#1e2533;--muted:#6b7a99;}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'Meiryo','Hiragino Sans',sans-serif;background:var(--bg);color:var(--text);font-size:13px;}
  header{background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 24px;height:52px;position:sticky;top:0;z-index:100;box-shadow:0 2px 8px rgba(0,0,0,.2);}
  header .logo{font-size:16px;font-weight:700;}header .logo span{opacity:.7;font-weight:400;font-size:13px;margin-left:10px;}
  header .user-info{display:flex;align-items:center;gap:12px;font-size:13px;}
  header button{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.3);color:#fff;padding:5px 14px;border-radius:4px;cursor:pointer;font-size:12px;}
  #login-view{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:calc(100vh - 52px);gap:20px;}
  #login-btn{background:var(--primary);color:#fff;border:none;padding:12px 36px;border-radius:6px;font-size:15px;font-weight:700;cursor:pointer;}
  #app-view{display:none;}
  .toolbar{display:flex;align-items:center;gap:12px;padding:9px 20px;background:var(--card);border-bottom:1px solid var(--border);flex-wrap:wrap;}
  .toolbar label{font-size:12px;color:var(--muted);font-weight:600;}
  .toolbar select,.toolbar input{border:1px solid var(--border);border-radius:4px;padding:4px 8px;font-size:13px;}
  .toolbar .links{margin-left:auto;display:flex;gap:14px;}.toolbar .links a{color:var(--primary);text-decoration:none;}
  .btn{background:var(--primary);color:#fff;border:none;padding:6px 14px;border-radius:5px;cursor:pointer;font-size:12px;font-weight:700;}
  .btn:disabled{background:#b8c4d6;cursor:default;}
  .btn.g{background:#fff;color:var(--primary);border:1px solid var(--primary);font-weight:400;}
  .btn.ok{background:var(--ok);}.btn.d{background:#fff;color:var(--danger);border:1px solid var(--danger);font-weight:400;}
  .wrap{padding:12px 20px;}
  .card{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:12px 14px;margin-bottom:12px;}
  .card h3{font-size:14px;color:var(--primary);margin-bottom:8px;}
  .drop{border:2px dashed var(--border);border-radius:8px;padding:14px;text-align:center;color:var(--muted);cursor:pointer;display:block;}
  .drop.over{border-color:var(--primary);background:#eef3fb;}
  .drop input{display:none;}
  .fchips{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:8px;margin-top:10px;}
  .fchip{border:1px solid var(--border);border-radius:6px;padding:7px 10px;background:#fbfcfe;}
  .fchip .k{font-size:11px;color:var(--muted);}.fchip .n{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .fchip.ok{border-color:#b7dfc4;background:#f2fbf4;}.fchip.miss{border-style:dashed;color:var(--muted);}
  .checks{list-style:none;}.checks li{padding:3px 0;}
  .ck-ok{color:var(--ok);font-weight:700;}.ck-ng{color:var(--danger);font-weight:700;}.ck-info{color:var(--warn);font-weight:700;}
  .banner{border-radius:6px;padding:8px 12px;margin-bottom:10px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
  .banner.pending{background:#fff8e1;border:1px solid #ffe08a;}.banner.saved{background:#eef5fc;border:1px solid #c8dcf2;}
  .sumbar{display:flex;gap:18px;flex-wrap:wrap;align-items:baseline;}
  .sumbar .s{color:var(--muted);}.sumbar .s b{color:var(--text);font-size:16px;margin-left:4px;}
  .sumbar .s i{font-style:normal;font-size:11px;margin-left:4px;}
  .up{color:var(--danger);}.down{color:var(--ok);}
  .seg{display:inline-flex;border:1px solid var(--border);border-radius:6px;overflow:hidden;}
  .seg button{background:#fff;border:none;padding:4px 11px;font-size:12px;cursor:pointer;color:var(--muted);}
  .seg button.on{background:var(--primary);color:#fff;font-weight:700;}
  .main{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:12px;align-items:start;}
  @media(max-width:1100px){.main{grid-template-columns:1fr;}}
  .list{max-height:calc(100vh - 250px);overflow:auto;border:1px solid var(--border);border-radius:8px;background:#fff;}
  table.vl{width:100%;border-collapse:collapse;font-size:12px;}
  table.vl th{position:sticky;top:0;background:#eef2f8;padding:6px 7px;text-align:left;color:var(--muted);font-weight:600;font-size:11px;z-index:1;white-space:nowrap;}
  table.vl td{padding:5px 7px;border-bottom:1px solid #eef2f8;}
  td.num,th.num{text-align:right;white-space:nowrap;}
  tr.vrow{cursor:pointer;}tr.vrow:hover td{background:#eef3fb;}tr.vrow.active td{background:#e4edf9;}
  .pill{display:inline-block;font-size:10px;font-weight:700;padding:1px 6px;border-radius:8px;margin-right:2px;white-space:nowrap;}
  .p-tr{background:#e6f1fb;color:#185fa5;}.p-den{background:#efe6fb;color:#6a3fb0;}.p-teg{background:#fbeede;color:#854f0b;}.p-sai{background:#eef0f4;color:#555;}.p-kai{background:#fde8e8;color:#a33;}
  .p-new{background:#e6f4ea;color:#2e7d32;}.p-chg{background:#fdecea;color:var(--danger);}.p-gone{background:#eee;color:#777;}
  .p-ck{background:#d4edda;color:#155724;}.p-rv{background:#fff3cd;color:#8a6d00;}
  .note-dot{color:var(--warn);font-weight:700;}
  .detail{background:#fff;border:1px solid var(--border);border-radius:8px;padding:12px 14px;position:sticky;top:60px;max-height:calc(100vh - 80px);overflow:auto;}
  .detail h2{font-size:17px;color:var(--primary);}
  .kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin:8px 0;}
  .kv div{background:#fbfcfe;border:1px solid var(--border);border-radius:6px;padding:6px 9px;}
  .kv .l{font-size:11px;color:var(--muted);}.kv .v{font-size:15px;font-weight:700;}
  .sec{margin-top:12px;}.sec h4{font-size:12px;color:var(--muted);margin-bottom:5px;}
  table.sp{border-collapse:collapse;font-size:12px;width:100%;}
  table.sp th{background:#f1f4f9;padding:4px 6px;text-align:left;color:var(--muted);font-size:11px;}
  table.sp td{padding:3px 6px;border-bottom:1px solid #f0f3fa;}
  table.sp input,table.sp select{border:1px solid var(--border);border-radius:4px;padding:3px 5px;font-size:12px;}
  textarea{width:100%;border:1px solid var(--border);border-radius:4px;padding:5px 7px;font-size:12px;font-family:inherit;}
  .notes li{margin-left:16px;color:#7a5200;}
  .empty{color:var(--muted);text-align:center;padding:50px 20px;}
  .prog{height:6px;background:#e6eaf2;border-radius:3px;overflow:hidden;margin-top:6px;}.prog div{height:100%;background:var(--primary);width:0;}
  #snackbar{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#323232;color:#fff;padding:10px 20px;border-radius:6px;font-size:13px;display:none;z-index:999;white-space:pre-wrap;}
</style>
</head>
<body>
<header>
  <div class="logo">花岡車輌<span>仕入の取り込み（SMILE）</span></div>
  <div class="user-info"><span id="user-name"></span><button onclick="signOut()">サインアウト</button></div>
</header>
<div id="login-view">
  <h2 style="color:#1a5fa8">仕入の取り込み</h2>
  <p style="color:#6b7a99">花岡車輌の Microsoft アカウントでサインインしてください</p>
  <button id="login-btn" onclick="signIn()">サインイン</button>
</div>

<div id="app-view">
  <div id="app-nav-slot"></div>
  <div class="toolbar">
    <label>決済月</label><select id="month-select" onchange="onMonth()"></select>
    <span id="status-msg" style="font-size:12px;color:var(--muted)"></span>
    <div class="links"><a href="ap_purchase_match.html">🧾 仕入のチェック</a><a href="ap_payment.html">💴 支払一覧・承認</a></div>
  </div>
  <div class="wrap">
    <div class="card">
      <h3>① SMILE のファイルを置く</h3>
      <label class="drop" id="drop">📂 ここに4つのファイルをまとめてドラッグ（またはクリックして選ぶ）<br>
        <span style="font-size:11px">販売_支払一覧表MMDD.xlsx ／ 9055支払明細書.csv ／ 9521受入リスト.csv ／ 仕入先マスタ.csv（どれかを置き直すと、その分だけ入れ替わります）</span>
        <input type="file" id="file-in" multiple accept=".csv,.xlsx,.xls" onchange="onFiles(this.files);this.value=''">
      </label>
      <div class="fchips" id="fchips"></div>
    </div>
    <div class="card" id="check-card" style="display:none"><details id="check-det"><summary style="cursor:pointer"><b style="color:var(--primary)">② 照合</b> <span id="check-sum" style="font-size:12px"></span></summary><ul class="checks" id="checks" style="margin-top:6px"></ul></details></div>
    <div id="banner"></div>
    <div class="card" id="sum-card" style="display:none"><div class="sumbar" id="sumbar"></div></div>
    <div id="body"></div>
  </div>
</div>
<div id="snackbar"></div>

<script>
/* 仕入の取り込み
   SMILE の 支払一覧表・9055・9521・仕入先マスタ を読み、照合して、決済月×仕入先の「仕入の支払」（AP_SmilePay）に保存する。
   ・SMILE の数字は取り込み直すたびに上書き。アプリでの作業（分け方の上書き・理由・確認・コメント）は残す
   ・金額が変わった仕入先は確認を外す。分け方を変えていた仕入先は「見直しが要る」
   ・SMILE を締めた後の修正は AP_CarryAdjust に残し、翌月の取り込みで相殺する
   計算は ap_smile.js。決め事は 08_支払決裁.md（ワークフロー作成）。画面に業務データを書かない。 */
const MSAL_CONFIG={auth:{clientId:'d338d61b-01dc-4c7c-ac6b-aecf7f30d716',authority:'https://login.microsoftonline.com/3933e8a0-c945-4e97-ae67-c82131087cad',redirectUri:new URL('auth.html',window.location.href).href},cache:{cacheLocation:'sessionStorage'}};
const SCOPES=['User.Read','Sites.ReadWrite.All','Files.ReadWrite.All'];
const GRAPH='https://graph.microsoft.com/v1.0';
const AP_SITE='hanaokacorp.sharepoint.com,d80378dd-76a4-43f0-b939-1af66345d19d,8eaeb70b-2495-4029-affb-eabe80e021bb';
const S=window.APSmile;
const MOCK=window.AP_MOCK||null;   // 開発用（dev だけで読み込む）。本番では無い
let msalApp=null,acct=null;
const L={imp:{name:'AP_SmileImport'},pay:{name:'AP_SmilePay'},adj:{name:'AP_CarryAdjust'}};
Object.values(L).forEach(o=>{o.id=null;o.fmap={};});
// 置いたファイル
const FILES={payList:null,p9055:null,receipts:null,master:null};
const KIND_LABEL={payList:'支払一覧表',p9055:'9055 支払明細書',receipts:'9521 受入リスト',master:'仕入先マスタ'};
let calc=null;            // 置いたファイルから計算した結果（保存前）
let saved={};             // この決済月の AP_SmilePay（code → {id,f}）
let prevSaved={};         // 前月の AP_SmilePay（前月比）
let adjs=[];              // AP_CarryAdjust 全件
let settleSel={};         // 今回の取り込みで相殺する繰越の調整（id → true）
let lastImport=null;      // この決済月の最新の取り込み
let rows=[],selected=null,filt='all',deptF='all',roundF='all',q='';

// ---------- 認証・Graph ----------
async function boot(){
  if(MOCK){acct=MOCK.account;await showApp();return;}
  msalApp=new msal.PublicClientApplication(MSAL_CONFIG);await msalApp.initialize();await msalApp.handleRedirectPromise();
  const a=msalApp.getAllAccounts();if(a.length){acct=a[0];msalApp.setActiveAccount(acct);await showApp();}}
async function signIn(){try{const r=await msalApp.loginPopup({scopes:SCOPES});acct=r.account;msalApp.setActiveAccount(acct);await showApp();}catch(e){if(e.errorCode!=='user_cancelled')snack('サインインエラー: '+e.message,true);}}
function signOut(){if(msalApp)msalApp.logoutPopup({account:acct});}
async function token(){try{const r=await msalApp.acquireTokenSilent({scopes:SCOPES,account:acct});return r.accessToken;}catch{const r=await msalApp.acquireTokenPopup({scopes:SCOPES});acct=r.account;return r.accessToken;}}
async function call(method,p,body,ctype){
  if(MOCK)return MOCK.call(method,p,body);
  const t=await token();const h={Authorization:'Bearer '+t,Prefer:'HonorNonIndexedQueriesWarningMayFailRandomly'};
  if(body!=null&&!ctype)h['Content-Type']='application/json';if(ctype)h['Content-Type']=ctype;
  const r=await fetch(p.startsWith('http')?p:GRAPH+p,{method,headers:h,body:body==null?null:(ctype?body:JSON.stringify(body))});
  if(!r.ok)throw new Error('['+r.status+'] '+(await r.text()).slice(0,300));
  const x=await r.text();return x?JSON.parse(x):{};}
const gget=p=>call('GET',p),gpost=(p,b)=>call('POST',p,b),gpatch=(p,b)=>call('PATCH',p,b);
async function gputFile(path,file){return call('PUT',`/sites/${AP_SITE}/drive/root:${encodeURI(path)}:/content`,file,file.type||'application/octet-stream');}
async function fetchAll(o,filter){let all=[],n=`/sites/${AP_SITE}/lists/${o.id}/items?$expand=fields&$top=500`+(filter?'&$filter='+encodeURIComponent(filter):'');
  while(n){const d=await gget(n);all=all.concat(d.value||[]);n=d['@odata.nextLink']?d['@odata.nextLink'].replace(GRAPH,''):null;}return all;}
async function resolveLists(){
  const ls=await gget(`/sites/${AP_SITE}/lists?$select=id,displayName`);
  for(const o of Object.values(L)){const l=ls.value.find(x=>x.displayName===o.name);if(!l)throw new Error(o.name+' がありません（Provision-SmileAP.ps1 で作ってください）');o.id=l.id;
    const c=await gget(`/sites/${AP_SITE}/lists/${o.id}/columns?$select=name,displayName`);c.value.forEach(x=>o.fmap[x.displayName]=x.name);}
  await loadRules();}
// 決まり（部門の振り分け・手数料・サイトと期日・支払率の判定額）は AP_Setting の smile.rules に持つ（画面に書かない）
async function loadRules(){
  const d=await gget(`/sites/${AP_SITE}/lists/AP_Setting/items?$expand=fields&$top=100`);
  const it=(d.value||[]).find(x=>x.fields&&x.fields.Title==='smile.rules');
  if(!it)throw new Error('AP_Setting に smile.rules がありません（Provision-SmileAP.ps1 -Apply で入れてください）');
  S.setRules(JSON.parse(it.fields.Value||'{}'));}
const F=(o,d)=>o.fmap[d]||d;
const fv=(o,f,d)=>f[F(o,d)];
function toFields(o,obj){const r={};for(const k in obj)r[F(o,k)]=obj[k];return r;}

// ---------- 決済月 ----------
function ymOf(d){return d.getFullYear()+'/'+String(d.getMonth()+1).padStart(2,'0');}
function initMonth(){const s=document.getElementById('month-select');const n=new Date();
  for(let i=-1;i<6;i++){const d=new Date(n.getFullYear(),n.getMonth()-i,1);const o=document.createElement('option');o.value=o.textContent=ymOf(d);if(i===0)o.selected=true;s.appendChild(o);}
  const qm=new URLSearchParams(location.search).get('month');if(qm)setMonth(qm);}
function setMonth(v){const s=document.getElementById('month-select');if(![...s.options].some(o=>o.value===v)){const o=document.createElement('option');o.value=o.textContent=v;s.insertBefore(o,s.firstChild);}s.value=v;}
function month(){return document.getElementById('month-select').value;}
function prevMonth(ym){const [y,m]=ym.split('/').map(Number);return ymOf(new Date(y,m-2,1));}
function payYmDash(ym){return ym.replace('/','-');}

async function showApp(){
  document.getElementById('login-view').style.display='none';document.getElementById('app-view').style.display='block';
  document.getElementById('user-name').textContent=acct.name||acct.username;initMonth();setupDrop();
  try{await resolveLists();await loadSaved();}catch(e){msg('エラー');snack(e.message,true);}
  render();}
async function onMonth(){calc=null;selected=null;await loadSaved();render();}
function msg(t){document.getElementById('status-msg').textContent=t;}

async function loadSaved(){
  msg('読み込み中...');const ym=month();
  const toMap=items=>{const m={};items.forEach(it=>{const c=fv(L.pay,it.fields,'仕入先コード');if(c)m[c]={id:it.id,f:it.fields};});return m;};
  saved=toMap(await fetchAll(L.pay,`fields/${F(L.pay,'決済月')} eq '${ym}'`));
  prevSaved=toMap(await fetchAll(L.pay,`fields/${F(L.pay,'決済月')} eq '${prevMonth(ym)}'`));
  adjs=(await fetchAll(L.adj)).map(it=>({id:it.id,f:it.fields}));
  const imps=(await fetchAll(L.imp,`fields/${F(L.imp,'決済月')} eq '${ym}'`)).filter(it=>fv(L.imp,it.fields,'状態')!=='取り消し');
  imps.sort((a,b)=>String(fv(L.imp,b.fields,'取り込み日時')).localeCompare(String(fv(L.imp,a.fields,'取り込み日時'))));
  lastImport=imps[0]?{id:imps[0].id,f:imps[0].fields,count:imps.length}:null;
  settleSel={};openAdjs().forEach(a=>settleSel[a.id]=true);
  msg(Object.keys(saved).length?`保存済み ${Object.keys(saved).length} 社`:'まだ取り込んでいません');}

// ---------- ファイル ----------
function setupDrop(){const d=document.getElementById('drop');
  ['dragenter','dragover'].forEach(e=>d.addEventListener(e,ev=>{ev.preventDefault();d.classList.add('over');}));
  ['dragleave','drop'].forEach(e=>d.addEventListener(e,ev=>{ev.preventDefault();d.classList.remove('over');}));
  d.addEventListener('drop',ev=>onFiles(ev.dataTransfer.files));}
async function readRows(file){
  if(/\.xlsx?$/i.test(file.name)){const wb=XLSX.read(await file.arrayBuffer(),{type:'array'});
    return XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,raw:true,defval:''}).map(r=>r.map(c=>c==null?'':String(c)));}
  const buf=await file.arrayBuffer();let text=new TextDecoder('utf-8').decode(buf);
  if(text.indexOf('�')>=0)text=new TextDecoder('shift_jis').decode(buf);   // SMILE の設定によっては Shift_JIS
  return S.parseCSV(text);}
function kindOf(rows){
  const head=rows.slice(0,30).map(r=>r.map(c=>String(c).replace(/[\s　"]/g,'')));
  const has=(i,...ks)=>ks.every(k=>head[i].includes(k));
  for(let i=0;i<head.length;i++)if(has(i,'コード','仕入先名','今回支払残高'))return 'payList';
  if(!head[0])return null;
  if(has(0,'でんさい利用者番号'))return 'master';
  if(has(0,'前回支払残高','支払明細ｼﾞｬﾝｺｰﾄﾞ'))return 'p9055';
  if(has(0,'伝票日付','税抜受入金額'))return 'receipts';
  return null;}
async function onFiles(list){
  for(const file of list){
    try{const rows=await readRows(file);const k=kindOf(rows);
      if(!k){snack(file.name+'：どのファイルか分かりません（見出しを確かめてください）',true);continue;}
      const data=k==='payList'?S.readPayList(rows):k==='p9055'?S.read9055(rows):k==='receipts'?S.readReceipts(rows):S.readVendorMaster(rows);
      FILES[k]={file,data,rows:rows.length-1};
    }catch(e){snack(file.name+'：'+e.message,true);}
  }
  const pl=FILES.payList&&FILES.payList.data;
  if(pl&&pl.closeYm){const ym=ymOf(new Date(+pl.closeYm.slice(0,4),+pl.closeYm.slice(5,7),1));   // 締め月の翌月＝決済月
    if(ym!==month()){setMonth(ym);calc=null;selected=null;await loadSaved();}}
  recalc();render();}
function allFiles(){return Object.values(FILES).every(Boolean);}
function fileInfo(k){const x=FILES[k];if(!x)return '';const d=x.data;
  if(k==='payList')return `${d.title||'締め日不明'}・${Object.keys(d.rows).length}社`;
  if(k==='receipts')return `${fmtD(d.from)}〜${fmtD(d.to)}・${x.rows}行`;
  return `${Object.keys(d).length}社`;}
function fmtD(s){s=String(s||'');return s.length===8?s.slice(0,4)+'/'+s.slice(4,6)+'/'+s.slice(6):s;}

// ---------- 繰越の調整（SMILE を締めた後のアプリ修正） ----------
const af=(a,d)=>fv(L.adj,a.f,d);
function openAdjs(){const ym=month();return adjs.filter(a=>af(a,'状態')==='未精算'&&String(af(a,'発生した決済月'))<ym);}
// この決済月の支払額に足す額：この月に入れた修正（＋）と、この月で相殺する前月までの修正（−）
function adjustFor(){const ym=month(),m={};
  const add=(c,v)=>{m[c]=m[c]||{other:0};m[c].other+=v;};
  adjs.forEach(a=>{const c=af(a,'仕入先コード'),v=Number(af(a,'金額'))||0;
    if(af(a,'発生した決済月')===ym)add(c,v);
    if(af(a,'精算した決済月')===ym)add(c,-v);});
  openAdjs().forEach(a=>{if(settleSel[a.id])add(af(a,'仕入先コード'),-(Number(af(a,'金額'))||0));});
  return m;}

// ---------- 計算 ----------
function recalc(){
  if(!FILES.payList||!FILES.master){calc=null;return;}
  calc=S.compute({payList:FILES.payList.data,p9055:FILES.p9055&&FILES.p9055.data,receipts:FILES.receipts&&FILES.receipts.data,
    master:FILES.master.data,payYm:payYmDash(month()),adjust:adjustFor()});}
function parseJ(s,d){try{return s?JSON.parse(s):d;}catch{return d;}}
const pf=(r,d)=>r.saved?fv(L.pay,r.saved.f,d):undefined;
// 表示・保存に使う1行（置いたファイルの計算 ＋ 保存済みのアプリでの作業）
function buildRows(){
  const out=[],seen={};
  const fromSaved=(code,sv)=>{const f=sv.f,g=d=>fv(L.pay,f,d);const dd=parseJ(g('部門内訳'),{});
    const kind=g('でんさいか手形か')||'';const lines=[];if(+g('振込（計算）'))lines.push({method:'振込',amount:+g('振込（計算）'),site:0,due:''});
    if(+g('でんさい（計算）'))lines.push({method:kind||'でんさい',amount:+g('でんさい（計算）'),site:+g('サイト')||0,due:g('期日')||''});
    return {code,name:g('仕入先名'),payDate:g('支払予定日'),payRound:g('支払日区分')||'月末',
      smile:{prevBalance:+g('前回支払残高'),paid:+g('今回支払額'),discount:+g('値引調整額'),carry:+g('繰越残高'),excl:+g('税抜仕入額'),tax:+g('消費税額'),incl:+g('税込仕入額'),balance:+g('今回支払残高')},
      bal9055:g('9055前回残高'),rcvIncl:g('受入税込'),byDept:dd.byDept||{},byGroup:dd.byGroup||{},mainDept:g('決裁の部門')||'総務',
      amount:+g('支払額')||0,rule:g('分け方の決まり')||'',calcLines:lines,feeKbn:g('手数料区分')||'',calcFee:+g('振込手数料（計算）')||0,
      notes:String(g('気づき')||'').split('\n').filter(Boolean),status:g('取り込みの状態')||'',prevPay:g('前回の支払額')};};
  if(calc){
    calc.rows.forEach(c=>{seen[c.code]=1;const sv=saved[c.code]||null;
      const r={code:c.code,name:c.name,payDate:c.payDate,payRound:c.payRound,
        smile:{prevBalance:c.prevBalance,paid:c.paid,discount:(FILES.payList.data.rows[c.code]||{}).discount||0,carry:c.carry,excl:(FILES.payList.data.rows[c.code]||{}).excl||0,tax:(FILES.payList.data.rows[c.code]||{}).tax||0,incl:c.listIncl,balance:c.listBalance},
        bal9055:c.balance9055,rcvIncl:c.receiptIncl,byDept:c.byDept,byGroup:c.deptByGroup,mainDept:c.mainDept,
        amount:c.amount,rule:c.rule,calcLines:S.splitLines(c,null,payYmDash(month())),feeKbn:c.feeKbn,calcFee:c.fee,notes:c.notes.slice(),saved:sv};
      if(!sv)r.status='新規';else r.status=Math.round(+pf(r,'支払額'))===Math.round(r.amount)?'変化なし':'金額が変わった';
      r.prevPay=sv?+pf(r,'支払額'):null;
      out.push(r);});
    Object.keys(saved).forEach(code=>{if(seen[code])return;const r=fromSaved(code,saved[code]);r.saved=saved[code];r.status='なくなった';r.prevPay=r.amount;r.amount=0;r.calcLines=[];r.byGroup={};out.push(r);});
  }else{
    Object.keys(saved).sort().forEach(code=>{const r=fromSaved(code,saved[code]);r.saved=saved[code];out.push(r);});
  }
  out.forEach(r=>{
    r.override=r.saved?parseJ(pf(r,'分け方の上書き'),null):null;
    r.reason=r.saved?(pf(r,'変えた理由')||''):'';r.feeOverride=r.saved?(pf(r,'手数料の上書き')||''):'';
    r.checked=!!(r.saved&&pf(r,'確認済み'));r.checkedBy=r.saved?pf(r,'確認者')||'':'';r.comment=r.saved?pf(r,'コメント')||'':'';
    r.needReview=!!(r.saved&&pf(r,'見直しが要る'));
    if(calc&&r.status==='金額が変わった'){r.checked=false;if(r.override)r.needReview=true;}
    r.lastMonth=prevSaved[r.code]?+fv(L.pay,prevSaved[r.code].f,'支払額'):null;
  });
  return out;}
// 分け方（上書きがあればそれ）と手数料
function linesOf(r){return r.override&&r.override.length?S.splitLines(r,r.override,payYmDash(month())):r.calcLines;}
function feeOf(r){if(r.feeOverride!==''&&r.feeOverride!=null)return Number(r.feeOverride)||0;
  if(!(r.override&&r.override.length))return r.calcFee;
  const t=linesOf(r).filter(l=>l.method==='振込').reduce((s,l)=>s+l.amount,0);return S.transferFeeOf(t,r.feeKbn);}
function linesSum(r){return linesOf(r).reduce((s,l)=>s+(+l.amount||0),0);}
function splitOk(r){return r.amount<=0?linesSum(r)===0:linesSum(r)===r.amount;}
function totalsOf(list,dept){const t={pay:0,振込:0,でんさい:0,手形:0,相殺:0,海外送金:0,fee:0,n:0};
  list.forEach(r=>{if(dept&&dept!=='all'){t.pay+=Math.max(0,(r.byGroup||{})[dept]||0);return;}
    if(r.amount>0){t.pay+=r.amount;t.n++;}linesOf(r).forEach(l=>{t[l.method]=(t[l.method]||0)+l.amount;});t.fee+=feeOf(r);});return t;}

<script>
// ---------- 表示 ----------
function yen(n){return n==null||n===''?'':Math.round(+n).toLocaleString();}
function fmtTime(iso){if(!iso)return '';const d=new Date(iso);if(isNaN(d))return String(iso);const p=n=>String(n).padStart(2,'0');return `${d.getFullYear()}/${p(d.getMonth()+1)}/${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function diffTxt(a,b){if(b==null||b==='')return '';const d=Math.round(a-b);if(!d)return '<i>±0</i>';return `<i class="${d>0?'up':'down'}">${d>0?'+':''}${d.toLocaleString()}</i>`;}
const METHOD_PILL={振込:'p-tr',でんさい:'p-den',手形:'p-teg',相殺:'p-sai',海外送金:'p-kai'};

function render(){

function renderFiles(){

// 照合の結果（保存するときにも使う）
function checkList(){
  if(!calc)return null;const out=[],cs=calc.checks;
  const cnt=re=>calc.rows.filter(r=>r.notes.some(n=>re.test(n)));
  const pl=FILES.payList.data,rc=FILES.receipts&&FILES.receipts.data;
  if(rc){const m=String(rc.to||'').slice(0,6),cm=(pl.closeYm||'').replace('-','');
    out.push({ok:m===cm&&String(rc.from||'').slice(0,6)===cm,label:'締め月がそろっている',detail:`支払一覧表 ${pl.title||'?'}／受入 ${fmtD(rc.from)}〜${fmtD(rc.to)}`});}
  else out.push({ok:'info',label:'9521 受入リストがありません（税込仕入額の照合と部門の内訳ができません）'});
  if(FILES.p9055){const a=cnt(/前回支払残高が 9055 と違う|9055 にない/);out.push({ok:!a.length,label:'前回支払残高（支払一覧表 と 9055）',detail:a.length?a.map(r=>r.name).join('・'):`${calc.rows.length}社一致`});}
  else out.push({ok:'info',label:'9055 がありません（前回支払残高の照合と部門ができません）'});
  if(rc){const a=cnt(/税込仕入額が受入リストと違う/);out.push({ok:!a.length,label:'税込仕入額（支払一覧表 と 9521）',detail:a.length?a.map(r=>r.name).join('・'):`${calc.rows.length}社一致`});}
  const tot=cs.find(c=>/総合計/.test(c.note));out.push({ok:!tot,label:'支払一覧表の総合計と行の合計',detail:tot?tot.note:(pl.total?yen(pl.total.balance):'')});
  const nm=cnt(/仕入先マスタにない/);out.push({ok:!nm.length,label:'仕入先マスタにある',detail:nm.length?nm.map(r=>r.name).join('・'):''});
  const sp=cnt(/合わない/);if(sp.length)out.push({ok:false,label:'振込＋でんさいが支払額と合う',detail:sp.map(r=>r.name).join('・')});
  cs.filter(c=>/支払一覧表にない/.test(c.note)).forEach(c=>out.push({ok:'info',label:`${c.code} ${c.name}`,detail:c.note}));
  const big=cnt(/繰越残高/).filter(r=>!r.notes.some(n=>/端数/.test(n)));
  if(big.length)out.push({ok:'info',label:`繰越残高あり（端数以外） ${big.length}社`,detail:big.map(r=>`${r.name} ${yen(r.carry)}`).join('・')});
  const fr=cnt(/端数/);if(fr.length)out.push({ok:'info',label:`端数の繰越 ${fr.length}社（今回支払残高で払うので精算される）`});
  const mi=cnt(/マイナス/);if(mi.length)out.push({ok:'info',label:`残高がマイナス ${mi.length}社（払わずに次回へ）`,detail:mi.map(r=>`${r.name} ${yen(r.amount)}`).join('・')});
  const od=calc.rows.filter(r=>r.payRound!=='月末');if(od.length)out.push({ok:'info',label:`月末以外の支払予定日 ${od.length}社（その回へ回す）`,detail:od.map(r=>`${r.name} ${r.payDate}`).join('・')});
  return out;}
function renderChecks(){
  const list=checkList()||(lastImport?parseJ(fv(L.imp,lastImport.f,'照合と気づき'),null):null);
  const card=document.getElementById('check-card');if(!list){card.style.display='none';return;}
  card.style.display='';
  const ng=list.filter(c=>c.ok===false).length,inf=list.filter(c=>c.ok==='info').length;document.getElementById('check-det').open=!!calc;
  document.getElementById('check-sum').innerHTML=(ng?`<span class="ck-ng">✖ 合わない ${ng}</span>`:'<span class="ck-ok">✔ 照合OK</span>')+(inf?` <span class="ck-info">! 気づき ${inf}</span>`:'')+(calc?'':' <span style="color:var(--muted)">（最後の取り込みの結果）</span>');
  document.getElementById('checks').innerHTML=list.map(c=>
    `<li><span class="${c.ok===true?'ck-ok':c.ok===false?'ck-ng':'ck-info'}">${c.ok===true?'✔':c.ok===false?'✖':'!'}</span> ${esc(c.label)}${c.detail?` <span style="color:var(--muted)">— ${esc(c.detail)}</span>`:''}</li>`).join('');}

function renderBanner(){
  const el=document.getElementById('banner');const op=openAdjs();
  const adjHtml=op.length?`<div style="width:100%;font-size:12px">前月までにアプリで直した分（SMILE を締めた後の修正）：`+op.map(a=>
    `<label style="margin-left:10px"><input type="checkbox" ${settleSel[a.id]?'checked':''} ${calc?'':'disabled'} onchange="settleSel['${a.id}']=this.checked;recalc();render()"> ${esc(af(a,'仕入先名'))} ${yen(af(a,'金額'))}（${esc(af(a,'発生した決済月'))}・${esc(af(a,'理由')||'')}）を今月で相殺</label>`).join('')+`</div>`:'';
  if(calc){const c={新規:0,金額が変わった:0,変化なし:0,なくなった:0};rows.forEach(r=>c[r.status]=(c[r.status]||0)+1);

    el.innerHTML=`<div class="banner pending"><b>まだ保存していません</b><span>${rows.length}社：新規 ${c.新規}・金額が変わった ${c.金額が変わった}・変化なし ${c.変化なし}・なくなった ${c.なくなった}</span>
      ${ng?`<span class="ck-ng">照合で合わないものが ${ng} 件あります</span>`:''}
      <button class="btn" style="margin-left:auto" onclick="saveImport()" ${allFiles()?'':'disabled title="4つのファイルをそろえてください"'}>💾 取り込みを保存</button>${adjHtml}
      <div class="prog" id="prog" style="display:none;width:100%"><div></div></div></div>`;return;}

  el.innerHTML=op.length?`<div class="banner saved">${adjHtml}</div>`:'';}

function renderSum(){
  const card=document.getElementById('sum-card');if(!rows.length){card.style.display='none';return;}card.style.display='';
  const t=totalsOf(rows,deptF),lm=Object.values(prevSaved).reduce((s,x)=>s+Math.max(0,+fv(L.pay,x.f,'支払額')||0),0);

  const lmD=deptF==='all'?lm:Object.values(prevSaved).reduce((s,x)=>s+Math.max(0,(parseJ(fv(L.pay,x.f,'部門内訳'),{}).byGroup||{})[deptF]||0),0);

      (t.相殺?`<span class="s">相殺<b>${yen(t.相殺)}</b></span>`:'')+(t.海外送金?`<span class="s">海外送金<b>${yen(t.海外送金)}</b></span>`:''):'')+
    `<span class="s">確認<b>${ck}/${all}</b></span>`;}

function visible(){
  let list=rows.slice();
  if(deptF!=='all')list=list.filter(r=>((r.byGroup||{})[deptF]||0)!==0||r.mainDept===deptF);
  if(roundF!=='all')list=list.filter(r=>r.payRound===roundF);
  if(filt==='notes')list=list.filter(r=>r.notes.length);
  if(filt==='unchecked')list=list.filter(r=>r.amount>0&&!r.checked);
  if(filt==='changed')list=list.filter(r=>r.status&&r.status!=='変化なし');
  if(filt==='override')list=list.filter(r=>r.override&&r.override.length);
  if(filt==='review')list=list.filter(r=>r.needReview);
  if(q)list=list.filter(r=>r.code.includes(q)||String(r.name).includes(q));
  const sort=(document.getElementById('sort')||{}).value||'code';
  if(sort==='amount')list.sort((a,b)=>b.amount-a.amount);
  else if(sort==='up')list.sort((a,b)=>(b.amount-(b.lastMonth||0))-(a.amount-(a.lastMonth||0)));
  else list.sort((a,b)=>a.code.localeCompare(b.code));
  return list;}
function seg(id,cur,opts,fn){return `<div class="seg">${opts.map(([v,l])=>`<button class="${cur===v?'on':''}" onclick="${fn}('${v}')">${l}</button>`).join('')}</div>`;}
function setF(v){filt=v;renderBody();}function setDept(v){deptF=v;renderSum();renderBody();}function setRound(v){roundF=v;renderBody();}
function renderBody(){

      <option value="code" ${sortSel==='code'?'selected':''}>コード順</option><option value="amount" ${sortSel==='amount'?'selected':''}>支払額の大きい順</option><option value="up" ${sortSel==='up'?'selected':''}>前月からの増加順</option></select>
    <span style="color:var(--muted);font-size:12px">${list.length}社</span></div>`;

function renderList(){
  const list=visible(),el=document.getElementById('list');if(!el)return;
  el.innerHTML=`<table class="vl"><thead><tr><th>仕入先</th><th class="num">支払額</th><th class="num">前月</th><th>方法</th><th>部門</th><th>確認</th></tr></thead><tbody>`+
    (list.length?list.map(r=>{const st=r.status==='新規'?'<span class="pill p-new">新規</span>':r.status==='金額が変わった'?'<span class="pill p-chg">変わった</span>':r.status==='なくなった'?'<span class="pill p-gone">なくなった</span>':'';

      const ck=r.amount<=0?'':r.checked?'<span class="pill p-ck">✔</span>':r.needReview?'<span class="pill p-rv">見直し</span>':'';
      return `<tr class="vrow ${r.code===selected?'active':''}" onclick="selectRow('${r.code}')"><td>${esc(r.code)} ${esc(r.name)} ${st}${r.notes.length?` <span class="note-dot" title="${esc(r.notes.join('\n'))}">●${r.notes.length}</span>`:''}${r.override&&r.override.length?' <span class="pill p-rv">分け方変更</span>':''}</td>
        <td class="num">${yen(r.amount)}</td><td class="num" style="color:var(--muted)">${yen(r.lastMonth)}</td><td>${ms}</td><td style="font-size:11px">${esc(r.mainDept||'')}</td><td>${ck}</td></tr>`;}).join('')
      :'<tr><td colspan="6" class="empty">該当なし</td></tr>')+`</tbody></table>`;}
function selectRow(code){selected=code;draft=null;renderList();renderDetail();}

<script>

  const byGroup=Object.entries(r.byGroup||{}).map(([k,v])=>`<b>${esc(k)}</b> ${yen(v)}`).join('・');
  el.innerHTML=`
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:6px;font-size:12px;color:var(--muted)">
      <button class="btn g" onclick="move(-1)" ${i<=0?'disabled':''}>◀ 前へ</button><span>${i+1}／${list.length}</span><button class="btn g" onclick="move(1)" ${i>=list.length-1?'disabled':''}>次へ ▶</button>
      <span style="margin-left:auto">${esc(r.payRound)}払い（予定日 ${esc(r.payDate||'')}）</span></div>
    <h2>${esc(r.name)} <span style="font-size:12px;color:var(--muted)">${esc(r.code)}</span></h2>
    <div style="font-size:12px;margin-top:2px">${r.status?`<span class="pill ${r.status==='新規'?'p-new':r.status==='金額が変わった'?'p-chg':r.status==='なくなった'?'p-gone':'p-ck'}">${esc(r.status)}</span>`:''}${r.prevPay!=null&&r.status==='金額が変わった'?` 前回の取り込み ${yen(r.prevPay)} → ${yen(r.amount)}`:''}
      ${r.checked?` <span class="pill p-ck">確認済み ${esc(r.checkedBy)}</span>`:''}${r.needReview?' <span class="pill p-rv">分け方を見直してください（金額が変わった）</span>':''}</div>
    <div class="kv">
      <div><div class="l">支払額</div><div class="v">${yen(r.amount)}</div></div>
      <div><div class="l">前月</div><div class="v">${yen(r.lastMonth)||'—'}</div></div>
      <div><div class="l">今回支払残高（SMILE）</div><div class="v">${yen(sm.balance)}</div></div>
      <div><div class="l">税込仕入額</div><div class="v">${yen(sm.incl)}</div></div>
      <div><div class="l">繰越残高</div><div class="v" style="color:${sm.carry?'var(--warn)':''}">${yen(sm.carry)}</div></div>
      <div><div class="l">前回支払残高／今回支払額</div><div class="v" style="font-size:13px">${yen(sm.prevBalance)}／${yen(sm.paid)}</div></div>
    </div>
    ${r.notes.length?`<div class="sec"><h4>気づき</h4><ul class="notes">${r.notes.map(n=>`<li>${esc(n)}</li>`).join('')}</ul></div>`:''}
    <div class="sec"><h4>照合</h4><div style="font-size:12px">9055 の前回支払残高 ${yen(r.bal9055)||'—'}（一覧 ${yen(sm.prevBalance)}）　受入の税込 ${yen(r.rcvIncl)||'—'}（一覧 ${yen(sm.incl)}）</div></div>
    <div class="sec"><h4>部門（受入の内訳で按分・端数は多い部門へ）</h4><div style="font-size:12px">${byGroup||'—'}<div style="color:var(--muted);margin-top:2px">${byDept}</div></div></div>
    <div class="sec"><h4>分け方 <span style="font-weight:400">— マスタの決まり：${esc(r.rule||'')}</span></h4>
      <table class="sp"><tr><th>方法</th><th class="num">金額</th><th>サイト</th><th>期日</th><th></th></tr>
      ${lines.map((l,k)=>{const due=(l.method==='でんさい'||l.method==='手形')?S.dueDate(payYmDash(month()),+l.site):'';
        return ed?`<tr><td><select onchange="dEdit(${k},'method',this.value)">${['振込','でんさい','手形','相殺','海外送金'].map(m=>`<option ${m===l.method?'selected':''}>${m}</option>`).join('')}</select></td>
          <td class="num"><input type="number" value="${l.amount}" style="width:110px;text-align:right" onchange="dEdit(${k},'amount',this.value)"></td>
          <td>${(l.method==='でんさい'||l.method==='手形')?`<input type="number" value="${l.site||''}" style="width:60px" onchange="dEdit(${k},'site',this.value)">`:''}</td><td>${due||(l.method==='でんさい'||l.method==='手形'?'<span class="ck-ng">決まりなし</span>':'')}</td>
          <td><button class="btn d" style="padding:1px 7px" onclick="dDel(${k})">×</button></td></tr>`
        :`<tr><td><span class="pill ${METHOD_PILL[l.method]||''}">${l.method}</span></td><td class="num">${yen(l.amount)}</td><td>${l.site||''}</td><td>${due}</td><td></td></tr>`;}).join('')}
      <tr><td>合計</td><td class="num"><b class="${ok?'ck-ok':'ck-ng'}">${yen(sum)}</b></td><td colspan="3">${ok?'支払額と一致':`支払額 ${yen(target)} と ${yen(sum-target)} 違う`}</td></tr></table>
      ${ed?`<div style="display:flex;gap:6px;margin-top:6px;flex-wrap:wrap"><button class="btn g" onclick="dAdd()">＋ 行を足す</button>
        ${r.override&&r.override.length?'<button class="btn g" onclick="clearSplit()">計算（マスタどおり）に戻す</button>':''}</div>
        <div style="margin-top:6px"><textarea id="reason" rows="2" placeholder="マスタと違う分け方にした理由（例：一部を振込にする・売買相殺・サイトを変える）">${esc(r.reason)}</textarea></div>
        <button class="btn" style="margin-top:4px" onclick="saveSplit()" ${draft?'':'disabled'}>分け方を保存</button>`:''}
    </div>
    <div class="sec"><h4>振込手数料（${esc(r.feeKbn||'—')}）</h4><div style="font-size:12px">計算 ${yen(r.calcFee)} 円${r.override&&r.override.length?`（分け方を変えた後 ${yen(feeOf({...r,feeOverride:''}))} 円）`:''}
      ${ed?`　上書き <input type="number" id="fee" value="${esc(r.feeOverride)}" placeholder="空＝計算どおり" style="width:90px;border:1px solid var(--border);border-radius:4px;padding:2px 5px"> <button class="btn g" onclick="saveFee()">保存</button>`:(r.feeOverride!==''?`　上書き ${yen(r.feeOverride)} 円`:'')}</div></div>
    <div class="sec"><h4>SMILE を締めた後の修正（翌月以降に相殺）</h4>
      ${myAdj.length?`<table class="sp">${myAdj.map(a=>`<tr><td>${esc(af(a,'発生した決済月'))}</td><td class="num">${yen(af(a,'金額'))}</td><td>${esc(af(a,'理由')||'')}</td><td>${esc(af(a,'状態'))}${af(a,'精算した決済月')?'（'+esc(af(a,'精算した決済月'))+'）':''}</td></tr>`).join('')}</table>`:''}
      ${ed?`<div style="display:flex;gap:6px;margin-top:4px;flex-wrap:wrap;font-size:12px">今月の支払を <input type="number" id="adj-amt" placeholder="±金額" style="width:100px;border:1px solid var(--border);border-radius:4px;padding:2px 5px"> 円直す
        <input id="adj-reason" placeholder="理由（必須）" style="flex:1;min-width:140px;border:1px solid var(--border);border-radius:4px;padding:2px 5px"><button class="btn g" onclick="addAdjust()">記録</button></div>
        <div style="font-size:11px;color:var(--muted)">直すのは SMILE が基本です。締めた後で SMILE を直せないときだけ使います。翌月の取り込みで逆の額を相殺します。</div>`:''}</div>
    <div class="sec"><h4>コメント</h4>${ed?`<textarea id="comment" rows="2">${esc(r.comment)}</textarea><button class="btn g" style="margin-top:4px" onclick="saveComment()">コメントを保存</button>`:`<div style="font-size:12px">${esc(r.comment)||'—'}</div>`}</div>
    <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:14px;align-items:center">
      ${!ed?`<span style="font-size:12px;color:var(--muted)">${calc?'取り込みを保存すると、確認・分け方の変更ができます':''}</span>`
        :r.amount<=0?'<span style="font-size:12px;color:var(--muted)">支払なし（確認は不要）</span>'
        :r.checked?`<button class="btn d" onclick="uncheck()">確認を外す</button>`
        :`<button class="btn ok" onclick="confirmRow()" ${splitOk(r)&&!draft?'':'disabled title="分け方の合計を支払額に合わせて保存してください"'}>✔ OK・次へ（Enter）</button>`}
    </div>`;}
function move(d){const list=visible(),i=list.findIndex(x=>x.code===selected);const n=list[i+d];if(n)selectRow(n.code);}
function dLines(){const r=cur();return draft||(draft=linesOf(r).map(l=>({method:l.method,amount:l.amount,site:l.site})));}
function dEdit(k,f,v){const d=dLines();d[k][f]=f==='method'?v:(Number(v)||0);if(f==='method'&&(v==='でんさい'||v==='手形')&&!d[k].site)d[k].site=(cur().calcLines.find(l=>l.site)||{}).site||0;renderDetail();}
function dAdd(){const r=cur(),d=dLines();const rest=Math.max(0,r.amount)-d.reduce((s,l)=>s+(+l.amount||0),0);d.push({method:'振込',amount:rest>0?rest:0,site:0});renderDetail();}
function dDel(k){dLines().splice(k,1);renderDetail();}

async function patchRow(r,obj){
  const fields=toFields(L.pay,obj);await gpatch(`/sites/${AP_SITE}/lists/${L.pay.id}/items/${r.saved.id}/fields`,fields);
  Object.assign(r.saved.f,fields);}
function me(){return acct.name||acct.username;}
async function saveSplit(){const r=cur();if(!r||!draft)return;
  const sum=draft.reduce((s,l)=>s+(+l.amount||0),0);if(sum!==Math.max(0,r.amount)){snack('分け方の合計（'+yen(sum)+'）が支払額（'+yen(r.amount)+'）と合いません',true);return;}
  const same=JSON.stringify(draft.map(l=>[l.method,+l.amount,+l.site||0]))===JSON.stringify(r.calcLines.map(l=>[l.method,+l.amount,+l.site||0]));
  const reason=document.getElementById('reason').value.trim();
  if(!same&&!reason){snack('マスタと違う分け方にした理由を書いてください',true);return;}
  try{await patchRow(r,{'分け方の上書き':same?'':JSON.stringify(draft),'変えた理由':same?'':reason,'確認済み':false,'見直しが要る':false});
    draft=null;snack(same?'計算どおりの分け方に戻しました':'分け方を保存しました');render();}catch(e){snack('保存エラー: '+e.message,true);}}
async function clearSplit(){const r=cur();if(!confirm('分け方を計算（マスタどおり）に戻しますか？'))return;
  try{await patchRow(r,{'分け方の上書き':'','変えた理由':'','確認済み':false,'見直しが要る':false});draft=null;render();}catch(e){snack('保存エラー: '+e.message,true);}}
async function saveFee(){const r=cur(),v=document.getElementById('fee').value.trim();
  try{await patchRow(r,{'手数料の上書き':v,'確認済み':false});snack('手数料を保存しました');render();}catch(e){snack('保存エラー: '+e.message,true);}}
async function saveComment(){const r=cur();try{await patchRow(r,{'コメント':document.getElementById('comment').value});snack('コメントを保存しました');render();}catch(e){snack('保存エラー: '+e.message,true);}}
async function confirmRow(){const r=cur();if(!r||!canEdit(r)||r.checked)return;
  if(!splitOk(r)){snack('分け方の合計が支払額と合いません',true);return;}
  if(r.override&&r.override.length&&!r.reason){snack('分け方を変えた理由を書いてください',true);return;}
  const list=visible(),i=list.findIndex(x=>x.code===r.code);
  try{await patchRow(r,{'確認済み':true,'確認者':me(),'確認日時':new Date().toISOString(),'見直しが要る':false});
    rows=buildRows();const nx=list.slice(i+1).concat(list.slice(0,i)).find(x=>{const y=rows.find(z=>z.code===x.code);return y&&y.amount>0&&!y.checked;});
    if(nx)selected=nx.code;draft=null;renderSum();renderList();renderDetail();}catch(e){snack('保存エラー: '+e.message,true);}}
async function uncheck(){const r=cur();try{await patchRow(r,{'確認済み':false,'確認者':'','確認日時':''});render();}catch(e){snack('保存エラー: '+e.message,true);}}
// SMILE を締めた後の修正：AP_CarryAdjust に残し、今月の支払額と計算の分け方を直す（翌月の取り込みで相殺する）
async function addAdjust(){const r=cur();const a=Math.round(Number(document.getElementById('adj-amt').value)||0),why=document.getElementById('adj-reason').value.trim();
  if(!a){snack('金額を入れてください',true);return;}if(!why){snack('理由を書いてください',true);return;}
  if(!confirm(`${r.name} の今月（${month()}）の支払を ${a>0?'+':''}${a.toLocaleString()} 円直します。\n翌月の取り込みで ${(-a).toLocaleString()} 円を相殺します。よろしいですか？`))return;
  try{
    await gpost(`/sites/${AP_SITE}/lists/${L.adj.id}/items`,{fields:toFields(L.adj,{Title:`${month()} ${r.code} ${r.name}`,'仕入先コード':r.code,'仕入先名':r.name,'発生した決済月':month(),'金額':a,'理由':why,'状態':'未精算','入力した人':me()})});
    const ls=r.calcLines.map(l=>({...l}));const t=ls.find(l=>l.method==='振込')||ls[0];
    if(t)t.amount+=a;else ls.push({method:'振込',amount:r.amount+a,site:0,due:''});
    const tr=ls.filter(l=>l.method==='振込').reduce((s,l)=>s+l.amount,0),den=ls.filter(l=>l.method!=='振込').reduce((s,l)=>s+l.amount,0);
    await patchRow(r,{'支払額':r.amount+a,'振込（計算）':tr,'でんさい（計算）':den,'振込手数料（計算）':S.transferFeeOf(tr,r.feeKbn),'確認済み':false,
      '見直しが要る':!!(r.override&&r.override.length),'気づき':r.notes.concat([`SMILE 締め後の修正 ${a>0?'+':''}${a.toLocaleString()}（${why}）`]).join('\n')});
    adjs=(await fetchAll(L.adj)).map(it=>({id:it.id,f:it.fields}));snack('記録しました');render();
  }catch(e){snack('記録エラー: '+e.message,true);}}

// ---------- 取り込みの保存 ----------
function prog(n,total,label){const p=document.getElementById('prog');if(!p)return;p.style.display='';p.firstElementChild.style.width=Math.round(n/total*100)+'%';msg(label+' '+n+'/'+total);}
function stamp(){const d=new Date(),p=n=>String(n).padStart(2,'0');return d.getFullYear()+p(d.getMonth()+1)+p(d.getDate())+'-'+p(d.getHours())+p(d.getMinutes())+p(d.getSeconds());}
async function saveImport(){
  if(!calc||!allFiles())return;const ym=month(),list=checkList(),ng=list.filter(c=>c.ok===false);
  const cnt={};rows.forEach(r=>cnt[r.status]=(cnt[r.status]||0)+1);
  if(!confirm(`${ym} の仕入を保存します（${rows.length}社：新規 ${cnt.新規||0}・金額が変わった ${cnt.金額が変わった||0}・なくなった ${cnt.なくなった||0}）。`+
    (ng.length?`\n\n⚠ 照合で合わないものが ${ng.length} 件あります：\n`+ng.map(c=>'・'+c.label).join('\n'):'')+
    `\n\n金額が変わった仕入先は「確認済み」を外します。`))return;
  const btns=document.querySelectorAll('.banner .btn');btns.forEach(b=>b.disabled=true);
  try{
    // 1. 原本を保存
    const folder=`/BILLS/SMILE取込/${payYmDash(ym)}`,ts=stamp(),files=[];
    for(const k of Object.keys(FILES)){const x=FILES[k];const name=ts+'_'+x.file.name.replace(/[#%*<>?/\\{|}:"]/g,'_');
      try{await gputFile(`${folder}/${name}`,x.file);files.push({kind:KIND_LABEL[k],name:x.file.name,path:`${folder}/${name}`,rows:x.rows});}
      catch(e){if(!confirm(`原本（${x.file.name}）を保存できませんでした：${e.message}\n続けますか？`))throw e;files.push({kind:KIND_LABEL[k],name:x.file.name,path:'',rows:x.rows});}}
    // 2. 取り込みの履歴
    const t=totalsOf(rows,'all'),pl=FILES.payList.data;
    const changes=rows.filter(r=>r.status!=='変化なし').map(r=>({code:r.code,name:r.name,status:r.status,prev:r.prevPay,now:r.amount}));
    const imp=await gpost(`/sites/${AP_SITE}/lists/${L.imp.id}/items`,{fields:toFields(L.imp,{Title:`${ym} 仕入の取り込み ${ts}`,'決済月':ym,'締め日':pl.title||'',
      '取り込んだ人':me(),'取り込み日時':new Date().toISOString(),'ファイル':JSON.stringify(files),'原本の保存先':folder,'仕入先数':rows.filter(r=>r.status!=='なくなった').length,
      '今回支払残高':pl.total?pl.total.balance:null,'払う額':t.pay,'振込':t.振込-t.fee,'振込手数料':t.fee,'でんさい':t.でんさい,'手形':t.手形,
      '照合の不一致':ng.length,'照合と気づき':JSON.stringify(list),'変化の件数':changes.length,'前回からの変化':JSON.stringify(changes),'状態':'取り込み済'})});
    // 3. 仕入の支払（SMILE の数字は上書き、アプリでの作業は残す）
    let n=0;
    for(const r of rows){prog(++n,rows.length,'保存中');
      const ls=r.calcLines,tr=ls.filter(l=>l.method==='振込').reduce((s,l)=>s+l.amount,0),dl=ls.find(l=>l.method!=='振込');
      const o={Title:`${ym} ${r.code} ${r.name}`,'決済月':ym,'仕入先コード':r.code,'仕入先名':r.name,'支払日区分':r.payRound,'支払予定日':r.payDate||'',
        '取り込みの状態':r.status,'取り込みID':String(imp.id),'気づき':r.notes.join('\n')};
      if(r.status!=='なくなった')Object.assign(o,{'前回支払残高':r.smile.prevBalance,'今回支払額':r.smile.paid,'値引調整額':r.smile.discount,'繰越残高':r.smile.carry,
        '税抜仕入額':r.smile.excl,'消費税額':r.smile.tax,'税込仕入額':r.smile.incl,'今回支払残高':r.smile.balance,
        '部門内訳':JSON.stringify({byDept:r.byDept,byGroup:r.byGroup}),'決裁の部門':r.mainDept,'支払額':r.amount,'分け方の決まり':r.rule,
        '振込（計算）':tr,'でんさい（計算）':dl?dl.amount:0,'でんさいか手形か':dl?dl.method:'','サイト':dl?(+dl.site||0):0,'期日':dl?dl.due||'':'',
        '手数料区分':r.feeKbn||'','振込手数料（計算）':r.calcFee||0});
      else Object.assign(o,{'支払額':0,'振込（計算）':0,'でんさい（計算）':0,'振込手数料（計算）':0});
      if(r.bal9055!=null)o['9055前回残高']=r.bal9055;if(r.rcvIncl!=null)o['受入税込']=r.rcvIncl;if(r.prevPay!=null)o['前回の支払額']=r.prevPay;
      if(r.status!=='変化なし')Object.assign(o,{'確認済み':false,'確認者':'','確認日時':'','見直しが要る':!!(r.override&&r.override.length)&&r.status!=='新規'});
      if(r.saved)await gpatch(`/sites/${AP_SITE}/lists/${L.pay.id}/items/${r.saved.id}/fields`,toFields(L.pay,o));
      else await gpost(`/sites/${AP_SITE}/lists/${L.pay.id}/items`,{fields:toFields(L.pay,o)});}
    // 4. 今月で相殺した繰越の調整を精算済みに
    for(const a of openAdjs())if(settleSel[a.id])await gpatch(`/sites/${AP_SITE}/lists/${L.adj.id}/items/${a.id}/fields`,toFields(L.adj,{'状態':'精算済','精算した決済月':ym}));
    calc=null;await loadSaved();render();snack(`✅ ${ym} の仕入を保存しました（${rows.length}社）`);
  }catch(e){snack('保存エラー: '+e.message,true);btns.forEach(b=>b.disabled=false);}}

document.addEventListener('keydown',e=>{if(/INPUT|TEXTAREA|SELECT/.test(e.target.tagName))return;
  if(e.key==='Enter'){e.preventDefault();confirmRow();}else if(e.key==='ArrowDown'||e.key==='ArrowRight'){e.preventDefault();move(1);}else if(e.key==='ArrowUp'||e.key==='ArrowLeft'){e.preventDefault();move(-1);}});
function snack(m,e=false){const el=document.getElementById('snackbar');el.textContent=m;el.style.background=e?'#c0392b':'#323232';el.style.display='block';clearTimeout(snack.t);snack.t=setTimeout(()=>el.style.display='none',e?7000:3500);}
boot().catch(e=>{console.error(e);snack('起動エラー: '+e.message,true);});
</script>
</body>
</html>

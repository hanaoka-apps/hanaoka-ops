/* 見た目は支払決済アプリ（settle-proto）にそろえる */
:root{--pri:#1a5fa8;--pri-l:#e3edf9;--bg:#f4f6f9;--card:#fff;--line:#dde2ec;--txt:#1e2533;--sub:#6b7a99;--up:#c0392b;--up-l:#fbe7e5;--down:#1e8449;--down-l:#e3f4e8;--warn:#a0520c;--warn-l:#fdf0e1;--flag:#7a3db8;--flag-l:#f1e8fb}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--txt);font:14px/1.5 "Yu Gothic UI","Meiryo",system-ui,sans-serif}
header{background:#fff;border-bottom:1px solid var(--line);padding:10px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;position:sticky;top:0;z-index:5}
header h1{font-size:18px;margin:0;color:var(--pri)}header .sp{flex:1}
select,input,button,textarea{font:inherit}select,input[type=search],input[type=number],input[type=text]{border:1px solid var(--line);border-radius:6px;padding:5px 8px;background:#fff}
button{border:1px solid var(--line);background:#fff;border-radius:6px;padding:5px 12px;cursor:pointer}button.pri{background:var(--pri);border-color:var(--pri);color:#fff}
button:disabled{opacity:.45;cursor:not-allowed}
.grp{display:flex;gap:4px;flex-wrap:wrap}.grp button.on{background:var(--pri);border-color:var(--pri);color:#fff}
#login-view{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:70vh;gap:16px}
#app-view{display:none}
main{padding:16px 20px;display:grid;gap:14px;grid-template-columns:minmax(0,1fr)}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px;min-width:0;overflow-x:auto}
.card h2{font-size:14px;margin:0 0 10px;color:var(--sub);font-weight:600}
.top{display:grid;gap:14px;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr) minmax(0,1.6fr)}
.big{font-size:32px;font-weight:700;letter-spacing:.5px}.big small{font-size:15px;font-weight:500;color:var(--sub)}
.cmp{margin-top:6px;display:grid;grid-template-columns:auto auto 1fr;gap:2px 12px;font-size:13px;color:var(--sub)}
.d-up{color:var(--up);font-weight:600}.d-down{color:var(--down);font-weight:600}
table{border-collapse:collapse;width:100%}th,td{padding:5px 8px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{font-size:12px;color:var(--sub);font-weight:600;background:#fafbfd;position:sticky;top:0}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
.bar{height:6px;background:var(--pri-l);border-radius:3px;overflow:hidden;min-width:60px}.bar i{display:block;height:100%;background:var(--pri)}
.flags{display:flex;flex-direction:column;gap:6px;max-height:260px;overflow:auto}

.flag .why{font-size:11px;font-weight:700;color:var(--flag);white-space:nowrap}.flag .who{flex:1}.flag .amt{font-variant-numeric:tabular-nums;font-weight:600}
.tag{display:inline-block;font-size:11px;padding:0 6px;border-radius:8px;margin-left:4px;font-weight:600}
.t-flag{background:var(--flag-l);color:var(--flag)}.t-new{background:var(--warn-l);color:var(--warn)}.t-up{background:var(--up-l);color:var(--up)}.t-ok{background:var(--down-l);color:var(--down)}.t-pri{background:var(--pri-l);color:var(--pri)}
.tabs{display:flex;gap:4px;border-bottom:2px solid var(--line)}.tabs button{border:1px solid var(--line);border-bottom:none;border-radius:8px 8px 0 0;background:var(--bg);padding:7px 18px;margin-bottom:-2px;font-weight:600;color:var(--sub)}.tabs button.on{background:#fff;color:var(--pri);border-color:var(--pri);border-bottom:2px solid #fff}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:8px}.tools .cnt{color:var(--sub);font-size:12px}

.review.lc{grid-template-columns:minmax(0,1fr)}.review.lc .rlist{display:none}
/* 詳細：左に請求書（大きく）、右に中身。請求書を見ながら項目を確かめる */
.dsplit{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(360px,1fr);gap:16px;align-items:start}
.dinfo .vs{gap:8px}.dinfo .vs>div{padding:7px 9px}.dinfo .vs .v{font-size:17px}.dpdf .pdf{height:calc(100vh - 330px);min-height:460px;margin-top:6px;padding:0}.dpdf .pdf iframe{height:100%}

tr.row{cursor:pointer}tr.row:hover{background:#f7f9fc}

.dnav,.dact{display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--line);background:#fafbfd}.dact{border-top:1px solid var(--line);border-bottom:none}
.dnav .pos{font-variant-numeric:tabular-nums;color:var(--sub)}.dnav .sp,.dact .sp{flex:1}.dact .keys{font-size:11.5px;color:var(--sub)}
.dbody{flex:1;overflow:auto;padding:12px 16px}
.dhead{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.dhead h3{margin:2px 0 4px;font-size:18px}
.vs{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin:10px 0}
.vs>div{border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:#fafbfd}.vs .l{font-size:12px;color:var(--sub)}.vs .v{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums}
.vs .s{font-size:11.5px;color:var(--sub);line-height:1.6}.vs .bad{border-color:#f0b7b0;background:var(--up-l)}.vs .good{border-color:#b7dfc4;background:var(--down-l)}
.sec{margin-top:12px}.sec>h4{font-size:12.5px;color:var(--sub);margin:0 0 6px;font-weight:600}
.box{border:1px solid var(--line);border-radius:8px;padding:8px 10px}.box.warn{background:var(--warn-l);border-color:#efd3ad}.box.alert{background:var(--up-l);border-color:#f0b7b0}
.sp-t td{padding:3px 6px}.sp-t input,.sp-t select{padding:3px 5px}
.drop{border:2px dashed var(--line);border-radius:8px;padding:10px;text-align:center;color:var(--sub);cursor:pointer;display:block;font-size:13px}.drop.over{border-color:var(--pri);background:var(--pri-l)}.drop input{display:none}
.pdf{min-height:420px;border:1px dashed var(--line);border-radius:8px;margin-top:8px;background:#fafbfd;display:flex;align-items:center;justify-content:center;color:var(--sub);text-align:center;padding:12px}
.pdf iframe{width:100%;height:560px;border:0}
@media (max-width:1200px){.dsplit{grid-template-columns:1fr}.dpdf .pdf{height:640px}}
/* 広い画面：左の請求書は動かさず枠いっぱい、右の項目だけスクロール */
@media (min-width:1201px){.dbody{overflow:hidden;padding:10px 0 10px 14px}.dsplit{height:100%;grid-template-rows:minmax(0,1fr);align-items:stretch}
  .dinfo{overflow-y:auto;min-height:0;padding-right:12px}.dpdf{display:flex;flex-direction:column;min-height:0}.dpdf .pdf{flex:1;height:auto;min-height:0}}
.chips{display:flex;gap:6px;flex-wrap:wrap}.chip{font-size:12px;border:1px solid var(--line);background:#fff;border-radius:6px;padding:3px 8px;cursor:pointer}.chip.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.files{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:8px;margin-top:10px}
.file{border:1px solid var(--line);border-radius:8px;padding:7px 10px;background:#fafbfd}.file.ok{border-color:#b7dfc4;background:var(--down-l)}.file .k{font-size:11.5px;color:var(--sub)}
.checks{list-style:none;margin:0;padding:0}.checks li{padding:3px 0}.ck-ok{color:var(--down);font-weight:700}.ck-ng{color:var(--up);font-weight:700}.ck-info{color:var(--warn);font-weight:700}
.approve{position:sticky;bottom:0;background:#fff;border-top:1px solid var(--line);padding:10px 20px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.approve .prog{flex:1;color:var(--sub)}.approve .rest{color:var(--warn);font-size:13px}
.big-btn{font-size:15px;padding:8px 22px}
.progbar{height:6px;background:var(--pri-l);border-radius:3px;overflow:hidden;width:100%}.progbar i{display:block;height:100%;background:var(--pri);width:0}
details>summary{cursor:pointer;color:var(--sub);font-size:12.5px;font-weight:600}
#snackbar{position:fixed;bottom:70px;left:50%;transform:translateX(-50%);background:#323232;color:#fff;padding:10px 20px;border-radius:6px;font-size:13px;display:none;z-index:99;white-space:pre-wrap}
@media (max-width:1100px){.top{grid-template-columns:1fr}}
@media (max-width:900px){.review{grid-template-columns:1fr;height:auto}.rlist{max-height:40vh}.vs{grid-template-columns:1fr}.dact .keys{display:none}}
@media (max-width:600px){main{padding:10px}.big{font-size:26px}}
</style>

<body>
<div id="login-view"><h2 style="color:#1a5fa8">仕入（SMILE）</h2><p data-ha-login style="color:#6b7a99">花岡車輌の Microsoft アカウントでサインインしてください</p><button data-ha-login class="pri big-btn" onclick="signIn()">サインイン</button></div>

<script>
'use strict';
/* 仕入（SMILE）：SMILE の入力（発注・受入の積み重ね）＝先方の請求額 を仕入先ごとに確かめ、分け方を決めて OK する画面
   ・取り込み：SMILE の4ファイル（支払一覧表・9055・9521・仕入先マスタ）→ 照合 → AP_SmilePay（決済月×仕入先）に保存
   ・請求書：総務が「この仕入先に、この請求書」と置く → AP_Invoice（支払区分＝本社仕入/工場仕入）＋ incoming に PDF と task.json → AI が読み取る
   ・確認：SMILE の額｜請求書｜差。差は 端数→調整／相殺／SMILE を直して取り込み直し。分け方 → ✔ OK
   ・取り込み直しても、アプリでの作業（分け方・理由・確認・保留・コメント）は残す。金額が変わった仕入先は確認を外す
   決め事は 08_支払決裁.md（ワークフロー作成）。計算は ap_smile.js。決まりは AP_Setting の smile.rules。画面に業務データを書かない */
/* 全アプリ共通。HUBのサインインをそのまま使う（→ hanaoka_auth.js） */
const MSAL_CONFIG = HanaokaAuth.msalConfig();
const SCOPES=['User.Read','Sites.ReadWrite.All','Files.ReadWrite.All'];
const GRAPH='https://graph.microsoft.com/v1.0';
const AP_SITE='hanaokacorp.sharepoint.com,d80378dd-76a4-43f0-b939-1af66345d19d,8eaeb70b-2495-4029-affb-eabe80e021bb';
const S=window.APSmile, MOCK=window.AP_MOCK||null;   // MOCK は dev だけ（本番の HTML には無い）
const $=id=>document.getElementById(id);
let msalApp=null,acct=null;
const L={imp:{name:'AP_SmileImport'},pay:{name:'AP_SmilePay'},adj:{name:'AP_CarryAdjust'},inv:{name:'AP_Invoice'}};
Object.values(L).forEach(o=>{o.id=null;o.fmap={};});
const FILES={payList:null,p9055:null,receipts:null,master:null};
const KIND_LABEL={payList:'支払一覧表',p9055:'9055 支払明細書',receipts:'9521 受入リスト',master:'仕入先マスタ'};
const GROUPS=['全社','工場','国内営業','ソリューション','総務'];
const METHODS=['振込','でんさい','相殺','調整','現金','海外送金','口座振替'];   // 調整＝端数の精算（お金は動かない。SMILE 支払伝票の取引区分6）
const V3={ai:'AIStatus',com:'AIComment',by:'RegisteredBy',at:'RegisteredAt',loc:'SiteLocation'};   // AP_Invoice の受付・AI の列（経費の画面と同じ）
let calc=null,saved={},prevSaved={},adjs=[],settleSel={},lastImport=null,OFFSET={},INV={};
let rows=[],draft=null,pdfSel={},pdfCache={};
let listClosed=(()=>{try{return localStorage.getItem('ap.review.list')==='closed';}catch{return false;}})();   // 確認モードの一覧をたたむ（ページ送りが中心）
const st={tab:'imp',g:'全社',round:'',q:'',only:'',sort:'code',sel:null,cmOpen:false};

// ---------- 認証・Graph ----------
async function boot(){
  if(MOCK){acct=MOCK.account;await showApp();return;}
  msalApp=new msal.PublicClientApplication(MSAL_CONFIG);await msalApp.initialize();await msalApp.handleRedirectPromise();
  acct = await HanaokaAuth.restore(msalApp, SCOPES);
  if (acct) { await showApp(); }}
async function signIn(){try{acct = await HanaokaAuth.login(msalApp, SCOPES);await showApp();}catch(e){if(e.errorCode!=='user_cancelled')snack('サインインエラー: '+e.message,true);}}
async function token(){try{const r=await msalApp.acquireTokenSilent({scopes:SCOPES,account:acct});return r.accessToken;}catch{const r=await msalApp.acquireTokenPopup({scopes:SCOPES});acct=r.account;return r.accessToken;}}
async function call(method,p,body,ctype,raw){
  if(MOCK)return MOCK.call(method,p,body,raw);
  const t=await token();const h={Authorization:'Bearer '+t,Prefer:'HonorNonIndexedQueriesWarningMayFailRandomly'};
  if(body!=null&&!ctype)h['Content-Type']='application/json';if(ctype)h['Content-Type']=ctype;
  const r=await fetch(p.startsWith('http')?p:GRAPH+p,{method,headers:h,body:body==null?null:(ctype?body:JSON.stringify(body))});
  if(!r.ok)throw new Error('['+r.status+'] '+(await r.text()).slice(0,300));
  if(raw)return r.blob();const x=await r.text();return x?JSON.parse(x):{};}
const gget=p=>call('GET',p),gpost=(p,b)=>call('POST',p,b),gpatch=(p,b)=>call('PATCH',p,b);
const gputFile=(path,blob,type)=>call('PUT',`/sites/${AP_SITE}/drive/root:${encodeURI(path)}:/content`,blob,type||blob.type||'application/octet-stream');
async function fetchAll(o,filter){let all=[],n=`/sites/${AP_SITE}/lists/${o.id}/items?$expand=fields&$top=500`+(filter?'&$filter='+encodeURIComponent(filter):'');
  while(n){const d=await gget(n);all=all.concat(d.value||[]);n=d['@odata.nextLink']?d['@odata.nextLink'].replace(GRAPH,''):null;}return all;}
async function resolveLists(){
  const ls=await gget(`/sites/${AP_SITE}/lists?$select=id,displayName`);
  for(const o of Object.values(L)){const l=ls.value.find(x=>x.displayName===o.name);if(!l)throw new Error(o.name+' がありません（Provision-SmileAP.ps1 で作ってください）');o.id=l.id;
    const c=await gget(`/sites/${AP_SITE}/lists/${o.id}/columns?$select=name,displayName`);c.value.forEach(x=>o.fmap[x.displayName]=x.name);}
  // 決まり（部門の振り分け・手数料・サイトと期日・支払率の判定額）は AP_Setting の smile.rules（画面に書かない）
  const d=await gget(`/sites/${AP_SITE}/lists/AP_Setting/items?$expand=fields&$top=100`);
  const it=(d.value||[]).find(x=>x.fields&&x.fields.Title==='smile.rules');
  if(!it)throw new Error('AP_Setting に smile.rules がありません（Provision-SmileAP.ps1 -Apply で入れてください）');
  S.setRules(JSON.parse(it.fields.Value||'{}'));
  // 相殺先（設計書 v2.5 3-7）：計算どおりに出したうえで、相殺の有無を確かめないと OK できない
  OFFSET={};try{const ov=await gget(`/sites/${AP_SITE}/lists/AP_OffsetVendor/items?$expand=fields&$top=200`);
    (ov.value||[]).forEach(x=>{const f=x.fields||{};if(f.OffsetFlag!==false&&f.VendorCode)OFFSET[String(f.VendorCode).trim().padStart(6,'0')]=f.VendorName||true;});}
  catch(e){snack('相殺先リスト（AP_OffsetVendor）を読めませんでした：'+e.message,true);}}
const F=(o,d)=>o.fmap[d]||d, fv=(o,f,d)=>f[F(o,d)];
function toFields(o,obj){const r={};for(const k in obj)r[F(o,k)]=obj[k];return r;}
function me(){return acct.name||acct.username;}

// ---------- 小物 ----------
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const yen=n=>n==null||n===''?'':Math.round(+n).toLocaleString('ja-JP');
const man=n=>Math.round((+n||0)/10000).toLocaleString('ja-JP')+'万';
function diffHtml(cur,prev){if(!prev)return '<span style="color:#c3c9d6">—</span>';const d=cur-prev,p=Math.round(d/prev*100);
  return `<span class="${d>0?'d-up':d<0?'d-down':''}">${d>0?'▲':d<0?'▼':'±'}${man(Math.abs(d))}（${p>0?'+':''}${p}%）</span>`;}
function parseJ(s,d){try{return s?JSON.parse(s):d;}catch{return d;}}
function fmtTime(iso){if(!iso)return '';const d=new Date(iso);if(isNaN(d))return String(iso);const p=n=>String(n).padStart(2,'0');return `${d.getFullYear()}/${p(d.getMonth()+1)}/${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;}
function fmtD(s){s=String(s||'');return s.length===8?s.slice(0,4)+'/'+s.slice(4,6)+'/'+s.slice(6):s;}
function snack(m,e=false){const el=$('snackbar');el.textContent=m;el.style.background=e?'#c0392b':'#323232';el.style.display='block';clearTimeout(snack.t);snack.t=setTimeout(()=>el.style.display='none',e?7000:3500);}
function msg(t){$('status').textContent=t;}

// ---------- 決済月 ----------
function ymOf(d){return d.getFullYear()+'/'+String(d.getMonth()+1).padStart(2,'0');}
function initMonth(){const s=$('month');const n=new Date();
  for(let i=-1;i<6;i++){const d=new Date(n.getFullYear(),n.getMonth()-i,1);const o=document.createElement('option');o.value=ymOf(d);o.textContent=ymOf(d).replace('/','年')+'月払い';if(i===0)o.selected=true;s.appendChild(o);}
  const qm=new URLSearchParams(location.search).get('month');if(qm)setMonth(qm);}
function setMonth(v){const s=$('month');if(![...s.options].some(o=>o.value===v)){const o=document.createElement('option');o.value=v;o.textContent=v.replace('/','年')+'月払い';s.insertBefore(o,s.firstChild);}s.value=v;}
function month(){return $('month').value;}
function prevMonth(ym){const [y,m]=ym.split('/').map(Number);return ymOf(new Date(y,m-2,1));}
const dash=ym=>ym.replace('/','-');

async function showApp(){
  $('login-view').style.display='none';$('app-view').style.display='block';$('who').textContent=acct.name||acct.username;initMonth();
  try{await resolveLists();await loadSaved();}catch(e){msg('エラー');snack(e.message,true);}
  if(Object.keys(saved).length)st.tab='sum';render();}
async function loadSaved(){
  msg('読み込み中...');const ym=month();
  const toMap=items=>{const m={};items.forEach(it=>{const c=fv(L.pay,it.fields,'仕入先コード');if(c)m[c]={id:it.id,f:it.fields};});return m;};
  saved=toMap(await fetchAll(L.pay,`fields/${F(L.pay,'決済月')} eq '${ym}'`));
  prevSaved=toMap(await fetchAll(L.pay,`fields/${F(L.pay,'決済月')} eq '${prevMonth(ym)}'`));
  adjs=(await fetchAll(L.adj)).map(it=>({id:it.id,f:it.fields}));
  const imps=(await fetchAll(L.imp,`fields/${F(L.imp,'決済月')} eq '${ym}'`)).filter(it=>fv(L.imp,it.fields,'状態')!=='取り消し');
  imps.sort((a,b)=>String(fv(L.imp,b.fields,'取り込み日時')).localeCompare(String(fv(L.imp,a.fields,'取り込み日時'))));
  lastImport=imps[0]?{id:imps[0].id,f:imps[0].fields,count:imps.length}:null;
  await loadInvoices();
  settleSel={};openAdjs().forEach(a=>settleSel[a.id]=true);
  msg(Object.keys(saved).length?`保存済み ${Object.keys(saved).length} 社`:'まだ取り込んでいません');}
// この決済月の仕入の請求書（AP_Invoice：支払区分＝本社仕入/工場仕入、対象年月＝決済月、アーカイブ以外）を仕入先ごとに
async function loadInvoices(){
  // AI の読み取り結果（ai_result）を先に取り込む（請求額・口座のアラート）
  try{const a=await APIntake.apply({call,site:AP_SITE,onMsg:msg,ym:month()});if(a.applied)snack(`AI の読み取り結果を ${a.applied} 件取り込みました`);if(a.errors.length)console.warn(a.errors);}catch(e){console.warn(e);}
  INV={};const ym=month(),iv=(f,d)=>fv(L.inv,f,d);
  (await fetchAll(L.inv)).forEach(it=>{const f=it.fields;const c=iv(f,'支払区分')||'';if(c!=='本社仕入'&&c!=='工場仕入')return;
    if((iv(f,'対象年月')||'')!==ym||iv(f,'アーカイブフラグ')===true)return;const code=String(iv(f,'支払先コード')||'').trim();if(!code)return;
    (INV[code]=INV[code]||[]).push({id:it.id,name:iv(f,'支払先名')||'',no:iv(f,'請求NO')||'',amount:+iv(f,'金額_税込')||0,doc:String(iv(f,'DOCコード')||''),
      ai:f[V3.ai]||'',com:String(f[V3.com]||''),by:f[V3.by]||'',at:f[V3.at]||''});});}

// ---------- ファイル（取り込み） ----------
async function readRows(file){
  if(/\.xlsx?$/i.test(file.name)){const wb=XLSX.read(await file.arrayBuffer(),{type:'array'});
    return XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,raw:true,defval:''}).map(r=>r.map(c=>c==null?'':String(c)));}
  const buf=await file.arrayBuffer();let text=new TextDecoder('utf-8').decode(buf);
  if(text.indexOf('�')>=0)text=new TextDecoder('shift_jis').decode(buf);   // SMILE の設定によっては Shift_JIS
  return S.parseCSV(text);}
function kindOf(rows){
  const head=rows.slice(0,30).map(r=>r.map(c=>String(c).replace(/[\s　"]/g,'')));
  const has=(i,...ks)=>ks.every(k=>head[i].includes(k));
  for(let i=0;i<head.length;i++)if(has(i,'コード','仕入先名','今回支払残高'))return 'payList';
  if(!head[0])return null;
  if(has(0,'でんさい利用者番号'))return 'master';
  if(has(0,'前回支払残高','支払明細ｼﾞｬﾝｺｰﾄﾞ'))return 'p9055';
  if(has(0,'伝票日付','税抜受入金額'))return 'receipts';
  return null;}
async function onFiles(list){
  for(const file of list){
    try{const rows=await readRows(file);const k=kindOf(rows);
      if(!k){snack(file.name+'：どのファイルか分かりません（見出しを確かめてください）',true);continue;}
      const data=k==='payList'?S.readPayList(rows):k==='p9055'?S.read9055(rows):k==='receipts'?S.readReceipts(rows):S.readVendorMaster(rows);
      FILES[k]={file,data,rows:rows.length-1};
    }catch(e){snack(file.name+'：'+e.message,true);}}
  const pl=FILES.payList&&FILES.payList.data;
  if(pl&&pl.closeYm){const ym=ymOf(new Date(+pl.closeYm.slice(0,4),+pl.closeYm.slice(5,7),1));   // 締め月の翌月＝決済月
    if(ym!==month()){setMonth(ym);calc=null;st.sel=null;await loadSaved();}}
  recalc();st.tab='imp';render();}
const allFiles=()=>Object.values(FILES).every(Boolean);
function fileInfo(k){const x=FILES[k];if(!x)return '';const d=x.data;
  if(k==='payList')return `${d.title||'締め日不明'}・${Object.keys(d.rows).length}社`;
  if(k==='receipts')return `${fmtD(d.from)}〜${fmtD(d.to)}・${x.rows}行`;
  return `${Object.keys(d).length}社`;}

// ---------- 繰越の調整（SMILE を締めた後のアプリ修正） ----------
const af=(a,d)=>fv(L.adj,a.f,d);
function openAdjs(){const ym=month();return adjs.filter(a=>af(a,'状態')==='未精算'&&String(af(a,'発生した決済月'))<ym);}
function adjustFor(){const ym=month(),m={};const add=(c,v)=>{m[c]=m[c]||{other:0};m[c].other+=v;};
  adjs.forEach(a=>{const c=af(a,'仕入先コード'),v=+af(a,'金額')||0;if(af(a,'発生した決済月')===ym)add(c,v);if(af(a,'精算した決済月')===ym)add(c,-v);});
  openAdjs().forEach(a=>{if(settleSel[a.id])add(af(a,'仕入先コード'),-(+af(a,'金額')||0));});return m;}

// ---------- 計算と1行 ----------
function recalc(){
  if(!FILES.payList||!FILES.master){calc=null;return;}
  calc=S.compute({payList:FILES.payList.data,p9055:FILES.p9055&&FILES.p9055.data,receipts:FILES.receipts&&FILES.receipts.data,
    master:FILES.master.data,payYm:dash(month()),adjust:adjustFor(),offsetVendors:OFFSET});}
const pf=(r,d)=>r.saved?fv(L.pay,r.saved.f,d):undefined;
// 表示・保存に使う1行（置いたファイルの計算 ＋ 保存済みのアプリでの作業 ＋ 請求書）
function buildRows(){
  const out=[],seen={};
  const fromSaved=(code,sv)=>{const g=d=>fv(L.pay,sv.f,d);const dd=parseJ(g('部門内訳'),{});const cl=parseJ(g('分け方（計算）'),null);
    const lines=cl||[];if(!cl&&+g('振込（計算）'))lines.push({method:'振込',amount:+g('振込（計算）'),site:0,due:''});
    if(!cl&&+g('でんさい（計算）'))lines.push({method:'でんさい',amount:+g('でんさい（計算）'),site:+g('サイト')||0,due:g('期日')||''});
    return {code,name:g('仕入先名'),payDate:g('支払予定日'),payRound:g('支払日区分')||'月末',
      smile:{prevBalance:+g('前回支払残高'),paid:+g('今回支払額'),discount:+g('値引調整額'),carry:+g('繰越残高'),excl:+g('税抜仕入額'),tax:+g('消費税額'),incl:+g('税込仕入額'),balance:+g('今回支払残高')},
      bal9055:g('9055前回残高'),rcvIncl:g('受入税込'),byDept:dd.byDept||{},byGroup:dd.byGroup||{},mainDept:g('決裁の部門')||'総務',
      amount:+g('支払額')||0,rule:g('分け方の決まり')||'',calcLines:lines,feeKbn:g('手数料区分')||'',calcFee:+g('振込手数料（計算）')||0,
      notes:String(g('気づき')||'').split('\n').filter(Boolean),status:g('取り込みの状態')||'',prevPay:g('前回の支払額'),carryHeld:+g('保留した繰越')||0};};
  if(calc){
    const pl=FILES.payList.data.rows;
    calc.rows.forEach(c=>{seen[c.code]=1;const sv=saved[c.code]||null,p=pl[c.code]||{};
      const r={code:c.code,name:c.name,payDate:c.payDate,payRound:c.payRound,
        smile:{prevBalance:c.prevBalance,paid:c.paid,discount:p.discount||0,carry:c.carry,excl:p.excl||0,tax:p.tax||0,incl:c.listIncl,balance:c.listBalance},
        bal9055:c.balance9055,rcvIncl:c.receiptIncl,byDept:c.byDept,byGroup:c.deptByGroup,mainDept:c.mainDept,
        amount:c.amount,rule:c.rule,calcLines:S.splitLines(c,null,dash(month())),feeKbn:c.feeKbn,calcFee:c.fee,notes:c.notes.slice(),saved:sv,carryHeld:c.carryHeld};
      r.status=!sv?'新規':Math.round(+pf(r,'支払額'))===Math.round(r.amount)?'変化なし':'金額が変わった';
      r.prevPay=sv?+pf(r,'支払額'):null;out.push(r);});
    Object.keys(saved).forEach(code=>{if(seen[code])return;const r=fromSaved(code,saved[code]);r.saved=saved[code];r.status='なくなった';r.prevPay=r.amount;r.amount=0;r.calcLines=[];r.byGroup={};out.push(r);});
  }else Object.keys(saved).sort().forEach(code=>{const r=fromSaved(code,saved[code]);r.saved=saved[code];out.push(r);});
  out.forEach(r=>{
    r.override=r.saved?parseJ(pf(r,'分け方の上書き'),null):null;
    r.reason=r.saved?(pf(r,'変えた理由')||''):'';r.feeOverride=r.saved?(pf(r,'手数料の上書き')||''):'';
    r.checked=!!(r.saved&&pf(r,'確認済み'));r.checkedBy=r.saved?pf(r,'確認者')||'':'';r.comment=r.saved?pf(r,'コメント')||'':'';
    r.hold=!!(r.saved&&pf(r,'保留'));r.needReview=!!(r.saved&&pf(r,'見直しが要る'));
    r.offsetVendor=!!OFFSET[r.code];r.offsetChecked=!!(r.saved&&pf(r,'相殺の確認'));
    if(calc&&r.status==='金額が変わった'){r.checked=false;r.offsetChecked=false;if(r.override)r.needReview=true;}
    r.lastMonth=prevSaved[r.code]?+fv(L.pay,prevSaved[r.code].f,'支払額'):null;
    // 請求書：SMILE の額（支払額）と請求書の合計の差。保留した繰越は SMILE の額に入れない
    r.invoices=INV[r.code]||[];r.invTotal=r.invoices.reduce((s,x)=>s+x.amount,0);
    r.invReading=r.invoices.some(x=>x.ai==='受付');r.invFailed=r.invoices.some(x=>x.ai==='読取失敗');
    r.invDiff=r.invoices.length&&!r.invReading?r.invTotal-r.amount:null;
    r.aiAlerts=r.invoices.flatMap(x=>x.com.split(/\n+/).map(s=>s.trim()).filter(Boolean));
    r.bankAlert=r.aiAlerts.some(s=>/口座/.test(s));});
  return out;}
function linesOf(r){return r.override&&r.override.length?S.splitLines(r,r.override,dash(month())):r.calcLines;}
function feeOf(r){if(r.feeOverride!==''&&r.feeOverride!=null)return +r.feeOverride||0;
  if(!(r.override&&r.override.length))return r.calcFee;
  return S.transferFeeOf(linesOf(r).filter(l=>l.method==='振込').reduce((s,l)=>s+l.amount,0),r.feeKbn);}
const linesSum=r=>linesOf(r).reduce((s,l)=>s+(+l.amount||0),0);
function splitOk(r){const s=linesSum(r);return s===r.amount||(r.amount<0&&s===0);}
// 確認が要る行＝何か SMILE に戻すものがある（支払・相殺・調整）
const needsCheck=r=>r.status!=='なくなった'&&linesOf(r).some(l=>+l.amount);
// タグ（一覧・サマリーの気づき）
function tagsOf(r){const t=[];
  if(r.status==='新規'&&calc)t.push(['新規','t-pri']);if(r.status==='金額が変わった')t.push(['金額が変わった','t-up']);if(r.status==='なくなった')t.push(['なくなった','t-new']);
  if(r.offsetVendor)t.push([r.offsetChecked?'相殺先（確認済）':'相殺先','t-flag']);
  if(needsCheck(r)){if(!r.invoices.length)t.push(['請求書なし','t-new']);else if(r.invReading)t.push(['AI 読み取り中','t-pri']);
    else if(r.invDiff)t.push([`請求書と差 ${r.invDiff>0?'+':''}${yen(r.invDiff)}`,Math.abs(r.invDiff)<100?'t-new':'t-up']);}
  if(r.invFailed)t.push(['読み取り失敗','t-up']);if(r.bankAlert)t.push(['口座','t-up']);
  if(r.carryHeld)t.push(['繰越保留','t-new']);if(r.needReview)t.push(['分け方の見直し','t-up']);
  if(r.lastMonth&&r.amount-r.lastMonth>=3000000&&r.amount>=r.lastMonth*2)t.push([`前月の${Math.round(r.amount/r.lastMonth*10)/10}倍`,'t-up']);
  return t;}
function totalsOf(list,g){const t={pay:0,振込:0,でんさい:0,相殺:0,調整:0,現金:0,海外送金:0,口座振替:0,fee:0,held:0,n:0};
  list.forEach(r=>{if(g&&g!=='全社'){t.pay+=Math.max(0,(r.byGroup||{})[g]||0);return;}
    t.held+=r.carryHeld||0;if(r.amount>0){t.pay+=r.amount;t.n++;}linesOf(r).forEach(l=>{t[l.method]=(t[l.method]||0)+l.amount;});t.fee+=feeOf(r);});return t;}

// ---------- 照合 ----------
function checkList(){
  if(!calc)return null;const out=[],cs=calc.checks;
  const cnt=re=>calc.rows.filter(r=>r.notes.some(n=>re.test(n)));
  const pl=FILES.payList.data,rc=FILES.receipts&&FILES.receipts.data;
  if(rc){const m=String(rc.to||'').slice(0,6),cm=(pl.closeYm||'').replace('-','');
    out.push({ok:m===cm&&String(rc.from||'').slice(0,6)===cm,label:'締め月がそろっている',detail:`支払一覧表 ${pl.title||'?'}／受入 ${fmtD(rc.from)}〜${fmtD(rc.to)}`});}
  else out.push({ok:'info',label:'9521 受入リストがありません（税込仕入額の照合と部門の内訳ができません）'});
  if(FILES.p9055){const a=cnt(/前回支払残高が 9055 と違う|9055 にない/);out.push({ok:!a.length,label:'前回支払残高（支払一覧表 と 9055）',detail:a.length?a.map(r=>r.name).join('・'):`${calc.rows.length}社一致`});}
  else out.push({ok:'info',label:'9055 がありません（前回支払残高の照合と部門ができません）'});
  if(rc){const a=cnt(/税込仕入額が受入リストと違う/);out.push({ok:!a.length,label:'税込仕入額（支払一覧表 と 9521）',detail:a.length?a.map(r=>r.name).join('・'):`${calc.rows.length}社一致`});}
  // SMILE とアプリの完全一致：SMILE の「今回支払額＋値引調整額」＝前月にアプリで決めて SMILE 支払伝票で戻した額
  if(Object.keys(prevSaved).length){const pay=c=>+fv(L.pay,prevSaved[c].f,'支払額')||0,smileP=r=>r.paid+((pl.rows[r.code]||{}).discount||0);
    const ng=calc.rows.filter(r=>prevSaved[r.code]&&Math.round(smileP(r))!==Math.round(pay(r.code)));
    out.push({ok:!ng.length,label:'SMILE の今回支払額＋値引調整額（前月にアプリで決めた額と一致）',detail:ng.length?ng.map(r=>`${r.name} SMILE ${yen(smileP(r))}／アプリ ${yen(pay(r.code))}`).join('・')+'（SMILE 支払伝票の取り込み漏れ・ずれ）':`${calc.rows.filter(r=>prevSaved[r.code]).length}社一致`});}
  const tot=cs.find(c=>/総合計/.test(c.note));out.push({ok:!tot,label:'支払一覧表の総合計と行の合計',detail:tot?tot.note:(pl.total?yen(pl.total.balance):'')});
  const nm=cnt(/^仕入先マスタにない$/);out.push({ok:!nm.length,label:'仕入先マスタにある',detail:nm.length?nm.map(r=>r.name).join('・'):''});
  const sp=cnt(/合わない/);if(sp.length)out.push({ok:false,label:'分け方の合計が支払額と合う',detail:sp.map(r=>r.name).join('・')});
  cs.filter(c=>/支払一覧表にない/.test(c.note)).forEach(c=>out.push({ok:'info',label:`${c.code} ${c.name}`,detail:c.note}));
  const big=calc.rows.filter(r=>r.carryHeld);if(big.length)out.push({ok:'info',label:`保留中の繰越 ${big.length}社（3月末の決算で整理。今月分だけ払う）`,detail:big.map(r=>`${r.name} ${yen(r.carryHeld)}`).join('・')});
  const fr=cnt(/端数：/);if(fr.length)out.push({ok:'info',label:`端数の繰越 ${fr.length}社（今回で精算）`});
  const mi=cnt(/マイナス/);if(mi.length)out.push({ok:'info',label:`残高がマイナス ${mi.length}社（端数は調整で精算）`,detail:mi.map(r=>`${r.name} ${yen(r.amount)}`).join('・')});
  const of=calc.rows.filter(r=>r.offsetVendor);if(of.length)out.push({ok:'info',label:`相殺先 ${of.length}社（相殺の有無を確認してから OK）`,detail:of.map(r=>r.name).join('・')});
  const od=calc.rows.filter(r=>r.payRound!=='月末');if(od.length)out.push({ok:'info',label:`月末以外の支払予定日 ${od.length}社（その回へ回す）`,detail:od.map(r=>`${r.name} ${r.payDate}`).join('・')});
  return out;}
const checksHtml=list=>`<ul class="checks">${list.map(c=>`<li><span class="${c.ok===true?'ck-ok':c.ok===false?'ck-ng':'ck-info'}">${c.ok===true?'✔':c.ok===false?'✖':'!'}</span> ${esc(c.label)}${c.detail?` <span style="color:var(--sub)">— ${esc(c.detail)}</span>`:''}</li>`).join('')}</ul>`;

function inGroup(r,g){return g==='全社'||((r.byGroup||{})[g]||0)!==0||r.mainDept===g;}
const rowsG=()=>rows.filter(r=>inGroup(r,st.g)&&(!st.round||r.payRound===st.round));

function wireDetail(r){
  const on=(id,fn)=>{const e=$(id);if(e)e.onclick=fn;};
  on('dPrev',()=>go(-1));on('dNext',()=>go(1));on('dOk',confirmRow);on('dUn',()=>act(r,{'確認済み':false,'確認者':'','確認日時':''}));
  on('dHold',()=>act(r,{'保留':!r.hold,'確認済み':false}));on('dCmB',()=>{st.cmOpen=true;$('dCm').style.display='';$('dCm').focus();});
  const cm=$('dCm');if(cm)cm.onchange=()=>act(r,{'コメント':cm.value},'コメントを保存しました');
  const co=$('cOff');if(co)co.onchange=()=>act(r,{'相殺の確認':co.checked,'確認済み':false});
  on('bAdd',()=>{const dd=dLines(r);const rest=r.amount-dd.reduce((s,l)=>s+(+l.amount||0),0);dd.push({method:rest<0?'調整':'振込',amount:rest,site:0});drawDetail();});
  on('bClr',async()=>{if(!confirm('分け方を計算（マスタどおり）に戻しますか？'))return;draft=null;await act(r,{'分け方の上書き':'','変えた理由':'','確認済み':false,'見直しが要る':false});});
  on('bSplit',()=>saveSplit(r));on('bFee',()=>act(r,{'手数料の上書き':$('fee').value.trim(),'確認済み':false},'手数料を保存しました'));
  on('bAdj',()=>addAdjust(r));
  // 請求書との差：端数は「請求書どおりに払い、差を調整」。請求書が少ない（相殺通知など）は「差を相殺の行」
  const withDiff=(kind,reason)=>{const base=linesOf(r).map(l=>({method:l.method,amount:l.amount,site:l.site}));const dd=r.invDiff;
    const t=base.find(l=>l.method==='振込'||l.method==='でんさい')||base[0];if(t)t.amount+=dd;base.push({method:kind,amount:-dd,site:0});const nz=base.filter(l=>+l.amount);
    draft=nz.length?nz:base;drawDetail();$('reason').value=reason;};
  on('bFix',()=>withDiff('調整',`請求書との端数差 ${r.invDiff>0?'+':''}${r.invDiff} 円を調整`));
  on('bOff',()=>withDiff('相殺','売買相殺（相殺通知の額）'));
  document.querySelectorAll('[data-dk]').forEach(e=>e.onchange=()=>{const dd=dLines(r),k=+e.dataset.dk,f=e.dataset.df;dd[k][f]=f==='method'?e.value:(+e.value||0);
    if(f==='method'&&e.value==='でんさい'&&!dd[k].site)dd[k].site=(r.calcLines.find(l=>l.site)||{}).site||0;drawDetail();});
  document.querySelectorAll('[data-ddel]').forEach(e=>e.onclick=()=>{dLines(r).splice(+e.dataset.ddel,1);drawDetail();});
  document.querySelectorAll('[data-pdf]').forEach(e=>e.onclick=()=>showPdf(r,e.dataset.pdf));
  const id=$('idrop');if(id){['dragenter','dragover'].forEach(ev=>id.addEventListener(ev,x=>{x.preventDefault();id.classList.add('over');}));
    ['dragleave','drop'].forEach(ev=>id.addEventListener(ev,x=>{x.preventDefault();id.classList.remove('over');}));
    id.addEventListener('drop',x=>registerInvoices(r,x.dataTransfer.files));$('ifile').onchange=x=>registerInvoices(r,x.target.files);}
  st.cmOpen=false;
  if(r.invoices.length&&!pdfSel[r.code])pdfSel[r.code]=r.invoices[0].id;if(pdfSel[r.code])showPdf(r,pdfSel[r.code]);}
const dLines=r=>draft||(draft=linesOf(r).map(l=>({method:l.method,amount:l.amount,site:l.site})));
function go(dlt){const a=listRows(),i=a.findIndex(x=>x.code===st.sel);const n=a[Math.min(a.length-1,Math.max(0,i+dlt))];if(n){st.sel=n.code;draft=null;drawRows();drawDetail();}}
async function showPdf(r,id){
  pdfSel[r.code]=id;document.querySelectorAll('[data-pdf]').forEach(b=>b.classList.toggle('on',b.dataset.pdf===id));
  const v=$('pdfv'),x=r.invoices.find(y=>y.id===id);if(!v||!x)return;
  if(pdfCache[id]){v.innerHTML=APDoc.view(pdfCache[id],x.doc);return;}
  const path=String(x.doc||'').split(/[\r\n;]+/)[0].trim().replace(/^\/Shared Documents/i,'').replace(/^\/Documents/i,'');
  if(!path){v.textContent='PDF の場所がありません';return;}
  v.textContent='読み込み中...';
  // 受付直後は incoming、PA の処理後は processed。片方で見つからなければもう一方も試す
  const alt=/\/incoming\//i.test(path)?path.replace(/\/incoming\//i,'/processed/'):path.replace(/\/processed\//i,'/incoming/');
  for(const p of [path,alt]){try{const b=await call('GET',`/sites/${AP_SITE}/drive/root:${encodeURI(p)}:/content`,null,null,true);pdfCache[id]=URL.createObjectURL(b);
      if(st.sel===r.code&&pdfSel[r.code]===id&&$('pdfv'))$('pdfv').innerHTML=APDoc.view(pdfCache[id],x.doc);return;}catch(e){}}
  if($('pdfv')&&st.sel===r.code&&pdfSel[r.code]===id)$('pdfv').textContent='PDF を開けませんでした';}

// ---------- 作業の保存 ----------
async function patchRow(r,obj){const fields=toFields(L.pay,obj);await gpatch(`/sites/${AP_SITE}/lists/${L.pay.id}/items/${r.saved.id}/fields`,fields);Object.assign(r.saved.f,fields);}
async function act(r,obj,ok){try{await patchRow(r,obj);if(ok)snack(ok);render();}catch(e){snack('保存エラー: '+e.message,true);}}
async function saveSplit(r){if(!draft)return;
  const sum=draft.reduce((s,l)=>s+(+l.amount||0),0);if(!(sum===r.amount||(r.amount<0&&sum===0))){snack('分け方の合計（'+yen(sum)+'）が支払額（'+yen(r.amount)+'）と合いません',true);return;}
  const same=JSON.stringify(draft.map(l=>[l.method,+l.amount,+l.site||0]))===JSON.stringify(r.calcLines.map(l=>[l.method,+l.amount,+l.site||0]));
  const reason=$('reason').value.trim();if(!same&&!reason){snack('マスタと違う分け方にした理由を書いてください',true);return;}
  const d=draft;draft=null;await act(r,{'分け方の上書き':same?'':JSON.stringify(d),'変えた理由':same?'':reason,'確認済み':false,'見直しが要る':false},same?'計算どおりの分け方に戻しました':'分け方を保存しました');}
async function confirmRow(){const r=cur();if(!r||!canEdit(r)||r.checked||!needsCheck(r))return;
  const btn=$('dOk');if(!btn||btn.disabled)return;
  const a=listRows(),i=a.findIndex(x=>x.code===r.code);
  try{await patchRow(r,{'確認済み':true,'確認者':me(),'確認日時':new Date().toISOString(),'見直しが要る':false,'保留':false});
    rows=buildRows();const nx=a.slice(i+1).concat(a.slice(0,i)).find(x=>{const y=rows.find(z=>z.code===x.code);return y&&needsCheck(y)&&!y.checked;});
    if(nx)st.sel=nx.code;draft=null;render();}catch(e){snack('保存エラー: '+e.message,true);}}
// SMILE を締めた後の修正：AP_CarryAdjust に残し、今月の支払額と計算の分け方を直す（翌月の取り込みで相殺する）
async function addAdjust(r){const a=Math.round(+$('adjA').value||0),why=$('adjR').value.trim();
  if(!a){snack('金額を入れてください',true);return;}if(!why){snack('理由を書いてください',true);return;}
  if(!confirm(`${r.name} の今月（${month()}）の支払を ${a>0?'+':''}${a.toLocaleString()} 円直します。\n翌月の取り込みで ${(-a).toLocaleString()} 円を相殺します。よろしいですか？`))return;
  try{await gpost(`/sites/${AP_SITE}/lists/${L.adj.id}/items`,{fields:toFields(L.adj,{Title:`${month()} ${r.code} ${r.name}`,'仕入先コード':r.code,'仕入先名':r.name,'発生した決済月':month(),'金額':a,'理由':why,'状態':'未精算','入力した人':me()})});
    const ls=r.calcLines.map(l=>({...l}));const t=ls.find(l=>l.method==='振込')||ls[0];if(t)t.amount+=a;else ls.push({method:'振込',amount:r.amount+a,site:0,due:''});
    const tr=ls.filter(l=>l.method==='振込').reduce((s,l)=>s+l.amount,0);
    await patchRow(r,{'支払額':r.amount+a,'分け方（計算）':JSON.stringify(ls),'振込（計算）':tr,'でんさい（計算）':ls.filter(l=>l.method==='でんさい').reduce((s,l)=>s+l.amount,0),
      '振込手数料（計算）':S.transferFeeOf(tr,r.feeKbn),'確認済み':false,'見直しが要る':!!(r.override&&r.override.length),'気づき':r.notes.concat([`SMILE 締め後の修正 ${a>0?'+':''}${a.toLocaleString()}（${why}）`]).join('\n')});
    adjs=(await fetchAll(L.adj)).map(it=>({id:it.id,f:it.fields}));snack('記録しました');render();}catch(e){snack('記録エラー: '+e.message,true);}}

// ---------- 請求書を置く（仕入先が決まった状態で受け付ける。新フロー整理 v3） ----------
function apCode(){const d=new Date(),p=n=>String(n).padStart(2,'0'),s='ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';let x='';for(let i=0;i<8;i++)x+=s[Math.floor(Math.random()*s.length)];return `AP${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}${x}`;}
async function registerInvoices(r,files){
  const list=[...files].filter(f=>APDoc.kind(f));if(!list.length){snack('PDF か画像（写真）を選んでください',true);return;}
  const cat=r.mainDept==='工場'?'工場仕入':'本社仕入',loc=r.mainDept==='工場'?'工場':'本社';let ok=0;const jobs=[];
  for(const f of list){const code=apCode();
    try{msg('受付中... '+f.name);
      const d=await APDoc.prep(f);   // 画像は大きければ縮めて JPEG に
      const base=d.base.replace(/[#%*<>?/\\{|}:"']/g,'_').replace(/\s+/g,' ').trim().slice(0,60),fname=`${code}_${base||'請求書'}.${d.ext}`;
      await gputFile(`/BILLS/incoming/${fname}`,d.blob,d.type);
      const hf=toFields(L.inv,{Title:d.base,'支払区分':cat,'支払先コード':r.code,'支払先名':r.name,'対象年月':month(),'仕分け済':true,'支払ステータス':'確認待','DOCコード':`/Shared Documents/BILLS/incoming/${fname}`});
      hf[V3.ai]='受付';hf[V3.by]=me();hf[V3.at]=new Date().toISOString();hf[V3.loc]=loc;
      const created=await gpost(`/sites/${AP_SITE}/lists/${L.inv.id}/items`,{fields:hf});
      // sidecar：AI（Claude）がどの請求書を埋めるか。仕入なので SMILE の額と口座マスタも見る
      const task={ap_code:code,pdf_file:fname,invoice_id:String(created.id),category:cat,location:loc,vendor_code:r.code,vendor_name:r.name,target_ym:month(),
        smile_amount:r.amount,smile_incl:r.smile.incl,checks:['請求額とSMILEの額の差','振込先口座とAP_VendorBankの違い','二重請求'],registered_by:me(),registered_at:new Date().toISOString(),source_name:f.name};
      await gputFile(`/BILLS/incoming/${code}.task.json`,new Blob([JSON.stringify(task,null,2)],{type:'application/json'}),'application/json');
      jobs.push({apCode:code,invoiceId:String(created.id),category:cat,location:loc,targetYm:month(),vendorCode:r.code,vendorName:r.name,smileAmount:r.amount,file:d.blob,pdfName:fname});
      ok++;}catch(e){snack('受付エラー: '+e.message,true);}}
  await loadInvoices();msg('');snack(`✓ ${ok}件を受け付けました（AI が読んでいます。1件20〜30秒）`);render();
  readByAI(jobs);}
// AI（Claude API）ですぐ読む（ap_ai.js）。読み終わったものから取り込む（loadInvoices が APIntake で取り込む）
let aiChain=Promise.resolve();
function readByAI(jobs){if(!window.APAI||!jobs.length)return;
  jobs.forEach(j=>APAI.readInvoice({call,site:AP_SITE},j)
    .then(x=>{if(!x.ok)snack(`AI が読めませんでした：${j.pdfName}（${x.message}）`,true);},e=>snack('AI の読み取りエラー：'+e.message,true))
    .then(()=>{aiChain=aiChain.then(async()=>{await loadInvoices();render();});}));}

// ---------- 取り込みの保存 ----------
function stamp(){const d=new Date(),p=n=>String(n).padStart(2,'0');return d.getFullYear()+p(d.getMonth()+1)+p(d.getDate())+'-'+p(d.getHours())+p(d.getMinutes())+p(d.getSeconds());}
async function saveImport(){
  if(!calc||!allFiles())return;const ym=month(),list=checkList(),ng=list.filter(c=>c.ok===false);
  const cnt={};rows.forEach(r=>cnt[r.status]=(cnt[r.status]||0)+1);
  if(!confirm(`${ym} の仕入を保存します（${rows.length}社：新規 ${cnt.新規||0}・金額が変わった ${cnt.金額が変わった||0}・なくなった ${cnt.なくなった||0}）。`+
    (ng.length?`\n\n⚠ 照合で合わないものが ${ng.length} 件あります：\n`+ng.map(c=>'・'+c.label).join('\n'):'')+`\n\n金額が変わった仕入先は「確認済み」を外します。`))return;
  $('bSave').disabled=true;const pg=$('prog');pg.style.display='';
  try{
    const folder=`/BILLS/SMILE取込/${dash(ym)}`,ts=stamp(),files=[];
    for(const k of Object.keys(FILES)){const x=FILES[k];const name=ts+'_'+x.file.name.replace(/[#%*<>?/\\{|}:"]/g,'_');
      try{await gputFile(`${folder}/${name}`,x.file);files.push({kind:KIND_LABEL[k],name:x.file.name,path:`${folder}/${name}`,rows:x.rows});}
      catch(e){if(!confirm(`原本（${x.file.name}）を保存できませんでした：${e.message}\n続けますか？`))throw e;files.push({kind:KIND_LABEL[k],name:x.file.name,path:'',rows:x.rows});}}
    const t=totalsOf(rows,'全社'),pl=FILES.payList.data;
    const changes=rows.filter(r=>r.status!=='変化なし').map(r=>({code:r.code,name:r.name,status:r.status,prev:r.prevPay,now:r.amount}));
    const imp=await gpost(`/sites/${AP_SITE}/lists/${L.imp.id}/items`,{fields:toFields(L.imp,{Title:`${ym} 仕入の取り込み ${ts}`,'決済月':ym,'締め日':pl.title||'',
      '取り込んだ人':me(),'取り込み日時':new Date().toISOString(),'ファイル':JSON.stringify(files),'原本の保存先':folder,'仕入先数':rows.filter(r=>r.status!=='なくなった').length,
      '今回支払残高':pl.total?pl.total.balance:null,'払う額':t.pay,'振込':t.振込-t.fee,'振込手数料':t.fee,'でんさい':t.でんさい,'手形':0,
      '照合の不一致':ng.length,'照合と気づき':JSON.stringify(list),'変化の件数':changes.length,'前回からの変化':JSON.stringify(changes),'状態':'取り込み済'})});
    let n=0;
    for(const r of rows){n++;pg.firstElementChild.style.width=Math.round(n/rows.length*100)+'%';msg(`保存中 ${n}/${rows.length}`);
      const ls=r.calcLines,tr=ls.filter(l=>l.method==='振込').reduce((s,l)=>s+l.amount,0),dl=ls.find(l=>l.method==='でんさい');
      const o={Title:`${ym} ${r.code} ${r.name}`,'決済月':ym,'仕入先コード':r.code,'仕入先名':r.name,'支払日区分':r.payRound,'支払予定日':r.payDate||'','取り込みの状態':r.status,'取り込みID':String(imp.id),'気づき':r.notes.join('\n')};
      if(r.status!=='なくなった')Object.assign(o,{'前回支払残高':r.smile.prevBalance,'今回支払額':r.smile.paid,'値引調整額':r.smile.discount,'繰越残高':r.smile.carry,
        '税抜仕入額':r.smile.excl,'消費税額':r.smile.tax,'税込仕入額':r.smile.incl,'今回支払残高':r.smile.balance,
        '部門内訳':JSON.stringify({byDept:r.byDept,byGroup:r.byGroup}),'決裁の部門':r.mainDept,'支払額':r.amount,'分け方の決まり':r.rule,
        '分け方（計算）':JSON.stringify(ls),'保留した繰越':r.carryHeld||0,'振込（計算）':tr,'でんさい（計算）':dl?dl.amount:0,'でんさいか手形か':dl?'でんさい':'','サイト':dl?(+dl.site||0):0,'期日':dl?dl.due||'':'',
        '手数料区分':r.feeKbn||'','振込手数料（計算）':r.calcFee||0});
      else Object.assign(o,{'支払額':0,'分け方（計算）':'[]','振込（計算）':0,'でんさい（計算）':0,'振込手数料（計算）':0});
      if(r.bal9055!=null)o['9055前回残高']=r.bal9055;if(r.rcvIncl!=null)o['受入税込']=r.rcvIncl;if(r.prevPay!=null)o['前回の支払額']=r.prevPay;
      if(r.status!=='変化なし')Object.assign(o,{'確認済み':false,'確認者':'','確認日時':'','相殺の確認':false,'見直しが要る':!!(r.override&&r.override.length)&&r.status!=='新規'});
      if(r.saved)await gpatch(`/sites/${AP_SITE}/lists/${L.pay.id}/items/${r.saved.id}/fields`,toFields(L.pay,o));
      else await gpost(`/sites/${AP_SITE}/lists/${L.pay.id}/items`,{fields:toFields(L.pay,o)});}
    for(const a of openAdjs())if(settleSel[a.id])await gpatch(`/sites/${AP_SITE}/lists/${L.adj.id}/items/${a.id}/fields`,toFields(L.adj,{'状態':'精算済','精算した決済月':ym}));
    calc=null;await loadSaved();st.tab='rev';render();snack(`✅ ${ym} の仕入を保存しました（${rows.length}社）`);
  }catch(e){snack('保存エラー: '+e.message,true);if($('bSave'))$('bSave').disabled=false;}}

// ---------- 下：進み具合 ----------
function drawApprove(){
  const n=rows.filter(needsCheck),ok=n.filter(r=>r.checked).length,h=n.filter(r=>r.hold).length,all=n.length>0&&ok===n.length;
  $('approve').innerHTML=!rows.length?'<span class="prog">まだ取り込んでいません</span>':calc?'<span class="prog">取り込みを保存すると確認できます</span>'
    :`<span class="prog">確認OK ${ok} / ${n.length} 社${h?`　<b style="color:var(--warn)">保留 ${h} 社</b>`:''}　（全社・全回）</span>
      ${all?'':`<span class="rest">あと ${n.length-ok} 社${h?`（うち保留 ${h} 社）`:''}</span>`}
      <a href="ap_payment.html?month=${encodeURIComponent(month())}"><button class="pri" ${all?'':'disabled'} title="${all?'':'すべての仕入先を「確認OK」にすると進めます'}">支払指図を作る（支払一覧へ）→</button></a>`;}

// ---------- 操作 ----------
document.addEventListener('click',e=>{
  const tb=e.target.closest('[data-tab]');if(tb){st.tab=tb.dataset.tab;render();return;}
  const g=e.target.closest('[data-g]');if(g){e.preventDefault();st.g=g.dataset.g;st.sel=null;draft=null;render();return;}
  const rd=e.target.closest('[data-round]');if(rd){st.round=rd.dataset.round;st.sel=null;draft=null;render();return;}
  const s=e.target.closest('[data-sel]');if(s){st.sel=s.dataset.sel;draft=null;if(st.tab!=='rev'){st.tab='rev';st.only='';render();}else{drawRows();drawDetail();}}});
document.addEventListener('change',async e=>{
  const id=e.target.id;
  if(id==='month'){calc=null;st.sel=null;draft=null;await loadSaved();render();}
  else if(id==='fo'){st.only=e.target.value;drawRows();drawDetail();}else if(id==='fs'){st.sort=e.target.value;drawRows();drawDetail();}
  else if(e.target.dataset&&e.target.dataset.settle){settleSel[e.target.dataset.settle]=e.target.checked;recalc();render();}});
document.addEventListener('input',e=>{if(e.target.id==='q'){st.q=e.target.value.trim();drawRows();drawDetail();}});
document.addEventListener('keydown',e=>{
  if(st.tab!=='rev'||['INPUT','TEXTAREA','SELECT'].includes(e.target.tagName)||e.ctrlKey||e.altKey||e.metaKey)return;
  if(e.key==='Enter'){e.preventDefault();confirmRow();}else if(e.key==='ArrowRight'||e.key==='ArrowDown'){e.preventDefault();go(1);}
  else if(e.key==='ArrowLeft'||e.key==='ArrowUp'){e.preventDefault();go(-1);}
  else if(e.key==='h'||e.key==='H'){const r=cur();if(r&&canEdit(r)&&needsCheck(r)){e.preventDefault();act(r,{'保留':!r.hold,'確認済み':false});}}});
boot().catch(e=>{console.error(e);snack('起動エラー: '+e.message,true);});
</script>

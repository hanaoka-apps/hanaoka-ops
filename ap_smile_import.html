<style>
/* 見た目は支払決済アプリ（settle-proto）にそろえる */
:root{--pri:#1a5fa8;--pri-l:#e3edf9;--bg:#f4f6f9;--card:#fff;--line:#dde2ec;--txt:#1e2533;--sub:#6b7a99;--up:#c0392b;--up-l:#fbe7e5;--down:#1e8449;--down-l:#e3f4e8;--warn:#a0520c;--warn-l:#fdf0e1;--flag:#7a3db8;--flag-l:#f1e8fb}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--txt);font:14px/1.5 "Yu Gothic UI","Meiryo",system-ui,sans-serif}
header{background:#fff;border-bottom:1px solid var(--line);padding:10px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;position:sticky;top:0;z-index:5}

button{border:1px solid var(--line);background:#fff;border-radius:6px;padding:5px 12px;cursor:pointer}button.pri{background:var(--pri);border-color:var(--pri);color:#fff}
button:disabled{opacity:.45;cursor:not-allowed}
.grp{display:flex;gap:4px;flex-wrap:wrap}.grp button.on{background:var(--pri);border-color:var(--pri);color:#fff}

#app-view{display:none}
main{padding:16px 20px;display:grid;gap:14px;grid-template-columns:minmax(0,1fr)}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px;min-width:0;overflow-x:auto}
.card h2{font-size:14px;margin:0 0 10px;color:var(--sub);font-weight:600}
.top{display:grid;gap:14px;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr) minmax(0,1.6fr)}
.big{font-size:32px;font-weight:700;letter-spacing:.5px}.big small{font-size:15px;font-weight:500;color:var(--sub)}
.cmp{margin-top:6px;display:grid;grid-template-columns:auto auto 1fr;gap:2px 12px;font-size:13px;color:var(--sub)}

table{border-collapse:collapse;width:100%}th,td{padding:5px 8px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}

.t-flag{background:var(--flag-l);color:var(--flag)}.t-new{background:var(--warn-l);color:var(--warn)}.t-up{background:var(--up-l);color:var(--up)}.t-ok{background:var(--down-l);color:var(--down)}.t-pri{background:var(--pri-l);color:var(--pri)}
.tabs{display:flex;gap:4px;border-bottom:2px solid var(--line)}.tabs button{border:1px solid var(--line);border-bottom:none;border-radius:8px 8px 0 0;background:var(--bg);padding:7px 18px;margin-bottom:-2px;font-weight:600;color:var(--sub)}.tabs button.on{background:#fff;color:var(--pri);border-color:var(--pri);border-bottom:2px solid #fff}

.review{display:grid;grid-template-columns:230px minmax(0,1fr);gap:12px;height:calc(100vh - 215px);min-height:520px}

/* 詳細：左に請求書（大きく）、右に中身。請求書を見ながら項目を確かめる */
.dsplit{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(360px,1fr);gap:16px;align-items:start}
.dinfo .vs{gap:8px}.dinfo .vs>div{padding:7px 9px}.dinfo .vs .v{font-size:17px}.dpdf .pdf{height:calc(100vh - 330px);min-height:460px;margin-top:6px;padding:0}.dpdf .pdf iframe{height:100%}

.rlist td{white-space:normal;vertical-align:top;padding:7px 8px}.rlist td.st{width:26px;text-align:center;font-size:15px}.rlist .nm{font-weight:600}.rlist .sub{font-size:11.5px;color:var(--sub)}
tr.row{cursor:pointer}tr.row:hover{background:#f7f9fc}
.rlist tr.row.ok{background:#f6fbf7}.rlist tr.row.hold{background:#fffaf2}.rlist tr.row.sel{background:var(--pri-l);box-shadow:inset 3px 0 0 var(--pri)}
.detail{background:#fff;border:1px solid var(--line);border-radius:10px;display:flex;flex-direction:column;min-width:0;overflow:hidden}
.dnav,.dact{display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--line);background:#fafbfd}.dact{border-top:1px solid var(--line);border-bottom:none}
.dnav .pos{font-variant-numeric:tabular-nums;color:var(--sub)}.dnav .sp,.dact .sp{flex:1}.dact .keys{font-size:11.5px;color:var(--sub)}

.vs>div{border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:#fafbfd}.vs .l{font-size:12px;color:var(--sub)}.vs .v{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums}
.vs .s{font-size:11.5px;color:var(--sub);line-height:1.6}.vs .bad{border-color:#f0b7b0;background:var(--up-l)}.vs .good{border-color:#b7dfc4;background:var(--down-l)}
.sec{margin-top:12px}.sec>h4{font-size:12.5px;color:var(--sub);margin:0 0 6px;font-weight:600}
.box{border:1px solid var(--line);border-radius:8px;padding:8px 10px}.box.warn{background:var(--warn-l);border-color:#efd3ad}.box.alert{background:var(--up-l);border-color:#f0b7b0}
.sp-t td{padding:3px 6px}.sp-t input,.sp-t select{padding:3px 5px}
.drop{border:2px dashed var(--line);border-radius:8px;padding:10px;text-align:center;color:var(--sub);cursor:pointer;display:block;font-size:13px}.drop.over{border-color:var(--pri);background:var(--pri-l)}.drop input{display:none}
.pdf{min-height:420px;border:1px dashed var(--line);border-radius:8px;margin-top:8px;background:#fafbfd;display:flex;align-items:center;justify-content:center;color:var(--sub);text-align:center;padding:12px}
.pdf iframe{width:100%;height:560px;border:0}
@media (max-width:1200px){.dsplit{grid-template-columns:1fr}.dpdf .pdf{height:640px}}
/* 広い画面：左の請求書は動かさず枠いっぱい、右の項目だけスクロール */
@media (min-width:1201px){.dbody{overflow:hidden;padding:10px 0 10px 14px}.dsplit{height:100%;grid-template-rows:minmax(0,1fr);align-items:stretch}
  .dbody.mf{overflow-y:auto;padding-right:14px}.dinfo{overflow-y:auto;min-height:0;padding-right:12px}.dpdf{display:flex;flex-direction:column;min-height:0}.dpdf .pdf{flex:1;height:auto;min-height:0}}
.chips{display:flex;gap:6px;flex-wrap:wrap}.chip{font-size:12px;border:1px solid var(--line);background:#fff;border-radius:6px;padding:3px 8px;cursor:pointer}.chip.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.files{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:8px;margin-top:10px}
.file{border:1px solid var(--line);border-radius:8px;padding:7px 10px;background:#fafbfd}.file.ok{border-color:#b7dfc4;background:var(--down-l)}.file .k{font-size:11.5px;color:var(--sub)}
.checks{list-style:none;margin:0;padding:0}.checks li{padding:3px 0}.ck-ok{color:var(--down);font-weight:700}.ck-ng{color:var(--up);font-weight:700}.ck-info{color:var(--warn);font-weight:700}
.approve{position:sticky;bottom:0;background:#fff;border-top:1px solid var(--line);padding:10px 20px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.approve .prog{flex:1;color:var(--sub)}.approve .rest{color:var(--warn);font-size:13px}
.big-btn{font-size:15px;padding:8px 22px}
.progbar{height:6px;background:var(--pri-l);border-radius:3px;overflow:hidden;width:100%}.progbar i{display:block;height:100%;background:var(--pri);width:0}
details>summary{cursor:pointer;color:var(--sub);font-size:12.5px;font-weight:600}
#snackbar{position:fixed;bottom:70px;left:50%;transform:translateX(-50%);background:#323232;color:#fff;padding:10px 20px;border-radius:6px;font-size:13px;display:none;z-index:99;white-space:pre-wrap}
@media (max-width:1100px){.top{grid-template-columns:1fr}}
@media (max-width:900px){.review{grid-template-columns:1fr;height:auto}.rlist{max-height:40vh}.vs{grid-template-columns:1fr}.dact .keys{display:none}}
@media (max-width:600px){main{padding:10px}.big{font-size:26px}}

<div id="login-view"><h2 style="color:#1a5fa8">仕入（SMILE）</h2><p data-ha-login style="color:#6b7a99">花岡車輌の Microsoft アカウントでサインインしてください</p><button data-ha-login class="pri big-btn" onclick="signIn()">サインイン</button></div>

<script>
'use strict';
/* 仕入（SMILE）：SMILE の入力（発注・受入の積み重ね）＝先方の請求額 を仕入先ごとに確かめ、分け方を決めて OK する画面
   ・取り込み：SMILE の4ファイル（支払一覧表・月次支払明細表（9055）・月次受入リスト（9521）・仕入先マスタ）→ 照合 → AP_SmilePay（決済月×仕入先）に保存
   ・請求書：総務が「この仕入先に、この請求書」と置く → AP_Invoice（支払区分＝本社仕入/工場仕入）＋ incoming に PDF と task.json → AI が読み取る
   ・確認：SMILE の額｜請求書｜差。差は 端数→調整／相殺／SMILE を直して取り込み直し。分け方 → ✔ OK
   ・取り込み直しても、アプリでの作業（分け方・理由・確認・保留・コメント）は残す。金額が変わった仕入先は確認を外す
   決め事は 08_支払決裁.md（ワークフロー作成）。計算は ap_smile.js。決まりは AP_Setting の smile.rules。画面に業務データを書かない */
/* 全アプリ共通。HUBのサインインをそのまま使う（→ hanaoka_auth.js） */
const MSAL_CONFIG = HanaokaAuth.msalConfig();
const SCOPES=['User.Read','Sites.ReadWrite.All','Files.ReadWrite.All'];
const GRAPH='https://graph.microsoft.com/v1.0';
const AP_SITE='hanaokacorp.sharepoint.com,d80378dd-76a4-43f0-b939-1af66345d19d,8eaeb70b-2495-4029-affb-eabe80e021bb';
const S=window.APSmile, MOCK=window.AP_MOCK||null;   // MOCK は dev だけ（本番の HTML には無い）
const $=id=>document.getElementById(id);
let msalApp=null,acct=null;
const L={imp:{name:'AP_SmileImport'},pay:{name:'AP_SmilePay'},adj:{name:'AP_CarryAdjust'},inv:{name:'AP_Invoice'},vb:{name:'AP_VendorBank'}};
Object.values(L).forEach(o=>{o.id=null;o.fmap={};});
const FILES={payList:null,p9055:null,receipts:null,master:null};
const KIND_LABEL={payList:'支払一覧表',p9055:'月次支払明細表（9055）',receipts:'月次受入リスト（9521）',master:'仕入先マスタ'};
const GROUPS=['全社','工場','国内営業','ソリューション'];   // 仕入に総務の分は無い（倉庫と部門名称で分ける：smile.rules の deptByReceipt）
const METHODS=['振込','でんさい','相殺','調整','現金','海外送金','口座振替'];   // 調整＝端数の精算（お金は動かない。SMILE 支払伝票の取引区分6）
const V3={ai:'AIStatus',com:'AIComment',by:'RegisteredBy',at:'RegisteredAt',loc:'SiteLocation'};   // AP_Invoice の受付・AI の列（経費の画面と同じ）
let DOCN={};   // 請求書のファイル → そのファイルから作られた請求書の数（何社分もまとめたスキャンを見つける）
let calc=null,saved={},prevSaved={},adjs=[],settleSel={},lastImport=null,OFFSET={},INV={},SMR={},INBX=[],REGNO={},VBK=null,PINV={};   // INBX：仕入先がまだ決まっていない請求書（受信トレイ）、REGNO：登録番号→仕入先、VBK：振込先マスタ   // SMR：smile.rules（RPA の設定 rpa など）
const SM_DRIVE='b!JT-BVyiLrECv-h59BtVoApKOQutjbKlGoUT2oig6LyO5ej8pUQ4QQIYH904CzeZ8';   // SharedMasters（RPA 専用機が SMILE のファイルを出す場所）
let rows=[],draft=null,pdfSel={},pdfCache={};
let listClosed=(()=>{try{return localStorage.getItem('ap.review.list')==='closed';}catch{return false;}})();   // 確認モードの一覧をたたむ（ページ送りが中心）
const st={tab:'imp',g:'全社',round:'',q:'',only:'',sort:'code',sel:null,cmOpen:false};

// ---------- 認証・Graph ----------
async function boot(){
  if(MOCK){acct=MOCK.account;await showApp();return;}
  msalApp=new msal.PublicClientApplication(MSAL_CONFIG);await msalApp.initialize();await msalApp.handleRedirectPromise();
  acct = await HanaokaAuth.restore(msalApp, SCOPES);
  if (acct) { await showApp(); }}
async function signIn(){try{acct = await HanaokaAuth.login(msalApp, SCOPES);await showApp();}catch(e){if(e.errorCode!=='user_cancelled')snack('サインインエラー: '+e.message,true);}}
async function token(){try{const r=await msalApp.acquireTokenSilent({scopes:SCOPES,account:acct});return r.accessToken;}catch{const r=await msalApp.acquireTokenPopup({scopes:SCOPES});acct=r.account;return r.accessToken;}}
async function call(method,p,body,ctype,raw){
  if(MOCK)return MOCK.call(method,p,body,raw);
  const t=await token();const h={Authorization:'Bearer '+t,Prefer:'HonorNonIndexedQueriesWarningMayFailRandomly'};
  if(body!=null&&!ctype)h['Content-Type']='application/json';if(ctype)h['Content-Type']=ctype;
  const r=await fetch(p.startsWith('http')?p:GRAPH+p,{method,headers:h,body:body==null?null:(ctype?body:JSON.stringify(body))});
  if(!r.ok)throw new Error('['+r.status+'] '+(await r.text()).slice(0,300));
  if(raw)return r.blob();const x=await r.text();return x?JSON.parse(x):{};}
const gget=p=>call('GET',p),gpost=(p,b)=>call('POST',p,b),gpatch=(p,b)=>call('PATCH',p,b);
const gputFile=(path,blob,type)=>call('PUT',`/sites/${AP_SITE}/drive/root:${encodeURI(path)}:/content`,blob,type||blob.type||'application/octet-stream');
async function fetchAll(o,filter){let all=[],n=`/sites/${AP_SITE}/lists/${o.id}/items?$expand=fields&$top=500`+(filter?'&$filter='+encodeURIComponent(filter):'');
  while(n){const d=await gget(n);all=all.concat(d.value||[]);n=d['@odata.nextLink']?d['@odata.nextLink'].replace(GRAPH,''):null;}return all;}
async function resolveLists(){
  const ls=await gget(`/sites/${AP_SITE}/lists?$select=id,displayName`);
  // 列の名前・決まり・相殺先は互いに関係しないので、同時に読む（順に待つと開くのが遅い）
  const ovP=gget(`/sites/${AP_SITE}/lists/AP_OffsetVendor/items?$expand=fields&$top=200`);ovP.catch(()=>{});
  const [,d]=await Promise.all([Promise.all(Object.values(L).map(async o=>{const l=ls.value.find(x=>x.displayName===o.name);if(!l)throw new Error(o.name+' がありません（Provision-SmileAP.ps1 で作ってください）');o.id=l.id;
    const c=await gget(`/sites/${AP_SITE}/lists/${o.id}/columns?$select=name,displayName`);c.value.forEach(x=>o.fmap[x.displayName]=x.name);})),
    gget(`/sites/${AP_SITE}/lists/AP_Setting/items?$expand=fields&$top=100`)]);
  // 決まり（部門の振り分け・手数料・サイトと期日・支払率の判定額）は AP_Setting の smile.rules（画面に書かない）
  const it=(d.value||[]).find(x=>x.fields&&x.fields.Title==='smile.rules');
  if(!it)throw new Error('AP_Setting に smile.rules がありません（Provision-SmileAP.ps1 -Apply で入れてください）');
  SMR=JSON.parse(it.fields.Value||'{}');S.setRules(SMR);
  // 相殺先（設計書 v2.5 3-7）：計算どおりに出したうえで、相殺の有無を確かめないと OK できない
  OFFSET={};try{const ov=await ovP;
    (ov.value||[]).forEach(x=>{const f=x.fields||{};if(f.OffsetFlag!==false&&f.VendorCode)OFFSET[String(f.VendorCode).trim().padStart(6,'0')]={name:f.VendorName||'',cust:String(f.OffsetCustomerCode||'').split(/[,\s、]+/).filter(Boolean)};});}
  catch(e){snack('相殺先リスト（AP_OffsetVendor）を読めませんでした：'+e.message,true);}}
const F=(o,d)=>o.fmap[d]||d, fv=(o,f,d)=>f[F(o,d)];
function toFields(o,obj){const r={};for(const k in obj)r[F(o,k)]=obj[k];return r;}
function me(){return acct.name||acct.username;}

// ---------- 小物 ----------
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const yen=n=>n==null||n===''?'':Math.round(+n).toLocaleString('ja-JP');
const man=n=>Math.round((+n||0)/10000).toLocaleString('ja-JP')+'万';
function diffHtml(cur,prev){if(!prev)return '<span style="color:#c3c9d6">—</span>';const d=cur-prev,p=Math.round(d/prev*100);
  return `<span class="${d>0?'d-up':d<0?'d-down':''}">${d>0?'▲':d<0?'▼':'±'}${man(Math.abs(d))}（${p>0?'+':''}${p}%）</span>`;}
function parseJ(s,d){try{return s?JSON.parse(s):d;}catch{return d;}}
function fmtTime(iso){if(!iso)return '';const d=new Date(iso);if(isNaN(d))return String(iso);const p=n=>String(n).padStart(2,'0');return `${d.getFullYear()}/${p(d.getMonth()+1)}/${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;}
function fmtD(s){s=String(s||'');return s.length===8?s.slice(0,4)+'/'+s.slice(4,6)+'/'+s.slice(6):s;}
function snack(m,e=false){const el=$('snackbar');el.textContent=m;el.style.background=e?'#c0392b':'#323232';el.style.display='block';clearTimeout(snack.t);snack.t=setTimeout(()=>el.style.display='none',e?7000:3500);}
function msg(t){$('status').textContent=t;const m=$('main');   // 最初の表示の前（AI の読み取り結果の取り込みなど）は、真ん中に進み具合を出す
  if(m&&!m.dataset.ready)m.innerHTML=t?`<div class="card" style="text-align:center;padding:48px 16px;color:var(--sub)"><span class="spin"></span> <b>${esc(t)}</b><div style="font-size:12px;margin-top:8px">AI の読み取り結果がたまっているときは、1件数秒ずつ取り込みます。終わると画面が出ます</div></div>`:'';}

// ---------- 決済月 ----------

async function readRows(file){
  if(/\.xlsx?$/i.test(file.name)){const wb=XLSX.read(await file.arrayBuffer(),{type:'array'});
    return XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,raw:true,defval:''}).map(r=>r.map(c=>c==null?'':String(c)));}
  const buf=await file.arrayBuffer();let text=new TextDecoder('utf-8').decode(buf);
  if(text.indexOf('�')>=0)text=new TextDecoder('shift_jis').decode(buf);   // SMILE の設定によっては Shift_JIS
  // SMILE の画面出力のコピー（RPA の 支払一覧表.csv）はタブ区切り・クォートなし。数値にカンマが入るのでカンマでは割らない

  const head=text.slice(0,2000);
  if(head.includes('\t')&&!/^﻿?"/m.test(head))return text.replace(/^﻿/,'').split(/\r?\n/).filter(l=>l.trim()).map(l=>l.split('\t'));
  return S.parseCSV(text);}

  for(let i=0;i<head.length;i++)if(has(i,'コード','仕入先名','今回支払残高'))return 'payList';
  if(!head[0])return null;
  if(has(0,'でんさい利用者番号'))return 'master';
  if(has(0,'前回支払残高','支払明細ｼﾞｬﾝｺｰﾄﾞ'))return 'p9055';

      bal9055:g('9055前回残高'),rcvIncl:g('受入税込'),byDept:dd.byDept||{},byGroup:dd.byGroup||{},mainDept:g('決裁の部門')||'国内営業',

      // 締め前にチェックした受入（保存した 受入税込）と比べる。締め後は 支払一覧表の税込仕入額＝受入 も見る（締めを解いて直し、締め直したときも）
      const svR=sv?pf(r,'受入税込'):null,rcvSame=svR==null||svR===''||Math.round(+svR)===Math.round(+r.rcvIncl||0),wasPre=!!sv&&pf(r,'分け方の決まり')===PRE_RULE;
      r.status=!sv?'新規':wasPre?(calc.pre?(rcvSame?'変化なし':'金額が変わった'):(rcvSame&&Math.round(+r.smile.incl||0)===Math.round(+r.rcvIncl||0)?'締めて一致':'受入が変わった'))

function linesOf(r){return r.override&&r.override.length?S.splitLines(r,r.override,dash(month())):r.calcLines;}

const rpaBusy=()=>!!(RPA&&['依頼','順番待ち','出力中','同期待ち','読み込み中'].includes(RPA.phase));

  const b=$('bRpa'),b2=$('bRpaPre'),n=$('bNow'),box=$('rpaBox'),bz=rpaBusy(),pre=RPA&&RPA.mode==='pre';

  const ng=RPA.phase==='失敗';return `<div class="upl ${ng?'ng':'ok'}"><span>${ng?'⚠':'✓'}</span><div style="flex:1">${esc(RPA.text||RPA.phase)}</div><button class="lk" id="rpX" onclick="RPA=null;try{localStorage.removeItem('${RPA_KEY}')}catch(e){};this.closest('.upl').remove()">閉じる</button></div>`;}
async function rpaStart(mode){
  const cfg=SMR.rpa||{},pre=mode==='pre',job=pre?(cfg.jobPre||'ap_purchase_pre'):cfg.job;if(!cfg.job){snack('smile.rules に rpa（RPA の設定）がありません（Provision-SmileAP.ps1 -Apply -ResetRules）',true);return;}

  // SMILE の条件パターンで、いつも前月締め（今日から見て）で出る。読み込むと決済月はその翌月に切り替わる
  const now=new Date(),cl=new Date(now.getFullYear(),now.getMonth(),0);
  const lbl=`前月締め（${cl.getMonth()+1}月${cl.getDate()}日締め＝${now.getFullYear()}/${String(now.getMonth()+1).padStart(2,'0')} 払い）`;
  if(!confirm(pre?`締め前：SMILE から${lbl}の月次受入リスト・月次支払明細表・仕入先マスタを出し直して取り込みます（数分かかります）。支払一覧表は締めた後に取り込みます。よろしいですか？`
    :`締め後：SMILE から${lbl}の4点（支払一覧表・月次支払明細表・月次受入リスト・仕入先マスタ）を出し直して取り込みます（数分かかります）。SMILE の締めは済んでいますか？`))return;
  rpaSet({phase:'依頼',text:'RPA 専用機に頼んでいます…',at:new Date().toISOString(),ym:month(),name:'',mode:pre?'pre':'post'});
  try{RQ().init({getToken:token,driveId:SM_DRIVE});
    const r=await RQ().request(job,{app:'支払管理 仕入（SMILE）',requestedBy:(acct&&acct.username)||'',params:{payYm:month()}});
    rpaSet({name:r.name,phase:'順番待ち',text:r.deduped?'すでに同じ依頼が順番待ちです。いっしょに待ちます':'RPA 専用機の受付待ち'});rpaWatch();}
  catch(e){rpaSet({phase:'失敗',text:'頼めませんでした（SharedMasters に書く権限が要ります）：'+e.message});}}
function rpaWatch(){if(!RPA||!RPA.name||rpaStop)return;const cfg=SMR.rpa||{},since=Date.parse(RPA.at);
  RQ().init({getToken:token,driveId:SM_DRIVE});
  rpaStop=RQ().watch(RPA.name,s=>{
    const ww=RQ().workerWarning?RQ().workerWarning(s):'';   // RPA 専用機が止まっていそうなら知らせる（依頼は残る）
    if(s.state==='pending')rpaSet({phase:'順番待ち',text:(s.ahead?`順番待ち（前に ${s.ahead} 件）`:'RPA 専用機の受付待ち')+(ww?'　'+ww:'')});
    else if(s.state==='running'||s.state==='unknown')rpaSet({phase:'出力中',text:'SMILE からファイルを出力しています…'+(ww?'　'+ww:'')});
    else if(s.state==='done'){rpaStop=null;rpaWaitFiles(since);}
    else if(s.state==='failed'){rpaStop=null;rpaSet({phase:'失敗',text:'RPA 専用機で失敗しました：'+(s.error||'')});}
    else{rpaStop=null;rpaSet({phase:'失敗',text:'時間内に終わりませんでした（RPA 専用機を確かめてください）'});}
  },{intervalMs:MOCK?1000:15000,timeoutMs:Math.max(60000,(cfg.timeoutMinutes||40)*60000-(Date.now()-since))});}
// 出力が終わったら、4ファイルの更新が SharedMasters に届くのを待ってから読む（同期の遅れ）
async function smMeta(name){try{return await call('GET',`/drives/${SM_DRIVE}/root:/${encodeURIComponent(name)}?$select=lastModifiedDateTime,size`);}catch(e){return null;}}
async function rpaWaitFiles(since){rpaSet({phase:'同期待ち',text:'出力できました。ファイルが届くのを待っています…'});
  const names=Object.entries((SMR.rpa||{}).files||{}).filter(([k])=>!(RPA&&RPA.mode==='pre'&&k==='payList')).map(([,n])=>n),end=Date.now()+10*60000;
  while(Date.now()<end){const ms=await Promise.all(names.map(smMeta));
    if(ms.every(m=>m&&Date.parse(m.lastModifiedDateTime)>since)){await smLoad(since);return;}
    await new Promise(r=>setTimeout(r,MOCK?500:15000));}
  rpaSet({phase:'失敗',text:'出力は終わりましたが、ファイルが新しくなりません（少し待って「今あるファイルで取り込む」）'});}
// SharedMasters の4ファイルを読んで、手で置いたときと同じ処理（onFiles）に渡す。照合がすべて合えば保存の確認まで進める
async function smLoad(since){const cfg=SMR.rpa||{};const files=cfg.files||{};if(!Object.keys(files).length){snack('smile.rules に rpa.files がありません',true);return;}
  rpaSet({phase:'読み込み中',text:'ファイルを読み込んでいます…',at:(RPA&&RPA.at)||new Date().toISOString()});
  const list=[],miss=[],old=[],pre=!!(since&&RPA&&RPA.mode==='pre');Object.keys(FILES).forEach(k=>FILES[k]=null);   // 締め前の RPA は支払一覧表を読まない（今あるファイルで取り込むときは、受入と締めがそろわない支払一覧表を onFiles で外す）
  for(const [k,n] of Object.entries(files)){if(pre&&k==='payList')continue;const m=await smMeta(n);if(!m){miss.push(n);continue;}
    if(!since&&Date.now()-Date.parse(m.lastModifiedDateTime)>3*86400000)old.push(`${n}（${fmtTime(m.lastModifiedDateTime)}）`);
    try{const b=await call('GET',`/drives/${SM_DRIVE}/root:/${encodeURIComponent(n)}:/content`,null,null,true);list.push(new File([b],n,{lastModified:Date.parse(m.lastModifiedDateTime)}));}catch(e){miss.push(n);}}
  if(miss.length){rpaSet({phase:'失敗',text:'SharedMasters にないファイルがあります：'+miss.join('・')});return;}
  await onFiles(list);
  const ng=calc?(checkList()||[]).filter(c=>c.ok===false):[];
  loadSmTimes(true);
  rpaSet({phase:'完了',text:`読み込みました（${list.length}ファイル）。`+(old.length?`古いファイルがあります：${old.join('・')}。`:'')+(ng.length?`照合で合わないものが ${ng.length} 件あります。下で確かめてから保存してください`:'照合はすべて合っています。保存の確認に進みます')});
  if(calc&&allFiles()&&!ng.length&&!old.length)setTimeout(saveImport,300);}
// 前に頼んだもの（画面を閉じた）を続きから見る
function rpaResume(){if(rpaBusy()&&RPA.name&&!rpaStop&&RQ()){if(['同期待ち','読み込み中'].includes(RPA.phase))rpaWaitFiles(Date.parse(RPA.at));else rpaWatch();}}

function smileBook(){
  const ym=month(),[y,m]=ym.split('/').map(Number),pd=new Date(y,m-2,1),pl=`${pd.getFullYear()}年${pd.getMonth()+1}月分(${m}/末日支払)`;

  const SUM={本社:{},工場:{}},add=(sd,k,v)=>{SUM[sd][k]=(SUM[sd][k]||0)+(+v||0);};
  const build=(side,title)=>{const mine=g=>side==='工場'?g==='工場':g!=='工場';let no=0;
    const aoa=[[title],[`作成：${new Date().toLocaleDateString('ja-JP')}（支払アプリから）`],[],head];
    vs.filter(r=>Object.entries(r.byGroup||{}).some(([g,v])=>mine(g)&&v)).forEach(r=>{no++;
      const ls=linesOf(r),fee=feeOf(r),sum=mt=>ls.filter(l=>l.method===mt).reduce((s,l)=>s+(+l.amount||0),0),bank=sum('振込')-fee,den=sum('でんさい'),adj=sum('調整'),off=sum('相殺');
      const ratio=r.smile&&r.smile.incl?(r.smile.excl||0)/r.smile.incl:1/1.1,own=mine(r.mainDept||'国内営業');
      const due=[...new Set(ls.filter(l=>l.method==='でんさい'&&l.due).map(l=>l.due))].join(' '),site=(ls.find(l=>l.method==='でんさい'&&l.site)||{}).site||'';
      const mth=[bank?'振':'',den?'で':'',sum('現金')?'現金':'',sum('海外送金')?'海外':'',sum('口座振替')?'口振':''].filter(Boolean).join('/');
      const parts=Object.entries(r.byGroup||{}).filter(([g,v])=>v).sort((a,b)=>(mine(b[0])-mine(a[0]))||(GROUPS.indexOf(a[0])-GROUPS.indexOf(b[0])));
      if(own){add(side,'支払高',r.amount);add(side,'振込',bank);add(side,'でんさい',den);add(side,'相殺',off);add(side,'調整',adj);add(side,'手数料',fee);add(side,'社',1);}
      parts.forEach(([g,v],i)=>{const last=i===parts.length-1,cross=!mine(g)||!own,ex=Math.round(v*ratio);
        aoa.push([no,r.invoices.length?'有':null,`${r.name}${parts.length>1?'/'+g+'分':''}`,+r.code||r.code,g,i===0&&r.smile?r.smile.balance:null,cross?null:ex,null,last&&adj&&own?adj:null,cross?null:ex,cross?null:v-ex,
          last&&own&&off?off:null,last&&own&&fee?fee:null,cross?(side==='工場'?'本社計上':'工場計上'):v,last?r.rule||'':null,last&&site?site:null,last?mth:null,
          last&&own?bank:null,last&&own?den:null,last&&due?due:null,last?(r.checked?'✔ '+String(r.checkedBy||'').split(/[\s　]/)[0]:r.hold?'保留':''):null,
          last?[r.comment&&'総務：'+r.comment,r.reason&&'分け方：'+r.reason,!r.invoices.length&&(r.noInvReason||'請求書なし'),r.invDiff?`請求書との差 ${r.invDiff}`:''].filter(Boolean).join(' ／ '):null]);});});
    const S0=SUM[side];aoa.push([],[null,null,'合計（決裁の部門がこの表の仕入先）',null,null,null,null,null,S0.調整||null,null,null,S0.相殺||null,S0.手数料||null,S0.支払高||0,null,null,null,S0.振込||0,S0.でんさい||0]);
    return aoa;};
  const t1=`<買掛>${pl} 本社支払明細表`,t2=`${pd.getFullYear()}.${pd.getMonth()+1}月度(${m}/末日)分 工場支払明細表`;
  const sheets=[{name:'支払明細(買掛)',title:t1,aoa:build('本社',t1)},{name:'支払明細シート(工場)',title:t2,aoa:build('工場',t2)}];
  const ma=[[`${pl} 仕入 支払明細表まとめ`],[`作成：${new Date().toLocaleDateString('ja-JP')}（支払アプリから）`],[],[null,'本社(買掛)','工場','合計'],

    ['確認OK',vs.filter(r=>r.checked).length+'社'],['保留',vs.filter(r=>r.hold).length+'社'],['請求書なし',vs.filter(r=>!r.invoices.length).length+'社'],[],
    ['でんさいの期日別'],...Object.entries(vs.reduce((o,r)=>{linesOf(r).filter(l=>l.method==='でんさい').forEach(l=>{const d=l.due||'（期日なし）';o[d]=(o[d]||0)+(+l.amount||0);});return o;},{})).sort().map(([d,v])=>[d,v])];

function judge(r){

async function splitPanel(x,path,closeDlg){const box=$('docSpBox');if(!box)return;

  catch(e){box.innerHTML='PDF を開けませんでした：'+esc(e.message);return;}
  const key=String(path).trim(),same=allInv().filter(o=>String(o.x.doc||'').split('\n')[0].trim()===key),lock=same.filter(o=>o.code&&(rows.find(r=>r.code===o.code)||{}).checked);

      渡さないページ（別会社あてなど）は範囲に入れなければ渡しません</div>${lock.length?`<div style="margin-top:6px;color:var(--up)">🔒 ${lock.map(o=>esc(o.name)).join('・')} の仕入先は確認OK 済みです。先に確認の画面で「確認を外す」をしてください</div>`:''}`;
  $('spX').onclick=()=>{box.hidden=true;box.innerHTML='';};
  $('spGo').onclick=async()=>{if(lock.length){snack('確認OK 済みの仕入先の請求書があります。先に確認を外してください',true);return;}

function matchOne(x,C){
  const has=c=>!!C[c],bank=[],reg=[],nm=[],near=[],why={};
  if(x.bank.no&&x.bank.code){const no=x.bank.no.replace(/\D/g,'').padStart(7,'0'),bc=x.bank.code.padStart(4,'0');(VBK||[]).filter(v=>v.no===no&&v.bank===bc&&has(v.code)).forEach(v=>{if(!bank.includes(v.code))bank.push(v.code);});}
  if(x.regNo){const c=REGNO[x.regNo]||((VBK||[]).find(v=>v.regNo===x.regNo)||{}).code;if(c&&has(c))reg.push(c);}
  const n0=nName(x.payee);if(n0)Object.values(C).forEach(v=>{const n1=nName(v.name);if(!n1)return;if(n1===n0)nm.push(v.code);else if(n0.includes(n1)||n1.includes(n0))near.push(v.code);});
  const ai=((x.com.match(/AI の候補：(\d{6})/)||[])[1])||'',aiIn=ai&&has(ai)?ai:'';
  bank.forEach(c=>why[c]=(why[c]||[]).concat('振込先口座が一致'));reg.forEach(c=>why[c]=(why[c]||[]).concat('登録番号が一致'));nm.forEach(c=>why[c]=(why[c]||[]).concat('名前が一致'));
  near.forEach(c=>why[c]=(why[c]||[]).concat('名前が似ている'));if(aiIn)why[aiIn]=(why[aiIn]||[]).concat('AI の候補');
  Object.keys(why).forEach(c=>{if(x.amount&&Math.abs(C[c].balance-x.amount)<=Math.max(10,x.amount*0.01))why[c].push('金額が今回支払残高とほぼ同じ');});
  const strong=[...new Set([...bank,...reg,...nm])];
  if(strong.length===1&&(!aiIn||aiIn===strong[0]))return {code:strong[0],reason:why[strong[0]].join('・')};
  if(!strong.length&&aiIn&&(near.includes(aiIn)||why[aiIn].some(w=>/金額/.test(w))))return {code:aiIn,reason:why[aiIn].join('・')};
  const cands=Object.keys(why).sort((a,b)=>why[b].length-why[a].length);
  return {cands,why,inList:cands.length>0};}

// ---------- 二重の確認（2026-11-09）：同じ相手（仕入先・登録番号・支払先名のどれか）で同じ金額（請求No が両方あれば同じ）の請求書。「仕入先が決まらない」と「付けた」をまたいで見る ----------
//   「⇔ 並べて見る」で2枚を横に並べ、違う所に色を付ける。同じならその場で片方を取り消す。別のものなら「二重ではない」を確認の記録（CheckLog）に残し、印を出さない
const pkey=s=>String(s||'').normalize('NFKC').replace(/株式会社|有限会社|合同会社|\(株\)|\(有\)|㈱|㈲|[\s　・.,、。]/g,'');
function allInv(){return [...INBX.map(x=>({x,code:'',name:x.payee||x.title})),...Object.entries(INV).flatMap(([c,xs])=>xs.map(x=>({x,code:c,name:x.name})))];}

  const s=e.target.closest('[data-sel]');if(s){st.sel=s.dataset.sel;draft=null;if(st.tab!=='rev'){st.tab='rev';st.only='';render();}else{drawRows();drawDetail();}}});
document.addEventListener('change',async e=>{
  const id=e.target.id;
  if(id==='month'){calc=null;st.sel=null;draft=null;await loadSaved();render();}
  else if(id==='fo'){st.only=e.target.value;drawRows();drawDetail();}else if(id==='fs'){st.sort=e.target.value;drawRows();drawDetail();}
  else if(e.target.dataset&&e.target.dataset.settle){settleSel[e.target.dataset.settle]=e.target.checked;recalc();render();}});
document.addEventListener('input',e=>{if(e.target.id==='q'){st.q=e.target.value.trim();drawRows();drawDetail();}});
document.addEventListener('keydown',e=>{
  if(st.tab!=='rev'||['INPUT','TEXTAREA','SELECT'].includes(e.target.tagName)||e.ctrlKey||e.altKey||e.metaKey)return;
  if(e.key==='Enter'){e.preventDefault();confirmRow();}else if(e.key==='ArrowRight'||e.key==='ArrowDown'){e.preventDefault();go(1);}
  else if(e.key==='ArrowLeft'||e.key==='ArrowUp'){e.preventDefault();go(-1);}
  else if(e.key==='h'||e.key==='H'){const r=cur();if(r&&canEdit(r)&&needsCheck(r)){e.preventDefault();act(r,{'保留':!r.hold,'確認済み':false});}}});
boot().catch(e=>{console.error(e);snack('起動エラー: '+e.message,true);});
</script>
</body>
</html>

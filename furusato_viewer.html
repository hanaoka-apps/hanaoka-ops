<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ふるさと納税の状況</title>
<link rel="icon" type="image/svg+xml" href="favicon_ec.svg">
<link rel="stylesheet" href="hanaoka_theme.css?v=20261004"><!-- 色・フォントは共通ファイル -->
<script src="https://cdn.jsdelivr.net/npm/@azure/msal-browser@3.10.0/lib/msal-browser.min.js" crossorigin="anonymous"></script>
<script src="hanaoka_auth.js"></script>
<script src="usage_log.js?v=20261106"></script><!-- 使われ方の記録（管理者だけが見られる） -->
<script src="ec_sales_core.js?v=32"></script>
<script src="furusato_sales_core.js?v=2"></script>
<script src="furusato_sales_profile.js?v=1"></script><!-- 注文CSVの読み方（ふるさと納税アプリと同じ） -->
<script src="ec_sales_shared.js?v=3"></script><!-- 報告済みの印（共有の履歴）を読む（読めなければ、完了の判定なし） -->
<script src="ship_core.js?v=13"></script>
<script src="ec_viewer_core.js?v=3"></script>
<script src="furusato_viewer_profile.js?v=1"></script><!-- この画面の言葉・注文の読み方・完了の判定 -->
<link rel="stylesheet" href="ec_viewer.css?v=3">
<link rel="stylesheet" href="ec_appnav.css?v=1">
</head>
<body>

<div id="loginScreen">
  <div class="login-card">
    <div class="logo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.2-4.2"/><path d="M8.5 11h5"/></svg></div>
    <h1>ふるさと納税の状況</h1>
    <p>花岡車輌 業務アプリ</p>
    <button id="loginBtn" data-ha-login>Microsoft アカウントでサインイン</button>
    <div id="loginError"></div>
    <div class="login-foot">ふるさと納税（サイネックス）の注文が、いまどこまで進んだかを探します<br>問い合わせの確認用です（見るだけの画面です）</div>
  </div>
</div>

<header class="app-hdr">
  <a class="hub-home" href="hanaoka_hub.html" title="HANAOKA HUBへ"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>HUB</a>
  <h1><span class="dot"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.2-4.2"/></svg></span>ふるさと納税の状況</h1>
  <div class="grow"></div>
  <div class="userchip"><span class="avatar" id="sp-avatar"></span><span id="sp-user"></span></div>
  <button class="hbtn" id="btn-reload" title="SharePoint のデータを読み直す">↻ 更新</button>
</header>
<div id="statusBar"><span id="sp-status">未サインイン</span></div>
<nav class="appnav" aria-label="EC・ふるさと納税">
  <span class="an-title">EC・ふるさと納税</span>
  <a href="ec_viewer.html">EC受注の状況</a>
  <a href="furusato_viewer.html" class="on" aria-current="page">ふるさと納税の状況</a>
  <span class="an-sep"></span>
  <a href="ec_dashboard.html">売上の分析</a>
</nav>
<div id="warnBox" hidden></div>

<div class="wrap">
  <details class="panel help" id="helpBox">
    <summary><b>見方（注文の状況）</b></summary>
    <div id="helpBody"></div>
  </details>

  <div class="panel">
    <form id="searchForm" class="srow" autocomplete="off">
      <input type="search" id="f-q" placeholder="発注番号・お届け先の名前・電話・住所・送り状番号・受注№・寄附者番号・商品名など（空白で区切ると、すべてを含むものだけ）" aria-label="検索">
      <button class="btn" type="submit">検索</button>
      <button class="btn sec" type="button" id="btn-clear">クリア</button>
    </form>
    <div class="srow filters"><div class="row" id="stages" style="gap:6px"></div></div>
    <div class="srow filters">
      <div class="row" id="periods" style="gap:6px"></div>
      <label class="muted">受信日 <input type="date" id="f-from"> ～ <input type="date" id="f-to"></label>
      <label class="muted">運送会社 <select id="f-carrier"></select></label>
      <label class="muted">担当 <select id="f-tag"></select></label>
    </div>
  </div>

  <div id="summary" class="muted"></div>
  <div id="list"></div>
  <div id="moreBox" hidden><button class="btn sec" id="btn-more">さらに表示</button></div>
</div>

<script src="ec_viewer.js?v=4"></script>
</body>
</html>

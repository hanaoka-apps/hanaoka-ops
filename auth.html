<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>認証処理中… | 花岡車輌</title>
<script src="https://cdn.jsdelivr.net/npm/@azure/msal-browser@3.10.0/lib/msal-browser.min.js" crossorigin="anonymous"></script>
<style>body{font-family:"Segoe UI","Meiryo",sans-serif;background:#f4f6f9;color:#445;display:flex;align-items:center;justify-content:center;height:100vh;margin:0}</style>
</head>
<body>
<div>認証処理中… このウィンドウは自動的に閉じます。</div>
<script>
/*
 * 全AP系アプリ共通の MSAL リダイレクト受け口。
 * 各アプリの redirectUri をこのページ1枚に集約することで、
 * Azure AD に登録するリダイレクトURIは このURL 1つだけで済む
 * （新しいアプリを足しても Azure 側の作業は不要）。
 * ポップアップ認証では MSAL 呼び出し元(親ウィンドウ)が応答を回収するため、
 * このページは MSAL を初期化して handleRedirectPromise を呼ぶだけでよい。
 */
(async () => {
  try {
    const app = new msal.PublicClientApplication({
      auth: {
        clientId: 'd338d61b-01dc-4c7c-ac6b-aecf7f30d716',
        authority: 'https://login.microsoftonline.com/3933e8a0-c945-4e97-ae67-c82131087cad',
        redirectUri: window.location.href.split('#')[0].split('?')[0]
      },
      cache: { cacheLocation: 'sessionStorage' }
    });
    await app.initialize();
    await app.handleRedirectPromise();
  } catch (e) {
    document.body.innerHTML = '<div>認証エラー: ' + (e && e.message ? e.message : e) + '</div>';
  }
})();
</script>
</body>
</html>

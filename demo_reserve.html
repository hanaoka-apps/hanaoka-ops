<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>デモ機予約 週間表 | 花岡車輌</title>
  <script src="https://cdn.jsdelivr.net/npm/@azure/msal-browser@3.10.0/lib/msal-browser.min.js" crossorigin="anonymous"></script>
  <script src="nav.js" defer></script>
  <style>
    :root{
      --primary:#1a5fa8; --primary-dk:#134680; --accent:#e8412e;
      --success:#2e7d52; --warning:#c07a00; --danger:#c0392b;
      --bg:#f4f6f9; --card-bg:#fff; --border:#dde2ec; --text:#1e2533; --muted:#6b7a99;
      --shadow:0 1px 4px rgba(0,0,0,.08);
      --namew:230px; --dayw:128px; --lane:30px;
    }
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Meiryo','Hiragino Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}

    header{background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:space-between;
      padding:0 20px;height:52px;box-shadow:0 2px 8px rgba(0,0,0,.2);position:sticky;top:0;z-index:100}
    header .logo{font-size:16px;font-weight:700;letter-spacing:.04em}
    header .logo span{opacity:.7;font-weight:400;font-size:13px;margin-left:10px}
    header .user-info{display:flex;align-items:center;gap:12px;font-size:13px}
    header button{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.3);color:#fff;
      padding:5px 14px;border-radius:4px;cursor:pointer;font-size:12px}
    header button:hover{background:rgba(255,255,255,.25)}

    #login-view{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:calc(100vh - 52px);gap:20px}
    #login-view h2{font-size:20px;color:var(--primary)}
    #login-view p{color:var(--muted);font-size:14px}
    #login-btn{background:var(--primary);color:#fff;border:none;padding:12px 36px;border-radius:6px;
      font-size:15px;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:8px}
    #login-btn:hover{background:var(--primary-dk)}

    #app-view{display:none;padding:18px}

    .bar{display:flex;align-items:center;gap:9px;flex-wrap:wrap;background:var(--card-bg);padding:11px 14px;
      border-radius:8px;border:1px solid var(--border);box-shadow:var(--shadow);margin-bottom:13px}
    .bar label{font-size:12.5px;color:var(--muted);font-weight:600}
    select,input[type=search],input[type=datetime-local],input[type=text]{border:1px solid var(--border);border-radius:4px;
      padding:5px 9px;font-size:13px;background:#fff;font-family:inherit;max-width:100%}
    button.act{background:#fff;border:1px solid var(--border);border-radius:4px;padding:5px 12px;font-size:13px;
      cursor:pointer;font-family:inherit}
    button.act:hover:not(:disabled){background:#f0f2f5}
    button.pri{background:var(--primary);border-color:var(--primary);color:#fff}
    button.pri:hover:not(:disabled){background:var(--primary-dk)}
    button.act:disabled{opacity:.45;cursor:not-allowed}
    .range{font-weight:700;font-size:14px;min-width:184px;text-align:center}
    .chk{display:flex;align-items:center;gap:5px;color:var(--muted);cursor:pointer;user-select:none;
      white-space:nowrap;font-size:12.5px}
    .spacer{flex:1}
    .cnt{font-size:11.5px;color:var(--muted)}

    #status-panel{background:var(--card-bg);border:1px solid var(--border);border-radius:8px;padding:11px 14px;
      margin-bottom:13px;font-size:12.5px;box-shadow:var(--shadow)}
    #status-panel.warn{border-color:var(--warning);background:#fffdf3}
    #status-panel .st-row{display:flex;gap:8px;align-items:baseline;margin-top:4px}
    #status-panel .ok{color:var(--success);font-weight:700}
    #status-panel .ng{color:var(--danger);font-weight:700}
    #status-panel code{background:#eef0f3;padding:1px 4px;border-radius:3px;font-size:11.5px}

    .legend{display:flex;gap:10px;flex-wrap:wrap;font-size:11.5px;color:var(--muted);align-items:center;margin-bottom:9px}
    .legend i{display:inline-block;width:11px;height:11px;border-radius:2px;margin-right:3px;vertical-align:-1px;border:1px solid}

    .scroll{overflow:auto;max-height:calc(100vh - 172px);background:var(--card-bg);border:1px solid var(--border);
      border-radius:8px;box-shadow:var(--shadow)}
    .grid{min-width:calc(var(--namew) + var(--dayw)*7)}
    .hrow{display:flex;position:sticky;top:0;z-index:30;background:#f8f9fc;border-bottom:1px solid var(--border)}
    .hname{flex:0 0 var(--namew);position:sticky;left:0;z-index:31;background:#f8f9fc;border-right:1px solid var(--border);
      padding:7px 11px;font-weight:700;font-size:12px;color:var(--muted);display:flex;align-items:center}
    .hdays{flex:1;display:grid;grid-template-columns:repeat(7,minmax(var(--dayw),1fr))}
    .hd{padding:4px 6px;text-align:center;border-left:1px solid #eef1f6;line-height:1.3}
    .hd .dow{font-size:10.5px;color:var(--muted)}
    .hd .dnum{font-weight:700;font-size:14px}
    .hd.sat{background:#eef4fb}.hd.sat .dow{color:var(--primary)}
    .hd.sun{background:#fdeff0}.hd.sun .dow{color:var(--danger)}
    .hd.today{background:#fff6d9}.hd.today .dnum,.hd.today .dow{color:#8a5a00}

    .row{display:flex;border-bottom:1px solid #f0f3fa}
    .row:hover .name{background:#f8f9fc}
    .name{flex:0 0 var(--namew);position:sticky;left:0;z-index:20;background:#fff;border-right:1px solid var(--border);
      padding:5px 10px;display:flex;flex-direction:column;gap:1px;justify-content:center}
    .mn{font-weight:600;line-height:1.28;font-size:12px}
    .meta{font-size:10px;color:var(--muted);display:flex;gap:5px;flex-wrap:wrap;align-items:center}
    .badge{font-size:9.5px;border-radius:3px;padding:0 4px;border:1px solid;line-height:14px;white-space:nowrap}
    .b-id{background:#f4f6f9;color:var(--muted);border-color:var(--border);font-variant-numeric:tabular-nums}
    .b-ng{background:#eef0f3;color:var(--muted);border-color:#c8cedb}
    .b-part{background:#fdf3e3;color:var(--warning);border-color:#e8c96a}

    .days{flex:1;position:relative;min-width:calc(var(--dayw)*7)}
    .bgs{position:absolute;inset:0;display:grid;grid-template-columns:repeat(7,1fr)}
    .bg{border-left:1px solid #eef1f6;cursor:pointer;position:relative}
    .bg::after{content:"";position:absolute;left:50%;top:0;bottom:0;border-left:1px dotted #f2f4f8}
    .bg:hover{background:#eef4fb}
    .bg.sat{background:#f8fbfe}.bg.sun{background:#fefafa}.bg.today{background:#fffdf2}
    .bg.sat:hover,.bg.sun:hover,.bg.today:hover{background:#eef4fb}
    .bg.blocked{background:repeating-linear-gradient(45deg,#f4f5f7,#f4f5f7 5px,#e9ebee 5px,#e9ebee 10px);cursor:not-allowed}
    .bg.blocked:hover{background:repeating-linear-gradient(45deg,#f4f5f7,#f4f5f7 5px,#e9ebee 5px,#e9ebee 10px)}
    .bars{position:absolute;inset:0;pointer-events:none}
    .bar-i{position:absolute;height:calc(var(--lane) - 6px);min-width:34px;border-radius:3px;
      border-style:solid;border-width:1px 1px 1px 3px;padding:0 5px;font-size:11px;
      line-height:calc(var(--lane) - 8px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
      cursor:pointer;pointer-events:auto;display:flex;align-items:center;gap:5px}
    .bar-i:hover{filter:brightness(.95);z-index:12}
    .bar-i b{font-weight:700}
    .bar-i .tm{opacity:.85;font-size:10px;font-variant-numeric:tabular-nums;background:rgba(255,255,255,.55);
      border-radius:2px;padding:0 3px}
    .bar-i .who{opacity:.7;font-size:10px}
    .s-予約     {background:#dbe9fb;border-color:#2f6fd0;color:#12386f}
    .s-貸出中   {background:#fdeccd;border-color:#d98c12;color:#6d4304}
    .s-予約終了 {background:#eceef2;border-color:#a8b0bb;color:#5a636e}
    .s-重複     {background:#fbdcd9;border-color:var(--danger);color:#7d1d13}
    .s-取消     {background:#f4f5f7;border-color:#c3c8d0;color:#98a0aa;text-decoration:line-through}
    .cut-l{border-left-style:dashed!important;border-top-left-radius:0;border-bottom-left-radius:0}
    .cut-r{border-right-style:dashed;border-top-right-radius:0;border-bottom-right-radius:0}
    .empty{padding:26px;text-align:center;color:var(--muted);font-size:13px}

    .modal{position:fixed;inset:0;background:rgba(20,26,34,.45);display:none;align-items:center;
      justify-content:center;z-index:200;padding:14px}
    .modal.on{display:flex}
    .card{background:#fff;border-radius:8px;max-width:470px;width:100%;box-shadow:0 12px 40px rgba(0,0,0,.28);
      max-height:92vh;overflow:auto}
    .card h3{margin:0;padding:12px 16px;font-size:14.5px;border-bottom:1px solid var(--border);
      background:#f8f9fc;color:var(--primary)}
    .card .bd{padding:13px 16px;font-size:13px}
    .card dl{margin:0;display:grid;grid-template-columns:90px 1fr;gap:7px 10px}
    .card dt{color:var(--muted)}.card dd{margin:0;word-break:break-all}
    .fm{display:grid;gap:9px}
    .fm .f{display:flex;flex-direction:column;gap:3px}
    .fm .f span{font-size:11.5px;color:var(--muted)}
    .fm .f2{display:grid;grid-template-columns:1fr 1fr;gap:9px}
    .card .ft{padding:11px 16px;border-top:1px solid var(--border);display:flex;gap:8px;
      justify-content:flex-end;background:#f8f9fc;align-items:center}
    .msg{font-size:12px;flex:1}
    .msg.ng{color:var(--danger);font-weight:700}
    .msg.ok{color:var(--success);font-weight:700}
    .note{background:#f8f9fc;border-radius:5px;padding:8px 10px;font-size:11.5px;color:var(--muted);
      line-height:1.6;margin-top:9px}

    #snackbar{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#323232;color:#fff;
      padding:10px 20px;border-radius:6px;font-size:13px;display:none;z-index:999;max-width:90vw}

    @media(max-width:700px){
      :root{--namew:146px;--dayw:110px}
      .meta .b-part,.meta .b-ng{display:none}
      .bar-i .who{display:none}
      #app-view{padding:11px}
    }
    @media print{
      header,.bar,.legend,#status-panel{display:none}
      .scroll{overflow:visible;max-height:none;border:none;box-shadow:none}
      .name,.hname,.hrow{position:static}
      body{background:#fff}
      :root{--dayw:90px;--namew:168px;--lane:24px}
    }
  </style>
</head>
<body>

<header>
  <div class="logo">花岡車輌<span>デモ機予約 週間表</span></div>
  <div class="user-info">
    <span class="name" id="user-name"></span>
    <button onclick="signOut()">サインアウト</button>
  </div>
</header>

<div id="login-view">
  <h2>デモ機予約 週間表</h2>
  <p>花岡車輌株式会社の Microsoft アカウントでサインインしてください</p>
  <button id="login-btn" onclick="signIn()">
    <svg width="18" height="18" viewBox="0 0 21 21" fill="none"><path d="M10 0H0v10h10V0z" fill="#F25022"/><path d="M21 0H11v10h10V0z" fill="#7FBA00"/><path d="M10 11H0v10h10V11z" fill="#00A4EF"/><path d="M21 11H11v10h10V11z" fill="#FFB900"/></svg>
    Microsoft アカウントでサインイン
  </button>
</div>

<div id="app-view">
  <div id="app-nav-slot"></div>

  <div id="status-panel">読み込み中...</div>

  <div class="bar">
    <select id="cat"></select>
    <input type="search" id="q" placeholder="デモ機名で検索" style="width:150px">
    <button class="act" id="prev">◀ 前週</button>
    <button class="act pri" id="today">今週</button>
    <button class="act" id="next">次週 ▶</button>
    <span class="range" id="range"></span>
    <span class="spacer"></span>
    <button class="act" onclick="loadAll()">🔄 更新</button>
    <button class="act" onclick="window.print()">印刷</button>
  </div>

  <div class="bar" style="margin-bottom:11px">
    <label class="chk"><input type="checkbox" id="nopart" checked> 部品・オプションを隠す</label>
    <label class="chk"><input type="checkbox" id="nong" checked> 予約対象外を隠す</label>
    <label class="chk"><input type="checkbox" id="onlyres"> 予約がある機体のみ</label>
    <span class="cnt" id="cnt"></span>
  </div>

  <div class="legend">
    <span><i class="s-予約"></i>予約（開始前）</span>
    <span><i class="s-貸出中"></i>貸出中（期間中）</span>
    <span><i class="s-予約終了"></i>予約終了（期間後）</span>
    <span><i class="s-重複"></i>重複あり</span>
    <span><i class="s-取消"></i>取消</span>
    <span>│ バーの位置と幅は実時刻に比例（点線＝正午 JST）</span>
  </div>

  <div id="dup-warn" style="display:none;background:#fdecea;border:1px solid var(--danger);color:#7d1d13;
       border-radius:8px;padding:10px 13px;margin-bottom:11px;font-size:12.5px;line-height:1.7"></div>

  <div class="scroll"><div class="grid" id="grid"></div></div>
</div>

<!-- 詳細 -->
<div class="modal" id="mDetail"><div class="card">
  <h3 id="dTitle"></h3>
  <div class="bd"><dl id="dBody"></dl></div>
  <div class="ft"><span class="msg" id="dMsg"></span><button class="act" onclick="closeM('mDetail')">閉じる</button></div>
</div></div>

<!-- 予約登録 -->
<div class="modal" id="mNew"><div class="card">
  <h3>デモ機を予約する</h3>
  <div class="bd">
    <div class="fm">
      <div class="f"><span>デモ機</span><input type="text" id="nMachine" readonly style="background:#f4f6f9"></div>
      <div class="f"><span>予約件名（必須）</span><input type="text" id="nTitle" placeholder="例：轟産業 静岡支店 デモ立会"></div>
      <div class="f2">
        <div class="f"><span>開始（必須・JST）</span><input type="datetime-local" id="nStart"></div>
        <div class="f"><span>終了（必須・JST）</span><input type="datetime-local" id="nEnd"></div>
      </div>
      <div class="f2">
        <div class="f"><span>顧客名</span><input type="text" id="nCust"></div>
        <div class="f"><span>行き先</span><input type="text" id="nDest"></div>
      </div>
      <div class="f"><span>依頼者（サインイン中のアカウントを自動記録）</span>
        <input type="text" id="nReq" readonly style="background:#f4f6f9"></div>
      <div class="f"><span>備考</span><input type="text" id="nNotes" placeholder="返却期限など"></div>
    </div>
    <div class="note" id="nNote"></div>
  </div>
  <div class="ft">
    <span class="msg" id="nMsg"></span>
    <button class="act" onclick="closeM('mNew')">キャンセル</button>
    <button class="act pri" id="nSave" onclick="doReserve()">予約する</button>
  </div>
</div></div>

<!-- 予約対象の一括判定 -->
<div class="modal" id="mParts"><div class="card" style="max-width:620px">
  <h3 id="pTitle"></h3>
  <div class="bd" id="pBody"></div>
  <div class="ft">
    <span class="msg" id="pMsg"></span>
    <button class="act" onclick="closeM('mParts')">閉じる</button>
    <button class="act pri" id="pRun" onclick="runParts()">いいえ に更新する</button>
  </div>
</div></div>

<div id="snackbar"></div>

<script>
/* ============================================================
   設定（ap_dashboard.html と同じパターン）
   ============================================================ */
const MSAL_CONFIG = {
  auth: {
    clientId:    'd338d61b-01dc-4c7c-ac6b-aecf7f30d716',
    authority:   'https://login.microsoftonline.com/3933e8a0-c945-4e97-ae67-c82131087cad',
    redirectUri: new URL('auth.html', window.location.href).href,
  },
  cache: { cacheLocation: 'sessionStorage', storeAuthStateInCookie: false },
};
const SCOPES     = ['User.Read', 'Sites.ReadWrite.All'];
const GRAPH_BASE = 'https://graph.microsoft.com/v1.0';

/* デモ機の2リストは msteams_7aab51 サイト。内部名は英語なので直接指定（buildFieldMap 不要） */
const SITE_ID     = 'hanaokacorp.sharepoint.com,57813f25-8b28-40ac-affa-1e7d06d56802,eb428e92-6c63-46a9-a144-f6a2283a2f23';
const LIST_MASTER = '66b0765e-f49a-4e93-ac57-e7a675b29dd9';
const HIST_NAME       = 'デモ機予約履歴';                          /* 新リスト。名前で解決するのでID差し替え不要 */
const LIST_HIST_OLD   = 'de7c1832-a168-4778-bfe9-ba5e98277f38';   /* 旧リスト。新リストが無い間のフォールバック */
let   LIST_HIST       = LIST_HIST_OLD;
let   HIST_IS_NEW     = false;

const WINDOW_DAYS = 90;                 /* 履歴取得の下限。範囲を必ず閉じる（5000件しきい値対策） */
const LOCK_COL    = 'LockData';         /* CASの対象。未作成なら予約機能は無効 */
const RESV_COL    = 'IsReservable';     /* 予約対象フラグ。未作成なら名前から推定 */

/* 新しい履歴リストの列定義。name＝内部名、jp＝あとで付ける日本語表示名。
   Graph で作れば内部名が確定するので「英語で作って日本語にリネーム」を手でやる必要がない。 */
const TEXT  = (max=255) => ({ text:{ allowMultipleLines:false, maxLength:max, textType:'plain' } });
const NUM   = ()        => ({ number:{ decimalPlaces:'none', displayAs:'number' } });
const DATE  = ()        => ({ dateTime:{ displayAs:'standard', format:'dateTime' } });
const HIST_COLUMNS = [
  { name:'MachineItemId',     jp:'マスターID',     def:NUM()  },
  { name:'SourceEquipmentId', jp:'元設備ID',       def:NUM(),  indexed:true },
  { name:'DemoMachineName',   jp:'デモ機名',       def:TEXT() },
  { name:'LockToken',         jp:'占有トークン',   def:TEXT(32) },
  { name:'ReservationStart',  jp:'予約開始',       def:DATE(), indexed:true },
  { name:'ReservationEnd',    jp:'予約終了',       def:DATE() },
  { name:'LoanStatus',        jp:'貸出状態',       def:{ choice:{ allowTextEntry:false, choices:['予約','取消'], displayAs:'dropDownMenu' } },
                                                   defaultValue:{ value:'予約' }, indexed:true },
  { name:'RequesterEmail',    jp:'依頼者メール',   def:TEXT(), indexed:true },
  { name:'RequesterName',     jp:'依頼者名',       def:TEXT() },
  { name:'CustomerName',      jp:'顧客名',         def:TEXT() },
  { name:'Destination',       jp:'行き先',         def:TEXT() },
  { name:'Notes',             jp:'備考',           def:{ text:{ allowMultipleLines:true, linesForEditing:4, textType:'plain' } } }
];

/* 部品・オプションの推定（IsReservable が無い間の代替） */
const PART_RE = /OP\/|ｱｼﾞｬｽﾀｰ|アジャスター|ジャバラ|ｼﾞｬﾊﾞﾗ|スプリング|バネ|固定車|固定1|固定１|バンパー|ハンドル|ブラケット|棚板|フック|ガードフェンス|Wi-Fi|テーブル|スツール|有孔ボード|ワークテーブル|用HS|ｷｯﾄ|ｷｬﾘﾝｸﾞ/;

/* ============================================================
   JST の扱い： Graph は UTC で返す／UTC で書く
   toJ(ms) は「UTCフィールドを読むとJSTの壁時計になる Date」を返す
   ============================================================ */
const JST = 9 * 3600e3;
const toJ   = ms => new Date(ms + JST);
const fromJ = d  => d.getTime() - JST;
const P     = iso => new Date(iso).getTime();                        /* UTC ISO → ms */
const pad   = n => String(n).padStart(2, '0');
const jKey  = ms => { const d = toJ(ms); return `${d.getUTCFullYear()}-${pad(d.getUTCMonth()+1)}-${pad(d.getUTCDate())}`; };
const jHM   = ms => { const d = toJ(ms); return `${pad(d.getUTCHours())}:${pad(d.getUTCMinutes())}`; };
const jFull = ms => `${jKey(ms).replace(/-/g,'/')} ${jHM(ms)}`;
/* datetime-local の値（JST壁時計） ⇄ UTC ms */
const localToMs = v => v ? Date.parse(v + ':00Z') - JST : NaN;
const msToLocal = ms => { const d = toJ(ms);
  return `${d.getUTCFullYear()}-${pad(d.getUTCMonth()+1)}-${pad(d.getUTCDate())}T${pad(d.getUTCHours())}:${pad(d.getUTCMinutes())}`; };
/* JSTの月曜0:00（UTC ms） */
function weekTopMs(ms){
  const d = toJ(ms);
  const back = (d.getUTCDay() + 6) % 7;
  return Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate() - back) - JST;
}
const DAY = 86400e3, WK = DAY * 7, DOW = ['日','月','火','水','木','金','土'];
const overlaps = (a, s, e) => a.s < e && a.e > s;                    /* 半開区間 */

/* ============================================================
   認証（既存アプリと同じ popup 方式）
   ============================================================ */
let msalInstance = null, currentAccount = null;

async function initMsal(){
  msalInstance = new msal.PublicClientApplication(MSAL_CONFIG);
  await msalInstance.initialize();
  await msalInstance.handleRedirectPromise();
  const a = msalInstance.getAllAccounts();
  if (a.length) { currentAccount = a[0]; msalInstance.setActiveAccount(currentAccount); await showApp(); }
}
async function signIn(){

    currentAccount = r.account; msalInstance.setActiveAccount(currentAccount); await showApp();
  } catch (e) {

}
function signOut(){ msalInstance.logoutPopup({ account: currentAccount }); }
async function getToken(){
  try { return (await msalInstance.acquireTokenSilent({ scopes: SCOPES, account: currentAccount })).accessToken; }
  catch { const r = await msalInstance.acquireTokenPopup({ scopes: SCOPES }); currentAccount = r.account; return r.accessToken; }
}

/* ============================================================
   Graph
   ============================================================ */
async function gGet(path, extra){
  const t = await getToken();
  const r = await fetch(GRAPH_BASE + path, { headers: { Authorization: 'Bearer ' + t, ...(extra||{}) } });
  if (!r.ok) { const e = new Error(`[${r.status}] ${path}`); e.status = r.status; throw e; }
  return r.json();
}
async function gGetAll(path, extra){
  let out = [], next = path;
  while (next) {
    const d = await gGet(next, extra);
    out = out.concat(d.value || []);
    next = d['@odata.nextLink'] ? d['@odata.nextLink'].replace(GRAPH_BASE, '') : null;
  }
  return out;
}
async function gPost(path, body){
  const t = await getToken();
  const r = await fetch(GRAPH_BASE + path, { method:'POST',
    headers:{ Authorization:'Bearer '+t, 'Content-Type':'application/json' }, body: JSON.stringify(body) });
  if (!r.ok) throw new Error(`[${r.status}] ${await r.text()}`);
  return r.json();
}
/* $batch。1回20件まで。71件なら4回で終わる */
async function gBatch(requests){
  const t = await getToken(); const out = [];
  for (let i = 0; i < requests.length; i += 20) {
    const chunk = requests.slice(i, i+20).map((r,k) => ({ id: String(i+k), ...r }));
    const res = await fetch(`${GRAPH_BASE}/$batch`, { method:'POST',
      headers:{ Authorization:'Bearer '+t, 'Content-Type':'application/json' },
      body: JSON.stringify({ requests: chunk }) });
    const b = await res.json();
    out.push(...(b.responses || []));
  }
  return out;
}

/* 列を作る。name を明示できるので内部名が日本語に化けない（UIで作るときの罠を回避） */
async function gCreateColumn(listId, def, displayJa){
  const col = await gPost(`/sites/${SITE_ID}/lists/${listId}/columns`, def);
  if (displayJa) {
    const t = await getToken();
    await fetch(`${GRAPH_BASE}/sites/${SITE_ID}/lists/${listId}/columns/${col.id}`, { method:'PATCH',
      headers:{ Authorization:'Bearer '+t, 'Content-Type':'application/json' },
      body: JSON.stringify({ displayName: displayJa }) });
  }
  return col;
}

/* If-Match 付き PATCH。412 を例外にせず status で返す（CASの心臓部） */
async function gPatchIf(path, fields, etag){
  const t = await getToken();
  const h = { Authorization:'Bearer '+t, 'Content-Type':'application/json' };
  if (etag) h['If-Match'] = etag;
  const r = await fetch(GRAPH_BASE + path, { method:'PATCH', headers:h, body: JSON.stringify(fields) });
  let b = null; try { b = await r.json(); } catch {}
  return { status: r.status, body: b, retryAfter: Number(r.headers.get('Retry-After')) || 0 };
}

/* ---------- 新しい履歴リストの作成 ----------
   Graph で作ると name（内部名）を確定できるので、UIでやる
   「英語名で作成 → 表示名を日本語に変更」の手作業が不要になる。 */
async function createHistList(){
  if (!confirm(`新しい履歴リスト「${HIST_NAME}」を作成します（${HIST_COLUMNS.length + 1}列）。\n\n`
    + `・内部名は英語で確定（Graphで作るため化けません）\n`
    + `・表示名はあとから日本語に変更します\n`
    + `・旧リストのデータは移行しません（テストデータのみのため）\n\n`
    + `既に同名のリストがある場合は中止します。`)) return;
  showSnack('リストを作成中...');
  try {
    const chk = await gGet(`/sites/${SITE_ID}/lists?$select=id,displayName`);
    if ((chk.value||[]).some(l => l.displayName === HIST_NAME)) {
      showSnack(`「${HIST_NAME}」は既に存在します。再読込します`);
      sessionStorage.removeItem('histListId'); await showApp(); return;
    }

    /* 1. リストと列をまとめて作成。name と displayName を同じ英語にして曖昧さを消す */
    const created = await gPost(`/sites/${SITE_ID}/lists`, {
      displayName: HIST_NAME,
      list: { template: 'genericList' },
      columns: HIST_COLUMNS.map(c => ({
        name: c.name, displayName: c.name,
        ...(c.indexed ? { indexed:true } : {}),
        ...(c.defaultValue ? { defaultValue:c.defaultValue } : {}),
        ...c.def
      }))
    });
    const newId = created.id;

    /* 2. 表示名を日本語に（逐次。スキーマ変更は並列だと競合する） */
    const rnRes = await renameHistColumns(newId);

    /* 3. 出来上がりを読み返して報告（indexed が実際に効いたかもここで分かる） */
    const after = await gGet(`/sites/${SITE_ID}/lists/${newId}/columns?$select=name,displayName,indexed`);
    const rows = (after.value||[]).filter(c => c.name === 'Title' || HIST_COLUMNS.some(h => h.name === c.name));
    const missing = HIST_COLUMNS.filter(h => !rows.some(r => r.name === h.name)).map(h => h.name);
    const wantIdx = HIST_COLUMNS.filter(h => h.indexed).map(h => h.name);
    const gotIdx  = rows.filter(r => r.indexed).map(r => r.name);
    const noIdx   = wantIdx.filter(n => !gotIdx.includes(n));

    sessionStorage.setItem('histListId', newId);
    document.getElementById('dTitle').textContent = `「${HIST_NAME}」を作成しました`;
    document.getElementById('dBody').innerHTML = [
      ['リストID',   `<code>${newId}</code>`],
      ['作成した列', `${rows.length}列` + (missing.length ? ` <span class="ng">／作成できなかった列: ${missing.join(', ')}</span>` : '')],
      ['表示名の変更', rnRes.ng.length
          ? `<span class="ng">${rnRes.ng.length}件 失敗</span> / 成功 ${rnRes.ok.length}件<br>`
            + `<span style="font-size:11.5px">${esc(rnRes.ng[0].msg)}</span><br>`
            + `<span style="font-size:11.5px;color:var(--muted)">列の動作には影響しません（アプリは内部名を使います）。`
            + `パネルの「表示名を日本語にする」で再試行できます</span>`

      ['インデックス', noIdx.length

            + `無いと件数が増えたとき <code>$filter</code> が400になります</span>`
          : `<span class="ok">${gotIdx.join(', ')} に付きました</span>`],
      ['次にやること', `このまま使えます（アプリはリスト名で自動解決するのでコード修正は不要）。`
          + `<br>旧リストは Teams通知フローの作り直しが済んでから削除してください`]
    ].map(([k,v]) => `<dt>${k}</dt><dd>${v}</dd>`).join('');
    document.getElementById('dMsg').textContent = '';
    openM('mDetail');

    await showApp();
  } catch (e) { showSnack('リスト作成に失敗: ' + e.message); console.error(e); }
}

/* 表示名を日本語にする。冪等（既に日本語のものは飛ばす）。
   スキーマ変更は同一リストで並列に投げると競合するので逐次で回す。 */
async function renameHistColumns(listId){
  const want = new Map([...HIST_COLUMNS.map(c => [c.name, c.jp]), ['Title', '予約件名']]);
  const cols = await gGet(`/sites/${SITE_ID}/lists/${listId}/columns?$select=id,name,displayName`);
  const todo = (cols.value||[]).filter(c => want.has(c.name) && c.displayName !== want.get(c.name));
  const ok = [], ng = [];
  const t = await getToken();
  for (const c of todo) {
    const r = await fetch(`${GRAPH_BASE}/sites/${SITE_ID}/lists/${listId}/columns/${c.id}`, {
      method:'PATCH', headers:{ Authorization:'Bearer '+t, 'Content-Type':'application/json' },
      body: JSON.stringify({ displayName: want.get(c.name) }) });
    if (r.ok) ok.push(c.name);
    else {
      let b = null; try { b = await r.json(); } catch {}
      ng.push({ name:c.name, status:r.status,
                msg:`${c.name}: [${r.status}] ${b?.error?.code || ''} ${b?.error?.message || ''}`.trim() });
    }
    await sleep(120);   /* 連続スキーマ変更を少し離す */
  }
  return { ok, ng, skipped: (cols.value||[]).length - todo.length };
}

/* ---------- 占有情報の再構築 ----------
   LockData は「原子的にCASできる対象」であることだけが仕事で、中身は履歴から100%導出できる。
   だから掃除ではなく再構築にする。これ1回で次の3つが同時に片付く：
     ① LockData 列を作る前に登録された予約（＝CASに見えない予約）を取り込む  ← 移行時に必ず必要
     ② 履歴POSTが失敗して残った幽霊ロックを消す
     ③ 取消済み・期限切れのエントリを落とす
   ※ 誰かが予約操作中に実行すると、まだ履歴に書かれていないロックを消す可能性がある。
      手動の保守操作なので、他の人が触っていないときに実行する。 */
async function rebuildLocks(){
  if (!CAP.lock)  { showSnack('LockData 列がありません'); return; }
  if (!CAP.token) { showSnack('履歴に LockToken 列がありません。先に列を作成してください'); return; }
  showSnack('履歴から占有情報を計算中...');
  try {
    const now = Date.now(), cutoff = now - DAY;

    /* 1. 有効な予約を全部取る（取消でない・終了が未来） */
    const rows = (await gGetAll(`/sites/${SITE_ID}/lists/${LIST_HIST}/items?$expand=fields&$top=500`))
      .filter(r => {
        const f = r.fields || {};
        return f.LoanStatus !== '取消' && f.ReservationStart && f.ReservationEnd && P(f.ReservationEnd) >= cutoff;
      });

    /* 2. トークンの無い行にトークンを発行（履歴に書き戻して対応づける） */
    const orphans = rows.filter(r => !(r.fields||{}).LockToken);
    const issued = new Map();
    orphans.forEach(r => issued.set(r.id, newToken()));

    /* 3. 元設備ID → 占有エントリ */
    const byMachine = new Map();
    rows.forEach(r => {
      const f = r.fields;
      const mid = Number(f.SourceEquipmentId) || 0; if (!mid) return;
      if (!byMachine.has(mid)) byMachine.set(mid, []);
      byMachine.get(mid).push({ token: f.LockToken || issued.get(r.id), s: P(f.ReservationStart), e: P(f.ReservationEnd) });
    });

    /* 4. 差分の計画を立てる */
    const plan = [];
    for (const m of MACHINES) {
      const want = (byMachine.get(m.id) || []).sort((a,b) => a.s - b.s);
      const have = prune(parseOcc(m.lock || ''), now).sort((a,b) => a.s - b.s);
      if (dumpOcc(want) !== dumpOcc(have)) plan.push({ m, want, have });
    }

    if (!plan.length && !orphans.length) { showSnack('占有情報は履歴と一致しています。変更ありません'); return; }

    const lines = plan.slice(0, 25).map(p => {
      const add = p.want.length - p.have.length;
      return `  ${p.m.n} #${p.m.id}: ${p.have.length} → ${p.want.length}` +
             (add > 0 ? '（取り込み）' : add < 0 ? '（削除）' : '（内容差異）');
    }).join('\n');
    const more = plan.length > 25 ? `\n  …他 ${plan.length - 25}機体` : '';

    if (!confirm(
      `履歴から占有情報を作り直します。\n\n` +
      `有効な予約 ${rows.length}件` + (orphans.length ? `（うち ${orphans.length}件はトークン未設定 → 発行します）` : '') + `\n` +
      `更新する機体 ${plan.length}件\n\n${lines}${more}\n\n` +
      `※ 他の方が予約操作中だと、まだ履歴に反映されていないロックを消す可能性があります。\n` +
      `   誰も触っていないタイミングで実行してください。`)) { showSnack('中止しました'); return; }

    /* 5. トークンを履歴に書き戻す（$batch） */
    if (orphans.length) {
      const res = await gBatch(orphans.map(r => ({
        method: 'PATCH',
        url: `/sites/${SITE_ID}/lists/${LIST_HIST}/items/${r.id}/fields`,
        headers: { 'Content-Type': 'application/json' },
        body: { LockToken: issued.get(r.id) }
      })));
      const ng = res.filter(x => x.status >= 300);
      if (ng.length) { showSnack(`トークンの書き戻しに失敗 ${ng.length}件: ${ng[0].body?.error?.message || ng[0].status}`); return; }
    }

    /* 6. LockData を上書き（If-Match。412なら再取得してやり直し） */
    let okN = 0, ngN = 0;
    for (const p of plan) {
      let done = false;
      for (let n = 1; n <= 3 && !done; n++) {
        const it = await gGet(`/sites/${SITE_ID}/lists/${LIST_MASTER}/items/${p.m.itemId}?$expand=fields`);
        const r = await gPatchIf(`/sites/${SITE_ID}/lists/${LIST_MASTER}/items/${p.m.itemId}/fields`,
          { [LOCK_COL]: dumpOcc(p.want) }, it['@odata.etag']);
        if (r.status === 200) { okN++; done = true; }
        else if (r.status === 412) { await sleep(80 * n); }
        else { ngN++; done = true; }
      }
      if (!done) ngN++;
    }
    showSnack(`再構築完了：${okN}機体を更新` + (ngN ? ` / ${ngN}件失敗` : '') +
              (orphans.length ? ` / トークン${orphans.length}件を発行` : ''));
    await loadAll();
  } catch (e) { showSnack('再構築エラー: ' + e.message); console.error(e); }
}

async function loadAll(){
  showSnack('読み込み中...');
  try {
    const items = await gGetAll(`/sites/${SITE_ID}/lists/${LIST_MASTER}/items?$expand=fields&$top=500`);
    MACHINES = items.map(it => {
      const f = it.fields || {};
      const name = f.Title || '(名称なし)';
      const cat  = f.SourceEquipmentCategory || '(区分なし)';
      return {
        itemId : it.id,                                   /* CASのPATCH対象 */
        etag   : it['@odata.etag'],
        id     : Number(f.SourceEquipmentId) || 0,
        n      : name,
        cat, ord: Number(f.DisplayOrder) || 0,
        lock   : f[LOCK_COL] || '',
        resv   : CAP.resv ? f[RESV_COL] !== false : !PART_RE.test(name),
        /* 予約不可の判定は区分だけで足りる。CurrentStatus 列は削除済み
           （実データ349件で 持出不可56件 ＝ ショールーム機56件 が完全一致していた） */
        ng     : /ショールーム/.test(cat),
        part   : PART_RE.test(name)
      };
    }).sort((a,b) => a.cat.localeCompare(b.cat) || (a.ord||9999) - (b.ord||9999) || a.n.localeCompare(b.n));

    const cats = [...new Set(MACHINES.map(m => m.cat))].sort();
    const sel = document.getElementById('cat'), keep = sel.value;
    sel.innerHTML = `<option value="">全区分</option>` +
      cats.map(c => `<option value="${c}">${c}（${MACHINES.filter(m=>m.cat===c).length}）</option>`).join('');
    sel.value = keep && cats.includes(keep) ? keep
              : (cats.find(c => c.includes('工場')) || '');

    await loadRes();
    render();
    showSnack(`マスター ${MACHINES.length}件 / 予約 ${RES.length}件 を読み込みました`);
  } catch (e) { showSnack('読み込みエラー: ' + e.message); console.error(e); }
}

/* 履歴は範囲を必ず閉じて取る（上限なしにすると未来全部を引いてしまう）
   ReservationStart にインデックスが無いと $filter が400になるので3段構え：
     1) Prefer ヘッダ付きでサーバー側フィルタ
     2) 400 なら全件取得＋クライアント側フィルタにフォールバック
     3) どちらを通ったか FETCH_MODE に記録して画面に出す（将来5000件超で壊れる前に気づけるように） */
let FETCH_MODE = '';
async function loadRes(){
  const loMs = curWeek - WINDOW_DAYS*DAY, hiMs = curWeek + WK;
  const lo = new Date(loMs).toISOString().slice(0,19) + 'Z';
  const hi = new Date(hiMs).toISOString().slice(0,19) + 'Z';
  const base = `/sites/${SITE_ID}/lists/${LIST_HIST}/items?$expand=fields&$top=500`;
  const flt  = encodeURIComponent(`fields/ReservationStart ge '${lo}' and fields/ReservationStart lt '${hi}'`);

  let items;
  try {
    items = await gGetAll(`${base}&$filter=${flt}`,
      { Prefer: 'HonorNonIndexedQueriesWarningMayFailRandomly' });
    FETCH_MODE = 'server';
  } catch (e) {
    if (e.status !== 400) throw e;
    items = (await gGetAll(base)).filter(it => {
      const v = (it.fields||{}).ReservationStart;
      if (!v) return false;
      const ms = P(v);
      return ms >= loMs && ms < hiMs;
    });
    FETCH_MODE = 'client';
  }
  paintFetchMode();

  RES = items.map(it => {
    const f = it.fields || {};
    return {
      rid  : it.id,
      mid  : Number(f.SourceEquipmentId) || 0,
      t    : f.Title || '(件名なし)',
      s    : f.ReservationStart ? P(f.ReservationStart) : NaN,
      e    : f.ReservationEnd   ? P(f.ReservationEnd)   : NaN,
      cust : f.CustomerName || '', dest: f.Destination || '',
      req  : f.RequesterName || '', reqMail: f.RequesterEmail || '',
      notes: f.Notes || '',
      st   : f.LoanStatus || '予約',
      token: f.LockToken || ''
    };
  }).filter(r => r.mid && !isNaN(r.s) && !isNaN(r.e));
}

/* 状態は保存せず、日時と「今」から計算する */
function calcStatus(r, now){
  if (r.st === '取消') return '取消';
  if (now < r.s) return '予約';
  if (now > r.e) return '予約終了';
  return '貸出中';
}
const isAllDay = r => {
  const a = toJ(r.s), b = toJ(r.e);
  return a.getUTCHours()===0 && a.getUTCMinutes()===0 &&
         ((b.getUTCHours()===23 && b.getUTCMinutes()>=59) || (b.getUTCHours()===0 && b.getUTCMinutes()===0));
};

/* ============================================================
   描画
   ============================================================ */
function render(){
  const now = Date.now(), w0 = curWeek, wEnd = w0 + WK;
  const days = Array.from({length:7}, (_,i) => w0 + i*DAY);
  document.getElementById('range').textContent =
    `${jKey(w0).replace(/-/g,'/')} 〜 ${jKey(w0 + 6*DAY).replace(/-/g,'/')}`;

  const cat = document.getElementById('cat').value;
  const q   = document.getElementById('q').value.trim().toLowerCase();
  let list = MACHINES.filter(m => (!cat || m.cat === cat) && (!q || m.n.toLowerCase().includes(q)));
  if (document.getElementById('nopart').checked) list = list.filter(m => !m.part);
  if (document.getElementById('nong').checked)   list = list.filter(m => m.resv && !m.ng);

  const inWeek = RES.filter(r => r.e >= w0 && r.s < wEnd);
  if (document.getElementById('onlyres').checked){
    const has = new Set(inWeek.map(r => r.mid));
    list = list.filter(m => has.has(m.id));
  }
  document.getElementById('cnt').textContent =
    `表示 ${list.length}件 / 全 ${MACHINES.length}件（部品 ${MACHINES.filter(m=>m.part).length}・予約対象外 ${MACHINES.filter(m=>!m.resv||m.ng).length}）`;

  const todayKey = jKey(now);
  let h = `<div class="hrow"><div class="hname">デモ機（${list.length}）</div><div class="hdays">`;
  days.forEach(ms => {
    const d = toJ(ms), dow = d.getUTCDay();
    const c = [dow===6?'sat':'', dow===0?'sun':'', jKey(ms)===todayKey?'today':''].join(' ');
    h += `<div class="hd ${c}"><div class="dow">${DOW[dow]}</div><div class="dnum">${d.getUTCDate()}</div></div>`;
  });
  h += `</div></div>`;
  if (!list.length) h += `<div class="empty">条件に合うデモ機がありません</div>`;

  list.forEach(m => {
    const rs = inWeek.filter(r => r.mid === m.id).sort((a,b) => a.s - b.s);
    /* 重なりを段に振り分け。同時に「重複あり」も検出（保存せず計算） */
    const lanes = [];
    rs.forEach(r => {
      r._dup = rs.some(o => o !== r && o.st !== '取消' && r.st !== '取消' && overlaps(o, r.s, r.e));
      let i = lanes.findIndex(l => l.every(x => x.e <= r.s || x.s >= r.e));
      if (i < 0) { lanes.push([r]); i = lanes.length - 1; } else lanes[i].push(r);
      r._l = i;
    });
    const n = Math.max(1, lanes.length);
    const blocked = m.ng || !m.resv || !CAP.lock;

    h += `<div class="row"><div class="name" style="min-height:calc(var(--lane)*${n})">
      <div class="mn">${esc(m.n)}</div><div class="meta">
        <span class="badge b-id">#${m.id}</span>
        ${m.ng   ? `<span class="badge b-ng">予約不可</span>` : ''}
        ${m.part ? `<span class="badge b-part">部品?</span>` : ''}
      </div></div><div class="days" style="height:calc(var(--lane)*${n})"><div class="bgs">`;
    days.forEach(ms => {
      const d = toJ(ms), dow = d.getUTCDay();
      const c = [dow===6?'sat':'', dow===0?'sun':'', jKey(ms)===todayKey?'today':'', blocked?'blocked':''].join(' ');
      h += `<div class="bg ${c}" data-m="${m.id}" data-d="${ms}"></div>`;
    });
    h += `</div><div class="bars">`;
    rs.forEach(r => {
      const L = Math.max(0, (r.s - w0) / WK * 100), R = Math.min(100, (r.e - w0) / WK * 100);
      const st = r._dup && r.st !== '取消' ? '重複' : calcStatus(r, now);
      const cls = [`s-${st}`, r.s < w0 ? 'cut-l' : '', r.e >= wEnd ? 'cut-r' : ''].join(' ');
      h += `<div class="bar-i ${cls}" style="left:${L}%;width:${Math.max(R-L,0)}%;top:calc(var(--lane)*${r._l} + 3px)"
        data-r="${r.rid}" title="${esc(r.t)}">
        ${isAllDay(r) ? '' : `<span class="tm">${jHM(r.s)}–${jHM(r.e)}</span>`}
        <b>${esc(r.cust || r.t)}</b><span class="who">${esc([r.dest, r.req].filter(Boolean).join(' / '))}</span></div>`;
    });
    h += `</div></div></div>`;
  });
  document.getElementById('grid').innerHTML = h;

  /* 重複が残っていたら目立たせる。CASが正しく動いていればここは0件のはず */
  const dups = inWeek.filter(r => r._dup && r.st !== '取消');
  const warn = document.getElementById('dup-warn');
  if (dups.length) {
    const names = [...new Set(dups.map(r => {
      const m = MACHINES.find(x => x.id === r.mid); return m ? `${m.n} #${m.id}` : `#${r.mid}`; }))];
    warn.style.display = 'block';
    warn.innerHTML = `<b>この週に重複予約が ${dups.length}件あります</b>（${names.join(' / ')}）<br>`
      + `CASが有効になる前に登録された予約は占有情報に入っていません。`
      + `<button class="act" style="margin-left:6px" onclick="rebuildLocks()">占有情報を再構築</button>`
      + ` を実行すると、以降は同じ重複が作れなくなります。期間の調整は履歴リストで行ってください。`;
  } else warn.style.display = 'none';
}
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

let newMid = 0;
function openNew(mid, dayMs){

    : `<b style="color:var(--danger)">マスターに <code>${LOCK_COL}</code> 列が無いため予約登録は無効です。</b>複数行テキスト（プレーン・バージョン管理OFF）で追加してください。`;

/* ---------- CAS 本体 ---------- */
const parseOcc = s => (s||'').split('\n').map(l=>l.trim()).filter(Boolean)
  .map(l => { const [token,a,b] = l.split('|'); return { token, s:P(a), e:P(b) }; });
const dumpOcc  = a => a.map(x => `${x.token}|${new Date(x.s).toISOString()}|${new Date(x.e).toISOString()}`).join('\n');
const prune    = (a, now) => a.filter(x => x.e >= now - DAY);
const newToken = () => Math.random().toString(36).slice(2,8) + Date.now().toString(36).slice(-4);
const sleep    = ms => new Promise(r => setTimeout(r, ms));

async function reserve({ machine, s, e, details }){
  const now = Date.now();
  for (let n = 1; n <= 4; n++){
    /* 1. 占有情報とETagを同時に取得 */
    const it = await gGet(`/sites/${SITE_ID}/lists/${LIST_MASTER}/items/${machine.itemId}?$expand=fields`);
    const etag = it['@odata.etag'];
    const live = prune(parseOcc((it.fields||{})[LOCK_COL] || ''), now);

    /* 2. 取得した値そのものに対して判定（追加のGETをしない） */
    const hit = live.find(x => overlaps(x, s, e));
    if (hit) return { ok:false, reason:'CONFLICT', conflict:hit };

    /* 3. 同じETagで書き戻す */
    const token = newToken();
    const r = await gPatchIf(`/sites/${SITE_ID}/lists/${LIST_MASTER}/items/${machine.itemId}/fields`,
      { [LOCK_COL]: dumpOcc([...live, { token, s, e }]) }, etag);

    if (r.status === 412) { await sleep(60*n + Math.random()*80); continue; }        /* 負け→再判定 */
    if (r.status === 429) { await sleep((r.retryAfter||3)*1000); n--; continue; }    /* スロットリングは回数に数えない */
    if (r.status >= 500)  { await sleep(400*n); continue; }
    if (r.status !== 200) return { ok:false, reason:'LOCK_FAILED', status:r.status, body:r.body };

    /* 4. ロック確保済み。履歴に記録 */
    try {
      const fields = {
        Title: details.title, SourceEquipmentId: machine.id, DemoMachineName: machine.n,
        LoanStatus: '予約',
        ReservationStart: new Date(s).toISOString(), ReservationEnd: new Date(e).toISOString(),
        CustomerName: details.cust, Destination: details.dest, Notes: details.notes,
        /* 依頼者＝利用者。サインイン中のアカウントから自動記録。Teams通知と「自分の予約」で使う */
        RequesterEmail: currentAccount?.username || '',
        RequesterName:  currentAccount?.name || currentAccount?.username || ''
      };
      /* 列が無いリストに送ると 400 invalidRequest になるので、あるものだけ送る */
      if (CAP.token) fields.LockToken = token;
      if (CAP.mid)   fields.MachineItemId = Number(machine.itemId);
      const row = await gPost(`/sites/${SITE_ID}/lists/${LIST_HIST}/items`, { fields });
      return { ok:true, id:row.id, token, attempts:n };
    } catch (err) {
      await release(machine, token, now).catch(()=>{});   /* 補償。失敗しても安全側（枠が塞がる） */
      return { ok:false, reason:'SAVE_FAILED', message: err.message };
    }
  }
  return { ok:false, reason:'BUSY' };
}
async function release(machine, token, now){
  for (let n = 1; n <= 4; n++){
    const it = await gGet(`/sites/${SITE_ID}/lists/${LIST_MASTER}/items/${machine.itemId}?$expand=fields`);
    const next = prune(parseOcc((it.fields||{})[LOCK_COL] || ''), now).filter(x => x.token !== token);
    const r = await gPatchIf(`/sites/${SITE_ID}/lists/${LIST_MASTER}/items/${machine.itemId}/fields`,
      { [LOCK_COL]: dumpOcc(next) }, it['@odata.etag']);
    if (r.status === 200) return true;
    if (r.status !== 412) return false;
    await sleep(60*n);
  }
  return false;
}

async function doReserve(){
  const msg = document.getElementById('nMsg'), btn = document.getElementById('nSave');
  const m = MACHINES.find(x => x.id === newMid);
  const title = document.getElementById('nTitle').value.trim();
  const s = localToMs(document.getElementById('nStart').value);
  const e = localToMs(document.getElementById('nEnd').value);
  const fail = t => { msg.textContent = t; msg.className = 'msg ng'; };

  if (!m) return fail('デモ機が特定できません');
  if (!title) return fail('予約件名を入力してください');
  if (isNaN(s) || isNaN(e)) return fail('開始と終了を入力してください');
  if (e <= s) return fail('終了が開始より後になるようにしてください');

  btn.disabled = true; msg.textContent = '枠を確保中...'; msg.className = 'msg';
  try {
    const r = await reserve({ machine:m, s, e, details:{
      title, cust: document.getElementById('nCust').value.trim(),
      dest:  document.getElementById('nDest').value.trim(),
      notes: document.getElementById('nNotes').value.trim() }});

    if (r.ok){
      msg.textContent = '予約しました'; msg.className = 'msg ok';
      closeM('mNew'); await loadRes(); render();
      showSnack(`予約を登録しました（試行 ${r.attempts}回目）`);
      return;
    }
    if (r.reason === 'CONFLICT')
      fail(`この枠は既に予約されています（${jFull(r.conflict.s)} 〜 ${jFull(r.conflict.e)}）`);
    else if (r.reason === 'BUSY')     fail('他の方が同じ機体を操作中です。少し待って再度お試しください');
    else if (r.reason === 'SAVE_FAILED') fail('枠は確保しましたが履歴の保存に失敗しました: ' + (r.message||''));
    else fail(`保存できませんでした（${r.reason} ${r.status||''}）`);
  } catch (err) { fail('エラー: ' + err.message); }
  finally { btn.disabled = false; await loadRes(); render(); }
}

/* ============================================================
   ユーティリティ
   ============================================================ */
function openM(id){ document.getElementById(id).classList.add('on'); }
function closeM(id){ document.getElementById(id).classList.remove('on'); }
document.querySelectorAll('.modal').forEach(el => el.onclick = e => { if (e.target === el) el.classList.remove('on'); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') document.querySelectorAll('.modal.on').forEach(m => m.classList.remove('on')); });
function showSnack(t){ const el = document.getElementById('snackbar');
  el.textContent = t; el.style.display = 'block'; clearTimeout(el._t);
  el._t = setTimeout(() => el.style.display = 'none', 4000); }

initMsal().catch(e => { console.error('MSAL初期化エラー:', e); showSnack('認証エラー: ' + (e.errorCode || e.message)); });
</script>

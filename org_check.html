<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Entra 入力状況チェック</title>
<!--
  「組織図・連絡先」ページを作る前の確認用（管理者向け・左メニューには載せない）。
  Entra のユーザー情報（部署・役職・上司・携帯電話・会社名）がどの程度入っているかを数える。
  必要な権限：業務アプリに User.Read.All（委任）を追加し、管理者の同意を済ませておくこと。
  読むだけで、Entra には何も書き込まない。
-->
<script src="https://cdn.jsdelivr.net/npm/@azure/msal-browser@3.10.0/lib/msal-browser.min.js" crossorigin="anonymous"></script>
<script src="hanaoka_auth.js"></script>
<link rel="icon" type="image/png" href="favicon_hub.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+JP:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="hanaoka_theme.css?v=20261004">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: var(--font); background: var(--bg); color: var(--text-main); font-size: 14px; -webkit-font-smoothing: antialiased; }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 24px 16px 64px; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  h2 { font-size: 16px; margin: 28px 0 10px; }
  .note { color: var(--text-sub, #667); font-size: 13px; margin: 0 0 6px; }
  .card { background: #fff; border-radius: 12px; box-shadow: 0 1px 3px rgba(0,0,0,.08); padding: 16px; overflow-x: auto; }
  button { font-family: inherit; font-size: 14px; padding: 8px 18px; border-radius: 8px; border: 0; background: #1f2a5a; color: #fff; cursor: pointer; }
  button:disabled { opacity: .5; cursor: default; }
  table { border-collapse: collapse; width: 100%; font-size: 13px; }
  th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid #eef0f5; white-space: nowrap; }
  th { font-weight: 600; color: #556; background: #f7f8fb; }
  td.num { text-align: right; font-variant-numeric: tabular-nums; }
  .bar { display: inline-block; height: 8px; border-radius: 4px; background: #1f2a5a; vertical-align: middle; }
  .warn { color: #c0392b; font-weight: 600; }
  .muted { color: #99a; }
  .stats { display: flex; flex-wrap: wrap; gap: 12px; }
  .stat { background: #fff; border-radius: 12px; box-shadow: 0 1px 3px rgba(0,0,0,.08); padding: 12px 16px; min-width: 140px; }
  .stat b { display: block; font-size: 22px; }
  #err { color: #c0392b; white-space: pre-wrap; margin-top: 12px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Entra 入力状況チェック</h1>
  <p class="note">「組織図・連絡先」ページを作る前の確認用です。Entra のユーザー情報を読むだけで、何も書き換えません。</p>
  <p class="note" id="loginNote" data-ha-login>表示するにはサインインしてください（User.Read.All の権限が必要です）。</p>
  <button id="signInBtn" data-ha-login hidden>サインイン</button>
  <div id="status" class="note"></div>
  <div id="err"></div>
  <div id="out"></div>
</div>

<script>
const SCOPES = ['User.Read', 'User.Read.All'];
const SELECT = 'id,displayName,mail,userPrincipalName,userType,accountEnabled,assignedLicenses,department,jobTitle,mobilePhone,businessPhones,companyName,officeLocation,employeeId';
let pca, account;

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const filled = v => v != null && String(v).trim() !== '';

async function graphGetAll(url) {
  const out = [];
  while (url) {
    const r = await pca.acquireTokenSilent({ scopes: SCOPES, account });
    const res = await fetch(url, { headers: { Authorization: 'Bearer ' + r.accessToken } });
    if (!res.ok) throw new Error(`Graph ${res.status}: ${await res.text()}`);
    const j = await res.json();
    out.push(...j.value);
    url = j['@odata.nextLink'];
    document.getElementById('status').textContent = `読み込み中… ${out.length} 件`;
  }
  return out;
}

/* 表示対象かどうか。ゲスト・無効・ライセンスなし（共有メールボックスや会議室はふつうライセンスなし）を外す */
function classify(u) {
  if (u.userType === 'Guest' || /#EXT#/i.test(u.userPrincipalName || '')) return 'ゲスト・外部';
  if (u.accountEnabled === false) return '無効（共有メールボックス・会議室を含む）';
  if (!u.assignedLicenses || u.assignedLicenses.length === 0) return 'ライセンスなし（共有アカウントの可能性）';
  return '対象';
}

function rateRow(label, n, total, extra = '') {
  const pct = total ? Math.round(n / total * 100) : 0;
  return `<tr><td>${esc(label)}</td><td class="num">${n} / ${total}</td><td class="num">${pct}%</td>
    <td><span class="bar" style="width:${pct * 1.6}px"></span></td><td>${extra}</td></tr>`;
}

function countBy(list, key) {
  const m = new Map();
  list.forEach(u => { const k = filled(key(u)) ? key(u) : '（空欄）'; m.set(k, (m.get(k) || 0) + 1); });
  return [...m.entries()].sort((a, b) => b[1] - a[1]);
}

function render(users) {
  const groups = countBy(users, classify);
  const target = users.filter(u => classify(u) === '対象');
  const N = target.length;
  const byId = new Map(users.map(u => [u.id, u]));

  const withMgr = target.filter(u => u.manager && u.manager.id);
  const mgrIds = new Set(withMgr.map(u => u.manager.id));
  const noMgr = target.filter(u => !(u.manager && u.manager.id));

  // 同じ携帯番号を複数人が使っていないか（代表番号・共用端末の見分けに）
  const norm = p => String(p || '').replace(/[^\d+]/g, '');
  const phoneCount = new Map();
  target.forEach(u => { if (filled(u.mobilePhone)) phoneCount.set(norm(u.mobilePhone), (phoneCount.get(norm(u.mobilePhone)) || 0) + 1); });

  const domains = countBy(target, u => (u.mail || u.userPrincipalName || '').split('@')[1]);

  let h = '';
  h += '<h2>アカウントの内訳</h2><div class="stats">' +
    groups.map(([k, n]) => `<div class="stat"><span class="note">${esc(k)}</span><b>${n}</b></div>`).join('') + '</div>';
  h += `<p class="note">以下は「対象」${N} 人について数えています。</p>`;

  h += '<h2>欄ごとの入力率</h2><div class="card"><table><tr><th>欄</th><th>入力あり</th><th>率</th><th></th><th>メモ</th></tr>';
  h += rateRow('部署 (department)', target.filter(u => filled(u.department)).length, N);
  h += rateRow('役職 (jobTitle)', target.filter(u => filled(u.jobTitle)).length, N);
  h += rateRow('上司 (manager)', withMgr.length, N, `上司として登録されている人：${mgrIds.size} 人`);
  h += rateRow('携帯電話 (mobilePhone)', target.filter(u => filled(u.mobilePhone)).length, N);
  h += rateRow('会社電話 (businessPhones)', target.filter(u => (u.businessPhones || []).length).length, N);
  h += rateRow('会社名 (companyName)', target.filter(u => filled(u.companyName)).length, N);
  h += rateRow('勤務地 (officeLocation)', target.filter(u => filled(u.officeLocation)).length, N);
  h += rateRow('社員番号 (employeeId)', target.filter(u => filled(u.employeeId)).length, N);
  h += '</table></div>';

  h += '<h2>部署ごとの人数</h2><div class="card"><table><tr><th>部署</th><th>人数</th></tr>' +
    countBy(target, u => u.department).map(([k, n]) => `<tr><td>${esc(k)}</td><td class="num">${n}</td></tr>`).join('') + '</table></div>';

  h += '<h2>会社名・メールのドメイン（子会社の扱いを決める材料）</h2><div class="card"><table><tr><th>会社名</th><th>人数</th></tr>' +
    countBy(target, u => u.companyName).map(([k, n]) => `<tr><td>${esc(k)}</td><td class="num">${n}</td></tr>`).join('') +
    '<tr><th>ドメイン</th><th>人数</th></tr>' +
    domains.map(([k, n]) => `<tr><td>${esc(k)}</td><td class="num">${n}</td></tr>`).join('') + '</table></div>';

  h += '<h2>携帯電話が入っている人</h2>' +
    '<p class="note">会社貸与の番号かどうかを確認してください。同じ番号が複数人に入っているものは赤字です。</p>' +
    '<div class="card"><table><tr><th>名前</th><th>部署</th><th>役職</th><th>携帯電話</th><th>会社電話</th></tr>' +
    target.filter(u => filled(u.mobilePhone)).sort((a, b) => (a.department || '').localeCompare(b.department || '', 'ja'))
      .map(u => `<tr><td>${esc(u.displayName)}</td><td>${esc(u.department)}</td><td>${esc(u.jobTitle)}</td>
        <td class="${phoneCount.get(norm(u.mobilePhone)) > 1 ? 'warn' : ''}">${esc(u.mobilePhone)}</td>
        <td>${esc((u.businessPhones || []).join(', '))}</td></tr>`).join('') + '</table></div>';

  h += `<h2>上司が入っていない人（${noMgr.length} 人）</h2><div class="card"><table><tr><th>名前</th><th>部署</th><th>役職</th></tr>` +
    noMgr.sort((a, b) => (a.department || '').localeCompare(b.department || '', 'ja'))
      .map(u => `<tr><td>${esc(u.displayName)}</td><td>${esc(u.department) || '<span class="muted">（空欄）</span>'}</td><td>${esc(u.jobTitle)}</td></tr>`).join('') + '</table></div>';

  h += '<h2>対象から外したアカウント</h2><p class="note">ここに社員が混ざっていたら教えてください（除外の条件を直します）。</p>' +
    '<div class="card"><table><tr><th>区分</th><th>名前</th><th>メール</th><th>部署</th></tr>' +
    users.filter(u => classify(u) !== '対象').sort((a, b) => classify(a).localeCompare(classify(b), 'ja'))
      .map(u => `<tr><td>${esc(classify(u))}</td><td>${esc(u.displayName)}</td><td>${esc(u.mail || u.userPrincipalName)}</td><td>${esc(u.department)}</td></tr>`).join('') +
    '</table></div>';

  document.getElementById('out').innerHTML = h;
  document.getElementById('status').textContent = `全 ${users.length} アカウントを読み込みました（${new Date().toLocaleString('ja-JP')}）`;
}

async function load() {
  document.getElementById('signInBtn').hidden = true;
  document.getElementById('loginNote').hidden = true;
  HanaokaAuth.done();
  try {
    const users = await graphGetAll(`https://graph.microsoft.com/v1.0/users?$select=${SELECT}&$expand=manager($select=id,displayName)&$top=100`);
    render(users);
  } catch (e) {
    console.error(e);
    document.getElementById('err').textContent =
      '読み込めませんでした。業務アプリに User.Read.All が付いていて、管理者の同意が済んでいるか確認してください。\n\n' + e.message;
  }
}

(async () => {
  pca = new msal.PublicClientApplication(HanaokaAuth.msalConfig());
  await pca.initialize();
  await pca.handleRedirectPromise();
  account = await HanaokaAuth.restore(pca, SCOPES);
  const btn = document.getElementById('signInBtn');
  btn.onclick = async () => {
    btn.disabled = true;
    try { account = await HanaokaAuth.login(pca, SCOPES); await load(); }
    catch (e) { document.getElementById('err').textContent = 'サインインできませんでした：' + e.message; }
    finally { btn.disabled = false; }
  };
  if (account) await load(); else btn.hidden = false;
})();
</script>
</body>
</html>

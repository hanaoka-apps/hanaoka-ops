name: Regenerate dashboard_facts.json

# 手動実行(workflow_dispatch)専用。非常用(RPA専用機が止まっているときなど)。
# 定時の再生成は RPA専用機が行う: SMILEのマスタ出力(毎日0:00)のあと、毎日1:00に
# facts_only ジョブを自分で依頼する(scripts/rpa_jobs.json の schedules)。
# 日中の更新は各アプリの「再集計をリクエスト」ボタン(sales_master ジョブ)。
# 以前の定時実行(06:00 / 16:15 JST)は、GitHubの定時実行が3〜7時間遅れて
# 時刻どおりに動かなかったため止めた。
on:
  workflow_dispatch:

jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Regenerate dashboard_facts.json
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        run: python scripts/regenerate_facts.py

      - name: Job Summary
        if: always()
        run: |
          echo "## 🔄 dashboard_facts.json 再生成" >> $GITHUB_STEP_SUMMARY
          echo "実行時刻: $(TZ=Asia/Tokyo date)" >> $GITHUB_STEP_SUMMARY
          echo "ステータス: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY

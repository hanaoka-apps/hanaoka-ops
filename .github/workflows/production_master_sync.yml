# production_master_sync.yml
# SharedMasters → SharePoint リスト 自動同期（M02・M05・M06）
# 毎朝 6:00 JST (= 21:00 UTC) に実行

name: Production Master Sync

on:
  schedule:
    - cron: "0 21 * * *"   # 21:00 UTC = 翌日 6:00 JST
  workflow_dispatch:
    inputs:
      target:
        description: "同期対象 (all / m02 / m05 / m06)"
        required: false
        default: "all"

jobs:
  sync:
    name: Sync Masters to SharePoint
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install msal requests

      # ── M02 機種（品目マスタ）──────────────────────────────────
      - name: Sync M02 機種
        if: ${{ github.event_name == 'schedule' || github.event.inputs.target == 'all' || github.event.inputs.target == 'm02' }}
        env:
          AZURE_TENANT_ID:     ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID:     ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        run: python scripts/sync_m02_models.py

      # ── M05 協力工場（仕入先マスタ）────────────────────────────
      - name: Sync M05 協力工場
        if: ${{ github.event_name == 'schedule' || github.event.inputs.target == 'all' || github.event.inputs.target == 'm05' }}
        env:
          AZURE_TENANT_ID:     ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID:     ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        run: python scripts/sync_m05_partners.py

      # ── M06 客先（得意先マスタ）────────────────────────────────
      - name: Sync M06 客先
        if: ${{ github.event_name == 'schedule' || github.event.inputs.target == 'all' || github.event.inputs.target == 'm06' }}
        env:
          AZURE_TENANT_ID:     ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID:     ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        run: python scripts/sync_m06_customers.py

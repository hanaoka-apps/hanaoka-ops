name: FUJIN 日次ビルド

# 毎日 21:30 UTC = 06:30 JST に自動実行
# dashboard_facts（21:00 UTC）より後に実行
on:
  schedule:
    - cron: "30 21 * * *"
  workflow_dispatch: # 手動実行（テスト・緊急時）

permissions:
  contents: write # fujin/ をコミット・プッシュするために必要

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # ── リポジトリ取得 ──────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── Python セットアップ ──────────────────────────────────────
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install openpyxl msal requests

      # ── 手配判定の入力一式を展開 ────────────────────────────────
      # fujin_build_inputs.zip に case_packets/ ・ infer/results/(AI判定) ・
      # infer/rules_hints.jsonl ・ infer/build_enhanced_summary.py を同梱。
      # 2,125件のcase_packetを個別コミットせず、zip1個で持ち込み展開する運用。
      # これらは手配の案件セット(更新は雅さんが手動でzipを差し替えた時のみ)。
      - name: Unpack build inputs (case_packets / infer)
        run: |
          if [ -f fujin_build_inputs.zip ]; then
            unzip -o -q fujin_build_inputs.zip -d .
            echo "展開完了: case_packets $(ls case_packets/case_*.txt 2>/dev/null | wc -l)件 / infer/results $(ls infer/results/*.json 2>/dev/null | wc -l)件"
          else
            echo "[WARN] fujin_build_inputs.zip が無いため results_production の生成をスキップします"
          fi

      # ── SharePoint から CSV を取得 → data/ に保存 ───────────────
      - name: Download CSVs from SharedMasters
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        run: python scripts/download_shared_masters.py

      # ── auth_dist/ を事前作成 ──────────────────────────────────
      # build_yama.py / build_item_history.py は AUTH_DIST.exists() をチェックするため
      # 事前に作成しておかないと GitHub Actions 環境でスキップされてしまう
      - name: Prepare auth_dist/
        run: mkdir -p auth_dist

      # ── ビルド（出力先: auth_dist/） ─────────────────────────────
      - name: Build yama data (山リスト)
        run: python scripts/build_yama.py

      - name: Build item history (品目出入り)
        run: python scripts/build_item_history.py

      - name: Build shell (FUJIN.html 統合シェル・現在庫基準日設定)
        run: python scripts/build_shell.py

      # ── 手配確定/構成ツリー本体 (results_production.html) を生成 ──
      # download_shared_masters.py が落とした最新CSV(data/)を読んで生成。
      # 出力は infer/results_production.html (安定版エイリアス)。
      # zip未展開でスクリプトが無い場合はスキップ(既存のresults_production.htmlを温存)。
      - name: Build results_production (手配確定 / 構成ツリー本体)
        run: |
          if [ -f infer/build_enhanced_summary.py ]; then
            python infer/build_enhanced_summary.py
            echo "生成: infer/results_production.html ($(du -h infer/results_production.html | cut -f1))"
          else
            echo "[WARN] infer/build_enhanced_summary.py が無いためスキップ"
          fi

      - name: Build auth wrapper (FUJIN.html 認証ゲート挿入)
        run: |
          if [ -f scripts/auth_wrapper.py ]; then
            python scripts/auth_wrapper.py
          else
            echo "auth_wrapper.py が見つかりません (スキップ)"
          fi

      # ── results_production.html を auth_dist/ に配置 ──────────────
      # 認証ラッパーの後に置くことで非ラップのまま配置(親FUJIN.htmlが認証済みで
      # iframeは同一オリジン読込のため、results_production側に認証ゲートは不要)。
      # この後の rsync auth_dist/→fujin/ で配信される。
      - name: Place results_production.html into auth_dist
        run: |
          if [ -f infer/results_production.html ]; then
            cp infer/results_production.html auth_dist/results_production.html
            echo "配置完了: auth_dist/results_production.html"
          else
            echo "[WARN] infer/results_production.html が無いため配置スキップ(既存版を温存)"
          fi

      # ── auth_dist/ → fujin/ に同期 ────────────────────────────
      # auth_dist/ はビルド作業領域。GitHub Pages の実体は fujin/
      #
      # 【重要】--delete を使わないこと。
      # results_production.html は通常この日次ビルドで生成・配置されるが、
      # 万一 zip 未展開や生成失敗で auth_dist に無い場合でも、--delete だと
      # コミット済み(=直近成功時)の fujin/results_production.html を削除→push して
      # しまい、構成ツリー/手配確定タブが File not found 404 になる。
      # よって --delete は付けず、生成物の上書きコピーに留めて既存版を温存する。
      - name: Sync auth_dist to fujin/
        run: rsync -a auth_dist/ fujin/

      # ── 静的タブHTML/JSをfujin/に直接コピー ─────────────────────
      # static/ はビルドスクリプトが生成しない静的アセット（タブHTML等）
      # rsync --delete の後に実行することで削除されない
      # これがないと stock_detective.html 等が 404 になる
      - name: Copy static assets to fujin/
        run: |
          if [ -d static ]; then
            rsync -a static/ fujin/
            echo "static/ → fujin/ 直接コピー完了"
            ls static/ | head -20
          else
            echo "static/ フォルダが存在しません (スキップ)"
          fi

      # ── 診断: auth_dist/ と fujin/ の内容を確認 ─────────────────
      - name: Diagnose file placement
        run: |
          echo "=== auth_dist/ ==="
          ls -la auth_dist/ | grep -v "^total" || echo "(空)"
          echo ""
          echo "=== fujin/ ==="
          ls -la fujin/ | grep -v "^total" || echo "(空)"
          echo ""
          echo "=== stock_detective.html の場所確認 ==="
          find . -name "stock_detective.html" 2>/dev/null || echo "見つからない"

      # ── GitHub Pages へコミット＆プッシュ ────────────────────────
      - name: Commit and push fujin/
        run: |
          git config user.email "m.hanaoka@hanaoka-corp.co.jp"
          git config user.name "FUJIN Auto Build"
          # リポジトリルートに .nojekyll を配置 (Jekyll無効化)
          # fujin/ 内だけでは不十分。ルートに置かないと有効にならない
          touch .nojekyll
          git add -A fujin/ .nojekyll
          if git diff --cached --quiet; then
            echo "変更なし。push をスキップします。"
          else
            BUILD_DT=$(TZ=Asia/Tokyo date '+%Y-%m-%d %H:%M JST')
            git commit -m "Auto build ${BUILD_DT}"
            git push
            echo "GitHub Pages へのプッシュ完了: ${BUILD_DT}"
          fi

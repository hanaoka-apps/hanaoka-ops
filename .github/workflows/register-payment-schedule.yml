name: Register payment schedule events

# 総務部が毎月作成する支払決済スケジュールのうち、全社に関係する重要日を
# company-calendar@hanaoka-corp.co.jp の共有カレンダーへ登録する。
# 完全自動(定期実行)ではなく、毎月ファイルが来るたびに手動実行する運用。
# イベント一覧は workflow_dispatch の入力(events_json)としてその都度渡す。
on:
  workflow_dispatch:
    inputs:
      events_json:
        description: '登録するイベントのJSON配列 (例: [{"date":"2026-10-06","subject":"総合会議"}])'
        required: true
        type: string

jobs:
  register:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Register events
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          EVENTS_JSON: ${{ inputs.events_json }}
        run: python scripts/register_payment_schedule.py

      - name: Job Summary
        if: always()
        run: |
          echo "## 📅 支払決済スケジュール登録" >> $GITHUB_STEP_SUMMARY
          echo "実行時刻: $(TZ=Asia/Tokyo date)" >> $GITHUB_STEP_SUMMARY
          echo "ステータス: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY

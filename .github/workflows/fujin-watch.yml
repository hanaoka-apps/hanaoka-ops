name: FUJIN 差し替え検知

# SharedMasters の入力(標準原価 standard-cost/・品目マスタ・各CSV)が差し替えられたら
# 「FUJIN 日次ビルド」を自動で起動する。毎日 JST 8:00〜19:45 に15分ごとに確認(直近ビルドから60分以内は起動しない)。
on:
  schedule:
    - cron: "*/15 23,0-10 * * *"
  workflow_dispatch:

permissions:
  actions: write   # 日次ビルドの起動に必要
  contents: read

concurrency:
  group: fujin-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q msal requests
      - name: 差し替えを確認して必要ならビルド起動
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/watch_shared_masters.py

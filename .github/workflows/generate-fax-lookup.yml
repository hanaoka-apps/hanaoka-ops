name: Generate fax_relation_lookup.json

# Smile が 05:00 JST にマスタCSVを出力するため 05:30 JST (20:30 UTC) に実行
# + 手動実行可能
on:
  schedule:
    - cron: '30 20 * * *'
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install msal requests

      - name: Generate fax_relation_lookup.json
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        run: python scripts/generate_fax_lookup.py

      - name: Job Summary
        if: always()
        run: |
          echo "## 🔄 fax_relation_lookup.json 再生成" >> $GITHUB_STEP_SUMMARY
          echo "実行時刻: $(TZ=Asia/Tokyo date)" >> $GITHUB_STEP_SUMMARY
          echo "ステータス: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY

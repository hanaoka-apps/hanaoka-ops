# main にマージされたら、公開の仕組み（非公開リポジトリ hanaoka-deploy の「社内アプリを公開」）に合図を送る
# ------------------------------------------------------------
# ・ここでは合図を送るだけ。検査・組み立て・SWA への送信は hanaoka-deploy が行う（このリポジトリからは変えられない）
# ・合図に使う DEPLOY_DISPATCH_TOKEN は「hanaoka-deploy の Actions を起動できるだけ」のトークン（コードは変えられない）。福田だけが登録する
# ・GitHub Actions が自分で入れたコミット（FUJIN の日次ビルドなど）では動かない（GitHub の決まりで、そもそも起動しない）
# ・この仕組みは、2026-11-20 に福田が決めた「公開の仕組みに限り Actions を使う」の例外。データ作り・定時の処理の Actions は作らない
name: 公開の合図（hanaoka-deploy へ）

on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: notify-deploy
  cancel-in-progress: true   # 続けてマージされたら、最後の合図だけでよい（公開は毎回最新の main を使う）

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: hanaoka-deploy の「社内アプリを公開」を起動する
        env:
          GH_TOKEN: ${{ secrets.DEPLOY_DISPATCH_TOKEN }}
          SHA: ${{ github.sha }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "合図用のトークン（DEPLOY_DISPATCH_TOKEN）が未設定のため、合図を送りません"
            exit 0
          fi
          gh api -X POST repos/hanaoka-apps/hanaoka-deploy/actions/workflows/deploy.yml/dispatches \
            -f ref=main -f "inputs[mode]=deploy" -f "inputs[reason]=hanaoka-ops main ${SHA:0:7}"
          echo "合図を送りました（hanaoka-ops main ${SHA:0:7}）"

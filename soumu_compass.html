<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>総務コンパス | 花岡車輌</title>
<link rel="icon" type="image/svg+xml" href="favicon_soumu_compass.svg"><!-- コンパス（目標へ向かう） -->
<script src="https://cdn.jsdelivr.net/npm/@azure/msal-browser@3.10.0/lib/msal-browser.min.js" crossorigin="anonymous"></script>
<script src="hanaoka_auth.js"></script>
<link rel="stylesheet" href="hanaoka_theme.css?v=20261004"><!-- 色・フォントは共通ファイル -->
<style>
/* 色・角丸・影・フォントは hanaoka_theme.css（全アプリ共通）の変数だけを使う。
   ここで足すのは、この画面の中だけで使う呼び名（共通の変数を指すだけ）と、グラフ用の並び。 */
:root{
  --surface-2:var(--bg);
  --ink:var(--txt);--ink-2:var(--sub);--ink-3:var(--sub);--grid:var(--line);--axis:var(--line-strong);
  --good:var(--green);--warn:var(--orange);--crit:var(--red);--good-ink:var(--green);--warn-ink:var(--amber);--crit-ink:var(--red);
  /* 積み上げ棒の区分の色 */
  --s1:var(--navy);--s2:var(--orange);--s3:var(--green);--s4:var(--cyan);--s5:var(--purple);--s6:var(--amber);--s7:var(--red);
  /* 月別ヒートマップ（紺の濃さ） */
  --h0:var(--line);--h1:color-mix(in srgb,var(--navy) 16%,var(--surface));--h2:color-mix(in srgb,var(--navy) 36%,var(--surface));
  --h3:color-mix(in srgb,var(--navy) 62%,var(--surface));--h4:var(--navy);--h5:var(--navy-deep);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);font:14px/1.55 var(--font)}
button,select,input,textarea{font:inherit;color:inherit}
header.top{position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{max-width:1240px;margin:0 auto;padding:10px 20px;display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px}
.brand b{font-size:17px;font-weight:800;letter-spacing:.01em}
.brand small{display:block;color:var(--sub);font-size:11px;font-weight:600;margin-top:-3px}
nav.tabs{display:flex;gap:4px;margin-left:8px;flex-wrap:wrap}
nav.tabs button{background:none;border:0;padding:8px 14px;border-radius:8px;cursor:pointer;color:var(--sub);font-weight:600}
nav.tabs button[aria-selected="true"]{background:var(--navy);color:#fff;box-shadow:0 4px 12px rgba(35,38,143,.25)}
nav.tabs button:hover:not([aria-selected="true"]){background:var(--bg);color:var(--txt)}
.sp{flex:1}
.ctl{display:flex;align-items:center;gap:8px;color:var(--sub)}
select,.btn{background:var(--surface);border:1px solid var(--line-strong);border-radius:8px;padding:6px 10px;cursor:pointer}
.btn:hover,select:hover{border-color:var(--navy)}
.btn.primary{background:var(--navy);color:#fff;border-color:var(--navy);font-weight:600}
.btn.primary:hover{background:var(--navy-deep)}
main{max-width:1240px;margin:0 auto;padding:18px 20px 60px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:18px}
.kpi,.sec,.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.kpi{padding:12px 14px}
.kpi .l{color:var(--sub);font-size:12px}.kpi .v{font-size:28px;font-weight:800;line-height:1.2}.kpi .s{color:var(--sub);font-size:11px}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:0 0 14px}
.chip{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600;border:1px solid var(--line-strong);color:var(--sub);background:var(--surface);white-space:nowrap}
.chip.good{color:var(--good-ink);border-color:var(--good);background:var(--green-soft)}
.chip.warn{color:var(--warn-ink);border-color:var(--warn);background:var(--amber-soft)}
.chip.info{color:var(--navy);border-color:var(--navy);background:var(--navy-soft)}
.chip.mute{color:var(--sub)}
.chip.conf{background:var(--navy-soft);color:var(--navy);border-color:var(--navy)}
.pill{cursor:pointer}
.pill[aria-pressed="true"]{background:var(--navy-soft);color:var(--navy);border-color:var(--navy)}
.sec{margin-bottom:16px;overflow:hidden}
.sec>h2{margin:0;padding:12px 16px;font-size:15px;color:#fff;background:linear-gradient(90deg,var(--navy),var(--cyan));display:flex;gap:10px;align-items:center}
.sec>h2 .n{color:rgba(255,255,255,.8);font-weight:400;font-size:12px}
.cols{display:grid;grid-template-columns:230px 1fr 1fr;border-bottom:1px solid var(--line)}
.cols:last-child{border-bottom:0}
.cols.head{background:var(--bg);color:var(--sub);font-size:12px;font-weight:700}
.cols>div{padding:12px 16px;min-width:0}
.cols>div+div{border-left:1px solid var(--line)}
.cols .tt{font-weight:700;margin-bottom:4px;cursor:pointer}
.cols .tt:hover{color:var(--navy)}
.cols .id{color:var(--sub);font-size:11px;font-weight:400;margin-right:4px}
ul.b{margin:0;padding:0;list-style:none}
ul.b li{position:relative;padding:3px 0 3px 14px}
ul.b li::before{content:"";position:absolute;left:2px;top:.85em;width:5px;height:5px;border-radius:50%;background:var(--line-strong)}
ul.b li.m::before{background:var(--navy)}
.who{display:inline-block;min-width:1.6em;padding:0 5px;margin-right:6px;border-radius:4px;background:var(--bg);border:1px solid var(--line);font-size:11px;color:var(--sub);text-align:center}
.mut{color:var(--sub)}
.add{background:none;border:1px dashed var(--line-strong);color:var(--sub);border-radius:8px;padding:3px 10px;cursor:pointer;font-size:12px;margin-top:6px}
.add:hover{border-color:var(--navy);color:var(--navy)}
.x{background:none;border:0;color:var(--sub);cursor:pointer;padding:0 4px}
.x:hover{color:var(--crit-ink)}
.tbl{width:100%;border-collapse:collapse}
.tbl th,.tbl td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.tbl th{font-size:12px;color:var(--sub);background:var(--bg)}
.tbl tr.row{cursor:pointer}.tbl tr.row:hover td{background:var(--bg)}
.cell{display:inline-block;width:28px;height:22px;border-radius:4px;text-align:center;font-size:11px;line-height:22px;margin-right:2px;color:var(--txt)}
.cell.d{color:#fff}
.grid5{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:14px}
.card{padding:14px 16px}
.card h3{margin:0 0 2px;font-size:16px}
.stack{display:flex;height:16px;border-radius:4px;overflow:hidden;gap:2px;margin:10px 0 6px;background:var(--line)}
.stack i{display:block;min-width:2px}
.leg{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--sub)}
.leg span::before{content:"";display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;background:var(--c)}
dialog{border:1px solid var(--line-strong);border-radius:var(--radius);background:var(--surface);color:var(--txt);padding:0;width:min(760px,94vw);max-height:88vh;box-shadow:var(--shadow)}
dialog::backdrop{background:rgba(22,26,61,.45)}
.dlg{padding:18px 20px;overflow:auto;max-height:88vh}
.dlg h3{margin:0 0 4px}
.dlg label{display:block;font-size:12px;color:var(--sub);margin:10px 0 3px}
.dlg textarea,.dlg input,.dlg select{width:100%;background:var(--surface);border:1px solid var(--line-strong);border-radius:8px;padding:7px 9px}
.dlg textarea{min-height:64px;resize:vertical}
.row2{display:flex;gap:10px}.row2>*{flex:1}
.ev{max-height:230px;overflow:auto;border:1px solid var(--line);border-radius:8px;padding:6px 10px;background:var(--bg)}
.note{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 14px;color:var(--sub);font-size:13px}
.note b{color:var(--txt)}
body.present{font-size:17px}
body.present header.top .hide-p,body.present .kpis,body.present .add,body.present .x,body.present .bar.filters{display:none}
body.present .draft{display:none}
body.present .cols>div{padding:16px 20px}
body.present .cols.head{font-size:14px}
@media (max-width:820px){.cols{grid-template-columns:1fr}.cols>div+div{border-left:0;border-top:1px solid var(--line)}}
.hint{color:var(--sub);font-size:12px}
.boot{max-width:520px;margin:12vh auto;padding:24px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);text-align:center}
.boot.wide{max-width:680px;text-align:left}
.boot pre{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;white-space:pre-wrap;min-height:1.6em;margin:6px 0 0;font:12.5px/1.6 var(--font)}
.boot .stp{margin:14px 0}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--txt);color:#fff;padding:10px 16px;border-radius:10px;font-size:13px;max-width:90vw;z-index:50}
</style>
</head>
<body>
<header class="top">
 <div class="top-in">
  <div class="brand">
   <span class="hx-mark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M15.5 8.5l-2 5-5 2 2-5z"/></svg></span>
   <div><b>総務コンパス</b><small id="fyLabel">総務部 目標管理</small></div>
  </div>
  <nav class="tabs hide-p" role="tablist" id="tabs"></nav>
  <div class="sp"></div>
  <div class="ctl" hidden><span>年度</span><select id="fySel"></select></div>
  <div class="ctl"><span>対象月</span><select id="month"></select></div>
  <button class="btn" id="presentBtn">発表モード</button>
  <span class="hint hide-p" id="who"></span>
 </div>
</header>
<main id="app"></main>
<div id="toast" role="status" hidden></div>
<dialog id="dlg"><div class="dlg" id="dlgBody"></div></dialog>

<script src="soumu_compass_graph.js"></script>
<script>
let DATA,MEM=[],MS=[],MONTHS=[],ASOF=new Date(),ITEM={},S={manual:[],verdict:{},summary:{}},LK=[],RP=[];
const STALE_DAYS=60;   // この日数以上、日報に動きがない項目は「停滞?」（仮判定）
const ml=m=>parseInt(m.slice(5),10)+'月';
const nextMonth=m=>{let y=+m.slice(0,4),k=+m.slice(5)+1;if(k>12){y++;k=1}return y+'-'+String(k).padStart(2,'0')};
const prevMonth=m=>{let y=+m.slice(0,4),k=+m.slice(5)-1;if(k<1){y--;k=12}return y+'-'+String(k).padStart(2,'0')};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36);

/* ---------- データ読み込み（SharePointから） ---------- */
/* 年度は4月始まり。目標マスタは年度ごとに持つ（同じ目標IDでも年度が違えば別の目標）。
   日報・紐づけは日付で年度が決まる。表示する年度 FY は、画面の「年度」で切り替える。 */
let FY=0,NOTICE='',RAW_FYS=[];
const fyOf=d=>+d.slice(0,4)-(+d.slice(5,7)<4?1:0);
function applyData(raw){
  const FYS=[...new Set(raw.items.map(i=>i.fy))].sort();RAW_FYS=FYS;
  const lastAll=raw.reps.map(r=>r.d).sort().pop()||new Date().toISOString().slice(0,10);
  const nowFy=fyOf(lastAll);
  /* 表示する年度: 選んだ年度。なければ「日報の最新の年度」以下で目標マスタがある一番新しい年度 */
  if(!FYS.includes(FY))FY=[...FYS].reverse().find(y=>y<=nowFy)||FYS[FYS.length-1]||nowFy;
  NOTICE=nowFy>FYS[FYS.length-1]?`${nowFy}年度の日報が入っていますが、${nowFy}年度の目標マスタが未登録です。「データ・運用」から取り込んでください（${FY}年度を表示中）。`:'';
  const fyS=FY+'-04-01',fyE=(FY+1)+'-04-01',inFY=d=>d>=fyS&&d<fyE;
  document.getElementById('fyLabel').textContent=FY+'年度 総務部 目標管理';
  const sel=document.getElementById('fySel');
  sel.innerHTML=FYS.map(y=>`<option value="${y}" ${y===FY?'selected':''}>${y}年度${y===FYS[FYS.length-1]?'':'（過去）'}</option>`).join('');
  sel.parentElement.hidden=FYS.length<2;
  const reps=raw.reps.filter(r=>inFY(r.d)),links=raw.links.filter(l=>inFY(l.d));
  MEM=[...new Set(reps.map(r=>r.mem).concat(links.map(l=>l.mem)))].sort((a,b)=>a.localeCompare(b,'ja'));
  MS=MEM.map(n=>n.split(/[ 　]/)[0]);
  const wi=Object.fromEntries(MEM.map((n,i)=>[n,i]));
  reps.forEach(r=>{r.w=wi[r.mem]});links.forEach(l=>{l.w=wi[l.mem]});
  const items=raw.items.filter(i=>i.fy===FY);
  const np=items.reduce((m,i)=>Math.max(m,i.p+1),0),pillars=Array.from({length:np},()=>'');
  items.forEach(i=>{pillars[i.p]=i.pillarName||''});
  DATA={items,pillars,reps,links};
  ITEM=Object.fromEntries(items.map(i=>[i.id,i]));
  const verdict={};Object.keys(raw.verdict).forEach(k=>{if(k.startsWith(FY+'|'))verdict[k.slice(5)]=raw.verdict[k]});
  const m0=fyS.slice(0,7),m1=fyE.slice(0,7);
  S={manual:raw.manual.filter(x=>x.month>=m0&&x.month<m1),verdict,summary:raw.summary};
  LK=links;RP=reps;
  const last=reps.map(r=>r.d).sort().pop()||fyS;
  ASOF=new Date(last+'T00:00:00');
  const cur=last.slice(0,7);MONTHS=[];
  for(let m=m0;m<=cur;m=nextMonth(m))MONTHS.push(m);
  if(!MONTHS.includes(MONTH)&&!isHalf(MONTH))MONTH=MONTHS.includes(prevMonth(cur))?prevMonth(cur):cur;
}
async function reload(){applyData(await scLoad());render()}
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>t.hidden=true,6000)}
let Q=Promise.resolve();   // 保存は順番に実行する（作成直後の更新で二重登録しないため）
function run(fn){Q=Q.then(fn).catch(async e=>{toast('保存に失敗しました。画面を最新の状態に戻します（'+e.message+'）');try{await reload()}catch(_){}});return Q}

/* ---------- 起動・サインイン・初期設定 ---------- */
function bootMsg(h,wide){document.getElementById('app').innerHTML='<div class="boot'+(wide?' wide':'')+'">'+h+'</div>'}
function bootError(e){bootMsg('<b>読み込めませんでした</b><p>'+esc(e.message||e)+'</p><button class="btn" onclick="boot()">再読み込み</button>')}
async function boot(){
  try{
    bootMsg('読み込み中…');
    if(!await scInitAuth()){showLogin();return}
    await start();
  }catch(e){bootError(e)}
}
function showLogin(){
  bootMsg('<b>総務コンパス</b><p data-ha-login>花岡車輌のMicrosoftアカウントでサインインしてください。</p><button class="btn primary" id="signin" data-ha-login>Microsoftでサインイン</button>');
  document.getElementById('signin').onclick=async()=>{try{await scSignIn();await start()}catch(e){HanaokaAuth.done();bootError(e)}};
}
async function start(){
  document.getElementById('who').textContent=scAccount().username||'';
  if((await scMissingLists()).length){await showSetup();return}
  applyData(await scLoad());
  if(!DATA.items.length){await showSetup();return}
  render();
}
/* 初期設定（最初の1回）: リスト作成 → 目標マスタ取込 → 日報の取込用JSON取込 */
async function showSetup(){
  const miss=await scMissingLists();
  bootMsg(`<b>初期設定</b><p class="mut">最初の1回だけ行います。データのファイルはこのPCから直接SharePointへ送られます。</p>
   <div class="stp"><b>① リストを作る</b> ${miss.length?'<button class="btn primary" id="stList">作成</button>':'<span class="chip good">作成済み</span>'}<pre id="stLog1"></pre></div>
   <div class="stp"><b>② 目標マスタを取り込む</b><br><input type="file" id="stMaster" accept=".json" ${miss.length?'disabled':''}><pre id="stLog2"></pre></div>
   <div class="stp"><b>③ 日報の取込用JSONを取り込む</b><br><input type="file" id="stPkg" accept=".json" ${miss.length?'disabled':''}><pre id="stLog3"></pre></div>
   <button class="btn" onclick="start().catch(bootError)">総務コンパスを開く</button>`,true);
  const log=(n,t)=>{document.getElementById('stLog'+n).textContent=t};
  const guard=(n,fn)=>async e=>{try{await fn(e)}catch(err){log(n,'失敗: '+err.message)}};
  const stList=document.getElementById('stList');
  if(stList)stList.onclick=guard(1,async()=>{log(1,'作成中…');const made=await scCreateLists();log(1,made.join(', ')+' を作成しました');showSetup()});
  document.getElementById('stMaster').onchange=guard(2,async e=>{
    const r=await scImportMaster(JSON.parse(await e.target.files[0].text()),(n,t)=>log(2,'書き込み中 '+n+'/'+t));
    log(2,r.fy+"年度 完了: 新規"+r.added+'／更新'+r.updated+'／変更なし'+r.same)});
  document.getElementById('stPkg').onchange=guard(3,async e=>{
    const r=await scImportPackage(JSON.parse(await e.target.files[0].text()),(n,t)=>log(3,'書き込み中 '+n+'/'+t));
    log(3,'完了\n日報: 新規'+r.reports.added+'／更新'+r.reports.updated+'／変更なし'+r.reports.same+'\n紐づけ: 新規'+r.links.added+'／更新'+r.links.updated+'／変更なし'+r.links.same)});
}
const strong=l=>l.c!=='L';
function statusOf(id){
  const ls=LK.filter(l=>l.i===id&&strong(l));
  if(!ls.length)return{k:'none',label:'日報に動きなし',cls:'mute',icon:'－',n:0};
  const last=ls.map(l=>l.d).sort().pop();
  const dd=ls.filter(l=>l.s==='完了').map(l=>l.d).sort().pop();
  const ex=ls.filter(l=>l.s==='実行').map(l=>l.d).sort().pop()||'0000';
  const days=(ASOF-new Date(last+'T00:00:00'))/864e5;
  const base={n:ls.length,last};
  if(dd&&dd>=ex)return{...base,k:'done',label:'完了報告あり',cls:'good',icon:'✓'};
  if(days>STALE_DAYS)return{...base,k:'stale',label:'停滞?',cls:'warn',icon:'▲'};
  if(ls.every(l=>l.s==='検討'))return{...base,k:'plan',label:'検討段階',cls:'info',icon:'◔'};
  return{...base,k:'go',label:'進行中',cls:'info',icon:'▶'};
}
function chip(id){
  const v=S.verdict[id];const st=statusOf(id);
  let h=`<span class="chip ${st.cls}" title="日報からの仮判定">${st.icon} ${st.label}</span>`;
  if(v&&v.label&&v.label!=='未確認')h+=` <span class="chip conf" title="確認済みの判定">確認済: ${esc(v.label)}</span>`;
  return h;
}
/* ---------- 期間（月／上期／下期）。MONTH には 'YYYY-MM' か 'H1'（4〜9月）／'H2'（10〜3月）が入る ---------- */
const isHalf=m=>m==='H1'||m==='H2';
function perMonths(m,y=FY){
  if(m==='H1')return[4,5,6,7,8,9].map(k=>y+'-0'+k);
  if(m==='H2')return[10,11,12].map(k=>y+'-'+k).concat([1,2,3].map(k=>(y+1)+'-0'+k));
  return[m];
}
const inPer=(d,m)=>perMonths(m).some(x=>d.startsWith(x));
const perLabel=m=>m==='H1'?'上期（4〜9月）':m==='H2'?'下期（10〜3月）':ml(m);
const nextPer=m=>m==='H1'?{months:perMonths('H2'),label:'下期（10〜3月）'}:m==='H2'?{months:perMonths('H1',FY+1),label:(FY+1)+'年度の上期'}:{months:[nextMonth(m)],label:ml(nextMonth(m))};
const addMonth=()=>{const ms=perMonths(MONTH).filter(x=>MONTHS.includes(x));return ms.length?ms[ms.length-1]:MONTHS[MONTHS.length-1]};   // 追記・予定の既定の月
const sumKey=(m,id)=>(isHalf(m)?FY+'-'+m:m)+'|'+id;
const doneHead=m=>isHalf(m)?perLabel(m):'先月（'+ml(m)+'）';
const planHead=(m,np)=>isHalf(m)?'次の期：'+np.label:'今月（'+np.label+'）';
function monthLinks(id,m){return LK.filter(l=>l.i===id&&strong(l)&&inPer(l.d,m))}
function bulletsFor(id,m){
  const key=sumKey(m,id);
  if(S.summary[key]&&S.summary[key].text)return S.summary[key].text.split('\n').filter(Boolean).map(t=>({t,m:true}));
  const ls=monthLinks(id,m).sort((a,b)=>a.d<b.d?-1:1);const seen=new Set();const out=[];
  ls.forEach(l=>{if(seen.has(l.e))return;seen.add(l.e);out.push({t:l.e,w:MS[l.w],d:l.d.slice(5).replace('-','/')})});
  return out;
}

/* ---------- views ---------- */
let VIEW='present',MONTH='',FILTER={hideEmpty:true,member:'all',pillar:'all',dmem:'all'};
const TABS=[['present','発表'],['goals','目標一覧'],['detail','日報・紐づけ明細'],['members','メンバー別'],['offsheet','目標外の取り組み'],['data','データ・運用']];
function renderTabs(){document.getElementById('tabs').innerHTML=TABS.map(([k,l])=>`<button role="tab" aria-selected="${VIEW===k}" data-v="${k}">${l}</button>`).join('')}
function renderMonthSel(){
  const last=MONTHS[MONTHS.length-1],has=h=>perMonths(h).some(x=>MONTHS.includes(x));
  const halves=['H1','H2'].filter(has).map(h=>`<option value="${h}" ${h===MONTH?'selected':''}>${perLabel(h)}</option>`).join('');
  const months=MONTHS.map(m=>`<option value="${m}" ${m===MONTH?'selected':''}>${ml(m)}${m===last?'（今月）':m===prevMonth(last)?'（先月）':''}</option>`).join('');
  document.getElementById('month').innerHTML=(halves?`<optgroup label="半期">${halves}</optgroup>`:'')+`<optgroup label="月">${months}</optgroup>`;
}

function kpis(){
  const sts=DATA.items.map(i=>statusOf(i.id));
  const moved=DATA.items.filter(i=>monthLinks(i.id,MONTH).length).length;
  const reps=RP.filter(r=>inPer(r.d,MONTH));
  const linked=new Set(LK.filter(strong).map(l=>l.rid));
  const lr=reps.filter(r=>linked.has(r.rid)).length;
  const cnt=k=>sts.filter(s=>s.k===k).length;
  return `<div class="kpis">
   <div class="kpi"><div class="l">${perLabel(MONTH)}に動きのあった目標</div><div class="v">${moved}<span style="font-size:14px;color:var(--ink-3)"> / ${DATA.items.length}</span></div><div class="s">日報で確認できた項目</div></div>
   <div class="kpi"><div class="l">日報に動きなし（通期）</div><div class="v">${cnt('none')}</div><div class="s">確認待ち</div></div>
   <div class="kpi"><div class="l">停滞の疑い</div><div class="v">${cnt('stale')}</div><div class="s">${STALE_DAYS}日以上動きなし</div></div>
   <div class="kpi"><div class="l">進行中・検討・完了</div><div class="v">${cnt('go')+cnt('plan')+cnt('done')}</div><div class="s">通期の判定</div></div>
   <div class="kpi"><div class="l">${perLabel(MONTH)}の日報が目標に結びつく率</div><div class="v">${reps.length?Math.round(lr/reps.length*100):0}%</div><div class="s">${lr}/${reps.length}件</div></div>
  </div>`;
}

const isDraft=x=>x.status==='draft';
function planLi(x){
  return `<li class="m${isDraft(x)?' draft':''}"><span class="who">${esc(x.who)}</span>${esc(x.text)}
   ${isDraft(x)?'<span class="chip warn" title="Claudeが作った下書きです。直して確定すると発表に出ます">下書き</span> ':''}<button class="add" data-plan="${x.id}">${isDraft(x)?'直して確定':'編集'}</button><button class="x" data-del="${x.id}" title="削除">×</button></li>`;
}
function viewPresent(){
  const np=nextPer(MONTH),nm=np.months[0];
  let h=kpis();
  h+=`<div class="bar filters"><span class="hint">表示:</span>
   <span class="chip pill" role="button" tabindex="0" aria-pressed="${FILTER.hideEmpty}" data-f="hideEmpty">動きのある項目のみ</span>
   <span class="ctl">メンバー <select data-f="member"><option value="all">全員</option>${MS.map((n,i)=>`<option value="${i}" ${String(FILTER.member)===String(i)?'selected':''}>${n}</option>`).join('')}</select></span>
   <span class="ctl">重点柱 <select data-f="pillar"><option value="all">すべて</option>${DATA.pillars.map((p,i)=>`<option value="${i}" ${String(FILTER.pillar)===String(i)?'selected':''}>${'①②③④⑤'[i]} ${p}</option>`).join('')}</select></span></div>`;
  DATA.pillars.forEach((p,pi)=>{
    if(FILTER.pillar!=='all'&&String(FILTER.pillar)!==String(pi))return;
    const items=DATA.items.filter(i=>i.p===pi);
    let rows='';let shown=0;
    items.forEach(it=>{
      let bl=bulletsFor(it.id,MONTH);
      if(FILTER.member!=='all')bl=bl.filter(b=>b.m||b.w===MS[FILTER.member]);
      const man=S.manual.filter(x=>x.item===it.id&&perMonths(MONTH).includes(x.month)&&x.type==='実績'&&(FILTER.member==='all'||MS[FILTER.member]===x.who));
      const plan=S.manual.filter(x=>x.item===it.id&&np.months.includes(x.month)&&x.type==='予定'&&(FILTER.member==='all'||MS[FILTER.member]===x.who));
      const has=bl.length||man.length||plan.length;
      if(FILTER.hideEmpty&&!has)return;
      shown++;
      rows+=`<div class="cols"><div><div class="tt" data-open="${it.id}"><span class="id">${it.id}</span>${esc(it.t)}</div>${chip(it.id)}</div>
       <div><ul class="b">${bl.slice(0,5).map(b=>`<li class="${b.m?'m':''}">${b.w?`<span class="who">${b.w}</span>`:''}${esc(b.t)}${b.d?` <span class="mut">(${b.d})</span>`:''}</li>`).join('')}${bl.length>5?`<li class="mut">ほか${bl.length-5}件（「要約を編集」で発表用にまとめられます）</li>`:''}
        ${man.map(x=>`<li class="m"><span class="who">${esc(x.who)}</span>${esc(x.text)} <span class="chip conf">追記</span><button class="x" data-del="${x.id}" title="削除">×</button></li>`).join('')}</ul>
        ${!has?'<span class="mut">日報での動きなし</span>':''}
        <div><button class="add" data-add="${it.id}|実績|${addMonth()}">＋日報にない実績を追記</button> <button class="add" data-sum="${it.id}">要約を編集</button></div></div>
       <div><ul class="b">${plan.map(planLi).join("")}</ul>
        ${!plan.length?'<span class="mut">予定は未入力</span>':''}
        <div><button class="add" data-add="${it.id}|予定|${nm}">＋${np.label}の予定を追加</button></div></div></div>`;
    });
    h+=`<section class="sec"><h2>${'①②③④⑤'[pi]} ${p}<span class="n">${shown}項目を表示（全${items.length}）</span></h2>
     <div class="cols head"><div>目標の取り組み・状態</div><div>${doneHead(MONTH)}の実施内容</div><div>${planHead(MONTH,np)}の予定</div></div>
     ${rows||'<div class="cols"><div style="grid-column:1/-1" class="mut">この月に動きのある項目はありません。</div></div>'}</section>`;
  });
  h+=offSheetBlock(MONTH,true);
  return h;
}

function offSheetBlock(m,compact){
  const reps=RP.filter(r=>inPer(r.d,m)&&r.g);
  const np=nextPer(m),nm=np.months[0];
  const by={};
  reps.forEach(r=>{(by[r.g]=by[r.g]||{days:0,who:{},labels:{}});const g=by[r.g];g.days++;g.who[MS[r.w]]=(g.who[MS[r.w]]||0)+1;g.labels[r.o]=(g.labels[r.o]||0)+1});
  const gs=Object.keys(by).sort((a,b)=>by[b].days-by[a].days);
  const man=S.manual.filter(x=>x.item==='OFF');
  let rows=gs.map(g=>{const o=by[g];
    const plan=man.filter(x=>np.months.includes(x.month)&&x.type==='予定'&&x.group===g);
    return `<div class="cols"><div><div class="tt">${esc(g)}</div><span class="chip mute">目標シートにない</span></div>
    <div><div>${Object.entries(o.who).sort((a,b)=>b[1]-a[1]).map(([w,n])=>`<span class="who">${w}</span>${n}日`).join('　')}</div>
    <div class="mut" style="margin-top:4px">${Object.entries(o.labels).sort((a,b)=>b[1]-a[1]).slice(0,6).map(([k,v])=>esc(k)+'('+v+')').join('、')}</div></div>
    <div><ul class="b">${plan.map(planLi).join("")}</ul>
    ${!plan.length?'<span class="mut">予定は未入力</span>':''}<div><button class="add" data-add="OFF|予定|${nm}|${esc(g)}">＋予定を追加</button></div></div></div>`}).join('');
  return `<section class="sec"><h2>目標シートにない取り組み<span class="n">${perLabel(m)}の日報から。目標項目に当てはまらない仕事</span></h2>
   <div class="cols head"><div>取り組み</div><div>${doneHead(m)}の実施内容（日報の日数）</div><div>${planHead(m,np)}の予定</div></div>${rows||'<div class="cols"><div style="grid-column:1/-1" class="mut">この月の該当はありません。</div></div>'}</section>`;
}

function viewGoals(){
  let h=kpis();
  h+=`<section class="sec"><h2>目標43項目の進捗（日報ベース・仮判定）<span class="n">行をクリックで詳細・判定入力</span></h2><div style="overflow:auto"><table class="tbl"><thead><tr><th>項目</th><th>状態</th><th>担当（日報）</th><th>件数</th><th>最終日</th><th>${MONTHS.map(m=>ml(m)).join(' ')}</th></tr></thead><tbody>`;
  DATA.pillars.forEach((p,pi)=>{
    h+=`<tr><td colspan="6" style="background:var(--surface-2);font-weight:700">${'①②③④⑤'[pi]} ${p}</td></tr>`;
    DATA.items.filter(i=>i.p===pi).forEach(it=>{
      const st=statusOf(it.id);const ls=LK.filter(l=>l.i===it.id&&strong(l));
      const who=[...new Set(ls.map(l=>MS[l.w]))];
      const cells=MONTHS.map(m=>{const n=ls.filter(l=>l.d.startsWith(m)).length;const lv=n===0?0:n<2?1:n<4?2:n<7?3:n<12?4:5;
        return `<span class="cell ${lv>=3?'d':''}" style="background:var(--h${lv})" title="${ml(m)}: ${n}件">${n||''}</span>`}).join('');
      h+=`<tr class="row" data-open="${it.id}"><td><span class="mut" style="font-size:11px">${it.id}</span> ${esc(it.t)}</td><td>${chip(it.id)}</td><td>${who.map(w=>`<span class="who">${w}</span>`).join('')||'<span class="mut">－</span>'}</td><td>${st.n}</td><td>${st.last?st.last.slice(5).replace('-','/'):'<span class="mut">－</span>'}</td><td style="white-space:nowrap">${cells}</td></tr>`;
    });
  });
  return h+`</tbody></table></div></section><p class="hint">セルの濃さは月ごとの紐づけ件数。件数は日報の記述から読み取った確度「高・中」のみ。</p>`;
}

const CATS=[['目標に紐づく','--s1'],['目標外の取り組み','--s2'],['経理の定常','--s3'],['労務・勤怠の定常','--s4'],['採用・面談の定常','--s5'],['庶務・突発','--s7'],['システム対応・その他','--axis']];
function catOf(r,linked){
  if(linked.has(r.rid))return 0;
  if(r.o)return 1;
  const c=(r.r||'').split(',')[0];
  return {R1:2,R2:3,R3:4,R4:5,R5:6,R6:6}[c]??6;
}
function viewMembers(){
  const linked=new Set(LK.filter(strong).map(l=>l.rid));
  let h=`<p class="hint" style="margin-top:0">${perLabel(MONTH)}の日報の中身。紐づき率の低さは貢献度の低さではありません。定常業務が中心の担当は低く出ます。</p><div class="grid5">`;
  MEM.forEach((n,wi)=>{
    const reps=RP.filter(r=>r.w===wi&&inPer(r.d,MONTH));
    const cnt=CATS.map(()=>0);reps.forEach(r=>cnt[catOf(r,linked)]++);
    const tot=reps.length||1;
    const pl=DATA.pillars.map((p,pi)=>LK.filter(l=>l.w===wi&&strong(l)&&inPer(l.d,MONTH)&&ITEM[l.i]&&ITEM[l.i].p===pi).length);
    h+=`<div class="card"><h3>${n}</h3><div class="mut">${perLabel(MONTH)}の日報 ${reps.length}件 ／ 目標に紐づく ${Math.round(cnt[0]/tot*100)}%</div>
     <div class="stack">${cnt.map((c,i)=>c?`<i style="width:${c/tot*100}%;background:var(${CATS[i][1]})" title="${CATS[i][0]}: ${c}件"></i>`:'').join('')}</div>
     <div class="leg">${CATS.map((c,i)=>cnt[i]?`<span style="--c:var(${c[1]})">${c[0]} ${c2(cnt[i],tot)}</span>`:'').join('')}</div>
     <div style="margin-top:10px;font-size:12px;color:var(--ink-2)">重点柱別の紐づき: ${pl.map((v,i)=>`${'①②③④⑤'[i]}${v}`).join('　')}</div></div>`;
  });
  return h+'</div>';
}
const c2=(c,t)=>`${c}件(${Math.round(c/t*100)}%)`;

function viewOff(){
  return `<p class="hint" style="margin-top:0">日報にあるのに、目標シートのどの項目にも当たらない仕事。項目の追加候補です。</p>`+offSheetBlock(MONTH,false)+`<div class="note"><b>見方:</b> 日数が多い取り組みほど、目標シートに項目として追加するかを決める候補です。</div>`;
}

   <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" id="exp">手入力データを書き出す（バックアップ）</button></div>
   <div class="hint" style="margin-top:8px">手入力: 追記・予定 ${S.manual.length}件／判定 ${Object.keys(S.verdict).length}件／要約 ${Object.keys(S.summary).length}件</div></div>

function render(){
  document.body.classList.toggle('present',!!window.__present);
  renderTabs();renderMonthSel();
  const f={present:viewPresent,goals:viewGoals,detail:viewDetail,members:viewMembers,offsheet:viewOff,data:viewData}[VIEW];
  document.getElementById('app').innerHTML=(NOTICE?'<div class="note" style="margin-bottom:14px"><b>お知らせ:</b> '+esc(NOTICE)+'</div>':'')+f();
  if(VIEW==='data')bindData();
}

function dlgSum(id){
  const m=MONTH;const cur=bulletsFor(id,m).map(b=>b.t).join('\n');
  openDlg(`<h3>発表用の要約を編集</h3><div class="mut">${esc(ITEM[id].t)} ／ ${ml(m)}</div>
  <label>1行1項目。空にすると日報からの自動表示に戻ります</label><textarea id="fSum" style="min-height:140px">${esc(S.summary[sumKey(m,id)]?S.summary[sumKey(m,id)].text:cur)}</textarea>

  document.getElementById('fCancel').onclick=closeDlg;
  document.getElementById('fOk').onclick=()=>{const v=document.getElementById('fSum').value.trim(),k=sumKey(m,id),old=S.summary[k];

  <div class="row2"><div><label>確認済みの判定</label><select id="vLabel">${['未確認','完了','進行中','検討中','停滞','未着手','対象外'].map(x=>`<option ${v.label===x?'selected':''}>${x}</option>`).join('')}</select></div></div>
  <label>メモ（日報にない進捗・理由など）</label><textarea id="vNote">${esc(v.note)}</textarea>
  <div style="display:flex;gap:8px;justify-content:space-between;margin-top:14px"><button class="btn" id="vAdd">＋実績を追記</button><div style="display:flex;gap:8px"><button class="btn" id="fCancel">閉じる</button><button class="btn primary" id="fOk">判定を保存</button></div></div>`);
  document.getElementById('fCancel').onclick=closeDlg;
  document.getElementById('vAdd').onclick=()=>dlgAdd(`${id}|実績|${addMonth()}`);
  document.getElementById('fOk').onclick=()=>{const label=document.getElementById('vLabel').value,note=document.getElementById('vNote').value.trim();
    const old=S.verdict[id];
    if(label==='未確認'&&!note){if(old){delete S.verdict[id];run(()=>scRemoveState(old._sp))}}
    else{const nv=old||{};nv.label=label;nv.note=note;S.verdict[id]=nv;run(()=>scSaveVerdict(FY+"|"+id,nv))}
    closeDlg();render()};
}

/* ---------- 明細（日報・紐づけ）の編集・追加 ---------- */
const ROUTINES=[['','（なし）'],['R1','経理の定常'],['R2','労務・勤怠の定常'],['R3','採用・面談の定常'],['R4','庶務・突発'],['R5','システム・PC対応'],['R6','その他']];
const STAGES=['検討','実行','完了'],CONFS=[['H','高'],['M','中'],['L','低（集計に入れない）']];
const opt=(v,t,sel)=>`<option value="${esc(v)}" ${v===sel?'selected':''}>${esc(t)}</option>`;
const itemOpts=sel=>DATA.items.map(i=>opt(i.id,i.id+' '+i.t,sel)).join('');
const memOpts=sel=>MEM.map(n=>opt(n,n,sel)).join('');
const groupList=()=>[...new Set(RP.map(r=>r.g).filter(Boolean))].sort();
const btnRow=(left,right)=>`<div style="display:flex;gap:8px;justify-content:space-between;margin-top:14px"><div>${left}</div><div style="display:flex;gap:8px">${right}</div></div>`;
const linksOf=rid=>rid?LK.filter(l=>l.rid===rid):[];

/* 紐づけ1件の追加・編集。key: 既存の紐づけ（無ければ新規）、pre: 新規の初期値、back: 閉じたあとに開き直す画面 */
function dlgLink(key,pre,back){
  const old=key?LK.find(l=>l.key===key):null;
  const v=old||Object.assign({i:DATA.items[0].id,rid:'',d:addMonth()+"-01",mem:MEM[0]||'',c:'H',s:'実行',e:''},pre||{});
  openDlg(`<h3>紐づけを${old?'編集':'追加'}</h3><div class="mut">日報の仕事が、どの目標をどこまで進めたか</div>
  <label>目標の項目</label><select id="lItem">${itemOpts(v.i)}</select>
  <div class="row2"><div><label>日付</label><input type="date" id="lDate" value="${esc(v.d)}"></div><div><label>担当</label><select id="lMem">${memOpts(v.mem)}</select></div></div>
  <div class="row2"><div><label>段階</label><select id="lStage">${STAGES.map(x=>opt(x,x,v.s)).join('')}</select></div><div><label>確度</label><select id="lConf">${CONFS.map(([k,t])=>opt(k,t,v.c)).join('')}</select></div></div>
  <label>内容（その日の何が目標を進めたか）</label><textarea id="lEvi">${esc(v.e)}</textarea>
  ${btnRow(old?'<button class="btn" id="lDel">この紐づけを削除</button>':'','<button class="btn" id="fCancel">キャンセル</button><button class="btn primary" id="fOk">保存</button>')}`);
  const done=()=>{closeDlg();render();back&&back()};
  document.getElementById('fCancel').onclick=()=>{closeDlg();back&&back()};
  if(old)document.getElementById('lDel').onclick=()=>{if(!confirm('この紐づけを削除します。次回の取込でも復活しません。'))return;
    old.x=1;LK.splice(LK.indexOf(old),1);run(()=>scSaveLink(old));done()};
  document.getElementById('fOk').onclick=()=>{
    const nv={i:document.getElementById('lItem').value,d:document.getElementById('lDate').value,mem:document.getElementById('lMem').value,
      s:document.getElementById('lStage').value,c:document.getElementById('lConf').value,e:document.getElementById('lEvi').value.trim(),rid:v.rid,ed:1};
    if(!nv.d){toast('日付を入れてください');return}
    if(!nv.rid){const m=RP.filter(r=>r.d===nv.d&&r.mem===nv.mem);if(m.length===1)nv.rid=m[0].rid}   // 同じ日・同じ人の日報が1件だけなら自動でつなぐ
    nv.w=MEM.indexOf(nv.mem);
    if(old&&old.i===nv.i){Object.assign(old,nv);run(()=>scSaveLink(old))}
    else{
      if(old){old.x=1;LK.splice(LK.indexOf(old),1);run(()=>scSaveLink(old))}   // 項目を変えるときは、元の行に印を付けて新しい行を作る（取込で元の行が戻らないように）
      const nl=Object.assign({key:'man|'+uid()},nv);LK.push(nl);run(()=>scSaveLink(nl));
    }
    done()};
}

/* 日報1件の追加・編集。rid: 既存の日報（無ければ新規） */
function dlgReport(rid,pre){
  CUR_BACK=rid?()=>dlgReport(rid):null;
  const old=rid?RP.find(r=>r.rid===rid):null;
  const v=old||Object.assign({rid:'man|'+uid(),d:addMonth()+"-01",mem:MEM[0]||'',r:'',o:'',g:''},pre||{});
  const gs=groupList();if(v.g&&!gs.includes(v.g))gs.push(v.g);
  const ls=linksOf(v.rid);
  openDlg(`<h3>日報を${old?'編集':'追加'}</h3>
  <div class="row2"><div><label>日付</label><input type="date" id="rDate" value="${esc(v.d)}"></div><div><label>担当</label><select id="rMem">${memOpts(v.mem)}</select></div></div>
  <div class="row2"><div><label>定常業務の区分</label><select id="rRou">${ROUTINES.map(([k,t])=>opt(k,t,(v.r||'').split(',')[0])).join('')}</select></div>
   <div><label>目標シートにない取り組み（グループ）</label><select id="rGrp">${opt('','（なし）',v.g)}${gs.map(g=>opt(g,g,v.g)).join('')}</select></div></div>
  <label>目標シートにない取り組み（内容。例: 取り組みの名前）</label><input id="rOff" value="${esc(v.o)}">
  ${old?`<label>この日報に紐づく目標</label><div class="ev">${ls.length?ls.map(l=>`<div style="padding:3px 0;border-bottom:1px solid var(--grid)"><b>${esc(l.i)}</b> ${esc((ITEM[l.i]||{}).t||'')} <span class="chip mute">${l.s}</span> <span class="chip mute">確度${l.c}</span> ${esc(l.e)} <button class="x" data-elink="${esc(l.key)}" title="編集">✎</button></div>`).join(''):'<span class="mut">紐づく目標はありません</span>'}</div>
   <button class="add" id="rAddLink">＋紐づけを追加</button>`:'<p class="hint">日報を保存したあと、開き直して目標への紐づけを追加できます。</p>'}
  ${btnRow(old?'<button class="btn" id="rDel">この日報を削除</button>':'','<button class="btn" id="fCancel">キャンセル</button><button class="btn primary" id="fOk">保存</button>')}`);
  document.getElementById('fCancel').onclick=closeDlg;
  if(old){
    document.getElementById('rAddLink').onclick=()=>dlgLink(null,{rid:v.rid,d:v.d,mem:v.mem},()=>dlgReport(v.rid));
    document.getElementById('rDel').onclick=()=>{if(!confirm('この日報と、紐づけをすべて削除します。次回の取込でも復活しません。'))return;
      ls.forEach(l=>{l.x=1;LK.splice(LK.indexOf(l),1);run(()=>scSaveLink(l))});
      old.x=1;RP.splice(RP.indexOf(old),1);run(()=>scSaveReport(old));closeDlg();render()};
  }
  document.getElementById('fOk').onclick=()=>{
    const d=document.getElementById('rDate').value;if(!d){toast('日付を入れてください');return}
    const mem=document.getElementById('rMem').value;
    Object.assign(v,{d,mem,r:document.getElementById('rRou').value,g:document.getElementById('rGrp').value,o:document.getElementById('rOff').value.trim(),ed:1,w:MEM.indexOf(mem)});
    if(!old)RP.push(v);
    ls.forEach(l=>{if(l.d!==d||l.mem!==mem){l.d=d;l.mem=mem;l.w=v.w;l.ed=1;run(()=>scSaveLink(l))}});   // 日付・担当を変えたら、紐づけも合わせる
    run(()=>scSaveReport(v));closeDlg();render()};
}

function viewDetail(){
  const reps=RP.filter(r=>inPer(r.d,MONTH)&&(FILTER.dmem==='all'||MEM[FILTER.dmem]===r.mem)).sort((a,b)=>a.d<b.d?1:a.d>b.d?-1:a.mem<b.mem?-1:1);
  const rids=new Set(RP.map(r=>r.rid));
  const orphan=LK.filter(l=>inPer(l.d,MONTH)&&(!l.rid||!rids.has(l.rid))&&(FILTER.dmem==='all'||MEM[FILTER.dmem]===l.mem));
  const rou=Object.fromEntries(ROUTINES);
  const chipL=l=>`<span class="chip ${l.c==='L'?'mute':'info'}" title="${esc(l.e)}／${l.s}／確度${l.c}" data-elink="${esc(l.key)}" style="cursor:pointer">${esc(l.i)}</span>`;
  const rows=reps.map(r=>{const ls=linksOf(r.rid);
    return `<tr class="row" data-rep="${esc(r.rid)}"><td>${r.d.slice(5).replace('-','/')}</td><td>${esc(MS[r.w]||r.mem)}</td>
     <td>${ls.length?ls.map(chipL).join(' '):'<span class="mut">－</span>'}</td>
     <td>${esc(rou[(r.r||'').split(',')[0]]||'')}${r.g?` <span class="chip mute">${esc(r.g)}</span>`:''}</td><td>${r.ed?'<span class="chip conf">手修正</span>':''}</td></tr>`}).join('');
  return `<div class="bar filters"><span class="ctl">担当 <select data-f="dmem"><option value="all">全員</option>${MEM.map((n,i)=>`<option value="${i}" ${String(FILTER.dmem)===String(i)?'selected':''}>${esc(MS[i])}</option>`).join('')}</select></span>
   <button class="btn primary" data-arep="1">＋日報を追加</button><span class="hint">行をクリックで日報を編集。目標の印（IDのチップ）をクリックで、その紐づけだけを編集。</span></div>
  <section class="sec"><h2>${perLabel(MONTH)}の日報・紐づけ明細<span class="n">${reps.length}件</span></h2><div style="overflow:auto"><table class="tbl"><thead><tr><th>日付</th><th>担当</th><th>紐づく目標</th><th>定常・目標外</th><th></th></tr></thead><tbody>${rows||'<tr><td colspan="5" class="mut">この月の日報はありません</td></tr>'}</tbody></table></div></section>
  ${orphan.length?`<section class="sec"><h2>日報に結びついていない紐づけ<span class="n">${orphan.length}件</span></h2><div style="padding:10px 16px">${orphan.map(l=>`<div style="padding:3px 0"><span class="who">${esc(MS[l.w]||l.mem)}</span>${l.d.slice(5).replace('-','/')} ${chipL(l)} ${esc(l.e)}</div>`).join('')}</div></section>`:''}
  <p class="hint">画面で直した行は「手修正」と表示され、次回の取込で上書きされません。削除した行も、取込で復活しません。</p>`;
}

/* ---------- data tab ---------- */
function dl(name,obj){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(obj,null,1)],{type:'application/json'}));a.download=name;a.click()}
function readJson(file,cb){const fr=new FileReader();fr.onload=()=>{try{cb(JSON.parse(fr.result))}catch(e){alert('JSONを読み込めませんでした')}};fr.readAsText(file)}
function bindData(){
  const clean=o=>JSON.parse(JSON.stringify(o,(k,v)=>k==='_sp'?undefined:v));
  document.getElementById('exp').onclick=()=>dl('総務コンパス_手入力データ.json',clean({manual:S.manual,verdict:S.verdict,summary:S.summary}));
  document.getElementById('impMaster').onchange=e=>{
    const msg=document.getElementById('impMasterMsg');
    readJson(e.target.files[0],async o=>{
      try{
        const r=await scImportMaster(o,(n,t)=>{msg.textContent='書き込み中 '+n+'/'+t});
        FY=r.fy;await reload();toast(`目標マスタ取込完了（${r.fy}年度）: 新規${r.added}・更新${r.updated}・変更なし${r.same}`)
      }catch(err){msg.textContent='失敗: '+err.message}
    })};
  document.getElementById('impMonthly').onchange=e=>{
    const msg=document.getElementById('impMsg');
    readJson(e.target.files[0],async o=>{
      const reps=Array.isArray(o)?o:(o&&o.reports);
      const ok=o&&typeof o==='object'&&((Array.isArray(reps)&&(!reps.length||(reps[0].usage_id&&reps[0].date&&reps[0].member)))||Array.isArray(o.additions)||Array.isArray(o.plans));
      if(!ok){msg.textContent='形式が違います（日報の配列、または reports / additions / plans を持つオブジェクトが必要です）';return}
      try{
        const r=await scImportPackage(o,(n,t)=>{msg.textContent='書き込み中 '+n+'/'+t});
        await reload();
        toast(`取込完了: 日報 新規${r.reports.added}・更新${r.reports.updated}／紐づけ 新規${r.links.added}・更新${r.links.updated}／手修正を維持 日報${r.reports.kept}・紐づけ${r.links.kept}／追記 新規${r.additions.added}／予定の下書き 新規${r.plans.added}`+(r.errors.length?`／読み飛ばし${r.errors.length}件: ${r.errors[0]}`:''))
      }catch(err){msg.textContent='失敗: '+err.message}
    })};
}

/* ---------- events ---------- */
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-v],[data-open],[data-elink],[data-alink],[data-rep],[data-arep],[data-plan],[data-add],[data-sum],[data-del],[data-f]');if(!t)return;
  if(t.dataset.v){VIEW=t.dataset.v;render();return}
  if(t.dataset.elink){dlgLink(t.dataset.elink,null,dlg.open?CUR_BACK:null);return}
  if(t.dataset.alink){dlgLink(null,{i:t.dataset.alink},()=>dlgItem(t.dataset.alink));return}
  if(t.dataset.rep){dlgReport(t.dataset.rep);return}
  if(t.dataset.arep){dlgReport(null);return}
  if(t.dataset.open){dlgItem(t.dataset.open);return}
  if(t.dataset.plan){dlgPlan(t.dataset.plan);return}
  if(t.dataset.add){dlgAdd(t.dataset.add);return}
  if(t.dataset.sum){dlgSum(t.dataset.sum);return}
  if(t.dataset.del){const x=S.manual.find(x=>x.id===t.dataset.del);S.manual=S.manual.filter(y=>y!==x);render();if(x)run(()=>scDelManual(x));return}
  if(t.dataset.f==='hideEmpty'){FILTER.hideEmpty=!FILTER.hideEmpty;render()}
});
document.addEventListener('change',e=>{const t=e.target;if(t.dataset&&t.dataset.f&&t.tagName==='SELECT'){FILTER[t.dataset.f]=t.value;render()}});
document.getElementById('fySel').onchange=async e=>{FY=+e.target.value;try{await reload()}catch(err){toast(err.message)}};
document.getElementById('month').onchange=e=>{MONTH=e.target.value;render()};
document.getElementById('presentBtn').onclick=()=>{window.__present=!window.__present;document.getElementById('presentBtn').textContent=window.__present?'発表モードを終了':'発表モード';if(window.__present)VIEW='present';render()};
dlg.addEventListener('click',e=>{if(e.target===dlg)dlg.close()});
boot();
</script>
</body>
</html>

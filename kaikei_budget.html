<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>予算 | 花岡車輌</title>
<script src="https://cdn.jsdelivr.net/npm/@azure/msal-browser@3.10.0/lib/msal-browser.min.js" crossorigin="anonymous"></script>
<style>
  :root { --primary:#1a5fa8; --bg:#f4f6f9; --card-bg:#fff; --border:#dde2ec; --text:#1e2533; --muted:#6b7a99;
          --shadow:0 1px 4px rgba(0,0,0,.08); --head:#eef2f8; --sub:#f7f9fc; --bad:#c0392b; --good:#1e8449;
          --hl:rgba(26,95,168,.07); --draft:#fff8e6; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:'Meiryo','Hiragino Sans',sans-serif; background:var(--bg); color:var(--text); }
  nav { background:#1f1e1c;color:#fff;padding:8px 24px;font-size:13px;display:flex;gap:18px;align-items:center;flex-wrap:wrap; }
  nav a { color:#fff;text-decoration:none;opacity:.75; }
  nav a.on { opacity:1; font-weight:700; }
  #login-view { display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:70vh; gap:16px; }
  #login-view button { background:var(--primary); color:#fff; border:none; padding:12px 32px; border-radius:6px; font-size:15px; font-weight:700; cursor:pointer; }
  #app-view { display:none; padding:16px 20px 60px; }
  .bar { display:flex; align-items:center; gap:10px; background:var(--card-bg); border:1px solid var(--border);
         border-radius:8px; padding:10px 14px; margin-bottom:12px; box-shadow:var(--shadow); flex-wrap:wrap; }
  .bar select, .bar input[type=text], .bar input[type=date] { border:1px solid var(--border); border-radius:4px; padding:5px 10px; font-size:13px; }
  .bar .sp { margin-left:auto; font-size:12px; color:var(--muted); }
  button.btn { border:1px solid var(--border); background:#fff; border-radius:4px; padding:6px 12px; font-size:13px; cursor:pointer; }
  button.btn.primary { background:var(--primary); color:#fff; border-color:var(--primary); font-weight:700; }
  button.btn:disabled { opacity:.5; cursor:default; }
  .tabs { display:flex; gap:4px; }
  .tabs button { border:1px solid var(--border); background:#fff; padding:6px 14px; font-size:13px; cursor:pointer; border-radius:4px; }
  .tabs button.on { background:var(--primary); color:#fff; border-color:var(--primary); font-weight:700; }
  .badge { display:inline-block; font-size:11px; font-weight:700; padding:2px 8px; border-radius:10px; background:#e3edf9; color:var(--primary); }
  .badge.active { background:var(--primary); color:#fff; }
  .badge.draft { background:#f0a500; color:#fff; }
  .card { background:var(--card-bg); border:1px solid var(--border); border-radius:8px; padding:14px 16px; margin-bottom:12px; box-shadow:var(--shadow); }
  .card h3 { font-size:14px; color:var(--primary); margin-bottom:8px; }
  .meta { display:grid; grid-template-columns:max-content 1fr; gap:4px 14px; font-size:12px; }
  .meta dt { color:var(--muted); }
  .note { font-size:12px; color:var(--muted); line-height:1.6; margin-bottom:10px; }
  .warn { background:#fff3cd; border:1px solid #ffc107; border-radius:6px; padding:8px 12px; font-size:12px; margin-bottom:10px; color:#664d00; }
  .tbl-wrap { overflow-x:auto; background:var(--card-bg); border:1px solid var(--border); border-radius:8px; box-shadow:var(--shadow); }
  table { border-collapse:collapse; font-size:12px; white-space:nowrap; }
  th, td { padding:4px 8px; border-bottom:1px solid var(--border); }
  thead th { background:var(--head); color:var(--primary); position:sticky; top:0; z-index:2; font-size:11px; }
  td.lbl, th.lbl { position:sticky; left:0; background:var(--card-bg); text-align:left; min-width:190px; z-index:1; }
  thead th.lbl { background:var(--head); z-index:3; }
  td.num { text-align:right; font-variant-numeric:tabular-nums; }
  td.cum { background:#f4f7fc; font-weight:700; }
  td.spc { color:var(--muted); }
  tr.section td { background:var(--sub); font-weight:700; }
  tr.total td { font-weight:700; border-top:2px solid var(--primary); }
  tr:hover > td { background:var(--hl); }
  .indent { padding-left:22px; color:var(--muted); }
  th.activecol, td.activecol { background:#eaf2fc; }
  .diff { display:block; font-size:10px; color:var(--muted); font-weight:400; }
  .diff.bad { color:var(--bad); } .diff.good { color:var(--good); }
  td input { width:96px; border:1px solid #e3d9b8; border-radius:3px; background:#fff; text-align:right;
             font-size:12px; padding:2px 4px; font-variant-numeric:tabular-nums; font-family:inherit; }
  td input:focus { outline:2px solid var(--primary); border-color:transparent; }
  td input.annual { width:110px; font-weight:700; }
  .draftbar { background:var(--draft); border-color:#f0d58a; }
  .draftbar textarea { width:min(560px,100%); min-height:38px; border:1px solid var(--border); border-radius:4px; padding:5px 8px; font-size:13px; font-family:inherit; }
  #log { font-size:12px; white-space:pre-wrap; background:#f7f9fc; border:1px solid var(--border); border-radius:6px; padding:8px 10px; margin-top:10px; max-height:260px; overflow:auto; display:none; }
</style>
</head>
<body>
<nav>
  <strong style="opacity:.55;font-weight:600;">会計ダッシュボード</strong>
  <a href="kaikei_dashboard.html">会計サマリー</a>
  <a href="kaikei_monthly.html">月次資料</a>
  <a href="kaikei_cash.html">資金繰り</a>
  <a href="kaikei_ledger.html">仕訳明細</a>
  <a href="kaikei_budget.html" class="on">予算</a>
  <a href="kaikei_upload.html">データ取り込み</a>
</nav>

<div id="login-view">
  <h2>予算</h2>
  <p style="color:var(--muted);font-size:13px;">役員限定です。Microsoftアカウントでサインインしてください。</p>
  <button id="login-btn">サインイン</button>
  <div id="login-err" style="color:#b03636;font-size:13px;"></div>
</div>

<div id="app-view">
  <!-- 初期登録（版がまだ1つも無いとき） -->
  <div class="card" id="setup" style="display:none;">
    <h3>予算の初期登録</h3>
    <p class="note">
      Excelの経費月次予算（ver.01〜03）から作った <b>budget_seed.json</b> を選ぶと、事業計画（当初）・事業計画（改訂）・ストレス計画・確保計画を
      最初の4つの版として登録します。売上の月別の配分は営業部の部門別目標（部門月次）から取ります。
    </p>
    <input type="file" id="seedFile" accept=".json">
    <button class="btn primary" id="seedBtn" disabled>初期登録する</button>
    <div id="log"></div>
  </div>

  <div class="bar" id="mainBar" style="display:none;">
    <label>年度</label>
    <select id="fySel"></select>
    <div class="tabs">
      <button data-view="compare" class="on">版の比較</button>
      <button data-view="detail">版の中身</button>
    </div>
    <span id="verPick" style="display:none;">
      <select id="verSel"></select>
      <span id="verBadge"></span>
    </span>
    <button class="btn" id="activateBtn" style="display:none;">この版を採用する</button>
    <button class="btn primary" id="newBtn" style="display:none;">この版をもとに新しい版を作る</button>
    <span class="sp" id="status"></span>
  </div>

  <!-- 新しい版の編集中 -->
  <div class="bar draftbar" id="draftBar" style="display:none;">
    <span class="badge draft">新しい版を編集中</span>
    <label>版の名前</label><input type="text" id="dName" style="width:220px;" placeholder="例: 経費予算見直し（社長）">
    <label>資料の日付</label><input type="date" id="dDate">
    <label><input type="checkbox" id="dActivate" checked> 保存と同時に採用する</label>
    <div style="flex-basis:100%;"></div>
    <label>変更理由</label><textarea id="dMemo" placeholder="何をなぜ変えたか（例: 家賃の確定・雑費の家具予算を1,000万→300万）"></textarea>
    <div style="flex-basis:100%;"></div>
    <button class="btn" id="dReshape">売上の月配分を営業部の目標から取り直す</button>
    <button class="btn primary" id="dSave">新しい版として保存</button>
    <button class="btn" id="dCancel">やめる</button>
  </div>

  <div id="content"></div>
</div>

<script src="kaikei_graph.js"></script>
<script src="kaikei_budget_core.js"></script>
<script>
const KB = KaikeiBudget;
let idx = { versions: [], active: {} };
const verCache = {};      // id -> 版の中身
let fy = null;
let view = 'compare';
let selectedId = null;
let draft = null;         // 編集中の新しい版（保存するまでSharePointには書かない）
let seedData = null;

const fmt = n => (n === null || n === undefined || !isFinite(n)) ? '—' : Math.round(n).toLocaleString('ja-JP');
const fmtMan = n => (n === null || n === undefined || !isFinite(n)) ? '—' : (n / 10000).toLocaleString('ja-JP', { maximumFractionDigits: 0 }) + '万';
const fmtPct = n => (n === null || n === undefined || !isFinite(n)) ? '—' : (n * 100).toFixed(1) + '%';
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const mLabel = m => parseInt(m.slice(4), 10) + '月';
const who = () => (typeof _kaikeiAccount !== 'undefined' && _kaikeiAccount) ? (_kaikeiAccount.name || _kaikeiAccount.username || '') : '';
const setStatus = t => { document.getElementById('status').textContent = t || ''; };

function versionsOfFy() { return (idx.versions || []).filter(v => v.fy === fy); }
function activeId() { return idx.active ? idx.active[String(fy)] : null; }

async function getVer(id) {
  if (!verCache[id]) verCache[id] = await KB.loadVersion(id);
  return verCache[id];
}

/* ============ 画面の出し分け ============ */
function syncBar() {
  const vs = versionsOfFy();
  const detail = view === 'detail';
  document.querySelectorAll('.tabs button').forEach(b => b.classList.toggle('on', b.dataset.view === view));
  document.getElementById('verPick').style.display = detail && !draft ? '' : 'none';
  document.getElementById('activateBtn').style.display = detail && !draft && selectedId && selectedId !== activeId() ? '' : 'none';
  document.getElementById('newBtn').style.display = detail && !draft && selectedId ? '' : 'none';
  document.getElementById('draftBar').style.display = draft ? '' : 'none';
  const sel = document.getElementById('verSel');
  sel.innerHTML = vs.slice().reverse().map(v =>
    `<option value="${v.id}"${v.id === selectedId ? ' selected' : ''}>${v.id} ${esc(v.name)}${v.id === activeId() ? '（採用中）' : ''}</option>`).join('');
  document.getElementById('verBadge').innerHTML = selectedId === activeId() ? '<span class="badge active">採用中</span>' : '';
  document.querySelectorAll('.tabs button').forEach(b => { b.disabled = !!draft; });
}

async function show() {
  syncBar();
  if (view === 'compare') await renderCompare();
  else await renderDetail();
}

/* ============ 版の比較 ============ */
const METRICS = [
  { label: '売上', k: 'sales', bold: true },
  { label: '国内営業', k: 'domestic', indent: true },
  { label: 'ソリューション営業', k: 'solution', indent: true },
  { label: '付加価値率', k: 'vaRate', pct: true },
  { label: '付加価値額', k: 'valueAdded', bold: true },
  { label: '人件費', k: 'labor', indent: true, cost: true },
  { label: '一般経費', k: 'expense', indent: true, cost: true },
  { label: '経費合計', k: 'cost', bold: true, cost: true },
  { label: '営業利益', k: 'opInc', bold: true },
  { label: '営業外収益', k: 'nonOpInc', indent: true },
  { label: '営業外費用', k: 'nonOpExp', indent: true, cost: true },
  { label: '経常利益', k: 'ordInc', bold: true },
  { label: '労働分配率（人件費÷付加価値）', k: 'laborShare', pct: true, cost: true },
];

async function renderCompare() {
  const vs = versionsOfFy();
  const el = document.getElementById('content');
  if (!vs.length) { el.innerHTML = '<p class="note">この年度の予算の版はまだありません。</p>'; return; }
  setStatus('読み込み中...');
  const vers = await Promise.all(vs.map(v => getVer(v.id)));
  setStatus('');
  const tot = {};
  vers.forEach(v => { tot[v.id] = KB.totals(v); });
  const act = activeId();

  let h = `<p class="note">年間の主要数値を版ごとに並べています。小さい数字は「元にした版」からの増減です。
    列の見出しをクリックすると、その版の中身（科目×月）を開きます。</p>
    <div class="tbl-wrap"><table><thead><tr><th class="lbl">項目</th>`;
  for (const v of vs) {
    h += `<th class="${v.id === act ? 'activecol' : ''}" style="cursor:pointer;" data-open="${v.id}">
      ${v.id} ${esc(v.name)}<br>${v.planDate ? esc(v.planDate) : ''} ${v.id === act ? '<span class="badge active">採用中</span>' : ''}</th>`;
  }
  h += '</tr></thead><tbody>';
  for (const r of METRICS) {
    h += `<tr class="${r.bold ? 'total' : ''}"><td class="lbl${r.indent ? ' indent' : ''}">${r.label}</td>`;
    for (const v of vs) {
      const val = tot[v.id][r.k];
      let d = '';
      const base = v.basedOn && tot[v.basedOn];
      if (base) {
        const diff = val - base[r.k];
        if (Math.abs(diff) > (r.pct ? 0.00005 : 0.5)) {
          const good = r.cost ? diff < 0 : diff > 0;
          const txt = r.pct ? (diff > 0 ? '+' : '') + (diff * 100).toFixed(1) + 'pt' : (diff > 0 ? '+' : '') + fmtMan(diff);
          d = `<span class="diff ${good ? 'good' : 'bad'}">${txt}</span>`;
        }
      }
      h += `<td class="num${v.id === act ? ' activecol' : ''}">${r.pct ? fmtPct(val) : fmt(val)}${d}</td>`;
    }
    h += '</tr>';
  }
  h += `<tr><td class="lbl">元にした版</td>${vs.map(v => `<td class="${v.id === act ? 'activecol' : ''}">${v.basedOn || '—'}</td>`).join('')}</tr>`;
  h += `<tr><td class="lbl">登録</td>${vs.map(v => `<td class="${v.id === act ? 'activecol' : ''}" style="font-size:11px;color:var(--muted);">
      ${new Date(v.createdAt).toLocaleString('ja-JP')}<br>${esc(v.createdBy || '')}</td>`).join('')}</tr>`;
  h += '</tbody></table></div>';
  h += '<div class="card" style="margin-top:12px;"><h3>各版のメモ</h3><div class="meta">' +
    vs.map(v => `<dt>${v.id} ${esc(v.name)}</dt><dd>${esc(v.memo || '')}</dd>`).join('') + '</div></div>';
  el.innerHTML = h;
  el.querySelectorAll('[data-open]').forEach(th => th.addEventListener('click', () => {
    selectedId = th.dataset.open; view = 'detail'; show();
  }));
}

/* ============ 版の中身（科目×月） ============ */
function rowsOf(ver) {
  const R = [];
  const labor = ver.lines.filter(l => l.labor), general = ver.lines.filter(l => !l.labor);
  R.push({ section: '売上' });
  R.push({ label: '国内営業', edit: 'sales:domestic' });
  if (ver.sales.officeShare) for (const o of KB.OFFICES) R.push({ label: o, calc: 'office:' + o, indent: true });
  R.push({ label: 'ソリューション営業', edit: 'sales:solution' });
  R.push({ label: '売上', calc: 'sales', total: true });
  R.push({ label: '付加価値率', calc: 'vaRate', pct: true, editAnnual: 'vaRate' });
  R.push({ label: '付加価値額', calc: 'valueAdded', total: true });
  R.push({ section: '人件費' });
  for (const l of labor) R.push({ label: l.label, edit: 'exp:' + l.key, key: l.key });
  R.push({ label: '人件費 計', calc: 'labor', total: true });
  R.push({ section: '一般経費' });
  for (const l of general) R.push({ label: l.label, edit: 'exp:' + l.key, key: l.key });
  R.push({ label: '一般経費 計', calc: 'expense', total: true });
  R.push({ label: '経費合計', calc: 'cost', total: true });
  R.push({ label: '営業利益', calc: 'opInc', total: true });
  R.push({ label: '営業外収益', edit: 'nonop:inc' });
  R.push({ label: '営業外費用', edit: 'nonop:exp' });
  R.push({ label: '経常利益', calc: 'ordInc', total: true });
  return R;
}

/** 編集対象（sales:domestic / exp:510/641 / nonop:inc）の月別の入れ物を返す */
function mapOf(ver, path) {
  const [kind, key] = [path.slice(0, path.indexOf(':')), path.slice(path.indexOf(':') + 1)];
  if (kind === 'sales') return ver.sales[key];
  if (kind === 'exp') return (ver.expense[key] = ver.expense[key] || {});
  if (kind === 'nonop') return ver.nonOp[key];
  return null;
}

function calcValue(ver, calc, month) {
  if (month) {
    const b = KB.budgetMonth(ver, month);
    if (calc.startsWith('office:')) return b.officeSales[calc.slice(7)];
    return b[calc];
  }
  const t = KB.totals(ver);
  if (calc.startsWith('office:')) return ver.months.reduce((s, m) => s + (KB.budgetMonth(ver, m).officeSales[calc.slice(7)] || 0), 0);
  return t[calc];
}

async function renderDetail() {
  const el = document.getElementById('content');
  const ver = draft || (selectedId && await getVer(selectedId));
  if (!ver) { el.innerHTML = '<p class="note">版を選んでください。</p>'; return; }
  const editing = !!draft;
  const months = ver.months;
  const base = ver.basedOn ? (idx.versions || []).find(v => v.id === ver.basedOn) : null;

  let h = '';
  if (!editing) {
    h += `<div class="card"><h3>${ver.id} ${esc(ver.name)} ${ver.id === activeId() ? '<span class="badge active">採用中</span>' : ''}</h3>
      <dl class="meta">
        <dt>資料の日付</dt><dd>${esc(ver.planDate || '—')}</dd>
        <dt>元にした版</dt><dd>${base ? esc(base.id + ' ' + base.name) : '—'}</dd>
        <dt>登録</dt><dd>${new Date(ver.createdAt).toLocaleString('ja-JP')} ${esc(ver.createdBy || '')}</dd>
        <dt>出典</dt><dd>${esc(ver.source || '—')}</dd>
        <dt>売上の月配分</dt><dd>${esc(ver.salesShape ? ver.salesShape.source : '—')}</dd>
        <dt>メモ・変更理由</dt><dd>${esc(ver.memo || '')}</dd>
      </dl>
      <p class="note" style="margin:8px 0 0;">保存済みの版は変更できません。直すときは「この版をもとに新しい版を作る」を押してください。</p></div>`;
  } else {
    h += `<p class="note">黄色い枠の数字を直接直せます。年間計の枠に入れると、月の比率を保ったまま配分し直します（全部0の行は12等分）。
      付加価値率は年間の率です。保存するまでSharePointには書き込みません。</p>`;
  }
  if (ver.salesShape && /均等|前年度/.test(ver.salesShape.source)) {
    h += `<div class="warn">売上の月配分: ${esc(ver.salesShape.source)}</div>`;
  }
  const hasSpecial = Object.keys(ver.special || {}).length > 0;
  h += `<div class="tbl-wrap"><table id="grid"><thead><tr><th class="lbl">科目</th>${months.map(m => `<th>${mLabel(m)}</th>`).join('')}
    <th>年間計</th>${hasSpecial ? '<th title="資料の「特別」列。月別の金額に12等分して含めています">うち特別枠</th>' : ''}</tr></thead><tbody>`;
  const ncol = months.length + 2 + (hasSpecial ? 1 : 0);
  for (const r of rowsOf(ver)) {
    if (r.section) { h += `<tr class="section"><td class="lbl">${r.section}</td><td colspan="${ncol - 1}"></td></tr>`; continue; }
    h += `<tr class="${r.total ? 'total' : ''}"><td class="lbl${r.indent ? ' indent' : ''}">${esc(r.label)}</td>`;
    if (r.edit) {
      const map = mapOf(ver, r.edit);
      for (const m of months) {
        h += editing
          ? `<td class="num"><input data-e="${r.edit}" data-m="${m}" value="${fmt(map[m] || 0)}"></td>`
          : `<td class="num">${fmt(map[m] || 0)}</td>`;
      }
      const sum = KB.sumMap(map);
      h += editing
        ? `<td class="num cum"><input class="annual" data-a="${r.edit}" value="${fmt(sum)}"></td>`
        : `<td class="num cum">${fmt(sum)}</td>`;
    } else {
      for (const m of months) h += `<td class="num" data-c="${r.calc}" data-m="${m}"></td>`;
      if (r.editAnnual && editing) {
        h += `<td class="num cum"><input class="annual" data-rate="1" value="${(ver.annual.vaRate * 100).toFixed(1)}%"></td>`;
      } else {
        h += `<td class="num cum" data-c="${r.calc}"></td>`;
      }
    }
    if (hasSpecial) h += `<td class="num spc">${r.key && ver.special[r.key] ? fmt(ver.special[r.key]) : ''}</td>`;
    h += '</tr>';
  }
  h += '</tbody></table></div>';
  el.innerHTML = h;
  refreshCalc(ver);
  if (editing) bindInputs(ver);
}

function refreshCalc(ver) {
  document.querySelectorAll('#grid [data-c]').forEach(td => {
    const c = td.dataset.c;
    const v = calcValue(ver, c, td.dataset.m || null);
    td.textContent = (c === 'vaRate') ? fmtPct(v) : fmt(v);
  });
  if (!draft) return;
  // 年間計の入力欄（編集していない行）も最新の合計に合わせる
  document.querySelectorAll('#grid input[data-a]').forEach(inp => {
    if (document.activeElement !== inp) inp.value = fmt(KB.sumMap(mapOf(ver, inp.dataset.a)));
  });
}

const parseNum = s => {
  const t = String(s).replace(/[,，\s円]/g, '').replace(/[０-９]/g, c => String.fromCharCode(c.charCodeAt(0) - 0xFEE0)).replace(/[−ー－]/g, '-');
  if (t === '' || t === '-') return 0;
  const n = Number(t);
  return isFinite(n) ? n : null;
};

function bindInputs(ver) {
  const grid = document.getElementById('grid');
  grid.addEventListener('change', e => {
    const inp = e.target;
    if (inp.dataset.rate) {
      const r = parseFloat(String(inp.value).replace('%', ''));
      if (!isFinite(r)) { inp.value = (ver.annual.vaRate * 100).toFixed(1) + '%'; return; }
      ver.annual.vaRate = r > 1 ? r / 100 : r;
      inp.value = (ver.annual.vaRate * 100).toFixed(1) + '%';
    } else if (inp.dataset.e) {
      const n = parseNum(inp.value);
      const map = mapOf(ver, inp.dataset.e);
      if (n === null) { inp.value = fmt(map[inp.dataset.m] || 0); return; }
      map[inp.dataset.m] = Math.round(n);
      inp.value = fmt(map[inp.dataset.m]);
    } else if (inp.dataset.a) {
      const n = parseNum(inp.value);
      const path = inp.dataset.a;
      const map = mapOf(ver, path);
      if (n === null) { inp.value = fmt(KB.sumMap(map)); return; }
      const shaped = KB.distribute(Math.round(n), ver.months, { ...map });
      Object.assign(map, shaped);
      grid.querySelectorAll(`input[data-e="${CSS.escape(path)}"]`).forEach(i => { i.value = fmt(map[i.dataset.m]); });
      inp.value = fmt(KB.sumMap(map));
    }
    refreshCalc(ver);
  });
  grid.addEventListener('focusin', e => { if (e.target.tagName === 'INPUT') e.target.select(); });
}

/* ============ 新しい版の作成・保存 ============ */
async function startDraft() {
  const base = await getVer(selectedId);
  draft = JSON.parse(JSON.stringify(base));
  draft.basedOn = base.id;
  draft.id = '(未保存)';
  document.getElementById('dName').value = '';
  document.getElementById('dMemo').value = '';
  document.getElementById('dDate').value = new Date().toISOString().slice(0, 10);
  document.getElementById('dActivate').checked = true;
  show();
}

async function saveDraft() {
  const name = document.getElementById('dName').value.trim();
  const memo = document.getElementById('dMemo').value.trim();
  if (!name) { alert('版の名前を入れてください。'); return; }
  if (!memo) { alert('変更理由を入れてください（あとで版を見比べるときの手がかりになります）。'); return; }
  const btn = document.getElementById('dSave');
  btn.disabled = true;
  setStatus('保存中...');
  try {
    const fresh = await KB.loadIndex();
    const ver = JSON.parse(JSON.stringify(draft));
    ver.id = KB.nextId(fresh);
    ver.name = name;
    ver.memo = memo;
    ver.planDate = document.getElementById('dDate').value || '';
    ver.createdAt = new Date().toISOString();
    ver.createdBy = who();
    ver.source = 'アプリで作成（' + ver.basedOn + ' を修正）';
    ver.annual.domestic = KB.sumMap(ver.sales.domestic);
    ver.annual.solution = KB.sumMap(ver.sales.solution);
    ver.annual.nonOpInc = KB.sumMap(ver.nonOp.inc);
    ver.annual.nonOpExp = KB.sumMap(ver.nonOp.exp);
    idx = await KB.saveNewVersion(ver, { activate: document.getElementById('dActivate').checked });
    verCache[ver.id] = ver;
    draft = null;
    selectedId = ver.id;
    setStatus(`${ver.id} として保存しました`);
    show();
  } catch (e) {
    setStatus('');
    alert('保存できませんでした: ' + e.message);
  } finally {
    btn.disabled = false;
  }
}

async function reshapeDraft() {
  if (!draft) return;
  setStatus('営業部の目標を読み込み中...');
  try {
    const shape = await KB.fetchSalesShape(draft.fy);
    if (!shape) { setStatus(''); alert(`${draft.fy}年度の営業部の部門月次目標が見つかりませんでした。`); return; }
    draft.annual.domestic = KB.sumMap(draft.sales.domestic);
    draft.annual.solution = KB.sumMap(draft.sales.solution);
    KB.applySalesShape(draft, shape);
    setStatus('売上の月配分を営業部の目標に合わせました');
    renderDetail();
  } catch (e) { setStatus(''); alert(e.message); }
}

/* ============ 初期登録 ============ */
function log(t) {
  const el = document.getElementById('log');
  el.style.display = 'block';
  el.textContent += t + '\n';
  el.scrollTop = el.scrollHeight;
}
document.getElementById('seedFile').addEventListener('change', async e => {
  const f = e.target.files[0];
  seedData = null;
  document.getElementById('seedBtn').disabled = true;
  if (!f) return;
  try {
    const j = JSON.parse(await f.text());
    if (j.kind !== 'budget_seed' || !Array.isArray(j.versions)) throw new Error('budget_seed.json ではありません');
    seedData = j;
    log(`読み込みOK: ${j.fy}年度 / ${j.versions.length}版（${j.versions.map(v => v.name).join('・')}）`);
    document.getElementById('seedBtn').disabled = false;
  } catch (err) { log('エラー: ' + err.message); }
});
document.getElementById('seedBtn').addEventListener('click', async () => {
  if (!seedData) return;
  const btn = document.getElementById('seedBtn');
  btn.disabled = true;
  try {
    let shape = null;
    try {
      shape = await KB.fetchSalesShape(seedData.fy);
      if (shape) log(`営業部の目標: 国内 ${fmt(shape.totals.domestic)} / ソリューション ${fmt(shape.totals.solution)}（この月別の形で各版の売上を配分）`);
    } catch (e) { log('営業部の目標を読めませんでした: ' + e.message); }
    if (!shape) {
      shape = await KB.priorYearShape(seedData.fy);
      log(shape ? '→ 代わりに前年度の売上実績の月別の形を使います' : '→ 前年度の実績も揃っていないため、12等分にします');
    }
    const cur = await KB.loadIndex();
    for (const sv of seedData.versions) {
      if ((cur.versions || []).some(v => v.id === sv.id)) { log(`${sv.id} は登録済みなのでスキップ`); continue; }
      const ver = KB.versionFromSeed(seedData, sv, shape, who());
      // 最後の版（確保計画）を採用中にする
      idx = await KB.saveNewVersion(ver, { activate: sv === seedData.versions[seedData.versions.length - 1] });
      verCache[ver.id] = ver;
      const t = KB.totals(ver);
      log(`OK ${ver.id} ${ver.name}: 売上 ${fmt(t.sales)} / 経費 ${fmt(t.cost)} / 営業利益 ${fmt(t.opInc)}`);
    }
    log('完了しました。');
    await afterLoad();
  } catch (e) {
    log('エラー: ' + e.message);
    btn.disabled = false;
  }
});

/* ============ 起動 ============ */
async function afterLoad() {
  const vs = idx.versions || [];
  document.getElementById('setup').style.display = vs.length ? 'none' : '';
  document.getElementById('mainBar').style.display = vs.length ? '' : 'none';
  if (!vs.length) { document.getElementById('content').innerHTML = ''; return; }
  const fys = [...new Set(vs.map(v => v.fy))].sort().reverse();
  if (!fys.includes(fy)) fy = fys[0];
  document.getElementById('fySel').innerHTML = fys.map(y => `<option value="${y}"${y === fy ? ' selected' : ''}>${y}年度</option>`).join('');
  if (!selectedId || !versionsOfFy().some(v => v.id === selectedId)) selectedId = activeId() || versionsOfFy().slice(-1)[0].id;
  await show();
}

document.getElementById('fySel').addEventListener('change', e => { fy = parseInt(e.target.value, 10); selectedId = null; afterLoad(); });
document.querySelectorAll('.tabs button').forEach(b => b.addEventListener('click', () => { view = b.dataset.view; show(); }));
document.getElementById('verSel').addEventListener('change', e => { selectedId = e.target.value; show(); });
document.getElementById('newBtn').addEventListener('click', startDraft);
document.getElementById('dSave').addEventListener('click', saveDraft);
document.getElementById('dReshape').addEventListener('click', reshapeDraft);
document.getElementById('dCancel').addEventListener('click', () => {
  if (!confirm('編集中の内容を破棄しますか？')) return;
  draft = null; show();
});
document.getElementById('activateBtn').addEventListener('click', async () => {
  const v = versionsOfFy().find(x => x.id === selectedId);
  if (!v || !confirm(`${v.id} ${v.name} を ${fy}年度の採用中の予算にしますか？\n月次資料の「予算」「予算差」がこの版で計算されます。`)) return;
  try {
    idx = await KB.activate(fy, selectedId, who());
    setStatus(`${v.id} を採用しました`);
    show();
  } catch (e) { alert(e.message); }
});
window.addEventListener('beforeunload', e => { if (draft) { e.preventDefault(); e.returnValue = ''; } });

async function boot() {
  const signedIn = await kaikeiInitAuth();
  if (!signedIn) return;
  document.getElementById('login-view').style.display = 'none';
  document.getElementById('app-view').style.display = 'block';
  idx = await KB.loadIndex();
  await afterLoad();
}

document.getElementById('login-btn').addEventListener('click', async () => {
  document.getElementById('login-err').textContent = '';
  try {
    await kaikeiSignIn();
    await boot();
  } catch (e) { document.getElementById('login-err').textContent = e.message || String(e); }
});
boot();
</script>

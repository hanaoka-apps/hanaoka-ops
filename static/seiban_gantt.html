<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>製番 製造スケジュール - FUJIN</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;color:#1f2937;background:#f1f5f9}
body{display:flex;flex-direction:column;overflow:hidden}
header{background:linear-gradient(90deg,#7c3aed,#0891b2);color:#fff;padding:9px 14px;display:flex;align-items:center;gap:10px;flex-shrink:0}
header h1{font-size:15px;margin:0;font-weight:800}.tag{font-size:10px;background:rgba(255,255,255,.22);padding:2px 7px;border-radius:999px;font-weight:700}.meta{font-size:11.5px;opacity:.92}
#collapseBtn{margin-right:10px;background:rgba(255,255,255,.18);border:none;color:#fff;font-family:inherit;font-size:12px;font-weight:700;padding:5px 11px;border-radius:7px;cursor:pointer}
#collapseBtn:hover{background:rgba(255,255,255,.3)}
.main{flex:1;display:flex;min-height:0}
.left{width:330px;flex-shrink:0;border-right:1px solid #d7dee7;background:#fff;display:flex;flex-direction:column;transition:width .15s}
body.collapsed .left{width:0;border:none;overflow:hidden}
.modetab{display:flex;border-bottom:1px solid #e2e8f0}
.modetab button{flex:1;padding:8px;border:none;background:#f8fafc;cursor:pointer;font-family:inherit;font-size:12.5px;font-weight:700;color:#64748b}
.modetab button.on{background:#fff;color:#6d28d9;box-shadow:inset 0 -2px 0 #7c3aed}
.lsearch{padding:8px;border-bottom:1px solid #e2e8f0;display:flex;flex-direction:column;gap:6px}
.lsearch input,.lsearch select{font-family:inherit;font-size:12.5px;padding:6px 9px;border:1px solid #cbd5e1;border-radius:7px}
.lsearch .row{display:flex;gap:8px;align-items:center;font-size:11px;color:#64748b;flex-wrap:wrap}
.llist{flex:1;overflow:auto}
.li{padding:7px 11px;border-bottom:1px solid #f1f5f9;cursor:pointer}.li:hover{background:#f5f3ff}.li.sel{background:#ede9fe;border-left:3px solid #7c3aed}
.li .sb{font-weight:700;font-size:12.5px;color:#6d28d9}.li .nm{font-size:11.5px;color:#475569;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .sub{display:flex;gap:7px;font-size:10.5px;color:#94a3b8;margin-top:2px;align-items:center}
.kbadge{font-size:9.5px;padding:0 6px;border-radius:999px;font-weight:700}.k-J{background:#dbeafe;color:#1e40af}.k-K{background:#fef3c7;color:#92400e}.k-P{background:#ede9fe;color:#6d28d9}
.right{flex:1;display:flex;flex-direction:column;min-width:0}
.rhead{padding:8px 14px;border-bottom:1px solid #e2e8f0;background:#fff;flex-shrink:0}
.rhead .t{font-size:15px;font-weight:800}.rhead .t small{font-weight:500;color:#475569;font-size:12.5px}
.rhead .s{font-size:12px;color:#475569;margin-top:2px;display:flex;gap:14px;flex-wrap:wrap;align-items:center}.rhead .s b{color:#6d28d9}
.rhead input{font-family:inherit;font-size:12px;padding:3px 6px;border:1px solid #cbd5e1;border-radius:6px}
.note{font-size:11px;color:#5b21b6;background:#f5f3ff;border-bottom:1px solid #ddd6fe;padding:5px 14px;flex-shrink:0}
.gwrap{flex:1;overflow:auto;min-height:0}
.tl{min-width:max-content;position:relative}
.months,.dayrow{display:flex}
.months{background:#6d28d9;color:#fff;position:sticky;top:0;z-index:6}
.month{border-left:1px solid rgba(255,255,255,.35);font-size:11px;font-weight:800;text-align:center;padding:3px 0}
.dayrow{background:#eef0f6;border-bottom:2px solid #c7cdd9;position:sticky;top:21px;z-index:6}
.spc{width:300px;flex-shrink:0;border-right:2px solid #cbd5e1;background:#eef0f6;position:sticky;left:0;z-index:7;display:flex;align-items:center;padding-left:10px;font-size:11px;color:#475569;font-weight:700}
.months .spc{background:#6d28d9;z-index:8}
.day{flex-shrink:0;text-align:center;font-size:11px;color:#334155;border-left:1px solid #d7dbe4;padding:3px 0;font-weight:600}
.day.mon{border-left:2px solid #94a3b8}.day.we{background:#dde1ea;color:#64748b}.day.today{background:#fbbf24;color:#7c2d12;font-weight:800}
.day small{display:block;font-size:8.5px;color:#94a3b8;font-weight:500}
.row{display:flex;border-bottom:1px solid #eef1f5}.row:hover{background:#faf8ff}
.lab{width:300px;flex-shrink:0;border-right:2px solid #e2e8f0;padding:4px 8px;font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;position:sticky;left:0;background:#fff;z-index:3}
.row:hover .lab{background:#faf8ff}
.lab .lv{display:inline-block;font-size:9px;color:#fff;border-radius:3px;padding:0 4px;margin-right:4px;font-weight:700}
.tagm{font-size:9px;padding:0 5px;border-radius:3px;margin-left:5px;font-weight:700}
.st-arr{background:#fef3c7;color:#92400e;border:1px solid #fde68a}.st-recv{background:#e5e7eb;color:#374151}.st-req{background:#fee2e2;color:#b91c1c;border:1px solid #fca5a5;font-weight:800}
.wp-in{background:#dcfce7;color:#166534}.wp-out{background:#ffe4e6;color:#9f1239}.wp-non{background:#f1f5f9;color:#94a3b8}
.track{flex:1;position:relative;min-height:26px}
.gc{position:absolute;top:0;bottom:0;border-left:1px solid #f2f4f8}.gc.mon{border-left:1px solid #dde1ea}.gc.we{background:#fafbfc}
.bar{position:absolute;top:4px;height:18px;border-radius:4px;display:flex;align-items:center;padding:0 7px;font-size:10.5px;font-weight:700;color:#fff;white-space:nowrap;overflow:hidden;min-width:16px;z-index:1}
.bar.arr{box-shadow:0 1px 2px rgba(0,0,0,.2)}
.bar.req{background-image:repeating-linear-gradient(45deg,rgba(255,255,255,.4) 0 5px,transparent 5px 10px);border:1.5px dashed rgba(255,255,255,.95)}
.prodrow{background:#faf5ff}.prodrow .lab{background:#faf5ff}
/* 2026-07-06 状態別背景帯: 赤=未手配(要発注) / 黄=手配済・仕掛中(未入荷) / グレー=受入済(完了) */
.band{position:absolute;top:0;bottom:0;left:0;right:0;pointer-events:none}
.band.b-req{background:rgba(239,68,68,.16)}
.band.b-req.late{background:rgba(220,38,38,.28)}
.band.b-arr{background:rgba(234,179,8,.18)}
.band.b-recv{background:rgba(148,163,184,.10)}
.row.s-req .lab{background:#fef2f2;border-left:4px solid #ef4444;font-weight:600}
.row.s-req.late .lab{background:#fee2e2;border-left:4px solid #b91c1c}
.row.s-arr .lab{background:#fefce8;border-left:4px solid #eab308}
.row.s-recv .lab{background:#f8fafc;border-left:4px solid #94a3b8;color:#64748b}
.row.s-req:hover .lab{background:#fee2e2}.row.s-arr:hover .lab{background:#fef9c3}.row.s-recv:hover .lab{background:#f1f5f9}
.tagm.st-late{background:#dc2626;color:#fff;border:none}
.bar.overdue{outline:2px solid #dc2626;outline-offset:1px;box-shadow:0 0 0 1px #fff}
/* 要発注リスト ボタン & モーダル */
.obtn{font-family:inherit;font-size:12px;font-weight:800;padding:4px 12px;border-radius:7px;border:1px solid #dc2626;background:#dc2626;color:#fff;cursor:pointer}
.obtn:hover{background:#b91c1c}
.jbtn{font-family:inherit;font-size:11px;font-weight:800;padding:2px 9px;border-radius:6px;border:1px solid #7c3aed;background:#7c3aed;color:#fff;cursor:pointer;white-space:nowrap}.jbtn:hover{background:#6d28d9}
.obtn:disabled{background:#e2e8f0;border-color:#cbd5e1;color:#94a3b8;cursor:default}
#omask{position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:50;display:none;align-items:center;justify-content:center}
#omask.show{display:flex}
#opanel{background:#fff;border-radius:12px;width:min(880px,94vw);max-height:86vh;display:flex;flex-direction:column;box-shadow:0 18px 50px rgba(0,0,0,.35)}
.ohead{padding:12px 16px;border-bottom:1px solid #e2e8f0;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.ohead .ot{font-size:14px;font-weight:800;color:#b91c1c}
.ohead .osub{font-size:11.5px;color:#475569;flex:1;min-width:180px}
.ohead button{font-family:inherit;font-size:11.5px;font-weight:700;padding:5px 11px;border-radius:7px;border:1px solid #cbd5e1;background:#f8fafc;cursor:pointer;color:#334155}
.ohead button:hover{background:#eef2f7}
.ohead .oclose{border:none;background:none;font-size:17px;color:#94a3b8;padding:2px 6px}
.obody{overflow:auto;padding:0 16px 16px}
.obody table{border-collapse:collapse;width:100%;font-size:12px;margin-top:10px}
.obody th{position:sticky;top:0;background:#f1f5f9;color:#475569;font-size:11px;text-align:left;padding:5px 8px;border-bottom:2px solid #cbd5e1;white-space:nowrap}
.obody td{padding:4px 8px;border-bottom:1px solid #eef1f5;white-space:nowrap}
.obody tr.late td{color:#b91c1c;font-weight:700;background:#fef2f2}
.obody .num{text-align:right}
.ofoot{padding:8px 16px;border-top:1px solid #eef2f6;font-size:11px;color:#64748b}
.dueline{position:absolute;top:0;bottom:0;border-left:2px dashed #dc2626;z-index:2}
.todayline{position:absolute;top:0;bottom:0;width:2px;background:#f59e0b;z-index:2}
.empty{padding:50px;text-align:center;color:#94a3b8}
.legend{display:flex;gap:11px;font-size:11px;color:#475569;align-items:center;padding:6px 14px;border-top:1px solid #eef2f6;flex-shrink:0;background:#fff;flex-wrap:wrap}
.sw{width:12px;height:12px;border-radius:3px;display:inline-block;vertical-align:-2px;margin-right:3px}
.swh{background-image:repeating-linear-gradient(45deg,#888 0 3px,#ccc 3px 6px);border:1px dashed #555}
#tip{position:fixed;pointer-events:none;z-index:99;background:#1f2937;color:#fff;font-size:11px;padding:5px 9px;border-radius:6px;white-space:pre-line;max-width:340px;box-shadow:0 4px 14px rgba(0,0,0,.32);display:none;line-height:1.5}
</style></head><body>
<header><button id="collapseBtn">◀ 一覧を隠す</button><h1>🏭 製番 製造スケジュール</h1><span class="tag">BOM×リードタイム逆算</span><span class="meta" id="meta"></span></header>
<div class="main">
  <div class="left">
    <div class="modetab"><button id="mSb" class="on">製番から</button><button id="mPr">製品から(計画)</button></div>
    <div class="lsearch" id="sbCtl">
      <input id="q" placeholder="製番 / 品目 / 顧客">
      <div class="row"><label>区分</label><select id="kind"><option value="all">全</option><option value="J">受注J</option><option value="K">計画K</option></select>
        <label>並び</label><select id="sort"><option value="due">納期順(直近から)</option><option value="parts">部品数順</option><option value="sb">製番順</option></select></div>
      <div class="row" style="color:#16a34a;font-weight:700">完了製番は除外済</div>
    </div>
    <div class="lsearch" id="prCtl" style="display:none"><input id="pq" placeholder="製品コード / 品目名 で検索 (例: LVC75)"></div>
    <div class="llist" id="llist"></div>
  </div>
  <div class="right">
    <div class="rhead" id="rhead"><div class="t">製番または製品を選んでください</div></div>
    <div class="note" id="note" style="display:none"></div>
    <div class="gwrap" id="gwrap"><div class="empty">左で選ぶと、BOM展開×リードタイム逆算の製造日程が出ます。</div></div>
    <div class="legend">
      <span>階層:</span><span><span class="sw" style="background:#7c3aed"></span>製品</span><span><span class="sw" style="background:#2563eb"></span>L1</span><span><span class="sw" style="background:#0891b2"></span>L2</span><span><span class="sw" style="background:#059669"></span>L3+</span>
      <span>｜行の色:</span><span><span class="sw" style="background:rgba(239,68,68,.3);outline:1px solid #ef4444"></span><b style="color:#b91c1c">赤=未手配 → 要発注</b></span><span><span class="sw" style="background:rgba(220,38,38,.55)"></span>濃い赤=⚠至急(着手日を過ぎた未手配)</span><span><span class="sw" style="background:rgba(234,179,8,.35);outline:1px solid #ca8a04"></span>黄=手配済・入荷待ち(仕掛)</span><span><span class="sw" style="background:#e2e8f0;outline:1px solid #cbd5e1"></span>グレー=✓受入済(完了)</span>
      <span>｜</span><span><span class="tagm wp-in">社内</span></span><span><span class="tagm wp-out">外注</span></span>
      <span>｜</span><span><span class="sw" style="background:#dc2626;width:2px"></span>納期</span><span><span class="sw" style="background:#f59e0b;width:2px"></span>今日</span>
    </div>
  </div>
</div>
<div id="omask">
  <div id="opanel">
    <div class="ohead">
      <span class="ot">🛒 要発注リスト（未手配部品）</span><span class="osub" id="osub"></span>
      <button id="oCopy">📋 コピー(TSV)</button><button id="oCsv">⬇ CSVダウンロード</button><button class="oclose" id="oClose" title="閉じる">✕</button>
    </div>
    <div class="obody"><table id="otbl"></table></div>
    <div class="ofoot">⚠赤字=着手すべき日が過去(至急)。「コピー」はExcel/SMILEにそのまま貼れます。CSVはUTF-8(BOM付き)でExcel対応。</div>
  </div>
</div>
<script>try{if(window.top&&window.top._fujinSeibanGantt)window.RVX=window.top._fujinSeibanGantt;}catch(e){}if(!window.RVX&&window.SEIBAN_GANTT)window.RVX=window.SEIBAN_GANTT;if(!window.RVX)window.RVX={bom:{},lt:{},arr:[],recv:[],wp:{},sb:[],pnm:{}};
const X=window.RVX||{};const BOM=X.bom||{},LT=X.lt||{},ARR=new Set(X.arr||[]),RECV=new Set(X.recv||[]),WP=X.wp||{},SB=X.sb||[],PNM=X.pnm||{};
const TODAY=(function(){var d=new Date();d.setHours(0,0,0,0);return d;})();const LVCOL=["#7c3aed","#2563eb","#0891b2","#059669","#65a30d","#ca8a04","#dc2626","#9333ea"];
const DW=24;
function ymd(d){return d.getFullYear()+"/"+String(d.getMonth()+1).padStart(2,"0")+"/"+String(d.getDate()).padStart(2,"0");}
function pd(s){if(!s)return null;const p=(s||"").split("/");if(p.length!==3)return null;const d=new Date(+p[0],+p[1]-1,+p[2]);return isNaN(d)?null:d;}
function addD(d,n){const x=new Date(d);x.setDate(x.getDate()+n);return x;}
function diffD(a,b){return Math.round((b-a)/86400000);}
function getlt(c){return LT[c]||1;}
function explode(root,maxn=250){const agg={};const dq=[[root,0,1]];const vis=new Set([root]);
  while(dq.length){const [c,dep,mult]=dq.shift();if(dep>7)continue;
    for(const ch of (BOM[c]||[])){const code=ch.child,q=mult*(ch.qty_num/(ch.qty_den||1));
      if(agg[code]){agg[code].q+=q;}else{agg[code]={lv:dep+1,name:ch.child_name,q:q,p:c,lt:getlt(code)};if(Object.keys(agg).length>=maxn)return agg;}
      if(!vis.has(code)){vis.add(code);dq.push([code,dep+1,q]);}}}
  return agg;}
function partCount(it){return Object.keys(explode(it,260)).length;}
let mode="sb",cur=null,calcDue=null,calcQty=1;
let _req={label:"",pname:"",due:"",list:[]}; // 選択中製番の未手配(要発注)部品
function fq(n){return (Math.round(n*1000)/1000).toString();}
function eh(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
const REQ_COLS=["品目コード","品目名","取数","あるべき着手日","あるべき納期","作業区"];
function openOrderList(){
  document.getElementById("osub").textContent=`${_req.label}（${_req.pname}） 納期 ${_req.due||"—"} / 未手配 ${_req.list.length}件`;
  const body=_req.list.map(r=>`<tr class="${r.late?'late':''}"><td>${eh(r.c)}</td><td>${eh(r.name)}</td><td class="num">${fq(r.q)}</td><td>${r.late?'⚠ ':''}${r.st}</td><td>${r.fin}</td><td>${eh(r.wp)||'—'}</td><td><button class="jbtn" data-code="${eh(r.c)}" title="この品目を手配確定タブで開く">手配確定へ →</button></td></tr>`).join("");
  document.getElementById("otbl").innerHTML=`<thead><tr>${REQ_COLS.map(h=>`<th>${h}</th>`).join("")}<th>手配確定</th></tr></thead><tbody>${body}</tbody>`;
  document.getElementById("omask").classList.add("show");}
function closeOrderList(){document.getElementById("omask").classList.remove("show");}
// 発注リストから手配確定タブへジャンプ(該当品目の内容を開く)。シェルがhashを中継し、手配確定が#code=で該当品目を開く。
function jumpArrange(code){try{window.top.location.hash='tab=arrange&code='+encodeURIComponent(code);}catch(e){try{window.parent.location.hash='tab=arrange&code='+encodeURIComponent(code);}catch(_){}}closeOrderList();}
function reqRows(){return _req.list.map(r=>[r.c,r.name,fq(r.q),(r.late?"⚠":"")+r.st,r.fin,r.wp]);}
function copyReq(){const btn=document.getElementById("oCopy");
  const tsv=[REQ_COLS.join("\t")].concat(reqRows().map(r=>r.map(v=>String(v).replace(/[\t\n\r]/g," ")).join("\t"))).join("\n");
  const done=()=>{btn.textContent="✓ コピーしました";setTimeout(()=>{btn.textContent="📋 コピー(TSV)";},1600);};
  const fb=()=>{const ta=document.createElement("textarea");ta.value=tsv;ta.style.position="fixed";ta.style.opacity="0";document.body.appendChild(ta);ta.select();try{document.execCommand("copy");done();}catch(e){}ta.remove();};
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(tsv).then(done).catch(fb);}else fb();}
function dlReqCsv(){const esc=v=>{v=String(v);return /[",\n\r]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;};
  const csv="\uFEFF"+[REQ_COLS.map(esc).join(",")].concat(reqRows().map(r=>r.map(esc).join(","))).join("\r\n");
  const blob=new Blob([csv],{type:"text/csv;charset=utf-8"});const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);a.download=`要発注_${_req.label}_${ymd(TODAY).replace(/\//g,"")}.csv`;
  document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),3000);}
document.getElementById("oClose").onclick=closeOrderList;
document.getElementById("omask").addEventListener("click",e=>{if(e.target===e.currentTarget)closeOrderList();});
document.getElementById("oCopy").onclick=copyReq;
document.getElementById("oCsv").onclick=dlReqCsv;
document.getElementById("otbl").addEventListener("click",e=>{const b=e.target.closest(".jbtn");if(b&&b.dataset.code)jumpArrange(b.dataset.code);});
document.getElementById("collapseBtn").onclick=function(){document.body.classList.toggle("collapsed");this.textContent=document.body.classList.contains("collapsed")?"▶ 一覧を表示":"◀ 一覧を隠す";};
function setMode(m){mode=m;document.getElementById("mSb").classList.toggle("on",m==="sb");document.getElementById("mPr").classList.toggle("on",m==="pr");
  document.getElementById("sbCtl").style.display=m==="sb"?"":"none";document.getElementById("prCtl").style.display=m==="pr"?"":"none";cur=null;renderList();}
document.getElementById("mSb").onclick=()=>setMode("sb");document.getElementById("mPr").onclick=()=>setMode("pr");
document.getElementById("meta").textContent=`進行中${SB.length}製番(完了除外) / BOM製品${Object.keys(BOM).length}`;
const _pc={};function pcOf(it){if(_pc[it]===undefined)_pc[it]=partCount(it);return _pc[it];}
function renderList(){
  const box=document.getElementById("llist");
  if(mode==="sb"){
    const q=document.getElementById("q").value.trim().toLowerCase(),kind=document.getElementById("kind").value,sort=document.getElementById("sort").value;
    let arr=SB.filter(s=>{if(kind!=="all"&&s.k!==kind)return false;
      if(q){const nm=(PNM[s.it]||"").toLowerCase();if(!(s.sb.toLowerCase().includes(q)||s.it.toLowerCase().includes(q)||nm.includes(q)||(s.cu||"").toLowerCase().includes(q)))return false;}return true;});
    arr.sort((a,b)=>{if(sort==="parts")return pcOf(b.it)-pcOf(a.it)||((a.due||"9")<(b.due||"9")?-1:1);if(sort==="due")return (a.due||"9")<(b.due||"9")?-1:1;return a.sb<b.sb?-1:1;});
    if(!arr.length){box.innerHTML='<div class="empty">該当なし</div>';return;}
    box.innerHTML=arr.slice(0,300).map(s=>`<div class="li ${s.sb===cur?'sel':''}" data-sb="${s.sb}"><div class="sb">${s.sb} <span class="kbadge k-${s.k}">${s.k==='J'?'受注':'計画'}</span></div><div class="nm">${PNM[s.it]||s.it}</div><div class="sub"><span>${pcOf(s.it)}部品</span><span>納期 ${s.due||'—'}</span><span>残${s.rem}</span></div></div>`).join("");
    box.querySelectorAll(".li").forEach(li=>li.onclick=()=>{cur=li.dataset.sb;renderList();const s=SB.find(x=>x.sb===cur);renderGantt(s.it,s.due,s.q,{sb:s.sb,kind:s.k,cust:s.cu,rem:s.rem});});
  }else{
    const q=document.getElementById("pq").value.trim().toLowerCase();
    let arr=Object.keys(BOM).map(c=>({c,n:PNM[c]||""}));
    if(q)arr=arr.filter(x=>x.c.toLowerCase().includes(q)||x.n.toLowerCase().includes(q));
    arr.sort((a,b)=>pcOf(b.c)-pcOf(a.c));
    if(!arr.length){box.innerHTML='<div class="empty">該当なし</div>';return;}
    box.innerHTML=arr.slice(0,200).map(x=>`<div class="li ${x.c===cur?'sel':''}" data-c="${x.c}"><div class="sb">${x.c} <span class="kbadge k-P">計画</span></div><div class="nm">${x.n||''}</div><div class="sub"><span>${pcOf(x.c)}部品</span></div></div>`).join("");
    box.querySelectorAll(".li").forEach(li=>li.onclick=()=>{cur=li.dataset.c;renderList();const it=cur;const ex=explode(it);const tot=estTotalLT(it,ex);calcDue=calcDue||ymd(addD(TODAY,tot));renderGantt(it,calcDue,calcQty,{calc:true});});
  }
}
function estTotalLT(it,ex){const byLv={};Object.values(ex).forEach(v=>{byLv[v.lv]=Math.max(byLv[v.lv]||0,v.lt);});let s=getlt(it);Object.values(byLv).forEach(x=>s+=x);return s;}
function schedule(it,dueStr){const due=pd(dueStr)||addD(TODAY,30);const ex=explode(it);
  const fin={},st={};fin[it]=due;st[it]=addD(due,-(getlt(it)||1));
  Object.entries(ex).sort((a,b)=>a[1].lv-b[1].lv).forEach(([c,v])=>{const ps=st[v.p]!==undefined?st[v.p]:due;fin[c]=ps;st[c]=addD(ps,-(v.lt||1));});
  return {due,ex,fin,st};}
function wpTag(c){const w=WP[c];if(!w)return '';const io=w[1]||"";const ext=io.indexOf("外")>=0;const cls=io.indexOf("内")>=0?"wp-in":(ext?"wp-out":"wp-non");return `<span class="tagm ${cls}">${w[0]}${ext?"·外注":"·社内"}</span>`;}
function statusTag(c,overdue){return RECV.has(c)?'<span class="tagm st-recv">✓受入済</span>':ARR.has(c)?'<span class="tagm st-arr">手配済</span>':(overdue?'<span class="tagm st-late">⚠至急・未手配</span>':'<span class="tagm st-req">未手配</span>');}
function renderGantt(it,dueStr,qty,info){
  info=info||{};const sc=schedule(it,dueStr);const {due,ex,fin,st}=sc;
  let mins=st[it];Object.values(st).forEach(d=>{if(d<mins)mins=d;});
  let lo=addD(mins,-2),hi=addD(due,2);if(TODAY<lo)lo=addD(TODAY,-1);if(TODAY>hi)hi=addD(TODAY,1);
  let nd=diffD(lo,hi)+1;if(nd<10){hi=addD(lo,9);nd=10;}
  const parts=Object.entries(ex).map(([c,v])=>({c,...v}));const totalLT=diffD(mins,due);const late=mins<TODAY;
  // 未手配(=要発注)部品を抽出して保持(要発注リスト用)
  const reqParts=parts.filter(p=>!RECV.has(p.c)&&!ARR.has(p.c)).sort((a,b)=>st[a.c]-st[b.c]||a.lv-b.lv);
  _req={label:info.sb||it,pname:PNM[it]||it,due:dueStr||"",list:reqParts.map(p=>{const w=WP[p.c];const io=w?(w[1]||""):"";
    return {c:p.c,name:p.name||"",q:p.q,st:ymd(st[p.c]),fin:ymd(fin[p.c]),late:st[p.c]<TODAY,wp:w?w[0]+(io.indexOf("外")>=0?"(外注)":io.indexOf("内")>=0?"(社内)":""):""};})};
  const nReq=_req.list.length;
  const obtn=`<span><button id="orderBtn" class="obtn"${nReq?'':' disabled'}>🛒 未手配 ${nReq}件 → 発注リスト</button></span>`;
  let head;
  if(info.calc){head=`<div class="t">${it} <span class="kbadge k-P">計画</span> <small>${PNM[it]||''}</small></div>
    <div class="s"><span>納期 <input type="date" id="cDue" value="${dueStr.replace(/\//g,'-')}"></span><span>数量 <input type="number" id="cQty" value="${qty||1}" style="width:60px"></span><span>部品 <b>${parts.length}</b></span><span>総L/T <b>${totalLT}日</b></span><span>最早着手 <b>${ymd(mins)}</b></span>${late?'<span style="color:#dc2626;font-weight:800">⚠ 着手が過去=要前倒し</span>':''}${obtn}</div>`;
  }else{head=`<div class="t">${info.sb} <span class="kbadge k-${info.kind}">${info.kind==='J'?'受注':'計画'}</span> <small>${PNM[it]||it}</small></div>
    <div class="s"><span>顧客 <b>${info.cust||'—'}</b></span><span>納期 <b>${dueStr||'—'}</b></span><span>残 <b>${info.rem}</b></span><span>部品 <b>${parts.length}</b></span><span>総L/T <b>${totalLT}日</b></span><span>最早着手 <b>${ymd(mins)}</b></span>${late?'<span style="color:#dc2626;font-weight:800">⚠ 着手が過去</span>':''}${obtn}</div>`;}
  document.getElementById("rhead").innerHTML=head;
  const ob=document.getElementById("orderBtn");if(ob&&nReq)ob.onclick=openOrderList;
  const noteEl=document.getElementById("note");noteEl.style.display="";
  noteEl.innerHTML=`⚠ 実績ではなくBOM×リードタイムで納期から逆算した「あるべき日程」。行の背景色が状態です: <b style="background:rgba(239,68,68,.2);color:#b91c1c;padding:0 4px;border-radius:3px">赤=未手配 → 要発注</b>(所要量計算のみ・まだ何も動いていない)、<b style="background:rgba(220,38,38,.4);color:#7f1d1d;padding:0 4px;border-radius:3px">濃い赤=⚠至急</b>(着手すべき日を過ぎている)、<b style="background:rgba(234,179,8,.3);color:#92400e;padding:0 4px;border-radius:3px">黄=手配済</b>(発注/製造手配あり・入荷待ち=仕掛)、<b style="background:#e2e8f0;color:#475569;padding:0 4px;border-radius:3px">グレー=✓受入済</b>(来ている=完了)。作業区バッジで社内/外注。`;
  if(info.calc){setTimeout(()=>{const cd=document.getElementById("cDue");if(cd)cd.onchange=e=>{calcDue=e.target.value.replace(/-/g,"/");renderGantt(it,calcDue,calcQty,info);};const cq=document.getElementById("cQty");if(cq)cq.onchange=e=>{calcQty=+e.target.value||1;};},0);}
  const xOf=d=>diffD(lo,d)*DW;const wk=["日","月","火","水","木","金","土"];let days=[];for(let i=0;i<nd;i++)days.push(addD(lo,i));
  let months=[];days.forEach(d=>{const k=d.getFullYear()+"-"+d.getMonth();if(!months.length||months[months.length-1].k!==k)months.push({k,y:d.getFullYear(),m:d.getMonth()+1,n:0});months[months.length-1].n++;});
  const monthRow=months.map(mo=>`<div class="month" style="width:${mo.n*DW}px">${mo.y}年${mo.m}月</div>`).join("");
  const dayRow=days.map(d=>{const dw=d.getDay();const c=['day'];if(dw===1)c.push('mon');if(dw===0||dw===6)c.push('we');if(ymd(d)===ymd(TODAY))c.push('today');return `<div class="${c.join(' ')}" style="width:${DW}px">${d.getDate()}<small>${wk[dw]}</small></div>`;}).join("");
  const trackW=nd*DW;const dueX=xOf(due),todayX=xOf(TODAY)+DW/2;
  const gcs=days.map((d,i)=>{const dw=d.getDay();const c=['gc'];if(dw===1)c.push('mon');if(dw===0||dw===6)c.push('we');return `<div class="${c.join(' ')}" style="left:${i*DW}px;width:${DW}px"></div>`;}).join("");
  const lines=`${gcs}<div class="todayline" style="left:${todayX}px"></div><div class="dueline" style="left:${dueX+DW}px"></div>`;
  function bar(code,name,lv,a,b,overdue){const left=xOf(a),w=Math.max(diffD(a,b)*DW,16);const rc=RECV.has(code),arr=ARR.has(code);const col=rc?'#9ca3af':LVCOL[Math.min(lv,7)];const cls=(rc||arr)?'arr':'req';const stt=rc?'受入済(実績あり=来ている)':arr?'手配済(未入荷)':(overdue?'⚠未手配・発注遅れ(着手すべき日が過去)':'未手配(所要量計算のみ)');
    return `<div class="bar ${cls}${overdue?' overdue':''}" style="left:${left}px;width:${w}px;background:${col}" data-tip="${name} (${code})\nLT${getlt(code)}日 ${ymd(a)}→${ymd(b)}\n${stt}">${name}</div>`;}
  let rows=`<div class="row prodrow"><div class="lab"><span class="lv" style="background:#7c3aed">製品</span>${PNM[it]||it}${wpTag(it)}</div><div class="track" style="width:${trackW}px">${lines}${bar(it,PNM[it]||it,0,st[it],fin[it])}</div></div>`;
  parts.sort((a,b)=>st[a.c]-st[b.c]||a.lv-b.lv).forEach(pt=>{const col=LVCOL[Math.min(pt.lv,7)];
    const isRecv=RECV.has(pt.c),isArr=ARR.has(pt.c);const overdue=!isRecv&&!isArr&&st[pt.c]<TODAY; // 未手配なのに着手日が過去=至急
    const stCls=isRecv?'s-recv':isArr?'s-arr':'s-req'; // 状態→行クラス: 赤=未手配/黄=手配済/グレー=受入済
    const rowcls='row '+stCls+(overdue?' late':'');
    const band=`<div class="band ${isRecv?'b-recv':isArr?'b-arr':'b-req'+(overdue?' late':'')}"></div>`;
    rows+=`<div class="${rowcls}"><div class="lab" data-tip="${pt.name} (${pt.c})"><span class="lv" style="background:${col}">L${pt.lv}</span>${pt.name}${statusTag(pt.c,overdue)}${wpTag(pt.c)}</div><div class="track" style="width:${trackW}px">${lines}${band}${bar(pt.c,pt.name+" (LT"+pt.lt+")",pt.lv,st[pt.c],fin[pt.c],overdue)}</div></div>`;});
  document.getElementById("gwrap").innerHTML=`<div class="tl">
    <div class="months"><div class="spc">部品 / 工程(作業区)</div><div style="display:flex">${monthRow}</div></div>
    <div class="dayrow"><div class="spc">日付</div><div style="display:flex">${dayRow}</div></div>
    ${rows}</div>`;
}
["q","kind","sort"].forEach(id=>{const e=document.getElementById(id);e.addEventListener(e.tagName==="INPUT"?"input":"change",renderList);});
document.getElementById("pq").addEventListener("input",renderList);
const _tip=document.getElementById("tip");const _gw=document.getElementById("gwrap");
_gw.addEventListener("mouseover",e=>{const b=e.target.closest("[data-tip]");if(b){_tip.textContent=b.getAttribute("data-tip");_tip.style.display="block";}});
_gw.addEventListener("mousemove",e=>{if(_tip.style.display==="block"){_tip.style.left=Math.min(e.clientX+14,window.innerWidth-350)+"px";_tip.style.top=(e.clientY+18)+"px";}});
_gw.addEventListener("mouseout",e=>{const b=e.target.closest("[data-tip]");if(b)_tip.style.display="none";});
renderList();
const f=SB.slice().sort((a,b)=>(a.due||"9999")<(b.due||"9999")?-1:1)[0];
if(f){cur=f.sb;renderList();renderGantt(f.it,f.due,f.q,{sb:f.sb,kind:f.k,cust:f.cu,rem:f.rem});}
</script><div id="tip"></div>
</body></html>

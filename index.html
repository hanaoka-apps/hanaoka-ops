<head>

<title>HANAOKA HUB</title>
<style>
  :root {
    --sidebar-bg: #14161f;
    --sidebar-active: #2455e6;
    --sidebar-text: #b7bac6;
    --bg: #f2f4f8;
    --card-bg: #ffffff;
    --border: #e6e8ee;
    --text-main: #1b1e28;
    --text-sub: #6b7080;
    --accent-blue: #1d4ed8;
    --accent-green: #16a34a;
    --accent-red: #c0392b;
    --accent-orange: #e08a1e;
    --radius: 14px;
    --shadow: 0 1px 3px rgba(20, 22, 31, 0.06), 0 1px 2px rgba(20, 22, 31, 0.04);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: "Hiragino Kaku Gothic ProN", "Yu Gothic", "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--text-main);
    display: flex;
    min-height: 100vh;
  }

  a { text-decoration: none; color: inherit; }
  button { font-family: inherit; }

  /* ---------- Sidebar ---------- */
  .sidebar {
    width: 240px;
    flex-shrink: 0;
    background: var(--sidebar-bg);
    color: var(--sidebar-text);
    padding: 22px 14px;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .brand {
    color: #fff;
    font-size: 19px;
    font-weight: 700;
    letter-spacing: 0.5px;
    padding: 6px 12px 26px;
  }

  .nav-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 11px 12px;
    border-radius: 10px;
    font-size: 14px;
    font-weight: 500;
    color: var(--sidebar-text);
  }

  .nav-item svg { flex-shrink: 0; }

  .nav-item:hover { background: rgba(255,255,255,0.06); color: #fff; }

  .nav-item.active {
    background: var(--sidebar-active);
    color: #fff;
  }

  /* ---------- Main ---------- */
  .main {
    flex: 1;
    padding: 28px 36px 60px;
    max-width: 1280px;
  }

  .topbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 22px;
  }

  .greeting {
    font-size: 24px;
    font-weight: 700;
  }

  .top-actions {
    display: flex;
    align-items: center;
    gap: 14px;
  }

  .signin-btn {
    background: var(--accent-blue);
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 9px 16px;
    font-size: 13.5px;
    font-weight: 700;
    cursor: pointer;
  }
  .signin-btn:hover { background: #1741ad; }
  .signin-btn:disabled { opacity: 0.6; cursor: default; }

  .icon-btn {
    position: relative;
    width: 38px;
    height: 38px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--text-main);
    background: transparent;
  }
  .icon-btn:hover { background: #e9ecf3; }

  .icon-btn .dot {
    position: absolute;
    top: 7px;
    right: 8px;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #f5a524;
    border: 2px solid var(--bg);
  }

  .avatar {
    position: relative;
    width: 38px;
    height: 38px;
    border-radius: 50%;
    background: var(--accent-blue);
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-size: 15px;
    overflow: hidden;
  }
  .avatar img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  .avatar[hidden] { display: none; }

  /* ---------- Grid rows ---------- */
  .row-top {
    display: grid;
    grid-template-columns: 1.4fr 1fr;
    gap: 20px;
    margin-bottom: 24px;
  }

  .card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 20px 22px;
  }

  .card-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 14px;
  }

  .card-title {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 15px;
    font-weight: 700;
  }

  .card-title svg { color: var(--accent-blue); }

  .card-link {
    font-size: 13px;
    font-weight: 600;
    color: var(--accent-blue);
    display: flex;
    align-items: center;
    gap: 2px;
  }

  /* empty / loading / error state */
  .empty-state {
    padding: 26px 4px;
    text-align: center;
    color: var(--text-sub);
    font-size: 13.5px;
  }
  .empty-state.error { color: var(--accent-red); }
  .empty-state .mini-signin {
    display: inline-block;
    margin-top: 10px;
    background: var(--accent-blue);
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 7px 14px;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
  }

  /* schedule list */
  .schedule-item {
    display: grid;
    grid-template-columns: 110px 1fr auto;
    align-items: center;
    gap: 14px;
    padding: 12px 4px;
    border-bottom: 1px solid var(--border);
    font-size: 14px;
  }
  .schedule-item:last-child { border-bottom: none; }

  .schedule-time { color: var(--text-sub); font-variant-numeric: tabular-nums; }
  .schedule-title { font-weight: 600; }
  .schedule-loc {
    display: flex;
    align-items: center;
    gap: 4px;
    color: var(--text-sub);
    font-size: 13px;
    white-space: nowrap;
  }

  /* task list */
  .task-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 11px 4px;
    border-bottom: 1px solid var(--border);
    font-size: 14px;
  }
  .task-item:last-child { border-bottom: none; }

  .task-check {
    width: 18px;
    height: 18px;
    border-radius: 5px;
    border: 1.5px solid #c7cbd6;
    flex-shrink: 0;
  }

  .task-label { flex: 1; }

  .task-due {
    display: flex;
    align-items: center;
    gap: 4px;
    font-size: 12.5px;
    color: var(--accent-orange);
    white-space: nowrap;
  }

  /* ---------- KPI section ---------- */
  .section-title {
    font-size: 16px;
    font-weight: 700;
    margin: 0 0 14px;
  }

  .kpi-row {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 20px;
    margin-bottom: 30px;
  }

  .kpi-card { padding: 20px 22px; }

  .kpi-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 14px;
  }

  .kpi-label {
    display: flex;
    align-items: center;
    gap: 10px;
    font-weight: 700;
    font-size: 14.5px;
  }

  .kpi-icon {
    width: 30px;
    height: 30px;
    border-radius: 8px;
    background: var(--accent-blue);
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  .kpi-sub { font-size: 12px; color: var(--text-sub); }

  .kpi-body {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 16px;
  }

  .kpi-value { font-size: 30px; font-weight: 800; line-height: 1; }
  .kpi-value span { font-size: 15px; font-weight: 600; margin-left: 2px; }

  .kpi-delta {
    margin-top: 8px;
    font-size: 13px;
    font-weight: 700;
    color: var(--accent-green);
  }
  .kpi-delta.neg { color: var(--accent-red); }
  .kpi-delta.muted { color: var(--text-sub); font-weight: 500; }

  .kpi-chart { flex-shrink: 0; }

  /* ---------- App launcher ---------- */
  .app-grid {
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    gap: 18px;
    margin-bottom: 22px;
  }

  .app-tile {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 26px 12px 18px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    transition: transform 0.12s ease, box-shadow 0.12s ease;
  }
  .app-tile:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 16px rgba(20,22,31,0.10);
  }

  .app-icon {
    width: 46px;
    height: 46px;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
  }

  .app-tile span { font-size: 13.5px; font-weight: 600; }

  /* ---------- Announcement bar ---------- */
  .announce-bar {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 16px 22px;
  }

  .announce-icon {
    width: 34px;
    height: 34px;
    border-radius: 50%;
    background: var(--accent-blue);
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  .announce-list {
    flex: 1;
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 13.5px;
    color: var(--text-sub);
    overflow: hidden;
    white-space: nowrap;
  }
  .announce-list b { color: var(--text-main); font-weight: 600; }
  .announce-sep { color: var(--border); }

  @media (max-width: 1100px) {
    .row-top { grid-template-columns: 1fr; }
    .kpi-row { grid-template-columns: repeat(3, 1fr); }
    .app-grid { grid-template-columns: repeat(3, 1fr); }
  }

  @media (max-width: 640px) {
    .sidebar { display: none; }
    .kpi-row, .app-grid { grid-template-columns: repeat(2, 1fr); }
  }
</style>

  mastersDriveId: 'b!JT-BVyiLrECv-h59BtVoApKOQutjbKlGoUT2oig6LyO5ej8pUQ4QQIYH904CzeZ8',
  targetsListId: '9cb1ee3e-8af9-4f6a-a910-78b12385437e',
};

// dashboard_facts.json の行スキーマ（sales_dashboard.html と同一）
const IDX = {
  ym:0, fy:1, cust_cd:2, cust_abbr:3, genre:4,
  new_kind:5, sho_bunrui:6, voucher_date:7,
  deliver_cd:8, deliver_nm:9, rep_cd:10, rep_nm:11,
  bumon:12, chu_bumon:13, base:14, sales_div:15,

  qty:20, amount:21, unit_price:22, kind:23,
};

let msalInstance = null;
let account = null;

function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// ============================================================
// INIT / AUTH
// ============================================================
async function initAuth() {
  document.getElementById('signInBtn').onclick = login;
  msalInstance = new msal.PublicClientApplication(MSAL_CONFIG);
  await msalInstance.initialize();
  await msalInstance.handleRedirectPromise();
  const accounts = msalInstance.getAllAccounts();
  if (accounts.length > 0) {
    account = accounts[0];
    msalInstance.setActiveAccount(account);
    await onSignedIn();
  } else {
    showSignedOutState();
  }
}

async function login() {
  const btn = document.getElementById('signInBtn');
  try {
    btn.disabled = true;
    const result = await msalInstance.loginPopup({ scopes: SCOPES });
    account = result.account;
    msalInstance.setActiveAccount(account);
    await onSignedIn();
  } catch (e) {
    btn.disabled = false;
    console.error('サインイン失敗', e);
  }
}

async function getToken() {
  try {
    const r = await msalInstance.acquireTokenSilent({ scopes: SCOPES, account });
    return r.accessToken;
  } catch {
    const r = await msalInstance.acquireTokenPopup({ scopes: SCOPES });
    return r.accessToken;
  }
}

async function graphGet(path, extraHeaders) {
  const t = await getToken();
  const url = path.startsWith('http') ? path : ('https://graph.microsoft.com/v1.0' + path);
  const res = await fetch(url, { headers: Object.assign({ Authorization: 'Bearer ' + t }, extraHeaders || {}) });
  if (!res.ok) throw new Error(`Graph ${res.status}: ${await res.text()}`);
  return res.json();
}

function showSignedOutState() {
  document.getElementById('signInBtn').hidden = false;
  document.getElementById('avatar').hidden = true;
  const msg = '<div class="empty-state">サインインすると表示されます</div>';
  document.getElementById('scheduleList').innerHTML = msg;
  document.getElementById('taskList').innerHTML = msg;
  ['kpiSalesValue','kpiOrderValue','kpiAchieveValue'].forEach(id => document.getElementById(id).textContent = '–');
  ['kpiSalesDelta','kpiOrderDelta','kpiAchieveDelta'].forEach(id => {
    const el = document.getElementById(id);
    el.textContent = '';
    el.className = 'kpi-delta muted';
  });
}

async function onSignedIn() {
  document.getElementById('signInBtn').hidden = true;
  document.getElementById('avatar').hidden = false;
  // 各セクションは互いに独立して読み込む（1つ失敗しても他は表示される）
  loadProfile().catch(e => console.error('プロフィール取得失敗', e));
  loadTodaySchedule().catch(e => showSectionError('scheduleList', '予定を取得できませんでした'));
  loadTasks().catch(e => showSectionError('taskList', 'タスクを取得できませんでした'));
  loadKpis().catch(e => {
    console.error('KPI取得失敗', e);
    ['kpiSalesValue','kpiOrderValue','kpiAchieveValue'].forEach(id => document.getElementById(id).textContent = '取得失敗');
  });
}

function showSectionError(containerId, msg) {
  document.getElementById(containerId).innerHTML = `<div class="empty-state error">${escapeHtml(msg)}</div>`;
}

// ============================================================
// プロフィール（あいさつ・アバター）
// ============================================================
async function loadProfile() {
  const me = await graphGet('/me?$select=displayName,givenName');
  const name = me.givenName || me.displayName || '';
  document.getElementById('greetingText').textContent = name ? `おはようございます、${name}さん` : 'おはようございます';
  document.getElementById('avatarInitial').textContent = name ? name.charAt(0) : '';

  try {
    const t = await getToken();
    const res = await fetch('https://graph.microsoft.com/v1.0/me/photo/$value', { headers: { Authorization: 'Bearer ' + t } });
    if (res.ok) {
      const blob = await res.blob();
      const img = document.getElementById('avatarImg');
      img.src = URL.createObjectURL(blob);
      img.hidden = false;
    }
  } catch (e) {
    // 写真未設定などは無視（イニシャル表示のまま）
  }
}

// ============================================================
// 今日の予定 (Graph /me/calendarView)
// ============================================================
function pad2(n) { return String(n).padStart(2, '0'); }
function localDateTimeStr(d, h, m, s) {
  return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}T${pad2(h)}:${pad2(m)}:${pad2(s)}`;
}

async function loadTodaySchedule() {
  const now = new Date();
  const tomorrow = new Date(now.getFullYear(), now.getMonth(), now.getDate() + 1);
  const start = encodeURIComponent(localDateTimeStr(now, 0, 0, 0));
  const end = encodeURIComponent(localDateTimeStr(tomorrow, 0, 0, 0));
  const path = `/me/calendarView?startDateTime=${start}&endDateTime=${end}&$orderby=start/dateTime&$top=20&$select=subject,start,end,location,isAllDay`;
  const data = await graphGet(path, { Prefer: 'outlook.timezone="Tokyo Standard Time"' });
  renderSchedule(data.value || []);
}

function renderSchedule(events) {
  const el = document.getElementById('scheduleList');
  if (!events.length) {
    el.innerHTML = '<div class="empty-state">本日の予定はありません</div>';
    return;
  }
  el.innerHTML = events.map(ev => {
    const timeLabel = ev.isAllDay ? '終日' : `${(ev.start.dateTime||'').slice(11,16)} – ${(ev.end.dateTime||'').slice(11,16)}`;
    const loc = ev.location && ev.location.displayName ? ev.location.displayName : '';
    return `
      <div class="schedule-item">
        <div class="schedule-time">${escapeHtml(timeLabel)}</div>
        <div class="schedule-title">${escapeHtml(ev.subject || '(件名なし)')}</div>
        <div class="schedule-loc">${loc ? `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-6.2-7-11a7 7 0 0 1 14 0c0 4.8-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/></svg>${escapeHtml(loc)}` : ''}</div>
      </div>`;
  }).join('');
}

// ============================================================
// 自分のタスク (Graph /me/todo)
// ============================================================
const WEEKDAY_JA = ['日','月','火','水','木','金','土'];
function parseDueDate(dueDateTime) {
  if (!dueDateTime || !dueDateTime.dateTime) return null;
  const datePart = dueDateTime.dateTime.split('T')[0];
  const [y, m, d] = datePart.split('-').map(Number);
  if (!y || !m || !d) return null;
  return new Date(y, m - 1, d);
}
function formatDueDate(d) {
  return `${d.getMonth()+1}/${d.getDate()}（${WEEKDAY_JA[d.getDay()]}）まで`;
}

async function loadTasks() {
  const lists = await graphGet('/me/todo/lists');
  const all = lists.value || [];
  const defaultList = all.find(l => l.wellknownListName === 'defaultList') || all[0];
  if (!defaultList) { renderTasks([]); return; }
  // Microsoft To Do の $filter/$select は組み合わせによって400になることがあるため、
  // 素朴に全件取得して未完了のみをクライアント側で絞り込む
  const res = await graphGet(`/me/todo/lists/${defaultList.id}/tasks?$top=100`);
  const tasks = (res.value || [])
    .filter(t => t.status !== 'completed')
    .sort((a, b) => {
      const da = a.dueDateTime ? new Date(a.dueDateTime.dateTime) : new Date(8640000000000000);
      const db = b.dueDateTime ? new Date(b.dueDateTime.dateTime) : new Date(8640000000000000);
      return da - db;
    }).slice(0, 5);
  renderTasks(tasks);
}

function renderTasks(tasks) {
  const el = document.getElementById('taskList');
  if (!tasks.length) {
    el.innerHTML = '<div class="empty-state">未完了のタスクはありません</div>';
    return;
  }
  el.innerHTML = tasks.map(t => {
    const due = parseDueDate(t.dueDateTime);
    return `
      <div class="task-item">
        <div class="task-check"></div>
        <div class="task-label">${escapeHtml(t.title || '(無題)')}</div>
        ${due ? `<div class="task-due"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18"/></svg>${escapeHtml(formatDueDate(due))}</div>` : ''}
      </div>`;
  }).join('');
}

// ============================================================
// 会社の現在地 KPI（dashboard_facts.json + SalesTargets List）
// ============================================================
function isInternalTransfer(r) {
  const up = Number(r[IDX.unit_price]) || 0;
  const qp = Number(r[IDX.qty]) || 0;
  const item = String(r[IDX.item_nm] || '');
  if (item.indexOf('消費税') >= 0) return true;
  if (up === 0 && qp === 0) return true;
  return false;
}
function rowYm(r) {
  const v = r[IDX.ym];
  if (typeof v === 'number') return v;
  if (typeof v === 'string' && v.length >= 6) return parseInt(v.slice(0, 6), 10);
  return 0;
}
function monthTotal(rows, ym) {
  let total = 0;
  for (const r of rows) {
    if (rowYm(r) !== ym) continue;
    if (Number(r[IDX.kind]) === 2) continue; // 返品
    if (isInternalTransfer(r)) continue;
    total += Number(r[IDX.amount]) || 0;
  }
  return total;
}
function shiftYm(ym, delta) {
  let y = Math.floor(ym / 100), m = (ym % 100) + delta;
  while (m < 1) { m += 12; y -= 1; }
  while (m > 12) { m -= 12; y += 1; }
  return y * 100 + m;
}
function lastNMonths(n, curYm) {
  const out = [];
  let ym = curYm;
  for (let i = 0; i < n; i++) { out.unshift(ym); ym = shiftYm(ym, -1); }
  return out;
}
function formatOku(yen) {
  return (yen / 100000000).toFixed(2);
}

async function loadKpis() {
  const t = await getToken();
  const url = `https://graph.microsoft.com/v1.0/drives/${SP.mastersDriveId}/root:/dashboard_facts.json:/content`;
  const res = await fetch(url, { headers: { Authorization: 'Bearer ' + t } });
  if (!res.ok) throw new Error('dashboard_facts.json が取得できません');
  const facts = await res.json();
  const rows = facts.rows || [];
  const orderRows = facts.order_rows || [];

  const now = new Date();
  const curYm = now.getFullYear() * 100 + (now.getMonth() + 1);
  const prevYearYm = shiftYm(curYm, -12);
  const months6 = lastNMonths(6, curYm);

  const salesCur = monthTotal(rows, curYm);
  const salesPrev = monthTotal(rows, prevYearYm);
  const orderCur = monthTotal(orderRows, curYm);
  const orderPrev = monthTotal(orderRows, prevYearYm);

  // デバッグ用: 数値が想定と違う場合はまずここを確認 (DevTools コンソール)
  console.log('[KPI debug] curYm=', curYm, 'rows.length=', rows.length, 'order_rows.length=', orderRows.length);
  console.log('[KPI debug] rows matching curYm=', rows.filter(r => rowYm(r) === curYm).length,
              'order_rows matching curYm=', orderRows.filter(r => rowYm(r) === curYm).length);
  console.log('[KPI debug] sample rows ym values (first 5)=', rows.slice(0, 5).map(rowYm));
  console.log('[KPI debug] sample order_rows ym values (first 5)=', orderRows.slice(0, 5).map(rowYm));
  console.log('[KPI debug] salesCur=', salesCur, 'orderCur=', orderCur);

  renderKpiValue('kpiSalesValue', salesCur, '億円');
  renderKpiDelta('kpiSalesDelta', salesCur, salesPrev);
  renderKpiChart('kpiSalesChart', months6.map(ym => monthTotal(rows, ym)));

  renderKpiValue('kpiOrderValue', orderCur, '億円');
  renderKpiDelta('kpiOrderDelta', orderCur, orderPrev);
  renderKpiChart('kpiOrderChart', months6.map(ym => monthTotal(orderRows, ym)));

  // 計画達成率: SalesTargets List（部門累計月次 / scope=全社 / 当月）
  let planAmount = 0;
  try {
    let items = [];
    let listUrl = `/sites/${SP.siteId}/lists/${SP.targetsListId}/items?$expand=fields&$top=2000`;
    while (listUrl) {
      const r = await graphGet(listUrl);
      items = items.concat(r.value || []);
      listUrl = r['@odata.nextLink'] || null;
    }
    for (const item of items) {
      const f = item.fields || {};
      const type = String(f.TargetType || '').trim();
      const scope = String(f.ScopeKey || '').trim();
      const ym = parseInt(String(f.Year_x0020_Month || f.YearMonth || '').trim(), 10);
      const isLatest = (f.IsLatest === true || f.IsLatest === 'true');
      if (!isLatest || scope !== '全社') continue;
      if (!(type === '部門累計月次' || type === 'dept_monthly')) continue;
      if (ym !== curYm) continue;
      planAmount = Number(f.Amount) || 0;
    }
  } catch (e) {
    console.warn('目標値(SalesTargets)取得失敗', e);
  }

  const achieveEl = document.getElementById('kpiAchieveValue');
  const achieveDeltaEl = document.getElementById('kpiAchieveDelta');
  if (planAmount > 0) {
    const rate = (salesCur / planAmount) * 100;
    achieveEl.innerHTML = `${rate.toFixed(1)}<span>%</span>`;
    achieveDeltaEl.className = 'kpi-delta ' + (rate >= 100 ? '' : 'neg');
    achieveDeltaEl.textContent = `計画 ${formatOku(planAmount)}億円 / 実績 ${formatOku(salesCur)}億円`;
  } else {
    achieveEl.textContent = '–';
    achieveDeltaEl.className = 'kpi-delta muted';
    achieveDeltaEl.textContent = '今月の目標値が未設定です';
  }
}

function renderKpiValue(elId, yen, unit) {
  document.getElementById(elId).innerHTML = `${formatOku(yen)}<span>${escapeHtml(unit)}</span>`;
}

function renderKpiDelta(elId, cur, prev) {
  const el = document.getElementById(elId);
  if (!prev || prev <= 0) {
    el.className = 'kpi-delta muted';
    el.textContent = '前年データなし';
    return;
  }
  const rate = ((cur - prev) / prev) * 100;
  el.className = 'kpi-delta' + (rate < 0 ? ' neg' : '');
  el.textContent = `前年比 ${rate >= 0 ? '+' : ''}${rate.toFixed(1)}% ${rate >= 0 ? '↗' : '↘'}`;
}

function renderKpiChart(svgId, values) {
  const svg = document.getElementById(svgId);
  const max = Math.max(...values, 1);
  const xs = [2, 24, 46, 68, 90, 112].slice(0, values.length);
  const barWidth = values.length > 5 ? 12 : 14;
  svg.innerHTML = values.map((v, i) => {
    const h = 8 + (v / max) * 44;
    const y = 56 - h;
    const isLast = i === values.length - 1;
    return `<rect x="${xs[i]}" y="${y.toFixed(1)}" width="${barWidth}" height="${h.toFixed(1)}" rx="2" fill="${isLast ? '#1d4ed8' : '#e2e6ef'}"/>`;
  }).join('');
}

initAuth().catch(e => {

<style>
/* 見た目は 支払（決裁・出力）の画面にそろえる（色・フォントは ap_theme.css → hanaoka_theme.css で上書きされる） */
:root{--pri:#1a5fa8;--pri-l:#e3edf9;--bg:#f4f6f9;--card:#fff;--line:#dde2ec;--txt:#1e2533;--sub:#6b7a99;--up:#c0392b;--up-l:#fbe7e5;--down:#1e8449;--down-l:#e3f4e8;--warn:#a0520c;--warn-l:#fdf0e1;--flag:#7a3db8;--flag-l:#f1e8fb}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--txt);font:14px/1.5 "Yu Gothic UI","Meiryo",system-ui,sans-serif}
header{background:#fff;border-bottom:1px solid var(--line);padding:10px 20px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;position:sticky;top:0;z-index:5}
header h1{font-size:18px;margin:0 8px 0 0;color:var(--pri)}header .sp{flex:1}
select,input,button{font:inherit}select{border:1px solid var(--line);border-radius:6px;padding:5px 8px;background:#fff}
button,a.btn{border:1px solid var(--line);background:#fff;border-radius:6px;padding:5px 12px;cursor:pointer;color:inherit;text-decoration:none;display:inline-block;white-space:nowrap}
button.pri,a.btn.pri{background:var(--pri);border-color:var(--pri);color:#fff}
main{padding:16px 20px;display:grid;gap:14px;grid-template-columns:minmax(0,1fr);max-width:1280px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px;min-width:0}
.card h2{font-size:14px;margin:0 0 10px;color:var(--sub);font-weight:600;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.s{font-size:12px;color:var(--sub)}
/* 今やること */
.todo{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.todo li{display:flex;align-items:center;gap:12px;padding:9px 12px;border-radius:8px;border:1px solid var(--line);background:#fafbfd}
.todo li.ng{border-color:#f0c4bf;background:var(--up-l)}.todo li.warn{border-color:#f1d6b5;background:var(--warn-l)}
.todo .n{font-size:20px;font-weight:700;min-width:64px;text-align:right;font-variant-numeric:tabular-nums}.todo .n small{font-size:12px;font-weight:600;margin-left:2px}
.todo li.ng .n{color:var(--up)}.todo li.warn .n{color:var(--warn)}
.todo .t{flex:1;min-width:0}.todo .t b{display:block;font-size:14px}.todo .t span{font-size:12px;color:var(--sub)}
.todo .grp{font-size:11.5px;font-weight:700;color:var(--sub);letter-spacing:.05em;padding:6px 2px 0;border:0;background:none}
.none{padding:14px;text-align:center;color:var(--down);font-weight:600}
/* 支払回ごとの進み具合 */
.rounds{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.round{background:#fff;border:1px solid var(--line);border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.round h3{margin:0;font-size:16px;display:flex;align-items:center;gap:8px}
.round .amt{font-size:26px;font-weight:700;font-variant-numeric:tabular-nums}.round .amt small{font-size:12.5px;font-weight:500;color:var(--sub);margin-left:4px}
.steps{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.steps li{display:flex;gap:10px;align-items:flex-start}
.steps li>b{flex:none;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:12px;background:#eef0f4;color:#8a93a8}
.steps li.ok>b{background:var(--down);color:#fff}.steps li.cur>b{background:var(--pri);color:#fff}
.steps .t{font-weight:600;font-size:13.5px}.steps li:not(.ok):not(.cur) .t{color:var(--sub)}.steps .d{font-size:12px;color:var(--sub)}
.st{display:inline-block;font-size:11.5px;padding:1px 8px;border-radius:9px;font-weight:600;margin:1px 2px 1px 0}
.st-prep{background:#eef0f4;color:#666}.st-ready{background:var(--pri-l);color:var(--pri)}.st-wait{background:var(--warn-l);color:var(--warn)}.st-back{background:var(--up-l);color:var(--up)}.st-ok{background:var(--down-l);color:var(--down)}.st-out{background:#e8e3f6;color:var(--flag)}
/* 表 */
table{border-collapse:collapse;width:100%}th,td{padding:5px 8px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{font-size:12px;color:var(--sub);font-weight:600;background:#fafbfd}td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
.tbl{overflow-x:auto}
.tiles{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));margin-bottom:10px}
.tile{border:1px solid var(--line);border-radius:8px;padding:8px 12px}.tile .l{font-size:12px;color:var(--sub)}.tile .v{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums}
details>summary{cursor:pointer;color:var(--sub);font-size:13px;font-weight:600}
.chip{display:inline-block;background:#eef2f9;border:1px solid var(--line);border-radius:14px;padding:2px 10px;font-size:12px;margin:3px 4px 0 0}
#snackbar{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#323232;color:#fff;padding:10px 20px;border-radius:6px;font-size:13px;display:none;z-index:99;white-space:pre-wrap}
#login-view{display:none;padding:60px 16px;text-align:center}
@media (max-width:600px){main{padding:10px}.todo li{flex-wrap:wrap}.todo .n{min-width:0;text-align:left}}
</style>

<body>
<div id="login-view"><h2 style="color:#1a5fa8">支払管理</h2><p data-ha-login>花岡車輌株式会社の Microsoft アカウントでサインインしてください</p><button data-ha-login class="pri" onclick="signIn()">サインイン</button></div>

<script>
'use strict';
/* 支払管理のホーム：選んだ月（決済月）の支払が、どこまで進んだかと、今やることを出す。この画面からは何も書き換えない（見るだけ）
   ・今やること：先月から残っているもの／AI の読み取り／経費の確認・承認／仕入（SMILE）の確認OK／決裁・出力。押すとその画面へ
   ・支払回（10日・20日・月末）ごとの進み具合：① 確かめる → ② 支払指図 → ③ 決裁 → ④ 出力
     決め方は 支払（決裁・出力）の画面（ap_payment.html の pendingOf・stateOf）と同じ。部門は支払指図の「決裁の部門」
   ・源泉徴収（この月の支払で預かった税）、相殺の対象先（たたんでおく）
   読むリスト：AP_Invoice・AP_SmilePay・AP_SmileImport・AP_PaymentInstruction・AP_SettleBatch・AP_PaymentSlip・AP_OffsetVendor（すべて支払管理のサイト）
   決裁の状態（AP_SettleBatch）は、支払の画面を開いたときにワークフローから写される。ここではそれを読むだけ */
const MSAL_CONFIG = HanaokaAuth.msalConfig();
const SCOPES=['User.Read','Sites.ReadWrite.All'];
const GRAPH='https://graph.microsoft.com/v1.0';
const AP_SITE='hanaokacorp.sharepoint.com,d80378dd-76a4-43f0-b939-1af66345d19d,8eaeb70b-2495-4029-affb-eabe80e021bb';
const ROUNDS=['10日','20日','月末'];
const EX_DONE=['確定済（ロック）','先行支払済','支払済'];   // 経費の画面と同じ（確定したもの）
const OPEN_BATCH=['申請前','決裁中','差し戻し','決裁済み'];   // 出力まで済んでいない決裁
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const yen=n=>Math.round(+n||0).toLocaleString('ja-JP');
const ymLabel=v=>String(v||'').replace('/','年').replace(/^(\d{4})年0?(\d+)$/,'$1年$2月');
function prevYm(v,n=1){const [y,m]=v.split('/').map(Number);const d=new Date(y,m-1-n,1);return d.getFullYear()+'/'+String(d.getMonth()+1).padStart(2,'0');}
function snack(m,e){const el=$('snackbar');el.textContent=m;el.style.background=e?'#c0392b':'#323232';el.style.display='block';clearTimeout(snack.t);snack.t=setTimeout(()=>el.style.display='none',e?8000:4000);}
function msg(t){$('status').textContent=t||'';}

// ---------- 認証・Graph ----------
let msalApp=null,acct=null;
async function boot(){msalApp=new msal.PublicClientApplication(MSAL_CONFIG);await msalApp.initialize();await msalApp.handleRedirectPromise();
  acct=await HanaokaAuth.restore(msalApp,SCOPES);if(acct)await showApp();else $('login-view').style.display='block';}
async function signIn(){try{acct=await HanaokaAuth.login(msalApp,SCOPES);await showApp();}catch(e){if(e.errorCode!=='user_cancelled')snack('サインインエラー: '+e.message,true);}}
async function token(){try{return (await msalApp.acquireTokenSilent({scopes:SCOPES,account:acct})).accessToken;}catch{const r=await msalApp.acquireTokenPopup({scopes:SCOPES});acct=r.account;return r.accessToken;}}
async function gget(p){const r=await fetch(p.startsWith('http')?p:GRAPH+p,{headers:{Authorization:'Bearer '+await token()}});if(!r.ok)throw new Error('['+r.status+'] '+(await r.text()).slice(0,200));return r.json();}
async function fetchAll(listId,filter){let all=[],n=`/sites/${AP_SITE}/lists/${listId}/items?$expand=fields&$top=500`+(filter?'&$filter='+encodeURIComponent(filter):'');
  while(n){const d=await gget(n);all=all.concat(d.value||[]);n=d['@odata.nextLink']?d['@odata.nextLink'].replace(GRAPH,''):null;}return all.map(it=>({id:it.id,f:it.fields}));}

// ---------- リスト（表示名 → 内部名） ----------
const L={inv:{name:'AP_Invoice'},sp:{name:'AP_SmilePay'},imp:{name:'AP_SmileImport'},pi:{name:'AP_PaymentInstruction'},sb:{name:'AP_SettleBatch'},sl:{name:'AP_PaymentSlip'},ov:{name:'AP_OffsetVendor'}};
let listsReady=null;
function resolveLists(){return listsReady=listsReady||(async()=>{
  const ls=await gget(`/sites/${AP_SITE}/lists?$select=id,displayName`);
  await Promise.all(Object.values(L).map(async o=>{const l=ls.value.find(x=>x.displayName===o.name);if(!l)return;o.id=l.id;o.fmap={};
    const c=await gget(`/sites/${AP_SITE}/lists/${l.id}/columns?$select=name,displayName`);c.value.forEach(x=>{o.fmap[x.displayName]=x.name;});}));
  if(!L.inv.id)throw new Error('AP_Invoice が見つかりません');})();}
const v=(o,x,d)=>x.f[(o.fmap||{})[d]||d];   // 列の値（表示名で）

// ---------- 画面 ----------
async function showApp(){
  $('login-view').style.display='none';$('app-view').style.display='block';$('who').textContent=acct.name||acct.username;
  initMonth();if(window.APMonth)APMonth.arrows('month');
  await reload();}
function initMonth(){const s=$('month'),n=new Date();
  for(let i=-1;i<6;i++){const d=new Date(n.getFullYear(),n.getMonth()-i,1),val=d.getFullYear()+'/'+String(d.getMonth()+1).padStart(2,'0');
    const o=document.createElement('option');o.value=val;o.textContent=ymLabel(val)+'払い';if(i===0)o.selected=true;s.appendChild(o);}
  const qm=new URLSearchParams(location.search).get('month');
  if(qm&&/^\d{4}\/\d{2}$/.test(qm)){if(![...s.options].some(o=>o.value===qm)){const o=document.createElement('option');o.value=qm;o.textContent=ymLabel(qm)+'払い';s.insertBefore(o,s.firstChild);}s.value=qm;}
  s.onchange=()=>reload();}
const month=()=>$('month').value;

let D=null;   // 読んだもの
async function reload(){
  const ym=month(),pm=prevYm(ym);msg('読み込み中...');
  try{
    await resolveLists();
    const q=(o,f)=>o.id?fetchAll(o.id,f):Promise.resolve([]);
    const ymF=(o,c)=>`fields/${o.fmap[c]||c} eq '${ym}'`;
    const [inv,sp,spPrev,imp,pi,sb]=await Promise.all([q(L.inv),q(L.sp,L.sp.id&&ymF(L.sp,'決済月')),q(L.sp,L.sp.id&&`fields/${L.sp.fmap['決済月']||'決済月'} eq '${pm}'`),
      q(L.imp),q(L.pi),q(L.sb)]);
    D={ym,pm,inv,sp,spPrev,imp,pi,sb};
    render();msg('');
    loadWithholding(ym);loadOffset();
  }catch(e){msg('');$('main').innerHTML=`<div class="card" style="color:var(--up)">読み込めませんでした：${esc(e.message)}</div>`;}}

/* ---- 数える ---- */
const iv=(x,d)=>v(L.inv,x,d);
const isEx=x=>['本社経費','工場経費'].includes(iv(x,'支払区分'));
const isShi=x=>['本社仕入','工場仕入'].includes(iv(x,'支払区分'));
const live=x=>iv(x,'アーカイブフラグ')!==true;
const exDone=x=>EX_DONE.includes(iv(x,'支払ステータス')||'確認待');
const exStep=x=>+x.f.ExpenseStep||0;   // 経費の段（0＝確認、1以上＝承認）
const aiState=x=>x.f.AIStatus||'';        // 受付＝AI 読み取り中、読取失敗＝読み取り失敗
// 仕入（SMILE）の行：支払回・払う額があるか・確認OK か（支払の画面の pendingOf と同じ決め方）
const spv=(x,d)=>v(L.sp,x,d);
const spRound=x=>spv(x,'支払日区分')||'月末';
function spHasPay(x){if(spv(x,'取り込みの状態')==='なくなった')return false;
  let ls=[];try{ls=JSON.parse(spv(x,'分け方の上書き')||spv(x,'分け方（計算）')||'[]')||[];}catch{}
  return ls.some(l=>+l.amount)||+spv(x,'支払額')>0;}
const spOk=x=>spv(x,'確認済み')===true;
// この月の仕入を「締め後」まで取り込んだか（AP_SmileImport の 状態＝取り込み済）。締め前は払う額がまだ無いので、取り込んだ仕入先をすべて数える
const impOf=ym=>D.imp.filter(x=>v(L.imp,x,'決済月')===ym&&v(L.imp,x,'状態')!=='取り消し');
const lastImp=ym=>impOf(ym).sort((a,b)=>String(v(L.imp,b,'取り込み日時')||'').localeCompare(String(v(L.imp,a,'取り込み日時')||'')))[0]||null;   // いちばん新しい取り込み（仕入の画面と同じ）
const closed=ym=>{const i=lastImp(ym);return !!i&&v(L.imp,i,'状態')==='取り込み済';};
const spCount=(x,ym)=>closed(ym)?spHasPay(x):spv(x,'取り込みの状態')!=='なくなった';
const piv=(x,d)=>v(L.pi,x,d);
const piDept=x=>piv(x,'決裁の部門')||(piv(x,'拠点')==='工場'?'工場':'総務');
const sbv=(x,d)=>v(L.sb,x,d);
// 部門の最新の決裁（取り下げは除く）
function batchOf(list,ym,round,dept){return list.filter(b=>sbv(b,'決済月')===ym&&sbv(b,'支払日区分')===round&&sbv(b,'部門')===dept&&sbv(b,'状態')!=='取り下げ')
  .sort((a,b)=>String(sbv(b,'回した日時')||'').localeCompare(String(sbv(a,'回した日時')||'')))[0]||null;}
const ST_CLS={'決裁済み':'st-ok','出力済み':'st-out','差し戻し':'st-back','申請前':'st-wait','決裁中':'st-wait','決裁に回していない':'st-ready'};

function roundInfo(r){
  const {ym}=D;
  const ex=D.inv.filter(x=>live(x)&&isEx(x)&&iv(x,'対象年月')===ym&&iv(x,'支払日区分')===r);
  const exLeft=ex.filter(x=>!exDone(x));
  const cl=closed(ym),sp=D.sp.filter(x=>spRound(x)===r&&spCount(x,ym)),spLeft=sp.filter(x=>!spOk(x)),spOpen=sp.length&&!cl;   // spOpen：締め前（まだ払う額が決まらない）
  const pi=D.pi.filter(x=>piv(x,'決済月')===ym&&piv(x,'支払日区分')===r);
  const piAmt=pi.reduce((s,x)=>s+(+piv(x,'支払額')||0),0);
  const depts=[...new Set(pi.map(piDept))].map(d=>{const b=batchOf(D.sb,ym,r,d);return {d,s:b?sbv(b,'状態')||'申請前':'決裁に回していない',b};});
  const est=ex.reduce((s,x)=>s+(+iv(x,'金額_税込')||0),0)+sp.reduce((s,x)=>s+(+spv(x,'支払額')||0),0);
  const left=exLeft.length+spLeft.length+(spOpen?1:0),any=ex.length+sp.length+pi.length;
  const nOk=depts.filter(x=>x.s==='決裁済み'||x.s==='出力済み').length,nOut=depts.filter(x=>x.s==='出力済み').length;
  const steps=[
    {t:'確かめる',ok:any&&!left,d:[ex.length?`経費 確定 ${ex.length-exLeft.length}／${ex.length}件`:'',sp.length?`仕入 確認OK ${sp.length-spLeft.length}／${sp.length}社${spOpen?'（締め前）':''}`:''].filter(Boolean).join('・')||'まだ請求書がありません'},
    {t:'支払指図を作る',ok:pi.length&&!left,d:pi.length?`${pi.length}件 ${yen(piAmt)}円`+(left?'（確かめた後に作り直す）':''):'まだ'},
    {t:'部門ごとに決裁',ok:depts.length&&nOk===depts.length,d:depts.length?depts.map(x=>`<span class="st ${ST_CLS[x.s]||'st-prep'}">${esc(x.d)} ${esc(x.s)}</span>`).join(''):'—',html:true},
    {t:'照合して出力',ok:depts.length&&nOut===depts.length,d:depts.length&&nOut===depts.length?'出力済み':depts.length&&nOk===depts.length?'出力できます':'決裁の後'}];
  const cur=any?steps.findIndex(x=>!x.ok):-1;
  return {r,ex,exLeft,sp,spLeft,pi,piAmt,depts,est,left,any,steps,cur,nOk,nOut};}

/* ---- 今やること ---- */
function todos(R){
  const {ym,pm}=D,out=[],exUrl=m=>`ap_expense.html?month=${encodeURIComponent(m)}`,spUrl=m=>`ap_smile_import.html?month=${encodeURIComponent(m)}`,
    payUrl=(m,r)=>`ap_payment.html?month=${encodeURIComponent(m)}`+(r?`&round=${encodeURIComponent(r)}`:'');
  const add=(grp,lv,n,unit,t,sub,href,btn)=>out.push({grp,lv,n,unit,t,sub,href,btn});
  // 先月より前から残っているもの
  const oldEx={};D.inv.filter(x=>live(x)&&isEx(x)&&!exDone(x)&&aiState(x)!=='受付'&&iv(x,'対象年月')&&iv(x,'対象年月')<ym).forEach(x=>{const m=iv(x,'対象年月');oldEx[m]=(oldEx[m]||0)+1;});
  Object.keys(oldEx).sort().forEach(m=>add('先月から残っているもの','ng',oldEx[m],'件',`${ymLabel(m)}払いの経費が、まだ確定していません`,'払う月を過ぎています。確定するか、来月に回すかを決めてください',exUrl(m),'経費を開く'));
  const spOld=D.spPrev.filter(x=>spHasPay(x)&&!spOk(x)).length;
  if(spOld)add('先月から残っているもの','ng',spOld,'社',`${ymLabel(pm)}払いの仕入で、確認OK になっていない仕入先があります`,'',spUrl(pm),'仕入を開く');
  const oldSb={};D.sb.filter(b=>sbv(b,'決済月')&&sbv(b,'決済月')<ym&&OPEN_BATCH.includes(sbv(b,'状態'))).forEach(b=>{const k=sbv(b,'決済月')+'|'+sbv(b,'支払日区分');(oldSb[k]=oldSb[k]||[]).push(sbv(b,'部門')+' '+sbv(b,'状態'));});
  Object.keys(oldSb).sort().forEach(k=>{const [m,r]=k.split('|');add('先月から残っているもの','warn',oldSb[k].length,'部門',`${ymLabel(m)} ${r}払いが「出力済み」になっていません`,oldSb[k].join('、'),payUrl(m,r),'支払を開く');});
  // 請求書の受け付け（月をまたいで）
  const reading=D.inv.filter(x=>live(x)&&isEx(x)&&!exDone(x)&&aiState(x)==='受付').length,failed=D.inv.filter(x=>live(x)&&isEx(x)&&!exDone(x)&&aiState(x)==='読取失敗').length;
  if(failed)add('請求書の受け付け','warn',failed,'件','AI が読み取れなかった請求書があります','支払先・金額・仕訳を入れてください（経費の受信トレイ）',exUrl(ym),'経費を開く');
  if(reading)add('請求書の受け付け','',reading,'件','AI が読み取っています','しばらくすると「確認待ち」に移ります',exUrl(ym),'経費を開く');
  // 今月の経費
  const exM=D.inv.filter(x=>live(x)&&isEx(x)&&iv(x,'対象年月')===ym&&!exDone(x)&&!['受付','読取失敗'].includes(aiState(x)));
  const exChk=exM.filter(x=>exStep(x)===0).length,exApp=exM.filter(x=>exStep(x)>0).length,exNoRound=exM.filter(x=>!ROUNDS.includes(iv(x,'支払日区分'))).length;
  if(exChk)add('今月の支払','warn',exChk,'件','経費の確認（1段目）が残っています','確認の担当（本社・工場）',exUrl(ym),'経費を開く');
  if(exApp)add('今月の支払','warn',exApp,'件','経費の承認（2段目）が残っています','総務',exUrl(ym),'経費を開く');
  if(exNoRound)add('今月の支払','warn',exNoRound,'件','支払回（10日・20日・月末）が決まっていない経費があります','このままだと支払指図に入りません',exUrl(ym),'経費を開く');
  // 今月の仕入（SMILE）
  const imp=impOf(ym),cl=closed(ym);
  const spAll=D.sp.filter(x=>spCount(x,ym)),spLeft=spAll.filter(x=>!spOk(x)).length;
  if(!imp.length&&!spAll.length)add('今月の支払','',null,'','仕入（SMILE）の取り込みがまだです','月初（SMILE を締める前）に「締め前：受入を取り込む」',spUrl(ym),'仕入を開く');
  else if(!cl)add('今月の支払','',null,'','仕入は締め前です（払う額はまだ決まりません）','SMILE を締めた後に「締め後：4点を取り込む」',spUrl(ym),'仕入を開く');
  if(spLeft)add('今月の支払','warn',spLeft,'社','仕入で、確認OK になっていない仕入先があります',`確認OK ${spAll.length-spLeft}／${spAll.length}社`,spUrl(ym),'仕入を開く');
  const noVendor=D.inv.filter(x=>live(x)&&isShi(x)&&iv(x,'対象年月')===ym&&!String(iv(x,'支払先コード')||'').trim()).length;
  if(noVendor)add('今月の支払','warn',noVendor,'件','仕入先が決まっていない仕入の請求書があります','仕入（SMILE）の「仕入先が決まらない」で、仕入先を選んでください',spUrl(ym),'仕入を開く');
  // 決裁・出力
  R.forEach(x=>{
    const by=s=>x.depts.filter(d=>d.s===s).map(d=>d.d);
    if(by('差し戻し').length)add('決裁・出力','ng',by('差し戻し').length,'部門',`${x.r}払いの決裁が差し戻されています`,by('差し戻し').join('、')+'：直して、もう一度「決裁に回す」',payUrl(ym,x.r),'支払を開く');
    if(by('申請前').length)add('決裁・出力','warn',by('申請前').length,'部門',`${x.r}払い：ワークフローで「申請」が押されていません`,by('申請前').join('、'),payUrl(ym,x.r),'支払を開く');
    if(!x.left&&by('決裁に回していない').length)add('決裁・出力','warn',by('決裁に回していない').length,'部門',`${x.r}払いを決裁に回せます`,by('決裁に回していない').join('、'),payUrl(ym,x.r),'支払を開く');
    if(!x.left&&!x.pi.length&&x.any)add('決裁・出力','warn',null,'',`${x.r}払いの支払指図を作れます`,'確かめる作業が済みました',payUrl(ym,x.r),'支払を開く');
    if(x.depts.length&&x.nOk===x.depts.length&&x.nOut<x.depts.length)add('決裁・出力','warn',null,'',`${x.r}払いを出力できます`,'すべての部門が決裁済みです。照合して、全銀・でんさいなどを出力',payUrl(ym,x.r),'支払を開く');});
  return out;}

function render(){
  const {ym}=D,R=ROUNDS.map(roundInfo),T=todos(R);
  const grps=[...new Set(T.map(t=>t.grp))];
  let h=`<div class="card"><h2>今やること<span class="s" style="font-weight:400">（${esc(ymLabel(ym))}払い）</span></h2>`+
    (T.length?`<ul class="todo">${grps.map(g=>`<li class="grp">${esc(g)}</li>`+T.filter(t=>t.grp===g).map(t=>`<li class="${t.lv}">
      <div class="n">${t.n==null?'':`${t.n}<small>${esc(t.unit)}</small>`}</div>
      <div class="t"><b>${esc(t.t)}</b>${t.sub?`<span>${esc(t.sub)}</span>`:''}</div>
      <a class="btn${t.lv?' pri':''}" href="${esc(t.href)}">${esc(t.btn)} ›</a></li>`).join('')).join('')}</ul>`
     :`<div class="none">✔ 今やることはありません</div>`)+`</div>`;
  h+=`<div class="rounds">${R.map(x=>`<div class="round">
      <h3>${esc(x.r)}払い ${!x.any?'<span class="st st-prep">支払なし</span>':x.cur<0?'<span class="st st-out">済み</span>':''}</h3>
      <div class="amt">${x.pi.length?yen(x.piAmt):x.any?yen(x.est):'—'}<small>${x.pi.length?`円・支払指図 ${x.pi.length}件`:x.any?'円（見込み：経費＋仕入）':''}</small></div>
      <ol class="steps">${x.steps.map((s,i)=>`<li class="${s.ok?'ok':i===x.cur?'cur':''}"><b>${s.ok?'✔':i+1}</b><div><div class="t">${s.t}</div><div class="d">${s.html?s.d:esc(s.d)}</div></div></li>`).join('')}</ol>
      <div><a class="btn" href="ap_payment.html?month=${encodeURIComponent(ym)}&round=${encodeURIComponent(x.r)}">支払の画面で見る ›</a></div></div>`).join('')}</div>`;
  h+=`<div class="card"><h2>🧾 源泉徴収<span class="s" style="font-weight:400">（この月の支払で預かった税・翌月10日に納める）</span></h2><div id="wh">読み込み中...</div></div>
    <details class="card" id="ovBox"><summary>🔁 相殺の対象先（売掛と相殺してから払う仕入先）<span id="ovN"></span></summary><div id="ov" style="margin-top:8px" class="s">読み込み中...</div></details>
    <div class="s">決裁の状態は、支払（決裁・出力）の画面を開いたときにワークフローから最新になります。そのほかの画面：<a href="ap_purchase_match.html">仕入突合</a></div>`;
  $('main').innerHTML=h;}

/* ---- 源泉徴収：この月の請求書で、仕訳に 預り金（000317）のマイナスの行があるもの ----
   報酬（税理士・弁護士・司法書士など）と 非居住者（海外送金）に分け、拠点（本社・工場）ごとに。支給額は差し引く前の税抜 */
let SL_CACHE=null;
async function loadWithholding(ym){
  const el=()=>$('wh');
  try{
    if(!L.sl.id){el().textContent='仕訳（AP_PaymentSlip）を読めませんでした';return;}
    const ids=new Set(D.inv.filter(x=>live(x)&&iv(x,'対象年月')===ym).map(x=>String(x.id)));
    if(!SL_CACHE)SL_CACHE=await fetchAll(L.sl.id);
    if(D.ym!==ym||!el())return;
    const s=(x,d)=>v(L.sl,x,d),byInv={};SL_CACHE.forEach(x=>{const k=String(s(x,'請求書ID')||'');if(ids.has(k))(byInv[k]=byInv[k]||[]).push(x);});
    const c6=x=>String(x||'').trim().padStart(6,'0'),rows=[];
    D.inv.filter(x=>ids.has(String(x.id))).forEach(x=>{const ls=byInv[String(x.id)]||[],wh=ls.filter(l=>c6(s(l,'勘定科目コード'))==='000317'&&(+s(l,'金額_税込')||0)<0);if(!wh.length)return;
      const cat=iv(x,'支払区分')||'';rows.push({kind:iv(x,'支払手段')==='海外送金'?'非居住者':'報酬',loc:cat.startsWith('工場')?'工場':'本社',round:iv(x,'支払日区分')||'',payee:iv(x,'支払先名')||'',
        base:ls.filter(l=>(+s(l,'金額_税込')||0)>0).reduce((t,l)=>t+(+s(l,'金額_税抜')||0),0),tax:-wh.reduce((t,l)=>t+(+s(l,'金額_税込')||0),0),pay:+iv(x,'金額_税込')||0,src:cat.endsWith('仕入')?'仕入':'経費'});});
    if(!rows.length){el().innerHTML='<span class="s">この月の支払で源泉徴収したものはありません</span>';return;}
    const ORD={'10日':1,'20日':2,'月末':3},kinds=['報酬','非居住者'],locs=['本社','工場'];
    rows.sort((a,b)=>kinds.indexOf(a.kind)-kinds.indexOf(b.kind)||locs.indexOf(a.loc)-locs.indexOf(b.loc)||(ORD[a.round]||9)-(ORD[b.round]||9)||a.payee.localeCompare(b.payee,'ja'));
    const sum=(a,k)=>a.reduce((t,r)=>t+r[k],0),ppl=a=>new Set(a.map(r=>r.payee)).size;
    const tiles=[['源泉税の合計',sum(rows,'tax'),`${rows.length}件・${ppl(rows)}人`]].concat(kinds.filter(k=>rows.some(r=>r.kind===k)).map(k=>{const a=rows.filter(r=>r.kind===k);return [k==='報酬'?'報酬（税理士など）':'非居住者（海外送金）',sum(a,'tax'),`${a.length}件`];}))
      .concat(locs.filter(l=>rows.some(r=>r.loc===l)).map(l=>{const a=rows.filter(r=>r.loc===l);return ['うち '+l,sum(a,'tax'),`${a.length}件`];}));
    el().innerHTML=`<div class="tiles">${tiles.map(t=>`<div class="tile"><div class="l">${esc(t[0])}</div><div class="v">${yen(t[1])}<span class="s"> 円</span></div><div class="s">${esc(t[2])}</div></div>`).join('')}</div>
      <div class="tbl"><table><tr><th>区分</th><th>拠点</th><th>支払回</th><th>支払先</th><th class="n">支給額（税抜）</th><th class="n">源泉税</th><th class="n">支払額</th><th>元</th></tr>
      ${rows.map(r=>`<tr><td>${r.kind}</td><td>${r.loc}</td><td>${esc(r.round)}</td><td>${esc(r.payee)}</td><td class="n">${yen(r.base)}</td><td class="n"><b>${yen(r.tax)}</b></td><td class="n">${yen(r.pay)}</td><td>${r.src}</td></tr>`).join('')}
      <tr style="font-weight:700;background:#f4f6fa"><td colspan="4">合計（${ppl(rows)}人）</td><td class="n">${yen(sum(rows,'base'))}</td><td class="n">${yen(sum(rows,'tax'))}</td><td class="n">${yen(sum(rows,'pay'))}</td><td></td></tr></table></div>
      <div style="margin-top:8px"><button type="button" id="whCopy">📋 表をコピー（Excel に貼れます）</button></div>`;
    const tsv=[['区分','拠点','支払回','支払先','支給額（税抜）','源泉税','支払額','元'].join('\t')].concat(rows.map(r=>[r.kind,r.loc,r.round,r.payee,Math.round(r.base),Math.round(r.tax),Math.round(r.pay),r.src].join('\t')))
      .concat([['合計（'+ppl(rows)+'人）','','','',Math.round(sum(rows,'base')),Math.round(sum(rows,'tax')),Math.round(sum(rows,'pay')),''].join('\t')]).join('\r\n');
    $('whCopy').onclick=()=>copyText(tsv,`源泉徴収の表（${rows.length}件）をコピーしました。Excel に貼り付けてください`);
  }catch(e){if(el())el().textContent='源泉徴収を読めませんでした：'+e.message;}}
function copyText(t,ok){const fb=()=>{const a=document.createElement('textarea');a.value=t;a.style.cssText='position:fixed;left:-9999px';document.body.appendChild(a);a.select();
    try{document.execCommand('copy');snack(ok);}catch(e){snack('コピーできませんでした',true);}a.remove();};
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t).then(()=>snack(ok),fb);else fb();}

/* ---- 相殺の対象先（マスタ。月に関係しない） ---- */
let OV_CACHE=null;
async function loadOffset(){
  try{
    if(!L.ov.id){$('ov').textContent='AP_OffsetVendor が見つかりません';return;}
    if(!OV_CACHE)OV_CACHE=(await fetchAll(L.ov.id)).filter(x=>v(L.ov,x,'相殺フラグ'));
    if(!$('ov'))return;
    if(!OV_CACHE.length){$('ov').textContent='相殺の対象先はありません';return;}
    $('ovN').textContent=`：${OV_CACHE.length}社`;
    $('ov').innerHTML=`買掛をそのまま払わず、売掛と相殺した残りを払います（相殺する額は 仕入（SMILE）の確認の画面で決めます）。<div>${OV_CACHE.map(x=>`<span class="chip">${esc(v(L.ov,x,'仕入先名')||v(L.ov,x,'仕入先コード')||'(名称なし)')}</span>`).join('')}</div>`;
  }catch(e){if($('ov'))$('ov').textContent='相殺の対象先を読めませんでした：'+e.message;}}

boot().catch(e=>snack('認証エラー: '+e.message,true));
</script>

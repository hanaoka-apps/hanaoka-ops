<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>全社スケジュール</title>
<script src="https://cdn.jsdelivr.net/npm/@azure/msal-browser@3.10.0/lib/msal-browser.min.js" crossorigin="anonymous"></script>
<link rel="icon" type="image/png" href="favicon_hub.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+JP:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  /* デザインは hanaoka_hub.html と共通(白いサイドバー、ネイビーの現在地ピル、影だけのカード) */
  :root {
    --bg: #f4f6fb;
    --card-bg: #ffffff;
    --border: #edf0f6;
    --border-strong: #dfe4ef;
    --text-main: #161a3d;
    --text-sub: #8a90a8;
    --text-mute: #b3b8cb;
    --navy: #23268f;
    --navy-deep: #161a5c;
    --cyan: #1fa2e6;
    --indigo-soft: #eef0ff;
    --cyan-soft: #e3f3fc;
    --accent-red: #e0475b;
    --weekend-bg: #fafbfe;
    --radius: 12px;
    --shadow: 0 1px 2px rgba(22, 26, 92, 0.04), 0 6px 20px rgba(22, 26, 92, 0.05);
    --sidebar-w: 232px;
    --font: "Inter", "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Yu Gothic", "Segoe UI", sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: var(--font);
    background: var(--bg);
    color: var(--text-main);
    font-size: 14px;
    -webkit-font-smoothing: antialiased;
  }
  a { text-decoration: none; color: inherit; }
  button { font-family: inherit; }

  /* ---------- Sidebar ---------- */
  .sidebar {
    position: fixed; inset: 0 auto 0 0; width: var(--sidebar-w);
    background: #fff; border-right: 1px solid var(--border);
    display: flex; flex-direction: column; gap: 2px;
    padding: 22px 16px 18px; z-index: 20;
  }
  .brand { display: flex; align-items: center; gap: 10px; padding: 0 8px 22px; }
  .brand-mark {
    width: 34px; height: 34px; border-radius: 9px; flex-shrink: 0;
    background: linear-gradient(135deg, var(--navy) 0%, #3b3fd0 100%);
    display: grid; place-items: center; color: #fff;
    box-shadow: 0 4px 12px rgba(35, 38, 143, 0.3);
  }
  .brand-mark svg { width: 18px; height: 18px; }
  .brand-name { white-space: nowrap; font-weight: 800; font-size: 15px; letter-spacing: 0.01em; line-height: 1.2; }
  .brand-name small { display: block; font-size: 10.5px; font-weight: 600; color: var(--text-sub); letter-spacing: 0.08em; }
  .nav-label { font-size: 10.5px; font-weight: 700; color: var(--text-mute); letter-spacing: 0.1em; padding: 4px 12px 6px; }
  .nav-item {
    display: flex; align-items: center; gap: 11px;
    padding: 9px 12px; border-radius: 8px;
    font-size: 13px; font-weight: 600; color: #5a6080;
    transition: background .15s, color .15s;
  }
  .nav-item svg { flex-shrink: 0; width: 17px; height: 17px; opacity: 0.8; }
  .nav-item:hover { background: var(--bg); color: var(--text-main); }
  .nav-item.active { background: var(--navy); color: #fff; box-shadow: 0 4px 12px rgba(35, 38, 143, 0.25); }
  .nav-item.active svg { opacity: 1; }

  /* ---------- Main ---------- */
  .main { margin-left: var(--sidebar-w); min-height: 100vh; min-width: 0; }
  .topbar {
    position: sticky; top: 0; z-index: 10;
    display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap;
    padding: 14px 32px;
    background: rgba(255, 255, 255, 0.86);
    backdrop-filter: saturate(160%) blur(10px);
    -webkit-backdrop-filter: saturate(160%) blur(10px);
    border-bottom: 1px solid var(--border);
  }
  h1 { font-size: 17px; margin: 0; font-weight: 800; }
  .page-sub { font-size: 12.5px; color: var(--text-sub); font-weight: 500; margin-top: 2px; }
  .top-actions { display: flex; align-items: center; gap: 10px; }
  .back-link { display: none; font-size: 12.5px; font-weight: 700; color: var(--navy); white-space: nowrap; }
  .signin-btn {
    background: var(--navy); color: #fff; border: none; border-radius: 8px;
    padding: 9px 16px; font-size: 13px; font-weight: 700; cursor: pointer;
    box-shadow: 0 4px 12px rgba(35, 38, 143, 0.25);
  }
  .signin-btn:hover { background: var(--navy-deep); }
  .signin-btn:disabled { opacity: 0.6; cursor: default; }
  .signin-btn[hidden] { display: none; }

  .content { padding: 26px 32px 64px; max-width: 1560px; }

  .month-nav { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; }
  .month-nav .month-label { font-size: 17px; font-weight: 800; min-width: 130px; text-align: center; font-feature-settings: "tnum"; }
  .nav-btn {
    width: 32px; height: 32px; border-radius: 50%; border: none;
    background: var(--card-bg); color: var(--text-main); cursor: pointer; box-shadow: var(--shadow);
    display: flex; align-items: center; justify-content: center;
  }
  .nav-btn:hover { background: var(--indigo-soft); color: var(--navy); }
  .today-btn {
    border: none; background: var(--card-bg); color: var(--navy); box-shadow: var(--shadow);
    border-radius: 8px; padding: 7px 14px; font-size: 12.5px; font-weight: 700; cursor: pointer;
  }
  .today-btn:hover { background: var(--indigo-soft); }

  .view-toggle { display: inline-flex; gap: 2px; margin-left: auto; background: #fff; box-shadow: var(--shadow); border-radius: 9px; padding: 3px; }
  .view-toggle-btn {
    border: none; background: none; color: var(--text-sub); cursor: pointer;
    font-size: 12.5px; font-weight: 700; padding: 6px 16px; border-radius: 7px;
  }
  .view-toggle-btn.is-active { background: var(--navy); color: #fff; }
  .view-toggle-btn:not(.is-active):hover { color: var(--text-main); }

  .cal-grid, .list-view { background: var(--card-bg); border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden; }
  .cal-grid[hidden], .list-view[hidden] { display: none; }
  .cal-weekdays, .cal-rows { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); }
  .cal-weekdays div {
    padding: 10px 8px; font-size: 11.5px; font-weight: 700; color: var(--text-sub);
    text-align: center; background: #f8f9fc;
  }
  .cal-weekdays div:first-child { color: var(--accent-red); }
  .cal-weekdays div:last-child { color: var(--navy); }

  .cal-cell {
    min-height: 108px;
    border-right: 1px solid var(--border); border-bottom: 1px solid var(--border);
    padding: 6px 6px 8px; display: flex; flex-direction: column; gap: 4px; min-width: 0;
  }
  .cal-cell:nth-child(7n) { border-right: none; }
  .cal-cell.pad { background: #fbfbfd; }
  .cal-cell.weekend { background: var(--weekend-bg); }
  .day-num {
    font-size: 12.5px; font-weight: 700; color: var(--text-main);
    width: 22px; height: 22px; display: flex; align-items: center; justify-content: center; border-radius: 50%;
    font-feature-settings: "tnum";
  }
  .cal-cell.pad .day-num { color: var(--text-mute); }
  .cal-cell.today .day-num { background: var(--navy); color: #fff; }
  .day-events { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
  .day-event {
    font-size: 11.5px; line-height: 1.4; font-weight: 600;
    background: var(--indigo-soft); color: var(--navy);
    border-radius: 5px; padding: 2px 6px; white-space: normal; word-break: break-word;
  }
  .day-event.sub { background: var(--cyan-soft); color: #0f7fb8; }
  .day-event.irregular { background: #f0f1f6; color: #5a6080; }
  .day-event.holiday { background: #fdecee; color: var(--accent-red); }

  .list-view { overflow-x: auto; }
  .list-table { min-width: 760px; }
  .list-header-row, .list-row { display: grid; grid-template-columns: 88px repeat(3, 1fr); }
  .list-header-row { position: sticky; top: 0; background: #f8f9fc; }
  .list-header-row > div { padding: 10px 12px; font-size: 11.5px; font-weight: 700; color: var(--text-sub); }
  .list-row { border-bottom: 1px solid var(--border); }
  .list-row:last-child { border-bottom: none; }
  .list-row.weekend { background: var(--weekend-bg); }
  .list-row.today { background: var(--indigo-soft); }
  .list-date { padding: 9px 12px; font-size: 13px; font-weight: 700; color: var(--text-main); font-feature-settings: "tnum"; }
  .list-row.sun .list-date, .list-row.sun .list-dow { color: var(--accent-red); }
  .list-row.sat .list-date, .list-row.sat .list-dow { color: var(--navy); }
  .list-dow { font-weight: 500; color: var(--text-sub); margin-left: 2px; }
  .list-col { padding: 9px 12px; display: flex; flex-direction: column; gap: 5px; min-width: 0; border-left: 1px solid var(--border); }
  .list-event {
    font-size: 13px; line-height: 1.5; font-weight: 600;
    color: var(--navy); background: var(--indigo-soft);
    border-radius: 6px; padding: 3px 10px; width: fit-content; max-width: 100%; word-break: break-word;
  }
  .list-col.irregular .list-event { color: #5a6080; background: #f0f1f6; }
  .list-col.sub .list-event { color: #0f7fb8; background: var(--cyan-soft); }
  .list-event.holiday { background: #fdecee; color: var(--accent-red); }

  .empty-state { padding: 60px 0; text-align: center; color: var(--text-sub); font-size: 13px; }
  .cal-rows .empty-state { grid-column: 1 / -1; }

  @media (max-width: 820px) {
    .sidebar { display: none; }
    .main { margin-left: 0; }
    .topbar { position: static; padding: 14px 20px; }
    .content { padding: 20px 16px 48px; }
    .back-link { display: inline-block; }
    .cal-cell { min-height: 84px; padding: 4px 4px 6px; }
    .day-event { font-size: 10.5px; padding: 1px 4px; }
    .month-nav .month-label { min-width: 100px; font-size: 16px; }
    .view-toggle { margin-left: 0; order: 1; flex-basis: 100%; justify-content: center; }
  }
</style>
</head>
<body>
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-mark">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10v9a1 1 0 0 0 1 1h11a1 1 0 0 0 1-1v-9"/></svg>
      </div>
      <div class="brand-name">HANAOKA HUB<small>HANAOKA CORP.</small></div>
    </div>
    <div class="nav-label">MENU</div>
    <a class="nav-item" href="hanaoka_hub.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10v9a1 1 0 0 0 1 1h11a1 1 0 0 0 1-1v-9"/></svg>
      ホーム
    </a>
    <a class="nav-item active" href="company_schedule.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>
      お知らせ
    </a>
    <a class="nav-item" href="hanaoka_hub.html#sec-status">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="M7 15l4-5 3 3 5-7"/></svg>
      会社の状況
    </a>
    <a class="nav-item" href="hanaoka_hub.html#workApps">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
      アプリ一覧
    </a>
  </aside>

  <main class="main">
    <header class="topbar">
      <div>
        <h1>全社スケジュール</h1>
        <div class="page-sub">会社共通予定表（HUBのお知らせ欄と同じカレンダー）を月単位で表示</div>
      </div>
      <div class="top-actions">
        <a class="back-link" href="hanaoka_hub.html">← HUBへ戻る</a>
        <button id="signInBtn" class="signin-btn" hidden>Microsoftでサインイン</button>
      </div>
    </header>

    <div class="content">
      <div class="month-nav">
        <button type="button" class="nav-btn" id="prevBtn" title="前の月" aria-label="前の月">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg>
        </button>
        <div class="month-label" id="monthLabel">–</div>
        <button type="button" class="nav-btn" id="nextBtn" title="次の月" aria-label="次の月">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
        </button>
        <button type="button" class="today-btn" id="todayBtn">今月</button>
        <div class="view-toggle" id="viewToggle">
          <button type="button" class="view-toggle-btn" data-view="calendar">カレンダー</button>
          <button type="button" class="view-toggle-btn is-active" data-view="list">一覧</button>
        </div>
      </div>

      <div class="cal-grid" id="calGrid" hidden>
        <div class="cal-weekdays">
          <div>日</div><div>月</div><div>火</div><div>水</div><div>木</div><div>金</div><div>土</div>
        </div>
        <div class="cal-rows" id="calRows">
          <div class="empty-state" style="grid-column: 1 / -1;">サインインすると表示されます</div>
        </div>
      </div>

      <div class="list-view" id="listView">
        <div class="list-table">
          <div class="list-header-row">
            <div>日付</div><div>イレギュラースケジュール</div><div>総務スケジュール</div><div>総務スケジュール補足</div>
          </div>
          <div id="listRows">
            <div class="empty-state">サインインすると表示されます</div>
          </div>
        </div>
      </div>
    </div>
  </main>

<script>
const MSAL_CONFIG = {
  auth: {
    clientId:    'd338d61b-01dc-4c7c-ac6b-aecf7f30d716',
    authority:   'https://login.microsoftonline.com/3933e8a0-c945-4e97-ae67-c82131087cad',
    redirectUri: new URL('auth.html', window.location.href).href,
  },
  cache: { cacheLocation: 'localStorage' }, // HUBなど他のアプリと同じ保存先にして、サインイン状態を共有する
};
const SCOPES = ['User.Read', 'Calendars.Read', 'Calendars.Read.Shared'];
const COMPANY_CALENDAR_MAIL = 'company-calendar@hanaoka-corp.co.jp';

// scripts/register_payment_schedule.py が付けるOutlookカテゴリと合わせる。
// どちらのカテゴリも付いていない予定(担当者が手入力した入社案内や
// ReHANAOKA展のような単発行事)は「イレギュラースケジュール」として扱う。
const CATEGORY_MAIN = '総務スケジュール';
const CATEGORY_SUB = '総務スケジュール補足';

let msalInstance = null;
let account = null;
let viewYear, viewMonth; // viewMonth: 0-11
let viewMode = 'list'; // 'calendar' | 'list'(既定は縦型の一覧)
let currentByDate = null; // 直近取得分。ビュー切替時に再取得しないためのキャッシュ

function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

async function initAuth() {
  const now = new Date();
  viewYear = now.getFullYear();
  viewMonth = now.getMonth();

  document.getElementById('signInBtn').onclick = login;
  document.getElementById('prevBtn').onclick = () => changeMonth(-1);
  document.getElementById('nextBtn').onclick = () => changeMonth(1);
  document.getElementById('todayBtn').onclick = () => {
    const n = new Date();
    viewYear = n.getFullYear(); viewMonth = n.getMonth();
    renderCalendar();
  };
  document.getElementById('viewToggle').addEventListener('click', e => {
    const btn = e.target.closest('.view-toggle-btn');
    if (!btn || btn.classList.contains('is-active')) return;
    viewMode = btn.dataset.view;
    document.querySelectorAll('.view-toggle-btn').forEach(b => b.classList.toggle('is-active', b === btn));
    document.getElementById('calGrid').hidden = viewMode !== 'calendar';
    document.getElementById('listView').hidden = viewMode !== 'list';
    if (currentByDate) renderCurrentView();
  });

  msalInstance = new msal.PublicClientApplication(MSAL_CONFIG);
  await msalInstance.initialize();
  await msalInstance.handleRedirectPromise();
  const accounts = msalInstance.getAllAccounts();
  if (accounts.length > 0) {
    account = accounts[0];
    msalInstance.setActiveAccount(account);
    try {
      // キャッシュされたセッションが有効か先に確認する。ページ読み込み時の
      // 自動呼び出しからポップアップへフォールバックすると、ユーザー操作を
      // 伴わないためブラウザに必ずブロックされる。
      await msalInstance.acquireTokenSilent({ scopes: SCOPES, account });
      onSignedIn();
    } catch (e) {
      console.warn('セッションが切れているため再サインインが必要です', e);
      showSignedOutState();
    }
  } else {
    showSignedOutState();
  }
}

function showSignedOutState() {
  document.getElementById('signInBtn').hidden = false;
  document.getElementById('calRows').innerHTML =
    '<div class="empty-state" style="grid-column: 1 / -1;">サインインすると表示されます</div>';
  document.getElementById('listRows').innerHTML =
    '<div class="empty-state">サインインすると表示されます</div>';
  document.getElementById('monthLabel').textContent =
    `${viewYear}年${viewMonth + 1}月`;
}

function onSignedIn() {
  document.getElementById('signInBtn').hidden = true;
  renderCalendar();
}

// SafariはMSALのポップアップと相性が悪いため、iOS/Safariはリダイレクト方式(HUBと同じ)
function shouldUseRedirectFlow() {
  const ua = navigator.userAgent;
  const isIOS = /iPad|iPhone|iPod/.test(ua);
  const isSafari = /^((?!chrome|android|crios|fxios).)*safari/i.test(ua);
  return isIOS || isSafari;
}

async function login() {
  const btn = document.getElementById('signInBtn');
  try {
    btn.disabled = true;
    if (shouldUseRedirectFlow()) {
      await msalInstance.loginRedirect({
        scopes: SCOPES,
        redirectUri: window.location.origin + window.location.pathname,
      });
      return;
    }
    const result = await msalInstance.loginPopup({ scopes: SCOPES });
    account = result.account;
    msalInstance.setActiveAccount(account);
    onSignedIn();
  } catch (e) {
    console.error('サインイン失敗', e);
  } finally {
    btn.disabled = false;
  }
}

async function getToken() {
  const r = await msalInstance.acquireTokenSilent({ scopes: SCOPES, account });
  return r.accessToken;
}

async function graphGet(path) {
  const t = await getToken();
  const res = await fetch('https://graph.microsoft.com/v1.0' + path, {
    headers: { Authorization: 'Bearer ' + t, Prefer: 'outlook.timezone="Tokyo Standard Time"' },
  });
  if (!res.ok) throw new Error(`Graph ${res.status}: ${await res.text()}`);
  return res.json();
}

function pad2(n) { return String(n).padStart(2, '0'); }
function ymd(d) { return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`; }

function changeMonth(delta) {
  viewMonth += delta;
  if (viewMonth < 0) { viewMonth = 11; viewYear--; }
  if (viewMonth > 11) { viewMonth = 0; viewYear++; }
  renderCalendar();
}

async function loadMonthEvents(year, month) {
  // グリッドは前後月の余白セルも含むので、表示範囲全体をまとめて取得する
  const gridStart = gridStartDate(year, month);
  const gridEnd = new Date(gridStart);
  gridEnd.setDate(gridEnd.getDate() + 42); // 6週間分
  const start = encodeURIComponent(`${ymd(gridStart)}T00:00:00`);
  const end = encodeURIComponent(`${ymd(gridEnd)}T00:00:00`);
  const path = `/users/${encodeURIComponent(COMPANY_CALENDAR_MAIL)}/calendarView`
    + `?startDateTime=${start}&endDateTime=${end}&$orderby=start/dateTime&$top=100`
    + `&$select=subject,start,end,isAllDay,isCancelled,categories`;
  const data = await graphGet(path);
  return (data.value || []).filter(ev => !ev.isCancelled);
}

function gridStartDate(year, month) {
  const first = new Date(year, month, 1);
  const start = new Date(first);
  start.setDate(start.getDate() - first.getDay()); // その週の日曜まで戻る
  return start;
}

async function renderCalendar() {
  document.getElementById('monthLabel').textContent = `${viewYear}年${viewMonth + 1}月`;
  const loadingHtml = '<div class="empty-state">読み込み中…</div>';
  document.getElementById('calRows').innerHTML = loadingHtml;
  document.getElementById('listRows').innerHTML = loadingHtml;

  let events;
  try {
    events = await loadMonthEvents(viewYear, viewMonth);
  } catch (e) {
    console.error('スケジュール取得失敗', e);
    const failedHtml = '<div class="empty-state">取得できませんでした</div>';
    document.getElementById('calRows').innerHTML = failedHtml;
    document.getElementById('listRows').innerHTML = failedHtml;
    return;
  }

  // 日付(YYYY-MM-DD)ごとにイベントをまとめる。終日予定はstart日付のみ対応
  // (会社共通予定表は基本1日単位の終日予定のため、複数日にまたがる予定は
  // 簡略化して開始日のセルにのみ表示する)。件名だけでなくカテゴリも
  // 保持しておき、一覧ビューで列を分けるのに使う。
  const byDate = {};
  for (const ev of events) {
    const d = (ev.start.dateTime || '').slice(0, 10);
    if (!d) continue;
    (byDate[d] = byDate[d] || []).push({ subject: ev.subject || '(無題)', categories: ev.categories || [] });
  }
  currentByDate = byDate;
  renderCurrentView();
}

function renderCurrentView() {
  if (viewMode === 'list') renderListView(currentByDate);
  else renderGridView(currentByDate);
}

function renderGridView(byDate) {
  const todayStr = ymd(new Date());
  const gridStart = gridStartDate(viewYear, viewMonth);
  const cells = [];
  for (let i = 0; i < 42; i++) {
    const d = new Date(gridStart);
    d.setDate(d.getDate() + i);
    const inMonth = d.getMonth() === viewMonth;
    const dow = d.getDay();
    const dStr = ymd(d);
    const isToday = dStr === todayStr;
    const dayEvents = byDate[dStr] || [];
    const classes = ['cal-cell'];
    if (!inMonth) classes.push('pad');
    if (dow === 0 || dow === 6) classes.push('weekend');
    if (isToday) classes.push('today');
    const eventsHtml = dayEvents.map(ev => {
      const isHoliday = /休日|祝/.test(ev.subject);
      const kind = categorize(ev);
      const cls = isHoliday ? ' holiday' : (kind === 'main' ? '' : ' ' + kind);
      return `<div class="day-event${cls}">${escapeHtml(ev.subject)}</div>`;
    }).join('');
    cells.push(`
      <div class="${classes.join(' ')}">
        <div class="day-num">${d.getDate()}</div>
        <div class="day-events">${eventsHtml}</div>
      </div>`);
    // 6週目が完全に翌月だけなら省略して表示を詰める
    if (i === 34 && cells.length % 7 === 0) {
      const next7InMonth = Array.from({length: 7}, (_, j) => {
        const nd = new Date(gridStart); nd.setDate(nd.getDate() + 35 + j);
        return nd.getMonth() === viewMonth;
      }).some(Boolean);
      if (!next7InMonth) break;
    }
  }
  document.getElementById('calRows').innerHTML = cells.join('');
}

// 縦型の一覧表示。予定の有無に関わらず、その月の全日を並べる
// (総務が配布しているPDFの日付一覧と同じ見せ方)。件名だけでなく、
// Outlookのカテゴリを見て3列(イレギュラー/総務/総務補足)に振り分ける。
const WEEKDAY_JA = ['日','月','火','水','木','金','土'];

function categorize(ev) {
  if (ev.categories.includes(CATEGORY_MAIN)) return 'main';
  if (ev.categories.includes(CATEGORY_SUB)) return 'sub';
  return 'irregular'; // カテゴリなし = 担当者が手入力した単発行事など
}

function renderEventChips(evs) {
  return evs.map(ev => {
    const isHoliday = /休日|祝/.test(ev.subject);
    return `<div class="list-event${isHoliday ? ' holiday' : ''}">${escapeHtml(ev.subject)}</div>`;
  }).join('');
}

function renderListView(byDate) {
  const todayStr = ymd(new Date());
  const daysInMonth = new Date(viewYear, viewMonth + 1, 0).getDate();
  const rows = [];
  for (let day = 1; day <= daysInMonth; day++) {
    const d = new Date(viewYear, viewMonth, day);
    const dow = d.getDay();
    const dStr = ymd(d);
    const dayEvents = byDate[dStr] || [];
    const byCol = { irregular: [], main: [], sub: [] };
    for (const ev of dayEvents) byCol[categorize(ev)].push(ev);

    const classes = ['list-row'];
    if (dow === 0) classes.push('sun'); else if (dow === 6) classes.push('sat');
    if (dow === 0 || dow === 6) classes.push('weekend');
    if (dStr === todayStr) classes.push('today');

    rows.push(`
      <div class="${classes.join(' ')}">
        <div class="list-date">${viewMonth + 1}/${day}<span class="list-dow">(${WEEKDAY_JA[dow]})</span></div>
        <div class="list-col irregular">${renderEventChips(byCol.irregular)}</div>
        <div class="list-col soumu">${renderEventChips(byCol.main)}</div>
        <div class="list-col sub">${renderEventChips(byCol.sub)}</div>
      </div>`);
  }
  document.getElementById('listRows').innerHTML = rows.join('');
}

initAuth().catch(e => {
  console.error('初期化失敗', e);
  showSignedOutState();
});
</script>

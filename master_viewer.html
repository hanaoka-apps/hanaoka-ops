<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>マスタビューワー — 花岡車輌</title>
<link rel="icon" type="image/svg+xml" href="favicon_master.svg"><!-- 表＋虫眼鏡（マスタを見る・探す） -->
<script src="https://cdn.jsdelivr.net/npm/@azure/msal-browser@3.10.0/lib/msal-browser.min.js" crossorigin="anonymous"></script>
<script src="hanaoka_auth.js"></script>
<link rel="stylesheet" href="hanaoka_theme.css?v=20261004"><!-- 色・フォントは共通ファイル -->
<style>
  /* 色・角丸・影・フォントは hanaoka_theme.css（全アプリ共通）のトークンだけを使う。
     ここに色の値は書かない（下の :root は、テーマにある紺マークの終点と、文字用の濃い色の派生だけ）。 */
  :root{
    --navy-hi:#3b3fd0;                                         /* 紺マークのグラデーション終点（テーマの .hx-mark と同じ） */
    --glow:0 4px 12px rgba(35,38,143,.25);                     /* 選択中の影（テーマの .hx-item.active と同じ） */
    --green-ink:color-mix(in srgb,var(--green) 70%,black);     /* 薄い背景の上に載せる濃い文字色 */
    --red-ink:color-mix(in srgb,var(--red) 75%,black);
    --cyan-ink:color-mix(in srgb,var(--cyan) 65%,black);
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;font-family:var(--font);background:var(--bg);color:var(--txt);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}

  /* ---- ログイン画面 ---- */
  #loginScreen{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:100}
  .login-card{background:var(--surface);border-radius:16px;padding:40px 44px;width:380px;max-width:90vw;box-shadow:var(--shadow);text-align:center}
  .login-card .logo{width:54px;height:54px;border-radius:12px;margin:0 auto 16px;color:#fff;
    background:linear-gradient(135deg,var(--navy),var(--navy-hi));box-shadow:var(--glow);display:flex;align-items:center;justify-content:center}
  .login-card .logo svg{width:28px;height:28px}
  .login-card h1{font-size:19px;margin:0 0 4px;color:var(--navy);font-weight:800}
  .login-card p{color:var(--sub);font-size:13px;margin:0 0 24px}
  .login-card button{width:100%;padding:12px;border:none;border-radius:10px;cursor:pointer;background:var(--navy);color:#fff;font-size:15px;font-weight:700;font-family:inherit}
  .login-card button:hover{background:var(--navy-deep)}
  #loginError{display:none;margin-top:16px;color:var(--red-ink);font-size:13px;background:var(--red-soft);border-radius:8px;padding:10px}
  .login-foot{margin-top:20px;font-size:11px;color:var(--sub);line-height:1.6}

  /* ---- アプリ本体 ---- */
  #app{display:none;flex-direction:column;height:100vh}
  header{background:var(--surface);border-bottom:1px solid var(--line);padding:0 16px;height:52px;display:flex;align-items:center;gap:14px;flex-shrink:0}
  header h1{font-size:15px;margin:0;font-weight:800;letter-spacing:.01em;white-space:nowrap;display:flex;align-items:center;gap:9px}
  header h1 .dot{width:26px;height:26px;border-radius:7px;color:#fff;display:inline-flex;align-items:center;justify-content:center;
    background:linear-gradient(135deg,var(--navy),var(--navy-hi));box-shadow:0 3px 8px rgba(35,38,143,.25)}
  header h1 .dot svg{width:15px;height:15px}
  /* HUBへ戻る（ほかのアプリと同じ。HUBからは同じタブで開く） */
  .hub-home{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border:1px solid var(--line-strong);border-radius:7px;background:var(--surface);color:var(--navy);font-size:12px;font-weight:700;text-decoration:none;white-space:nowrap;flex-shrink:0}
  .hub-home:hover{background:var(--navy-soft)}
  .hub-home svg{width:15px;height:15px}
  .tabs{display:flex;gap:6px;flex-wrap:wrap}
  .tab{border:1px solid var(--line-strong);background:var(--surface);border-radius:999px;padding:5px 18px;cursor:pointer;font-size:13px;font-weight:600;color:var(--sub);white-space:nowrap;transition:background .15s,color .15s}
  .tab:not(.active):hover{background:var(--bg);color:var(--txt)}
  .tab.active{background:var(--navy);color:#fff;border-color:var(--navy);font-weight:700;box-shadow:var(--glow)}
  .grow{flex:1}
  .userchip{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--sub)}
  .avatar{width:26px;height:26px;border-radius:50%;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px}
  .btn{border:1px solid var(--line-strong);background:var(--surface);border-radius:8px;padding:5px 11px;cursor:pointer;font-size:12px;font-weight:600;color:var(--txt);font-family:inherit}
  .btn:hover{background:var(--bg)}

  #statusBar{padding:6px 16px;font-size:12px;background:var(--surface);color:var(--sub);border-bottom:1px solid var(--line);flex-shrink:0;display:flex;align-items:center;gap:8px}
  #statusBar.loading{background:var(--amber-soft);color:var(--amber)}
  #statusBar.success{background:var(--green-soft);color:var(--green-ink)}
  #statusBar.error{background:var(--red-soft);color:var(--red-ink)}
  .spin{width:12px;height:12px;border:2px solid currentColor;border-top-color:transparent;border-radius:50%;animation:sp .7s linear infinite;display:inline-block}
  @keyframes sp{to{transform:rotate(360deg)}}

  main{display:flex;flex:1;overflow:hidden}

  /* ---- 左：検索一覧 ---- */
  .list-pane{width:380px;min-width:280px;max-width:50%;border-right:1px solid var(--line);display:flex;flex-direction:column;background:var(--surface)}
  .searchbar{padding:12px 12px 8px;display:flex;gap:8px;align-items:center}
  .searchbar input{flex:1;border:1px solid var(--line-strong);border-radius:10px;padding:9px 12px;font-size:14px;outline:none;font-family:inherit;color:var(--txt);background:var(--surface)}
  .searchbar input:focus,.rawtools input[type=search]:focus,.filters select:focus{border-color:var(--navy);box-shadow:0 0 0 3px var(--navy-soft)}
  .filters{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:2px 12px 10px}
  .filters label{font-size:11px;font-weight:600;color:var(--sub);display:flex;flex-direction:column;gap:3px;min-width:0}
  .filters select{border:1px solid var(--line-strong);border-radius:8px;padding:6px;font-size:12.5px;background:var(--surface);color:var(--txt);font-family:inherit;min-width:0;width:100%;outline:none}
  .listmeta{padding:7px 14px;font-size:12px;color:var(--sub);border-bottom:1px solid var(--line);border-top:1px solid var(--line);background:var(--bg)}
  .list{flex:1;overflow-y:auto}
  .row{padding:10px 14px;border-bottom:1px solid var(--line);cursor:pointer;display:flex;gap:8px;align-items:center}
  .row:hover{background:var(--bg)}
  .row.sel{background:var(--navy-soft);box-shadow:inset 3px 0 0 var(--navy)}
  .row .rmain{flex:1;min-width:0}
  .row .code{font-family:"Consolas",monospace;color:var(--navy);font-weight:700;font-size:12px}
  .row .name{font-weight:700;margin:1px 0}
  .row .sub{font-size:12px;color:var(--sub);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .ptag{flex-shrink:0;font-size:11.5px;font-weight:700;padding:2px 10px;border-radius:999px;background:var(--bg);border:1px solid var(--line-strong);color:var(--sub);white-space:nowrap}
  .ptag.bill{background:var(--surface);border-color:var(--navy);color:var(--navy)}
  .ptag.mail{background:var(--navy-soft);border-color:var(--navy-soft);color:var(--navy)}
  .ptag.tov{background:var(--cyan-soft);border-color:var(--cyan-soft);color:var(--cyan-ink)}
  .ptag.warn{background:var(--amber-soft);border-color:var(--amber-soft);color:var(--amber)}

  /* ---- 右：詳細 ---- */
  .detail-pane{flex:1;overflow-y:auto;background:var(--bg)}
  .detail-head{background:var(--surface);border-bottom:1px solid var(--line);padding:18px 24px 0}
  .dtop{display:flex;gap:24px;align-items:flex-start;flex-wrap:wrap}
  .dleft{flex:1;min-width:300px}
  .detail-head .dcode{font-family:"Consolas",monospace;color:var(--navy);font-weight:700;font-size:13px}
  .detail-head .dname{font-size:24px;font-weight:800;letter-spacing:-.01em;margin:2px 0 8px;line-height:1.3}
  .contact{display:flex;flex-direction:column;gap:3px;font-size:14px}
  .contact .cl{display:flex;gap:8px;align-items:baseline}
  .contact .ci{color:var(--sub);font-size:12px;width:3.6em;flex-shrink:0;white-space:nowrap}
  .dright{flex:1;min-width:300px;display:flex;flex-direction:column;gap:8px;align-items:stretch}
  .srcline{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:11.5px;color:var(--sub)}
  .chip{display:inline-block;background:var(--bg);border:1px solid var(--line-strong);border-radius:6px;padding:2px 10px;font-size:11.5px;font-weight:600;color:var(--txt)}
  .meta{display:grid;grid-template-columns:auto 1fr auto 1fr;gap:6px 14px;border:1px solid var(--line);border-radius:10px;background:var(--bg);padding:10px 14px;font-size:13px}
  .meta .mk{color:var(--sub);font-size:12px}
  .meta .mv{font-weight:700;word-break:break-all}
  .dtabs{display:flex;align-items:flex-end;gap:6px;margin-top:16px}
  .dtab{border:1px solid var(--line-strong);border-bottom:none;background:var(--surface);border-radius:8px 8px 0 0;padding:8px 26px;font-size:13px;font-weight:600;cursor:pointer;color:var(--sub);font-family:inherit}
  .dtab:not(.active):hover{background:var(--bg);color:var(--txt)}
  .dtab.active{background:var(--navy);color:#fff;border-color:var(--navy);font-weight:700}
  .dtabs .grow{flex:1}
  .dtabs .btn{margin-bottom:6px}
  .rawtools{display:flex;gap:12px;align-items:center;padding:12px 24px 0;flex-wrap:wrap}
  .rawtools input[type=search]{border:1px solid var(--line-strong);border-radius:8px;padding:6px 10px;font-size:13px;width:220px;outline:none;font-family:inherit;background:var(--surface);color:var(--txt)}
  .toggle{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--sub);cursor:pointer;user-select:none}
  .detail-body{padding:16px 24px 32px}

  /* 概要：カード（上のバーの色で種類を見分ける。請求＝見出しバーと同じ紺→水色、残高＝注意の橙、インボイス＝緑） */
  .cards{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr) minmax(0,1fr);gap:14px;margin-bottom:14px}
  .cards.two{grid-template-columns:minmax(0,1.35fr) minmax(0,1fr)}
  .ocard{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px 10px;box-shadow:var(--shadow);overflow:hidden}
  .ocard::before{content:"";position:absolute;inset:0 0 auto 0;height:3px;background:var(--navy)}
  .ocard.bill::before{background:linear-gradient(90deg,var(--navy),var(--cyan))}
  .ocard.trade::before{background:var(--navy)}
  .ocard.bal::before{background:var(--orange)}
  .ocard.inv::before{background:var(--green)}
  .ohead{display:flex;align-items:center;gap:8px;margin-bottom:6px;flex-wrap:wrap}
  .ohead .ot{font-size:15px;font-weight:800}
  .ohead .grow{flex:1}
  .srcchip{font-size:11px;font-weight:600;color:var(--sub);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:1px 8px;white-space:nowrap}
  .kv{display:flex;gap:10px;padding:6px 0;border-bottom:1px dashed var(--line-strong);align-items:baseline}
  .kv:last-child{border-bottom:none}
  .kv .k{color:var(--sub);width:6.5em;flex-shrink:0;font-size:12.5px}
  .kv .v{font-weight:700;word-break:break-word;flex:1;cursor:default;font-variant-numeric:tabular-nums}
  .kv .v.big{font-size:15px}
  .kv.empty .v{color:var(--mute);font-weight:400}
  .kv .wrn{color:var(--amber);cursor:help;margin-left:6px;font-weight:700}
  .kv .unk{font-size:10.5px;font-weight:700;color:var(--amber);background:var(--amber-soft);border-radius:4px;padding:0 6px;margin-left:8px;cursor:help;white-space:nowrap}
  .twocol{display:grid;grid-template-columns:1fr 1fr;gap:0 40px}
  .twocol .kv .k{width:8em}

  /* 折りたたみ */
  details.fold{background:var(--surface);border:1px solid var(--line);border-radius:10px;margin-bottom:8px}
  details.fold>summary{list-style:none;cursor:pointer;padding:11px 16px;font-weight:700;font-size:14px;display:flex;align-items:center;gap:10px;user-select:none;border-radius:10px}
  details.fold>summary::-webkit-details-marker{display:none}
  details.fold>summary::after{content:"▾";margin-left:auto;color:var(--sub);transition:transform .15s}
  details.fold[open]>summary::after{transform:rotate(180deg)}
  details.fold>summary:hover{background:var(--bg)}
  details.fold .fbody{padding:2px 16px 12px}
  .fcount{font-weight:500;font-size:12px;color:var(--sub)}

  /* 元データ */
  .section{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:6px 16px 14px;margin-bottom:14px}
  .section-title{font-size:12px;font-weight:800;color:var(--navy);letter-spacing:.04em;margin:10px 0 8px;border-bottom:2px solid var(--navy-soft);padding-bottom:5px}
  .section.tv{background:var(--amber-soft);border-color:color-mix(in srgb,var(--orange) 30%,var(--surface))}
  .section.tv .section-title{color:var(--amber);border-color:color-mix(in srgb,var(--orange) 30%,var(--surface))}
  .fields{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:2px 24px}
  .field{display:flex;gap:10px;padding:5px 0;border-bottom:1px dashed var(--line);align-items:baseline}
  .field .k{color:var(--sub);min-width:148px;flex-shrink:0;font-size:12.5px}
  .field .v{font-weight:600;word-break:break-word;flex:1}
  .field .v .cd,.kv .cd{font-family:"Consolas",monospace;color:var(--mute);font-weight:500;font-size:11px;margin-left:6px}
  .field.empty .v{color:var(--mute);font-weight:400}
  .placeholder{color:var(--sub);text-align:center;margin-top:80px;font-size:14px}
  .dropzone{margin:14px 20px;border:2px dashed var(--line-strong);border-radius:var(--radius);padding:24px;text-align:center;color:var(--sub);background:var(--surface)}
  .dropzone.drag{border-color:var(--navy);background:var(--navy-soft)}
  mark{background:var(--amber-soft);color:inherit;border-radius:2px;padding:0 1px;box-shadow:0 0 0 1px color-mix(in srgb,var(--orange) 35%,transparent)}
  a.maillink{color:var(--navy);text-decoration:none}
  a.maillink:hover{text-decoration:underline}
  button.reveal{border:1px solid var(--line-strong);background:var(--surface);border-radius:6px;font-size:11px;padding:0 8px;margin-left:8px;cursor:pointer;color:var(--sub);font-family:inherit}
  @media (max-width:1180px){
    .cards,.cards.two{grid-template-columns:1fr}
    .twocol{grid-template-columns:1fr}
  }
  /* PC では、スマホ用の部品（メニューボタン・絞り込みボタン・戻るバー）は出さない */
  .hdr-actions{display:contents}
  .menu-btn,.filter-btn,.mbar{display:none}
  .fbadge{background:var(--navy);color:#fff;border-radius:999px;font-size:11px;min-width:18px;height:18px;line-height:18px;text-align:center;padding:0 5px}
  .fbadge[hidden]{display:none}

  /* ---- スマホ：一覧 → 詳細 の2画面方式 ----
     最初は一覧だけを全画面で出し、行をタップすると詳細が全画面で開く（#app[data-view]）。
     「← 一覧」か端末の戻る操作で一覧に戻る。 */
  @media (max-width:760px){
    #app{height:100vh;height:100dvh}
    /* ヘッダー：1段目＝HUB・タイトル・「⋯」、2段目＝得意先／仕入先の切り替え（全幅） */
    header{height:auto;flex-wrap:wrap;gap:8px 10px;padding:8px 12px;position:relative}
    .hub-home{order:1;min-height:36px}
    header h1{order:2;font-size:14px}
    .grow{order:3}
    .menu-btn{display:inline-flex;order:4;align-items:center;justify-content:center;width:40px;min-height:36px;padding:0;font-size:18px;line-height:1}
    .tabs{order:5;width:100%;flex-wrap:nowrap;gap:0;background:var(--bg);border:1px solid var(--line-strong);border-radius:999px;padding:3px}
    .tab{flex:1;text-align:center;border:none;background:transparent;padding:7px 0;min-height:36px;font-size:14px}
    .tab.active{background:var(--navy)}
    .hdr-actions{display:none;position:absolute;right:12px;top:48px;z-index:30;flex-direction:column;align-items:stretch;gap:6px;min-width:200px;
      background:var(--surface);border:1px solid var(--line-strong);border-radius:var(--radius);box-shadow:var(--shadow);padding:10px}
    header.menu-open .hdr-actions{display:flex}
    .hdr-actions .btn{min-height:42px;text-align:left;font-size:14px}
    .hdr-actions .userchip{padding:2px 4px 8px;border-bottom:1px solid var(--line);font-size:13px}
    /* 状態バーは1行。読み込み完了は数秒で消える（JS が .faded を付ける） */
    #statusBar{padding:4px 12px}
    #statusText{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    #statusBar.faded{display:none}

    main{flex-direction:column}
    .list-pane{width:100%;max-width:none;min-width:0;border-right:none;flex:1;min-height:0}
    .detail-pane{flex:1;min-height:0;-webkit-overflow-scrolling:touch}
    #app[data-view="list"] .detail-pane{display:none}
    #app[data-view="detail"] .list-pane{display:none}

    /* 一覧：検索＋「絞り込み」ボタン。プルダウンはボタンで開く。入力は16px（iPhoneで勝手に拡大されない） */
    .searchbar{padding:10px 12px 6px}
    .searchbar input,.filters select,.rawtools input[type=search]{font-size:16px}
    .searchbar input{min-height:44px}
    .filter-btn{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 12px;font-size:13px;white-space:nowrap}
    .filters{display:none;padding:2px 12px 10px}
    .list-pane.filters-open .filters{display:grid}
    .filters select{min-height:42px}
    .row{padding:12px 14px;min-height:66px}
    .ptag{font-size:12px}

    /* 詳細：上に固定の戻るバー、1列、押しやすい大きさ */
    .mbar{display:flex;align-items:center;gap:6px;position:sticky;top:0;z-index:6;background:var(--surface);border-bottom:1px solid var(--line);padding:4px 8px}
    .mbar .back-btn{border:none;background:transparent;color:var(--navy);font-weight:700;font-size:14px;min-height:44px;padding:0 10px 0 4px;font-family:inherit;cursor:pointer;white-space:nowrap}
    .mbar .mtitle{flex:1;min-width:0;font-weight:700;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .mbar .btn{min-height:38px;font-size:12px}
    .dtabs .btn{display:none}
    .detail-head{padding:12px 14px 0}
    .detail-head .dname{font-size:20px}
    .dleft,.dright{min-width:0;flex-basis:100%}
    .dtop{gap:10px}
    .contact{font-size:15px;gap:6px}
    .meta{gap:4px 10px;padding:8px 12px;font-size:12.5px}
    #app[data-view="detail"] .tabs{display:none}   /* 詳細では切り替えタブを隠して、中身を広く使う */
    .dtabs{margin-top:12px;gap:4px}
    .dtab{flex:1;text-align:center;padding:11px 0;font-size:14px}
    .detail-body{padding:12px 12px 28px}
    .rawtools{padding:10px 12px 0}
    .rawtools input[type=search]{flex:1;min-width:0;width:auto}
    .ocard{padding:14px 14px 8px}
    .kv .k{width:6em}
    .fields{grid-template-columns:1fr}
    .field{flex-direction:column;gap:0}
    .field .k{min-width:0}
    details.fold>summary{min-height:48px}
  }
</style>
</head>
<body>

<!-- ===== ログイン画面 ===== -->
<div id="loginScreen">
  <div class="login-card">
    <div class="logo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18M9 9v11"/><circle cx="16.5" cy="15" r="2.2"/><path d="m18.3 16.8 1.4 1.4"/></svg></div>
    <h1>マスタビューワー</h1>
    <p>花岡車輌 業務アプリ ／ SMILEマスタ閲覧</p>
    <button id="loginBtn" data-ha-login>Microsoft アカウントでサインイン</button>
    <div id="loginError"></div>
    <div class="login-foot">SharePoint「SharedMasters」のCSVを<br>読み取り専用で表示します（書き換え不可）</div>
  </div>
</div>

<!-- ===== アプリ本体 ===== -->
<div id="app">
  <header>

// ============================================================
// MSAL 認証

async function init(){
  if(typeof msal === 'undefined'){ showLoginError('MSALライブラリを読み込めませんでした。再読み込みしてください。'); return; }
  msalInstance = new msal.PublicClientApplication(MSAL_CONFIG);
  await msalInstance.initialize();
  await msalInstance.handleRedirectPromise();
  // ボタンは確認（restore）より先に有効にする。期限切れだと確認に数秒かかり、その間に
  // hanaoka_auth.js がサインインボタンを出すため、後から登録すると押しても反応しない
  document.getElementById('loginBtn').onclick = login;
  document.getElementById('logoutBtn').onclick = logout;
  document.getElementById('reloadBtn').onclick = loadAll;
  account = await HanaokaAuth.restore(msalInstance, SCOPES);
  if (account) { showApp(); await loadAll(); }
}
async function login(){
  try{
    hideLoginError();
    account = await HanaokaAuth.login(msalInstance, SCOPES); showApp(); await loadAll();
  }catch(e){ showLoginError('サインインに失敗しました: ' + e.message); }
}
function logout(){
  HanaokaAuth.done();
  msalInstance.logoutPopup({ account });
  document.getElementById('app').style.display='none';
  document.getElementById('loginScreen').style.display='flex';
}
async function getToken(){
  try{ const r=await msalInstance.acquireTokenSilent({scopes:SCOPES,account}); return r.accessToken; }
  catch{ const r=await msalInstance.acquireTokenPopup({scopes:SCOPES}); return r.accessToken; }
}
function showApp(){
  document.getElementById('loginScreen').style.display='none';
  document.getElementById('app').style.display='flex';
  const n=account.name||account.username;
  document.getElementById('userName').textContent=n;
  document.getElementById('userAvatar').textContent=(n||'?').charAt(0);
}
function showLoginError(m){ HanaokaAuth.done(); const e=document.getElementById('loginError'); e.textContent=m; e.style.display='block'; }
function hideLoginError(){ document.getElementById('loginError').style.display='none'; }
let statusFade=null;
function setStatus(type,msg,spin){
  const b=document.getElementById('statusBar');
  b.className=type||'';
  document.getElementById('statusText').innerHTML=(spin?'<span class="spin"></span> ':'')+msg;
  // 読み込み完了は数秒で消す（スマホの画面を空けるため。エラーと読み込み中は出したまま）。CSS は幅の狭い画面だけで .faded を効かせる
  clearTimeout(statusFade);
  if(type==='success') statusFade=setTimeout(()=>b.classList.add('faded'),4000);
}

// ============================================================
// Graph: SharedMasters からファイル取得
// ============================================================
async function graphGet(url){
  const token=await getToken();
  const r=await fetch('https://graph.microsoft.com/v1.0'+url,{headers:{Authorization:'Bearer '+token}});
  if(!r.ok) throw new Error(`Graph ${r.status}: ${url}`);
  return r.json();
}
async function resolveDriveId(){
  if(driveId) return driveId;
  try{
    const data=await graphGet(`/sites/${SITE_ID}/drives?$select=id,name,webUrl&$top=100`);
    const drives=data.value||[];
    const hit=drives.find(d=>d.name==='SharedMasters')
            || drives.find(d=>/SharedMasters/i.test(d.name||''))
            || drives.find(d=>/SharedMasters/i.test(d.webUrl||''));
    if(hit){ driveId=hit.id; console.log('SharedMasters driveId:', driveId); return driveId; }
    console.warn('SharedMastersライブラリが見つかりません。利用可能なドライブ:', drives.map(d=>d.name));
  }catch(e){ console.warn('drive解決失敗、フォールバックID使用', e); }
  driveId=FALLBACK_DRIVE_ID;
  return driveId;
}
async function fetchCsvText(fname){
  const did=await resolveDriveId();
  const meta=await graphGet(`/drives/${did}/root:/${encodeURIComponent(fname)}`);
  const dl=meta['@microsoft.graph.downloadUrl'];
  if(!dl) throw new Error('downloadUrl が取得できません: '+fname);
  const r=await fetch(dl);
  if(!r.ok) throw new Error(`ファイル取得失敗 ${r.status}: ${fname}`);
  const buf=await r.arrayBuffer();
  return decodeCsv(buf);
}
function decodeCsv(buf){
  let text=new TextDecoder('utf-8').decode(buf);
  if(text.charCodeAt(0)===0xFEFF) text=text.slice(1);
  const bad=(text.match(/�/g)||[]).length;
  if(bad>5){
    try{ let s=new TextDecoder('shift_jis').decode(buf); if(s.charCodeAt(0)===0xFEFF)s=s.slice(1); return s; }catch(e){}
  }
  return text;
}
function afterLoad(){
  prepareAll();
  if(!current||!TABS.includes(current)) current=TABS.find(k=>store[k]);
  renderTabs(); renderFilters(); renderList(); renderDetail();
}
function loadedSummary(){
  return ORDER.filter(k=>store[k]).map(k=>`${DATASETS[k].label} ${store[k].rows.length.toLocaleString()}件`).join('　/　');
}
async function loadAll(){
  try{
    setStatus('loading','SharePoint（SharedMasters）から読み込み中…',true);
    await resolveDriveId();
    const failed=[];
    await Promise.all(ORDER.map(async key=>{
      try{ const t=await fetchCsvText(DATASETS[key].file); loadDataset(key,t); }
      catch(e){ console.warn(DATASETS[key].file,e); failed.push(DATASETS[key].file); }
    }));
    if(!TABS.some(k=>store[k])){
      setStatus('error','読み込めませんでした。下のボタンでCSVを手動選択もできます。');
      showDropPrompt(); return;
    }
    afterLoad();
    // TOVASが読めないと請求情報が欠けるので、黙って通さず必ず知らせる
    if(failed.length) setStatus('error','一部読み込めませんでした: '+failed.join('、')+'　／　'+loadedSummary());
    else setStatus('success','読み込み完了 — '+loadedSummary());
  }catch(e){
    console.error(e); setStatus('error','エラー: '+e.message); showDropPrompt();
  }
}

// ============================================================
// CSV パース & 共通ロジック
// ============================================================
// 検索用の正規化。半角カナ・全角カナ・ひらがなのどれで入力しても同じ文字列になる
//   NFKC: 半角カナ→全角カナ（濁点も合成）、全角英数→半角、㈱→(株)
//   ひらがな→カタカナ: U+3041〜3096 を +0x60（ぁ→ァ … ゖ→ヶ）
function normalize(s){
  return (s||"").normalize("NFKC").toLowerCase().replace(/[ぁ-ゖ]/g,c=>String.fromCharCode(c.charCodeAt(0)+0x60));
}
function isBlankCode(v){ return v===""||/^0+$/.test(v); }
function zeroish(v){ return v!=="" && /^0+(\.0+)?$/.test(String(v).trim()); }
function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

function parseCSV(text){
  if(text.charCodeAt(0)===0xFEFF) text=text.slice(1);
  const rows=[];let row=[],field="",i=0;const n=text.length;let inQ=false;
  while(i<n){const c=text[i];
    if(inQ){ if(c==='"'){ if(text[i+1]==='"'){field+='"';i+=2;continue;} inQ=false;i++;continue;} field+=c;i++;continue;}
    if(c==='"'){inQ=true;i++;continue;}
    if(c===','){row.push(field);field="";i++;continue;}
    if(c==='\r'){i++;continue;}
    if(c==='\n'){row.push(field);rows.push(row);row=[];field="";i++;continue;}
    field+=c;i++;
  }
  if(field!==""||row.length){row.push(field);rows.push(row);}
  return rows;
}
function buildFields(headers){
  const fields=[];let i=0;
  while(i<headers.length){
    const h=headers[i],nx=headers[i+1];let paired=false;
    const base=h.replace(/ｺｰﾄﾞ$/,"");   // 「ｺｰﾄﾞ」は半角4文字（ｺ ｰ ﾄ ﾞ）
    if(nx){
      if(nx===h+"名") paired=true;
      else if(base!==h&&(nx===base+"名"||nx===base)) paired=true;
    }
    if(paired){ fields.push({label:base,codeIdx:i,nameIdx:i+1,pair:true}); i+=2; }
    else{ fields.push({label:h,idx:i,pair:false}); i++; }
  }
  return fields;
}
function fieldValue(f,row){
  if(f.pair){
    const code=row[f.codeIdx]||"",name=row[f.nameIdx]||"";
    const blank=name===""&&isBlankCode(code);
    return {blank,name,code,display:name!==""?name:(isBlankCode(code)?"":code)};
  }else{
    const v=row[f.idx]||"";
    return {blank:v==="",name:v,code:"",display:v};
  }
}
function loadDataset(key,text){
  const rows=parseCSV(text); if(!rows.length) return;
  const headers=rows[0];
  const data=rows.slice(1).filter(r=>r.length>1&&r.some(c=>c!==""));
  const cfg=DATASETS[key];
  const keyIdx=headers.indexOf(cfg.keyCol);
  const fields=buildFields(headers);
  // ヘッダ名→fieldの索引（重複ヘッダは先勝ち）＋正規化索引
  const fieldMap={}, fieldMapN={};
  fields.forEach(f=>{
    const keys=f.pair?[headers[f.nameIdx],f.label]:[headers[f.idx]];
    keys.forEach(k=>{ if(k && !(k in fieldMap)){ fieldMap[k]=f; const nk=normalize(k); if(!(nk in fieldMapN)) fieldMapN[nk]=f; } });
  });
  const byKey={};
  data.forEach(r=>{ r.__blob=normalize(r.join(" ")); if(keyIdx>=0) byKey[r[keyIdx]]=r; });
  // 同名の列が2組ある（得意先／請求先、仕入先／支払先）。2組目は元データ表示で見分けがつくよう印を付ける
  if(cfg.dupSuffix){ const seen={}; fields.forEach(f=>{ seen[f.label]=(seen[f.label]||0)+1; if(seen[f.label]===2) f.label+=cfg.dupSuffix; }); }
  store[key]={headers,rows:data,fields,fieldMap,fieldMapN,byKey,keyIdx};
}
function resolveHeader(ds,row,header){
  let f=ds.fieldMap[header]||ds.fieldMapN[normalize(header)];
  if(!f) return null;
  const v=fieldValue(f,row);
  return {f,label:f.label,blank:v.blank,name:v.name,code:v.code,display:v.display};
}

// ============================================================
// 値の取り出し（未設定・ゼロ値は空文字）と整形
// ============================================================
function R(key,row,h){ const ds=store[key]; return (ds&&row)?resolveHeader(ds,row,h):null; }
function V(key,row,h){ const r=R(key,row,h); return (!r||r.blank||zeroish(r.display))?"":r.display; }
// 区分系の ON/OFF（コード0・空欄＝OFF）
function flagOn(key,row,h){
  const r=R(key,row,h); if(!r||r.blank) return false;
  const x=(r.f&&r.f.pair&&r.code!=="")?r.code:r.display;
  return !zeroish(x);
}
function num(v){ const n=Number(String(v).replace(/,/g,"").trim()); return (v!==""&&isFinite(n))?n:null; }
function fmtYen(v){ const n=num(v); return v===""?"":(n===null?v:n.toLocaleString("ja-JP")+" 円"); }
function fmtDay(v){ if(!v) return ""; if(/^\d+$/.test(v)){ const n=+v; return n===99?"末日":n+"日"; } return v; }
function fmtDate(v){ if(/^\d{8}$/.test(v)) return v.slice(0,4)+"/"+v.slice(4,6)+"/"+v.slice(6); return v; }
function fmtRate(v){ const n=num(v); return v===""?"":(n===null?v:(n%1===0?n.toFixed(1):String(n))+" %"); }
function joinSp(...a){ return a.filter(x=>x).join(" "); }
function prefCity(addr){
  const m=addr.match(/^(.{2,3}?[都道府県])?(.*?[市区町村郡])/);
  return m?((m[1]||"")+m[2]):addr.slice(0,6);
}
function tovasRow(row){
  const ds=store.customer, t=store.tovas; if(!ds||!t) return null;
  return t.byKey[row[ds.keyIdx]]||null;
}

// ============================================================
// 得意先：請求方法の組み立て（得意先マスタ＋TOVAS → 一つの答え）
// ============================================================
function billing(row){
  if(row.__b) return row.__b;
  const tr=tovasRow(row);
  const rc=R("customer",row,"請求方法名");
  const c={
    code:rc&&rc.code?String(Number(rc.code)||0):"0", name:V("customer",row,"請求方法名"), detail:V("customer",row,"請求方法詳細"),
    hasT:!!tr, file:!!tr&&flagOn("tovas",tr,"ﾌｧｲﾙ送信区分"), post:!!tr&&flagOn("tovas",tr,"郵送区分"), fax:!!tr&&flagOn("tovas",tr,"FAX送信区分")
  };
  c.detailN=normalize(c.detail).replace(/[\s_\-]/g,"");
  const to=tr?V("tovas",tr,"ﾒｰﾙｱﾄﾞﾚｽ(TO)"):"", direct=V("customer",row,"直Mailアドレス");
  const fn=BILLING_BY_CODE[c.code];
  let r;
  if(fn) r=fn(c);
  else if(c.code==="0"&&!c.name) r=c.hasT?{tag:"",label:"（請求方法 未設定）／TOVAS請求設定のみ登録あり",way:TOVAS_WAYS(c).join("・"),known:false}:{tag:"",label:"",way:""};
  else r={tag:c.name||c.detail, label:c.name+(c.detail?"（"+c.detail+"）":""), way:"", known:false};
  const dest=to||direct;
  const warn=(to&&direct&&normalize(to)!==normalize(direct))
    ?`得意先マスタ（直Mailアドレス: ${direct}）とTOVAS（${to}）で送付先が異なります`:"";
  const srcs=[["customer","請求方法ｺｰﾄﾞ"],["customer","請求方法詳細"],["tovas","ﾌｧｲﾙ送信区分"],["tovas","郵送区分"],["tovas","FAX送信区分"]];
  return row.__b={label:r.label,tag:r.tag,known:r.known!==false,dataWarn:r.dataWarn||"",way:r.way,dest,
    destSrc:to?[["tovas","ﾒｰﾙｱﾄﾞﾚｽ(TO)"]]:(direct?[["customer","直Mailアドレス"]]:[]),warn,srcs,c};
}
function tagClass(tag,known){
  if(known===false) return "warn";
  return tag==="Bill One"?"bill":/^(直Mail|TOKIUM|楽々精算)$/.test(tag)?"mail":/^TOVAS/.test(tag)?"tov":"";
}

// 基準額による支払（回収）方法の振り分け（「基準額で設定」のとき）
//   例）基準額 50,000円以下：振込 ／ 超える場合：全額を 手形
//   p = { setting:設定方法名, m1:方法1, amt:基準額, judge:判断区分名, m2:方法2 } の元項目名
function thresholdRule(key,row,p){
  if(V(key,row,p.setting)!=="基準額で設定") return null;
  const m1=V(key,row,p.m1), m2=V(key,row,p.m2), amt=V(key,row,p.amt), judge=V(key,row,p.judge);
  if(!amt||!m1||!m2) return null;
  return { method:`${m1}・${m2}`, text:`基準額 ${fmtYen(amt)} 以下：${m1}　／　超える場合：${judge?judge+" ":""}${m2}`,
    src:[p.setting,p.m1,p.amt,p.judge,p.m2].map(h=>[key,h]) };
}
const CUST_THRESH={ setting:"回収設定方法名１", m1:"回収設定１　基準額設定　入金方法名１", amt:"回収設定１　基準額設定　基準額", judge:"回収設定１　基準額設定　基準額判断区分名", m2:"回収設定１　基準額設定　入金方法名２" };
const SUPP_THRESH={ setting:"支払設定方法名１", m1:"支払設定１　基準額設定　支払方法名１", amt:"支払設定１　基準額設定　基準額", judge:"支払設定１　基準額設定　基準額判断区分名", m2:"支払設定１　基準額設定　支払方法名２" };

// 一覧・絞り込み用の派生値（読み込み後に1回だけ計算）
function prepareAll(){
  ["customer","supplier"].forEach(key=>{
    const ds=store[key]; if(!ds) return;
    const nameIdx=ds.headers.indexOf(DATASETS[key].nameCol);
    ds.rows.forEach(r=>{
      const addr=V(key,r,"住所１");
      const d={ pc:prefCity(addr), name:nameIdx>=0?r[nameIdx]:"", closing:fmtDay(V(key,r,"締日１")), tanto:V(key,r,DATASETS[key].tantoCol) };
      if(key==="customer"){
        r.__b=null; const b=billing(r); d.m=b.tag; d.tag=b.tag; d.known=b.known;
        const tr=tovasRow(r); if(tr) r.__blob=normalize(r.join(" ")+" "+tr.join(" "));   // メール等はTOVAS側にもある
      }else{
        const th=thresholdRule(key,r,SUPP_THRESH);
        d.m=th?th.method:V(key,r,"支払条件名１"); d.tag=d.m;
      }
      r.__d=d;
    });
  });
}

const mqMobile=window.matchMedia('(max-width:760px)');
let listScroll=0;

function setView(v){

function openDetail(key,rowEl){

function renderTabs(){

function renderFilters(){
  const ds=store[current], box=document.getElementById("filters"); box.innerHTML="";
  if(!ds) return;
  const mLabel=current==="customer"?"請求方法":"支払方法";
  const opts=(pick)=>{
    const set=new Map(); ds.rows.forEach(r=>{ const v=pick(r.__d); set.set(v||"", (set.get(v||"")||0)+1); });
    return [...set.keys()].sort((a,b)=>{ if(a==="")return 1; if(b==="")return -1; const na=parseInt(a),nb=parseInt(b); return (isNaN(na)||isNaN(nb))?a.localeCompare(b,"ja"):na-nb; });
  };
  const defs=[["m",mLabel,opts(d=>d.m)],["c","締日",opts(d=>d.closing)],["t","担当",opts(d=>d.tanto)]];
  defs.forEach(([k,label,list])=>{

    const sel=document.createElement("select");

    sel.innerHTML='<option value="">すべて</option>'+list.map(v=>{ const val=v===""?NONE:v; return `<option value="${esc(val)}"${filters[k]===val?" selected":""}>${esc(v||"（未設定）")}</option>`; }).join("");
    sel.onchange=()=>{ filters[k]=sel.value; renderList(); };
    lab.appendChild(sel); box.appendChild(lab);

function highlight(text,q){
  if(!q) return esc(text);
  try{ const re=new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g,"\\$&"),"ig"); return esc(text).replace(re,m=>"<mark>"+esc(m)+"</mark>"); }
  catch(e){ return esc(text); }
}
function renderList(){
  const ds=store[current]; const listEl=document.getElementById("list");

  const q=document.getElementById("search").value.trim(); const nq=normalize(q);

  const fm=(r)=>{ const d=r.__d; return hit(d.m,filters.m)&&hit(d.closing,filters.c)&&hit(d.tanto,filters.t); };
  const nf=["m","c","t"].filter(k=>filters[k]!=="").length, badge=document.getElementById("filterBadge");
  badge.hidden=!nf; badge.textContent=nf;
  const matched=ds.rows.filter(r=>(!nq||r.__blob.includes(nq))&&fm(r));

  document.getElementById("listMeta").textContent=`検索結果　${total.toLocaleString()} 件`+(total>CAP?`（先頭${CAP}件を表示）`:"");
  const frag=document.createElement("div");
  shown.forEach(r=>{
    const d=r.__d, div=document.createElement("div");
    div.className="row"+(r[ki]===selectedKey?" sel":"");

    div.innerHTML=`<div class="rmain"><div class="code">${highlight(r[ki]||"",q)}</div>
      <div class="name">${highlight(d.name,q)}</div>

// ============================================================
// 概要（業務の意味に組み立てた表示）
//   item = { k:項目名, v:表示値, src:[[データセット,元項目],...], warn, unk, big, mask }
//   参照元は常時表示せず、各項目へマウスを乗せたときだけ出す（カードには要約チップのみ）
// ============================================================
function it(k,v,src,extra){ return Object.assign({k,v:v||"",src:src||[]},extra||{}); }
function srcTip(item){
  if(!item.src||!item.src.length) return "";
  const names=[...new Set(item.src.map(s=>SRC[s[0]]))].join("・");
  return `参照元：${names}\n元項目：${item.src.map(s=>s[1]).join("、")}`;
}
function isMail(v){ return /^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v); }
function itemHtml(x){
  const empty=!x.v;
  let vh;
  if(empty) vh="—";
  else if(x.mask){
    const full=x.v, shownTxt="●●●●"+(full.length>3?full.slice(-3):"");
    vh=`<span class="maskv" data-full="${esc(full)}" data-mask="${esc(shownTxt)}">${esc(shownTxt)}</span><button class="reveal" type="button">表示</button>`;
  }
  else vh=isMail(x.v)?`<a class="maillink" href="mailto:${esc(x.v)}">${esc(x.v)}</a>`:esc(x.v);
  if(x.warn) vh+=`<span class="wrn" title="${esc(x.warn)}">⚠</span>`;
  if(x.unk) vh+=`<span class="unk" title="${esc(x.unk)}">未定義の組み合わせ</span>`;
  return `<div class="kv${empty?" empty":""}" title="${esc(srcTip(x))}"><span class="k">${esc(x.k)}</span><span class="v${x.big?" big":""}">${vh}</span></div>`;
}
function srcChip(items){
  const set=new Set(); items.forEach(x=>{ if(x.v) (x.src||[]).forEach(s=>set.add(s[0])); });
  const order=["customer","supplier","tovas"].filter(k=>set.has(k));
  return order.length?`<span class="srcchip" title="項目に触れると、項目ごとの参照元・元項目を表示">参照元：${order.map(k=>SRC[k]).join(" ＋ ")}</span>`:"";
}
function ocard(cls,title,items){
  return `<div class="ocard ${cls}"><div class="ohead"><span class="ot">${esc(title)}</span><span class="grow"></span>${srcChip(items)}</div>${items.map(itemHtml).join("")}</div>`;
}

function foldItems(key,row,def){
  const items=[]; const mask=new Set(def.mask||[]);
  def.fields.forEach(h=>{
    const r=R(key,row,h); if(!r||r.blank||zeroish(r.display)) return;
    let v=r.display;
    if(/残高/.test(h)||h==="与信限度額"||h==="資本金") v=fmtYen(v);
    else if(h==="単価掛率") v=fmtRate(v);
    else if(/^(登録日|操作日付)$/.test(h)) v=fmtDate(v);
    items.push(it(r.label,v,[[key,h]],{mask:mask.has(h)}));
  });
  return items;
}
function foldsHtml(key,row){
  return FOLDS[key].map(def=>{
    const items=foldItems(key,row,def); if(!items.length) return "";
    return `<details class="fold"><summary>${esc(def.title)}<span class="fcount">${items.length}項目</span></summary><div class="fbody"><div class="twocol">${items.map(itemHtml).join("")}</div></div></details>`;
  }).join("");
}

    it("電話番号",V(k,row,"電話番号"),[[k,"電話番号"]]),
    it("仕入先名",V(k,row,"仕入先名１"),[[k,"仕入先名１"]]),
    it("FAX番号",V(k,row,"ＦＡＸ番号"),[[k,"ＦＡＸ番号"]]),
    it("仕入先名略称",V(k,row,"仕入先名略称"),[[k,"仕入先名略称"]]),
    it("社内担当",V(k,row,"担当者名"),[[k,"担当者名"]]),
    it("郵便番号",V(k,row,"郵便番号"),[[k,"郵便番号"]]),
    it("住所",addr,[[k,"住所１"],[k,"住所２"],[k,"住所３"]]),
  ];
  const baseHtml=`<details class="fold open-always" open><summary>基本情報</summary><div class="fbody"><div class="twocol">${baseItems.map(itemHtml).join("")}</div></div></details>`;
  return {
    html:`<div class="cards two">${ocard("bill","支払情報",payItems)}${ocard("inv","インボイス",invItems)}</div>${baseHtml}${foldsHtml(k,row)}`,
    copy:payItems.filter(x=>x.v).map(x=>[x.k,x.v]).concat(invItems.filter(x=>x.v).map(x=>[x.k,x.v])),
    head:{
      code:row[store.supplier.keyIdx], name:V(k,row,"仕入先名１"), addr,
      tel:V(k,row,"電話番号"), fax:V(k,row,"ＦＡＸ番号"), mail:"",
      chip:"仕入先マスタ",
      meta:[["略称",V(k,row,"仕入先名略称")],["仕入先ジャンル",V(k,row,"仕入先ｼﾞｬﾝﾙ名")],["相手先担当",V(k,row,"相手先担当者名")],["社内担当",V(k,row,"担当者名")]],
      upd:[fmtDate(V(k,row,"操作日付")),V(k,row,"ﾛｸﾞｲﾝ名")]
    }
  };
}

// ============================================================
// 元データ（CSVそのまま）
// ============================================================
function fieldEl(r){
  const d=document.createElement("div"); d.className="field"+(r.blank?" empty":"");
  let vhtml;
  if(r.blank){ vhtml="（未設定）"; }
  else{
    const disp=esc(r.display);
    vhtml=isMail(r.display)?`<a class="maillink" href="mailto:${disp}">${disp}</a>`:disp;
    if(r.f&&r.f.pair&&r.name!==""&&!isBlankCode(r.code)&&r.code!==r.name) vhtml+=`<span class="cd">${esc(r.code)}</span>`;
  }
  d.innerHTML=`<span class="k">${esc(r.label)}</span><span class="v">${vhtml}</span>`;
  return d;
}
function passFilter(r,ff){ return !ff || normalize(r.label).includes(ff) || normalize(r.display).includes(ff); }
function rawCard(ds,row,title,cls){
  const ff=normalize(fieldFilter);
  const card=document.createElement("div"); card.className="section"+(cls?" "+cls:"");
  const t=document.createElement("div"); t.className="section-title";
  t.textContent=title+(showEmpty?"・空欄含む":"・設定済のみ"); card.appendChild(t);
  const grid=document.createElement("div"); grid.className="fields"; let cnt=0;
  ds.fields.forEach(f=>{
    const v=fieldValue(f,row);
    if(v.blank&&!showEmpty) return;
    const r={f,label:f.label,...v};
    if(!passFilter(r,ff)) return;
    grid.appendChild(fieldEl(r)); cnt++;
  });
  card.appendChild(grid);
  return cnt?card:null;
}
function buildRaw(){
  const body=document.createElement("div"); body.className="detail-body";
  const ds=store[current], row=ds.byKey[selectedKey];
  const c1=rawCard(ds,row,`${SRC[current]}（CSVそのまま）`);
  if(c1) body.appendChild(c1);
  if(current==="customer"&&store.tovas){
    const tr=tovasRow(row);
    if(tr){ const c2=rawCard(store.tovas,tr,"TOVAS請求設定（CSVそのまま）","tv"); if(c2) body.appendChild(c2); }
    else { const p=document.createElement("div"); p.className="placeholder"; p.style.margin="0 0 14px"; p.textContent="この得意先のTOVAS請求設定はありません"; body.appendChild(p); }
  }
  if(!body.children.length){ const p=document.createElement("div"); p.className="placeholder"; p.style.marginTop="20px"; p.textContent="該当する項目がありません"; body.appendChild(p); }
  return body;
}

// ============================================================
// 詳細ペイン
// ============================================================
function renderDetail(){
  const det=document.getElementById("detail");
  const ds=store[current];
  if(!ds||!selectedKey){ det.innerHTML=`<div class="placeholder">左の一覧から選択してください</div>`; return; }
  const row=ds.byKey[selectedKey];
  if(!row){ det.innerHTML=`<div class="placeholder">データが見つかりません</div>`; return; }
  const ov=current==="customer"?customerOverview(row):supplierOverview(row);
  const h=ov.head;
  det.innerHTML="";
  const head=document.createElement("div"); head.className="detail-head";
  const meta=h.meta.map(([k,v])=>`<span class="mk">${esc(k)}</span><span class="mv">${v?esc(v):"—"}</span>`).join("");
  head.innerHTML=`<div class="dtop">
      <div class="dleft">
        <div class="dcode">${esc(h.code)}</div>
        <div class="dname">${esc(h.name)}</div>
        <div class="contact">
          ${h.addr?`<div class="cl"><span class="ci">住所</span><a class="maillink" href="https://www.google.com/maps/search/?api=1&amp;query=${encodeURIComponent(h.addr)}" target="_blank" rel="noopener">${esc(h.addr)}</a></div>`:""}
          ${h.tel?`<div class="cl"><span class="ci">電話</span><a class="maillink" href="tel:${esc(h.tel.replace(/[^0-9+]/g,""))}">${esc(h.tel)}</a></div>`:""}
          ${h.fax?`<div class="cl"><span class="ci">FAX</span><span>${esc(h.fax)}</span></div>`:""}
          ${h.mail?`<div class="cl"><span class="ci">メール</span><a class="maillink" href="mailto:${esc(h.mail)}">${esc(h.mail)}</a></div>`:""}
        </div>
      </div>
      <div class="dright">
        <div class="srcline"><span class="chip">${esc(h.chip)}</span>${h.upd[0]||h.upd[1]?`<span>最終更新日 ${esc(h.upd[0]||"—")}　更新者 ${esc(h.upd[1]||"—")}</span>`:""}</div>
        <div class="meta">${meta}</div>
      </div>
    </div>
    <div class="dtabs">
      <button class="dtab${viewMode==='overview'?' active':''}" data-mode="overview">概要</button>
      <button class="dtab mute${viewMode==='raw'?' active':''}" data-mode="raw">元データを表示</button>
      <span class="grow"></span>
      <button class="btn" id="copyBtn" title="コード・名称・住所・電話・請求（支払）情報をコピー">この${current==="customer"?"会社":"仕入先"}をコピー</button>
    </div>`;
  // スマホ用の上部バー（上に固定）：「← 一覧」・名称・コピー。PCでは非表示
  const mbar=document.createElement("div"); mbar.className="mbar";
  mbar.innerHTML=`<button class="back-btn" type="button">← 一覧</button><span class="mtitle">${esc(h.name)}</span><button class="btn" id="copyBtn2" type="button">コピー</button>`;
  mbar.querySelector(".back-btn").onclick=backToList;
  det.appendChild(mbar);
  det.appendChild(head);
  if(viewMode==='raw'){
    const tools=document.createElement("div"); tools.className="rawtools";
    tools.innerHTML=`<label class="toggle"><input type="checkbox" id="emptyToggle" ${showEmpty?"checked":""}> 空欄も表示</label>
      <input type="search" id="fieldFilter" placeholder="項目名・値で絞り込み" value="${esc(fieldFilter)}">`;
    det.appendChild(tools);
    det.appendChild(buildRaw());
    tools.querySelector("#emptyToggle").onchange=e=>{showEmpty=e.target.checked;renderDetail();};
    tools.querySelector("#fieldFilter").oninput=e=>{
      fieldFilter=e.target.value; const sc=det.scrollTop;
      const old=det.querySelector(".detail-body"); old.replaceWith(buildRaw()); det.scrollTop=sc;
    };
  }else{
    const body=document.createElement("div"); body.className="detail-body"; body.innerHTML=ov.html;
    det.appendChild(body);
  }
  head.querySelectorAll(".dtab").forEach(b=>b.onclick=()=>{ viewMode=b.dataset.mode; fieldFilter=""; renderDetail(); });
  const copyHandler=e=>{
    const lines=[`${h.code}　${h.name}`,h.addr,h.tel&&("TEL "+h.tel)].filter(x=>x).concat(ov.copy.filter(p=>p[1]).map(p=>`${p[0]}：${p[1]}`));
    const btn=e.currentTarget, done=()=>{ const o=btn.textContent; btn.textContent="コピーしました"; setTimeout(()=>btn.textContent=o,1200); };
    (navigator.clipboard?navigator.clipboard.writeText(lines.join("\n")):Promise.reject()).then(done).catch(()=>{ prompt("コピーしてください",lines.join("\n")); });
  };
  head.querySelector("#copyBtn").onclick=copyHandler;
  mbar.querySelector("#copyBtn2").onclick=copyHandler;
}

// ---- スマホ用：ヘッダーの「⋯」メニュー・絞り込みボタン ----
(function(){
  const header=document.querySelector("header"), menuBtn=document.getElementById("menuBtn");
  const closeMenu=()=>{ header.classList.remove("menu-open"); menuBtn.setAttribute("aria-expanded","false"); };
  menuBtn.onclick=e=>{ e.stopPropagation(); const on=header.classList.toggle("menu-open"); menuBtn.setAttribute("aria-expanded",on); };
  document.addEventListener("click",e=>{ if(header.classList.contains("menu-open")&&(!e.target.closest("#hdrActions")||e.target.closest("#hdrActions .btn"))) closeMenu(); });
  const fb=document.getElementById("filterBtn");
  fb.onclick=()=>{ const on=document.querySelector(".list-pane").classList.toggle("filters-open"); fb.setAttribute("aria-expanded",on); };
  document.getElementById("app").dataset.view="list";

  const ph=()=>{ sb.placeholder=isMobile()?"名称・コード・住所・電話など":"会社名・コード・住所・電話・メールで検索"; };

})();
// 口座番号などのマスク表示（画面上の見た目の対策。閲覧権限そのものは SharePoint 側で管理）
document.addEventListener("click",e=>{
  const b=e.target.closest("button.reveal"); if(!b) return;
  const s=b.previousElementSibling, on=b.dataset.on!=="1";
  s.textContent=on?s.dataset.full:s.dataset.mask; b.textContent=on?"隠す":"表示"; b.dataset.on=on?"1":"";
});

// ---- 検索入力 ----
let searchTimer=null;
document.getElementById("search").addEventListener("input",()=>{ clearTimeout(searchTimer); searchTimer=setTimeout(renderList,120); });

// ============================================================
// 手動CSV読込（localhost開発・Graph失敗時のフォールバック）
// ※ファイルはブラウザ内で読むだけ。どこにもアップロードされません。
// ============================================================
const fileInput=document.getElementById("fileInput");
fileInput.onchange=async e=>{ await handleFiles(e.target.files); };
async function handleFiles(files){
  for(const file of files){
    const key=matchFileToKey(file.name); if(!key) continue;
    loadDataset(key, await file.text());
  }
  if(TABS.some(k=>store[k])){ afterLoad(); setStatus('success','読み込み完了（手動）— '+loadedSummary()); }
}
function matchFileToKey(fname){
  const n=fname.replace(/\.csv$/i,"");
  for(const key of ORDER){ const base=DATASETS[key].file.replace(/\.csv$/i,""); if(n===base||n.includes(base)||base.includes(n)) return key; }
  if(/TOVAS/i.test(fname)) return "tovas";
  if(/仕入/.test(fname)) return "supplier";
  if(/得意先/.test(fname)) return "customer";
  return null;
}
document.addEventListener("dragover",e=>e.preventDefault());
document.addEventListener("drop",async e=>{ e.preventDefault(); const dz=document.querySelector(".dropzone"); if(dz)dz.classList.remove("drag"); if(e.dataTransfer.files.length) await handleFiles(e.dataTransfer.files); });
function showDropPrompt(){
  document.getElementById("detail").innerHTML=`
    <div class="dropzone" id="dz">
      <p style="font-size:15px;color:var(--txt);font-weight:700;margin:0 0 6px">CSVを手動で読み込む</p>
      <p style="margin:0 0 14px">SharePointから自動取得できない場合（localhost等）は、<br>下のボタンかドラッグ&ドロップでCSVを選択してください。</p>
      <button style="cursor:pointer;border:1px solid var(--line-strong);background:var(--surface);color:var(--txt);border-radius:8px;padding:8px 16px;font-family:inherit;font-size:13px" onclick="document.getElementById('fileInput').click()">CSVを選択（複数可）</button>
      <p style="margin:14px 0 0;font-size:12px">対象: 得意先マスタ.csv / 仕入先マスタ.csv / TOVAS得意先別請求明細書情報.csv</p>
    </div>`;
  const dz=document.getElementById("dz");
  dz.addEventListener("dragover",()=>dz.classList.add("drag"));
  dz.addEventListener("dragleave",()=>dz.classList.remove("drag"));
}

// ---- 起動 ----
init();

<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>マスタビューワー — 花岡車輌</title>
<script src="https://cdn.jsdelivr.net/npm/@azure/msal-browser@3.10.0/lib/msal-browser.min.js" crossorigin="anonymous"></script>
<style>
  :root{
    --navy:#0e1a36; --navy2:#16264d; --gold:#c9a66b; --gold2:#b8924f;
    --bg:#f4f6f9; --panel:#ffffff; --border:#dfe4ea; --text:#1f2733;
    --muted:#7a8699; --accent:#2563eb; --accent-soft:#e8f0fe;
    --hover:#f0f4fb; --code:#94a3b8; --chip:#eef2f7; --ok:#16a34a; --warn:#d97706; --err:#dc2626;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;font-family:"Segoe UI","Hiragino Kaku Gothic ProN","Meiryo",sans-serif;
    background:var(--bg);color:var(--text);font-size:14px;line-height:1.5;}

  /* ---- ログイン画面 ---- */
  #loginScreen{position:fixed;inset:0;background:linear-gradient(135deg,var(--navy),var(--navy2));
    display:flex;align-items:center;justify-content:center;z-index:100}
  .login-card{background:#fff;border-radius:16px;padding:40px 44px;width:380px;max-width:90vw;
    box-shadow:0 20px 60px rgba(0,0,0,.35);text-align:center}
  .login-card .logo{width:54px;height:54px;border-radius:12px;margin:0 auto 16px;
    background:linear-gradient(135deg,var(--gold),var(--gold2));display:flex;align-items:center;
    justify-content:center;color:#fff;font-size:24px;font-weight:700}
  .login-card h1{font-size:19px;margin:0 0 4px;color:var(--navy)}
  .login-card p{color:var(--muted);font-size:13px;margin:0 0 24px}
  .login-card button{width:100%;padding:12px;border:none;border-radius:10px;cursor:pointer;
    background:var(--navy);color:#fff;font-size:15px;font-weight:600}
  .login-card button:hover{background:var(--navy2)}
  #loginError{display:none;margin-top:16px;color:var(--err);font-size:13px;background:#fef2f2;
    border:1px solid #fecaca;border-radius:8px;padding:10px}
  .login-foot{margin-top:20px;font-size:11px;color:var(--muted);line-height:1.6}

  /* ---- アプリ本体 ---- */
  #app{display:none;flex-direction:column;height:100vh}
  header{background:var(--navy);color:#fff;padding:0 16px;height:52px;
    display:flex;align-items:center;gap:14px;flex-shrink:0}
  header h1{font-size:15px;margin:0;font-weight:700;white-space:nowrap;color:#fff;
    display:flex;align-items:center;gap:8px}
  header h1 .dot{width:22px;height:22px;border-radius:6px;background:linear-gradient(135deg,var(--gold),var(--gold2));
    display:inline-flex;align-items:center;justify-content:center;font-size:13px}
  .tabs{display:flex;gap:6px;flex-wrap:wrap}
  .tab{border:1px solid rgba(255,255,255,.25);background:transparent;border-radius:999px;
    padding:5px 14px;cursor:pointer;font-size:13px;color:rgba(255,255,255,.8);white-space:nowrap}
  .tab.active{background:var(--gold);color:var(--navy);border-color:var(--gold);font-weight:700}
  .tab:not(.active):hover{background:rgba(255,255,255,.12)}
  .grow{flex:1}
  .userchip{display:flex;align-items:center;gap:8px;font-size:12px;color:rgba(255,255,255,.85)}
  .avatar{width:26px;height:26px;border-radius:50%;background:var(--gold);color:var(--navy);
    display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px}
  .btn{border:1px solid rgba(255,255,255,.3);background:transparent;border-radius:8px;
    padding:5px 11px;cursor:pointer;font-size:12px;color:#fff;}
  .btn:hover{background:rgba(255,255,255,.12)}

  #statusBar{padding:6px 16px;font-size:12px;background:#eef2f7;color:var(--muted);
    border-bottom:1px solid var(--border);flex-shrink:0;display:flex;align-items:center;gap:8px}
  #statusBar.loading{background:#fef9ec;color:#92702a}
  #statusBar.success{background:#ecfdf3;color:#15803d}
  #statusBar.error{background:#fef2f2;color:var(--err)}
  .spin{width:12px;height:12px;border:2px solid currentColor;border-top-color:transparent;
    border-radius:50%;animation:sp .7s linear infinite;display:inline-block}
  @keyframes sp{to{transform:rotate(360deg)}}

  main{display:flex;flex:1;overflow:hidden}
  .list-pane{width:380px;min-width:280px;max-width:50%;border-right:1px solid var(--border);
    display:flex;flex-direction:column;background:var(--panel)}
  .searchbar{padding:10px;border-bottom:1px solid var(--border);display:flex;gap:8px;align-items:center}
  .searchbar input{flex:1;border:1px solid var(--border);border-radius:8px;padding:8px 10px;font-size:14px;outline:none}
  .searchbar input:focus{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
  .list{flex:1;overflow-y:auto}
  .row{padding:9px 12px;border-bottom:1px solid #eef1f5;cursor:pointer}
  .row:hover{background:var(--hover)}
  .row.sel{background:var(--accent-soft);border-left:3px solid var(--accent);padding-left:9px}
  .row .code{font-family:"Consolas",monospace;color:var(--accent);font-weight:600;font-size:12px}
  .row .name{font-weight:600;margin:1px 0}
  .row .sub{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

  .detail-pane{flex:1;overflow-y:auto;padding:0;background:var(--bg)}
  .detail-head{position:sticky;top:0;background:var(--panel);border-bottom:1px solid var(--border);
    padding:14px 20px;z-index:5}
  .detail-head .dcode{font-family:"Consolas",monospace;color:var(--accent);font-weight:700;font-size:13px}
  .detail-head .dname{font-size:20px;font-weight:700;margin:2px 0}
  .detail-head .dname2{color:var(--muted);font-size:14px}
  .detail-tools{display:flex;gap:12px;align-items:center;margin-top:10px;flex-wrap:wrap}
  .detail-tools input{border:1px solid var(--border);border-radius:8px;padding:6px 10px;font-size:13px;width:200px;outline:none}
  .seg{display:inline-flex;border:1px solid var(--border);border-radius:8px;overflow:hidden}
  .seg button{border:none;background:#fff;padding:6px 14px;font-size:12px;cursor:pointer;color:var(--muted)}
  .seg button.active{background:var(--accent);color:#fff;font-weight:700}
  .toggle{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);cursor:pointer;user-select:none}
  .detail-body{padding:16px 20px}
  .section{background:var(--panel);border:1px solid var(--border);border-radius:10px;
    padding:6px 16px 14px;margin-bottom:14px}
  .section-title{font-size:12px;font-weight:700;color:var(--accent);letter-spacing:.04em;
    margin:10px 0 8px;border-bottom:2px solid var(--accent-soft);padding-bottom:5px}
  .fields{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:2px 24px}
  .field{display:flex;gap:10px;padding:5px 0;border-bottom:1px dashed #eef1f5;align-items:baseline}
  .field .k{color:var(--muted);min-width:148px;flex-shrink:0;font-size:12.5px}
  .field .v{font-weight:600;word-break:break-word;flex:1}
  .field .v .cd{font-family:"Consolas",monospace;color:var(--code);font-weight:500;font-size:11px;margin-left:6px}
  .field.empty .v{color:#c2cad6;font-weight:400}
  .placeholder{color:var(--muted);text-align:center;margin-top:80px;font-size:14px}
  .tovas{background:#fff8ec;border:1px solid #f3e2bf;border-radius:10px;padding:6px 16px 14px;margin-bottom:14px}
  .tovas .section-title{color:var(--warn);border-color:#f3e2bf}
  .dropzone{margin:14px 20px;border:2px dashed var(--border);border-radius:12px;padding:24px;text-align:center;color:var(--muted)}
  .dropzone.drag{border-color:var(--accent);background:var(--accent-soft)}
  mark{background:#fde68a;border-radius:2px;padding:0 1px}
  a.maillink{color:var(--accent);text-decoration:none}
  a.maillink:hover{text-decoration:underline}
  @media (max-width:760px){
    main{flex-direction:column}
    .list-pane{width:100%;max-width:100%;height:45vh}
  }
</style>
</head>
<body>

<!-- ===== ログイン画面 ===== -->
<div id="loginScreen">
  <div class="login-card">
    <div class="logo">花</div>
    <h1>マスタビューワー</h1>
    <p>花岡車輌 業務アプリ ／ SMILEマスタ閲覧</p>
    <button id="loginBtn">Microsoft アカウントでサインイン</button>
    <div id="loginError"></div>
    <div class="login-foot">SharePoint「SharedMasters」のCSVを<br>読み取り専用で表示します（書き換え不可）</div>
  </div>
</div>

<!-- ===== アプリ本体 ===== -->
<div id="app">
  <header>
    <h1><span class="dot">M</span>マスタビューワー</h1>
    <div class="tabs" id="tabs"></div>
    <div class="grow"></div>
    <div class="userchip"><span class="avatar" id="userAvatar"></span><span id="userName"></span></div>

    <button class="btn" id="logoutBtn">サインアウト</button>
  </header>
  <div id="statusBar"><span id="statusText">準備中…</span></div>
  <main>
    <div class="list-pane">
      <div class="searchbar">
        <input id="search" type="search" placeholder="検索（コード・名称・住所・電話・メール等／全項目）" autocomplete="off">
      </div>
      <div class="list" id="list"></div>
    </div>
    <div class="detail-pane" id="detail">
      <div class="placeholder">左の一覧から選択してください</div>
    </div>
  </main>
</div>

<input type="file" id="fileInput" accept=".csv" multiple style="display:none">

    { title:"メモ・その他", fields:["備考メモ","支払条件追記","その他メモ1","その他メモ2","その他メモ3","その他メモ4","直Mailアドレス","直ﾕｰｻﾞｰ取引(〇・×)","でんさい利用者No","山善仕入先コード","継続性(諸口のみ)"] },

const store = {};
let current = null, selectedKey = null;
let msalInstance = null, account = null;
let viewMode = 'curated';   // 'curated' | 'raw'
let showEmpty = false, fieldFilter = "";

// ============================================================
// MSAL 認証
// ============================================================
async function init(){
  if(typeof msal === 'undefined'){ showLoginError('MSALライブラリを読み込めませんでした。再読み込みしてください。'); return; }
  msalInstance = new msal.PublicClientApplication(MSAL_CONFIG);
  await msalInstance.initialize();
  await msalInstance.handleRedirectPromise();
  const accts = msalInstance.getAllAccounts();
  if(accts.length){ account = accts[0]; showApp(); await loadAll(); }
  document.getElementById('loginBtn').onclick = login;
  document.getElementById('logoutBtn').onclick = logout;
  document.getElementById('reloadBtn').onclick = loadAll;
}
async function login(){
  try{
    hideLoginError();
    const res = await msalInstance.loginPopup({ scopes: SCOPES });
    account = res.account; showApp(); await loadAll();
  }catch(e){ showLoginError('サインインに失敗しました: ' + e.message); }
}
function logout(){
  msalInstance.logoutPopup({ account });
  document.getElementById('app').style.display='none';
  document.getElementById('loginScreen').style.display='flex';
}
async function getToken(){
  try{ const r=await msalInstance.acquireTokenSilent({scopes:SCOPES,account}); return r.accessToken; }
  catch{ const r=await msalInstance.acquireTokenPopup({scopes:SCOPES}); return r.accessToken; }
}
function showApp(){
  document.getElementById('loginScreen').style.display='none';
  document.getElementById('app').style.display='flex';
  const n=account.name||account.username;
  document.getElementById('userName').textContent=n;
  document.getElementById('userAvatar').textContent=(n||'?').charAt(0);
}
function showLoginError(m){ const e=document.getElementById('loginError'); e.textContent=m; e.style.display='block'; }
function hideLoginError(){ document.getElementById('loginError').style.display='none'; }
function setStatus(type,msg,spin){
  const b=document.getElementById('statusBar');
  b.className=type||'';
  document.getElementById('statusText').innerHTML=(spin?'<span class="spin"></span> ':'')+msg;
}

// ============================================================
// Graph: SharedMasters からファイル取得
// ============================================================
async function graphGet(url){
  const token=await getToken();
  const r=await fetch('https://graph.microsoft.com/v1.0'+url,{headers:{Authorization:'Bearer '+token}});
  if(!r.ok) throw new Error(`Graph ${r.status}: ${url}`);
  return r.json();
}
async function resolveDriveId(){
  if(driveId) return driveId;
  try{
    const data=await graphGet(`/sites/${SITE_ID}/drives?$select=id,name,webUrl&$top=100`);
    const drives=data.value||[];
    const hit=drives.find(d=>d.name==='SharedMasters')
            || drives.find(d=>/SharedMasters/i.test(d.name||''))
            || drives.find(d=>/SharedMasters/i.test(d.webUrl||''));
    if(hit){ driveId=hit.id; console.log('SharedMasters driveId:', driveId); return driveId; }
    console.warn('SharedMastersライブラリが見つかりません。利用可能なドライブ:', drives.map(d=>d.name));
  }catch(e){ console.warn('drive解決失敗、フォールバックID使用', e); }
  driveId=FALLBACK_DRIVE_ID;
  return driveId;
}
async function fetchCsvText(fname){
  const did=await resolveDriveId();
  const meta=await graphGet(`/drives/${did}/root:/${encodeURIComponent(fname)}`);
  const dl=meta['@microsoft.graph.downloadUrl'];
  if(!dl) throw new Error('downloadUrl が取得できません: '+fname);
  const r=await fetch(dl);
  if(!r.ok) throw new Error(`ファイル取得失敗 ${r.status}: ${fname}`);
  const buf=await r.arrayBuffer();
  return decodeCsv(buf);
}
function decodeCsv(buf){
  let text=new TextDecoder('utf-8').decode(buf);
  if(text.charCodeAt(0)===0xFEFF) text=text.slice(1);
  const bad=(text.match(/�/g)||[]).length;
  if(bad>5){
    try{ let s=new TextDecoder('shift_jis').decode(buf); if(s.charCodeAt(0)===0xFEFF)s=s.slice(1); return s; }catch(e){}
  }
  return text;
}
async function loadAll(){
  try{
    setStatus('loading','SharePoint（SharedMasters）から読み込み中…',true);
    await resolveDriveId();
    await Promise.all(ORDER.map(async key=>{
      try{ const t=await fetchCsvText(DATASETS[key].file); loadDataset(key,t); }
      catch(e){ console.warn(DATASETS[key].file,e); }
    }));
    if(ORDER.filter(k=>store[k]).length===0){
      setStatus('error','読み込めませんでした。下のボタンでCSVを手動選択もできます。');
      showDropPrompt(); return;
    }
    if(!current) current=ORDER.find(k=>store[k]);
    renderTabs(); renderList(); renderDetail();
    const parts=ORDER.filter(k=>store[k]).map(k=>`${DATASETS[k].label} ${store[k].rows.length.toLocaleString()}件`);
    setStatus('success','読み込み完了 — '+parts.join('　/　'));
  }catch(e){
    console.error(e); setStatus('error','エラー: '+e.message); showDropPrompt();
  }
}

// ============================================================
// CSV パース & 共通ロジック
// ============================================================
function normalize(s){ return (s||"").normalize("NFKC").toLowerCase(); }
function isBlankCode(v){ return v===""||/^0+$/.test(v); }
function zeroish(v){ return v!=="" && /^0+(\.0+)?$/.test(String(v).trim()); }
function esc(s){ return (s||"").replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c])); }

function parseCSV(text){
  if(text.charCodeAt(0)===0xFEFF) text=text.slice(1);
  const rows=[];let row=[],field="",i=0;const n=text.length;let inQ=false;
  while(i<n){const c=text[i];
    if(inQ){ if(c==='"'){ if(text[i+1]==='"'){field+='"';i+=2;continue;} inQ=false;i++;continue;} field+=c;i++;continue;}
    if(c==='"'){inQ=true;i++;continue;}
    if(c===','){row.push(field);field="";i++;continue;}
    if(c==='\r'){i++;continue;}
    if(c==='\n'){row.push(field);rows.push(row);row=[];field="";i++;continue;}
    field+=c;i++;
  }
  if(field!==""||row.length){row.push(field);rows.push(row);}
  return rows;
}
function buildFields(headers){
  const fields=[];let i=0;
  while(i<headers.length){
    const h=headers[i],nx=headers[i+1];let paired=false;
    if(nx){
      if(nx===h+"名") paired=true;
      else if(h.endsWith("ｺｰﾄﾞ")&&nx===h.slice(0,-3)+"名") paired=true;
      else if(h.endsWith("ｺｰﾄﾞ")&&nx===h.slice(0,-3)) paired=true;
    }
    if(paired){ fields.push({label:h.endsWith("ｺｰﾄﾞ")?h.slice(0,-3):h,codeIdx:i,nameIdx:i+1,pair:true}); i+=2; }
    else{ fields.push({label:h,idx:i,pair:false}); i++; }
  }
  return fields;
}
function fieldValue(f,row){
  if(f.pair){
    const code=row[f.codeIdx]||"",name=row[f.nameIdx]||"";
    const blank=name===""&&isBlankCode(code);
    return {blank,name,code,display:name!==""?name:(isBlankCode(code)?"":code)};
  }else{
    const v=row[f.idx]||"";
    return {blank:v==="",name:v,code:"",display:v};
  }
}
function loadDataset(key,text){
  const rows=parseCSV(text); if(!rows.length) return;
  const headers=rows[0];
  const data=rows.slice(1).filter(r=>r.length>1&&r.some(c=>c!==""));
  const cfg=DATASETS[key];
  const keyIdx=headers.indexOf(cfg.keyCol);
  const fields=buildFields(headers);
  // ヘッダ名→fieldの索引（重複ヘッダは先勝ち）＋正規化索引
  const fieldMap={}, fieldMapN={};
  fields.forEach(f=>{
    const keys=f.pair?[headers[f.nameIdx],f.label]:[headers[f.idx]];
    keys.forEach(k=>{ if(k && !(k in fieldMap)){ fieldMap[k]=f; const nk=normalize(k); if(!(nk in fieldMapN)) fieldMapN[nk]=f; } });
  });
  const byKey={};
  data.forEach(r=>{ r.__blob=normalize(r.join(" ")); if(keyIdx>=0) byKey[r[keyIdx]]=r; });
  store[key]={headers,rows:data,fields,fieldMap,fieldMapN,byKey,keyIdx};
}
function resolveHeader(ds,row,header){
  let f=ds.fieldMap[header]||ds.fieldMapN[normalize(header)];
  if(!f) return null;
  const v=fieldValue(f,row);
  return {f,label:f.label,blank:v.blank,name:v.name,code:v.code,display:v.display};
}

// ============================================================
// 一覧描画
// ============================================================
function renderTabs(){
  const el=document.getElementById("tabs"); el.innerHTML="";
  ORDER.forEach(key=>{
    if(!store[key]) return;
    const b=document.createElement("div");
    b.className="tab"+(key===current?" active":"");
    b.textContent=DATASETS[key].label;
    b.onclick=()=>{current=key;selectedKey=null;renderTabs();renderList();renderDetail();};
    el.appendChild(b);
  });
}
function highlight(text,q){
  if(!q) return esc(text);
  try{ const re=new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g,"\\$&"),"ig"); return esc(text).replace(re,m=>"<mark>"+esc(m)+"</mark>"); }
  catch(e){ return esc(text); }
}
function renderList(){
  const ds=store[current]; const listEl=document.getElementById("list");
  if(!ds){listEl.innerHTML="";return;}
  const cfg=DATASETS[current];
  const q=document.getElementById("search").value.trim(); const nq=normalize(q);
  const ki=ds.keyIdx, nameIdx=ds.headers.indexOf(cfg.nameCol);
  const subIdxs=cfg.subCols.map(c=>ds.headers.indexOf(c)).filter(i=>i>=0);
  const matched=nq?ds.rows.filter(r=>r.__blob.includes(nq)):ds.rows;
  const total=matched.length, CAP=800, shown=matched.slice(0,CAP);
  const frag=document.createElement("div");
  shown.forEach(r=>{
    const div=document.createElement("div");
    div.className="row"+(r[ki]===selectedKey?" sel":"");
    const sub=subIdxs.map(i=>r[i]).filter(v=>v).join("　");
    div.innerHTML=`<div class="code">${highlight(r[ki]||"",q)}</div>
      <div class="name">${highlight(nameIdx>=0?(r[nameIdx]||""):"",q)}</div>
      <div class="sub">${highlight(sub,q)}</div>`;
    div.onclick=()=>{selectedKey=r[ki];renderList();renderDetail();};
    frag.appendChild(div);
  });
  listEl.innerHTML=""; listEl.appendChild(frag);
  if(total>CAP){
    const more=document.createElement("div");
    more.style.cssText="padding:10px;text-align:center;color:var(--muted);font-size:12px";
    more.textContent=`${total.toLocaleString()}件中 ${CAP}件を表示（検索で絞り込んでください）`;
    listEl.appendChild(more);
  }
}

// ============================================================
// 詳細描画
// ============================================================
function fieldEl(r){
  const d=document.createElement("div"); d.className="field"+(r.blank?" empty":"");
  let vhtml;
  if(r.blank){ vhtml="（未設定）"; }
  else{
    const disp=esc(r.display);
    const isMail=/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(r.display);
    vhtml=isMail?`<a class="maillink" href="mailto:${disp}">${disp}</a>`:disp;
    if(r.f&&r.f.pair&&r.name!==""&&!isBlankCode(r.code)&&r.code!==r.name) vhtml+=`<span class="cd">${esc(r.code)}</span>`;
  }
  d.innerHTML=`<span class="k">${esc(r.label)}</span><span class="v">${vhtml}</span>`;
  return d;
}
function passFilter(r,ff){ return !ff || normalize(r.label).includes(ff) || normalize(r.display).includes(ff); }

function buildTovasBlock(body){
  const cfg=DATASETS[current];
  if(!(cfg.linkTovas&&store.tovas)) return;
  const ds=store.tovas, tRow=ds.byKey[selectedKey]; if(!tRow) return;
  const ff=normalize(fieldFilter);
  const rows=[];
  ds.fields.forEach(f=>{
    const v=fieldValue(f,tRow); if(v.blank||zeroish(v.display)) return;
    const r={f,label:f.label,...v}; if(passFilter(r,ff)) rows.push(r);
  });
  if(!rows.length) return;
  const box=document.createElement("div"); box.className="tovas";
  const t=document.createElement("div"); t.className="section-title"; t.textContent="TOVAS 請求書送付設定"; box.appendChild(t);
  const grid=document.createElement("div"); grid.className="fields";
  rows.forEach(r=>grid.appendChild(fieldEl(r)));
  box.appendChild(grid); body.appendChild(box);
}
function buildCurated(body){
  const ds=store[current], row=ds.byKey[selectedKey], ff=normalize(fieldFilter);
  (SECTIONS[current]||[]).forEach(sec=>{
    const rows=[];
    sec.fields.forEach(h=>{
      const r=resolveHeader(ds,row,h);
      if(!r||r.blank||zeroish(r.display)) return;
      if(!passFilter(r,ff)) return;
      rows.push(r);
    });
    if(!rows.length) return;
    const card=document.createElement("div"); card.className="section";
    const t=document.createElement("div"); t.className="section-title"; t.textContent=sec.title; card.appendChild(t);
    const grid=document.createElement("div"); grid.className="fields";
    rows.forEach(r=>grid.appendChild(fieldEl(r)));
    card.appendChild(grid); body.appendChild(card);
  });
}
function buildRaw(body){
  const ds=store[current], row=ds.byKey[selectedKey], ff=normalize(fieldFilter);
  const card=document.createElement("div"); card.className="section";
  const t=document.createElement("div"); t.className="section-title";
  t.textContent="全項目（CSVそのまま）"+(showEmpty?"・空欄含む":"・設定済のみ"); card.appendChild(t);
  const grid=document.createElement("div"); grid.className="fields"; let cnt=0;
  ds.fields.forEach(f=>{
    const v=fieldValue(f,row);
    if(v.blank&&!showEmpty) return;
    const r={f,label:f.label,...v};
    if(!passFilter(r,ff)) return;
    grid.appendChild(fieldEl(r)); cnt++;
  });
  card.appendChild(grid); body.appendChild(card);
  if(cnt===0){ const p=document.createElement("div"); p.className="placeholder"; p.style.marginTop="20px"; p.textContent="該当する項目がありません"; body.appendChild(p); }
}
function buildDetailBody(){
  const body=document.createElement("div"); body.className="detail-body";
  buildTovasBlock(body);
  if(viewMode==='curated') buildCurated(body); else buildRaw(body);
  if(viewMode==='curated' && !body.querySelector('.section') && !body.querySelector('.tovas')){
    const p=document.createElement("div"); p.className="placeholder"; p.style.marginTop="20px";
    p.innerHTML='設定済みの項目がありません。<br>「全項目」表示で確認できます。'; body.appendChild(p);
  }
  return body;
}
function renderDetail(){
  const det=document.getElementById("detail");
  const ds=store[current];
  if(!ds||!selectedKey){ det.innerHTML=`<div class="placeholder">左の一覧から選択してください</div>`; return; }
  const cfg=DATASETS[current], row=ds.byKey[selectedKey];
  if(!row){ det.innerHTML=`<div class="placeholder">データが見つかりません</div>`; return; }
  const nameIdx=ds.headers.indexOf(cfg.nameCol);
  const name2Idx=cfg.name2Col?ds.headers.indexOf(cfg.name2Col):-1;
  const name=nameIdx>=0?row[nameIdx]:"", name2=name2Idx>=0?(row[name2Idx]||""):"";
  det.innerHTML="";
  const head=document.createElement("div"); head.className="detail-head";
  head.innerHTML=`<div class="dcode">${esc(selectedKey)}</div>
    <div class="dname">${esc(name)}</div>
    ${name2?`<div class="dname2">${esc(name2)}</div>`:""}
    <div class="detail-tools">
      <div class="seg">
        <button data-mode="curated" class="${viewMode==='curated'?'active':''}">整理表示</button>
        <button data-mode="raw" class="${viewMode==='raw'?'active':''}">全項目</button>
      </div>
      <label class="toggle" id="emptyWrap" style="${viewMode==='raw'?'':'display:none'}"><input type="checkbox" id="emptyToggle" ${showEmpty?"checked":""}> 空欄も表示</label>
      <input type="search" id="fieldFilter" placeholder="項目名・値で絞り込み" value="${esc(fieldFilter)}">
    </div>`;
  det.appendChild(head);
  det.appendChild(buildDetailBody());
  head.querySelectorAll('.seg button').forEach(b=>b.onclick=()=>{ viewMode=b.dataset.mode; renderDetail(); });
  const et=document.getElementById("emptyToggle"); if(et) et.onchange=e=>{showEmpty=e.target.checked;renderDetail();};
  document.getElementById("fieldFilter").oninput=e=>{
    fieldFilter=e.target.value; const sc=det.scrollTop;
    const old=det.querySelector(".detail-body"); old.replaceWith(buildDetailBody()); det.scrollTop=sc;
  };
}

// ---- 検索入力 ----
let searchTimer=null;
document.getElementById("search").addEventListener("input",()=>{ clearTimeout(searchTimer); searchTimer=setTimeout(renderList,120); });

// ============================================================
// 手動CSV読込（localhost開発・Graph失敗時のフォールバック）
// ※ファイルはブラウザ内で読むだけ。どこにもアップロードされません。
// ============================================================
const fileInput=document.getElementById("fileInput");
fileInput.onchange=async e=>{ await handleFiles(e.target.files); };
async function handleFiles(files){
  for(const file of files){
    const key=matchFileToKey(file.name); if(!key) continue;
    loadDataset(key, await file.text());
  }
  if(!current) current=ORDER.find(k=>store[k]);
  if(current){ renderTabs(); renderList(); renderDetail();
    const parts=ORDER.filter(k=>store[k]).map(k=>`${DATASETS[k].label} ${store[k].rows.length.toLocaleString()}件`);
    setStatus('success','読み込み完了（手動）— '+parts.join('　/　')); }
}
function matchFileToKey(fname){
  const n=fname.replace(/\.csv$/i,"");
  for(const key of ORDER){ const base=DATASETS[key].file.replace(/\.csv$/i,""); if(n===base||n.includes(base)||base.includes(n)) return key; }
  if(/TOVAS/i.test(fname)) return "tovas";
  if(/仕入/.test(fname)) return "supplier";
  if(/得意先/.test(fname)) return "customer";
  return null;
}
document.addEventListener("dragover",e=>e.preventDefault());
document.addEventListener("drop",async e=>{ e.preventDefault(); const dz=document.querySelector(".dropzone"); if(dz)dz.classList.remove("drag"); if(e.dataTransfer.files.length) await handleFiles(e.dataTransfer.files); });
function showDropPrompt(){
  document.getElementById("detail").innerHTML=`
    <div class="dropzone" id="dz">
      <p style="font-size:15px;color:var(--text);font-weight:600;margin:0 0 6px">CSVを手動で読み込む</p>
      <p style="margin:0 0 14px">SharePointから自動取得できない場合（localhost等）は、<br>下のボタンかドラッグ&ドロップでCSVを選択してください。</p>
      <button style="cursor:pointer;border:1px solid var(--border);background:#fff;border-radius:8px;padding:8px 16px;font-size:13px" onclick="document.getElementById('fileInput').click()">CSVを選択（複数可）</button>
      <p style="margin:14px 0 0;font-size:12px">対象: 得意先マスタ.csv / 仕入先マスタ.csv / TOVAS得意先別請求明細書情報.csv</p>
    </div>`;
  const dz=document.getElementById("dz");
  dz.addEventListener("dragover",()=>dz.classList.add("drag"));
  dz.addEventListener("dragleave",()=>dz.classList.remove("drag"));
}

// ---- 起動 ----
init();
</script>

<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>社内ワークフロー | 花岡車輌</title>
<script src="https://cdn.jsdelivr.net/npm/@azure/msal-browser@3.10.0/lib/msal-browser.min.js" integrity="sha384-yXVL3cgcbuPa1TOmTYdr5MVOeFWnnXoYXcSIPBJ4lrnGHn8EZrbyurhG/xZMygBB" crossorigin="anonymous"></script>
<script src="wf-engine.js"></script>
<style>
:root{--pri:#1a5fa8;--pri-l:#e3edf9;--bg:#f4f6f9;--line:#dde2ec;--txt:#1e2533;--sub:#6b7a99;--ok:#1e8449;--ok-l:#e3f4e8;--warn:#a0520c;--warn-l:#fdf0e1;--ng:#c0392b;--ng-l:#fbe7e5}
*{box-sizing:border-box}
body{margin:0;font-family:"Segoe UI","Meiryo","Hiragino Sans",sans-serif;background:var(--bg);color:var(--txt);font-size:14px}
button{font-family:inherit;font-size:13px;cursor:pointer;border-radius:6px;border:1px solid var(--line);background:#fff;padding:6px 14px}
button.pri{background:var(--pri);border-color:var(--pri);color:#fff}
button.warn{background:#fff;border-color:var(--warn);color:var(--warn)}
button.ng{background:#fff;border-color:var(--ng);color:var(--ng)}
button:disabled{opacity:.5;cursor:default}
input,select,textarea{font-family:inherit;font-size:14px;padding:6px 8px;border:1px solid #c9d1de;border-radius:5px;background:#fff;width:100%}
textarea{min-height:70px;resize:vertical}
/* ログイン */
#loginScreen{display:flex;height:100vh;align-items:center;justify-content:center}
.login-card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:32px 40px;text-align:center;box-shadow:0 2px 10px rgba(0,0,0,.06)}
.login-card h1{font-size:20px;margin:0 0 6px}.login-card p{color:var(--sub);margin:0 0 20px}
#loginError{display:none;color:var(--ng);margin-top:12px}
/* アプリ */
#app{display:none;flex-direction:column;height:100vh}
header{display:flex;align-items:center;gap:12px;background:#fff;border-bottom:1px solid var(--line);padding:8px 16px}
header h1{font-size:16px;margin:0;color:var(--pri)}
header .sp{flex:1}
#devBar{display:none;background:#fff8d9;border-bottom:1px solid #eadb99;padding:5px 16px;font-size:12px;gap:8px;align-items:center}
#devBar select{width:auto;font-size:12px;padding:2px 4px}
#notice{display:none;background:var(--warn-l);color:var(--warn);padding:6px 16px;font-size:13px}
nav#tabs{display:flex;gap:2px;background:#fff;border-bottom:1px solid var(--line);padding:0 10px;overflow-x:auto}
nav#tabs a{padding:10px 14px;color:#48505a;text-decoration:none;border-bottom:3px solid transparent;white-space:nowrap;cursor:pointer}
nav#tabs a.active{color:var(--pri);font-weight:700;border-bottom-color:var(--pri)}
nav#tabs .cnt{display:inline-block;min-width:18px;padding:0 5px;margin-left:5px;border-radius:9px;background:var(--ng);color:#fff;font-size:11px;text-align:center}
nav#tabs .cnt.zero{background:#c9d1de}
#statusBar{padding:4px 16px;font-size:12px;color:var(--sub);min-height:22px}
#statusBar.err{color:var(--ng)}#statusBar.busy{color:var(--pri)}
#toasts{position:fixed;right:16px;bottom:16px;z-index:100;display:flex;flex-direction:column;gap:8px;max-width:420px}
.toast{background:#1e2533;color:#fff;padding:10px 14px;border-radius:8px;box-shadow:0 4px 14px rgba(0,0,0,.2);font-size:13px;animation:tin .2s ease-out}
.toast.err{background:var(--ng)}
@keyframes tin{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}
main{flex:1;overflow:hidden;display:flex}
.list{width:380px;min-width:300px;border-right:1px solid var(--line);overflow:auto;background:#fff}
.detail{flex:1;overflow:auto;padding:16px 22px}
.list{display:flex;flex-direction:column}
.filters{position:sticky;top:0;z-index:5;background:#f7f9fc;border-bottom:1px solid var(--line);padding:8px 10px;display:grid;grid-template-columns:1fr 1fr;gap:6px}
.filters input,.filters select{font-size:12.5px;padding:4px 6px}
.filters .q{grid-column:1 / -1}
.filters .foot{grid-column:1 / -1;display:flex;align-items:center;gap:8px;font-size:12px;color:var(--sub)}
.filters .foot button{font-size:12px;padding:3px 10px}
.filters .foot .sp{flex:1}
.rows{flex:1}
.row{padding:10px 14px;border-bottom:1px solid #eef1f6;cursor:pointer}
.row:hover{background:#f7f9fc}.row.sel{background:var(--pri-l)}
.row .t{font-weight:600;margin-bottom:3px}.row .m{font-size:12px;color:var(--sub)}
.empty{padding:30px;color:var(--sub);text-align:center}
.badge{display:inline-block;padding:1px 8px;border-radius:10px;font-size:12px;margin-right:4px;white-space:nowrap}
.b-run{background:var(--pri-l);color:var(--pri)}.b-ok{background:var(--ok-l);color:var(--ok)}
.b-warn{background:var(--warn-l);color:var(--warn)}.b-ng{background:var(--ng-l);color:var(--ng)}.b-gray{background:#eef1f6;color:var(--sub)}
.card{background:#fff;border:1px solid var(--line);border-radius:8px;padding:14px 18px;margin-bottom:14px}
.card h3{margin:0 0 10px;font-size:14px;color:var(--sub);font-weight:600}
h2{font-size:18px;margin:0 0 6px}
.kv{display:grid;grid-template-columns:170px 1fr;gap:6px 14px}
.kv .k{color:var(--sub)}.kv .v{white-space:pre-wrap;word-break:break-word}
.kv .v.changed{background:#fff3b0;border-radius:3px;padding:0 4px}
.kv .v .was{display:block;color:var(--sub);font-size:12px;text-decoration:line-through}
.return-banner{border:1px solid var(--warn);border-left:5px solid var(--warn);background:var(--warn-l);border-radius:6px;padding:10px 14px;margin-bottom:14px}
.return-banner b{color:var(--warn)}
.route{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.route .st{border:1px solid var(--line);border-radius:6px;padding:4px 10px;background:#fff;font-size:13px}
.route .st small{display:block;color:var(--sub);font-size:11px}
.route .st.done{background:var(--ok-l);border-color:#b5dfc1}.route .st.cur{background:var(--pri-l);border-color:var(--pri);font-weight:600}
.route .st.skip{opacity:.45;text-decoration:line-through}.route .st.kessai{border-color:var(--warn)}
.route .ar{color:#aab}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.hist div{padding:4px 0;border-bottom:1px dashed #eef1f6;font-size:13px}
/* 新規申請 */
.catalog{padding:20px;overflow:auto;flex:1}
.catalog h3{font-size:14px;color:var(--sub);margin:16px 0 8px}
.forms{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.fcard{background:#fff;border:1px solid var(--line);border-radius:8px;padding:12px 14px;cursor:pointer}
.fcard:hover{border-color:var(--pri)}.fcard .n{font-weight:600}.fcard .d{font-size:12px;color:var(--sub);margin-top:4px}
.editor{display:flex;flex:1;overflow:hidden}
.editor .form{flex:1;overflow:auto;padding:18px 24px}
.editor .side{width:340px;border-left:1px solid var(--line);background:#fff;overflow:auto;padding:16px}
.fld{margin-bottom:14px}.fld label.l{display:block;font-weight:600;margin-bottom:4px}
.fld .req{color:var(--ng);margin-left:4px;font-size:12px}
.fld .opts label{display:inline-flex;align-items:center;gap:4px;margin:2px 14px 2px 0;font-weight:normal}
.fld .opts input{width:auto}
.fld.err input,.fld.err textarea,.fld.err select{border-color:var(--ng)}
.desc{white-space:pre-wrap;background:#f7f9fc;border:1px solid var(--line);border-radius:6px;padding:10px 12px;color:#445;font-size:13px;margin-bottom:16px}
table.tbl{border-collapse:collapse;width:100%}table.tbl td,table.tbl th{border:1px solid var(--line);padding:3px}
table.tbl th{background:#f3f6fa;font-weight:600;font-size:12px}
.muted{color:var(--sub);font-size:12px}
.proute div{padding:6px 8px;border-left:3px solid var(--pri);margin-bottom:6px;background:#f7f9fc;font-size:13px}
.proute div.skip{border-left-color:#ccc;color:#999}
.proute div.kessai{border-left-color:var(--warn)}
.errbox{background:var(--ng-l);color:var(--ng);padding:8px 10px;border-radius:6px;font-size:13px;margin-bottom:10px}
@media (max-width:800px){main{flex-direction:column}.list{width:100%;max-height:40vh}.editor{flex-direction:column}.editor .side{width:100%}.kv{grid-template-columns:1fr}}
</style>
</head>
<body>

<div id="loginScreen">
  <div class="login-card">
    <h1>社内ワークフロー</h1>
    <p>花岡車輌の Microsoft 365 アカウントでサインインしてください</p>
    <button class="pri" id="loginBtn">サインイン</button>
    <div id="loginError"></div>
  </div>
</div>

<div id="app">
  <header>
    <h1 id="appTitle">社内ワークフロー</h1>
    <span class="sp"></span>
    <span id="userName"></span>
    <button id="reloadBtn" title="最新の状態を読み込む">↻ 更新</button>
    <button id="logoutBtn">サインアウト</button>
  </header>
  <div id="devBar">🛠 開発モード（テストデータ・この画面の中だけで動作）　操作する人：<select id="devAs"></select>
    <span class="muted" id="devNotice"></span></div>
  <div id="notice"></div>
  <nav id="tabs"></nav>
  <div id="statusBar"></div>
  <main id="main"></main>
</div>
<div id="toasts"></div>

<script>
'use strict';
/* ============================================================
   接続設定
   ここに書くのは、他の業務アプリと同じ「公開してよい識別子」だけ。
   人・経路・選択肢・文面などの業務データは、すべて SharePoint（WF_*）から読む。
   見られるかどうかは SharePoint の権限がそのまま効く。
   この画面に「誰が何を見てよいか」の判定は書かない（判定のバグがそのまま漏洩になるため）。
   ============================================================ */
const MSAL_CONFIG = {
  auth: {
    clientId: 'd338d61b-01dc-4c7c-ac6b-aecf7f30d716',
    authority: 'https://login.microsoftonline.com/3933e8a0-c945-4e97-ae67-c82131087cad',
    redirectUri: new URL('auth.html', window.location.href).href,   // 全アプリ共通の受け口
  },
  cache: { cacheLocation: 'sessionStorage' }
};
const SCOPES = ['User.Read', 'Sites.ReadWrite.All'];
const SITE_PATH = 'hanaokacorp.sharepoint.com:/sites/msteams_7aab51:';

/* 開発モード: localhost で ?dev を付けたときだけ。テストデータとフローの再現で動く */
const DEV = ['localhost', '127.0.0.1'].includes(location.hostname) && new URLSearchParams(location.search).has('dev');

/* ============================================================
   共通
   ============================================================ */
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const lc = s => String(s || '').toLowerCase();
const pj = (v, d) => { if (v == null || v === '') return d; if (typeof v === 'object') return v; try { return JSON.parse(v); } catch { return d; } };
const fmtDT = s => { if (!s) return ''; const d = new Date(s); return `${d.getMonth() + 1}/${d.getDate()} ${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`; };
const yen = n => (n == null || n === '' || isNaN(n)) ? '' : Number(n).toLocaleString('ja-JP') + '円';
function status(text, kind) { const b = $('statusBar'); b.className = kind || ''; b.textContent = text || ''; }

/* ============================================================
   状態
   ============================================================ */
const st = {
  me: null,                 // {upn, name, org}
  M: null,                  // マスタ {org, orgByUpn, roles, settings, forms, workflows}
  tasks: [], myReqs: [], allReqs: null,
  view: 'inbox', sel: null, editor: null
};
const nameOf = upn => (st.M.orgByUpn[lc(upn)] || {}).Title || upn;

/* ============================================================
   データの読み書き（本番＝Graph／開発＝テストデータ）
   ============================================================ */
let msalInstance = null, account = null, siteId = null;

async function getToken() {
  try { return (await msalInstance.acquireTokenSilent({ scopes: SCOPES, account })).accessToken; }
  catch { return (await msalInstance.acquireTokenPopup({ scopes: SCOPES })).accessToken; }
}
async function graph(path, opt = {}) {
  const tk = await getToken();
  const r = await fetch('https://graph.microsoft.com/v1.0' + path, { ...opt,
    headers: { Authorization: 'Bearer ' + tk, 'Content-Type': 'application/json',
      Prefer: 'HonorNonIndexedQueriesWarningMayFailRandomly', ...(opt.headers || {}) } });
  if (!r.ok) {
    let detail = ''; try { detail = (await r.json()).error?.message || ''; } catch {}
    const e = new Error(`${r.status}${detail ? ' / ' + detail : ''}`); e.status = r.status; throw e;
  }
  return r.status === 204 ? null : r.json();
}
async function graphAll(path) {
  let out = [], p = path;
  while (p) { const j = await graph(p); out = out.concat(j.value || []); p = j['@odata.nextLink'] ? j['@odata.nextLink'].replace('https://graph.microsoft.com/v1.0', '') : null; }
  return out;
}

const GraphApi = {
  async me() {
    const m = await graph('/me?$select=displayName,userPrincipalName');
    return { upn: lc(m.userPrincipalName), name: m.displayName };
  },
  async items(list, filter) {
    if (!siteId) siteId = (await graph(`/sites/${SITE_PATH}`)).id;
    const q = `/sites/${siteId}/lists/${list}/items?expand=fields&$top=999` + (filter ? `&$filter=${encodeURIComponent(filter)}` : '');
    return (await graphAll(q)).map(i => ({ id: Number(i.id), ...i.fields }));
  },
  async masters() {
    const [org, roles, settings, forms, workflows] = await Promise.all(
      ['WF_Org', 'WF_Role', 'WF_Setting', 'WF_Form', 'WF_Workflow'].map(l => this.items(l)));
    return { org, roles, settings, forms, workflows };
  },
  tasks(upn)      { return this.items('WF_Task', `fields/AssigneeUPN eq '${upn}'`); },
  myRequests(upn) { return this.items('WF_Request', `fields/ApplicantUPN eq '${upn}'`); },
  allRequests()   { return this.items('WF_Request'); },   // SharePoint が見られる分だけ返す
  async postAction(fields) {
    if (!siteId) siteId = (await graph(`/sites/${SITE_PATH}`)).id;
    const it = await graph(`/sites/${siteId}/lists/WF_Action/items`, { method: 'POST', body: JSON.stringify({ fields: { Result: '受付', ...fields } }) });
    // フローAを直接呼ぶ。伝えるのは行の番号だけ（中身と操作者はフローが SharePoint から読み直す）。
    // URL は WF_Setting にある（公開HTMLには書かない）。呼び出しに失敗しても WF_滞留チェック が数分以内に拾う
    const kick = st.M.settings['flow.urlA'];
    if (kick) fetch(kick, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'text/plain' }, body: JSON.stringify({ id: Number(it.id) }) }).catch(() => {});
    return { id: Number(it.id) };   // 結果は actionResult() で後から確認する（画面は待たせない）
  },
  async actionResult(id) {
    const f = (await graph(`/sites/${siteId}/lists/WF_Action/items/${id}?expand=fields`)).fields;
    return { Result: f.Result, ResultMessage: f.ResultMessage, RequestNo: f.RequestNo };
  }
};

const DevApi = {
  asUpn: null,
  async me() { const p = st.M ? st.M.orgByUpn[this.asUpn] : null; return { upn: this.asUpn, name: p ? p.Title : this.asUpn }; },
  async masters() {
    const D = window.DEV_DATA;
    return { org: D.org, roles: D.roles, workflows: D.workflows,
      settings: [{ Title: 'app.title', Value: '社内ワークフロー（開発）' }, { Title: 'app.categories', Value: '["経費・支払","稟議","取引先","人事・勤怠"]' }],
      forms: D.forms.map(f => ({ ...f, Active: true })) };
  },
  async tasks(upn)      { return MockFlow.S.tasks.filter(t => lc(t.AssigneeUPN) === upn).map(t => ({ ...t })); },
  async myRequests(upn) { return MockFlow.S.requests.filter(r => lc(r.ApplicantUPN) === upn).map(r => ({ ...r })); },
  async allRequests()   { return MockFlow.S.requests.map(r => ({ ...r })); },
  results: {}, seq: 0,
  async postAction(fields) {
    const id = ++this.seq, asUpn = this.asUpn;
    // 本番と同じく、結果は少し遅れて確定する
    setTimeout(() => {
      this.results[id] = MockFlow.processAction(fields, asUpn);
      const n = MockFlow.S.notices.slice(-3).map(x => `→${nameOf(x.to)}：${x.text}`).join('　');
      $('devNotice').textContent = n ? 'Teams通知（再現）' + n : '';
    }, 1500);
    return { id };
  },
  async actionResult(id) { return this.results[id] || { Result: '受付' }; }
};
const api = DEV ? DevApi : GraphApi;

/* ============================================================
   起動
   ============================================================ */
async function init() {
  $('reloadBtn').onclick = () => load();
  if (DEV) return startDev();
  if (typeof msal === 'undefined') { loginError('認証ライブラリを読み込めませんでした。ページを再読み込みしてください。'); return; }
  msalInstance = new msal.PublicClientApplication(MSAL_CONFIG);
  await msalInstance.initialize();
  await msalInstance.handleRedirectPromise();
  const accs = msalInstance.getAllAccounts();
  if (accs.length) { account = accs[0]; await start(); }
  $('loginBtn').onclick = login;
  $('logoutBtn').onclick = () => { msalInstance.logoutPopup({ account }); $('app').style.display = 'none'; $('loginScreen').style.display = 'flex'; };
}
function loginError(msg) { const e = $('loginError'); e.textContent = msg; e.style.display = 'block'; }
async function login() {
  try { $('loginError').style.display = 'none'; const r = await msalInstance.loginPopup({ scopes: SCOPES }); account = r.account; await start(); }
  catch (e) { loginError('サインインに失敗しました: ' + e.message); }
}
async function startDev() {
  await Promise.all(['dev/dev-data.js', 'dev/mock-flow.js'].map(src => new Promise((ok, ng) => {
    const s = document.createElement('script'); s.src = src; s.onload = ok; s.onerror = () => ng(new Error(src)); document.head.appendChild(s); })));
  const D = window.DEV_DATA;
  $('devBar').style.display = 'flex';
  $('devAs').innerHTML = D.org.map(p => `<option value="${esc(lc(p.UPN))}">${esc(p.Title)}（${esc(p.Dept)}）</option>`).join('');
  const first = D.org.find(p => p.Tier === '一般') || D.org[0];   // 公開ファイルに個人名を書かない
  DevApi.asUpn = lc(first.UPN); $('devAs').value = DevApi.asUpn;
  $('devAs').onchange = () => { DevApi.asUpn = $('devAs').value; st.sel = null; st.editor = null; load(); };
  $('logoutBtn').style.display = 'none';
  await start();
}
async function start() {
  $('loginScreen').style.display = 'none';
  $('app').style.display = 'flex';
  await load();
  startAutoRefresh();
}

/* 自動更新
   ・操作のあと、次の段の起票（Power Automate の2本目のフロー）は1分ほど遅れて動く。
     そのため操作直後の読み込みでは TODO や次の承認者が出ない。約75秒後にもう一度読み込む
   ・開いている間は1分ごとに読み込む（他の人の承認結果も反映される）
   ・申請の入力中・処理の送信中・画面が裏にあるときは読み込まない */
let busy = false, followUpTimer = null;
function canAutoRefresh() {
  const typing = ['INPUT', 'TEXTAREA', 'SELECT'].includes((document.activeElement || {}).tagName)
              || [...document.querySelectorAll('#detail textarea')].some(t => t.value.trim());   // 書きかけのコメントを消さない
  return !busy && !st.editor && !typing && document.visibilityState === 'visible';
}
function startAutoRefresh() {
  setInterval(() => { if (canAutoRefresh()) load(true); }, 60000);
  document.addEventListener('visibilitychange', () => { if (canAutoRefresh()) load(true); });
}
function scheduleFollowUp() {
  // 次の段の起票（フローB）は通常30秒前後で終わる。念のため90秒後にもう一度
  clearTimeout(followUpTimer);
  followUpTimer = setTimeout(() => {
    if (canAutoRefresh()) load(true);
    followUpTimer = setTimeout(() => { if (canAutoRefresh()) load(true); }, 60000);
  }, 30000);
}

async function load(quiet) {
  try {
    if (!quiet) status('読み込み中…', 'busy');
    if (!st.M) {
      const m = await api.masters();
      m.org = m.org.filter(p => p.Active !== false);
      m.orgByUpn = Object.fromEntries(m.org.map(p => [lc(p.UPN), p]));
      m.settings = Object.fromEntries(m.settings.map(s => [s.Title, s.Value]));
      m.forms = m.forms.map(f => ({ ...f, fields: pj(f.FieldsJson, []) })).sort((a, b) => (a.Sort || 0) - (b.Sort || 0));
      st.M = m;
      $('appTitle').textContent = m.settings['app.title'] || '社内ワークフロー';
      document.title = ($('appTitle').textContent) + ' | 花岡車輌';
      if (m.settings['app.notice']) { $('notice').textContent = m.settings['app.notice']; $('notice').style.display = 'block'; }
    }
    st.me = await api.me();
    st.me.org = st.M.orgByUpn[st.me.upn] || null;
    $('userName').textContent = st.me.name;
    const [tasks, myReqs] = await Promise.all([api.tasks(st.me.upn), api.myRequests(st.me.upn)]);
    st.tasks = tasks; st.myReqs = myReqs;
    st.allReqs = hasAllView() ? await api.allRequests() : null;
    status(`更新 ${fmtDT(new Date())}` + (st.me.org ? '' : '　※組織マスタに登録がないため、申請はできません（総務にご連絡ください）'), st.me.org ? '' : 'err');
    openDeepLink();
    render();
  } catch (e) {
    status('読み込みに失敗しました: ' + e.message, 'err');
    console.error(e);
  }
}
/* Teams通知のリンク（?req=申請番号）から開いたとき、その申請を選んだ状態にする（最初の1回だけ） */
let deepLinkDone = false;
function openDeepLink() {
  if (deepLinkDone) return; deepLinkDone = true;
  const no = new URLSearchParams(location.search).get('req'); if (!no) return;
  const pick = (view, pred) => { const t = st.tasks.filter(pred).sort((a, b) => b.id - a.id)[0]; if (t) { st.view = view; st.sel = 't' + t.id; return true; } };
  if (pick('inbox', t => t.RequestNo === no && isInbox(t))) return;
  if (pick('todo', t => t.RequestNo === no && t.StepType === '後処理' && t.Status === '処理待ち')) return;
  if (pick('circ', t => t.RequestNo === no && t.StepType === '回覧')) return;
  if (st.myReqs.some(r => r.RequestNo === no)) { st.view = 'mine'; st.sel = 'r' + no; return; }
  if (pick('involved', t => t.RequestNo === no)) return;
}
/* 「すべての申請」タブを出すかどうか（表示の切り替えだけ。実際に見えるかは SharePoint が決める） */
function hasAllView() {
  return st.M.roles.some(r => r.Kind === '閲覧権限' && r.Active !== false && (r.MemberUPNs || '').toLowerCase().split(';').includes(st.me.upn));
}

/* ============================================================
   タブ
   ============================================================ */
const TABS = [
  { key: 'new',      label: '新規申請' },
  { key: 'inbox',    label: '承認待ち', count: () => st.tasks.filter(isInbox).length },
  { key: 'todo',     label: 'TODO',     count: () => st.tasks.filter(t => t.StepType === '後処理' && t.Status === '処理待ち' && !hiddenTasks.has(t.id)).length },
  { key: 'circ',     label: '回覧',     count: () => st.tasks.filter(t => t.StepType === '回覧' && t.Status === '未読').length },
  { key: 'mine',     label: '自分の申請' },
  { key: 'involved', label: '関わった申請' },
  { key: 'all',      label: 'すべての申請', show: () => st.allReqs != null },
];
const isInbox = t => ['承認', '決裁', '作業'].includes(t.StepType) && t.Status === '処理待ち' && !hiddenTasks.has(t.id);

function render() {
  $('tabs').innerHTML = TABS.filter(t => !t.show || t.show()).map(t => {
    const c = t.count ? t.count() : null;
    return `<a data-k="${t.key}" class="${st.view === t.key ? 'active' : ''}">${t.label}${c != null ? `<span class="cnt ${c ? '' : 'zero'}">${c}</span>` : ''}</a>`;
  }).join('');
  $('tabs').onclick = e => { const a = e.target.closest('a[data-k]'); if (!a) return; st.view = a.dataset.k; st.sel = null; st.editor = null; render(); };
  const main = $('main');
  if (st.view === 'new') return st.editor ? renderEditor(main) : renderCatalog(main);
  renderListView(main);
}

/* ---------- 一覧＋詳細 ---------- */
function itemsForView() {
  const byNewest = (a, b) => String(b._sort || '').localeCompare(String(a._sort || ''));
  switch (st.view) {
    case 'inbox': return st.tasks.filter(isInbox).map(t => taskItem(t)).sort(byNewest);
    case 'todo':  return st.tasks.filter(t => t.StepType === '後処理' && !hiddenTasks.has(t.id)).map(t => taskItem(t)).sort((a, b) => (a.t.Status === '処理待ち' ? 0 : 1) - (b.t.Status === '処理待ち' ? 0 : 1) || byNewest(a, b));
    case 'circ':  return st.tasks.filter(t => t.StepType === '回覧').map(t => taskItem(t)).sort(byNewest);
    case 'mine':  return st.myReqs.map(r => reqItem(r)).sort(byNewest);
    case 'all':   return (st.allReqs || []).map(r => reqItem(r)).sort(byNewest);
    case 'involved': {
      // 自分が処理した（または処理待ちの）タスクを申請ごとにまとめ、最新のものを出す
      const by = {};
      st.tasks.filter(t => t.StepType !== '回覧' || t.Status !== '未読').forEach(t => { const k = t.RequestNo; if (!by[k] || t.id > by[k].id) by[k] = t; });
      return Object.values(by).map(t => taskItem(t, true)).sort(byNewest);
    }
  }
  return [];
}
/* 検索用の文字列（件名・番号・申請者・部署・フォーム名・段・申請内容） */
const flatText = v => v == null ? '' : typeof v === 'object' ? Object.values(v).map(flatText).join(' ') : String(v);
function taskItem(t, involved) {
  const s = pj(t.SnapshotJson, {});
  const badge = involved ? reqStatusBadge({ Status: t.RequestStatus }) : taskBadge(t);
  return { key: 't' + t.id, t, s, _sort: t.ActedAt || t.Created || s.submittedAt,
    f: { no: t.RequestNo, title: s.title || t.Title, form: t.FormCode, applicant: s.applicantName, dept: s.applicantDept,
         status: involved ? t.RequestStatus : t.Status, date: s.submittedAt || t.Created,
         text: [t.RequestNo, s.title, s.applicantName, s.applicantDept, formName(t.FormCode), t.StepName, flatText(s.data)].join(' ') },
    html: `<div class="t">${esc(s.title || t.Title)}</div>
           <div class="m">${badge} ${esc(formName(t.FormCode))}・${esc(s.applicantName || '')}（${esc(s.applicantDept || '')}）</div>
           <div class="m">${esc(t.StepName)}　${fmtDT(t.Created)}${t.RequestNo ? '　' + esc(t.RequestNo) : ''}</div>` };
}
function reqItem(r) {
  return { key: 'r' + r.RequestNo, r, _sort: r.SubmittedAt,
    f: { no: r.RequestNo, title: r.Title, form: r.FormCode, applicant: r.ApplicantName, dept: r.ApplicantDept,
         status: r.Status + (r.PostStatus && r.PostStatus !== 'なし' ? '／後処理' + r.PostStatus : ''), date: r.SubmittedAt,
         text: [r.RequestNo, r.Title, r.ApplicantName, r.ApplicantDept, formName(r.FormCode), flatText(pj(r.DataJson, {}))].join(' ') },
    html: `<div class="t">${esc(r.Title)}</div>
           <div class="m">${reqStatusBadge(r)}${postBadge(r)}</div>
           <div class="m">${esc(formName(r.FormCode))}・${esc(r.ApplicantName)}　${fmtDT(r.SubmittedAt)}　${esc(r.RequestNo)}</div>` };
}
const formName = code => (st.M.forms.find(f => f.FormCode === code) || {}).Title || code;
function taskBadge(t) {
  const m = { '処理待ち': 'b-run', '承認': 'b-ok', '完了': 'b-ok', '確認済': 'b-ok', '既読': 'b-gray', '未読': 'b-warn', '差し戻し': 'b-warn', '却下': 'b-ng' };
  return `<span class="badge ${m[t.Status] || 'b-gray'}">${esc(t.Status)}</span>`;
}
function reqStatusBadge(r) {
  const m = { '申請中': 'b-run', '決裁済': 'b-ok', '差し戻し中': 'b-warn', '引き戻し': 'b-warn', '却下': 'b-ng', '取下げ': 'b-gray', '下書き': 'b-gray' };
  return `<span class="badge ${m[r.Status] || 'b-gray'}">${esc(r.Status)}${r.Status === '決裁済' ? ' ✓' : ''}</span>`;
}
function postBadge(r) {
  if (!r.PostStatus || r.PostStatus === 'なし') return '';
  return r.PostStatus === '完了' ? `<span class="badge b-ok">後処理 完了</span>` : `<span class="badge b-gray">後処理：${esc(r.PostAssignees ? r.PostAssignees.split(';').map(nameOf).join('・') : '')} 対応待ち</span>`;
}

/* 絞り込み条件（タブを切り替えても残す） */
const flt = { q: '', form: '', status: '', from: '', to: '' };
function applyFilter(items) {
  const words = flt.q.trim().toLowerCase().split(/[\s　]+/).filter(Boolean);
  return items.filter(i => {
    const f = i.f, d = String(f.date || '').slice(0, 10);
    if (words.length && !words.every(w => f.text.toLowerCase().includes(w))) return false;
    if (flt.form && f.form !== flt.form) return false;
    if (flt.status && f.status !== flt.status) return false;
    if (flt.from && d < flt.from) return false;
    if (flt.to && d > flt.to) return false;
    return true;
  });
}
function filtersHtml(all) {
  const forms = [...new Set(all.map(i => i.f.form))].map(c => `<option value="${esc(c)}" ${flt.form === c ? 'selected' : ''}>${esc(formName(c))}</option>`).join('');
  const sts = [...new Set(all.map(i => i.f.status).filter(Boolean))].map(s => `<option ${flt.status === s ? 'selected' : ''}>${esc(s)}</option>`).join('');
  return `<div class="filters">
    <input class="q" id="fQ" type="search" placeholder="🔍 キーワード（件名・番号・申請者・部署・内容）" value="${esc(flt.q)}">
    <select id="fForm"><option value="">すべてのフォーム</option>${forms}</select>
    <select id="fStatus"><option value="">すべての状態</option>${sts}</select>
    <input id="fFrom" type="date" title="申請日（から）" value="${esc(flt.from)}">
    <input id="fTo" type="date" title="申請日（まで）" value="${esc(flt.to)}">
    <div class="foot"><span id="fCount"></span><span class="sp"></span><button id="fClear">条件クリア</button><button id="fCsv">CSV出力</button></div>
  </div>`;
}
function renderListView(main) {
  const all = itemsForView();
  const empty = { inbox: '承認待ちはありません', todo: 'TODOはありません', circ: '回覧はありません', mine: 'まだ申請はありません', involved: '関わった申請はありません', all: '申請はありません' }[st.view];
  main.innerHTML = `<div class="list">${filtersHtml(all)}<div class="rows" id="rows"></div></div>
                    <div class="detail" id="detail"><div class="empty">左の一覧から選んでください</div></div>`;
  const drawRows = () => {
    const items = applyFilter(all);
    $('fCount').textContent = `${items.length} / ${all.length} 件`;
    $('rows').innerHTML = items.length ? items.map(i => `<div class="row ${st.sel === i.key ? 'sel' : ''}" data-k="${esc(i.key)}">${i.html}</div>`).join('')
      : `<div class="empty">${all.length ? '条件に合うものはありません' : empty}</div>`;
    return items;
  };
  let shown = drawRows();
  const onChange = () => { flt.q = $('fQ').value; flt.form = $('fForm').value; flt.status = $('fStatus').value; flt.from = $('fFrom').value; flt.to = $('fTo').value; shown = drawRows(); };
  $('fQ').addEventListener('input', onChange);
  ['fForm', 'fStatus', 'fFrom', 'fTo'].forEach(id => $(id).addEventListener('change', onChange));
  $('fClear').onclick = () => { Object.keys(flt).forEach(k => flt[k] = ''); renderListView(main); };
  $('fCsv').onclick = () => downloadCsv(shown);
  $('rows').onclick = e => {
    const r = e.target.closest('.row'); if (!r) return;
    st.sel = r.dataset.k;
    $('rows').querySelectorAll('.row').forEach(x => x.classList.toggle('sel', x === r));
    const cur = all.find(i => i.key === st.sel);
    if (cur) cur.t ? renderTaskDetail(cur.t, cur.s) : renderReqDetail(cur.r);
  };
  const cur = all.find(i => i.key === st.sel);
  if (cur) cur.t ? renderTaskDetail(cur.t, cur.s) : renderReqDetail(cur.r);
}
function downloadCsv(items) {
  const head = ['申請番号', '件名', 'フォーム', '申請者', '部署', '状態', '申請日時'];
  const q = v => '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"';
  const lines = [head.map(q).join(',')].concat(items.map(i => [i.f.no, i.f.title, formName(i.f.form), i.f.applicant, i.f.dept, i.f.status,
    i.f.date ? new Date(i.f.date).toLocaleString('ja-JP') : ''].map(q).join(',')));
  const blob = new Blob(['﻿' + lines.join('\r\n')], { type: 'text/csv' });   // Excel で文字化けしないよう BOM 付き
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `ワークフロー_${TABS.find(t => t.key === st.view).label}_${new Date().toISOString().slice(0, 10)}.csv`;
  a.click(); URL.revokeObjectURL(a.href);
}

/* ---------- 詳細：共通部品 ---------- */
function dataCard(form, data, prev) {
  const fields = (form ? form.fields : Object.keys(data).map(k => ({ key: k, label: k, type: 'text' }))).filter(f => f.type !== 'note');
  const show = (f, v) => {
    if (v == null || v === '') return '<span class="muted">（未入力）</span>';
    if (f.type === 'table') return tableView(f, v);
    if (Array.isArray(v)) return esc(v.join('、'));
    if (f.type === 'currency') return esc(yen(v));
    if (f.type === 'user') return esc(nameOf(v));
    return esc(v);
  };
  return `<div class="card"><h3>申請内容${prev ? '　<span class="badge b-warn">黄色＝前回から変更された項目</span>' : ''}</h3><div class="kv">` +
    fields.map(f => {
      const v = data[f.key], changed = prev && JSON.stringify(prev[f.key] ?? null) !== JSON.stringify(v ?? null);
      return `<div class="k">${esc(f.label)}</div><div class="v ${changed ? 'changed' : ''}">${show(f, v)}${changed ? `<span class="was">前回: ${prev[f.key] == null || prev[f.key] === '' ? '（未入力）' : (f.type === 'table' ? '（表）' : esc(Array.isArray(prev[f.key]) ? prev[f.key].join('、') : prev[f.key]))}</span>` : ''}</div>`;
    }).join('') + '</div></div>';
}
function tableView(f, rows) {
  return `<table class="tbl"><tr>${f.columns.map(c => `<th>${esc(c.label)}</th>`).join('')}</tr>` +
    rows.map(r => `<tr>${f.columns.map(c => `<td>${esc(c.type === 'currency' || c.type === 'calc' ? yen(r[c.key]) : r[c.key])}</td>`).join('')}</tr>`).join('') + '</table>';
}
/* 経路の表示。curIdx＝現在の段（0始まり）、finished＝決裁済 */
function routeCard(route, curIdx, finished, title) {
  return `<div class="card"><h3>${title || '承認経路'}</h3><div class="route">` + route.map((s, i) => {
    const cls = s.skipped ? 'skip' : finished || i < curIdx ? 'done' : i === curIdx ? 'cur' : '';
    const who = s.skipped ? esc(s.reason) : s.upns.map(nameOf).map(esc).join(' / ') + (s.upns.length > 1 ? (s.mode === 'all' ? '（全員）' : '（いずれか）') : '');
    return `${i ? '<span class="ar">→</span>' : ''}<div class="st ${cls} ${s.type === '決裁' ? 'kessai' : ''}">${esc(s.name)}${cls === 'done' ? ' ✓' : ''}<small>${who}</small></div>`;
  }).join('') + '</div></div>';
}
function returnBanner(lr) {
  if (!lr) return '';
  return `<div class="return-banner"><b>前回、差し戻されています</b>（${esc(lr.byStep)}：${esc(nameOf(lr.by))}　${fmtDT(lr.at)}　→ ${esc(lr.toStep)}へ）
    <div style="margin-top:6px"><b>差し戻し理由：</b>${esc(lr.reason)}</div>
    ${lr.resubmitNote ? `<div style="margin-top:4px"><b>申請者の修正コメント：</b>${esc(lr.resubmitNote)}</div>` : ''}</div>`;
}
function histCard(r) {
  const h = pj(r.HistoryJson, []);
  if (!h.length) return '';
  return `<div class="card"><h3>経過</h3><div class="hist">` + h.map(x =>
    `<div>${fmtDT(x.at)}　<b>${esc(x.type)}</b>　${esc(x.by === 'system' ? '' : nameOf(x.by))}${x.step ? '（' + esc(x.step) + '）' : ''}${x.comment ? '：' + esc(x.comment) : ''}</div>`).join('') + '</div></div>';
}

/* ---------- 詳細：タスク（承認待ち・TODO・回覧・関わった申請） ---------- */
function renderTaskDetail(t, s) {
  const form = st.M.forms.find(f => f.FormCode === t.FormCode);
  const route = s.route || [];
  const d = $('detail');
  const canAct = isInbox(t);
  let html = `<h2>${esc(s.title || t.Title)}</h2>
    <div class="muted" style="margin-bottom:12px">${esc(t.RequestNo || '')}　${esc(formName(t.FormCode))}　申請：${esc(s.applicantName)}（${esc(s.applicantDept)}）${fmtDT(s.submittedAt)}　${reqStatusBadge({ Status: t.RequestStatus })}</div>`;
  if (canAct) html += returnBanner(s.lastReturn);
  html += dataCard(form, s.data || {}, canAct ? (s.lastReturn && s.lastReturn.prevData) || null : null);
  if (['承認', '決裁', '作業'].includes(t.StepType)) html += routeCard(route, t.StepNo - 1, false);

  if (canAct) {
    const back = route.slice(0, t.StepNo - 1).map((x, i) => ({ x, i })).filter(o => !o.x.skipped);
    html += `<div class="card"><h3>あなたの処理（${esc(t.StepName)}）</h3>
      <textarea id="cmt" placeholder="コメント（差し戻し・却下のときは必須）"></textarea>
      <div class="actions">
        <button class="pri" id="bOk">${t.StepType === '決裁' ? '決裁する' : '承認する'}</button>
        <span style="flex:1"></span>
        <select id="retTo" style="width:auto"><option value="0">申請者へ差し戻す</option>${back.map(o => `<option value="${o.i + 1}">「${esc(o.x.name)}」（${esc(o.x.upns.map(nameOf).join('/'))}）へ差し戻す</option>`).join('')}</select>
        <button class="warn" id="bRet">差し戻し</button>
        <button class="ng" id="bNg">却下</button>
      </div>
      <div class="muted" style="margin-top:6px">差し戻すと、差し戻し先から承認をやり直します。取り消される承認をした人にも通知が届きます。</div></div>`;
  } else if (t.StepType === '後処理') {
    html += t.Status === '処理待ち'
      ? `<div class="card"><h3>TODO：${esc(t.StepName)}</h3><div class="muted" style="margin-bottom:8px">決裁は完了しています。作業が終わったら「完了」を押してください。</div>
         <textarea id="cmt" placeholder="メモ（任意）"></textarea><div class="actions"><button class="pri" id="bDone">完了にする</button></div></div>`
      : `<div class="card"><h3>TODO：${esc(t.StepName)}</h3>${taskBadge(t)} ${fmtDT(t.ActedAt)} ${esc(t.Comment || '')}</div>`;
  } else if (t.StepType === '回覧') {
    html += `<div class="card"><h3>回覧</h3>${taskBadge(t)}　決裁済みの申請の共有です。承認は不要です。
      ${t.Status !== '確認済' ? '<div class="actions"><button id="bSeen">確認しました</button></div>' : ''}</div>`;
    if (t.Status === '未読') act({ Title: '既読', ActionType: '既読', TaskId: t.id, RequestNo: t.RequestNo }, true);
  } else {
    html += `<div class="card"><h3>あなたの処理</h3>${taskBadge(t)} ${esc(t.StepName)}　${fmtDT(t.ActedAt)}${t.Comment ? '<div style="margin-top:6px">コメント：' + esc(t.Comment) + '</div>' : ''}
      <div class="muted" style="margin-top:6px">申請の現在の状態：${reqStatusBadge({ Status: t.RequestStatus })}</div></div>`;
  }
  d.innerHTML = html;

  const cmt = () => ($('cmt') ? $('cmt').value.trim() : '');
  if ($('bOk')) $('bOk').onclick = () => act({ Title: `${t.StepType} ${t.RequestNo}`, ActionType: t.StepType === '決裁' ? '決裁' : '承認', TaskId: t.id, RequestNo: t.RequestNo, PayloadJson: JSON.stringify({ comment: cmt() }) });
  if ($('bRet')) $('bRet').onclick = () => {
    if (!cmt()) return alert('差し戻しの理由を入力してください');
    const to = Number($('retTo').value);
    if (!confirm(`${to ? '「' + route[to - 1].name + '」' : '申請者'}へ差し戻します。よろしいですか？`)) return;
    act({ Title: `差し戻し ${t.RequestNo}`, ActionType: '差し戻し', TaskId: t.id, RequestNo: t.RequestNo, PayloadJson: JSON.stringify({ comment: cmt(), toStep: to }) });
  };
  if ($('bNg')) $('bNg').onclick = () => {
    if (!cmt()) return alert('却下の理由を入力してください');
    if (!confirm('却下すると、この申請は終了します。よろしいですか？')) return;
    act({ Title: `却下 ${t.RequestNo}`, ActionType: '却下', TaskId: t.id, RequestNo: t.RequestNo, PayloadJson: JSON.stringify({ comment: cmt() }) });
  };
  if ($('bDone')) $('bDone').onclick = () => act({ Title: `後処理完了 ${t.RequestNo}`, ActionType: '後処理完了', TaskId: t.id, RequestNo: t.RequestNo, PayloadJson: JSON.stringify({ comment: cmt() }) });
  if ($('bSeen')) $('bSeen').onclick = () => act({ Title: `確認 ${t.RequestNo}`, ActionType: '確認', TaskId: t.id, RequestNo: t.RequestNo });
}

/* ---------- 詳細：申請（自分の申請・すべての申請） ---------- */
function renderReqDetail(r) {
  const form = st.M.forms.find(f => f.FormCode === r.FormCode);
  const res = pj(r.RouteJson, { route: [] });
  const mine = lc(r.ApplicantUPN) === st.me.upn;
  const finished = r.Status === '決裁済';
  let html = `<h2>${esc(r.Title)}</h2>
    <div class="muted" style="margin-bottom:10px">${esc(r.RequestNo)}　${esc(formName(r.FormCode))}　申請：${esc(r.ApplicantName)}（${esc(r.ApplicantDept)}）${fmtDT(r.SubmittedAt)}${r.Round > 1 ? '　第' + r.Round + '回' : ''}</div>
    <div class="card"><h3>状態</h3>
      <div style="font-size:15px">承認：${reqStatusBadge(r)}${finished ? ` ${fmtDT(r.ApprovedAt)}` : ''}
      ${r.Status === '申請中' && r.CurrentAssignees ? `　<span class="muted">いま処理している人：</span>${esc(r.CurrentAssignees.split(';').map(nameOf).join(' / '))}` : ''}</div>
      ${r.PostStatus && r.PostStatus !== 'なし' ? `<div style="margin-top:6px;font-size:15px">${postBadge(r)}${r.PostStatus === '完了' ? ' ' + fmtDT(r.FinishedAt) : '<span class="muted">（決裁は済んでいます。担当部署の作業待ちです）</span>'}</div>` : ''}
    </div>`;
  if (r.Status === '差し戻し中') html += returnBanner(pj(r.LastReturnJson, null));
  html += dataCard(form, pj(r.DataJson, {}), null);
  html += routeCard(res.route, finished ? res.route.length : (r.CurrentStepNo || 1) - 1, finished);
  html += histCard(r);
  if (mine) {
    const btns = [];
    if (r.Status === '申請中') btns.push('<button id="bPull" class="warn">引き戻す</button><span class="muted">次の人がまだ処理していなければ、申請を取り戻せます</span>');
    if (['差し戻し中', '引き戻し'].includes(r.Status)) btns.push('<button id="bRe" class="pri">修正して再申請する</button>');
    if (btns.length) html += `<div class="card"><h3>操作</h3><div class="actions">${btns.join('')}</div></div>`;
  }
  $('detail').innerHTML = html;
  if ($('bPull')) $('bPull').onclick = () => { if (confirm('申請を引き戻しますか？')) act({ Title: `引き戻し ${r.RequestNo}`, ActionType: '引き戻し', RequestNo: r.RequestNo }); };
  if ($('bRe')) $('bRe').onclick = () => { st.view = 'new'; st.editor = { form, data: pj(r.DataJson, {}), resubmit: r }; render(); };
}

/* ---------- 操作の送信 ---------- */
/* ---------- 操作の送信（画面は待たせない） ----------
   送ったらすぐ次の操作に進める。処理結果は裏で確認し、完了したら右下に表示、エラーのときだけ知らせる。
   処理中のタスクは一覧から隠す（二重に押さないように）。 */
const pending = new Map();     // WF_Action の番号 → { label, taskId, t0 }
const hiddenTasks = new Set(); // 処理中で一覧から隠しているタスク
let trackTimer = null;
async function act(fields, silent) {
  busy = true;
  try {
    const { id } = await api.postAction(fields);
    const label = fields.ActionType;
    pending.set(id, { label, taskId: fields.TaskId, reqNo: fields.RequestNo, silent: !!silent, t0: Date.now() });
    if (fields.TaskId && !silent) hiddenTasks.add(fields.TaskId);
    if (!silent) { st.sel = null; render(); showPending(); }
    if (!trackTimer) trackTimer = setInterval(trackPending, 2000);
    return { id };
  } catch (e) { status('送信に失敗しました: ' + e.message + '（もう一度お試しください）', 'err'); return null; }
  finally { busy = false; }
}
function showPending() {
  const n = [...pending.values()].filter(p => !p.silent).length;
  if (n) status(`処理中 ${n}件（そのまま次の操作に進めます。完了すると右下に表示されます）`, 'busy');
}
async function trackPending() {
  if (!pending.size) { clearInterval(trackTimer); trackTimer = null; return; }
  let changed = false;
  for (const [id, p] of [...pending]) {
    let r; try { r = await api.actionResult(id); } catch { continue; }
    if (r.Result === '完了') {
      pending.delete(id); changed = true;
      if (!p.silent) toast(`✔ ${p.label}しました${r.RequestNo ? '（' + r.RequestNo + '）' : ''}`);
    } else if (r.Result === 'エラー') {
      pending.delete(id); changed = true;
      if (p.taskId) hiddenTasks.delete(p.taskId);
      toast(`✖ ${p.label}できませんでした：${r.ResultMessage || ''}`, true);
      alert(`${p.label}できませんでした\n${r.ResultMessage || ''}`);
    } else if (Date.now() - p.t0 > 180000 && !p.slow) {
      p.slow = true;
      toast(`${p.label}の反映に時間がかかっています。しばらくすると自動で反映されます`, true);
    }
  }
  if (changed) {
    await load(true);
    // 処理が終わったタスクは一覧から消えているので、隠していた印を片付ける
    [...hiddenTasks].forEach(id => { if (![...pending.values()].some(p => p.taskId === id)) hiddenTasks.delete(id); });
    render(); scheduleFollowUp();
    if ([...pending.values()].some(p => !p.silent)) showPending(); else status(`更新 ${fmtDT(new Date())}`, '');
  }
}
function toast(msg, isErr) {
  const box = $('toasts'), el = document.createElement('div');
  el.className = 'toast' + (isErr ? ' err' : ''); el.textContent = msg;
  box.appendChild(el); setTimeout(() => el.remove(), isErr ? 10000 : 5000);
}

/* ============================================================
   新規申請：フォーム一覧
   ============================================================ */
function renderCatalog(main) {
  const cats = pj(st.M.settings['app.categories'], []);
  const forms = st.M.forms.filter(f => f.Active !== false || hasAllView());
  const groups = [...new Set([...cats, ...forms.map(f => f.Category)])].map(c => ({ c, fs: forms.filter(f => f.Category === c) })).filter(g => g.fs.length);
  main.innerHTML = `<div class="catalog">${groups.length ? groups.map(g => `<h3>${esc(g.c)}</h3><div class="forms">${g.fs.map(f =>
    `<div class="fcard" data-c="${esc(f.FormCode)}"><div class="n">${esc(f.Title)}${f.Active === false ? ' <span class="badge b-gray">準備中</span>' : ''}</div><div class="d">${esc((f.Description || '').split('\n')[0].slice(0, 60))}</div></div>`).join('')}</div>`).join('')
    : '<div class="empty">申請できるフォームはまだありません</div>'}</div>`;
  main.querySelector('.catalog').onclick = e => {
    const c = e.target.closest('.fcard'); if (!c) return;
    st.editor = { form: st.M.forms.find(f => f.FormCode === c.dataset.c), data: {} }; render();
  };
}

/* ============================================================
   新規申請：入力画面（フォーム定義から組み立てる）
   ============================================================ */
function renderEditor(main) {
  const ed = st.editor, f = ed.form;
  main.innerHTML = `<div class="editor"><div class="form">
      <div class="actions" style="margin:0 0 12px"><button id="bBack">← フォーム一覧</button></div>
      <h2>${esc(f.Title)}${ed.resubmit ? '（再申請）' : ''}</h2>
      ${ed.resubmit ? returnBanner(pj(ed.resubmit.LastReturnJson, null)) : ''}
      ${f.Description ? `<div class="desc">${esc(f.Description)}</div>` : ''}
      <div id="flds">${f.fields.map(fieldHtml).join('')}</div>
      ${ed.resubmit ? `<div class="fld" data-k="__resubmit"><label class="l">修正コメント<span class="req">必須</span></label><textarea id="resubmitNote" placeholder="何を直したかを書いてください（承認者の画面の一番上に表示されます）"></textarea></div>` : ''}
      <div class="actions"><button class="pri" id="bSubmit">${ed.resubmit ? '再申請する' : '申請する'}</button></div>
    </div><div class="side"><h3 style="margin-top:0">承認経路（自動）</h3><div id="preview"></div></div></div>`;
  $('bBack').onclick = () => { st.editor = null; render(); };
  const box = $('flds');
  f.fields.forEach(fd => setFieldValue(fd, ed.data[fd.key]));
  box.addEventListener('input', () => { readForm(); recalc(); preview(); });
  box.addEventListener('click', e => {
    const b = e.target.closest('button[data-act]'); if (!b) return;
    const fd = f.fields.find(x => x.key === b.dataset.k); readForm();
    const rows = ed.data[fd.key] = ed.data[fd.key] || [];
    if (b.dataset.act === 'add') rows.push({}); else rows.splice(Number(b.dataset.i), 1);
    box.querySelector(`[data-k="${fd.key}"]`).outerHTML = fieldHtml(fd); setFieldValue(fd, rows); recalc(); preview();
  });
  $('bSubmit').onclick = submit;
  recalc(); preview();
}
function fieldHtml(fd) {
  const req = fd.required ? '<span class="req">必須</span>' : '';
  const id = 'f_' + fd.key;
  let inp;
  switch (fd.type) {
    case 'textarea': inp = `<textarea id="${id}" placeholder="${esc(fd.placeholder || '')}"></textarea>`; break;
    case 'number': case 'currency': inp = `<input id="${id}" type="number" style="max-width:220px" placeholder="${esc(fd.placeholder || '')}">${fd.type === 'currency' ? ' 円' : ''}`; break;
    case 'date': inp = `<input id="${id}" type="date" style="max-width:200px">`; break;
    case 'select': inp = `<select id="${id}"><option value=""></option>${opts(fd).map(o => `<option>${esc(o)}</option>`).join('')}</select>`; break;
    case 'radio': inp = `<div class="opts">${opts(fd).map(o => `<label><input type="radio" name="${id}" value="${esc(o)}">${esc(o)}</label>`).join('')}</div>`; break;
    case 'checkbox': inp = `<div class="opts">${opts(fd).map(o => `<label><input type="checkbox" name="${id}" value="${esc(o)}">${esc(o)}</label>`).join('')}</div>`; break;
    case 'user': inp = `<select id="${id}"><option value=""></option>${st.M.org.map(p => `<option value="${esc(lc(p.UPN))}">${esc(p.Title)}（${esc(p.Dept)}）</option>`).join('')}</select>`; break;
    case 'calc': inp = `<div id="${id}" style="font-weight:600;font-size:15px">0</div>`; break;
    case 'note': return `<div class="desc">${esc(fd.text || fd.label)}</div>`;
    case 'file': inp = `<div class="muted">添付ファイルの受け付けは準備中です（Power Automate の実装と合わせて対応します）</div>`; break;
    case 'table': {
      const rows = (st.editor.data[fd.key] || []);
      inp = `<table class="tbl"><tr>${fd.columns.map(c => `<th>${esc(c.label)}</th>`).join('')}<th></th></tr>` +
        rows.map((r, i) => `<tr>${fd.columns.map(c => `<td>${c.type === 'calc' ? `<span data-cell="${fd.key}.${i}.${c.key}"></span>` : `<input data-cell="${fd.key}.${i}.${c.key}" type="${['number', 'currency'].includes(c.type) ? 'number' : c.type === 'date' ? 'date' : 'text'}">`}</td>`).join('')}<td><button data-act="del" data-k="${fd.key}" data-i="${i}">削除</button></td></tr>`).join('') +
        `</table><button data-act="add" data-k="${fd.key}" style="margin-top:4px">＋ 行を追加</button>`;
      break;
    }
    default: inp = `<input id="${id}" type="text" placeholder="${esc(fd.placeholder || '')}">`;
  }
  return `<div class="fld" data-k="${esc(fd.key)}"><label class="l">${esc(fd.label)}${req}</label>${inp}${fd.help ? `<div class="muted">${esc(fd.help)}</div>` : ''}</div>`;
}
/* 選択肢: 配列、または "@setting:キー" で WF_Setting から読む */
function opts(fd) {
  if (typeof fd.options === 'string' && fd.options.startsWith('@setting:')) return pj(st.M.settings[fd.options.slice(9)], []);
  return fd.options || [];
}
function setFieldValue(fd, v) {
  const id = 'f_' + fd.key;
  if (v == null) return;
  if (fd.type === 'radio' || fd.type === 'checkbox') document.querySelectorAll(`[name="${id}"]`).forEach(x => x.checked = [].concat(v).includes(x.value));
  else if (fd.type === 'table') (v || []).forEach((r, i) => fd.columns.forEach(c => { const el = document.querySelector(`input[data-cell="${fd.key}.${i}.${c.key}"]`); if (el && r[c.key] != null) el.value = r[c.key]; }));
  else if ($(id) && $(id).tagName !== 'DIV') $(id).value = v;
}
function readForm() {
  const ed = st.editor;
  ed.form.fields.forEach(fd => {
    const id = 'f_' + fd.key;
    if (['note', 'file', 'calc'].includes(fd.type)) return;
    if (fd.type === 'checkbox') ed.data[fd.key] = [...document.querySelectorAll(`[name="${id}"]:checked`)].map(x => x.value);
    else if (fd.type === 'radio') ed.data[fd.key] = (document.querySelector(`[name="${id}"]:checked`) || {}).value || '';
    else if (fd.type === 'table') ed.data[fd.key] = (ed.data[fd.key] || []).map((r, i) => {
      const o = {}; fd.columns.forEach(c => { const el = document.querySelector(`input[data-cell="${fd.key}.${i}.${c.key}"]`);
        if (el) o[c.key] = ['number', 'currency'].includes(c.type) ? (el.value === '' ? '' : Number(el.value)) : el.value; }); return o; });
    else if ($(id)) ed.data[fd.key] = ['number', 'currency'].includes(fd.type) ? ($(id).value === '' ? '' : Number($(id).value)) : $(id).value;
  });
}
/* 計算項目。式に使えるのは 数字・項目キー・+-* / ( ) と sum(表キー.列キー) だけ */
function calcExpr(expr, scope) {
  const src = expr.replace(/sum\(([A-Za-z_]\w*)\.([A-Za-z_]\w*)\)/g, (_, t, c) => String((scope[t] || []).reduce((a, r) => a + (Number(r[c]) || 0), 0)))
    .replace(/[A-Za-z_]\w*/g, k => String(Number(scope[k]) || 0));
  if (!/^[\d+\-*/().\s]*$/.test(src)) return 0;
  try { return Math.round(Function('"use strict";return (' + (src || 0) + ')')() * 100) / 100; } catch { return 0; }
}
function recalc() {
  const ed = st.editor;
  ed.form.fields.forEach(fd => {
    if (fd.type === 'table') (ed.data[fd.key] || []).forEach((r, i) => fd.columns.filter(c => c.type === 'calc').forEach(c => {
      r[c.key] = calcExpr(c.expr, r); const el = document.querySelector(`[data-cell="${fd.key}.${i}.${c.key}"]`); if (el) el.textContent = yen(r[c.key]); }));
  });
  ed.form.fields.filter(fd => fd.type === 'calc').forEach(fd => { ed.data[fd.key] = calcExpr(fd.expr, ed.data); if ($('f_' + fd.key)) $('f_' + fd.key).textContent = yen(ed.data[fd.key]); });
}
function routeFor(ed) {
  const wf = st.M.workflows.find(w => w.WorkflowCode === ed.form.WorkflowCode);
  if (!wf) return { route: [], post: [], circulate: [], errors: ['ワークフロー「' + ed.form.WorkflowCode + '」が見つかりません'] };
  if (!st.me.org) return { route: [], post: [], circulate: [], errors: ['あなたは組織マスタに登録されていません（総務にご連絡ください）'] };
  return { ...WFEngine.resolveRoute({ applicant: st.me.org, workflow: wf, data: dataForRules(ed), org: st.M.org, roles: st.M.roles }), wf };
}
/* 条件式では、項目キーでも表示名でも参照できるようにする（例: 金額 / total） */
function dataForRules(ed) {
  const d = { ...ed.data }; ed.form.fields.forEach(fd => { if (!(fd.label in d)) d[fd.label] = ed.data[fd.key]; }); return d;
}
function preview() {
  const res = routeFor(st.editor);
  $('preview').innerHTML = (res.errors.length ? `<div class="errbox">${res.errors.map(esc).join('<br>')}</div>` : '') +
    '<div class="proute">' + res.route.map(s => `<div class="${s.skipped ? 'skip' : ''} ${s.type === '決裁' ? 'kessai' : ''}"><b>${esc(s.name)}</b>（${esc(s.type)}）<br>${s.skipped ? esc(s.reason) : esc(s.upns.map(nameOf).join(' / ')) + (s.upns.length > 1 ? (s.mode === 'all' ? '（全員）' : '（いずれか）') : '')}</div>`).join('') + '</div>' +
    (res.post.length ? `<h3>決裁後の後処理</h3><div class="muted">${res.post.map(p => esc(p.name) + '：' + esc(p.upns.map(nameOf).join('・'))).join('<br>')}</div>` : '') +
    (res.circulate.length ? `<h3>回覧</h3><div class="muted">${esc(res.circulate.map(nameOf).join('、'))}</div>` : '');
}
function validate(ed) {
  const bad = [];
  document.querySelectorAll('.fld.err').forEach(x => x.classList.remove('err'));
  ed.form.fields.filter(fd => fd.required).forEach(fd => {
    const v = ed.data[fd.key];
    if (v == null || v === '' || (Array.isArray(v) && !v.length)) { bad.push(fd.label); const el = document.querySelector(`.fld[data-k="${fd.key}"]`); if (el) el.classList.add('err'); }
  });
  return bad;
}
async function submit() {
  const ed = st.editor, f = ed.form; readForm(); recalc();
  const bad = validate(ed);
  if (bad.length) return alert('次の項目を入力してください\n・' + bad.join('\n・'));
  const res = routeFor(ed);
  if (res.errors.length) return alert('承認経路を決められません\n' + res.errors.join('\n'));
  const note = ed.resubmit ? $('resubmitNote').value.trim() : '';
  if (ed.resubmit && !note) return alert('修正コメントを入力してください');
  const title = (f.TitleTemplate || '{subject}').replace(/\{(\w+)\}/g, (_, k) => Array.isArray(ed.data[k]) ? ed.data[k].join('・') : (ed.data[k] ?? '')).trim() || f.Title;
  // SummaryFields: "Amount=total;PartnerName=vendor" → 検索用の列へ
  const summary = Object.fromEntries((f.SummaryFields || '').split(';').filter(Boolean).map(x => x.split('=')).map(([c, k]) => [c, ed.data[k]]));
  const payload = { prefix: f.NumberPrefix, title, formVersion: f.Version, workflowVersion: res.wf.Version,
    applicantName: st.me.org.Title, applicantDept: st.me.org.Dept, notifyOnFinish: !!f.NotifyOnFinish, confidential: !!f.Confidential,
    amount: summary.Amount ?? null, summary, data: ed.data,
    route: { route: res.route, post: res.post, circulate: res.circulate }, resubmitNote: note };
  if (!confirm(`${ed.resubmit ? '再申請' : '申請'}します。よろしいですか？\n\n最初の承認者：${(res.route.find(s => !s.skipped) || { upns: [] }).upns.map(nameOf).join(' / ')}`)) return;
  $('bSubmit').disabled = true;
  const r = await act(ed.resubmit
    ? { Title: `再申請 ${ed.resubmit.RequestNo}`, ActionType: '再申請', RequestNo: ed.resubmit.RequestNo, FormCode: f.FormCode, PayloadJson: JSON.stringify(payload) }
    : { Title: `申請 ${title}`, ActionType: '申請', FormCode: f.FormCode, PayloadJson: JSON.stringify(payload) });
  if (!r) { $('bSubmit').disabled = false; return; }   // 送信できなかった（入力内容はそのまま残す）
  // 送信できたら入力画面を閉じる。申請番号は処理が終わると右下に出て、「自分の申請」に並ぶ
  st.editor = null; st.view = 'mine'; st.sel = null; render(); showPending();
}

init();
</script>

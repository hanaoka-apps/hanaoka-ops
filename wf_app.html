function editorLinkHtml() {
  const ed = st.editor, L = linkOf(ed.form); if (!L) return '';
  const link = buildLink(ed.form, ed.data, ed.resubmit ? ed.resubmit.RequestNo : ''); if (!link) return '';
  return `<h3>${esc(link.label)}との比べ</h3>` + linkTableHtml(link, { no: '', label: ed.data[L.childLabel || 'payee'] || '', amount: Number(ed.data[L.childAmount || 'total']) || 0 }, null, true);
}
/* dry＝数えるだけ（画面の印・タブの切り替えはしない） */
function validate(ed, dry) {
  const bad = [];
  if (!dry) document.querySelectorAll('.fld.err').forEach(x => x.classList.remove('err'));
  const mark = (fd, msg) => {
    bad.push(msg); if (dry) return;
    const tb = bad.length === 1 && tabOf(fd.key); if (tb) { ed.tabs = ed.tabs || {}; ed.tabs[tb.key] = tb.i; applyConditions(); }   // 最初の誤りがあるタブを開く
    const el = document.querySelector(`.fld[data-k="${fd.key}"]`); if (el) el.classList.add('err');
  };
  ed.form.fields.filter(fd => isShown(fd, ed.data)).forEach(fd => {
    const v = ed.data[fd.key];
    const empty = v == null || v === '' || (Array.isArray(v) && !v.length);
    if (empty && isRequired(fd, ed.data)) return mark(fd, fd.label);
    // 形式（例：口座番号は7桁の数字、名義はカタカナ）
    if (!empty && fd.type === 'currency' && !isFinite(v)) mark(fd, `${fd.label}：数字で入力してください`);
    if (!empty && fd.pattern && typeof v === 'string' && !new RegExp(fd.pattern).test(v.trim())) mark(fd, `${fd.label}：${fd.patternMsg || '形式が正しくありません'}`);
    // 表の必須の列
    if (fd.type === 'table' && Array.isArray(v)) v.forEach((r, i) => fd.columns.filter(c => c.required).forEach(c => {
      if (r[c.key] == null || r[c.key] === '') mark(fd, `${fd.label}の${i + 1}行目「${c.label}」`);
    }));
  });
  return bad;
}
/* ---------- 条件で出す項目・条件付きの必須・注意（定義: showIf / requiredIf / warn。書き方は経路の条件と同じ） ---------- */
const condCtx = data => ({ data, applicant: edApplicant() });
function isShown(fd, data) { return !fd.showIf || WFEngine.evalCond(fd.showIf, condCtx(data)); }
function isRequired(fd, data) { return !!fd.required || (!!fd.requiredIf && WFEngine.evalCond(fd.requiredIf, condCtx(data))); }
function applyConditions() {
  const ed = st.editor; if (!ed) return;
  ed.form.fields.filter(fd => fd.optionsBy).forEach(refreshOptions);
  renderTabs(ed);
  ed.form.fields.forEach(fd => {
    const el = fd.key && document.querySelector(`.fld[data-k="${fd.key}"]`); if (!el) return;
    const tb = tabOf(fd.key);
    el.style.display = isShown(fd, ed.data) && (!tb || ((ed.tabs || {})[tb.key] || 0) === tb.i) ? '' : 'none';
    const r = el.querySelector('[data-reqif]'); if (r) r.style.display = isRequired(fd, ed.data) ? '' : 'none';
    const w = fd.warn && $('w_' + fd.key);
    if (w) { const on = WFEngine.evalCond({ field: fd.key, op: fd.warn.op, value: fd.warn.value }, condCtx(ed.data)); w.style.display = on ? '' : 'none'; w.textContent = on ? '⚠ ' + fd.warn.text : ''; }
  });
  // 中の項目がすべて隠れている枠は、枠ごと隠す
  document.querySelectorAll('#flds .fsec').forEach(sec => { sec.style.display = [...sec.querySelectorAll('.fld')].some(x => x.style.display !== 'none') ? '' : 'none'; });
}
/* ---------- タブ（入力画面を切り替えて見せる。項目は全部まとめて1件の申請）
   { "key": "_tabs", "type": "tabs", "tabs": [ { "label": "交通費", "fields": ["transport"] }, … ] }
   タブに入れた項目は、そのタブを選んだときだけ表示する。タブには入力済みの件数を出す */
function tabOf(k) {
  for (const fd of (st.editor ? st.editor.form.fields : [])) if (fd.type === 'tabs') { const i = fd.tabs.findIndex(t => (t.fields || []).includes(k)); if (i >= 0) return { key: fd.key, i }; }
  return null;
}
function renderTabs(ed) {
  ed.form.fields.filter(fd => fd.type === 'tabs').forEach(fd => {
    const cur = (ed.tabs || {})[fd.key] || 0;
    document.querySelectorAll(`button[data-tk="${CSS.escape(fd.key)}"]`).forEach(b => {
      const t = fd.tabs[Number(b.dataset.tab)];
      const n = (t.fields || []).reduce((a, k) => { const v = ed.data[k]; return a + (Array.isArray(v) ? v.filter(r => r && Object.values(r).some(x => x !== '' && x != null && x !== 0)).length : 0); }, 0);
      b.classList.toggle('on', Number(b.dataset.tab) === cur);
      b.querySelector('.cnt').textContent = n ? `（${n}）` : '';
    });
  });
}
/* 表のセル（入力欄・選択肢） */
function cellEl(k, i, c) { return document.querySelector(`input[data-cell="${k}.${i}.${c}"],select[data-cell="${k}.${i}.${c}"]`); }
async function submit() {
  const ed = st.editor, f = ed.form; readForm(); recalc();
  const ups = [...(ed.uploads || new Map()).values()];
  if (ups.some(u => u.st === 'up')) return alert('添付ファイルをアップロード中です。終わってから申請してください。');
  if (ups.some(u => u.st === 'ng')) return alert('アップロードに失敗した添付ファイルがあります。「削除」してから選び直してください。');
  const bad = validate(ed);
  // 人員を増やす・変える申請は、必ず人員表を通す（場所・人は人員表にあるものだけ。求人の稟議は役割「人員表の申請」の人だけ）
  f.fields.filter(fd => String(fd.options || '').startsWith('@staff:') && isShown(fd, ed.data) && ed.data[fd.key]).forEach(fd => { if (!opts(fd, ed.data).includes(ed.data[fd.key])) bad.push(`【${fd.label}】は人員表から選んでください`); });
  if (f.FormCode === 'RINGI' && ed.data.kind === '採用・求人広告' && !hasRole('人員表の申請')) return alert('求人の稟議は、人員表の申請ができる人（部門長など）が、人員表の「＋求人」から出します。\n部門長にご相談ください。');  if (bad.length) { alert('次の項目を入力してください\n・' + bad.join('\n・')); const e1 = document.querySelector('.fld.err'); if (e1) e1.scrollIntoView({ behavior: 'smooth', block: 'center' }); return; }
  const res = routeFor(ed);
  if (res.errors.length) return alert('承認経路を決められません\n' + res.errors.join('\n'));
  const note = ed.resubmit ? $('resubmitNote').value.trim() : '';
  if (ed.resubmit && !note) return alert('修正コメントを入力してください');
  // 条件で隠れている項目の値は送らない（前に入れた値が残っていても）
  ed.data = Object.fromEntries(Object.entries(ed.data).filter(([k]) => { const fd = f.fields.find(x => x.key === k); return !fd || isShown(fd, ed.data); }));
  // 件名：{項目} を値に置き換える。{表.列} は表のその列を「・」でつなぐ
  const title = (f.TitleTemplate || '{subject}').replace(/\{(\w+)(?:\.(\w+))?\}/g, (_, k, c) => { const v = ed.data[k];
    if (c) return [...new Set((v || []).map(r => r[c]).filter(Boolean))].join('・');
    return Array.isArray(v) ? v.join('・') : (v ?? ''); }).replace(/（\s*）/g, '').trim() || f.Title;
  // SummaryFields: "Amount=total;PartnerName=vendor" → 検索用の列へ
  const summary = Object.fromEntries((f.SummaryFields || '').split(';').filter(Boolean).map(x => x.split('=')).map(([c, k]) => [c, ed.data[k]]));
  const payload = { prefix: f.NumberPrefix, title, formVersion: f.Version, workflowVersion: res.wf.Version,
    applicantName: edApplicant().Title, applicantDept: edApplicant().Dept, proxyFor: ed.proxyFor || '', notifyOnFinish: !!f.NotifyOnFinish, confidential: !!f.Confidential,
    amount: summary.Amount ?? null, summary, data: Object.assign(ed.data, { _link: buildLink(f, ed.data, ed.resubmit ? ed.resubmit.RequestNo : '') || undefined }),
    route: { route: res.route, post: res.post, circulate: res.circulate }, resubmitNote: note,
    // 今回アップロードして、申請に含めるファイル（フローが受付フォルダから保管フォルダへ移す）
    newFiles: f.fields.filter(fd => fd.type === 'file').flatMap(fd => (ed.data[fd.key] || []).map(x => x.key)).filter(k => ed.newKeys && ed.newKeys.has(k)) };
  if (document.querySelector('.modal-bg')) return;   // 確認画面を開いているあいだは二重に開かない
  if (!await confirmSubmit(ed, f, title, res, note)) return;
  $('bSubmit').disabled = true;
  const r = await act(ed.resubmit
    ? { Title: `再申請 ${ed.resubmit.RequestNo}`, ActionType: '再申請', RequestNo: ed.resubmit.RequestNo, FormCode: f.FormCode, PayloadJson: JSON.stringify(payload) }
    : { Title: `申請 ${title}`, ActionType: '申請', FormCode: f.FormCode, PayloadJson: JSON.stringify(payload) });
  if (!r) { $('bSubmit').disabled = false; return; }   // 送信できなかった（入力内容はそのまま残す）
  if (!ed.resubmit) clearDraft(f);
  // 送信できたら入力画面を閉じる。申請番号は処理が終わると右下に出て、「自分が申請したもの」に並ぶ
  // 「何をしたいですか？」から来た申請で、続けて要りそうなものがあれば「新しく申請する」に案内を出す
  const nx = ed.intent && ed.intent.next;
  st.editor = null; st.sel = null; if (nx && nx.length) { st.view = 'new'; st.nextHint = nx; } else st.view = 'mine'; render(); showPending();
}
/* 申請前の確認：入れた内容と承認ルートを並べて見せる。「この内容で申請する」で true */
function confirmSubmit(ed, f, title, res, note) {
  return new Promise(ok => {
    const bg = document.createElement('div'); bg.className = 'modal-bg';
    const steps = res.route.filter(s => !s.skipped);
    const app = edApplicant();
    bg.innerHTML = `<div class="modal wide" role="dialog" aria-label="申請内容の確認">
      <h3>${ed.resubmit ? '再申請' : '申請'}の内容を確認してください</h3>
      <div class="muted">まだ送信していません。内容を確かめて、下の「${ed.resubmit ? 'この内容で再申請する' : 'この内容で申請する'}」を押してください。</div>
      <div class="cf-head"><div><span class="muted">件名</span><b>${esc(title)}</b></div><div><span class="muted">フォーム</span>${esc(f.Title)}</div>
        <div><span class="muted">申請者</span>${esc(app.Title)}（${esc(app.Dept || '')}）${ed.proxyFor ? `<span class="badge b-warn">代理申請（あなたが代わりに出す）</span>` : ''}</div></div>
      <div class="cf-body" data-req="${esc(ed.resubmit ? ed.resubmit.RequestNo : '')}" data-app="${esc(st.me.upn)}">
        ${dataCard(f, ed.data, null, { req: ed.resubmit ? ed.resubmit.RequestNo : '', app: st.me.upn }).replace(/<button class="mini noprint" data-copy[^>]*>.*?<\/button>/, '')}
        ${contractAttendCard(ed.data)}${staffImpactCard(ed.data, f.FormCode)}
        ${note ? `<div class="card"><h3>修正コメント</h3><div style="white-space:pre-wrap">${esc(note)}</div></div>` : ''}
        <div class="card"><h3>承認ルート</h3><ol class="cf-route">${steps.map(s => `<li><b>${esc(s.name)}</b>　${esc(s.upns.map(nameOf).join(' / '))}${s.type === '決裁' ? '<span class="badge b-warn">決裁</span>' : ''}</li>`).join('')}</ol>
          ${res.post.length ? `<div class="muted">決裁のあと：${esc(res.post.map(p => p.name).join('、'))}</div>` : ''}
          ${res.circulate.length ? `<div class="muted">回覧（決裁後に共有）：${esc(res.circulate.map(nameOf).join('、'))}</div>` : ''}</div>
      </div>
      <div class="actions cf-btns"><button id="cfBack">← 戻って直す</button><span style="flex:1"></span><button class="pri" id="cfGo">${ed.resubmit ? 'この内容で再申請する' : 'この内容で申請する'}</button></div></div>`;
    document.body.appendChild(bg);
    const done = v => { bg.remove(); document.removeEventListener('keydown', esc_); ok(v); };
    const esc_ = e => { if (e.key === 'Escape') done(false); };
    document.addEventListener('keydown', esc_);
    bg.querySelector('#cfBack').onclick = () => done(false);
    bg.querySelector('#cfGo').onclick = () => done(true);
    bg.onclick = e => { if (e.target === bg) done(false); };
    bg.querySelector('#cfGo').focus();
  });
}

/* 判断の確かめ（承認・決裁・差し戻し・却下・作業完了・後処理完了）。押し間違いを防ぐため、判断・申請・コメント・差し戻し先を出す */
const DECIDE = {
  '承認': { cls: 'ok', btn: 'この内容で承認する', note: '承認すると、次の人に回ります。' },
  '決裁': { cls: 'ok', btn: 'この内容で決裁する', note: '決裁すると、この申請は決まりです（後処理・回覧があればそちらへ）。' },
  '作業完了': { cls: 'ok', btn: 'この内容で作業を終える', note: '入れた内容と書類が申請に書き込まれ、次の段へ進みます。' },
  '確認して完了': { cls: 'ok', btn: '確かめて完了にする', note: 'この申請は完了になります。' },
  '後処理完了': { cls: 'ok', btn: '後処理を完了にする', note: '後処理を完了にします。' },
  '差し戻し': { cls: 'warn', btn: 'この内容で差し戻す', note: '差し戻し先から、承認をやり直します。取り消される承認をした人にも通知が届きます。' },
  '却下': { cls: 'ng', btn: 'この内容で却下する', note: '却下すると、この申請は終わります（元に戻せません）。' }
};
function decideBox(kind, o) {
  const D = DECIDE[kind] || DECIDE['承認'];
  return new Promise(ok => {
    const bg = document.createElement('div'); bg.className = 'modal-bg';
    bg.innerHTML = `<div class="modal decide d-${D.cls}" role="dialog" aria-label="判断の確認">
      <div class="dc-kind">${esc(kind)}</div><h3>この内容で${esc({ '差し戻し': '差し戻します', '作業完了': '作業を終えます', '確認して完了': '完了にします', '後処理完了': '後処理を完了にします' }[kind] || kind + 'します')}か？</h3>
      <dl class="dc-dl"><dt>申請</dt><dd>${esc(o.title || '')}<div class="muted">${esc(o.no || '')}${o.applicant ? '　申請者 ' + esc(o.applicant) : ''}${o.amount ? '　' + esc(o.amount) : ''}</div></dd>
        ${o.step ? `<dt>あなたの段</dt><dd>${esc(o.step)}</dd>` : ''}
        ${o.to ? `<dt>差し戻し先</dt><dd><b>${esc(o.to)}</b></dd>` : ''}
        <dt>コメント</dt><dd>${o.comment ? `<div class="dc-cm">${esc(o.comment)}</div>` : '<span class="muted">（なし）</span>'}</dd></dl>
      <div class="muted" style="margin-top:8px">${esc(D.note)}</div>
      <div class="actions cf-btns"><button id="dcNo">← 戻る</button><span style="flex:1"></span><button class="${D.cls === 'ok' ? 'pri' : D.cls}" id="dcGo">${esc(D.btn)}</button></div></div>`;
    document.body.appendChild(bg);
    const done = v => { bg.remove(); document.removeEventListener('keydown', k); ok(v); };
    const k = e => { if (e.key === 'Escape') done(false); };
    document.addEventListener('keydown', k);
    bg.querySelector('#dcNo').onclick = () => done(false); bg.querySelector('#dcGo').onclick = () => done(true);
    bg.onclick = e => { if (e.target === bg) done(false); }; bg.querySelector('#dcNo').focus();   // 初めは「戻る」に（Enter の押し間違いで送らない）
  });
}
/* 確かめの画面（はい・やめる）。points は箇条書き */
function confirmBox(title, points) {
  return new Promise(ok => {
    const bg = document.createElement('div'); bg.className = 'modal-bg';
    bg.innerHTML = `<div class="modal" role="dialog" aria-label="確認"><h3>${esc(title)}</h3>
      ${(points || []).length ? `<ul class="muted" style="margin:8px 0 0;padding-left:18px">${points.map(x => `<li>${esc(x)}</li>`).join('')}</ul>` : ''}
      <div class="actions cf-btns"><button id="cbNo">やめる</button><span style="flex:1"></span><button class="pri" id="cbGo">はい、渡す</button></div></div>`;
    document.body.appendChild(bg);
    const done = v => { bg.remove(); document.removeEventListener('keydown', k); ok(v); };
    const k = e => { if (e.key === 'Escape') done(false); };
    document.addEventListener('keydown', k);
    bg.querySelector('#cbNo').onclick = () => done(false); bg.querySelector('#cbGo').onclick = () => done(true);
    bg.onclick = e => { if (e.target === bg) done(false); }; bg.querySelector('#cbGo').focus();
  });
}

init();
</script>

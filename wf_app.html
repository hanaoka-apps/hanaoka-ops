<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>社内ワークフロー | 花岡車輌</title>
<link rel="icon" type="image/png" href="favicon_wf.png">
<link rel="apple-touch-icon" href="apple-touch-icon-wf.png">
<link rel="manifest" href="wf_app.webmanifest">
<meta name="apple-mobile-web-app-title" content="ワークフロー">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#23268f">
<script src="https://cdn.jsdelivr.net/npm/@azure/msal-browser@3.10.0/lib/msal-browser.min.js" integrity="sha384-yXVL3cgcbuPa1TOmTYdr5MVOeFWnnXoYXcSIPBJ4lrnGHn8EZrbyurhG/xZMygBB" crossorigin="anonymous"></script>
<script src="hanaoka_auth.js"></script>
<script src="wf-engine.js"></script>
<script src="settle_view.js"></script>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:"Segoe UI","Meiryo","Hiragino Sans",sans-serif;background:var(--bg);color:var(--txt);font-size:14px}
button{font-family:inherit;font-size:13px;cursor:pointer;border-radius:6px;border:1px solid var(--line);background:#fff;padding:6px 14px}
button.pri{background:var(--pri);border-color:var(--pri);color:#fff}
button.warn{background:#fff;border-color:var(--warn);color:var(--warn)}
button.ng{background:#fff;border-color:var(--ng);color:var(--ng)}
button:disabled{opacity:.5;cursor:default}
input,select,textarea{font-family:inherit;font-size:14px;padding:6px 8px;border:1px solid #c9d1de;border-radius:5px;background:#fff;width:100%}
textarea{min-height:70px;resize:vertical}
/* ログイン */
#loginScreen{display:flex;height:100vh;align-items:center;justify-content:center}
.login-card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:32px 40px;text-align:center;box-shadow:0 2px 10px rgba(0,0,0,.06)}
.login-card h1{font-size:20px;margin:0 0 6px}.login-card p{color:var(--sub);margin:0 0 20px}
#loginError{display:none;color:var(--ng);margin-top:12px}
/* アプリ */
#app{display:none;flex-direction:column;height:100vh}
header{display:flex;align-items:center;gap:12px;background:#fff;border-bottom:1px solid var(--line);padding:8px 16px}
header h1{font-size:16px;margin:0;color:var(--pri)}
header .sp{flex:1}
#devBar{display:none;background:#fff8d9;border-bottom:1px solid #eadb99;padding:5px 16px;font-size:12px;gap:8px;align-items:center}
#devBar select{width:auto;font-size:12px;padding:2px 4px}
#notice{display:none;background:var(--warn-l);color:var(--warn);padding:6px 16px;font-size:13px}
nav#tabs{display:flex;gap:2px;background:#fff;border-bottom:1px solid var(--line);padding:0 10px;overflow-x:auto}
nav#tabs a{padding:10px 14px;color:#48505a;text-decoration:none;border-bottom:3px solid transparent;white-space:nowrap;cursor:pointer}
nav#tabs a.active{color:var(--pri);font-weight:700;border-bottom-color:var(--pri)}
nav#tabs .cnt{display:inline-block;min-width:18px;padding:0 5px;margin-left:5px;border-radius:9px;background:var(--ng);color:#fff;font-size:11px;text-align:center}
nav#tabs .cnt.zero{background:#c9d1de}
#statusBar{padding:4px 16px;font-size:12px;color:var(--sub);min-height:22px}
#statusBar.err{color:var(--ng)}#statusBar.busy{color:var(--pri)}
#toasts{position:fixed;right:16px;bottom:16px;z-index:100;display:flex;flex-direction:column;gap:8px;max-width:420px}
.toast{background:#1e2533;color:#fff;padding:10px 14px;border-radius:8px;box-shadow:0 4px 14px rgba(0,0,0,.2);font-size:13px;animation:tin .2s ease-out}
.toast.err{background:var(--ng)}
@keyframes tin{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}
main{flex:1;overflow:hidden;display:flex}
.list{width:380px;min-width:300px;border-right:1px solid var(--line);overflow:auto;background:#fff}
.detail{flex:1;overflow:auto;padding:16px 22px}
/* 一覧（左から2列目）をたためる：境目の細い帯を押す。たたんだかどうかはこのブラウザに覚える */
.ltgl{flex:none;width:14px;display:flex;align-items:flex-start;justify-content:center;padding-top:14px;border-right:1px solid var(--line);background:#f7f9fc;color:var(--sub);cursor:pointer;font-size:13px;user-select:none}.ltgl:hover{background:var(--pri-l,#e3edf9);color:var(--pri)}
main.list-mini .list{display:none}
main.list-mini .ltgl{width:34px;padding-top:12px;flex-direction:column;align-items:center;gap:6px;background:var(--pri-l,#e3edf9);color:var(--pri);font-weight:700}
.ltgl .lt-v{writing-mode:vertical-rl;letter-spacing:.15em;font-size:12px}
.empty .lt-open{margin-top:10px}
.list{display:flex;flex-direction:column}
.filters{position:sticky;top:0;z-index:5;background:#f7f9fc;border-bottom:1px solid var(--line);padding:8px 10px;display:grid;grid-template-columns:1fr 1fr;gap:6px}
.filters input,.filters select{font-size:12.5px;padding:4px 6px}
.filters .q{grid-column:1 / -1}
.filters .subs{grid-column:1 / -1;display:flex;gap:4px;flex-wrap:wrap;margin-bottom:2px}
.filters .subs button{font-size:12.5px;padding:3px 10px;border-radius:999px;background:#fff}
.filters .subs button span{display:inline-block;margin-left:5px;color:var(--sub);font-size:11.5px}
.filters .subs button.on{background:var(--pri);border-color:var(--pri);color:#fff}.filters .subs button.on span{color:#dce8f7}
.filters details.dates{grid-column:1 / -1;font-size:12.5px;color:var(--sub)}.filters details.dates summary{cursor:pointer;padding:2px 0}
.filters details.dates div{display:flex;align-items:center;gap:6px;margin-top:4px}.filters details.dates input{flex:1}
button.link{border:none;background:none;color:var(--pri);padding:2px 4px}button.link:hover{text-decoration:underline}
.filters .foot{grid-column:1 / -1;display:flex;align-items:center;gap:8px;font-size:12px;color:var(--sub)}
.filters .foot button{font-size:12px;padding:3px 10px}
.filters .foot .sp{flex:1}
.rows{flex:1}
.row{padding:10px 14px;border-bottom:1px solid #eef1f6;cursor:pointer}
.row:hover{background:#f7f9fc}.row.sel{background:var(--pri-l)}
.row .t{font-weight:600;margin-bottom:3px}.row .m{font-size:12px;color:var(--sub)}
/* 一覧のカード：左の色の線＝状態 */
.row{border-left:4px solid transparent}
.row.s-run{border-left-color:var(--pri)}.row.s-ok{border-left-color:var(--ok)}.row.s-warn{border-left-color:var(--warn-bar)}.row.s-ng{border-left-color:var(--ng)}.row.s-gray{border-left-color:#b8c1d1}
.row .rt{display:flex;align-items:flex-start;gap:8px}.row .rt .t{flex:1;margin:0;line-height:1.4}
.row .no{font-size:11.5px;color:var(--sub);margin:2px 0 4px}
.row .m2{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--sub)}.row .m2 b{color:var(--txt);font-weight:600}
.row .m2 .amt{color:var(--txt);font-weight:600}.row .m2 .up{margin-left:auto}
.row .attr{font-size:11.5px;color:var(--warn);margin-top:3px}
.pill{display:inline-flex;align-items:center;gap:4px;padding:2px 10px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap;flex:none}
.pill i{font-style:normal;font-size:11px}.pill.big{font-size:13.5px;padding:4px 14px}
.p-run{background:var(--pri-l);color:var(--pri)}.p-ok{background:var(--ok-l);color:var(--ok)}.p-warn{background:var(--warn-l);color:var(--warn)}.p-ng{background:var(--ng-l);color:var(--ng)}.p-gray{background:#eef1f6;color:var(--sub)}
.empty{padding:30px;color:var(--sub);text-align:center}
.badge{display:inline-block;padding:1px 8px;border-radius:10px;font-size:12px;margin-right:4px;white-space:nowrap}
.b-run{background:var(--pri-l);color:var(--pri)}.b-ok{background:var(--ok-l);color:var(--ok)}
.b-warn{background:var(--warn-l);color:var(--warn)}.b-ng{background:var(--ng-l);color:var(--ng)}.b-gray{background:#eef1f6;color:var(--sub)}
.card{background:#fff;border:1px solid var(--line);border-radius:8px;padding:14px 18px;margin-bottom:14px}
.card h3{margin:0 0 10px;font-size:14px;color:var(--sub);font-weight:600}
h2{font-size:18px;margin:0 0 6px}
.kv{display:grid;grid-template-columns:170px 1fr;gap:6px 14px}
.kv .k{color:var(--sub)}.kv .kv-sec{grid-column:1 / -1;font-weight:600;font-size:13px;color:var(--pri);border-bottom:1px solid var(--line);padding:8px 0 3px;margin-top:4px}.kv .kv-sec:first-child{padding-top:0;margin-top:0}.kv .v{white-space:pre-wrap;word-break:break-word}
.kv .v.changed{background:#fff3b0;border-radius:3px;padding:0 4px}
.kv .v .was{display:block;color:var(--sub);font-size:12px;text-decoration:line-through}
.return-banner{border:1px solid var(--warn);border-left:5px solid var(--warn);background:var(--warn-l);border-radius:6px;padding:10px 14px;margin-bottom:14px}
.return-banner b{color:var(--warn)}
.return-banner{border-color:#e7b3ad;border-left-color:var(--ng);background:var(--ng-l)}.return-banner b{color:var(--ng)}
.return-banner .rb-why{margin-top:6px;background:#fff;border-radius:6px;padding:8px 12px;white-space:pre-wrap}
.return-banner .actions{margin-top:10px}
.return-banner.gray{border-color:var(--line);border-left-color:#b8c1d1;background:#f4f6f9}.return-banner.gray b{color:var(--txt)}
/* 詳細の見出し */
.dh{display:flex;gap:18px;align-items:flex-start;background:#fff;border:1px solid var(--line);border-radius:10px;padding:16px 20px;margin-bottom:14px;flex-wrap:wrap}
.dh-l{flex:1;min-width:280px}
.dh-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.dh-no{font-size:12.5px;color:var(--sub)}
.dh h2{font-size:20px;margin:8px 0 4px}
.dh-next{font-size:13px;color:var(--sub)}.dh-next b{color:var(--txt)}
.dh .actions{margin-top:12px}
.dh-r{min-width:220px;border-left:1px solid var(--line);padding-left:18px;display:grid;gap:6px;font-size:13px}
.dh-r div{display:flex;gap:12px}.dh-r span{color:var(--sub);width:56px;flex:none}.dh-r b{font-weight:600}.dh-r b.amt{font-size:17px}
.h3f{display:flex;align-items:center;gap:8px}.h3f span:first-child{flex:1}
button.mini{font-size:12px;padding:2px 10px;color:var(--sub)}
@media (max-width:800px){.dh-r{border-left:0;padding-left:0;width:100%}}
.route{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.route .st{border:1px solid var(--line);border-radius:6px;padding:4px 10px;background:#fff;font-size:13px}
.route .st small{display:block;color:var(--sub);font-size:11px}
.route .st.done{background:var(--ok-l);border-color:#b5dfc1}.route .st.cur{background:var(--pri-l);border-color:var(--pri);font-weight:600}
.route .st.skip{opacity:.45;text-decoration:line-through}.route .st.kessai{border-color:var(--warn)}
.route .ar{color:#aab}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.hist div{padding:4px 0;border-bottom:1px dashed #eef1f6;font-size:13px}
/* 新規申請 */
.catalog{padding:20px;overflow:auto;flex:1}
.catalog h3{font-size:14px;color:var(--sub);margin:16px 0 8px}
.forms{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.fcard{background:#fff;border:1px solid var(--line);border-radius:8px;padding:12px 14px;cursor:pointer}
.fcard:hover{border-color:var(--pri)}.fcard .n{font-weight:600}.fcard .d{font-size:12px;color:var(--sub);margin-top:4px}
.editor{display:flex;flex:1;overflow:hidden}
.editor .form{flex:1;overflow:hidden;display:flex;flex-direction:column;padding:0}
.editor .fbody{flex:1;overflow:auto;padding:16px 24px 24px}
.fhead{margin-bottom:12px}.fhead .back{font-size:12.5px;color:var(--pri);cursor:pointer;text-decoration:none}.fhead h2{font-size:20px;margin:6px 0 0}
/* 入力の枠（区切りごと） */
.fsec{background:#fff;border:1px solid var(--line);border-radius:10px;padding:16px 20px 4px;margin-bottom:14px}
.fsec h3{margin:0 0 12px;font-size:14.5px;color:var(--txt);padding-left:10px;border-left:4px solid var(--pri);line-height:1.2}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:0 20px}.fgrid>.fld{grid-column:1 / -1}.fgrid>.fld.half{grid-column:auto}
.fgrid>.fld.half input,.fgrid>.fld.half select{max-width:none!important}
.money{display:flex;align-items:center;gap:6px;max-width:260px}.money input{text-align:right;font-size:15px;font-variant-numeric:tabular-nums}.money span{color:var(--sub)}
table.tbl input.num{text-align:right}
/* 下に固定のバー */
.fbar{display:flex;align-items:center;gap:10px;padding:10px 24px;background:#fff;border-top:1px solid var(--line);box-shadow:0 -2px 8px rgba(0,0,0,.04)}
.fbar .left{font-size:13px;color:var(--sub)}.fbar .left b{color:var(--ng);font-size:15px}
.fbar .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:1px}.fbar .dot.ng{background:var(--ng)}.fbar .dot.ok{background:var(--ok)}
.fbar button{padding:8px 18px}
.draftbar{background:var(--pri-l);border-radius:8px;padding:8px 12px;margin-bottom:12px;font-size:13px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
button.mini2{font-size:12px;padding:3px 10px}
/* 申請前の確認 */
.modal.wide{width:760px;max-height:calc(100vh - 40px);display:flex;flex-direction:column}
.modal.wide .cf-body{overflow:auto;margin:12px -4px 0;padding:0 4px;flex:1}
.cf-head{display:grid;gap:4px;background:#f7f9fc;border-radius:8px;padding:10px 14px;margin-top:12px;font-size:13.5px}
.cf-head span.muted{display:inline-block;width:64px}
.cf-route{margin:0;padding-left:22px;line-height:1.9;font-size:13.5px}
.cf-btns{border-top:1px solid var(--line);padding-top:12px}.cf-btns button{padding:8px 18px}
.editor .side{width:340px;border-left:1px solid var(--line);background:#fff;overflow:auto;padding:16px}
.fld{margin-bottom:14px}.fld label.l{display:block;font-weight:600;margin-bottom:4px}
details.paste{margin:0 0 14px;padding:10px 14px}details.paste summary{cursor:pointer;font-weight:600;color:var(--pri)}
.fld.pasted{background:var(--warn-l);border-radius:6px;box-shadow:0 0 0 6px var(--warn-l)}
.ftabs{display:flex;gap:4px;flex-wrap:wrap;border-bottom:2px solid var(--line);padding-bottom:0}.ftabs button{border:1px solid var(--line);border-bottom:none;border-radius:6px 6px 0 0;background:var(--bg);margin-bottom:-2px}.ftabs button.on{background:#fff;border-color:var(--pri);border-bottom:2px solid #fff;color:var(--pri);font-weight:600}.ftabs .cnt{font-size:12px;color:var(--sub)}
.fld .fwarn{color:var(--warn);background:var(--warn-l);border-radius:5px;padding:4px 8px;margin-top:4px;font-size:12.5px}
.fld .req{color:var(--ng);margin-left:4px;font-size:12px}
.fld .opts label{display:inline-flex;align-items:center;gap:4px;margin:2px 14px 2px 0;font-weight:normal}
.fld .opts input{width:auto}
.fld.err input,.fld.err textarea,.fld.err select{border-color:var(--ng)}
.desc{white-space:pre-wrap;background:#f7f9fc;border:1px solid var(--line);border-radius:6px;padding:10px 12px;color:#445;font-size:13px;margin-bottom:16px}
table.tbl{border-collapse:collapse;width:100%}table.tbl td,table.tbl th{border:1px solid var(--line);padding:3px}
table.tbl th{background:#f3f6fa;font-weight:600;font-size:12px}
.muted{color:var(--sub);font-size:12px}
.proute{counter-reset:st}.proute div{padding:6px 8px 6px 34px;border-left:3px solid var(--pri);margin-bottom:6px;background:#f7f9fc;font-size:13px;position:relative;border-radius:0 6px 6px 0}
.proute div:not(.skip)::before{counter-increment:st;content:counter(st);position:absolute;left:8px;top:7px;width:18px;height:18px;border-radius:50%;background:var(--pri);color:#fff;font-size:11px;text-align:center;line-height:18px}
.proute div.kessai::before{background:var(--warn)}
.proute div.skip{border-left-color:#ccc;color:#999}
.proute div.kessai{border-left-color:var(--warn)}
/* 進み具合（一覧・詳細で共通）。点＝段、線＝流れ、赤い弧＝差し戻しで戻った線 */
.pg{overflow-x:auto;padding-bottom:4px}
.pg-row{display:flex;position:relative}
.pg-n{flex:0 0 auto;position:relative;text-align:center}
.pg-n .pg-l{font-size:12px;color:var(--sub);height:32px;display:flex;align-items:flex-end;justify-content:center;line-height:1.2;padding:0 2px}
.pg-n .pg-dot{width:14px;height:14px;border-radius:50%;background:#d5dbe6;margin:6px auto;position:relative;z-index:1;border:2px solid #fff;box-shadow:0 0 0 1px #d5dbe6}
.pg-n::before{content:"";position:absolute;left:-50%;right:50%;top:45px;height:3px;background:#d5dbe6}
.pg-n:first-child::before{display:none}
.pg-n .pg-d{font-size:12px;font-weight:600;min-height:16px}
.pg-n .pg-w{font-size:11px;color:var(--sub);min-height:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 2px}
.pg-n.done .pg-dot,.pg-n.done::before,.pg-n.cur::before{background:var(--pri);box-shadow:0 0 0 1px var(--pri)}
.pg-n.done::before,.pg-n.cur::before{box-shadow:none}
.pg-n.cur .pg-dot{background:#fff;box-shadow:0 0 0 3px var(--pri);animation:pgpulse 1.6s infinite}
.pg-n.cur .pg-l{color:var(--pri);font-weight:700}
.pg-n.ret .pg-dot{background:var(--ng);box-shadow:0 0 0 1px var(--ng)}
.pg-n.ng .pg-dot{background:var(--ng);box-shadow:0 0 0 1px var(--ng)}
.pg-n.ng .pg-l,.pg-n.ret .pg-l{color:var(--ng)}
.pg-n.skip{opacity:.4}.pg-n.skip .pg-dot{width:8px;height:8px;margin:9px auto}
.pg-n.fin.done .pg-dot{background:var(--ok);box-shadow:0 0 0 1px var(--ok)}
@keyframes pgpulse{50%{box-shadow:0 0 0 6px rgba(26,95,168,.15)}}
.pg svg{display:block}
#tip{position:fixed;z-index:200;display:none;background:#1e2533;color:#fff;font-size:12px;line-height:1.6;padding:7px 10px;border-radius:7px;max-width:260px;white-space:pre-wrap;pointer-events:none;box-shadow:0 4px 14px rgba(0,0,0,.25)}
[data-tip]{cursor:default}
.pg svg text{font-size:10.5px;fill:var(--ng)}
/* 一覧用の小さい版 */
.pg.mini .pg-n .pg-l,.pg.mini .pg-n .pg-d,.pg.mini .pg-n .pg-w{display:none}
.pg.mini .pg-n .pg-dot{width:10px;height:10px;margin:3px auto}
.pg.mini .pg-n::before{top:8px;height:2px}
.pg.mini .pg-n.skip .pg-dot{width:6px;height:6px;margin:5px auto}
/* 詳細の見出し */
.dhead{display:flex;gap:16px;align-items:flex-start;margin-bottom:12px;flex-wrap:wrap}
.dhead .l{flex:1;min-width:260px}.dhead .r{text-align:right;font-size:12px;color:var(--sub);line-height:1.8}
.dhead .no{font-size:13px;color:var(--sub);margin-top:6px}.dhead .no b{font-size:16px;color:var(--txt);letter-spacing:.5px}
.dhead h2{margin:6px 0 0}
/* 経過（縦のタイムライン） */
.tl{position:relative;margin-left:4px}
.tl-i{display:flex;gap:12px;position:relative;padding-bottom:14px}
.tl-i::before{content:"";position:absolute;left:15px;top:30px;bottom:0;width:2px;background:#e4e8f0}
.tl-i:last-child::before{display:none}
.tl-ic{flex:0 0 32px;height:32px;border-radius:50%;border:1.5px solid #c9d1de;background:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:var(--sub);z-index:1}
.tl-b{flex:1;padding-top:5px;font-size:13px}
.tl-b .t{color:var(--sub);font-size:12px;margin-left:6px}
.tl-c{margin-top:5px;background:#f7f9fc;border-radius:6px;padding:6px 10px;white-space:pre-wrap;color:#334}
.tl-i.k-ok .tl-ic{border-color:var(--pri);color:var(--pri)}
.tl-i.k-fin .tl-ic{background:var(--ok);border-color:var(--ok);color:#fff}
.tl-i.k-ret .tl-ic,.tl-i.k-ng .tl-ic{border-color:var(--ng);color:var(--ng);background:var(--ng-l)}
.tl-i.k-ret .tl-c,.tl-i.k-ng .tl-c{background:var(--ng-l)}
.tl-i.k-wait .tl-ic{border-style:dashed;color:var(--pri)}
.tl-r{font-size:12px;color:var(--warn);font-weight:600;margin:2px 0 10px 44px;padding:2px 10px;background:var(--warn-l);border-radius:10px;display:inline-block}
/* 不在設定 */
#absBtn.on{border-color:var(--warn);color:var(--warn);background:var(--warn-l)}

<script>
'use strict';
/* ============================================================
   接続設定
   ここに書くのは、他の業務アプリと同じ「公開してよい識別子」だけ。
   人・経路・選択肢・文面などの業務データは、すべて SharePoint（WF_*）から読む。
   見られるかどうかは SharePoint の権限がそのまま効く。
   この画面に「誰が何を見てよいか」の判定は書かない（判定のバグがそのまま漏洩になるため）。
   ============================================================ */
/* 全アプリ共通。HUBのサインインをそのまま使う（→ hanaoka_auth.js） */
const MSAL_CONFIG = HanaokaAuth.msalConfig();
const SCOPES = ['User.Read', 'Sites.ReadWrite.All'];
const SITE_PATH = 'hanaokacorp.sharepoint.com:/sites/msteams_7aab51:';

/* 開発モード: localhost で ?dev を付けたときだけ。テストデータとフローの再現で動く */
const DEV = ['localhost', '127.0.0.1'].includes(location.hostname) && new URLSearchParams(location.search).has('dev');

/* ============================================================
   共通
   ============================================================ */
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const lc = s => String(s || '').toLowerCase();
const pj = (v, d) => { if (v == null || v === '') return d; if (typeof v === 'object') return v; try { return JSON.parse(v); } catch { return d; } };
const fmtDT = s => { if (!s) return ''; const d = new Date(s); return `${d.getMonth() + 1}/${d.getDate()} ${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`; };
const yen = n => (n == null || n === '' || isNaN(n)) ? '' : Number(n).toLocaleString('ja-JP') + '円';
const fsize = n => n == null ? '' : n < 1024 * 1024 ? Math.max(1, Math.round(n / 1024)) + 'KB' : (n / 1024 / 1024).toFixed(1) + 'MB';
const encPath = (...segs) => segs.map(encodeURIComponent).join('/');
function status(text, kind) { const b = $('statusBar'); b.className = kind || ''; b.textContent = text || ''; }

/* ============================================================
   状態
   ============================================================ */
const st = {
  me: null,                 // {upn, name, org}
  M: null,                  // マスタ {org, orgByUpn, roles, settings, forms, workflows}
  tasks: [], myReqs: [], allReqs: null,
  view: 'inbox', sel: null, editor: null
};
const nameOf = upn => (st.M.orgByUpn[lc(upn)] || {}).Title || upn;

/* ============================================================
   データの読み書き（本番＝Graph／開発＝テストデータ）
   ============================================================ */
let msalInstance = null, account = null, siteId = null;

async function getToken() {
  try { return (await msalInstance.acquireTokenSilent({ scopes: SCOPES, account })).accessToken; }
  catch { return (await msalInstance.acquireTokenPopup({ scopes: SCOPES })).accessToken; }
}
async function graph(path, opt = {}) {
  const tk = await getToken();
  const r = await fetch('https://graph.microsoft.com/v1.0' + path, { ...opt,
    headers: { Authorization: 'Bearer ' + tk, 'Content-Type': 'application/json',
      Prefer: 'HonorNonIndexedQueriesWarningMayFailRandomly', ...(opt.headers || {}) } });
  if (!r.ok) {
    let detail = ''; try { detail = (await r.json()).error?.message || ''; } catch {}
    const e = new Error(`${r.status}${detail ? ' / ' + detail : ''}`); e.status = r.status; throw e;
  }
  return r.status === 204 ? null : r.json();
}
async function graphAll(path) {
  let out = [], p = path;
  while (p) { const j = await graph(p); out = out.concat(j.value || []); p = j['@odata.nextLink'] ? j['@odata.nextLink'].replace('https://graph.microsoft.com/v1.0', '') : null; }
  return out;
}

const GraphApi = {
  async me() {
    const m = await graph('/me?$select=displayName,userPrincipalName');
    return { upn: lc(m.userPrincipalName), name: m.displayName };
  },
  async items(list, filter) {
    if (!siteId) siteId = (await graph(`/sites/${SITE_PATH}`)).id;
    const q = `/sites/${siteId}/lists/${list}/items?expand=fields&$top=999` + (filter ? `&$filter=${encodeURIComponent(filter)}` : '');
    return (await graphAll(q)).map(i => ({ ...i.fields, id: Number(i.id) }));   // fields にも id（文字列）があるので、数の id をあとに置く
  },
  async masters() {
    const [org, roles, settings, forms, workflows] = await Promise.all(
      ['WF_Org', 'WF_Role', 'WF_Setting', 'WF_Form', 'WF_Workflow'].map(l => this.items(l)));
    return { org, roles, settings, forms, workflows };
  },
  tasks(upn)      { return this.items('WF_Task', `fields/AssigneeUPN eq '${upn}'`); },
  myRequests(upn) { return this.items('WF_Request', `fields/ApplicantUPN eq '${upn}' or fields/ProxyUPN eq '${upn}'`); },   // 代理で出した分も
  allRequests()   { return this.items('WF_Request'); },   // SharePoint が見られる分だけ返す
  async postAction(fields) {
    if (!siteId) siteId = (await graph(`/sites/${SITE_PATH}`)).id;
    const it = await graph(`/sites/${siteId}/lists/WF_Action/items`, { method: 'POST', body: JSON.stringify({ fields: { Result: '受付', ...fields } }) });
    // フローAを直接呼ぶ。伝えるのは行の番号だけ（中身と操作者はフローが SharePoint から読み直す）。
    // URL は WF_Setting にある（公開HTMLには書かない）。呼び出しに失敗しても WF_滞留チェック が数分以内に拾う
    const kick = st.M.settings['flow.urlA'];
    if (kick) fetch(kick, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'text/plain' }, body: JSON.stringify({ id: Number(it.id) }) }).catch(() => {});
    return { id: Number(it.id) };   // 結果は actionResult() で後から確認する（画面は待たせない）
  },
  async actionResult(id) {
    const f = (await graph(`/sites/${siteId}/lists/WF_Action/items/${id}?expand=fields`)).fields;
    return { Result: f.Result, ResultMessage: f.ResultMessage, RequestNo: f.RequestNo };
  },

  /* ---- 添付ファイル
     申請前: 自分の受付フォルダ（WF_Upload/自分のUPN/、本人しか見えない）にアップロードする。
     申請後: フローが保管フォルダ（WF_Attach/年/申請番号/）へ移し、関わる人だけが見られるよう権限を付ける。
     場所の番号（ドライブID）は WF_Setting の files.drives にある */
  drive(name) { return pj(st.M.settings['files.drives'], {})[name]; },
  async upload(file, key, onProgress) {
    const d = this.drive('WF_Upload');
    if (!d) throw new Error('添付ファイルの置き場所が設定されていません（総務にご連絡ください）');
    const start = () => graph(`/drives/${d}/root:/${encPath(st.me.upn, key)}:/createUploadSession`,
      { method: 'POST', body: JSON.stringify({ item: { '@microsoft.graph.conflictBehavior': 'replace' } }) });
    let s;
    try { s = await start(); }
    catch (e) {
      // 受付フォルダがまだ無い（新しく入った人の初めての添付）→ フローに作ってもらってからやり直す
      if (e.status !== 403 && e.status !== 404) throw e;
      await this.ensureUploadFolder(); s = await start();
    }
    const CH = 327680 * 16;   // 約5MBずつ（320KiB の倍数である必要がある）
    for (let i = 0; i < file.size; i += CH) {
      const end = Math.min(i + CH, file.size);
      const r = await fetch(s.uploadUrl, { method: 'PUT', headers: { 'Content-Range': `bytes ${i}-${end - 1}/${file.size}` }, body: file.slice(i, end) });
      if (!r.ok) throw new Error(`アップロードに失敗しました（${r.status}）`);
      if (onProgress) onProgress(Math.round(end / file.size * 100));
    }
  },
  folderReady: null,
  ensureUploadFolder() {
    // 同時に複数ファイルを選んでも、頼むのは1回だけ
    if (!this.folderReady) this.folderReady = (async () => {
      const { id } = await this.postAction({ Title: 'フォルダ準備', ActionType: 'フォルダ準備' });
      const t0 = Date.now();
      while (Date.now() - t0 < 120000) {
        await new Promise(ok => setTimeout(ok, 2500));
        const r = await this.actionResult(id);
        if (r.Result === '完了') return;
        if (r.Result === 'エラー') throw new Error(r.ResultMessage || '受付フォルダを準備できませんでした');
      }
      throw new Error('受付フォルダの準備に時間がかかっています。しばらくしてからもう一度お試しください');
    })().catch(e => { this.folderReady = null; throw e; });
    return this.folderReady;
  },
  async deleteStaging(key) {
    const d = this.drive('WF_Upload'); if (!d) return;
    await graph(`/drives/${d}/root:/${encPath(st.me.upn, key)}`, { method: 'DELETE' });
  },
  /* 開くためのURL。保管フォルダ → （自分の申請なら）まだ移されていない受付フォルダ の順に探す。
     見る権限が無いときは SharePoint が見つからない扱いにする（ここでは判定しない） */
  async fileUrl(reqNo, key, applicantUpn) {
    const tryGet = async (d, path) => {
      if (!d) return null;
      try { return (await graph(`/drives/${d}/root:/${path}?$select=webUrl`)).webUrl; }
      catch (e) { if (e.status === 404 || e.status === 403) return null; throw e; }
    };
    const yr = reqNo ? reqNo.split('-').slice(-2)[0] : '';   // 申請番号「接頭辞-年-連番」の年（フローと同じ決まり）
    return (reqNo && await tryGet(this.drive('WF_Attach'), encPath(yr, reqNo, key)))
        || ((!applicantUpn || lc(applicantUpn) === st.me.upn) && await tryGet(this.drive('WF_Upload'), encPath(st.me.upn, key)))
        || null;
  },
  /* 中身を取り出す（支払決済の明細 JSON・請求書 PDF を画面の中で見せる）。探す順は fileUrl と同じ */
  async fileBlob(reqNo, key, applicantUpn) {
    const get = async (d, path) => {
      if (!d) return null;
      const r = await fetch(`https://graph.microsoft.com/v1.0/drives/${d}/root:/${path}:/content`, { headers: { Authorization: 'Bearer ' + await getToken() } });
      return r.ok ? r.blob() : null;
    };
    const yr = reqNo ? reqNo.split('-').slice(-2)[0] : '';
    return (reqNo && await get(this.drive('WF_Attach'), encPath(yr, reqNo, key)))
        || ((!applicantUpn || lc(applicantUpn) === st.me.upn) && await get(this.drive('WF_Upload'), encPath(st.me.upn, key)))
        || null;
  },
  /* 組織マスタの同期（WF管理者）：M365（Entra）の上司を読む。業務アプリの User.Read.All（委任・管理者の同意済み。組織図アプリと同じ） */
  async entraUsers() {
    const sc = ['User.Read.All'];
    let tk; try { tk = (await msalInstance.acquireTokenSilent({ scopes: sc, account })).accessToken; } catch { tk = (await msalInstance.acquireTokenPopup({ scopes: sc })).accessToken; }
    let out = [], url = 'https://graph.microsoft.com/v1.0/users?$select=displayName,userPrincipalName,accountEnabled,department&$expand=manager($select=userPrincipalName,displayName)&$top=100';
    while (url) {
      const r = await fetch(url, { headers: { Authorization: 'Bearer ' + tk } });
      if (!r.ok) throw new Error(`M365 の利用者を読めませんでした（${r.status}）`);
      const j = await r.json(); out = out.concat(j.value || []); url = j['@odata.nextLink'] || null;
    }
    return out.map(u => ({ upn: lc(u.userPrincipalName), name: u.displayName, enabled: u.accountEnabled !== false, dept: u.department || '', mgr: u.manager ? lc(u.manager.userPrincipalName) : '' }));
  },
  async updateOrg(id, fields) {
    if (!siteId) siteId = (await graph(`/sites/${SITE_PATH}`)).id;
    await graph(`/sites/${siteId}/lists/WF_Org/items/${id}/fields`, { method: 'PATCH', body: JSON.stringify(fields) });
  },
  /* AI の使用量（WF管理者）：AI_Request の行（用途・状態・モデル・トークン数・頼んだ人）。見られるのは SharePoint の権限どおり */
  async aiUsage(since) {
    if (!siteId) siteId = (await graph(`/sites/${SITE_PATH}`)).id;
    const rows = await graphAll(`/sites/${siteId}/lists/AI_Request/items?expand=fields(select=Title,Status,Model,InTokens,OutTokens,Caller,Created)&$filter=${encodeURIComponent(`fields/Created ge '${since}'`)}&$top=999`);
    return rows.map(i => ({ use: i.fields.Title || '', status: i.fields.Status || '', model: i.fields.Model || '', inT: Number(i.fields.InTokens) || 0, outT: Number(i.fields.OutTokens) || 0,
      caller: i.fields.Caller || '', at: i.fields.Created || i.createdDateTime, by: (i.createdBy && i.createdBy.user && i.createdBy.user.displayName) || '' }));
  },
  /* AI に頼む（11_Claude読み取りの仕組み.md）：AI_Request に行（自分の行だけ見られる）→ PA「AI_Claude中継」を呼ぶ → 行が完了になるまで待つ。
     依頼の本文（書類の中身）は呼び出しで渡すだけで SharePoint に残さない。URL は WF_Setting の flow.urlAI（公開 HTML には書かない） */
  async aiAsk(use, caller, body) {
    const url = st.M.settings['flow.urlAI']; if (!url) throw new Error('AI の読み取りの設定（flow.urlAI）がありません（総務へ）');
    if (!siteId) siteId = (await graph(`/sites/${SITE_PATH}`)).id;
    const it = await graph(`/sites/${siteId}/lists/AI_Request/items`, { method: 'POST', body: JSON.stringify({ fields: { Title: use, Status: '受付', Caller: caller } }) });
    const payload = { id: Number(it.id), body }; if (body.fallbacks) payload.beta = 'server-side-fallback-2026-07-01';
    await fetch(url, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'text/plain' }, body: JSON.stringify(payload) }).catch(() => {});
    const t0 = Date.now();
    while (Date.now() - t0 < 5 * 60 * 1000) {
      await new Promise(ok => setTimeout(ok, 3000));
      let f; try { f = (await graph(`/sites/${siteId}/lists/AI_Request/items/${it.id}?expand=fields`)).fields; } catch { continue; }
      if (f.Status === '完了') { const r = pj(f.ResultJson, {}); return { text: r.text || '', stop: r.stop_reason, model: r.model }; }
      if (f.Status === 'エラー') throw new Error('AI の読み取りに失敗しました：' + String(f.ResultMessage || '').slice(0, 200));
    }
    throw new Error('AI の読み取りが5分たっても終わりません。しばらくしてからもう一度お試しください');
  },
  /* 自分の受付フォルダのファイルを読む（支払アプリが置いた「中身入りで開く」ための下書き） */
  async readUpload(key) {
    const b = await this.fileBlob('', key, st.me.upn);
    if (!b) throw new Error('受付フォルダに見つかりません：' + key);
    return b.text();
  },
  /* ---- 雇用契約の台帳（設定 contract.ledger の site＝役員と総務幹部だけのサイト）。読めるかどうかは SharePoint の権限どおり。
     給与のデータ（人事情報・勤怠）も同じサイトの「給与データ」フォルダから読む（画面の中で集計し、台帳には集計だけを書く） */
  async ledgerSite() {
    if (!this._ls) { const u = new URL(ledgerCfg().site); this._ls = (await graph(`/sites/${u.hostname}:${u.pathname}`)).id; }
    return this._ls;
  },
  async ledgerItems() {
    const s = await this.ledgerSite();
    return (await graphAll(`/sites/${s}/lists/${ledgerCfg().list}/items?expand=fields&$top=999`)).map(i => ({ ...i.fields, id: Number(i.id) }));
  },
  async ledgerSave(id, fields) {
    const s = await this.ledgerSite(), L = ledgerCfg().list;
    if (id) { await graph(`/sites/${s}/lists/${L}/items/${id}/fields`, { method: 'PATCH', body: JSON.stringify(fields) }); return id; }
    return Number((await graph(`/sites/${s}/lists/${L}/items`, { method: 'POST', body: JSON.stringify({ fields }) })).id);
  },
  async staffLoad() {
    const [units, persons, openings, snaps] = await Promise.all(['STF_Unit', 'STF_Person', 'STF_Opening', 'STF_Snapshot'].map(l => this.items(l)));
    return { units, persons, openings, snaps };
  },
  async staffSave(list, id, fields) {
    if (!siteId) siteId = (await graph(`/sites/${SITE_PATH}`)).id;
    if (id) { await graph(`/sites/${siteId}/lists/${list}/items/${id}/fields`, { method: 'PATCH', body: JSON.stringify(fields) }); return id; }
    return Number((await graph(`/sites/${siteId}/lists/${list}/items`, { method: 'POST', body: JSON.stringify({ fields }) })).id);
  },
  async payrollJson(rel) {   // 無いファイルは null
    const s = await this.ledgerSite();
    const r = await fetch(`https://graph.microsoft.com/v1.0/sites/${s}/drive/root:/${encodeURI(ledgerCfg().payrollFolder + '/' + rel)}:/content`, { headers: { Authorization: 'Bearer ' + await getToken() } });
    if (r.status === 404) return null;
    if (!r.ok) throw new Error(`給与のデータを読めませんでした（${r.status}）`);
    return r.json();
  }
};

const DevApi = {
  asUpn: null,
  async me() { const p = st.M ? st.M.orgByUpn[this.asUpn] : null; return { upn: this.asUpn, name: p ? p.Title : this.asUpn }; },
  async masters() {
    const D = window.DEV_DATA;
    return { org: D.org, roles: D.roles, workflows: D.workflows,
      settings: (D.settings || []).filter(s => s.Title !== 'app.title').concat([{ Title: 'app.title', Value: '社内ワークフロー（開発）' }]),
      forms: D.forms.map(f => ({ ...f, Active: true })) };

/* 自動更新
   ・操作のあと、次の段の起票（Power Automate の2本目のフロー）は1分ほど遅れて動く。
     そのため操作直後の読み込みでは TODO や次の承認者が出ない。約75秒後にもう一度読み込む
   ・開いている間は1分ごとに読み込む（他の人の承認結果も反映される）
   ・申請の入力中・処理の送信中・画面が裏にあるときは読み込まない */
let busy = false, followUpTimer = null;
function canAutoRefresh() {
  const typing = ['INPUT', 'TEXTAREA', 'SELECT'].includes((document.activeElement || {}).tagName)
              || [...document.querySelectorAll('#detail textarea')].some(t => t.value.trim());   // 書きかけのコメントを消さない
  const settle = !!document.querySelector('#settleView .sv');   // 支払決済の明細を見ている間は描き直さない（見ている請求書が変わらないように。「更新」で読み込む）
  const drawer = !!document.querySelector('.sdr-bg'), own = ['staff', 'contract'].includes(st.view);   // ドロワーで直している間・人員表と台帳は描き直さない（それぞれの「読み直す」で読む）
  return !busy && !st.editor && !typing && !settle && !drawer && !own && document.visibilityState === 'visible';
}
function startAutoRefresh() {
  setInterval(() => { if (canAutoRefresh()) load(true); }, 60000);
  document.addEventListener('visibilitychange', () => { if (canAutoRefresh()) load(true); });
}
function scheduleFollowUp() {
  // 次の段の起票（フローB）は通常30秒前後で終わる。念のため90秒後にもう一度
  clearTimeout(followUpTimer);
  followUpTimer = setTimeout(() => {
    if (canAutoRefresh()) load(true);
    followUpTimer = setTimeout(() => { if (canAutoRefresh()) load(true); }, 60000);
  }, 30000);
}

async function load(quiet) {
  try {
    if (!quiet) status('読み込み中…', 'busy');
    if (!st.M) {
      const m = await api.masters();
      m.org = m.org.filter(p => p.Active !== false);
      m.orgByUpn = Object.fromEntries(m.org.map(p => [lc(p.UPN), p]));
      m.settings = Object.fromEntries(m.settings.map(s => [s.Title, s.Value]));
      m.forms = m.forms.map(f => ({ ...f, ...pj(f.OptionsJson, {}), fields: pj(f.FieldsJson, []), followups: pj(f.FollowupsJson, f.Followups || []) })).sort((a, b) => (a.Sort || 0) - (b.Sort || 0));
      st.M = m;
      $('appTitle').textContent = m.settings['app.title'] || '社内ワークフロー';
      document.title = ($('appTitle').textContent) + ' | 花岡車輌';
      if (m.settings['app.notice']) { $('notice').textContent = m.settings['app.notice']; $('notice').style.display = 'block'; }
    }
    st.me = await api.me();
    st.me.org = st.M.orgByUpn[st.me.upn] || null;
    $('userName').textContent = st.me.name; $('userName').title = 'サインイン中のアカウント：' + st.me.upn;
    $('avatar').textContent = String(st.me.name || '').replace(/\s/g, '').slice(0, 1); $('userDept').textContent = (st.me.org && st.me.org.Dept) || st.me.upn;
    renderAbsenceBtn();
    const [tasks, myReqs] = await Promise.all([api.tasks(st.me.upn), api.myRequests(st.me.upn)]);
    st.tasks = tasks; st.myReqs = myReqs;
    // 裏の処理がまだなら、押した直後の状態を保つ（再読み込みで表示が戻らないように）
    st.tasks.forEach(t => { const o = optimistic.get(t.id); if (!o) return; if (t.Status === o || (o === '既読' && t.Status === '確認済')) optimistic.delete(t.id); else t.Status = o; });
    st.allReqs = hasAllView() ? await api.allRequests() : null;
    status(`更新 ${fmtDT(new Date())}` + (st.me.org ? '' : `　※このアカウント（${st.me.upn}）は組織マスタに登録がないため、申請・承認はできません。普段のアカウントでない場合は、右上の「サインアウト」から入り直してください（それでも出るときは総務へ）`), st.me.org ? '' : 'err');
    openDeepLink();
    await openPrefill();
    render();
  } catch (e) {
    status('読み込みに失敗しました: ' + e.message, 'err');
    console.error(e);
  }
}
/* ほかのアプリから中身入りで開く（?new=フォーム&prefill=受付フォルダの下書き）。最初の1回だけ。
   例：支払アプリの「決裁に回す」→ 明細と請求書を受付フォルダに置き、下書き {form, data} を置いて、ここを開く。
   下書きに入っている添付は「今回の申請で受付フォルダから移すもの」として送る（入力画面を閉じても消さない＝もう一度開ける） */
let prefillDone = false;
async function openPrefill() {
  if (prefillDone) return; prefillDone = true;
  const q = new URLSearchParams(location.search), code = q.get('new'), key = q.get('prefill');
  if (!code) return;
  const form = st.M.forms.find(f => f.FormCode === code);
  if (!form) { status(`フォーム「${code}」が見つかりません`, 'err'); return; }
  if (!canSubmit(form)) { status(`「${form.Title}」を申請できる役割に入っていません（総務へ）`, 'err'); return; }
  let data = {};
  if (key) { try { data = pj(await api.readUpload(key), {}).data || {}; } catch (e) { status('中身を読めませんでした：' + e.message, 'err'); return; } }
  const keys = form.fields.filter(fd => fd.type === 'file').flatMap(fd => (data[fd.key] || []).map(x => x.key));
  st.view = 'new'; st.sel = null;
  st.editor = { form, data, draftChecked: true, keepStaged: true, newKeys: new Set(keys), uploads: new Map(keys.map(k => [k, { st: 'ok' }])) };
}
/* Teams通知のリンク（?req=申請番号）から開いたとき、その申請を選んだ状態にする（最初の1回だけ） */
let deepLinkDone = false;
function openDeepLink() {
  if (deepLinkDone) return; deepLinkDone = true;
  const no = new URLSearchParams(location.search).get('req'); if (!no) return;
  const pick = (view, pred) => { const t = st.tasks.filter(pred).sort((a, b) => b.id - a.id)[0]; if (t) { st.view = view; st.sel = 't' + t.id; return true; } };
  if (pick('inbox', t => t.RequestNo === no && (isInbox(t) || isPostTodo(t) || isCircTodo(t)))) return;
  if (st.myReqs.some(r => r.RequestNo === no)) { st.view = 'mine'; st.sel = 'r' + no; return; }
  if (pick('involved', t => t.RequestNo === no)) return;
}

/* 日付だけの列は「日本の0時」が UTC で返るので、この端末の日付に直す */
function localYmd(v) {
  if (!v) return '';
  const d = new Date(v); if (isNaN(d)) return String(v).slice(0, 10);
  const p = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}`;
}
function absenceOf(o) { return o && o.DelegateUPN ? { upn: lc(o.DelegateUPN), from: localYmd(o.DelegateFrom), to: localYmd(o.DelegateTo) } : null; }
const md = ymd => ymd ? `${Number(ymd.slice(5, 7))}/${Number(ymd.slice(8, 10))}` : '';
function renderAbsenceBtn() {
  const b = $('absBtn'); if (!b) return;
  const a = absenceOf(st.me.org), today = localYmd(new Date());
  b.style.display = st.me.org ? '' : 'none';
  if (a && a.to >= today) {
    const now = a.from <= today;
    b.textContent = `${now ? '🏖 不在中' : '🗓 不在予定'}（${md(a.from)}〜${md(a.to)}・代理：${nameOf(a.upn)}）`;
    b.classList.add('on');
  } else { b.textContent = '不在設定'; b.classList.remove('on'); }
}
/* WF 管理者は、ほかの人の分（例：社長の出張）も設定できる（フローA が役割を確かめる） */
/* 役割（WF_Role）に入っているか。画面に出すかどうかだけ（実際に書けるかは SharePoint の権限） */
const hasRole = title => st.M.roles.some(r => r.Title === title && r.Active !== false && (r.MemberUPNs || '').toLowerCase().split(';').map(x => x.trim()).includes(st.me.upn));
const isWfAdmin = () => st.M.roles.some(r => r.Title === 'WF管理者' && r.Active !== false && (r.MemberUPNs || '').toLowerCase().split(';').map(x => x.trim()).includes(st.me.upn));
function openAbsence(forUpn) {
  if (!st.me.org) return;
  const target = (forUpn && st.M.orgByUpn[forUpn]) || st.me.org, tu = lc(target.UPN), mine = tu === st.me.upn;
  const a = absenceOf(target) || { upn: '', from: '', to: '' };
  const bg = document.createElement('div'); bg.className = 'modal-bg';
  bg.innerHTML = `<div class="modal"><h3>不在設定</h3>
    ${isWfAdmin() ? `<label class="l">だれの不在か</label><select id="absFor">${st.M.org.filter(p => p.Active !== false).map(p => `<option value="${esc(lc(p.UPN))}" ${lc(p.UPN) === tu ? 'selected' : ''}>${esc(p.Title)}（${esc(p.Dept)}）${lc(p.UPN) === st.me.upn ? '（自分）' : ''}</option>`).join('')}</select>
      <div class="muted" style="margin-bottom:6px">WF 管理者は、ほかの人の分（出張など）も設定できます</div>` : ''}
    <div class="muted">不在の間、${mine ? 'あなた' : esc(target.Title) + 'さん'}に届く承認・後処理の依頼が、代理人にも届きます（本人も処理できます）。どちらかが処理すると、もう一方の依頼は取り消されます。代理人も不在のときは、その代理人の代理人へ届きます。</div>
    <label class="l">代理人</label><select id="absWho"><option value=""></option>${st.M.org.filter(p => lc(p.UPN) !== tu)

}

const isInbox = t => ['承認', '決裁', '作業'].includes(t.StepType) && t.Status === '処理待ち' && !hiddenTasks.has(t.id);
const isPostTodo = t => t.StepType === '後処理' && t.Status === '処理待ち' && !hiddenTasks.has(t.id);
const isCircTodo = t => t.StepType === '回覧' && ['未読', '既読'].includes(t.Status);   // 「確認しました」を押すまで
/* 申請の依頼（例：契約更新の申請依頼。総務が台帳から渡す）。稟議を出したら（data._contract.key が同じ申請がある）一覧から消える。タスク自体はフローH が翌朝に完了にする */
//   自分の申請・見られる申請のほか、承認で届いた稟議（もう一人の相手が出した稟議）も見る
const askReq = t => visibleReqs().find(r => r.FormCode === 'HIRE' && !['却下', '取下げ', '引き戻し'].includes(r.Status) && (pj(r.DataJson, {})._contract || {}).key === t.RequestNo)
  || (st.tasks || []).filter(x => x.StepType !== '依頼' && x.FormCode === 'HIRE' && !['却下', '取下げ', '引き戻し'].includes(x.RequestStatus))
    .map(x => ({ RequestNo: x.RequestNo, Status: x.RequestStatus || '申請中', s: pj(x.SnapshotJson, {}) })).find(x => ((x.s.data || {})._contract || {}).key === t.RequestNo);
const isAskTodo = t => t.StepType === '依頼' && t.Status === '処理待ち' && !hiddenTasks.has(t.id) && !askReq(t);
/* 「自分の対応待ち」＝承認・決裁／後処理／回覧（未確認）。種類は上の切り替え（st.sub）で絞る */

/* ---------- 組織マスタの同期（WF管理者）
   M365（Entra）の「上司」を、組織マスタ（WF_Org）の直属上長（承認ラインの上長をたどる元）に写す。
   階層区分（部門長・管理職など）・部署・拠点は組織マスタのまま。違いを一覧で見せ、選んだものだけ書く */
const orgSync = { rows: null, extra: [], onlyDiff: true, busy: false, err: '' };
async function loadOrgSync() {
  orgSync.busy = true; orgSync.err = ''; render();
  try {
    const ent = await api.entraUsers(), byUpn = Object.fromEntries(ent.map(u => [u.upn, u]));
    const org = st.M.org.filter(p => p.Active !== false), inOrg = new Set(org.map(p => lc(p.UPN)));
    const mgrMap = Object.fromEntries(org.map(p => [lc(p.UPN), ((p.ManagerUPNs || '').split(';').map(lc).filter(Boolean))[0] || '']));
    orgSync.rows = org.map(p => {
      const e = byUpn[lc(p.UPN)], cur = (p.ManagerUPNs || '').split(';').map(lc).filter(Boolean);
      let state, ok = false, note = '';
      if (!e) state = 'M365にいない';
      else if (!e.mgr) state = 'M365に上司なし';
      else if (cur.length === 1 && cur[0] === e.mgr) state = '同じ';
      else if (!inOrg.has(e.mgr)) state = '上司が組織マスタにいない';
      else if (e.mgr === lc(p.UPN)) state = '自分が上司になっている';
      else { state = '変わる'; ok = cur.length <= 1; if (cur.length > 1) note = `今は ${cur.length} 人（予備の上長）→ 1人になる`; }
      return { p, e, cur, state, ok, note, sel: ok, mgr: e ? e.mgr : '' };
    });
    // 新しい上司で、上長をたどったライン（部門長で止まる。承認の「上長承認」の段の並び）
    orgSync.rows.forEach(r => { if (r.state === '変わる') mgrMap[lc(r.p.UPN)] = r.mgr; });
    const tierOf = u => (st.M.orgByUpn[u] || {}).Tier;
    orgSync.rows.forEach(r => { const line = []; let u = lc(r.p.UPN);
      for (let i = 0; i < 6; i++) { const m = mgrMap[u]; if (!m || line.includes(m)) break; line.push(m); if (tierOf(m) === '部門長' || tierOf(m) === '役員') break; u = m; }
      r.line = line; });
    orgSync.extra = ent.filter(u => u.enabled && !inOrg.has(u.upn));
  } catch (e) { orgSync.err = e.message; }
  orgSync.busy = false; render();
}

  const shown = S.onlyDiff ? rows.filter(r => r.state !== '同じ') : rows, nSel = rows.filter(r => r.sel).length;

      ${S.extra.length ? `<details style="margin-top:12px" data-extra><summary class="muted" style="cursor:pointer">M365 にいて、組織マスタにいない人（${S.extra.length}人。共有の PC・携帯や新しく入った人。組織マスタに足すときは総務で）</summary>

    </div></div>`;
  main.querySelector('.detail').insertAdjacentHTML('beforeend', orgTreeHtml() + tierCardHtml());

  if ($('osDiff')) $('osDiff').onchange = e => { S.onlyDiff = e.target.checked; render(); };

      while (Date.now() - t0 < 120000) { await new Promise(r => setTimeout(r, 2500)); const r = await api.actionResult(id); if (r.Result === '完了') return done(`「${u.Title}」の申請できる人を保存しました（選ばれた人は、アプリを開き直すと出せるようになります）`); if (r.Result === 'エラー') throw new Error(r.ResultMessage || ''); }

    }
    if (c.mode === 'add') {
      const n = $('ucName').value.trim(), e = bad(n); if (e) return alert(e);

      btn.disabled = true;
      if (old) await api.staffSave('STF_Unit', old.id, { Active: true });
      else await api.staffSave('STF_Unit', 0, { Title: n, Path: path, Site: u.Site || path.split('/')[0], Sort: (Math.max(0, ...sibs(u.Path).map(x => Number(x.Sort) || 0)) + 10), Active: true });
      return done(`「${n}」を足しました`);
    }

      for (const x of r.units) await api.staffSave('STF_Unit', x.id, { Active: false });

    }

    if (!confirm(`「${u.Path.split('/').join(' › ')}」を「${to.split('/').join(' › ')}」にします。\n場所 ${r.units.length}件・人 ${r.persons.length}人・求人の枠など ${r.openings.length}件を書き換えます。よろしいですか？`)) return;
    btn.disabled = true; let k = 0; const total = r.units.length + r.persons.length + r.openings.length;

    const clash = d.units.find(x => x.Path === to && x.Active === false);   // 閉じた同じ名前の場所が残っていたら、名前をよける
    if (clash) await api.staffSave('STF_Unit', clash.id, { Path: clash.Path + '（閉じた ' + clash.id + '）' });
    for (const x of r.units) { await api.staffSave('STF_Unit', x.id, { Path: np(x.Path), ...(x.Path === u.Path ? { Title: to.split('/').pop() } : {}), ...(site !== u.Path.split('/')[0] ? { Site: site } : {}) }); step(); }
    for (const x of r.persons) { await api.staffSave('STF_Person', x.id, { UnitPath: np(x.UnitPath) }); step(); }
    for (const x of r.openings) { await api.staffSave('STF_Opening', x.id, { UnitPath: np(x.UnitPath) }); step(); }
    S.closed = new Set([...S.closed].map(x => ucfgUnder(x, u.Path) ? np(x) : x));
    done(r.roles.length || r.dept.length ? '書き換えました。申請できる範囲・給与の部門の対応も直す必要があります（総務へ）' : '書き換えました');
  } catch (e) { alert('途中で止まりました：' + e.message + '\n途中まで書き換わっています。このまま総務に連絡してください。'); loadStaff(); }
}

  $('fQ').addEventListener('input', onChange);

  // スマホ：一覧で選ぶと詳細だけを画面いっぱいに出し、上の「← 一覧に戻る」で戻る（PC は横に並べたまま）

function downloadCsv(items) {
  const head = ['申請番号', '件名', 'フォーム', '申請者', '部署', '状態', '申請日時'];

    i.f.date ? new Date(i.f.date).toLocaleString('ja-JP') : ''].map(q).join(',')));

  a.download = `ワークフロー_${TABS.find(t => t.key === st.view).label}_${new Date().toISOString().slice(0, 10)}.csv`;

/* ---------- 給与での精算（経費精算など）
   設定 payroll.settle: {"cutoffDay":15, "payDay":25, "forms":{"KEIHI":"payout"}}（フォーム → 精算額の項目）
   決裁日が締め日までなら同じ月、過ぎていれば翌月の支給日の給与で精算する */
function settleRule() { const r = pj(st.M.settings['payroll.settle'], null); return r && r.forms ? r : null; }
function settleOf(r) {
  const rule = settleRule(); if (!rule || !(r.FormCode in rule.forms) || r.Status !== '決裁済' || !r.ApprovedAt) return null;
  const d = new Date(r.ApprovedAt); if (isNaN(d)) return null;
  const pay = new Date(d.getFullYear(), d.getMonth() + (d.getDate() > (rule.cutoffDay || 15) ? 1 : 0), rule.payDay || 25);
  const ym = `${pay.getFullYear()}-${String(pay.getMonth() + 1).padStart(2, '0')}`;
  return { ym, label: `${pay.getMonth() + 1}月${pay.getDate()}日の給与で精算`, amount: Number(pj(r.DataJson, {})[rule.forms[r.FormCode]]) || 0 };
}
function settleBadge(r) { const x = settleOf(r); return x ? `<span class="badge b-ok" title="決裁日で決まります（締め日を過ぎた決裁は翌月）">💴 ${esc(x.label)}　${esc(yen(x.amount))}</span>` : ''; }
function renderPayroll(main) {
  const rows = (st.allReqs || []).map(r => ({ r, x: settleOf(r) })).filter(o => o.x);
  const months = [...new Set(rows.map(o => o.x.ym))].sort().reverse();
  st.payYm = months.includes(st.payYm) ? st.payYm : months[0] || '';
  const rule = settleRule();
  const cur = rows.filter(o => o.x.ym === st.payYm).sort((a, b) => String(a.r.ApplicantName).localeCompare(String(b.r.ApplicantName), 'ja') || String(a.r.ApprovedAt).localeCompare(String(b.r.ApprovedAt)));
  const byPerson = {}; cur.forEach(o => { const k = lc(o.r.ApplicantUPN); (byPerson[k] = byPerson[k] || { name: o.r.ApplicantName, dept: o.r.ApplicantDept, list: [] }).list.push(o); });
  const total = cur.reduce((a, o) => a + o.x.amount, 0);
  main.innerHTML = `<div class="detail" style="flex:1"><div class="card"><h3>給与で精算する申請（${rule.cutoffDay || 15}日締め・${rule.payDay || 25}日支給）</h3>
    <div class="actions" style="margin:0 0 10px">支給月：<select id="payYm">${months.map(m => `<option ${m === st.payYm ? 'selected' : ''}>${m}</option>`).join('') || '<option>（なし）</option>'}</select>
      <button id="payCsv">CSV を保存</button><span class="muted">決裁済みの申請だけを集計します（${esc(Object.keys(rule.forms).map(formName).join('・'))}）</span></div>
    ${cur.length ? `<table class="tbl"><tr><th>社員</th><th>部署</th><th>申請番号</th><th>フォーム</th><th>件名</th><th>決裁日</th><th style="text-align:right">精算額</th></tr>` +
      Object.values(byPerson).map(p => p.list.map((o, i) => `<tr><td>${i ? '' : esc(p.name)}</td><td>${i ? '' : esc(p.dept || '')}</td><td>${esc(o.r.RequestNo)}</td><td>${esc(formName(o.r.FormCode))}</td><td>${esc(o.r.Title)}</td><td>${fmtDT(o.r.ApprovedAt)}</td><td style="text-align:right">${esc(yen(o.x.amount))}</td></tr>`).join('') +
        `<tr><td colspan="6" style="text-align:right" class="muted">${esc(p.name)} の合計</td><td style="text-align:right;font-weight:600">${esc(yen(p.list.reduce((a, o) => a + o.x.amount, 0)))}</td></tr>`).join('') +
      `<tr><td colspan="6" style="text-align:right;font-weight:600">総合計（${Object.keys(byPerson).length}人・${cur.length}件）</td><td style="text-align:right;font-weight:700">${esc(yen(total))}</td></tr></table>`
      : '<div class="empty">この月に給与で精算する申請はありません</div>'}</div></div>`;
  if ($('payYm')) $('payYm').onchange = () => { st.payYm = $('payYm').value; renderPayroll(main); };
  $('payCsv').onclick = () => {
    const q = v => '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"';
    const lines = [['支給月', '社員', 'UPN', '部署', '申請番号', 'フォーム', '件名', '決裁日時', '精算額'].map(q).join(',')]
      .concat(cur.map(o => [st.payYm, o.r.ApplicantName, lc(o.r.ApplicantUPN), o.r.ApplicantDept, o.r.RequestNo, formName(o.r.FormCode), o.r.Title, new Date(o.r.ApprovedAt).toLocaleString('ja-JP'), o.x.amount].map(q).join(',')));
    const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob(['﻿' + lines.join('\r\n')], { type: 'text/csv' }));
    a.download = `給与精算_${st.payYm}.csv`; a.click(); URL.revokeObjectURL(a.href);
  };

/* ctx: { req: 申請番号, app: 申請者UPN }（添付を開くときの場所探しに使う） */
function dataCard(form, data, prev, ctx = {}) {
  const fields = (form ? form.fields : Object.keys(data).map(k => ({ key: k, label: k, type: 'text' }))).filter(f => f.type !== 'note' && f.type !== 'tabs' && (!f.showIf || WFEngine.evalCond(f.showIf, { data })));
  const fileNames = v => (v || []).map(x => x.name).join('、') || '（なし）';
  const show = (f, v) => {
    if (v == null || v === '' || (f.type === 'file' && !v.length)) return '<span class="muted">（未入力）</span>';
    if (f.type === 'table') return tableView(f, v, receiptOffsets(form ? form.fields : [], data)[f.key]);
    if (f.type === 'rowlog') return rowlogView(f, data);
    if (f.type === 'file') return v.map(x => `<a class="flink" data-fkey="${esc(x.key)}">📎 ${esc(x.name)}</a> <span class="muted">${fsize(x.size)}</span>`).join('<br>');
    if (Array.isArray(v)) return esc(v.join('、'));
    if (f.type === 'currency' || (f.type === 'calc' && !f.unit)) return esc(yen(v));
    if (f.type === 'calc') return esc(calcText(f, v));
    if (f.type === 'user') return esc(nameOf(v));
    return esc(v);
  };
  return `<div class="card" data-req="${esc(ctx.req || '')}" data-app="${esc(ctx.app || '')}"><h3 class="h3f"><span>申請内容</span><button class="mini noprint" data-copy title="項目と内容を文字でコピーします（メールや Teams に貼れます）">⧉ 申請内容をコピー</button>${prev ? '　<span class="badge b-warn">黄色＝前回から変更された項目</span>' : ''}</h3><div class="kv">` +
    fields.filter((f, i, a) => f.type !== 'section' || (a[i + 1] && a[i + 1].type !== 'section')).map(f => {
      if (f.type === 'section') return `<div class="kv-sec">${esc(f.label)}</div>`;
      const v = data[f.key], changed = prev && JSON.stringify(prev[f.key] ?? null) !== JSON.stringify(v ?? null);
      return `<div class="k">${esc(f.label)}</div><div class="v ${changed ? 'changed' : ''}">${show(f, v)}${changed ? `<span class="was">前回: ${prev[f.key] == null || prev[f.key] === '' ? '（未入力）' : (f.type === 'table' ? '（表）' : f.type === 'file' ? esc(fileNames(prev[f.key])) : esc(Array.isArray(prev[f.key]) ? prev[f.key].join('、') : prev[f.key]))}</span>` : ''}</div>`;
    }).join('') + '</div></div>';
}

/* レシートの番号（No.）：定義で "receiptNo": true の表は、表をまたいで通しの番号にする（例：交通費 1〜3 → 宿泊費 4 → その他 5〜）。
   レシートの付かない表（日当など）は表ごとに1から */
function receiptOffsets(fields, data) {
  const off = {}; let n = 0;
  (fields || []).filter(f => f.type === 'table' && f.receiptNo).forEach(f => { off[f.key] = n; n += (data[f.key] || []).length; });
  return off;
}

}
function returnBanner(lr, canRe) {

/* ============================================================
   進み具合（一覧・詳細で共通）
   経路（RouteJson）と経過（HistoryJson）から、段ごとの状態と「差し戻しで戻った線」を組み立てる。
   ここは表示だけ。状態の正本は SharePoint（フロー）が持つ
   ============================================================ */
const fmtD = s => { if (!s) return ''; const d = new Date(s); return `${d.getMonth() + 1}/${d.getDate()}`; };
/* cur: { status, stepNo(いまの段 1〜), postStatus, approvedAt, finishedAt, applicantUPN } */
function progressModel(route, hist, cur) {
  const steps = route.map((s, i) => ({ i, s })).filter(o => !o.s.skipped);
  const nodes = [{ key: 'apply', label: '申請', st: 'todo' }]
    .concat(route.map((s, i) => ({ key: 'r' + i, label: s.name, st: s.skipped ? 'skip' : 'todo', who: s.skipped ? '' : s.upns.map(nameOf).join('/'), ri: i })))
    .concat([{ key: 'fin', label: '決裁済', st: 'todo', fin: true }]);
  if (cur.postStatus && cur.postStatus !== 'なし') nodes.push({ key: 'post', label: '後処理', st: 'todo' });
  const nodeOfStep = name => { const k = route.findIndex(s => !s.skipped && s.name === name); return k < 0 ? -1 : k + 1; };
  const nodeOfStepNo = no => no > 0 ? no : 0;   // 段の番号（1〜）→ 点の位置。0＝申請
  const arcs = [];
  const reset = from => nodes.forEach((n, k) => { if (k >= from && n.ri != null && n.st !== 'skip') Object.assign(n, { st: 'todo', at: null, by: null }); });
  for (const h of hist) {
    const k = nodeOfStep(h.step);
    switch (h.type) {
      case '申請': case '再申請': Object.assign(nodes[0], { st: 'done', at: h.at, by: h.by, comment: h.comment, act: h.type }); break;
      case '承認': case '決裁': if (k > 0) Object.assign(nodes[k], { st: 'done', at: h.at, by: h.by, comment: h.comment, onBehalf: h.onBehalf, act: h.type }); break;
      case '差し戻し': {
        const to = h.toStep != null && h.toStep !== '' ? nodeOfStepNo(Number(h.toStep)) : 0;   // 戻し先の記録が無い古い経過は申請者へ
        reset(Math.max(to, 1));
        if (to === 0) nodes[0].st = 'todo';
        if (k > 0) Object.assign(nodes[k], { st: 'ret', at: h.at, by: h.by, comment: h.comment, onBehalf: h.onBehalf, act: '差し戻し' + (h.to ? '（→ ' + h.to + '）' : '') });
        arcs.push({ from: k > 0 ? k : 0, to, at: h.at, by: h.by, comment: h.comment, round: h.round });
        break;
      }
      case '引き戻し': reset(1); nodes[0].st = 'todo'; break;
      case '却下': if (k > 0) Object.assign(nodes[k], { st: 'ng', at: h.at, by: h.by, comment: h.comment, onBehalf: h.onBehalf, act: '却下' }); break;
    }
  }
  if (cur.mine && cur.mine.stepNo > 0 && nodes[cur.mine.stepNo] && nodes[cur.mine.stepNo].ri != null) {
    const n = nodes[cur.mine.stepNo], m = cur.mine, st = { '承認': 'done', '却下': 'ng', '差し戻し': 'ret' }[m.status];
    if (st && (!n.at || new Date(m.at) >= new Date(n.at))) Object.assign(n, { st, at: m.at, by: m.by, comment: m.comment, act: m.status });
  }
  const fin = nodes.findIndex(n => n.fin), post = nodes.findIndex(n => n.key === 'post');
  if (cur.status === '申請中' && !(cur.stepNo > 0)) {
    // いまの段が分からない（承認者の画面）→ 経過から、済んだ段の次を「いまの段」とみなす
    if (nodes[0].st === 'todo') nodes[0].st = 'done';
    const k = nodes.findIndex((n, i) => i > 0 && n.ri != null && (n.st === 'todo' || n.st === 'ret'));
    if (k > 0) Object.assign(nodes[k], { st: 'cur', at: null, by: null });
  } else if (cur.status === '申請中' && cur.stepNo > 0) {
    // いまの段より前は済んでいる（直前の承認が経過にまだ書かれていないことがあるので補う）
    for (let k = 1; k < cur.stepNo; k++) if (nodes[k].st === 'todo' || nodes[k].st === 'ret') nodes[k].st = 'done';
    if (nodes[0].st === 'todo') nodes[0].st = 'done';
    Object.assign(nodes[cur.stepNo], { st: 'cur', at: null, by: null });   // 前の回に差し戻した記録は出さず、いまの担当者を出す
  } else if (['差し戻し中', '引き戻し'].includes(cur.status)) {
    Object.assign(nodes[0], { st: 'cur', label: '再申請待ち', at: null, by: null });
  } else if (cur.status === '決裁済') {
    nodes.forEach((n, k) => { if (k < fin && (n.st === 'todo' || n.st === 'ret')) n.st = 'done'; });
    Object.assign(nodes[fin], { st: 'done', at: cur.approvedAt });
    if (post > 0) Object.assign(nodes[post], cur.postStatus === '完了' ? { st: 'done', at: cur.finishedAt } : { st: 'cur', who: cur.postAssignees || '' });
  } else if (cur.status === '却下') {
    Object.assign(nodes[fin], { st: 'ng', label: '却下' });
  }
  return { nodes, arcs };
}
/* 描く。mini＝一覧用（点だけ）。W＝1つの点の幅（詳細は表示欄の幅に合わせる） */
function progressHtml(m, mini) {
  const avail = ($('detail') ? $('detail').clientWidth : 800) - 90;
  const W = mini ? 20 : Math.max(78, Math.min(130, Math.floor(avail / m.nodes.length)));
  const cells = m.nodes.map(n => `<div class="pg-n ${n.st} ${n.fin ? 'fin' : ''}" style="width:${W}px" data-tip="${esc(tipText(n))}">
      <div class="pg-l">${esc(n.label)}</div><div class="pg-dot"></div>
      <div class="pg-d">${n.at ? fmtD(n.at) : n.st === 'cur' ? '処理中' : ''}</div><div class="pg-w">${esc(n.by ? nameOf(n.by) : n.who || '')}</div></div>`).join('');
  let svg = '';
  if (m.arcs.length) {
    // 差し戻しの線：戻した段 → 戻った先 へ、下側に弧を描く（回ごとに少しずつ深く）
    const H = mini ? 6 + m.arcs.length * 4 : 18 + m.arcs.length * 16, x = k => k * W + W / 2;
    svg = `<svg width="${m.nodes.length * W}" height="${H}" style="margin-top:${mini ? -2 : 0}px">` + m.arcs.map((a, j) => {
      const d = mini ? 4 + j * 4 : 12 + j * 16, x1 = x(a.from), x2 = x(a.to);
      return `<g data-tip="${esc('差し戻し　' + (a.by ? nameOf(a.by) : '') + '　' + fmtDT(a.at) + (a.comment ? '\n💬 ' + a.comment : ''))}"><path d="M${x1} 0 V${d} H${x2} V2" fill="none" stroke="transparent" stroke-width="10"/><path d="M${x1} 0 V${d} H${x2} V2" fill="none" stroke="#c0392b" stroke-width="${mini ? 1.2 : 1.6}" stroke-dasharray="${mini ? '' : '4 3'}"/></g>` +
        `<path d="M${x2 - 4} 7 L${x2} 1 L${x2 + 4} 7" fill="none" stroke="#c0392b" stroke-width="1.6"/>` +
        (mini ? '' : `<text x="${x1 - 6}" y="${d - 3}" text-anchor="end">差し戻し ${fmtD(a.at)}</text>`);
    }).join('') + '</svg>';
  }
  return `<div class="pg ${mini ? 'mini' : ''}"><div class="pg-row">${cells}</div>${svg}</div>`;
}
/* 点にマウスを乗せたときの吹き出し：段・何をしたか・誰が・いつ・コメント */

/* 経過（縦のタイムライン）。回が変わるところに区切りを入れる */
function timelineHtml(hist, cur) {

/* タスクの控えの経過。控えはタスクを作った時点のもので、直前の差し戻しは経過（フローDが後から書く）にまだ無いことがある。
   控えの lastReturn（フローAが先に書く）から補う */
function snapHistory(s) {
  const hist = (s.history || []).slice(), lr = s.lastReturn, route = s.route || [];
  if (lr && lr.at && !hist.some(h => h.type === '差し戻し' && h.by === lr.by && Math.abs(new Date(h.at) - new Date(lr.at)) < 120000)) {
    const k = route.findIndex(x => !x.skipped && x.name === lr.toStep);
    const x = { at: lr.at, type: '差し戻し', by: lr.by, step: lr.byStep, comment: lr.reason, to: lr.toStep, toStep: lr.toStep === '申請者' ? 0 : k + 1,
      round: (hist.length ? hist[hist.length - 1].round : 1) };

    const re = hist.findIndex(h => h.type === '再申請' && new Date(h.at) > new Date(lr.at));

/* タスクから見た経過：フローDが配る最新の写し（ProgressJson）があればそれ、無ければ作られた時点の控え */

/* ---------- 支払決済（フォームの View が settle）：申請に付けた明細 JSON を読み、サマリー＋確認モードを出す ----------

      onState: s => { const bt = $('bOk'); if (!bt || !o.canAct) return; const done = s.ok === s.total && !s.hold;

// 同じ支払回（決済月・支払回）の支払決済で、自分に届いているもの。本社分（総務・国内営業・ソリューション）と工場分は分ける。2つ以上あればタブで切り替える
function settleParts(o) {
  if (!o.task) return [];
  const ym = o.data.payYm, rd = o.data.round, fac = o.data.dept === '工場', by = {};
  st.tasks.filter(t => t.FormCode === 'SETTLE' && ['承認', '決裁', '作業'].includes(t.StepType)).forEach(t => { const k = t.RequestNo; if (!by[k] || t.id > by[k].id) by[k] = t; });
  let ps = Object.values(by).map(t => ({ t, s: pj(t.SnapshotJson, {}) })).filter(x => { const d = x.s.data || {}; return d.payYm === ym && d.round === rd && (d.dept === '工場') === fac && !['取下げ', '却下'].includes(x.t.RequestStatus); });
  // 同じ部門が2件あるとき（差し戻しのあと新しく回し直した）は新しいほうだけ。開いている申請は必ず残す
  const nw = {}; ps.forEach(x => { const d = (x.s.data || {}).dept || ''; if (!nw[d] || +x.t.id > +nw[d].t.id) nw[d] = x; });
  const dp = x => (x.s.data || {}).dept || '', curD = (ps.find(x => x.t.RequestNo === o.no) || {}).s;
  ps = ps.filter(x => x.t.RequestNo === o.no || (curD ? dp(x) !== ((curD.data || {}).dept || '') : true) && nw[dp(x)] === x);
  const ord = ['総務', '国内営業', 'ソリューション', '工場'];
  return ps.sort((a, b) => ord.indexOf((a.s.data || {}).dept) - ord.indexOf((b.s.data || {}).dept)).map(({ t, s }) => {
    const done = ['承認', '決裁'].includes(t.Status), x = taskState(t);
    return { no: t.RequestNo, dept: (s.data || {}).dept || '', total: +(s.data || {}).total || 0, cur: t.RequestNo === o.no,
      label: isInbox(t) ? (t.StepType === '決裁' ? '決裁待ち' : '承認待ち') : done ? '承認済' : x.label, cls: isInbox(t) ? 'run' : done ? 'ok' : t.Status === '差し戻し' ? 'ret' : '',
      open: () => { const key = 't' + t.id, row = document.querySelector(`#rows .row[data-k="${key}"]`); if (row) row.click(); else { st.sel = key; renderTaskDetail(t, s); } } };
  });
}

/* ---------- 途中の段で書き足す（例：海外送金の「送金の予約」で依頼書を添付・予約日を入れる）

        <div>${(E.files[fd.key] || []).map((x, i) => `<span class="ask-file">📎 ${esc(x.name)} <button class="mini" data-sfx="${esc(fd.key)}:${i}">✕</button></span>`).join('')}</div></div>`

    <div class="lg-form" style="margin-top:10px">${fs.map(fd => `<label class="fld ${fd.type === 'file' ? 'wide' : ''}"><span>${esc(fd.label)}</span>${inp(fd)}</label>`).join('')}</div>

function bindStepForm(t, form, route) {

}
async function saveStep(t) {

    if (rest.length) { alert(`まだ済んでいない回があります（${rest.map(i => (i + 1) + '回目').join('・')}）。すべての回の「${E.rowlog.phases[E.rowlog.phases.length - 1].label}」を記録してから終えてください。`); return false; }
    stepEd = null; return true;
  }
  const b = $('bOk'); b.disabled = true; const label = b.textContent; b.textContent = '書き込んでいます…';
  try {
    const data = {}, newFiles = [];
    const toNum = v => Number(String(v).replace(/[,¥円\s]/g, ''));
    Object.entries(E.data).forEach(([k, v]) => { if (v === '') return; data[k] = ['number', 'currency'].includes(E.types[k]) && !isNaN(toNum(v)) ? toNum(v) : v; });
    for (const [k, list] of Object.entries(E.files)) {
      if (!list.length) continue;
      for (const x of list) { await api.upload(x.file, x.key, () => {}); newFiles.push(x.key); }
      data[k] = list.map(x => ({ name: x.name, key: x.key, size: x.size }));
    }
    if (!Object.keys(data).length) return confirm('入れた内容がありません。このまま作業を終えますか？');
    await writeStepData(t, data, newFiles); stepEd = null; return true;
  } catch (e) { alert('書き込めませんでした：' + e.message); return false; }

}
/* 段の担当が申請に書き込む（WF_Action「作業の書き込み」→ フローI）。済むまで待つ */
async function writeStepData(t, data, newFiles) {
  {
    const { id } = await api.postAction({ Title: `作業の書き込み ${t.RequestNo}`, ActionType: '作業の書き込み', TaskId: t.id, RequestNo: t.RequestNo, PayloadJson: JSON.stringify({ pairs: Object.entries(data).map(([k, v]) => ({ k, v })), newFiles }) });   // フローは項目名を1つずつ確かめるので、名前と値の組で送る
    const t0 = Date.now();
    while (Date.now() - t0 < 180000) {
      await new Promise(ok => setTimeout(ok, 2500));
      const r = await api.actionResult(id);
      if (r.Result === '完了') return true;
      if (r.Result === 'エラー') throw new Error(r.ResultMessage || '書き込めませんでした');
    }
    throw new Error('書き込みに時間がかかっています。少し待ってから、もう一度押してください');
  }
}
/* ---------- 回ごとの記録（type "rowlog"）：表 of（例：送金の予定）の行ごとに、段の担当が phases（例：予約 → 送金の完了）を順に記録する。

const rowlogRows = (f, d) => Array.isArray(d[f.of]) ? d[f.of] : [];
const rowlogRest = (f, d) => rowlogRows(f, d).map((_, i) => i).filter(i => !(((d[f.key] || [])[i] || {})[f.phases[f.phases.length - 1].key]));

}
function rowlogDone(ph, x) {   // 記録済みの phase の中身（ラベル：値）

    const val = fd.type === 'file' ? v.map(y => `<a class="flink" data-fkey="${esc(y.key)}">📎 ${esc(y.name)}</a>`).join(' ') : fd.type === 'currency' ? esc(yen(v)) : esc(typeof v === 'number' ? v.toLocaleString() : v);
    return `<span class="rl-kv"><span class="muted">${esc(fd.label)}</span> ${val}</span>`; }).filter(Boolean).join('');

  const log = d[f.key] || [];

    return `<div class="rl-row"><div class="rl-h"><b>${i + 1}回目</b> ${esc(rowlogLabel(f, r))} ${rowlogBadge(f, x)}</div>${f.phases.filter(ph => x[ph.key]).map(ph => `<div class="rl-ph"><span class="rl-pl">${esc(ph.label)}</span>${rowlogDone(ph, x[ph.key])}</div>`).join('')}</div>`; }).join('')}</div>`;

        <div>${(E.files[id] || []).map((x, k) => `<span class="ask-file">📎 ${esc(x.name)} <button class="mini" data-sfx="${id}:${k}">✕</button></span>`).join('')}</div></div>`

  return `<div class="card step-card"><h3>${esc(t.StepName)}　<span class="muted" style="font-weight:400">回ごとに記録します（残り ${rest.length}回）</span></h3>
    <div class="rl-list">${rowlogRows(f, d).map((r, i) => { const x = log[i] || {}, next = f.phases.find(ph => !x[ph.key]);
      return `<div class="rl-row ${next ? '' : 'done'}"><div class="rl-h"><b>${i + 1}回目</b> ${esc(rowlogLabel(f, r))} ${rowlogBadge(f, x)}</div>

/* ---------- 操作の送信 ---------- */
/* ---------- 操作の送信（画面は待たせない） ----------
   送ったらすぐ次の操作に進める。処理結果は裏で確認し、完了したら右下に表示、エラーのときだけ知らせる。
   処理中のタスクは一覧から隠す（二重に押さないように）。 */
const pending = new Map();     // WF_Action の番号 → { label, taskId, t0 }
const hiddenTasks = new Set(); // 処理中で一覧から隠しているタスク
const optimistic = new Map();   // 押した直後に画面だけ先に変えた状態（タスク番号 → 状態）。SharePoint に反映されたら消す
let trackTimer = null;
// 同じ操作の二度押しを防ぐ：送っている間と、フローの処理を待っている間は、同じ申請・タスクへの同じ操作を受け付けない
const actKey = f => [f.ActionType, f.RequestNo || '', f.TaskId || ''].join('|'), sending = new Set();
// その申請に、画面から送って処理を待っている操作があれば、その名前（一覧の状態・詳細のボタンに使う）
const pendingReq = no => { if (!no) return ''; for (const p of pending.values()) if (!p.silent && p.reqNo === no) return p.label; return ''; };
async function act(fields, silent) {
  const k = actKey(fields);
  if (sending.has(k) || [...pending.values()].some(p => p.key === k)) { if (!silent) status(`${fields.ActionType}は処理中です。完了すると表示が変わります`, 'busy'); return null; }
  sending.add(k); busy = true;
  try {
    const { id } = await api.postAction(fields);
    const label = fields.ActionType;
    pending.set(id, { label, key: k, taskId: fields.TaskId, reqNo: fields.RequestNo, silent: !!silent, t0: Date.now() });
    if (fields.TaskId && !silent) hiddenTasks.add(fields.TaskId);
    if (!silent) { st.sel = null; render(); showPending(); }
    if (!trackTimer) trackTimer = setInterval(trackPending, 2000);
    return { id };
  } catch (e) { status('送信に失敗しました: ' + e.message + '（もう一度お試しください）', 'err'); return null; }
  finally { busy = false; sending.delete(k); }
}
function showPending() {
  const n = [...pending.values()].filter(p => !p.silent).length;
  if (n) status(`処理中 ${n}件（そのまま次の操作に進めます。完了すると右下に表示されます）`, 'busy');
}
async function trackPending() {
  if (!pending.size) { clearInterval(trackTimer); trackTimer = null; return; }
  let changed = false;
  for (const [id, p] of [...pending]) {
    let r; try { r = await api.actionResult(id); } catch { continue; }
    if (r.Result === '完了') {
      pending.delete(id); changed = true;
      if (p.label === '不在設定') st.M = null;   // 組織マスタ（代理人・期間）を読み直す
      if (!p.silent) toast(`✔ ${p.label}しました${r.RequestNo ? '（' + r.RequestNo + '）' : ''}`);
    } else if (r.Result === 'エラー') {
      pending.delete(id); changed = true;
      if (p.taskId) { hiddenTasks.delete(p.taskId); optimistic.delete(p.taskId); }
      toast(`✖ ${p.label}できませんでした：${r.ResultMessage || ''}`, true);
      alert(`${p.label}できませんでした\n${r.ResultMessage || ''}`);
    } else if (Date.now() - p.t0 > 180000 && !p.slow) {
      p.slow = true;
      toast(`${p.label}の反映に時間がかかっています。しばらくすると自動で反映されます`, true);
    }
  }
  if (changed) {
    await load(true);
    // 処理が終わったタスクは一覧から消えているので、隠していた印を片付ける
    [...hiddenTasks].forEach(id => { if (![...pending.values()].some(p => p.taskId === id)) hiddenTasks.delete(id); });
    render(); scheduleFollowUp();
    if ([...pending.values()].some(p => !p.silent)) showPending(); else status(`更新 ${fmtDT(new Date())}`, '');
  }
}

/* 書類を AI に渡す形にする（PDF はそのまま、写真は縮めて） */

  const blob = await aiPrep(file); if (blob.size > AI_MAX_MB * 1024 * 1024) throw new Error(`書類が大きすぎます（${AI_MAX_MB}MB まで）`);
  const type = blob.type || (/\.pdf$/i.test(file.name) ? 'application/pdf' : 'image/jpeg');
  return type === 'application/pdf' ? { type: 'document', source: { type: 'base64', media_type: type, data: await b64Of(blob) } }

/* 申請書の項目の説明（AI に渡す：表示名・種類・必須・選択肢・出す条件） */

    if (['tabs', 'calc'].includes(fd.type) || !fd.label) return fd.type === 'calc' ? `- ${fd.label}：自動で計算（入れない）` : '';
    const o = ['select', 'radio', 'checkbox'].includes(fd.type) ? opts(fd) : [];
    return `- ${fd.key}「${fd.label}」${fd.required ? '［必須］' : fd.requiredIf ? `［${cond(fd.requiredIf)} のとき必須］` : ''}${o.length ? ' 選択肢：' + o.join('／') : ''}${fd.type === 'table' ? ' 表（列：' + fd.columns.map(c => c.label).join('・') + '）' : ''}${fd.type === 'file' ? ' 添付（この画面の「書類を置く」で）' : ''}${fd.showIf ? `（${cond(fd.showIf)} のときだけ）` : ''}${fd.help ? ' ※' + fd.help : ''}`;

}

/* 入力欄を区切りごとの枠に入れる。定義の { "type": "section", "label": "金額・支払", "help": "…" } で区切る。

/* 半分の幅に並べる項目（日付は既定で半分。定義の "half": true / false で変える） */

/* ---------- 金額の入力（3桁ごとにカンマ。全角の数字も受け付ける） */
const toNum = s => { const t = String(s ?? '').normalize('NFKC').replace(/[,\s円¥]/g, ''); return t === '' ? '' : Number(t); };

function moneyInput(el) {

  const neg = /^\s*-/.test(raw), digits = raw.replace(/[^\d]/g, '').replace(/^0+(?=\d)/, '');
  const out = (neg ? '-' : '') + (digits ? Number(digits).toLocaleString('ja-JP') : '');

  el.value = out;
  let n = 0, p = neg ? 1 : 0; while (p < out.length && n < digitsBefore) { if (/\d/.test(out[p])) n++; p++; }
  try { el.setSelectionRange(p, p); } catch { }
}

/* ---------- 代理申請（PC を使えない人の分を、代わりに出す）

/* ---------- 書類から入力する（AI：Claude API。PA「AI_Claude中継」経由で、API キーは PA だけが持つ。設計 11_Claude読み取りの仕組み.md の wf.read）

    p = { type: 'array', items: { type: 'object', additionalProperties: false, required: cols.map(c => c.key), properties: Object.fromEntries(cols.map(c => [c.key, aiProp(c)])) } };
    d += '（書類の明細1行ごとに1つ。無ければ空の配列）';
  } else if (fd.type === 'checkbox') { p = { type: 'array', items: { type: 'string' } }; if (o.length) d += '（次の中から当てはまるものだけ：' + o.join('／') + '）'; }
  else if (o.length) p = { type: 'string', enum: [...o, ''] };
  else p = { type: 'string' };
  if (fd.type === 'date') d += '（YYYY-MM-DD）';
  if (['number', 'currency'].includes(fd.type)) d += '（数字だけ。円・カンマは付けない）';
  if (fd.patternMsg) d += `（書き方：${fd.patternMsg}）`;

    fields: { type: 'object', additionalProperties: false, required: t.map(fd => fd.key), properties: Object.fromEntries(t.map(fd => [fd.key, aiProp(fd)])) },
    comments: { type: 'array', items: { type: 'string' }, description: '読めなかった所・書類と申請書の合わない所・確かめてほしい所（短く）' } } };
}
const AI_MAX_MB = 12;   // 送るときは base64 で約1.33倍。中継のフローの上限（ai.models の maxBytes＝20MB）に収める
/* 写真は大きければ縮めて JPEG に（AI に送る量を減らす）。PDF はそのまま */

}
const b64Of = blob => new Promise((ok, ng) => { const r = new FileReader(); r.onload = () => ok(String(r.result).split(',')[1] || ''); r.onerror = () => ng(r.error); r.readAsDataURL(blob); });
async function aiReadDoc(f, file) {
  const cfg = pj(st.M.settings['ai.read'], {}), models = pj(st.M.settings['ai.models'], {}), app = edApplicant() || {};
  const blob = await aiPrep(file);
  if (blob.size > AI_MAX_MB * 1024 * 1024) throw new Error(`書類が大きすぎます（${AI_MAX_MB}MB まで）`);
  const type = blob.type || (/\.pdf$/i.test(file.name) ? 'application/pdf' : 'image/jpeg');
  const doc = type === 'application/pdf' ? { type: 'document', source: { type: 'base64', media_type: type, data: await b64Of(blob) } }
    : { type: 'image', source: { type: 'base64', media_type: /^image\/(png|webp|gif)$/.test(type) ? type : 'image/jpeg', data: await b64Of(blob) } };

}
function pasteCardHtml(f) {

  const ed = st.editor;
  return `<div class="card ai-card noprint" id="aiCard"><div class="ai-h"><b>📄 書類から入力する</b><span class="muted">見積書・請求書・領収書・住民票などを置くと、AI が読んで下の項目を埋めます。置いた書類は添付にも入ります。</span></div>
    ${ed.aiBusy ? `<div class="ai-busy"><span class="spin"></span>AI が「${esc(ed.aiBusy)}」を読んでいます（20〜40秒）</div>`

function bindPasteCard(f) {

    readForm(); ed.aiBusy = file.name; ed.pasteMsg = ''; render();
    try {

      const r = applyPaste(f, JSON.stringify(clean)) || { ok: [], ng: [], keys: [] };

        (r.ng.length ? `<div class="ng">⚠ 入れられなかった（手で入力してください）：${r.ng.map(esc).join('、')}</div>` : '') +
        (cm.length ? `<div class="ai-cm"><b>AI からのひと言</b><ul>${cm.map(c => `<li>${esc(c)}</li>`).join('')}</ul></div>` : '') +

    } catch (e) { ed.aiBusy = ''; ed.pasteMsg = `<div class="ng">⚠ ${esc(e.message)}</div>`; if (st.editor === ed) render(); }

}/* 貼り付けた答え → 項目。返り値 { ok: [反映した項目名], ng: [反映できなかった項目名（理由）], keys } */

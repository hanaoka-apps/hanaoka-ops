<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
  :root{--primary:#1a5fa8;--primary-dk:#134680;--success:#2e7d52;--warning:#c07a00;--danger:#c0392b;--bg:#f4f6f9;--card:#fff;--border:#dde2ec;--text:#1e2533;--muted:#6b7a99;}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'Meiryo','Hiragino Sans',sans-serif;background:var(--bg);color:var(--text);}
  header{background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 24px;height:52px;position:sticky;top:0;z-index:100;box-shadow:0 2px 8px rgba(0,0,0,.2);}
  header .logo{font-size:16px;font-weight:700;}header .logo span{opacity:.7;font-weight:400;font-size:13px;margin-left:10px;}
  header .user-info{display:flex;align-items:center;gap:12px;font-size:13px;}
  header button{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.3);color:#fff;padding:5px 14px;border-radius:4px;cursor:pointer;font-size:12px;}
  #login-view{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:calc(100vh - 52px);gap:20px;}
  #login-btn{background:var(--primary);color:#fff;border:none;padding:12px 36px;border-radius:6px;font-size:15px;font-weight:700;cursor:pointer;display:flex;gap:8px;align-items:center;}
  #app-view{display:none;}
  .toolbar{display:flex;align-items:center;gap:12px;padding:9px 20px;background:var(--card);border-bottom:1px solid var(--border);flex-wrap:wrap;}
  .toolbar label{font-size:12px;color:var(--muted);font-weight:600;}
  .toolbar input,.toolbar select{border:1px solid var(--border);border-radius:4px;padding:4px 8px;font-size:13px;}
  .toolbar .reload{background:var(--primary);color:#fff;border:none;padding:5px 14px;border-radius:5px;cursor:pointer;font-size:12px;}
  .seg{display:inline-flex;border:1px solid var(--border);border-radius:6px;overflow:hidden;}
  .seg button{background:#fff;border:none;padding:5px 16px;font-size:13px;cursor:pointer;color:var(--muted);}
  .seg button.on{background:var(--primary);color:#fff;font-weight:700;}
  .toolbar .links{margin-left:auto;display:flex;gap:14px;}
  .toolbar .links a{font-size:13px;color:var(--primary);text-decoration:none;}
  .summary{display:flex;gap:18px;padding:8px 20px;background:#fbfcfe;border-bottom:1px solid var(--border);flex-wrap:wrap;font-size:13px;}
  .summary .s{color:var(--muted);}.summary .s b{color:var(--text);font-size:15px;margin-left:4px;}
  .summary .s.honsha b{color:#185fa5;}.summary .s.kojo b{color:#854f0b;}
  .main{display:grid;grid-template-columns:300px 1fr;height:calc(100vh - 52px - 42px - 39px);}
  @media(max-width:1000px){.main{grid-template-columns:1fr;height:auto;}}
  .list-pane{border-right:1px solid var(--border);background:#fbfcfe;display:flex;flex-direction:column;overflow:hidden;}
  .list-head{padding:7px 8px;border-bottom:1px solid var(--border);display:flex;align-items:center;background:#fbfcfe;}
  .list-scroll{overflow-y:auto;flex:1;}
  table.vl{width:100%;border-collapse:collapse;font-size:12px;}
  table.vl th{position:sticky;top:0;background:#eef2f8;padding:6px 8px;text-align:left;color:var(--muted);font-weight:600;font-size:11px;z-index:1;}
  table.vl td{padding:6px 8px;border-bottom:1px solid #eef2f8;}
  table.vl td.num{text-align:right;white-space:nowrap;}
  tr.vrow{cursor:pointer;}tr.vrow:hover td{background:#eef3fb;}
  tr.vrow.active td{background:#e4edf9;}
  tr.vrow.archived{opacity:.5;}
  .loc-pill{display:inline-block;font-size:10px;font-weight:700;padding:1px 5px;border-radius:8px;margin-right:2px;}
  .pill-honsha{background:#e6f1fb;color:#185fa5;}.pill-kojo{background:#fbeede;color:#854f0b;}
  .st{display:inline-block;font-size:10px;font-weight:700;padding:1px 6px;border-radius:9px;}
  .st-ok{background:#d4edda;color:#155724;}.st-diff{background:#fdecea;color:var(--danger);}.st-none{background:#eef0f4;color:#888;}
  .rcv{color:var(--success);font-size:11px;}
  .detail-pane{overflow-y:auto;padding:14px 18px;}
  .empty{color:var(--muted);text-align:center;padding:70px 20px;font-size:14px;}
  .dh{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:4px;}
  .dh h2{font-size:18px;color:var(--primary);}.dh .code{font-size:12px;color:var(--muted);}
  .dmetrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin:10px 0;}
  .dm{background:#fbfcfe;border:1px solid var(--border);border-radius:8px;padding:9px 12px;}
  .dm .l{font-size:11px;color:var(--muted);}.dm .v{font-size:17px;font-weight:700;margin-top:2px;}
  .match-card{background:var(--card);border:1px solid var(--primary);border-radius:8px;padding:12px 14px;margin:10px 0;}
  .match-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap;}
  .match-in{width:140px;text-align:right;border:1px solid var(--border);border-radius:4px;padding:6px 8px;font-size:15px;}
  .reason{font-size:13px;border:1px solid var(--border);border-radius:4px;padding:5px 6px;}
  .btn-save{background:var(--primary);color:#fff;border:none;padding:7px 18px;border-radius:6px;font-size:13px;font-weight:700;cursor:pointer;}
  .deptbox{margin:8px 0;}.deptbox .loc-pill{font-size:11px;padding:2px 8px;margin:2px;}
  .det-split{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:14px;align-items:start;margin-top:8px;}
  @media(max-width:1250px){.det-split{grid-template-columns:1fr;}}
  .det-scroll{overflow-x:auto;border:1px solid var(--border);border-radius:8px;}
  table.det{width:100%;border-collapse:collapse;font-size:12px;}
  table.det th{background:#f1f4f9;padding:6px 6px;text-align:left;color:var(--muted);font-weight:600;font-size:11px;white-space:nowrap;}
  table.det td{padding:5px 6px;border-bottom:1px solid #f0f3fa;}
  table.det td.num{text-align:right;white-space:nowrap;}
  .pdf-pane{position:sticky;top:0;align-self:start;max-height:calc(100vh - 120px);overflow:auto;}
  .pdf-chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px;}
  .pdf-chip{font-size:11px;border:1px solid var(--border);background:#fff;border-radius:5px;padding:3px 8px;cursor:pointer;max-width:210px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .pdf-chip.on{background:var(--primary);color:#fff;border-color:var(--primary);}
  .pdf-pane h4{font-size:12px;color:var(--primary);margin-bottom:6px;}
  .pdf-drop{border:2px dashed var(--border);border-radius:8px;padding:10px;text-align:center;color:var(--muted);font-size:12px;cursor:pointer;display:block;}
  .pdf-drop input{display:none;}
  .pdf-frame{width:100%;height:60vh;min-height:400px;border:1px solid var(--border);border-radius:8px;margin-top:8px;background:#fafbfd;}
  .pdf-empty{display:flex;align-items:center;justify-content:center;height:60vh;min-height:400px;border:1px dashed var(--border);border-radius:8px;color:var(--muted);font-size:13px;margin-top:8px;text-align:center;}
  .btn-arch{background:#fff;color:var(--danger);border:1px solid var(--danger);padding:5px 12px;border-radius:5px;font-size:12px;cursor:pointer;}
  .btn-ghost{background:#fff;color:var(--primary);border:1px solid var(--primary);padding:5px 12px;border-radius:5px;font-size:12px;cursor:pointer;}
  #snackbar{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#323232;color:#fff;padding:10px 20px;border-radius:6px;font-size:13px;display:none;z-index:999;}
</style>
</head>
<body>
<header>
  <div class="logo">花岡車輌<span>仕入突合（受入リスト×請求書）</span></div>
  <div class="user-info"><span id="user-name"></span><button onclick="signOut()">サインアウト</button></div>
</header>

<div id="login-view">
  <h2 style="color:#1a5fa8">仕入突合</h2>
  <p style="color:#6b7a99">花岡車輌の Microsoft アカウントでサインインしてください</p>
  <button id="login-btn" onclick="signIn()">
    <svg width="18" height="18" viewBox="0 0 21 21"><path d="M10 0H0v10h10V0z" fill="#F25022"/><path d="M21 0H11v10h10V0z" fill="#7FBA00"/><path d="M10 11H0v10h10V11z" fill="#00A4EF"/><path d="M21 11H11v10h10V11z" fill="#FFB900"/></svg>
    サインイン
  </button>
</div>

<div id="app-view">
  <div id="app-nav-slot"></div>
  <div class="toolbar">
    <label>決済月</label><select id="month-select" onchange="onMonth()"></select>
    <input id="f-text" placeholder="仕入先で絞込" oninput="renderList()">
    <label><input type="checkbox" id="f-arch" onchange="renderList()"> アーカイブ表示</label>
    <button class="reload" onclick="loadAll()">🔄 再読込</button>
    <span id="status-msg" style="font-size:12px;color:var(--muted)"></span>
    <div class="links"><a href="ap_dashboard.html">📊 ダッシュボード</a><a href="ap_review.html">✅ 経費確認</a></div>
  </div>
  <div class="summary" id="summary"></div>
  <div class="summary" id="progress" style="gap:20px;align-items:center"></div>
  <div class="main">
    <div class="list-pane" id="list-pane">
      <div class="list-head"><span style="font-size:11px;color:var(--muted);margin-right:6px">一覧拠点</span><div class="seg" style="font-size:12px"><button id="vm-all" class="on" onclick="setListView('all')">全部</button><button id="vm-honsha" onclick="setListView('本社')">本社</button><button id="vm-kojo" onclick="setListView('工場')">工場</button></div></div>
      <div class="list-scroll" id="list-scroll"></div>
    </div>
    <div class="detail-pane" id="detail-pane"><div class="empty">左の仕入先を選択してください</div></div>
  </div>
</div>
<div id="snackbar"></div>

<script>
const MSAL_CONFIG={auth:{clientId:'d338d61b-01dc-4c7c-ac6b-aecf7f30d716',authority:'https://login.microsoftonline.com/3933e8a0-c945-4e97-ae67-c82131087cad',redirectUri:new URL('auth.html',window.location.href).href},cache:{cacheLocation:'sessionStorage'}};
const SCOPES=['User.Read','Sites.ReadWrite.All','Files.ReadWrite.All'];
const GRAPH='https://graph.microsoft.com/v1.0';
const SITE_PATH='hanaokacorp.sharepoint.com:/sites/msteams_20513c', DRIVE_NAME='GenelalMasters', FILE_PATH='9521受入リスト.csv';
const AP_SITE='hanaokacorp.sharepoint.com,d80378dd-76a4-43f0-b939-1af66345d19d,8eaeb70b-2495-4029-affb-eabe80e021bb';
const MLIST='AP_PurchaseMatch';
let msalApp=null,acct=null,vendors=[],matchState={},savedState={},archived={},pdfSel={},pdfCache={},selectedCode=null,listView='all',detailView='all';
let M={fmap:{},id:null};
let INV={fmap:{},id:null}, invByVendor={}, invByName={}, invAmtByVendor={}, invAmtByName={}, unlinkedInv=[], invRowsByVendor={};
function normName(s){return String(s||'').replace(/株式会社|有限会社|（株）|\(株\)|㈱|（有）|\(有\)|㈲|\s|　/g,'');}
// AI読取の請求書税込額（仕入行 金額_税込 の合計）。
// 金額は「仕入先コード一致」のみで集計する。名寄せは同名別会社の誤合算リスクがあるので金額には使わない（PDF表示候補にのみ使用）。
function aiAmt(code){
  if(code&&Object.prototype.hasOwnProperty.call(invAmtByVendor,code)){const a=invAmtByVendor[code];return (a==null)?null:a;}
  return null;}

async function boot(){msalApp=new msal.PublicClientApplication(MSAL_CONFIG);await msalApp.initialize();await msalApp.handleRedirectPromise();const a=msalApp.getAllAccounts();if(a.length){acct=a[0];msalApp.setActiveAccount(acct);await showApp();}}
async function signIn(){try{const r=await msalApp.loginPopup({scopes:SCOPES});acct=r.account;msalApp.setActiveAccount(acct);await showApp();}catch(e){if(e.errorCode!=='user_cancelled')snack('サインインエラー: '+e.message,true);}}
function signOut(){msalApp.logoutPopup({account:acct});}
async function token(){try{const r=await msalApp.acquireTokenSilent({scopes:SCOPES,account:acct});return r.accessToken;}catch{const r=await msalApp.acquireTokenPopup({scopes:SCOPES});acct=r.account;return r.accessToken;}}
async function gget(p){const t=await token();const r=await fetch(GRAPH+p,{headers:{Authorization:'Bearer '+t}});if(!r.ok)throw new Error('['+r.status+'] '+p);return r.json();}
async function gpatch(p,b){const t=await token();const r=await fetch(GRAPH+p,{method:'PATCH',headers:{Authorization:'Bearer '+t,'Content-Type':'application/json'},body:JSON.stringify(b)});if(!r.ok)throw new Error('['+r.status+'] '+await r.text());return r.json();}
async function gpost(p,b){const t=await token();const r=await fetch(GRAPH+p,{method:'POST',headers:{Authorization:'Bearer '+t,'Content-Type':'application/json'},body:JSON.stringify(b)});if(!r.ok)throw new Error('['+r.status+'] '+await r.text());return r.json();}
async function gblob(url){const t=await token();const r=await fetch(url,{headers:{Authorization:'Bearer '+t}});if(!r.ok)throw new Error('['+r.status+'] file');return r.blob();}
async function gputFile(path,file){const t=await token();const r=await fetch(`${GRAPH}/sites/${AP_SITE}/drive/root:${encodeURI(path)}:/content`,{method:'PUT',headers:{Authorization:'Bearer '+t,'Content-Type':file.type||'application/pdf'},body:file});if(!r.ok)throw new Error('PDFアップロード '+r.status+' '+await r.text());return r.json();}

async function showApp(){document.getElementById('login-view').style.display='none';document.getElementById('app-view').style.display='block';document.getElementById('user-name').textContent=acct.name||acct.username;initMonth();await ensureMatchList();await loadAll();}
function initMonth(){const s=document.getElementById('month-select');const n=new Date();for(let i=-1;i<5;i++){const d=new Date(n.getFullYear(),n.getMonth()-i,1);const v=d.getFullYear()+'/'+String(d.getMonth()+1).padStart(2,'0');const o=document.createElement('option');o.value=v;o.textContent=v;if(i===0)o.selected=true;s.appendChild(o);}var qm=new URLSearchParams(location.search).get('month');if(qm){if(!Array.prototype.some.call(s.options,function(o){return o.value===qm;})){var oo=document.createElement('option');oo.value=qm;oo.textContent=qm;s.insertBefore(oo,s.firstChild);}s.value=qm;}}
function month(){return document.getElementById('month-select').value;}
async function onMonth(){await loadReceipts();await loadMatchState();await loadInvoicePdfs();renderSummary();renderList();if(selectedCode)renderDetail(selectedCode);}

async function ensureMatchList(){
  if(M.id)return;
  const ls=await gget(`/sites/${AP_SITE}/lists?$select=id,displayName`);
  const l=ls.value.find(x=>x.displayName===MLIST);if(!l)throw new Error('AP_PurchaseMatch が見つかりません');M.id=l.id;
  const c=await gget(`/sites/${AP_SITE}/lists/${M.id}/columns?$select=name,displayName`);c.value.forEach(x=>M.fmap[x.displayName]=x.name);
}
const mi=d=>M.fmap[d]||d;

async function resolveDrive(){
  const site=await gget(`/sites/${SITE_PATH}`);
  const dr=await gget(`/sites/${site.id}/drives?$select=id,name`);
  const d=(dr.value||[]).find(x=>x.name===DRIVE_NAME);
  if(d)return d.id;
  throw new Error(`ドライブ "${DRIVE_NAME}" が見つかりません。存在: ${(dr.value||[]).map(x=>x.name).join(' / ')}`);
}
function parseCSV(text){
  if(text.charCodeAt(0)===0xFEFF)text=text.slice(1);
  const rows=[];let row=[],cur='',q=false;
  for(let i=0;i<text.length;i++){const c=text[i];
    if(q){if(c==='"'){if(text[i+1]==='"'){cur+='"';i++;}else q=false;}else cur+=c;}
    else{if(c==='"')q=true;else if(c===','){row.push(cur);cur='';}else if(c==='\n'){row.push(cur);rows.push(row);row=[];cur='';}else if(c==='\r'){}else cur+=c;}
  }
  if(cur!==''||row.length){row.push(cur);rows.push(row);}
  return rows;
}
function locOf(deptName,whName){return /工場/.test(String(deptName||'')+String(whName||''))?'工場':'本社';}
function yen(n){return '¥'+Math.round(parseFloat(n)||0).toLocaleString();}
function esc(s){return String(s==null?'':s).replace(/"/g,'&quot;');}

async function loadAll(){await loadReceipts();await loadMatchState();await loadInvoicePdfs();renderSummary();renderList();if(selectedCode)renderDetail(selectedCode);}
async function ensureInvoiceList(){if(INV.id)return;
  const ls=await gget(`/sites/${AP_SITE}/lists?$select=id,displayName`);const l=ls.value.find(x=>x.displayName==='AP_Invoice');if(!l)throw new Error('AP_Invoice なし');INV.id=l.id;
  const c=await gget(`/sites/${AP_SITE}/lists/${INV.id}/columns?$select=name,displayName`);c.value.forEach(x=>INV.fmap[x.displayName]=x.name);}
async function loadInvoicePdfs(){
  invByVendor={};invByName={};invAmtByVendor={};invAmtByName={};unlinkedInv=[];invRowsByVendor={};
  try{await ensureInvoiceList();const m=month();
    let items=[],n=`/sites/${AP_SITE}/lists/${INV.id}/items?$expand=fields&$top=500`;
    while(n){const d=await gget(n);items=items.concat(d.value||[]);n=d['@odata.nextLink']?d['@odata.nextLink'].replace(GRAPH,''):null;}
    const F=INV.fmap;
    items.forEach(it=>{const f=it.fields;const cat=f[F['支払区分']]||'';if(cat!=='本社仕入'&&cat!=='工場仕入')return;if((f[F['対象年月']]||'')!==m)return;if(f[F['アーカイブフラグ']]===true)return;
      const code=f[F['支払先コード']]||'';const rawName=f[F['支払先名']]||'';const nm=normName(rawName);const doc=f[F['DOCコード']]||'';const amt=Number(f[F['金額_税込']])||0;const invno=f[F['請求NO']]||'';
      if(!code){ unlinkedInv.push({id:it.id,name:rawName,nm:nm,incl:amt,doc:String(doc)}); }  // 仕入先コード未割当＝紐づけ候補
      else{ (invRowsByVendor[code]=invRowsByVendor[code]||[]).push({id:it.id,name:rawName,invno:invno,incl:amt,doc:String(doc)}); }  // 受領した請求書＝1枚1行
      if(amt){ if(code)invAmtByVendor[code]=(invAmtByVendor[code]||0)+amt; if(nm)invAmtByName[nm]=(invAmtByName[nm]||0)+amt; }
      String(doc).split(/[\r\n;]+/).map(s=>s.trim()).filter(Boolean).forEach(p=>{
        if(code){(invByVendor[code]=invByVendor[code]||[]).push(p);}
        if(nm){(invByName[nm]=invByName[nm]||[]).push(p);}});});
  }catch(e){/* AP_Invoice読込失敗時は手動フォルダのみ */}
}

async function loadReceipts(){
  const msg=document.getElementById('status-msg');msg.textContent='受入読み込み中...';
  try{
    const driveId=await resolveDrive();
    // 月別スナップショット優先：受入リスト_YYYY-MM.csv → 無ければ従来の単一ファイルにフォールバック
    const ym=month().replace('/','-');const monthly='受入リスト_'+ym+'.csv';let text=null,usedFile='';
    for(const fname of [monthly,FILE_PATH]){try{text=await gblob(`${GRAPH}/drives/${driveId}/root:/${encodeURIComponent(fname)}:/content`).then(b=>b.arrayBuffer()).then(a=>new TextDecoder('utf-8').decode(a));usedFile=fname;break;}catch(e){}}
    if(text==null)throw new Error('受入リストが見つかりません（'+monthly+' か '+FILE_PATH+' を配置してください）');
    const rows=parseCSV(text);
    const h=rows[0];const idx=n=>h.findIndex(x=>x.replace(/\s/g,'')===n);
    const ci={code:idx('仕入先ｺｰﾄﾞ'),name:idx('仕入先略称'),dept:idx('部門名称'),item:idx('品目名'),model:idx('型番'),
      excl:idx('税抜受入金額'),tax:idx('消費税等'),wh:idx('倉庫略称'),date:idx('伝票日付'),slip:idx('伝票№'),dtype:idx('取引区分略称')};
    const map={};
    for(let i=1;i<rows.length;i++){const r=rows[i];if(!r||!r[ci.code])continue;
      const excl=parseFloat(r[ci.excl])||0;const tax=parseFloat(r[ci.tax])||0;
      const code=r[ci.code].trim();const loc=locOf(r[ci.dept],r[ci.wh]);
      const item=(r[ci.item]||'').trim();const isTax=/消費税/.test(item);  // 消費税等の伝票（税抜0・税のみ・独自部門）は拠点判定に使わない
      const dn=(r[ci.dept]||'(部門なし)').trim();
      const v=map[code]||(map[code]={code,name:(r[ci.name]||'').trim(),excl:0,tax:0,byLoc:{本社:0,工場:0},byLocExcl:{本社:0,工場:0},byDept:{},lines:[],_tax:0});
      v.excl+=excl;v.tax+=tax;
      if(isTax){ v._tax+=excl+tax; }  // 保留 → 後で商品のある拠点へ按分
      else { v.byLoc[loc]+=excl+tax;v.byLocExcl[loc]+=excl;v.byDept[dn]=(v.byDept[dn]||0)+excl+tax; }
      v.lines.push({date:r[ci.date],slip:r[ci.slip],dept:dn,loc,item,model:(r[ci.model]||'').trim(),excl,tax,incl:excl+tax,dtype:(r[ci.dtype]||'').trim(),isTax});
    }
    // 消費税等（税のみ伝票）を商品のある拠点へ按分（拠点分類を税だけで汚さない）
    Object.values(map).forEach(v=>{ if(!v._tax)return;
      const g=v.byLoc.本社+v.byLoc.工場;
      if(g>0){ const hTax=Math.round(v._tax*(v.byLoc.本社/g)); v.byLoc.本社+=hTax; v.byLoc.工場+=(v._tax-hTax); }
      else { v.byLoc.本社+=v._tax; }
      const deps=Object.entries(v.byDept); if(deps.length){ deps.sort((a,b)=>b[1]-a[1]); v.byDept[deps[0][0]]+=v._tax; } else { v.byDept['(消費税)']=v._tax; }
    });
    vendors=Object.values(map).sort((a,b)=>a.code.localeCompare(b.code));
    msg.textContent=`${vendors.length}仕入先 / ${rows.length-1}明細（${usedFile}）`;
  }catch(e){msg.textContent='エラー';document.getElementById('list-pane').innerHTML=`<div class="empty">受入読込エラー：${e.message}</div>`;snack('受入取得エラー: '+e.message,true);}
}

async function loadMatchState(){
  matchState={};savedState={};archived={};
  try{
    await ensureMatchList();const m=month();
    let items=[],n=`/sites/${AP_SITE}/lists/${M.id}/items?$expand=fields&$top=500`;
    while(n){const d=await gget(n);items=items.concat(d.value||[]);n=d['@odata.nextLink']?d['@odata.nextLink'].replace(GRAPH,''):null;}
    items.forEach(it=>{const f=it.fields;if((f[mi('対象年月')]||'')!==m)return;
      const code=f[mi('仕入先コード')];if(!code)return;
      matchState[code]={itemId:it.id,inv:f[mi('請求書税込')]??null,reason:f[mi('不一致理由')]||'',received:f[mi('請求書受領')]===true,
        status:f[mi('突合状態')]||'',pdfLink:f[mi('PDFリンク')]||'',by:f[mi('突合者')]||'',at:f[mi('突合日時')]||''};
      // 進捗集計は「保存済み」だけを見る（入力中の値でカウントを進めない）
      savedState[code]={inv:f[mi('請求書税込')]??null,received:f[mi('請求書受領')]===true,reason:f[mi('不一致理由')]||'',status:f[mi('突合状態')]||''};
      if(f[mi('突合状態')]==='対象外')archived[code]=true;
    });
  }catch(e){snack('突合状態の読込エラー: '+e.message,true);}
}

function vIncl(v,mode){return mode==='all'?(v.excl+v.tax):(v.byLoc[mode]||0);}
function vExcl(v,mode){return mode==='all'?v.excl:(v.byLocExcl[mode]||0);}
function vLines(v,mode){return mode==='all'?v.lines:v.lines.filter(l=>l.loc===mode);}
function segOn(prefix,m){['all','honsha','kojo'].forEach(x=>{const el=document.getElementById(prefix+x);if(el)el.classList.remove('on');});const el=document.getElementById(prefix+(m==='all'?'all':m==='本社'?'honsha':'kojo'));if(el)el.classList.add('on');}
function setListView(m){listView=m;segOn('vm-',m);renderSummary();renderList();}
function setDetailView(m){detailView=m;if(selectedCode)renderDetail(selectedCode);}
// 完了＝「保存済み」の状態のみで判定。入力中(matchState)ではカウントを進めない。確認中は未完了。
function doneOf(v){if(archived[v.code])return true;const s=savedState[v.code];if(!s||s.inv==null||s.inv==='')return false;
  const diff=Math.round(s.inv)-Math.round(v.excl+v.tax);
  if(diff===0)return true;
  if(s.reason&&s.reason!=='確認中')return true;   // 差異ありでも理由確定(確認中除く)なら完了
  return false;}
function donut(done,total,color,label){const pct=total?done/total:0;const r=26,c=2*Math.PI*r;const off=c*(1-pct);
  return `<div style="text-align:center"><svg width="64" height="64" viewBox="0 0 66 66"><circle cx="33" cy="33" r="${r}" fill="none" stroke="#e6eaf2" stroke-width="8"/><circle cx="33" cy="33" r="${r}" fill="none" stroke="${color}" stroke-width="8" stroke-dasharray="${c.toFixed(1)}" stroke-dashoffset="${off.toFixed(1)}" transform="rotate(-90 33 33)" stroke-linecap="round"/><text x="33" y="31" text-anchor="middle" font-size="13" font-weight="700">${done}/${total}</text><text x="33" y="45" text-anchor="middle" font-size="9" fill="#888">残${total-done}</text></svg><div style="font-size:11px;color:#666">${label}</div></div>`;}
function renderProgress(){
  const all=vendors,hon=vendors.filter(v=>(v.byLoc['本社']||0)>0),ko=vendors.filter(v=>(v.byLoc['工場']||0)>0);
  const dn=arr=>arr.filter(doneOf).length;
  const el=document.getElementById('progress');if(el)el.innerHTML=`<span style="font-size:12px;color:var(--muted);align-self:center">突合進捗</span>${donut(dn(all),all.length,'#1a5fa8','全体')}${donut(dn(hon),hon.length,'#4a90d9','本社')}${donut(dn(ko),ko.length,'#e67e22','工場')}`;
}

function renderSummary(){
  const act=vendors.filter(v=>!archived[v.code]);
  const tot=act.reduce((s,v)=>s+v.excl+v.tax,0);
  const honsha=act.reduce((s,v)=>s+(v.byLoc['本社']||0),0);
  const kojo=act.reduce((s,v)=>s+(v.byLoc['工場']||0),0);
  const matched=act.filter(v=>{const s=savedState[v.code];return s&&s.inv!=null&&s.inv!==''&&Math.round(s.inv)===Math.round(v.excl+v.tax);}).length;
  const rcv=act.filter(v=>savedState[v.code]&&savedState[v.code].received).length;
  document.getElementById('summary').innerHTML=
    `<span class="s">受入合計(税込)<b>${yen(tot)}</b></span><span class="s honsha">本社<b>${yen(honsha)}</b></span><span class="s kojo">工場<b>${yen(kojo)}</b></span><span class="s">仕入先<b>${act.length}</b></span><span class="s">受領<b>${rcv}/${act.length}</b></span><span class="s">突合一致<b>${matched}/${act.length}</b></span>`;
  renderProgress();
}
function vstatus(v){const m=matchState[v.code]||{};const incl=v.excl+v.tax;
  if(m.inv==null||m.inv==='')return {cls:'st-none',txt:'未入力',diff:null};
  const diff=Math.round(m.inv)-Math.round(incl);
  return diff===0?{cls:'st-ok',txt:'一致',diff:0}:{cls:'st-diff',txt:(diff>0?'+':'')+diff.toLocaleString(),diff};
}

    +`</tbody></table>`;
}

  const reasonSel=`<select class="reason" id="r-reason" onchange="setReason('${code}',this.value)"><option value="">理由―</option>
    <option ${m.reason==='SMILE修正'?'selected':''}>SMILE修正</option><option ${m.reason==='先方出し直し'?'selected':''}>先方出し直し</option>
    <option ${m.reason==='締後イレギュラー'?'selected':''}>締後イレギュラー</option><option ${m.reason==='確認中'?'selected':''}>確認中</option></select>`;
  const candHtml=(function(){const linked=invByVendor[code]&&invByVendor[code].length;if(linked)return '';const cs=candidatesFor(v);if(!cs.length)return '';
    return `<div style="background:#fff8e1;border:1px solid #ffe08a;border-radius:6px;padding:8px 10px;margin:6px 0;font-size:12px">この仕入先の請求書が未紐づけかもしれません（コード未割当）：`+cs.map(u=>`<div style="margin-top:4px">「${u.name}」 ${yen(u.incl)} <button onclick="linkInvoice('${u.id}','${code}')" style="font-size:11px;padding:2px 8px;border:1px solid var(--primary);background:#fff;color:var(--primary);border-radius:4px;cursor:pointer">この請求書を紐づける</button></div>`).join('')+`</div>`;})();
  d.innerHTML=`

    <div class="dmetrics">

  segOn('dvm-',detailView);

function pdfFolder(code){return `/BILLS/仕入請求書/${month().replace('/','-')}/${code}`;}
function normPath(p){return String(p||'').replace(/^\/Shared Documents/i,'').replace(/^\/Documents/i,'');}
async function renderPdfList(code){
  const host=document.getElementById('pdf-host');if(!host)return;
  const paths=[];
  // ① AP_Invoiceの仕入行（intake自動登録）のPDF：仕入先コード一致＋支払先名の名寄せフォールバック
  (invByVendor[code]||[]).forEach(p=>{if(!paths.includes(p))paths.push(p);});
  const _v=vendors.find(x=>x.code===code);
  if(_v){(invByName[normName(_v.name)]||[]).forEach(p=>{if(!paths.includes(p))paths.push(p);});}
  // ② 手動添付フォルダ（予備）
  try{const d=await gget(`/sites/${AP_SITE}/drive/root:${encodeURI(pdfFolder(code))}:/children?$select=id,name`);
    (d.value||[]).filter(f=>/\.pdf$/i.test(f.name||'')).forEach(f=>{const p=`${pdfFolder(code)}/${f.name}`;if(!paths.includes(p))paths.push(p);});}catch(e){}
  if(!paths.length){host.innerHTML='<div class="pdf-empty">PDFなし。intakeで自動登録 or 「📎追加」で取り込み<br>本社/工場で複数枚OK</div>';return;}
  if(!pdfSel[code]||!paths.includes(pdfSel[code]))pdfSel[code]=paths[0];
  const chips=paths.map(p=>`<button class="pdf-chip" data-p="${esc(p)}" onclick="showPdf('${code}',this.dataset.p)" title="${esc(p)}">${p.split('/').pop()}</button>`).join('');
  host.innerHTML=`<div class="pdf-chips">${chips}</div><div id="pdf-view"><div class="pdf-empty">読込中...</div></div>`;
  showPdf(code,pdfSel[code]);
}
async function showPdf(code,path){pdfSel[code]=path;
  document.querySelectorAll('.pdf-chip').forEach(b=>b.classList.toggle('on',b.dataset.p===path));
  const view=document.getElementById('pdf-view');if(!view)return;
  if(pdfCache[path]){view.innerHTML=`<iframe class="pdf-frame" src="${pdfCache[path]}"></iframe>`;return;}
  view.innerHTML='<div class="pdf-empty">読込中...</div>';
  try{
    const meta=await gget(`/sites/${AP_SITE}/drive/root:${encodeURI(normPath(path))}?$select=id`);
    const b=await gblob(`${GRAPH}/sites/${AP_SITE}/drive/items/${meta.id}/content`);
    pdfCache[path]=URL.createObjectURL(b);if(pdfSel[code]===path){const vv=document.getElementById('pdf-view');if(vv)vv.innerHTML=`<iframe class="pdf-frame" src="${pdfCache[path]}"></iframe>`;}
  }catch(e){const vv=document.getElementById('pdf-view');if(vv)vv.innerHTML='<div class="pdf-empty">取得失敗: '+(e.message||e)+'</div>';}
}

async function onPdf(code,inp){const f=inp.files[0];if(!f)return;if(f.type!=='application/pdf'){snack('PDFを選んでください',true);return;}
  const safe=f.name.replace(/[#%*<>?/\\{|}:]/g,'_');const path=`${pdfFolder(code)}/${safe}`;
  document.getElementById('pdf-host').innerHTML='<div class="pdf-empty">アップロード中...</div>';
  try{await gputFile(path,f);matchState[code]=matchState[code]||{};matchState[code].pdfLink=pdfFolder(code);pdfSel[code]=null;await renderPdfList(code);snack('📎 追加しました（保存でリンク確定）');}
  catch(e){snack('PDFアップロード失敗: '+e.message,true);await renderPdfList(code);}
}
function fmtDiff(d){return d==null?'-':(d===0?'0':(d>0?'+':'')+d.toLocaleString());}
// 入力中：再描画せず差額・一覧・サマリーのみ更新（フォーカス維持）
function setInvLive(code,val){matchState[code]=matchState[code]||{};matchState[code].inv=val===''?null:parseFloat(val);
  const v=vendors.find(x=>x.code===code);const b=document.getElementById('diff-val');if(v&&b)b.textContent=fmtDiff(vstatus(v).diff);renderList();renderSummary();}
// 確定（blur）：理由欄の出し入れ等のためフル再描画
function setInv(code,val){matchState[code]=matchState[code]||{};matchState[code].inv=val===''?null:parseFloat(val);renderDetail(code);renderList();renderSummary();}
function setReason(code,val){matchState[code]=matchState[code]||{};matchState[code].reason=val;}
function setRecv(code,val){matchState[code]=matchState[code]||{};matchState[code].received=val;renderList();renderSummary();}

async function saveVendor(code,opt){
  const v=vendors.find(x=>x.code===code);if(!v)return;const m=matchState[code]=matchState[code]||{};
  opt=opt||{};
  let inv;
  if(opt.archiveOnly){
    // アーカイブ切替：金額は触らない（保存済み値を維持、AI額は採用しない）
    const s=savedState[code]||{}; inv=(s.inv==null||s.inv==='')?null:parseFloat(s.inv);
  }else if(opt.inv!==undefined){
    // 一括/行内確定：明示された値（AI読取額）を採用
    inv=(opt.inv==null||opt.inv==='')?null:parseFloat(opt.inv);
  }else{
    // 保存ボタン＝人の確認行為。欄の値（AI提案のまま未編集でも可）を採用。
    const box=document.querySelector('.match-in');
    let raw = box ? box.value : (m.inv!=null?m.inv:'');
    if((raw===''||raw==null) && m.inv==null){ const av=aiAmt(code); if(av!=null) raw=av; }
    inv=(raw===''||raw==null)?null:parseFloat(raw);
  }
  if(opt.received!==undefined) m.received=!!opt.received;
  m.inv=inv;  // 保存値として確定（一覧・進捗にも反映）
  const incl=v.excl+v.tax;
  const diff=inv==null?null:Math.round(inv)-Math.round(incl);
  const status=archived[code]?'対象外':(inv==null?'未突合':(diff===0?'一致':'差異あり'));
  const fields={};
  fields[mi('仕入先コード')]=code;fields[mi('仕入先名')]=v.name||'';fields[mi('対象年月')]=month();
  fields[mi('受入税抜')]=v.excl;fields[mi('受入税込')]=incl;
  if(inv!=null)fields[mi('請求書税込')]=inv;fields[mi('差額')]=diff||0;
  fields[mi('突合状態')]=status;fields[mi('不一致理由')]=m.reason||'';fields[mi('請求書受領')]=!!m.received;
  if(m.pdfLink)fields[mi('PDFリンク')]=m.pdfLink;
  fields[mi('突合者')]=acct.name||acct.username;fields[mi('突合日時')]=new Date().toISOString();
  try{
    if(m.itemId){await gpatch(`/sites/${AP_SITE}/lists/${M.id}/items/${m.itemId}/fields`,fields);}
    else{const created=await gpost(`/sites/${AP_SITE}/lists/${M.id}/items`,{fields});matchState[code].itemId=created.id;}
    matchState[code].status=status;matchState[code].by=fields[mi('突合者')];matchState[code].at=fields[mi('突合日時')];
    // 保存済みスナップショットを更新（進捗集計はこれを見る）
    savedState[code]={inv:inv,received:!!m.received,reason:m.reason||'',status:status};
    if(!opt.silent){snack('✅ 保存しました');renderList();renderSummary();renderDetail(code);}
  }catch(e){snack('保存エラー: '+e.message,true);throw e;}
}
// AI読取額＝SMILE受入額（完全一致）かつ未保存確定 → ワンクリック確定の候補
function aiMatch(v){const a=aiAmt(v.code);if(a==null)return false;if(Math.round(a)!==Math.round(v.excl+v.tax))return false;const s=savedState[v.code];const already=s&&s.inv!=null&&Math.round(s.inv)===Math.round(v.excl+v.tax);return !already;}
async function quickConfirm(code){const v=vendors.find(x=>x.code===code);if(!v)return;try{await saveVendor(code,{inv:aiAmt(code),received:true,silent:true});snack('✓ 確定：'+(v.name||code));}catch(e){}renderList();renderSummary();if(selectedCode===code)renderDetail(code);}
async function bulkConfirm(){
  const cands=vendors.filter(v=>!archived[v.code]&&aiMatch(v));
  if(!cands.length){snack('まとめて確定できる（AI一致）仕入先はありません');return;}
  const list=cands.slice(0,40).map(v=>' ・'+v.code+' '+(v.name||'')+'  '+yen(v.excl+v.tax)).join('\n');
  if(!confirm('AI読取額とSMILE受入額が一致している '+cands.length+'社を「一致・受領」で確定します：\n\n'+list+(cands.length>40?'\n …ほか':'')+'\n\nあとで個別に開いて修正できます。確定しますか？'))return;
  let ok=0,ng=0;
  for(const v of cands){try{await saveVendor(v.code,{inv:aiAmt(v.code),received:true,silent:true});ok++;}catch(e){ng++;}}
  snack('まとめて確定：'+ok+'社完了'+(ng?'／'+ng+'社エラー':''));renderList();renderSummary();if(selectedCode)renderDetail(selectedCode);
}
// PDF未着（コード未割当の仕入請求書）を、この仕入先に紐づける（AP_Invoiceの支払先コードを付与）
function candidatesFor(v){const key=normName(v.name);if(!key)return [];return unlinkedInv.filter(u=>u.nm&&(u.nm===key||u.nm.indexOf(key)>=0||key.indexOf(u.nm)>=0));}
// 受領した請求書の金額を突合画面から修正（台帳AP_Invoiceの金額_税込を更新）
async function saveInvAmt(invId,code){
  const el=document.getElementById('ir-'+invId);if(!el)return;const val=Math.round(Number(el.value)||0);
  if(!confirm('この請求書の金額を '+yen(val)+' に修正します（台帳を更新）。よろしいですか？'))return;
  try{await gpatch(`/sites/${AP_SITE}/lists/${INV.id}/items/${invId}/fields`,{[INV.fmap['金額_税込']]:val});
    snack('金額を修正しました');await loadInvoicePdfs();renderDetail(code);renderList();renderSummary();}
  catch(e){snack('修正エラー: '+e.message,true);}
}
// 重複・誤登録の請求書を突合から除外（台帳はアーカイブ）
async function excludeInv(invId,code){
  if(!confirm('この請求書を突合から除外します（台帳ではアーカイブ＝支払対象外）。重複・誤登録の時に使ってください。よろしいですか？'))return;
  try{await gpatch(`/sites/${AP_SITE}/lists/${INV.id}/items/${invId}/fields`,{[INV.fmap['アーカイブフラグ']]:true,[INV.fmap['アーカイブ理由']]:'突合で除外（重複/誤登録）'});
    snack('除外しました');await loadInvoicePdfs();renderDetail(code);renderList();renderSummary();}
  catch(e){snack('除外エラー: '+e.message,true);}
}
async function linkInvoice(invId,code){
  try{await gpatch(`/sites/${AP_SITE}/lists/${INV.id}/items/${invId}/fields`,{[INV.fmap['支払先コード']]:code});
    snack('請求書を紐づけました');await loadInvoicePdfs();renderDetail(code);renderList();}
  catch(e){snack('紐づけエラー: '+e.message,true);}
}
function setArch(code,on){archived[code]=on?true:false;if(!on)delete archived[code];
  saveVendor(code,{archiveOnly:true}); // 状態(対象外/解除)のみ保存。金額・AI額は触らない
  if(on&&code===selectedCode){selectedCode=null;document.getElementById('detail-pane').innerHTML='<div class="empty">左の仕入先を選択してください</div>';}
  renderList();renderSummary();}
function snack(m,e=false){const el=document.getElementById('snackbar');el.textContent=m;el.style.background=e?'#c0392b':'#323232';el.style.display='block';setTimeout(()=>el.style.display='none',4000);}

boot().catch(e=>{console.error(e);snack('認証エラー: '+e.message,true);});
</script>

<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>仕入突合（受入リスト） | 花岡車輌</title>
<script src="https://cdn.jsdelivr.net/npm/@azure/msal-browser@3.10.0/lib/msal-browser.min.js" crossorigin="anonymous"></script>
<style>
  :root{--primary:#1a5fa8;--primary-dk:#134680;--success:#2e7d52;--warning:#c07a00;--danger:#c0392b;--bg:#f4f6f9;--card:#fff;--border:#dde2ec;--text:#1e2533;--muted:#6b7a99;}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'Meiryo','Hiragino Sans',sans-serif;background:var(--bg);color:var(--text);}
  header{background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 24px;height:52px;position:sticky;top:0;z-index:100;box-shadow:0 2px 8px rgba(0,0,0,.2);}
  header .logo{font-size:16px;font-weight:700;}header .logo span{opacity:.7;font-weight:400;font-size:13px;margin-left:10px;}
  header .user-info{display:flex;align-items:center;gap:12px;font-size:13px;}
  header button{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.3);color:#fff;padding:5px 14px;border-radius:4px;cursor:pointer;font-size:12px;}
  #login-view{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:calc(100vh - 52px);gap:20px;}
  #login-btn{background:var(--primary);color:#fff;border:none;padding:12px 36px;border-radius:6px;font-size:15px;font-weight:700;cursor:pointer;display:flex;gap:8px;align-items:center;}
  #app-view{display:none;padding:16px 24px;max-width:1400px;margin:0 auto;}
  .toolbar{display:flex;align-items:center;gap:14px;background:var(--card);padding:10px 16px;border-radius:8px;border:1px solid var(--border);margin-bottom:14px;flex-wrap:wrap;}
  .toolbar label{font-size:13px;color:var(--muted);font-weight:600;}
  .toolbar select,.toolbar input{border:1px solid var(--border);border-radius:4px;padding:5px 8px;font-size:13px;}
  .toolbar .reload{background:var(--primary);color:#fff;border:none;padding:6px 16px;border-radius:5px;cursor:pointer;font-size:13px;}
  .toolbar .links{margin-left:auto;display:flex;gap:14px;}
  .toolbar .links a{font-size:13px;color:var(--primary);text-decoration:none;}
  .summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px;}
  .scard{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:12px 14px;}
  .scard .l{font-size:12px;color:var(--muted);}.scard .v{font-size:20px;font-weight:700;margin-top:2px;}
  .scard.honsha{border-top:3px solid #4a90d9;}.scard.kojo{border-top:3px solid #e67e22;}
  .table-wrap{background:var(--card);border:1px solid var(--border);border-radius:10px;overflow-x:auto;}
  table{width:100%;border-collapse:collapse;font-size:13px;}
  th{background:#f8f9fc;padding:8px 10px;text-align:left;color:var(--muted);font-weight:600;font-size:12px;border-bottom:1px solid var(--border);white-space:nowrap;}
  td{padding:7px 10px;border-bottom:1px solid #f0f3fa;vertical-align:middle;}
  td.num,th.num{text-align:right;white-space:nowrap;}
  tr.v-row{cursor:pointer;}tr.v-row:hover td{background:#f3f7fd;}
  .loc-pill{display:inline-block;font-size:10px;font-weight:700;padding:1px 6px;border-radius:8px;margin-right:3px;}
  .pill-honsha{background:#e6f1fb;color:#185fa5;}.pill-kojo{background:#fbeede;color:#854f0b;}
  .match-in{width:110px;text-align:right;border:1px solid var(--border);border-radius:4px;padding:4px 6px;font-size:13px;}
  .st{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:10px;}
  .st-ok{background:#d4edda;color:#155724;}.st-diff{background:#fdecea;color:var(--danger);}.st-none{background:#eef0f4;color:#777;}
  .reason{font-size:12px;border:1px solid var(--border);border-radius:4px;padding:3px 5px;}
  .detail-row td{background:#fbfcfe;padding:0;}
  .detail-inner{padding:8px 14px;}
  .detail-inner h4{font-size:12px;color:var(--primary);margin:6px 0 4px;}
  table.det{font-size:12px;}table.det th{background:#eef2f8;}
  .empty{color:var(--muted);text-align:center;padding:50px;font-size:14px;}
  #snackbar{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#323232;color:#fff;padding:10px 20px;border-radius:6px;font-size:13px;display:none;z-index:999;}
</style>
</head>
<body>
<header>
  <div class="logo">花岡車輌<span>仕入突合（受入リスト×請求書）</span></div>
  <div class="user-info"><span id="user-name"></span><button onclick="signOut()">サインアウト</button></div>
</header>

<div id="login-view">
  <h2 style="color:#1a5fa8">仕入突合</h2>
  <p style="color:#6b7a99">花岡車輌の Microsoft アカウントでサインインしてください</p>
  <button id="login-btn" onclick="signIn()">
    <svg width="18" height="18" viewBox="0 0 21 21"><path d="M10 0H0v10h10V0z" fill="#F25022"/><path d="M21 0H11v10h10V0z" fill="#7FBA00"/><path d="M10 11H0v10h10V11z" fill="#00A4EF"/><path d="M21 11H11v10h10V11z" fill="#FFB900"/></svg>
    サインイン
  </button>
</div>

<div id="app-view">
  <div class="toolbar">
    <label>受入リスト</label><span id="src-info" style="font-size:12px;color:var(--muted)">総務部 - generalmasters / 9521受入リスト.csv</span>
    <button class="reload" onclick="loadReceipts()">🔄 再読込</button>
    <label>拠点</label><select id="f-loc" onchange="render()"><option value="">全拠点</option><option>本社</option><option>工場</option></select>
    <input id="f-text" placeholder="仕入先で絞込" oninput="render()">
    <span id="status-msg" style="font-size:12px;color:var(--muted)"></span>
    <div class="links"><a href="ap_dashboard.html">📊 ダッシュボード</a></div>
  </div>
  <div class="summary" id="summary"></div>
  <div class="table-wrap"><table>
    <thead><tr><th>仕入先</th><th>拠点</th><th class="num">受入(税抜)</th><th class="num">受入(税込)</th><th class="num">請求書(税込)</th><th class="num">差額</th><th>突合</th><th>不一致理由</th><th class="num">明細</th></tr></thead>
    <tbody id="tbody"><tr><td colspan="9" class="empty">読み込み中...</td></tr></tbody>
  </table></div>
</div>
<div id="snackbar"></div>

<script>
const MSAL_CONFIG={auth:{clientId:'d338d61b-01dc-4c7c-ac6b-aecf7f30d716',authority:'https://login.microsoftonline.com/3933e8a0-c945-4e97-ae67-c82131087cad',redirectUri:window.location.origin+window.location.pathname},cache:{cacheLocation:'sessionStorage'}};
const SCOPES=['User.Read','Sites.Read.All','Files.Read.All'];
const GRAPH='https://graph.microsoft.com/v1.0';
const SITE_PATH='hanaokacorp.sharepoint.com:/sites/msteams_20513c', DRIVE_NAME='generalmasters', FILE_PATH='9521受入リスト.csv';
let msalApp=null,acct=null,vendors=[],matchState={};

async function boot(){msalApp=new msal.PublicClientApplication(MSAL_CONFIG);await msalApp.initialize();await msalApp.handleRedirectPromise();const a=msalApp.getAllAccounts();if(a.length){acct=a[0];msalApp.setActiveAccount(acct);await showApp();}}
async function signIn(){try{const r=await msalApp.loginPopup({scopes:SCOPES});acct=r.account;msalApp.setActiveAccount(acct);await showApp();}catch(e){if(e.errorCode!=='user_cancelled')snack('サインインエラー: '+e.message,true);}}
function signOut(){msalApp.logoutPopup({account:acct});}
async function token(){try{const r=await msalApp.acquireTokenSilent({scopes:SCOPES,account:acct});return r.accessToken;}catch{const r=await msalApp.acquireTokenPopup({scopes:SCOPES});acct=r.account;return r.accessToken;}}
async function gget(p){const t=await token();const r=await fetch(GRAPH+p,{headers:{Authorization:'Bearer '+t}});if(!r.ok)throw new Error('['+r.status+'] '+p);return r.json();}
async function gtext(url){const t=await token();const r=await fetch(url,{headers:{Authorization:'Bearer '+t}});if(!r.ok)throw new Error('['+r.status+'] file');const b=await r.arrayBuffer();return new TextDecoder('utf-8').decode(b);}

async function showApp(){document.getElementById('login-view').style.display='none';document.getElementById('app-view').style.display='block';document.getElementById('user-name').textContent=acct.name||acct.username;await loadReceipts();}

async function resolveDrive(){
  const site=await gget(`/sites/${SITE_PATH}`);
  const dr=await gget(`/sites/${site.id}/drives?$select=id,name`);
  const d=(dr.value||[]).find(x=>x.name===DRIVE_NAME);
  if(d)return d.id;
  throw new Error(`ドライブ "${DRIVE_NAME}" が見つかりません。存在するドライブ: ${(dr.value||[]).map(x=>x.name).join(' / ')}`);
}

// CSV parser（カンマ区切り・ダブルクォート対応）
function parseCSV(text){
  if(text.charCodeAt(0)===0xFEFF)text=text.slice(1);
  const rows=[];let row=[],cur='',q=false;
  for(let i=0;i<text.length;i++){const c=text[i];
    if(q){if(c==='"'){if(text[i+1]==='"'){cur+='"';i++;}else q=false;}else cur+=c;}
    else{if(c==='"')q=true;else if(c===','){row.push(cur);cur='';}else if(c==='\n'){row.push(cur);rows.push(row);row=[];cur='';}else if(c==='\r'){}else cur+=c;}
  }
  if(cur!==''||row.length){row.push(cur);rows.push(row);}
  return rows;
}
function locOf(deptName,whName){return /工場/.test(String(deptName||'')+String(whName||''))?'工場':'本社';}

async function loadReceipts(){
  const msg=document.getElementById('status-msg');msg.textContent='読み込み中...';
  try{
    const driveId=await resolveDrive();
    const text=await gtext(`${GRAPH}/drives/${driveId}/root:/${encodeURIComponent(FILE_PATH)}:/content`);
    const rows=parseCSV(text);
    const h=rows[0];const idx=n=>h.findIndex(x=>x.replace(/\s/g,'')===n);
    const ci={code:idx('仕入先ｺｰﾄﾞ'),name:idx('仕入先略称'),dept:idx('部門名称'),item:idx('品目名'),model:idx('型番'),
      excl:idx('税抜受入金額'),tax:idx('消費税等'),wh:idx('倉庫略称'),date:idx('伝票日付'),slip:idx('伝票№'),
      dtype:idx('取引区分略称')};
    const map={};
    for(let i=1;i<rows.length;i++){const r=rows[i];if(!r||!r[ci.code])continue;
      const excl=parseFloat(r[ci.excl])||0;const tax=parseFloat(r[ci.tax])||0;
      const code=r[ci.code].trim();const loc=locOf(r[ci.dept],r[ci.wh]);
      const v=map[code]||(map[code]={code,name:(r[ci.name]||'').trim(),excl:0,tax:0,byLoc:{本社:0,工場:0},byDept:{},lines:[]});
      v.excl+=excl;v.tax+=tax;v.byLoc[loc]=(v.byLoc[loc]||0)+excl+tax;
      const dn=(r[ci.dept]||'(部門なし)').trim();v.byDept[dn]=(v.byDept[dn]||0)+excl+tax;
      v.lines.push({date:r[ci.date],slip:r[ci.slip],dept:dn,loc,item:(r[ci.item]||'').trim(),model:(r[ci.model]||'').trim(),excl,tax,incl:excl+tax,dtype:(r[ci.dtype]||'').trim()});
    }
    vendors=Object.values(map).sort((a,b)=>(b.excl+b.tax)-(a.excl+a.tax));
    msg.textContent=`${vendors.length}仕入先 / ${rows.length-1}明細`;
    render();
  }catch(e){msg.textContent='エラー';document.getElementById('tbody').innerHTML=`<tr><td colspan="9" class="empty">読み込みエラー：${e.message}</td></tr>`;snack('取得エラー: '+e.message,true);}
}

function yen(n){return '¥'+Math.round(parseFloat(n)||0).toLocaleString();}
function render(){
  const fl=document.getElementById('f-loc').value;const ft=document.getElementById('f-text').value.trim();
  let list=vendors.slice();
  if(fl)list=list.filter(v=>(v.byLoc[fl]||0)>0);
  if(ft)list=list.filter(v=>v.name.includes(ft)||v.code.includes(ft));
  // サマリー
  const tot=vendors.reduce((s,v)=>s+v.excl+v.tax,0);
  const honsha=vendors.reduce((s,v)=>s+(v.byLoc['本社']||0),0);
  const kojo=vendors.reduce((s,v)=>s+(v.byLoc['工場']||0),0);
  const matched=vendors.filter(v=>{const m=matchState[v.code];return m&&m.inv&&Math.round(m.inv)===Math.round(v.excl+v.tax);}).length;
  document.getElementById('summary').innerHTML=
    `<div class="scard"><div class="l">受入合計(税込)</div><div class="v">${yen(tot)}</div></div>
     <div class="scard honsha"><div class="l">本社</div><div class="v">${yen(honsha)}</div></div>
     <div class="scard kojo"><div class="l">工場</div><div class="v">${yen(kojo)}</div></div>
     <div class="scard"><div class="l">仕入先数</div><div class="v">${vendors.length}</div></div>
     <div class="scard"><div class="l">突合一致</div><div class="v">${matched}/${vendors.length}</div></div>`;
  const tb=document.getElementById('tbody');
  if(!list.length){tb.innerHTML='<tr><td colspan="9" class="empty">該当なし</td></tr>';return;}
  tb.innerHTML=list.map(v=>{
    const incl=v.excl+v.tax;const m=matchState[v.code]||{};const inv=m.inv;
    const diff=(inv!=null&&inv!=='')?Math.round(inv)-Math.round(incl):null;
    const locs=Object.entries(v.byLoc).filter(([k,x])=>x>0).map(([k])=>`<span class="loc-pill ${k==='工場'?'pill-kojo':'pill-honsha'}">${k}</span>`).join('');
    let st='<span class="st st-none">未入力</span>';
    if(diff!==null)st=diff===0?'<span class="st st-ok">一致</span>':`<span class="st st-diff">差${diff>0?'+':''}${diff.toLocaleString()}</span>`;
    const reasonSel=`<select class="reason" onchange="setReason('${v.code}',this.value)"><option value="">―</option>
      <option ${m.reason==='SMILE修正'?'selected':''}>SMILE修正</option><option ${m.reason==='先方出し直し'?'selected':''}>先方出し直し</option>
      <option ${m.reason==='締後イレギュラー'?'selected':''}>締後イレギュラー</option><option ${m.reason==='確認中'?'selected':''}>確認中</option></select>`;
    return `<tr class="v-row" onclick="toggle('${v.code}',event)">
      <td>${v.name||'(名称なし)'}<div style="font-size:10px;color:var(--muted)">${v.code}</div></td>
      <td>${locs}</td><td class="num">${yen(v.excl)}</td><td class="num"><b>${yen(incl)}</b></td>
      <td class="num"><input class="match-in" type="number" value="${inv!=null?inv:''}" placeholder="入力" onclick="event.stopPropagation()" oninput="setInv('${v.code}',this.value)"></td>
      <td class="num">${diff!==null?(diff===0?'0':(diff>0?'+':'')+diff.toLocaleString()):'-'}</td>
      <td>${st}</td><td onclick="event.stopPropagation()">${diff!==null&&diff!==0?reasonSel:'<span style="color:#ccc;font-size:12px">―</span>'}</td>
      <td class="num">${v.lines.length}</td></tr>
      <tr class="detail-row" id="d-${v.code}" style="display:none"><td colspan="9"><div class="detail-inner" id="di-${v.code}"></div></td></tr>`;
  }).join('');
}
function setInv(code,val){matchState[code]=matchState[code]||{};matchState[code].inv=val===''?null:parseFloat(val);
  const v=vendors.find(x=>x.code===code);const incl=v.excl+v.tax;const diff=(val===''?null:Math.round(parseFloat(val))-Math.round(incl));
  // 行内のみ軽量更新
  render();
}
function setReason(code,val){matchState[code]=matchState[code]||{};matchState[code].reason=val;}
function toggle(code,ev){const d=document.getElementById('d-'+code);if(!d)return;
  if(d.style.display==='none'){const v=vendors.find(x=>x.code===code);
    const byDept=Object.entries(v.byDept).sort((a,b)=>b[1]-a[1]).map(([k,x])=>`<span class="loc-pill ${/工場/.test(k)?'pill-kojo':'pill-honsha'}">${k} ${yen(x)}</span>`).join(' ');
    const lines=v.lines.slice().sort((a,b)=>(a.date||'').localeCompare(b.date||'')).map(l=>`<tr><td>${l.date||''}</td><td>${l.slip||''}</td><td><span class="loc-pill ${l.loc==='工場'?'pill-kojo':'pill-honsha'}">${l.loc}</span>${l.dept}</td><td>${l.item}</td><td>${l.model}</td><td class="num">${yen(l.excl)}</td><td class="num">${yen(l.tax)}</td><td class="num">${yen(l.incl)}</td><td>${l.dtype}</td></tr>`).join('');
    document.getElementById('di-'+code).innerHTML=`<h4>拠点・部門別内訳</h4><div>${byDept}</div>
      <h4>受入明細（${v.lines.length}件）</h4><table class="det"><thead><tr><th>伝票日</th><th>伝票№</th><th>拠点・部門</th><th>品目</th><th>型番</th><th class="num">税抜</th><th class="num">消費税</th><th class="num">税込</th><th>区分</th></tr></thead><tbody>${lines}</tbody></table>`;
    d.style.display='';
  }else d.style.display='none';
}
function snack(m,e=false){const el=document.getElementById('snackbar');el.textContent=m;el.style.background=e?'#c0392b':'#323232';el.style.display='block';setTimeout(()=>el.style.display='none',4000);}

boot().catch(e=>{console.error(e);snack('認証エラー: '+e.message,true);});
</script>
</body>
</html>

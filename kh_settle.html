<!--
  株式会社ハナオカ 支払決済（月1回・月末）。花岡車輌のワークフロー・支払アプリとは別。
  データ：SharePoint サイト hanaoka-kh の KH_ リスト（admin\Provision-KH.ps1 で作る）。決まり（人・振込元・突合の決まり）は KH_Setting の kh.rules。
  流れ：総務が登録（毎月定額の展開・都度・給与の取り込み）→ 確認に回す → 室長 → 社長（不在：室長を省く／室長が社長の代理）→ 全銀データ → 入出金明細で突合
  この HTML に会社のデータ・口座・人を書かない（公開リポジトリ）。
-->
<style>

*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--txt);font:14px/1.5 "Yu Gothic UI","Meiryo",system-ui,sans-serif}
header{background:#fff;border-bottom:1px solid var(--line);padding:10px 20px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;position:sticky;top:0;z-index:5}

<div id="login-view" style="display:none"><h1>株式会社ハナオカ 支払決済</h1><p data-ha-login>サインインしてください</p><button data-ha-login class="pri" onclick="signIn()">サインイン</button></div>

<script>
'use strict';
const SCOPES = ['User.Read', 'Sites.ReadWrite.All', 'Files.ReadWrite.All'];
const GRAPH = 'https://graph.microsoft.com/v1.0';
const SITE_PATH = 'hanaokacorp.sharepoint.com:/sites/hanaoka-kh';
const STEPS = [['draft', '登録中'], ['shitsucho', '室長の確認'], ['shacho', '社長の確認'], ['done', '承認済']];
const LISTS = ['KH_Setting', 'KH_Payee', 'KH_Recurring', 'KH_Loan', 'KH_Payment', 'KH_Payroll', 'KH_Settle', 'KH_BankTxn', 'KH_Notify'];
const yen = n => (n < 0 ? '−' : '') + Math.abs(Math.round(n || 0)).toLocaleString('ja-JP');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const ymLabel = ym => `${+ym.slice(0, 4)}年${+ym.slice(5)}月`;
const addMonth = (ym, d) => { const [y, m] = ym.split('-').map(Number); const t = new Date(y, m - 1 + d, 1); return `${t.getFullYear()}-${String(t.getMonth() + 1).padStart(2, '0')}`; };
const daysIn = ym => { const [y, m] = ym.split('-').map(Number); return new Date(y, m, 0).getDate(); };
const monthsBetween = (a, b) => { const [y1, m1] = a.split('-').map(Number), [y2, m2] = b.split('-').map(Number); return (y2 - y1) * 12 + (m2 - m1); };
const sum = a => a.reduce((x, y) => x + (+y || 0), 0);
const $ = s => document.querySelector(s);
const now = () => new Date().toLocaleString('ja-JP', { year: 'numeric', month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' });
function snack(t, err) { const d = document.createElement('div'); d.className = 'snack' + (err ? ' err' : ''); d.textContent = t; document.body.appendChild(d); setTimeout(() => d.remove(), err ? 8000 : 4000); }
const J = (s, d) => { try { return s ? JSON.parse(s) : d; } catch { return d; } };

// ---------- サインイン・Graph ----------
let msalApp, acct, SITE, LID = {};
async function boot() {
  msalApp = new msal.PublicClientApplication(HanaokaAuth.msalConfig()); await msalApp.initialize(); await msalApp.handleRedirectPromise();
  acct = await HanaokaAuth.restore(msalApp, SCOPES);
  if (acct) return start();
  HanaokaAuth.done(); $('#login-view').style.display = '';
}
async function signIn() { try { acct = await HanaokaAuth.login(msalApp, SCOPES); start(); } catch (e) { if (e.errorCode !== 'user_cancelled') snack('サインインできません：' + e.message, 1); } }
async function token() { try { return (await msalApp.acquireTokenSilent({ scopes: SCOPES, account: acct })).accessToken; } catch { const r = await msalApp.acquireTokenPopup({ scopes: SCOPES }); acct = r.account; return r.accessToken; } }
async function g(method, p, body, type) {
  const t = await token(), h = { Authorization: 'Bearer ' + t };
  if (body !== undefined && !type) h['Content-Type'] = 'application/json';
  if (type) h['Content-Type'] = type;
  const r = await fetch(p.startsWith('http') ? p : GRAPH + p, { method, headers: h, body: body === undefined ? undefined : type ? body : JSON.stringify(body) });
  if (!r.ok) throw new Error(`[${r.status}] ${method} ${p.split('?')[0]} ${await r.text().catch(() => '')}`.slice(0, 400));
  return r.status === 204 ? null : r.json();
}
async function gall(p) { let out = [], n = p; while (n) { const d = await g('GET', n); out = out.concat(d.value || []); n = d['@odata.nextLink'] || null; } return out; }
const items = name => gall(`/sites/${SITE}/lists/${LID[name]}/items?$expand=fields&$top=500`);
const addItem = (name, fields) => g('POST', `/sites/${SITE}/lists/${LID[name]}/items`, { fields });
const setItem = (name, id, fields) => g('PATCH', `/sites/${SITE}/lists/${LID[name]}/items/${id}/fields`, fields);
const delItem = (name, id) => g('DELETE', `/sites/${SITE}/lists/${LID[name]}/items/${id}`);
const putFile = (path, blob) => g('PUT', `/sites/${SITE}/drive/root:${encodeURI(path)}:/content`, blob, blob.type || 'application/octet-stream');

// ---------- データ ----------
let R, ME, ROLE, DB = {};
const S = { ym: null, tab: null };
const MNAME = () => R.methods;
async function start() {
  $('#login-view').style.display = 'none'; $('#app-view').style.display = ''; document.documentElement.classList.add('kh-in');
  try {
    SITE = (await g('GET', `/sites/${SITE_PATH}?$select=id`)).id;
    const ls = await gall(`/sites/${SITE}/lists?$select=id,displayName`); ls.forEach(l => LID[l.displayName] = l.id);
    const miss = LISTS.filter(n => !LID[n]); if (miss.length) throw new Error('リストがありません：' + miss.join('・') + '（admin\\Provision-KH.ps1 -Apply）');
    await reload();
    // サインインの名前は UPN（@…onmicrosoft.com）かメール（@…co.jp）のどちらか。@ の前で同じ人とみなす
    const P = R.people, lc = s => String(s || '').toLowerCase().split('@')[0];
    ME = lc(acct.username);
    ROLE = P.register.map(lc).includes(ME) ? 'fukuda' : lc(P.shitsucho) === ME ? 'shitsucho' : lc(P.shacho) === ME ? 'shacho' : 'viewer';
    $('#me').textContent = `${acct.name || ME}（${{ fukuda: '登録', shitsucho: '室長', shacho: '社長', viewer: '閲覧' }[ROLE]}）`;
    const q = new URLSearchParams(location.search).get('ym');
    const yms = allYms(); S.ym = q && yms.includes(q) ? q : yms.at(-1) || thisYm();
    S.tab = ROLE === 'fukuda' ? 'list' : (['shitsucho', 'shacho'].includes(ROLE) && settle(S.ym).Status === ROLE) ? 'review' : 'summary';
    render();
  } catch (e) { $('#main').innerHTML = `<div class="card"><b>読み込めませんでした</b><p class="small">${esc(e.message)}</p></div>`; }
}
const thisYm = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`; };
async function reload() {
  const [st, pe, rc, lo, pa, pr, se, bk] = await Promise.all(['KH_Setting', 'KH_Payee', 'KH_Recurring', 'KH_Loan', 'KH_Payment', 'KH_Payroll', 'KH_Settle', 'KH_BankTxn'].map(items));
  R = J(st.find(x => x.fields.Title === 'kh.rules')?.fields.Value, null); if (!R) throw new Error('KH_Setting に kh.rules がありません（Provision-KH.ps1 -Apply）');
  const f = x => ({ id: x.id, ...x.fields });
  DB.payees = pe.map(f); DB.recurring = rc.map(f); DB.loans = lo.map(f);
  DB.payments = pa.map(x => { const v = x.fields; return { id: x.id, ym: v.YM, order: v.SortNo || 0, sec: v.Section || 'other', kamoku: v.Kamoku || '', payee: v.Payee || '', memo: v.Memo || '', seikyu: v.Seikyu || 0, kakutei: v.Kakutei || 0, tax: v.Tax || 0, gensen: v.Gensen || 0, fee: v.Fee || 0, pay: v.Pay || 0, method: v.Method || 'furikomi', due: v.DueDate || '', note: v.Note || '', source: v.Source || '', recurringId: v.RecurringId || '', bankKey: v.BankKey || '', varies: !!v.Varies, files: J(v.Files, []).concat(v.PdfPath && !J(v.Files, []).some(f => f.path === v.PdfPath) ? [{ path: v.PdfPath, name: v.PdfPath.split('/').pop(), type: /\.pdf$/i.test(v.PdfPath) ? 'application/pdf' : '' }] : []) }; });
  DB.payroll = Object.fromEntries(pr.map(x => [x.fields.Title, { id: x.id, payDate: x.fields.PayDate, file: x.fields.FileName, ...J(x.fields.Data, { people: [], total: {} }) }]));
  DB.settle = Object.fromEntries(se.map(x => { const v = x.fields; return [v.Title, { id: x.id, Status: v.Status || 'draft', SkipShitsucho: !!v.SkipShitsucho, ShachoAbsent: !!v.ShachoAbsent, Checks: J(v.Checks, { shitsucho: {}, shacho: {} }), Comments: J(v.Comments, {}), Log: J(v.Log, []), Hash: v.Hash || '', Total: v.Total || 0, ZenginAt: v.ZenginAt || '', ZenginBy: v.ZenginBy || '' }]; }));
  DB.bank = bk.map(x => { const v = x.fields; return { sid: x.id, id: v.Title, ym: v.YM, date: v.TxnDate, io: v.IO, kind: v.Kind, amount: v.Amount || 0, who: v.Who || '', bankName: v.BankName || '', desc: v.Descr || '', mt: v.MatchType || '', ml: v.MatchLabel || '', mp: v.MatchPay || '' }; });
}
function settle(ym) { return DB.settle[ym] ||= { id: null, Status: 'draft', SkipShitsucho: false, ShachoAbsent: false, Checks: { shitsucho: {}, shacho: {} }, Comments: {}, Log: [], Hash: '', Total: 0 }; }
async function saveSettle(ym) {
  const s = settle(ym), f = { Title: ym, Status: s.Status, SkipShitsucho: s.SkipShitsucho, ShachoAbsent: s.ShachoAbsent, Checks: JSON.stringify(s.Checks), Comments: JSON.stringify(s.Comments), Log: JSON.stringify(s.Log), Hash: s.Hash, Total: s.Total, ZenginAt: s.ZenginAt || '', ZenginBy: s.ZenginBy || '' };
  if (s.id) await setItem('KH_Settle', s.id, f); else s.id = (await addItem('KH_Settle', f)).id;
}
function allYms() { return [...new Set([...DB.payments.map(p => p.ym), ...Object.keys(DB.payroll), ...Object.keys(DB.settle)])].filter(Boolean).sort(); }
const payments = ym => DB.payments.filter(p => p.ym === ym).sort((a, b) => (a.sec === b.sec ? 0 : a.sec === 'other' ? -1 : 1) || a.order - b.order);
const payroll = ym => DB.payroll[ym] || null;
function itemsOf(ym) { const ps = payments(ym).map(p => ({ kind: 'pay', id: 'p' + p.id, p })); const pr = payroll(ym); if (pr) ps.push({ kind: 'salary', id: ym + '-salary', pr }); return ps; }
const itemAmt = it => it.kind === 'salary' ? it.pr.total.bank : it.p.pay;
const itemName = it => it.kind === 'salary' ? `給与（${it.pr.people.length}名）` : it.p.payee;
const itemMethod = it => it.kind === 'salary' ? 'salary' : it.p.method;
const needsOk = it => it.kind !== 'salary';
const norm = s => String(s || '').replace(/[\s　()（）㈱]|株式会社/g, '');
const matchKey = p => norm(p.payee) + '|' + p.kamoku;
function prevAmt(ym, it, back = 1) {
  const pym = addMonth(ym, -back);
  if (it.kind === 'salary') return payroll(pym)?.total.bank ?? null;
  const k = matchKey(it.p), hit = payments(pym).filter(q => matchKey(q) === k);
  return hit.length ? sum(hit.map(q => q.pay)) : null;
}
function totals(ym) { const t = { all: 0, by: {} }; for (const it of itemsOf(ym)) { const m = itemMethod(it), a = itemAmt(it); t.by[m] = (t.by[m] || 0) + a; if (m !== 'tatekae') t.all += a; } return t; }
const payeeOf = name => DB.payees.find(p => p.Active !== false && norm(p.Title) && (norm(name).includes(norm(p.Title)) || norm(p.Title).includes(norm(name))));

// ---------- 気づき ----------
function flags(ym) {
  const out = [], F = R.flags;
  for (const it of itemsOf(ym)) {

// ---------- 突合 ----------
function reconcile(ym) {
  const M = R.match, rows = DB.bank.filter(b => b.ym === ym).map(b => ({ ...b, m: null })).sort((a, b) => a.date.localeCompare(b.date) || a.id.localeCompare(b.id));
  const used = new Set(), ps = payments(ym), pr = payroll(ym), payHit = {};

  for (const row of rows) if (row.mt) { take(row, { type: row.mt, label: row.ml, pay: row.mp, manual: 1 }); if (row.mp) payHit[row.mp] = row.id; }
  const free = r => !used.has(r.id);
  const fk = ps.filter(p => p.method === 'furikomi'), fkSum = sum(fk.map(p => p.pay));
  if (fk.length) { const r = rows.find(r => free(r) && r.io === 'out' && r.desc === M.lumpDesc && r.amount === fkSum); if (r) { take(r, { type: 'furikomi', label: `月末の総合振込（${transfers(ym).length}件）` }); fk.forEach(p => payHit['p' + p.id] = r.id); } }
  if (pr) { const r = rows.find(r => free(r) && r.io === 'out' && r.desc === M.lumpDesc && r.amount === pr.total.bank); if (r) { take(r, { type: 'salary', label: `給与振込（${pr.people.length}名）` }); payHit[ym + '-salary'] = r.id; } }
  for (const p of ps.filter(p => ['jidou', 'nouzei', 'genkin'].includes(p.method) && !payHit['p' + p.id])) {
    let re = null; try { const k = p.bankKey || payeeOf(p.payee)?.BankKey; re = k ? new RegExp(k) : null; } catch { }
    const cand = rows.filter(r => free(r) && r.io === 'out' && r.amount === p.pay && (!re || re.test(r.desc + ' ' + r.who)));
    if (cand.length) { take(cand[0], { type: 'pay', pay: 'p' + p.id, label: p.payee }); payHit['p' + p.id] = cand[0].id; }
  }
  for (const r of rows) {
    if (!free(r)) continue;
    const s = r.desc + ' ' + r.who;
    if (r.io === 'out') { const h = M.fee.find(x => new RegExp(x.re).test(s)); if (h) take(r, { type: 'fee', label: h.label }); }
    else { const h = M.income.find(x => new RegExp(x.re).test(s)); if (h) take(r, { type: 'income', label: h.label }); }
  }
  const missing = ps.filter(p => ['furikomi', 'jidou', 'nouzei', 'genkin'].includes(p.method) && !payHit['p' + p.id]);
  if (pr && !payHit[ym + '-salary']) missing.push({ payee: '給与', pay: pr.total.bank, method: 'salary' });
  return { rows, missing, payHit };
}

async function flow(act) {

    else await notify(P.shitsucho, `【確認のお願い】${lab}（${amt}）の確認をお願いします。${st.ShachoAbsent ? '（社長不在のため、続けて社長の代理で承認をお願いします）' : ''}`, ym);

      else { await saveSettle(ym); await notify(P.shacho, `【確認のお願い】${lab}（${amt}）。室長の確認が済みました。確認をお願いします。`, ym); snack('承認しました（社長へ Teams で案内）'); }

}

async function newMonth() {

  if (!confirm(`${ymLabel(ym)}を作ります。毎月定額 ${recs.length}件を並べます（利息は ${days}日で計算）。`)) { render(); return; }
  const pm = String(+addMonth(ym, -1).slice(5)), cm = String(+ym.slice(5));
  try {
    let i = 0;
    for (const x of recs) {
      const no = x.StartNo ? x.StartNo + monthsBetween(x.StartYM, ym) : '';
      const memo = String(x.MemoTpl || '').replace(/\{前月\}/g, pm).replace(/\{当月\}/g, cm).replace(/\{回\}/g, no).replace(/\{総回数\}/g, x.TotalNo || '');
      let kakutei = x.Kakutei || 0, tax = x.Tax || 0;
      if (x.Calc === 'interest') { kakutei = sum(DB.loans.filter(l => l.Active !== false && (!l.EndYM || l.EndYM >= ym)).map(l => Math.floor(l.Principal * l.Rate * days / R.interest.basis))); tax = 0; }
      const q = { ym, order: ++i, sec: x.Section || 'other', kamoku: x.Kamoku, payee: x.Payee, memo, kakutei, tax, gensen: x.Gensen || 0, fee: x.Fee || 0, method: x.Method, due: x.DueDay ? `${ym}-${String(Math.min(x.DueDay, days)).padStart(2, '0')}` : '', note: x.Note || '', source: x.Calc === 'interest' ? '利息' : '定額', recurringId: String(x.id), bankKey: payeeOf(x.Payee)?.BankKey || '', varies: !!x.Varies, files: [] };
      q.pay = q.kakutei + q.tax - q.gensen - q.fee;

    }

    S.ym = ym; S.tab = 'list'; snack(`${ymLabel(ym)}を作りました`); render();
  } catch (e) { snack(e.message, 1); render(); }
}

function parseBankCsv(text) {
  const out = [], wareki = s => /^(\d{2})(\d{2})(\d{2})$/.test(s) ? `${2018 + +RegExp.$1}-${RegExp.$2}-${RegExp.$3}` : '';
  for (const line of text.split(/\r?\n/)) {
    const c = [...line.matchAll(/("([^"]*)"|[^,]*)(,|$)/g)].map(m => m[2] ?? m[1]); if (c[0] !== '2') continue;
    const date = wareki(c[2]); if (!date) continue;
    out.push({ id: `${c[2]}-${c[1]}`, date, ym: date.slice(0, 7), io: c[4] === '1' ? 'in' : 'out', kind: c[5], amount: +c[6] || 0, who: (c[14] || '').trim(), bankName: c[15] || '', desc: (c[17] || '').trim() });
  }
  return out;
}
async function importBank(files) {
  let add = 0, skip = 0;
  try {
    for (const file of files) {
      const buf = await file.arrayBuffer(), rows = parseBankCsv(new TextDecoder('shift_jis').decode(buf));
      if (!rows.length) { snack(`${file.name}：入出金明細の形ではありません`, 1); continue; }
      await putFile(`/KH/入出金明細/${rows[0].date}_${rows.at(-1).date}_${file.name}`, new Blob([buf], { type: 'text/csv' }));
      const have = new Set(DB.bank.map(b => b.id));
      for (const r of rows) { if (have.has(r.id)) { skip++; continue; } const it = await addItem('KH_BankTxn', { Title: r.id, YM: r.ym, TxnDate: r.date, IO: r.io, Kind: r.kind, Amount: r.amount, Who: r.who, BankName: r.bankName, Descr: r.desc, SrcFile: file.name }); DB.bank.push({ ...r, sid: it.id, mt: '', ml: '', mp: '' }); have.add(r.id); add++; }
    }
    snack(`入出金明細：${add}件を取り込み（${skip}件は取り込み済み）`); render();
  } catch (e) { snack(e.message, 1); }
}

const PL = { '課税支給合計': 'taxable', '立替経費': 'tatekae', '支給合計': 'gross', '社保控除合計': 'shaho', '所得税': 'shotoku', '住民税': 'jumin', '控除合計': 'deduct', '差引支給額': 'net', '振込支給額': 'bank' };
async function importPayroll(file) {
  try {
    const wb = XLSX.read(await file.arrayBuffer()), a = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header: 1, raw: true, defval: '' });
    const ymM = String(a[0]?.[0] || '').match(/(\d{4})年(\d{1,2})月分/); if (!ymM) throw new Error('「YYYY年MM月分」が見つかりません（給与支給控除一覧表？）');

    const payDate = pd ? `${ymM[1]}-${pd[1].padStart(2, '0')}-${pd[2].padStart(2, '0')}` : '';

    const f = { Title: ym, PayDate: payDate, FileName: file.name, BankTotal: total.bank, Tatekae: total.tatekae || 0, Data: JSON.stringify({ people, total }) };
    if (DB.payroll[ym]) await setItem('KH_Payroll', DB.payroll[ym].id, f); else f.id = (await addItem('KH_Payroll', f)).id;

}

    else if (t.dataset.zengin) return makeZengin();
    else if (t.dataset.addbank) { const b = DB.bank.find(x => x.id === t.dataset.addbank); return editDialog({ payee: b.who || b.desc, memo: `${b.date} 引落`, kakutei: b.amount, method: /^PE /.test(b.who) ? 'nouzei' : 'jidou', due: b.date, bankKey: (b.desc.replace(/^ｺｳｻﾞﾌﾘｶｴ\s*/, '') || b.who).trim().replace(/[.*+?^${}()|[\]\\]/g, '\\$&') }, '通帳'); }
    else if (t.dataset.ignore) { const why = prompt('対象外にする理由（例：資金移動）', ''); if (why == null) return; return setMatch(t.dataset.ignore, { type: 'ignore', label: '対象外：' + why }); }
    else if (t.dataset.unmatch) { e.preventDefault(); return setMatch(t.dataset.unmatch, null); }
    else if (t.dataset.pdf) { e.preventDefault(); return openPdf(t.dataset.pdf); }
    else if ('payee' in t.dataset) return payeeDialog(DB.payees.find(p => String(p.id) === t.dataset.payee));
    else if ('rec' in t.dataset) return recDialog(DB.recurring.find(x => String(x.id) === t.dataset.rec));
    else if ('flag' in t.dataset) { if (t.dataset.ftab) S.tab = t.dataset.ftab; else if (t.dataset.flag) { svSel = t.dataset.flag; S.tab = 'review'; } }
    render();
  } catch (err) { snack(err.message, 1); }
});
document.addEventListener('change', e => {
  if (e.target.id === 'ym') { if (e.target.value === '__new') return newMonth(); S.ym = e.target.value; render(); }
  else if (e.target.dataset.file === 'bank') importBank([...e.target.files]);
  else if (e.target.dataset.file === 'payroll' && e.target.files[0]) importPayroll(e.target.files[0]);
});
boot();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>予約状況 会議室 | 花岡車輌</title>
  <script src="https://cdn.jsdelivr.net/npm/@azure/msal-browser@3.10.0/lib/msal-browser.min.js" crossorigin="anonymous"></script>
  <script src="nav.js" defer></script>
  <style>
    :root{
      --primary:#1a5fa8; --primary-dk:#134680; --accent:#e8412e;
      --success:#2e7d52; --warning:#c07a00; --danger:#c0392b;
      --bg:#f4f6f9; --card-bg:#fff; --border:#dde2ec; --text:#1e2533; --muted:#6b7a99;
      --shadow:0 1px 4px rgba(0,0,0,.08);
      --namew:230px; --dayw:128px; --hourw:60px; --lane:28px;
    }
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Meiryo','Hiragino Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}

    header{background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:space-between;
      padding:0 20px;height:52px;box-shadow:0 2px 8px rgba(0,0,0,.2);position:sticky;top:0;z-index:100}
    header .logo{font-size:16px;font-weight:700;letter-spacing:.04em}
    header .logo span{opacity:.7;font-weight:400;font-size:13px;margin-left:10px}
    header .user-info{display:flex;align-items:center;gap:12px;font-size:13px}
    header button{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.3);color:#fff;
      padding:5px 14px;border-radius:4px;cursor:pointer;font-size:12px}
    header button:hover{background:rgba(255,255,255,.25)}

    #login-view{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:calc(100vh - 52px);gap:20px}
    #login-view h2{font-size:20px;color:var(--primary)}
    #login-view p{color:var(--muted);font-size:14px}
    #login-btn{background:var(--primary);color:#fff;border:none;padding:12px 36px;border-radius:6px;
      font-size:15px;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:8px}
    #login-btn:hover{background:var(--primary-dk)}

    #app-view{display:none;padding:18px}

    .bar{display:flex;align-items:center;gap:9px;flex-wrap:wrap;background:var(--card-bg);padding:11px 14px;
      border-radius:8px;border:1px solid var(--border);box-shadow:var(--shadow);margin-bottom:13px}
    .bar label{font-size:12.5px;color:var(--muted);font-weight:600}
    select,input[type=search],input[type=datetime-local],input[type=text]{border:1px solid var(--border);border-radius:4px;
      padding:5px 9px;font-size:13px;background:#fff;font-family:inherit;max-width:100%}
    button.act{background:#fff;border:1px solid var(--border);border-radius:4px;padding:5px 12px;font-size:13px;
      cursor:pointer;font-family:inherit}
    button.act:hover:not(:disabled){background:#f0f2f5}
    button.pri{background:var(--primary);border-color:var(--primary);color:#fff}
    button.pri:hover:not(:disabled){background:var(--primary-dk)}
    button.act:disabled{opacity:.45;cursor:not-allowed}
    .seg{display:flex;border:1px solid var(--border);border-radius:4px;overflow:hidden}
    .seg button{background:#fff;border:none;padding:5px 15px;font-size:13px;cursor:pointer;font-family:inherit;
      border-left:1px solid var(--border)}
    .seg button:first-child{border-left:none}
    .seg button.on{background:var(--primary);color:#fff;font-weight:700}
    .range{font-weight:700;font-size:14px;min-width:178px;text-align:center}
    .chk{display:flex;align-items:center;gap:5px;color:var(--muted);cursor:pointer;user-select:none;
      white-space:nowrap;font-size:12.5px}
    .spacer{flex:1}
    .cnt{font-size:11.5px;color:var(--muted)}

    #privacy-note{background:#f6f8fb;border:1px solid var(--border);border-left:5px solid var(--muted);
      border-radius:6px;padding:9px 14px;margin-bottom:13px;font-size:12.5px;line-height:1.7;color:#48505a}
    #privacy-note b{color:var(--text)}

    #status-panel{background:var(--card-bg);border:1px solid var(--border);border-radius:8px;padding:11px 14px;
      margin-bottom:13px;font-size:12.5px;box-shadow:var(--shadow)}
    #status-panel.warn{border-color:var(--warning);background:#fffdf3}
    #status-panel.bad{border-color:var(--danger);background:#fdf4f3}
    #status-panel .st-row{display:flex;gap:8px;align-items:baseline;margin-top:4px;flex-wrap:wrap}
    #status-panel .ok{color:var(--success);font-weight:700}
    #status-panel .ng{color:var(--danger);font-weight:700}
    #status-panel code{background:#eef0f3;padding:1px 4px;border-radius:3px;font-size:11.5px}
    #status-panel details{margin-top:6px}
    #status-panel summary{cursor:pointer;color:var(--primary)}
    #status-panel pre{background:#f6f8fa;border:1px solid var(--border);border-radius:4px;padding:8px;
      margin-top:6px;font-size:11px;overflow:auto;max-height:220px;line-height:1.6}

    .card2{background:var(--card-bg);border:1px solid var(--border);border-radius:8px;padding:11px 14px;
      margin-bottom:13px;font-size:12.5px;box-shadow:var(--shadow)}
    .card2 h4{font-size:13px;color:var(--primary);margin-bottom:7px}
    #now-panel{border-color:#a9d3ba;background:#fbfefc}
    #now-panel h4{color:var(--success)}
    #seek-panel{display:none;border-color:var(--primary)}
    .grp-line{margin-top:5px;display:flex;gap:6px;flex-wrap:wrap;align-items:baseline}
    .grp-line b{color:var(--muted);font-weight:600;min-width:96px;font-size:11.5px}
    .chip{border:1px solid #a9d3ba;background:#eef6f0;color:#1d6b41;border-radius:11px;padding:1px 9px;
      font-size:11.5px;cursor:pointer}
    .chip:hover{background:#dcefe3}
    .chip .cap{opacity:.7;font-size:10.5px;margin-left:3px}
    .chip.busy{border-color:#e6a8a0;background:#fbdcd9;color:#7d1d13}
    .chip.on{outline:2px solid var(--warning);outline-offset:1px}
    .none{color:var(--danger);font-weight:700}
    .seg.mini button{padding:3px 10px;font-size:12px}

    .legend{display:flex;gap:10px;flex-wrap:wrap;font-size:11.5px;color:var(--muted);align-items:center;margin-bottom:9px}
    .legend i{display:inline-block;width:15px;height:11px;border-radius:2px;margin-right:4px;vertical-align:-1px;border:1px solid}

    .scroll{overflow:auto;max-height:calc(100vh - 210px);background:var(--card-bg);border:1px solid var(--border);
      border-radius:8px;box-shadow:var(--shadow)}
    .grid.wk{min-width:calc(var(--namew) + var(--dayw)*7)}
    .grid.dy{min-width:calc(var(--namew) + var(--hourw)*var(--hours))}
    .hrow{display:flex;position:sticky;top:0;z-index:30;background:#f8f9fc;border-bottom:1px solid var(--border)}
    .hname{flex:0 0 var(--namew);position:sticky;left:0;z-index:31;background:#f8f9fc;border-right:1px solid var(--border);
      padding:7px 11px;font-weight:700;font-size:12px;color:var(--muted);display:flex;align-items:center}
    .hdays{flex:1;display:grid}
    .grid.wk .hdays{grid-template-columns:repeat(7,minmax(var(--dayw),1fr))}
    .grid.dy .hdays{grid-template-columns:repeat(var(--hours),minmax(var(--hourw),1fr))}
    .hd{padding:4px 6px;text-align:center;border-left:1px solid #eef1f6;line-height:1.3}
    .hd .dow{font-size:10.5px;color:var(--muted)}
    .hd .dnum{font-weight:700;font-size:14px}
    .hd.sat{background:#eef4fb}.hd.sat .dow{color:var(--primary)}
    .hd.sun{background:#fdeff0}.hd.sun .dow{color:var(--danger)}
    .hd.today{background:#fff6d9}.hd.today .dnum,.hd.today .dow{color:#8a5a00}
    .hd.noon{background:#f2f5fa}

    .grp{display:flex;background:#eaeef5;border-bottom:1px solid var(--border);border-top:1px solid var(--border)}
    .grp span{position:sticky;left:0;padding:4px 11px;font-size:11.5px;font-weight:700;color:#44506a}

    .row{display:flex;border-bottom:1px solid #f0f3fa}
    .row:hover{background:#eaf2fd}
    .row:hover .name{background:#d5e5f9;box-shadow:inset 4px 0 0 var(--primary)}
    .row:hover .mn{color:var(--primary-dk)}
    .row.hi{background:#fff6d9}
    .row.hi .name{background:#ffeaa8;box-shadow:inset 4px 0 0 var(--warning)}
    .row.hi .mn{color:#7a5000}
    .row:hover .bg.sat{background:#e4eefb}
    .row:hover .bg.sun{background:#fbeef0}
    .row:hover .bg.today{background:#fdf6e0}
    .row:hover .bg.off{background:#e2ebf6}
    .name{flex:0 0 var(--namew);position:sticky;left:0;z-index:20;background:#fff;border-right:1px solid var(--border);
      padding:4px 10px;display:flex;flex-direction:column;gap:1px;justify-content:center}
    .mn{font-weight:600;line-height:1.28;font-size:12px}
    .meta{font-size:10px;color:var(--muted);display:flex;gap:5px;flex-wrap:wrap;align-items:center}
    .badge{font-size:9.5px;border-radius:3px;padding:0 4px;border:1px solid;line-height:14px;white-space:nowrap}
    .b-cap{background:#eef4fb;color:var(--primary);border-color:#bcd4ee;font-weight:700}
    .b-flr{background:#f4f6f9;color:var(--muted);border-color:var(--border)}
    .b-free{background:#eef6f0;color:var(--success);border-color:#a9d3ba}
    .b-av{background:#f6f2fb;color:#6b4ba0;border-color:#cdbde8}
    .b-err{background:#fbdcd9;color:var(--danger);border-color:#e6a8a0}

    .days{flex:1;position:relative}
    .grid.wk .days{min-width:calc(var(--dayw)*7)}
    .grid.dy .days{min-width:calc(var(--hourw)*var(--hours))}
    .bgs{position:absolute;inset:0;display:grid}
    .grid.wk .bgs{grid-template-columns:repeat(7,1fr)}
    .grid.dy .bgs{grid-template-columns:repeat(var(--hours),1fr)}
    .bg{border-left:1px solid #eef1f6;position:relative}
    .grid.wk .bg::after{content:"";position:absolute;left:50%;top:0;bottom:0;border-left:1px dotted #f2f4f8}
    .bg.sat{background:#f8fbfe}.bg.sun{background:#fefafa}.bg.today{background:#fffdf2}
    .bg.off{background:#f7f8fa}
    .nowline{position:absolute;top:0;bottom:0;width:0;border-left:2px solid var(--accent);z-index:11;pointer-events:none}
    .seekband{position:absolute;top:0;bottom:0;background:rgba(26,95,168,.10);
      border-left:1px dashed var(--primary);border-right:1px dashed var(--primary);z-index:1;pointer-events:none}
    .bars{position:absolute;inset:0;pointer-events:none}
    .bar-i{position:absolute;height:calc(var(--lane) - 6px);min-width:24px;border-radius:3px;
      border-style:solid;border-width:1px 1px 1px 3px;padding:0 5px;font-size:11px;
      line-height:calc(var(--lane) - 8px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
      cursor:pointer;pointer-events:auto;display:flex;align-items:center;gap:5px}
    .bar-i:hover{filter:brightness(.95);z-index:12}
    .bar-i b{font-weight:700}
    .bar-i .tm{opacity:.85;font-size:10px;font-variant-numeric:tabular-nums;background:rgba(255,255,255,.55);
      border-radius:2px;padding:0 3px}
    .s-busy  {background:#dbe9fb;border-color:#2f6fd0;color:#12386f}
    .s-tent  {background:#eef2f8;border-color:#8fa6c8;color:#3c5a86;border-left-style:dashed}
    .s-unk   {background:#f4f5f7;border-color:#c3c8d0;color:#98a0aa}
    .cut-l{border-left-style:dashed!important;border-top-left-radius:0;border-bottom-left-radius:0}
    .cut-r{border-right-style:dashed;border-top-right-radius:0;border-bottom-right-radius:0}
    .empty{padding:26px;text-align:center;color:var(--muted);font-size:13px}

    .modal{position:fixed;inset:0;background:rgba(20,26,34,.45);display:none;align-items:center;
      justify-content:center;z-index:200;padding:14px}
    .modal.on{display:flex}
    .card{background:#fff;border-radius:8px;max-width:480px;width:100%;box-shadow:0 12px 40px rgba(0,0,0,.28);
      max-height:92vh;overflow:auto}
    .card h3{margin:0;padding:12px 16px;font-size:14.5px;border-bottom:1px solid var(--border);
      background:#f8f9fc;color:var(--primary)}
    .card .bd{padding:13px 16px;font-size:13px}
    .card dl{margin:0;display:grid;grid-template-columns:84px 1fr;gap:7px 10px}
    .card dt{color:var(--muted)}.card dd{margin:0;word-break:break-all}
    .card .ft{padding:11px 16px;border-top:1px solid var(--border);display:flex;gap:8px;
      justify-content:flex-end;background:#f8f9fc;align-items:center;flex-wrap:wrap}
    .card .ft .spacer{flex:1}
    .note{background:#f8f9fc;border-radius:5px;padding:8px 10px;font-size:11.5px;color:var(--muted);
      line-height:1.6;margin-top:9px}
    a.actlink{background:#fff;border:1px solid var(--border);border-radius:4px;padding:5px 12px;font-size:13px;
      text-decoration:none;color:var(--text);display:inline-flex;align-items:center;gap:5px}
    a.actlink:hover{background:#f0f2f5}
    a.actlink.pri{background:var(--primary);border-color:var(--primary);color:#fff}
    a.actlink.pri:hover{background:var(--primary-dk)}

    #snackbar{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#323232;color:#fff;
      padding:10px 20px;border-radius:6px;font-size:13px;display:none;z-index:999;max-width:90vw}

    @media(max-width:700px){
      :root{--namew:140px;--dayw:104px;--hourw:50px}
      #app-view{padding:11px}
    }
    @media print{
      header,.bar,.legend,#status-panel,#privacy-note,#seek-panel,#now-panel{display:none}
      .scroll{overflow:visible;max-height:none;border:none;box-shadow:none}
      .name,.hname,.hrow{position:static}
      body{background:#fff}
      :root{--dayw:88px;--hourw:44px;--namew:150px;--lane:22px}
    }
  </style>
</head>
<body>

<header>
  <div class="logo">花岡車輌<span>予約状況｜会議室</span></div>
  <div class="user-info">
    <span id="user-name"></span>
    <button onclick="signOut()">サインアウト</button>
  </div>
</header>

<div id="login-view">
  <h2>予約状況｜会議室</h2>
  <p>花岡車輌株式会社の Microsoft アカウントでサインインしてください</p>
  <button id="login-btn" onclick="signIn()">
    <svg width="18" height="18" viewBox="0 0 21 21" fill="none"><path d="M10 0H0v10h10V0z" fill="#F25022"/><path d="M21 0H11v10h10V0z" fill="#7FBA00"/><path d="M10 11H0v10h10V11z" fill="#00A4EF"/><path d="M21 11H11v10h10V11z" fill="#FFB900"/></svg>
    Microsoft アカウントでサインイン
  </button>
</div>

<div id="app-view">
  <div id="app-nav-slot"></div>

  <div id="privacy-note">
    <b>この画面は見るだけです。</b>会議室の予約・変更は Outlook（または Teams の予定表）で行ってください。
    <b>会議室の予定の件名はこの画面に表示しません。</b>面談などの予定が誰にでも読めてしまうためです。
    代わりに<b>誰が押さえているか</b>を出しています。用途を知りたいときは、帯をクリックして<b>予約者に直接聞いてください</b>。
  </div>

  <div id="status-panel">読み込み中...</div>

  <div class="card2" id="now-panel"></div>

  <div class="bar">
    <div class="seg">
      <button id="vWeek" class="on">週</button>
      <button id="vDay">日</button>
    </div>
    <select id="flr"></select>
    <select id="cap"><option value="">収容人数の指定なし</option></select>
    <input type="search" id="q" placeholder="会議室名で検索" style="width:150px">
    <button class="act" id="prev">◀</button>
    <button class="act pri" id="todayBtn">今日</button>
    <button class="act" id="next">▶</button>
    <span class="range" id="range"></span>
    <span class="spacer"></span>
    <span class="cnt" id="updated"></span>
    <button class="act" onclick="loadAll()">🔄 更新</button>
    <button class="act" onclick="window.print()">印刷</button>
  </div>

  <div class="bar" style="margin-bottom:11px">
    <label>空いている部屋を探す</label>
    <input type="datetime-local" id="sFrom">
    <span style="color:var(--muted)">〜</span>
    <input type="datetime-local" id="sTo">
    <button class="act pri" id="sGo">この区間で空いている部屋</button>
    <button class="act" id="sClear">解除</button>
    <label class="chk" style="margin-left:6px"><input type="checkbox" id="onlybusy"> 予約がある部屋だけ</label>
    <span class="cnt" id="cnt"></span>
  </div>

  <div class="card2" id="seek-panel"></div>

  <div class="legend">
    <span><i class="s-busy"></i>使用中（確定）</span>
    <span><i class="s-tent"></i>仮予約（承認待ち）</span>
    <span><i class="s-unk"></i>不明</span>
    <span id="lg-note"></span>
  </div>

  <div class="scroll"><div class="grid wk" id="grid"></div></div>
</div>

<div class="modal" id="mDetail"><div class="card">
  <h3 id="dTitle">予約の詳細</h3>
  <div class="bd"><dl id="dBody"></dl><div class="note" id="dNote"></div></div>
  <div class="ft" id="dFoot"></div>
</div></div>

<div id="snackbar"></div>

<script>
/* ============================================================
   花岡車輌 会議室 予約状況（閲覧専用）
   ------------------------------------------------------------
   ★正本は Outlook の会議室（リソース）予定表★
     この画面は見に行くだけ。SharePoint のマスターリストも Power Automate も使わない。
     会議室の追加・廃止は Exchange 側に追従する。

   ★件名は出さない★
     会議室には「○○さん面談」のような予定が入る。全社員が読める画面に件名を出さない。
     代わりに「誰が押さえているか」を出す。用途は予約者に聞いてもらう。

   ★予約者の出し方（ここが工夫）★
     getSchedule は organizer を返さない。会議室の予定表を Reviewer で開けば取れるが、
     それは全社員に本文まで読ませることになるので採らない。
     そこで「社員側の予定の『場所』に会議室名が入っている」ことを使って突き合わせる。
       会議室 room-1f-ld1 が 10:00-11:00 埋まっている
       + 社員Aの 10:00-11:00 の予定の場所が「1F会議室(LD-1)」
       → その枠の予約者は社員A
     権限の追加もフローもリストも要らない。
   ============================================================ */

const MSAL_CONFIG = {
  auth: {
    clientId:    'd338d61b-01dc-4c7c-ac6b-aecf7f30d716',
    authority:   'https://login.microsoftonline.com/3933e8a0-c945-4e97-ae67-c82131087cad',
    redirectUri: new URL('auth.html', window.location.href).href,
  },
  cache: { cacheLocation: 'sessionStorage', storeAuthStateInCookie: false },
};
/* Place.Read.All … 会議室の一覧（収容人数・階つき）を取る
   GroupMember.Read.All … 予約者の突き合わせに使う名簿
   Calendars.Read.Shared … 会議室と社員の空き情報 */
const SCOPES = ['User.Read', 'User.Read.All', 'GroupMember.Read.All',
                'Calendars.Read', 'Calendars.Read.Shared', 'Place.Read.All'];
const GRAPH_BASE = 'https://graph.microsoft.com/v1.0';

/* 予約者の突き合わせに使う名簿（全社員チーム。他タブと同じ） */
const GROUP_ID = 'ed13b4d2-03b0-47ee-8892-e105e0cf9851';

/* 建物（拠点）の表示順。ここに書いた順で上から並ぶ。
   ★拠点が増えたらここに足す★ 書いていない拠点は、この後ろに室数の多い順で付く。
   （近日 工場の会議室を登録予定。すでに書いてあるので登録すれば本社の下に入る） */
const BLD_ORDER = ['本社', '工場', '名古屋', '大阪'];

const DAY_H0 = 8, DAY_H1 = 20;      /* 日表示の既定の時間帯。予定に合わせて自動で広げる */
const CHUNK  = 20;                  /* getSchedule は1回20件まで */
const NOW_MINS = [30, 60, 120];     /* 「今すぐ空き」の候補時間 */

/* ============================================================
   時刻（すべてJST固定。UTCフィールドを読む方式）
   ============================================================ */
const JST = 9 * 3600e3;
const toJ   = ms => new Date(ms + JST);
const pad   = n => String(n).padStart(2, '0');
const jKey  = ms => { const d = toJ(ms); return `${d.getUTCFullYear()}-${pad(d.getUTCMonth()+1)}-${pad(d.getUTCDate())}`; };
const jHM   = ms => { const d = toJ(ms); return `${pad(d.getUTCHours())}:${pad(d.getUTCMinutes())}`; };
const jFull = ms => `${jKey(ms).replace(/-/g,'/')} ${jHM(ms)}`;
const localToMs = v => v ? Date.parse(v + ':00Z') - JST : NaN;
const msToLocal = ms => { const d = toJ(ms);
  return `${d.getUTCFullYear()}-${pad(d.getUTCMonth()+1)}-${pad(d.getUTCDate())}T${pad(d.getUTCHours())}:${pad(d.getUTCMinutes())}`; };
/* getSchedule は Prefer で UTC を指定しているので、タイムゾーン指定なしの文字列も UTC として読む */
const pTZ = x => {
  if (!x) return NaN;
  const s = x.dateTime;
  if (!s) return NaN;
  return Date.parse(/[Zz]|[+-]\d\d:?\d\d$/.test(s) ? s : s + 'Z');
};
const toUtcLocal = ms => new Date(ms).toISOString().replace(/\.\d+Z$/, '');
function dayTopMs(ms){ const d = toJ(ms); return Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate()) - JST; }
function weekTopMs(ms){
  const d = toJ(ms);
  const back = (d.getUTCDay() + 6) % 7;          /* 月曜はじまり */
  return Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate() - back) - JST;
}
const DAY = 86400e3, WK = DAY * 7, DOW = ['日','月','火','水','木','金','土'];
const overlaps = (a, s, e) => a.s < e && a.e > s;    /* 半開区間。11:00終了→11:00開始は重複でない */
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

const ST = { busy:['使用中','s-busy'], tentative:['仮予約','s-tent'], oof:['使用中','s-busy'],
             workingElsewhere:['使用中','s-busy'], unknown:['不明','s-unk'] };

/* ============================================================
   会議室名の突き合わせ
   ------------------------------------------------------------
   社員の予定の「場所」は Outlook が作った文字列で、表記が揺れる。
     「1F会議室(LD-1)」「Microsoft Teams 会議; 3F会議室(LD-3)」「ＬＤ－２」
   全角・空白・記号を落としてから包含で見る。
   ★LD-1 と LD-10 を混同しないこと★ 記号を落とすと ld1 が ld10 に含まれてしまう。
     コードで照合するときは、直後が数字でないことを必ず確かめる。
   ============================================================ */
function normLoc(s){
  return String(s ?? '')
    .replace(/[Ａ-Ｚａ-ｚ０-９]/g, c => String.fromCharCode(c.charCodeAt(0) - 0xFEE0))  /* 全角→半角 */
    .replace(/[－ー―‐]/g, '-')
    .toLowerCase()
    .replace(/[\s　()（）\[\]【】<>「」・.,、。:：;；_/\\-]/g, '');
}
/* メールアドレスから会議室コードを作る： room-1f-ld1@… → ['1fld1','ld1'] */
function codesFromMail(mail){
  const local = String(mail || '').split('@')[0].toLowerCase();
  const body  = local.replace(/^(room|conf|meeting|mr)[-_.]?/, '');
  const parts = body.split(/[-_.]+/).filter(Boolean);
  const out = new Set();
  if (parts.length) out.add(parts.join(''));
  /* 末尾の「識別に効く部分」も候補にする（1f-ld1 なら ld1） */
  if (parts.length > 1) out.add(parts.slice(1).join(''));
  if (parts.length) out.add(parts[parts.length - 1]);
  return [...out].filter(x => x.length >= 2);
}
/* 会議室1件ぶんの照合トークンを作る。長いものから見る＝誤爆しにくい */
function roomTokens(room){
  const t = new Set();
  const nm = normLoc(room.n);
  if (nm.length >= 2) t.add(nm);
  /* 「1F会議室(LD-1)」→ 括弧の中の LD-1 も単独で候補にする */
  const paren = String(room.n || '').match(/[(（]([^)）]+)[)）]/);
  if (paren) { const p = normLoc(paren[1]); if (p.length >= 2) t.add(p); }
  codesFromMail(room.mail).forEach(c => t.add(c));
  return [...t].sort((a,b) => b.length - a.length);
}
/* 場所の文字列が room を指しているか。数字の続きによる誤爆を防ぐ */
function locHitsRoom(locNorm, tokens){
  for (const tk of tokens){
    let from = 0;
    for (;;){
      const i = locNorm.indexOf(tk, from);
      if (i < 0) break;
      const after = locNorm.charAt(i + tk.length);
      /* トークンが数字で終わっていて、直後も数字なら別の部屋（ld1 と ld10） */
      if (!(/\d$/.test(tk) && /\d/.test(after))) return true;
      from = i + 1;
    }
  }
  return false;
}

/* ============================================================
   Graph
   ============================================================ */
async function gGet(path, extra){
  const t = await getToken();
  const r = await fetch(GRAPH_BASE + path, { headers: { Authorization: 'Bearer ' + t, ...(extra||{}) } });
  if (!r.ok) { const e = new Error(`[${r.status}] ${path}`); e.status = r.status; e.body = await r.text(); throw e; }
  return r.json();
}
async function gGetAll(path, extra){
  let out = [], next = path;
  while (next) {
    const d = await gGet(next, extra);
    out = out.concat(d.value || []);
    next = d['@odata.nextLink'] ? d['@odata.nextLink'].replace(GRAPH_BASE, '') : null;
  }
  return out;
}
async function gBatch(requests){
  const t = await getToken(); const out = [];
  for (let i = 0; i < requests.length; i += 20) {
    const chunk = requests.slice(i, i+20).map((r,k) => ({ id: String(i+k), ...r }));
    const res = await fetch(`${GRAPH_BASE}/$batch`, { method:'POST',
      headers:{ Authorization:'Bearer '+t, 'Content-Type':'application/json' },
      body: JSON.stringify({ requests: chunk }) });
    const b = await res.json();
    out.push(...(b.responses || []));
  }
  return out.sort((a,b) => Number(a.id) - Number(b.id));
}

/* ============================================================
   会議室の一覧：3段のフォールバック
   ------------------------------------------------------------
   1) /places/microsoft.graph.room … 収容人数と階まで取れる。本命
   2) /me/findRooms               … 室名とメールだけ。RoomList 設定が要る
   3) /me/calendars               … room- で始まる予定表を拾う。最後の手段
   どれで取れたかは管理者パネルに出す。黙って劣化させない。
   ============================================================ */
function floorFromMail(mail){
  const m = String(mail || '').match(/^[a-z]*[-_.]?(\d{1,2})f[-_.]/i);
  return m ? `${m[1]}F` : '';
}
function mkRoom(o){
  const mail = String(o.mail || '').trim().toLowerCase();
  return {
    n   : o.n || mail || '(名称なし)',
    mail,
    cap : Number.isFinite(o.cap) && o.cap > 0 ? o.cap : null,
    flr : (o.flr || floorFromMail(mail) || '').trim(),
    bld : (o.bld || '').trim(),
    av  : o.av || '',                 /* 備品（プロジェクタ等）が取れたら出す */
    src : 'none',
    tok : []
  };
}
async function loadRooms(){
  SRC.errs = [];
  let list = null;

  /* 1) places */
  try {
    const v = await gGetAll('/places/microsoft.graph.room?$top=999');
    if (v.length) {
      list = v.map(r => mkRoom({
        n: r.displayName, mail: r.emailAddress, cap: r.capacity,
        flr: r.floorLabel || (r.floorNumber != null ? `${r.floorNumber}F` : ''),
        bld: r.building,
        av: [r.videoDeviceName, r.audioDeviceName, r.displayDeviceName].filter(Boolean).join('・')
      }));
      SRC.src = '/places（収容人数・階つき）';
    }
  } catch (e) {
    SRC.errs.push(`/places が使えません：[${e.status || ''}] ${e.message}`
      + (e.status === 403 ? '　→ Place.Read.All の追加と管理者同意が必要です' : ''));
  }

  /* 2) findRooms */
  if (!list) {
    try {
      const v = await gGetAll('/me/findRooms');
      if (v.length) {
        list = v.map(r => mkRoom({ n: r.name, mail: r.address }));
        SRC.src = '/me/findRooms（収容人数は取れません）';
      }
    } catch (e) { SRC.errs.push(`/me/findRooms も使えません：[${e.status || ''}] ${e.message}`); }
  }

  /* 3) カレンダー一覧から room- を拾う */
  if (!list) {
    try {
      const v = await gGetAll('/me/calendars?$top=200');
      const hit = v.filter(c => /^(room|conf|meeting|mr)[-_.]/i.test(String(c.owner?.address || '')));
      if (hit.length) {
        list = hit.map(c => mkRoom({ n: c.name, mail: c.owner?.address }));
        SRC.src = '予定表の一覧から room- を拾いました（暫定）';
      }
    } catch (e) { SRC.errs.push(`予定表の一覧も読めません：[${e.status || ''}] ${e.message}`); }
  }

  ROOMS = (list || []).filter(r => r.mail);
  ROOMS.forEach(r => { r.tok = roomTokens(r); });
  SRC.rooms = ROOMS.length;
  SRC.capOk = ROOMS.filter(r => r.cap).length;

  /* 並び順：建物 → 階 → 室名。安定ソートなので室名順は保たれる。

     ★建物を名前順にしてはいけない★
     ja の読み順だと「工場（こうじょう）」が「本社（ほんしゃ）」より先に来る。
     日本語としては正しいが、本社が下に埋まって使いにくい。

     ★室数順にもしてはいけない★
     一度は「室数の多い建物を先頭」にしたが、これは工場の会議室が本社より
     多く登録された瞬間に工場が先頭へ来る。増設のたびに並びが変わるのは困る。
     BLD_ORDER に書いた順を正とし、そこに無い建物だけ室数の多い順で後ろに付ける。
     拠点が増えたらこの配列に足すだけ。 */
  const bcount = new Map();
  ROOMS.forEach(r => bcount.set(r.bld || '', (bcount.get(r.bld || '') || 0) + 1));
  const bldRank = b => {
    const i = BLD_ORDER.indexOf(b);
    if (i >= 0) return i;                          /* 明示した順 */
    if (!b) return 1e6;                            /* 建物が未設定のものは最後 */
    return 1000 - (bcount.get(b) || 0);            /* 未知の拠点は室数の多い順 */
  };

  ROOMS.sort((a,b) => a.n.localeCompare(b.n, 'ja', { numeric: true }));
  ROOMS.sort((a,b) => {
    const ka = a.bld || '', kb = b.bld || '';
    if (ka !== kb) {
      const d = bldRank(ka) - bldRank(kb);
      if (d) return d;
      return ka.localeCompare(kb, 'ja');
    }
    const fa = a.flr || '', fb = b.flr || '';
    if (!fa !== !fb) return fa ? -1 : 1;          /* 階が未設定のものは建物内の最後 */
    return fa.localeCompare(fb, 'ja', { numeric: true });   /* 2F < 10F になるよう数値順 */
  });
}
function grpOf(r){ return [r.bld, r.flr].filter(Boolean).join(' '); }

/* 収容人数の選択肢は実際の部屋から作る。
   固定で 2/4/6/10/20 と並べると、本社の実データ（4人と8人だけ）では
   「10人以上」「20人以上」が常に0件になり、選ぶだけ無駄になる。
   工場が増えて大きい部屋が入れば、その人数が自動で選べるようになる。 */
function paintCapSelect(){
  const caps = [...new Set(ROOMS.map(r => r.cap).filter(c => c > 0))].sort((a,b) => a-b);
  const sel = el('cap');
  const keep = sel.value;
  /* 最大の部屋だけを選ぶ選択肢は作らない（1室しか出ないので絞り込みの意味が薄い）。
     ただし部屋が2種類しかない場合は、その2つとも出す。 */
  const opts = caps.filter((c,i) => i < caps.length - 1 || caps.length <= 2);
  sel.innerHTML = `<option value="">収容人数の指定なし</option>`
    + opts.map(c => `<option value="${c}">${c}人以上（${ROOMS.filter(r => r.cap >= c).length}室）</option>`).join('');
  if (keep && [...sel.options].some(o => o.value === keep)) sel.value = keep;
}

function paintFlrSelect(){
  const gs = [...new Set(ROOMS.map(grpOf).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'ja',{numeric:true}));
  el('flr').innerHTML = `<option value="">すべての階（${ROOMS.length}室）</option>`
    + gs.map(g => `<option value="${esc(g)}">${esc(g)}（${ROOMS.filter(r=>grpOf(r)===g).length}）</option>`).join('')

/* ============================================================
   会議室の埋まり時間：getSchedule
   ------------------------------------------------------------
   ★件名は読まない★ status と時間帯だけ使う。
     予定表の既定権限を上げる必要がないので、Exchange 側の設定変更ゼロで動く。
   ============================================================ */
function viewRange(){
  if (VIEW === 'week') return [curWeek, curWeek + WK];
  return [curDay, curDay + DAY];
}
function schedBody(mails, f0, f1){
  return {
    schedules: mails,
    startTime: { dateTime: toUtcLocal(f0), timeZone: 'UTC' },
    endTime:   { dateTime: toUtcLocal(f1), timeZone: 'UTC' },
    availabilityViewInterval: VIEW === 'week' ? 60 : 30
  };
}
function schedReqs(mails, f0, f1){
  const chunks = [];
  for (let i = 0; i < mails.length; i += CHUNK) chunks.push(mails.slice(i, i + CHUNK));
  return { chunks, reqs: chunks.map(c => ({
    method: 'POST',
    url: '/me/calendar/getSchedule',
    headers: { 'Content-Type': 'application/json', Prefer: 'outlook.timezone="UTC"' },
    body: schedBody(c, f0, f1)
  })) };
}

async function loadRes(){
  const [v0, v1] = viewRange();
  let f0 = v0, f1 = v1;
  if (SEEK) { f0 = Math.min(f0, SEEK.s); f1 = Math.max(f1, SEEK.e); }
  /* 「今すぐ空き」は今日ぶんが必要。表示週が来週でも今の空きは出したい */
  const nowTop = dayTopMs(Date.now());
  f0 = Math.min(f0, nowTop); f1 = Math.max(f1, nowTop + DAY);

  SRC = { ...SRC, ok:0, ng:0, items:0, ownerState:'未実行', owners:0, ownerHow:'' };
  RES = [];
  if (!ROOMS.length) return;

  const { chunks, reqs } = schedReqs(ROOMS.map(r => r.mail), f0, f1);
  const res = await gBatch(reqs);

  res.forEach((r, ci) => {
    const group = chunks[ci] || [];
    if (r.status !== 200 || !r.body || !Array.isArray(r.body.value)) {
      SRC.ng += group.length;
      group.forEach(m => { const rm = ROOMS.find(x => x.mail === m); if (rm) rm.src = 'error'; });
      SRC.errs.push(`${group.length}室ぶん取得失敗：[${r.status}] ${r.body?.error?.code || ''}`);
      return;
    }
    r.body.value.forEach((sc, i) => {
      const mail = String(sc.scheduleId || group[i] || '').toLowerCase();
      const room = ROOMS.find(x => x.mail === mail) || ROOMS.find(x => x.mail === group[i]);
      if (!room) return;
      if (sc.error) { SRC.ng++; room.src = 'error';
        SRC.errs.push(`${room.n}：${sc.error.message || sc.error.responseCode || 'エラー'}`); return; }
      SRC.ok++; room.src = 'ok';
      (sc.scheduleItems || []).forEach(it => {
        const s = pTZ(it.start), e = pTZ(it.end);
        if (isNaN(s) || isNaN(e) || e <= s) return;
        const status = it.status || 'unknown';
        if (status === 'free') return;
        SRC.items++;
        const row = {
          rid : `${room.mail}|${s}|${e}`,
          room: room.n, mail: room.mail, cap: room.cap, flr: grpOf(room),
          s, e, status,
          who : '', whoMail: '', whoDep: '', from: ''
        };
        /* ★件名から予約者を取る（社員名と完全一致したときだけ）★ 下の説明を参照 */
        const p = personFromSubject(it.subject);
        if (p) { row.who = p.n; row.whoMail = p.mail; row.whoDep = p.dep; row.from = 'subject'; }
        RES.push(row);
      });
    });
  });
}

/* ============================================================
   予約者の特定

   ■ 本線：会議室の予定の「件名」から取る
   花岡車輌の会議室は Exchange 側で
     DeleteSubject = True / AddOrganizerToSubject = True
   になっている（Check-RoomMailboxes.ps1 -Inspect で全6室を確認）。
   この設定だと、会議室の予定表に入る件名は**予約した人の名前だけ**に
   置き換わり、本当の件名は Exchange に残らない。
   つまり会議室の getSchedule が返す subject ＝ 予約者名。
   社員89人ぶんを読んで突き合わせる必要はない。

   ■ ただし件名をそのまま表示してはいけない
   誰かが DeleteSubject を False に戻したら、subject は本物の件名
   （「採用面談 山田さん」）になる。それを画面に出したら事故である。
   アプリはブラウザの中で動くので、Exchange の設定を知る方法がない。

   そこで **社員名簿と完全一致したときだけ採用する**。
     ・設定が入っている → subject は「福田 剛史」→ 名簿にある → 予約者として表示
     ・設定が外れている → subject は「採用面談 山田さん」→ 名簿に無い → 捨てて「使用中」
   仕組みとして安全側に倒れる。フラグを人が管理する必要もない。

   ■ 予備：社員の予定の「場所」と突き合わせる
   件名から1件も取れなかったときだけ走らせる（下の loadOwners）。
   設定が変わっても、外部主催が多くても、名前が出る道を残しておく。
   ============================================================ */

/* 氏名の比較用。全角スペース・半角スペースの揺れを吸収する */
function normName(s){
  return String(s ?? '').replace(/[\s　]+/g, '').toLowerCase();
}
let NAME_MAP = null;
function buildNameMap(){
  NAME_MAP = new Map();
  PEOPLE.forEach(p => {
    const k = normName(p.n);
    if (!k) return;
    /* 同姓同名がいたら、どちらか分からないので採用しない（誤って別人を出さない） */
    if (NAME_MAP.has(k)) NAME_MAP.set(k, null);
    else NAME_MAP.set(k, p);
  });
}
function personFromSubject(subject){
  if (!NAME_MAP) return null;
  const k = normName(subject);
  if (!k) return null;
  return NAME_MAP.get(k) || null;
}

async function loadPeople(){
  if (PEOPLE.length) return;
  const base = `/groups/${GROUP_ID}/members/microsoft.graph.user`;
  let items;
  try { items = await gGetAll(`${base}?$select=id,displayName,mail,userPrincipalName,department&$top=999`); }
  catch { items = await gGetAll(`${base}?$select=id,displayName,mail,userPrincipalName&$top=999`); }
  PEOPLE = items.map(u => ({
    n: u.displayName || u.userPrincipalName || '(名前なし)',
    mail: (u.mail || u.userPrincipalName || '').trim(),
    dep: (u.department || '').trim()
  })).filter(p => p.mail);
  buildNameMap();
}

/* 会議室の枠と社員の予定を時刻で突き合わせる。
   会議室側と社員側で数分ずれることがあるので、開始時刻の一致は5分の幅を持たせる。 */
const OWNER_TOL = 5 * 60e3;
function attachOwner(slot, cand){
  return Math.abs(cand.s - slot.s) <= OWNER_TOL || (overlaps(cand, slot.s, slot.e)
      && Math.min(cand.e, slot.e) - Math.max(cand.s, slot.s) >= (slot.e - slot.s) * 0.6);
}

async function loadOwners(){
  if (!RES.length) { SRC.ownerState = '対象なし'; SRC.ownerHow = ''; paintPanel(); return; }

  /* 件名から取れているなら、社員89人ぶんを読む必要はない。ここで終わる。 */
  const bySubject = RES.filter(r => r.from === 'subject').length;
  if (bySubject) {
    SRC.owners = bySubject;
    SRC.ownerState = `${bySubject} / ${RES.length}件`;
    SRC.ownerHow = '会議室の件名から（社員の予定は読んでいません）';
    paintPanel();
    return;
  }

  /* 1件も取れなかった＝Exchange の DeleteSubject が外れた、
     getSchedule が件名を返さない、外部主催だけ、などの場合。
     予備の方法（社員の予定の「場所」と突き合わせ）に切り替える。 */
  SRC.ownerState = '照合中';
  SRC.ownerHow = '社員の予定の「場所」と突き合わせ中';
  paintPanel();
  try {
    await loadPeople();
    const f0 = Math.min(...RES.map(r => r.s));
    const f1 = Math.max(...RES.map(r => r.e));
    const { chunks, reqs } = schedReqs(PEOPLE.map(p => p.mail), f0, f1);
    const res = await gBatch(reqs);

    /* 社員側の「場所つきの予定」だけ集める。件名は読まない */
    const cands = [];
    res.forEach((r, ci) => {
      if (r.status !== 200 || !r.body || !Array.isArray(r.body.value)) return;
      const group = chunks[ci] || [];
      r.body.value.forEach((sc, i) => {
        if (sc.error) return;
        const mail = String(sc.scheduleId || group[i] || '').toLowerCase();
        const p = PEOPLE.find(x => x.mail.toLowerCase() === mail) || PEOPLE.find(x => x.mail === group[i]);
        if (!p) return;
        (sc.scheduleItems || []).forEach(it => {
          if (!it.location) return;
          const s = pTZ(it.start), e = pTZ(it.end);
          if (isNaN(s) || isNaN(e)) return;
          cands.push({ s, e, loc: normLoc(it.location), p });
        });
      });
    });

    let hit = 0;
    RES.forEach(slot => {
      const room = ROOMS.find(x => x.mail === slot.mail);
      if (!room) return;
      const c = cands.find(c => locHitsRoom(c.loc, room.tok) && attachOwner(slot, c));
      if (c) { slot.who = c.p.n; slot.whoMail = c.p.mail; slot.whoDep = c.p.dep;
               slot.from = 'location'; hit++; }
    });
    SRC.owners = hit;
    SRC.ownerState = `${hit} / ${RES.length}件`;
    SRC.ownerHow = '社員の予定の「場所」から（予備の方法）';
  } catch (e) {
    SRC.ownerState = '失敗';
    SRC.ownerHow = '';
    SRC.errs.push(`予約者の突き合わせに失敗：[${e.status || ''}] ${e.message}`);
  }
  paintPanel(); render(); paintSeek(); paintNow();
}

     + '\n'

/* ============================================================
   今すぐ空いている部屋
   ============================================================ */
/* 「何時まで使用中か」。日付が変わる場合は時刻だけ出すと誤読する
   （翌朝4時までの予約を「04:00まで」と書くと、もう空いていると思われる）。 */
function untilLabel(endMs, nowMs){
  if (jKey(endMs) === jKey(nowMs)) return `${jHM(endMs)}まで`;
  const d = toJ(endMs);
  return `${d.getUTCMonth()+1}/${d.getUTCDate()} ${jHM(endMs)}まで`;
}

function paintNow(){
  const p = el('now-panel');
  const now = Date.now(), end = now + NOWMIN * 60e3;
  const busy = new Set(RES.filter(r => overlaps(r, now, end)).map(r => r.mail));
  const target = filterRooms();
  const free = target.filter(r => !busy.has(r.mail));

  let h = `<h4>いま空いている部屋　${jHM(now)} から ${NOWMIN}分</h4>`
    + `<div class="grp-line"><b>時間を変える</b><span class="seg mini">`
    + NOW_MINS.map(m => `<button data-min="${m}" class="${m===NOWMIN?'on':''}">${m}分</button>`).join('')
    + `</span><span class="cnt">対象 ${target.length}室（上の絞り込みに従います）</span></div>`;

  if (!target.length) h += `<div class="cnt">絞り込みに合う部屋がありません</div>`;
  else if (!free.length) h += `<div class="none">この時間に空いている部屋はありません</div>`;
  else {
    const gs = [...new Set(free.map(grpOf))];
    gs.forEach(g => {
      h += `<div class="grp-line"><b>${esc(g || '階が未設定')}</b>`
        + free.filter(r => grpOf(r) === g).map(r =>
            `<span class="chip${r.n === HILITE ? ' on' : ''}" data-who="${esc(r.n)}">${esc(r.n)}`
            + (r.cap ? `<span class="cap">${r.cap}人</span>` : '') + `</span>`).join('')
        + `</div>`;
    });
  }
  const bz = target.filter(r => busy.has(r.mail));
  if (bz.length) {
    h += `<div class="grp-line" style="margin-top:7px"><b>使用中</b>`
      + bz.map(r => {
          const cur = RES.find(x => x.mail === r.mail && overlaps(x, now, end));
          const until = cur ? untilLabel(cur.e, now) : '';
          const who = cur && cur.who ? `／${cur.who}` : '';
          return `<span class="chip busy" data-who="${esc(r.n)}" title="${esc(until + who)}">${esc(r.n)}`
               + (cur ? `<span class="cap">${esc(until)}</span>` : '') + `</span>`;
        }).join('') + `</div>`;
  }
  h += `<div class="cnt" style="margin-top:6px">部屋名をクリックすると、その行を目立たせて表へスクロールします</div>`;
  p.innerHTML = h;
}

/* ============================================================
   空いている部屋を探す（時間を指定）
   ============================================================ */
function parseSeek(){
  const s = localToMs(el('sFrom').value), e = localToMs(el('sTo').value);
  if (isNaN(s) || isNaN(e) || e <= s) return null;
  return { s, e };
}
async function runSeek(){
  const r = parseSeek();
  if (!r) { showSnack('開始と終了を入れてください（終了は開始より後）'); return; }
  SEEK = r;
  if (VIEW === 'week') curWeek = weekTopMs(r.s); else curDay = dayTopMs(r.s);
  await loadRes(); lastLoad = Date.now();
  paintPanel(); render(); paintSeek(); paintNow(); paintUpdated(); writeUrl(); loadOwners();
}
function clearSeek(){
  SEEK = null; HILITE = null;
  el('sFrom').value = msToLocal(dayTopMs(Date.now()) + 13*3600e3);
  el('sTo').value   = msToLocal(dayTopMs(Date.now()) + 14*3600e3);
  render(); paintSeek(); paintNow();
}
function paintSeek(){
  const p = el('seek-panel');
  if (!SEEK) { p.style.display = 'none'; return; }
  /* 仮予約も「埋まっている」として扱う。承認されたら使えなくなるので空きとは言えない */
  const busy = new Set(RES.filter(r => overlaps(r, SEEK.s, SEEK.e)).map(r => r.mail));
  const target = filterRooms();
  const free = target.filter(r => !busy.has(r.mail));
  const bz   = target.filter(r =>  busy.has(r.mail));

  let h = `<h4>${jFull(SEEK.s)} 〜 ${jFull(SEEK.e)}　空いている部屋 ${free.length}室 / 対象 ${target.length}室</h4>`;
  if (!free.length) h += `<div class="none">この区間に空いている部屋はありません</div>`;
  else [...new Set(free.map(grpOf))].forEach(g => {
    h += `<div class="grp-line"><b>${esc(g || '階が未設定')}</b>`
      + free.filter(r => grpOf(r) === g).map(r =>
          `<span class="chip${r.n === HILITE ? ' on' : ''}" data-who="${esc(r.n)}">${esc(r.n)}`
          + (r.cap ? `<span class="cap">${r.cap}人</span>` : '') + `</span>`).join('')
      + `</div>`;
  });
  if (bz.length) {
    h += `<div class="grp-line" style="margin-top:8px"><b>予約あり</b>`
      + bz.map(r => {
          const c = RES.find(x => x.mail === r.mail && overlaps(x, SEEK.s, SEEK.e));
          const t = c ? `${jHM(c.s)}–${jHM(c.e)}${c.who ? '／' + c.who : ''}` : '';
          return `<span class="chip busy${r.n === HILITE ? ' on' : ''}" data-who="${esc(r.n)}"`
               + ` title="${esc(t)}">${esc(r.n)}</span>`;
        }).join('')
      + `<span class="cnt">部屋名にマウスを乗せると誰が押さえているか出ます</span></div>`;
  }
  h += `<div class="cnt" style="margin-top:7px">部屋名をクリックすると、その行を目立たせて表へスクロールします</div>`;
  p.innerHTML = h;
  p.style.display = 'block';
}

/* ============================================================
   描画
   ============================================================ */
function filterRooms(){
  const g = el('flr').value, cap = Number(el('cap').value || 0), q = el('q').value.trim().toLowerCase();
  return ROOMS.filter(r =>
    (!g || (g === '__none__' ? !grpOf(r) : grpOf(r) === g)) &&
    (!cap || (r.cap != null && r.cap >= cap)) &&
    (!q || r.n.toLowerCase().includes(q) || grpOf(r).toLowerCase().includes(q)));
}
function visibleRooms(inView){
  let list = filterRooms();
  if (el('onlybusy').checked){
    const has = new Set(inView.map(r => r.mail));
    list = list.filter(r => has.has(r.mail));
  }
  return list;
}
function resOf(room, v0, v1){
  return RES.filter(r => r.mail === room.mail && r.e > v0 && r.s < v1).sort((a,b) => a.s - b.s);
}
function laneAssign(rs){
  const lanes = [];
  rs.forEach(r => {
    let i = lanes.findIndex(l => l.every(x => x.e <= r.s || x.s >= r.e));
    if (i < 0) { lanes.push([r]); i = lanes.length - 1; } else lanes[i].push(r);
    r._l = i;
  });
  return Math.max(1, lanes.length);
}
function barHtml(r, L, R, cutL, cutR){
  const cls = [ (ST[r.status] || ST.unknown)[1], cutL?'cut-l':'', cutR?'cut-r':'' ].join(' ');
  /* 表示範囲の外まで続く予約は、始まりや終わりが「その日の時刻」ではない。
     そのまま出すと誤読するので、切れている側は「…」にする。 */
  const tm = (cutL && cutR) ? '終日'
           : cutL ? `…–${jHM(r.e)}`
           : cutR ? `${jHM(r.s)}–…`
           : `${jHM(r.s)}–${jHM(r.e)}`;
  /* ★件名は出さない★ 予約者が分かればその名前、分からなければ状態だけ */
  const label = r.who || (ST[r.status] || ST.unknown)[0];

  /* ★狭い帯に文字を入れない★
     週表示では1時間の会議が全体の0.6%＝十数ピクセルにしかならない。
     そこへ時刻を入れると「06」「13」のような切れた数字が並んで、
     かえって読めなくなる。入らない幅なら色だけにして、詳細はクリックで見せる。 */
  const w = R - L;
  const inner = w >= 8 ? `<span class="tm">${tm}</span><b>${esc(label)}</b>`
              : w >= 3.2 ? `<b>${esc(label)}</b>`
              : '';
  return `<div class="bar-i ${cls}" style="left:${L}%;width:${Math.max(w,0.6)}%;top:calc(var(--lane)*${r._l} + 3px)"
    data-r="${esc(r.rid)}" title="${esc(label)}　${jFull(r.s)} 〜 ${jFull(r.e)}">${inner}</div>`;
}
function nameCell(room, rs, n){
  return `<div class="name" style="min-height:calc(var(--lane)*${n})">
      <div class="mn">${esc(room.n)}</div><div class="meta">
      ${room.cap ? `<span class="badge b-cap">${room.cap}人</span>` : ''}
      ${grpOf(room) ? `<span class="badge b-flr">${esc(grpOf(room))}</span>` : ''}
      ${room.av ? `<span class="badge b-av">${esc(room.av)}</span>` : ''}
      ${room.src === 'error' ? '<span class="badge b-err">読めず</span>' : ''}
      ${rs.length ? '' : '<span class="badge b-free">予約なし</span>'}
      </div></div>`;
}

function render(){ VIEW === 'day' ? renderDay() : renderWeek(); }

function renderWeek(){
  const now = Date.now(), w0 = curWeek, w1 = w0 + WK;
  const days = Array.from({length:7}, (_,i) => w0 + i*DAY);
  el('range').textContent = `${jKey(w0).replace(/-/g,'/')} 〜 ${jKey(w0+6*DAY).replace(/-/g,'/')}`;
  el('lg-note').textContent = '│ 帯の位置と幅は実時刻に比例（点線＝正午 JST）。件名は表示していません';
  const g = el('grid'); g.className = 'grid wk';

  const inView = RES.filter(r => r.e > w0 && r.s < w1);
  const list = visibleRooms(inView);
  el('cnt').textContent = `表示 ${list.length}室 / 全 ${ROOMS.length}室　この週の予約 ${inView.length}件`;

  const todayKey = jKey(now);
  let h = `<div class="hrow"><div class="hname">会議室（${list.length}）</div><div class="hdays">`;
  days.forEach(ms => {
    const d = toJ(ms), dow = d.getUTCDay();
    const c = [dow===6?'sat':'', dow===0?'sun':'', jKey(ms)===todayKey?'today':''].join(' ');
    h += `<div class="hd ${c}"><div class="dow">${DOW[dow]}</div><div class="dnum">${d.getUTCDate()}</div></div>`;
  });
  h += `</div></div>`;
  if (!list.length) h += `<div class="empty">条件に合う会議室がありません</div>`;

  let lastG = null;
  list.forEach(room => {
    const gk = grpOf(room);
    if (gk !== lastG) { lastG = gk;
      h += `<div class="grp"><span>${esc(gk || '階が未設定')}（${list.filter(x => grpOf(x) === gk).length}）</span></div>`; }
    const rs = resOf(room, w0, w1), n = laneAssign(rs);
    h += `<div class="row${room.n === HILITE ? ' hi' : ''}" data-who="${esc(room.n)}">` + nameCell(room, rs, n)
       + `<div class="days" style="height:calc(var(--lane)*${n})"><div class="bgs">`;
    days.forEach(ms => {
      const d = toJ(ms), dow = d.getUTCDay();
      const c = [dow===6?'sat':'', dow===0?'sun':'', jKey(ms)===todayKey?'today':''].join(' ');
      h += `<div class="bg ${c}"></div>`;
    });
    h += `</div><div class="bars">`;
    rs.forEach(r => {
      const L = Math.max(0, (r.s - w0) / WK * 100), R = Math.min(100, (r.e - w0) / WK * 100);
      h += barHtml(r, L, R, r.s < w0, r.e > w1);
    });
    if (SEEK && SEEK.e > w0 && SEEK.s < w1) {
      const sl = Math.max(0, (SEEK.s - w0)/WK*100), sr = Math.min(100, (SEEK.e - w0)/WK*100);
      h += `<div class="seekband" style="left:${sl}%;width:${Math.max(sr-sl,0.4)}%"></div>`;
    }
    if (now >= w0 && now < w1) h += `<div class="nowline" style="left:${(now-w0)/WK*100}%"></div>`;
    h += `</div></div></div>`;
  });
  g.innerHTML = h;
}

function renderDay(){
  const now = Date.now(), d0 = curDay;
  const inView = RES.filter(r => r.e > d0 && r.s < d0 + DAY);

  /* その日の予約に合わせて時間帯を自動で広げる（既定 8:00〜20:00）。
     ★その日を丸ごと覆う予約は計算から除く★ 数えると毎回 0:00〜24:00 に潰れて
     日中の時間割が読めなくなる。端まで伸びた帯で見えるので窓を広げる必要はない。 */
  let h0 = DAY_H0, h1 = DAY_H1, allday = 0;
  inView.forEach(r => {
    const a = Math.max(r.s, d0), b = Math.min(r.e, d0 + DAY);
    if (b - a >= 20*3600e3) { allday++; return; }
    h0 = Math.min(h0, Math.floor((a - d0)/3600e3));
    h1 = Math.max(h1, Math.ceil ((b - d0)/3600e3));
  });
  h0 = Math.max(0, h0); h1 = Math.min(24, Math.max(h1, h0 + 1));

  const t0 = d0 + h0*3600e3, t1 = d0 + h1*3600e3, span = t1 - t0, hours = h1 - h0;
  const dd = toJ(d0);
  el('range').textContent = `${jKey(d0).replace(/-/g,'/')}（${DOW[dd.getUTCDay()]}）`;
  const widened = (h0 !== DAY_H0 || h1 !== DAY_H1);
  el('lg-note').textContent = `│ ${h0}:00〜${h1}:00`
    + (widened ? '（予約に合わせて自動で広げています）' : '')
    + (allday ? `。終日ぶんの予約 ${allday}件は端まで伸びた帯で表示` : '')
    + '。赤い縦線＝現在時刻。件名は表示していません';
  const g = el('grid'); g.className = 'grid dy'; g.style.setProperty('--hours', hours);

  const list = visibleRooms(inView);
  el('cnt').textContent = `表示 ${list.length}室 / 全 ${ROOMS.length}室　この日の予約 ${inView.length}件`;

  let h = `<div class="hrow"><div class="hname">会議室（${list.length}）</div><div class="hdays">`;
  for (let i = 0; i < hours; i++){
    const hh = h0 + i;
    h += `<div class="hd ${hh===12?'noon':''}"><div class="dnum" style="font-size:12px">${pad(hh)}</div><div class="dow">:00</div></div>`;
  }
  h += `</div></div>`;
  if (!list.length) h += `<div class="empty">条件に合う会議室がありません</div>`;

  let lastG = null;
  list.forEach(room => {
    const gk = grpOf(room);
    if (gk !== lastG) { lastG = gk;
      h += `<div class="grp"><span>${esc(gk || '階が未設定')}（${list.filter(x => grpOf(x) === gk).length}）</span></div>`; }
    const rs = resOf(room, d0, d0 + DAY), n = laneAssign(rs);
    h += `<div class="row${room.n === HILITE ? ' hi' : ''}" data-who="${esc(room.n)}">` + nameCell(room, rs, n)
       + `<div class="days" style="height:calc(var(--lane)*${n})"><div class="bgs">`;
    for (let i = 0; i < hours; i++){
      const hh = h0 + i;
      h += `<div class="bg ${(hh<9||hh>=18)?'off':''}"></div>`;
    }
    h += `</div><div class="bars">`;
    rs.forEach(r => {
      const L = Math.max(0, (r.s - t0)/span*100), R = Math.min(100, (r.e - t0)/span*100);
      if (R <= 0 || L >= 100) return;
      h += barHtml(r, L, R, r.s < t0, r.e > t1);
    });
    if (SEEK && SEEK.e > t0 && SEEK.s < t1) {
      const sl = Math.max(0, (SEEK.s - t0)/span*100), sr = Math.min(100, (SEEK.e - t0)/span*100);
      h += `<div class="seekband" style="left:${sl}%;width:${Math.max(sr-sl,0.4)}%"></div>`;
    }
    if (now >= t0 && now < t1) h += `<div class="nowline" style="left:${(now-t0)/span*100}%"></div>`;
    h += `</div></div></div>`;
  });
  g.innerHTML = h;
}

/* ============================================================
   操作
   ============================================================ */
function jumpTo(who){
  HILITE = (HILITE === who) ? null : who;
  /* チップは「今すぐ空き」と「空き検索」の両方にある。片方だけ塗ると古い選択が残る */
  render(); paintSeek(); paintNow();
  if (HILITE) {
    const row = document.querySelector(`.row[data-who="${CSS.escape(HILITE)}"]`);
    if (row) row.scrollIntoView({ block:'center', behavior:'smooth' });
  }
}
el('seek-panel').addEventListener('click', ev => {
  const c = ev.target.closest('.chip'); if (c) jumpTo(c.dataset.who);
});
el('now-panel').addEventListener('click', ev => {
  const b = ev.target.closest('button[data-min]');
  if (b) { NOWMIN = Number(b.dataset.min); paintNow(); return; }
  const c = ev.target.closest('.chip'); if (c) jumpTo(c.dataset.who);
});
el('sGo').onclick    = runSeek;
el('sClear').onclick = clearSeek;

async function afterMove(){
  await loadRes(); lastLoad = Date.now();
  paintPanel(); render(); paintSeek(); paintNow(); paintUpdated(); writeUrl(); loadOwners();
}
async function setView(v){
  VIEW = v;
  el('vWeek').classList.toggle('on', v === 'week');
  el('vDay').classList.toggle('on',  v === 'day');
  await afterMove();
}
el('vWeek').onclick = () => { if (VIEW !== 'week') { curWeek = weekTopMs(curDay); setView('week'); } };
el('vDay').onclick  = () => { if (VIEW !== 'day')  { const t = Date.now();
  curDay = (t >= curWeek && t < curWeek + WK) ? dayTopMs(t) : curWeek; setView('day'); } };

el('prev').onclick = () => { if (VIEW === 'week') curWeek -= WK; else curDay -= DAY; afterMove(); };
el('next').onclick = () => { if (VIEW === 'week') curWeek += WK; else curDay += DAY; afterMove(); };
el('todayBtn').onclick = () => {
  curWeek = weekTopMs(Date.now()); curDay = dayTopMs(Date.now()); afterMove();
};
['flr','cap','onlybusy'].forEach(id => el(id).onchange = () => { render(); paintSeek(); paintNow(); writeUrl(); });
el('q').oninput = () => { render(); paintSeek(); paintNow(); writeUrl(); };

el('grid').addEventListener('click', ev => {
  const bar = ev.target.closest('.bar-i');
  if (bar) openDetail(bar.dataset.r);
});
function openDetail(rid){
  const r = RES.find(x => x.rid === rid); if (!r) return;
  el('dTitle').textContent = `${r.room}　${jHM(r.s)}–${jHM(r.e)}`;
  el('dBody').innerHTML = [
    ['会議室', `${esc(r.room)}${r.cap ? ` <span class="badge b-cap">${r.cap}人</span>` : ''}`],
    ['場所',   esc(r.flr) || '—'],
    ['時間',   `${jFull(r.s)} 〜 ${jFull(r.e)}`],
    ['状態',   esc((ST[r.status] || ST.unknown)[0])],
    ['予約者', r.who
        ? `${esc(r.who)}${r.whoDep ? ` <span class="badge b-flr">${esc(r.whoDep)}</span>` : ''}`
        : '<span style="color:var(--muted)">突き合わせできませんでした</span>'],
  ].map(([k,v]) => `<dt>${k}</dt><dd>${v}</dd>`).join('');

  el('dNote').innerHTML = r.who
    ? '<b>用途（件名）はこの画面に出していません。</b>会議室には面談などの予定が入るためです。'
      + '空けてほしいときや用途を知りたいときは、下のボタンで予約者に直接聞いてください。'
    : '<b>予約者を特定できませんでした。</b>予約した人の予定に会議室名が入っていない場合や、'
      + '外部の人が主催している場合に起きます。Outlook で会議室の予定表を開くと分かることがあります。';

  const ft = el('dFoot');
  if (r.who && r.whoMail) {
    const msg = `${jKey(r.s).replace(/-/g,'/')} ${jHM(r.s)}–${jHM(r.e)} の ${r.room} について`;
    const teams = `https://teams.microsoft.com/l/chat/0/0?users=${encodeURIComponent(r.whoMail)}`
                + `&message=${encodeURIComponent(msg)}`;
    const mail  = `mailto:${encodeURIComponent(r.whoMail)}?subject=${encodeURIComponent(msg)}`;
    ft.innerHTML = `<a class="actlink pri" href="${teams}" target="_blank" rel="noopener">Teams で ${esc(r.who)} さんに聞く</a>`
      + `<a class="actlink" href="${mail}">メールで聞く</a>`
      + `<span class="spacer"></span><button class="act" onclick="closeM('mDetail')">閉じる</button>`;
  } else {
    ft.innerHTML = `<span class="spacer"></span><button class="act" onclick="closeM('mDetail')">閉じる</button>`;
  }
  openM('mDetail');
}
document.querySelectorAll('.modal').forEach(m => m.addEventListener('click', e => { if (e.target === m) m.classList.remove('on'); }));
document.addEventListener('keydown', e => { if (e.key === 'Escape') document.querySelectorAll('.modal.on').forEach(m => m.classList.remove('on')); });

/* ============================================================
   起動
   ============================================================ */
async function loadAll(want){
  try {
    if (!ROOMS.length) {
      /* 会議室の一覧と社員名簿は互いに独立なので同時に取る。
         ★名簿は loadRes より先に必要★ 件名（＝予約者名）を名簿と突き合わせるので、
         名簿が無いうちに予約を読むと、予約者が1件も出ない。
         名簿が取れなくても会議室の空きは出す（予約者名だけ出なくなる）。 */
      const [, peopleErr] = await Promise.all([
        loadRooms(),
        loadPeople().then(() => null, e => e)
      ]);
      if (peopleErr) {
        SRC.errs.push('社員名簿が読めません（予約者名が出ません）：'
          + `[${peopleErr.status || ''}] ${peopleErr.message}`);
      }
      paintFlrSelect(); paintCapSelect();
    }
    if (want) {
      if (want.flr) el('flr').value = want.flr;
      if (want.cap) el('cap').value = want.cap;
      if (want.q)   el('q').value   = want.q;
    }
    await loadRes();
  } catch (e) {
    SRC.errs.push(`読み込みに失敗：[${e.status || ''}] ${e.message}`);
    showSnack('読み込みに失敗しました。更新を押してください');
  }
  lastLoad = Date.now();
  paintPanel(); render(); paintSeek(); paintNow(); paintUpdated();
  /* 予約者の突き合わせは後追い。最初の描画を待たせない */
  loadOwners();
}

initMsal();
</script>

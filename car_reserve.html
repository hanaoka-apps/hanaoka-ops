<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>営業車予約 状況確認 | 花岡車輌</title>
  <script src="https://cdn.jsdelivr.net/npm/@azure/msal-browser@3.10.0/lib/msal-browser.min.js" crossorigin="anonymous"></script>
  <script src="nav.js" defer></script>
  <style>
    :root{
      --primary:#1a5fa8; --primary-dk:#134680; --accent:#e8412e;
      --success:#2e7d52; --warning:#c07a00; --danger:#c0392b;
      --bg:#f4f6f9; --card-bg:#fff; --border:#dde2ec; --text:#1e2533; --muted:#6b7a99;
      --shadow:0 1px 4px rgba(0,0,0,.08);
      --namew:230px; --dayw:128px; --hourw:62px; --lane:30px;
    }
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Meiryo','Hiragino Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}

    header{background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:space-between;
      padding:0 20px;height:52px;box-shadow:0 2px 8px rgba(0,0,0,.2);position:sticky;top:0;z-index:100}
    header .logo{font-size:16px;font-weight:700;letter-spacing:.04em}
    header .logo span{opacity:.7;font-weight:400;font-size:13px;margin-left:10px}
    header .user-info{display:flex;align-items:center;gap:12px;font-size:13px}
    header button{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.3);color:#fff;
      padding:5px 14px;border-radius:4px;cursor:pointer;font-size:12px}
    header button:hover{background:rgba(255,255,255,.25)}

    #login-view{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:calc(100vh - 52px);gap:20px}
    #login-view h2{font-size:20px;color:var(--primary)}
    #login-view p{color:var(--muted);font-size:14px}
    #login-btn{background:var(--primary);color:#fff;border:none;padding:12px 36px;border-radius:6px;
      font-size:15px;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:8px}
    #login-btn:hover{background:var(--primary-dk)}

    #app-view{display:none;padding:18px}

    .bar{display:flex;align-items:center;gap:9px;flex-wrap:wrap;background:var(--card-bg);padding:11px 14px;
      border-radius:8px;border:1px solid var(--border);box-shadow:var(--shadow);margin-bottom:13px}
    .bar label{font-size:12.5px;color:var(--muted);font-weight:600}
    select,input[type=search],input[type=date],input[type=text]{border:1px solid var(--border);border-radius:4px;
      padding:5px 9px;font-size:13px;background:#fff;font-family:inherit;max-width:100%}
    button.act{background:#fff;border:1px solid var(--border);border-radius:4px;padding:5px 12px;font-size:13px;
      cursor:pointer;font-family:inherit}
    button.act:hover:not(:disabled){background:#f0f2f5}
    button.pri{background:var(--primary);border-color:var(--primary);color:#fff}
    button.pri:hover:not(:disabled){background:var(--primary-dk)}
    button.act:disabled{opacity:.45;cursor:not-allowed}
    .seg{display:flex;border:1px solid var(--border);border-radius:4px;overflow:hidden}
    .seg button{background:#fff;border:none;padding:5px 15px;font-size:13px;cursor:pointer;font-family:inherit;
      border-left:1px solid var(--border)}
    .seg button:first-child{border-left:none}
    .seg button.on{background:var(--primary);color:#fff;font-weight:700}
    .range{font-weight:700;font-size:14px;min-width:184px;text-align:center}
    .chk{display:flex;align-items:center;gap:5px;color:var(--muted);cursor:pointer;user-select:none;
      white-space:nowrap;font-size:12.5px}
    .spacer{flex:1}
    .cnt{font-size:11.5px;color:var(--muted)}

    #status-panel{background:var(--card-bg);border:1px solid var(--border);border-radius:8px;padding:11px 14px;
      margin-bottom:13px;font-size:12.5px;box-shadow:var(--shadow)}
    #status-panel.warn{border-color:var(--warning);background:#fffdf3}
    #status-panel.bad{border-color:var(--danger);background:#fdf4f3}
    #status-panel .st-row{display:flex;gap:8px;align-items:baseline;margin-top:4px;flex-wrap:wrap}
    #status-panel .ok{color:var(--success);font-weight:700}
    #status-panel .ng{color:var(--danger);font-weight:700}
    #status-panel code{background:#eef0f3;padding:1px 4px;border-radius:3px;font-size:11.5px}
    #status-panel details{margin-top:6px}
    #status-panel summary{cursor:pointer;color:var(--primary)}
    #status-panel pre{background:#f6f8fa;border:1px solid var(--border);border-radius:4px;padding:8px;
      margin-top:6px;font-size:11px;overflow:auto;max-height:240px;line-height:1.6}

    .legend{display:flex;gap:10px;flex-wrap:wrap;font-size:11.5px;color:var(--muted);align-items:center;margin-bottom:9px}
    .legend i{display:inline-block;width:11px;height:11px;border-radius:2px;margin-right:3px;vertical-align:-1px;border:1px solid}

    .scroll{overflow-x:auto;background:var(--card-bg);border:1px solid var(--border);border-radius:8px;box-shadow:var(--shadow)}
    .grid.wk{min-width:calc(var(--namew) + var(--dayw)*7)}
    .grid.dy{min-width:calc(var(--namew) + var(--hourw)*var(--hours))}
    .hrow{display:flex;position:sticky;top:52px;z-index:30;background:#f8f9fc;border-bottom:1px solid var(--border)}
    .hname{flex:0 0 var(--namew);position:sticky;left:0;z-index:31;background:#f8f9fc;border-right:1px solid var(--border);
      padding:7px 11px;font-weight:700;font-size:12px;color:var(--muted);display:flex;align-items:center}
    .hdays{flex:1;display:grid}
    .grid.wk .hdays{grid-template-columns:repeat(7,minmax(var(--dayw),1fr))}
    .grid.dy .hdays{grid-template-columns:repeat(var(--hours),minmax(var(--hourw),1fr))}
    .hd{padding:4px 6px;text-align:center;border-left:1px solid #eef1f6;line-height:1.3}
    .hd .dow{font-size:10.5px;color:var(--muted)}
    .hd .dnum{font-weight:700;font-size:14px}
    .hd.sat{background:#eef4fb}.hd.sat .dow{color:var(--primary)}
    .hd.sun{background:#fdeff0}.hd.sun .dow{color:var(--danger)}
    .hd.today{background:#fff6d9}.hd.today .dnum,.hd.today .dow{color:#8a5a00}
    .hd.noon{background:#f2f5fa}

    .row{display:flex;border-bottom:1px solid #f0f3fa}
    .row:hover .name{background:#f8f9fc}
    .name{flex:0 0 var(--namew);position:sticky;left:0;z-index:20;background:#fff;border-right:1px solid var(--border);
      padding:5px 10px;display:flex;flex-direction:column;gap:1px;justify-content:center}
    .mn{font-weight:600;line-height:1.28;font-size:12px}
    .meta{font-size:10px;color:var(--muted);display:flex;gap:5px;flex-wrap:wrap;align-items:center}
    .badge{font-size:9.5px;border-radius:3px;padding:0 4px;border:1px solid;line-height:14px;white-space:nowrap}
    .b-loc{background:#f4f6f9;color:var(--muted);border-color:var(--border)}
    .b-src{background:#eef6f0;color:var(--success);border-color:#a9d3ba}
    .b-src.list{background:#fdf3e3;color:var(--warning);border-color:#e8c96a}
    .b-src.err{background:#fbdcd9;color:var(--danger);border-color:#e6a8a0}
    .b-free{background:#eef6f0;color:var(--success);border-color:#a9d3ba}

    .days{flex:1;position:relative}
    .grid.wk .days{min-width:calc(var(--dayw)*7)}
    .grid.dy .days{min-width:calc(var(--hourw)*var(--hours))}
    .bgs{position:absolute;inset:0;display:grid}
    .grid.wk .bgs{grid-template-columns:repeat(7,1fr)}
    .grid.dy .bgs{grid-template-columns:repeat(var(--hours),1fr)}
    .bg{border-left:1px solid #eef1f6;position:relative}
    .grid.wk .bg::after{content:"";position:absolute;left:50%;top:0;bottom:0;border-left:1px dotted #f2f4f8}
    .bg.sat{background:#f8fbfe}.bg.sun{background:#fefafa}.bg.today{background:#fffdf2}
    .bg.off{background:#f7f8fa}
    .nowline{position:absolute;top:0;bottom:0;width:0;border-left:2px solid var(--accent);z-index:11;pointer-events:none}
    .bars{position:absolute;inset:0;pointer-events:none}
    .bar-i{position:absolute;height:calc(var(--lane) - 6px);min-width:30px;border-radius:3px;
      border-style:solid;border-width:1px 1px 1px 3px;padding:0 5px;font-size:11px;
      line-height:calc(var(--lane) - 8px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
      cursor:pointer;pointer-events:auto;display:flex;align-items:center;gap:5px}
    .bar-i:hover{filter:brightness(.95);z-index:12}
    .bar-i b{font-weight:700}
    .bar-i .tm{opacity:.85;font-size:10px;font-variant-numeric:tabular-nums;background:rgba(255,255,255,.55);
      border-radius:2px;padding:0 3px}
    .bar-i .who{opacity:.7;font-size:10px}
    .s-予約   {background:#dbe9fb;border-color:#2f6fd0;color:#12386f}
    .s-使用中 {background:#fdeccd;border-color:#d98c12;color:#6d4304}
    .s-終了   {background:#eceef2;border-color:#a8b0bb;color:#5a636e}
    .s-重複   {background:#fbdcd9;border-color:var(--danger);color:#7d1d13}
    .s-取消   {background:#f4f5f7;border-color:#c3c8d0;color:#98a0aa;text-decoration:line-through}
    .cut-l{border-left-style:dashed!important;border-top-left-radius:0;border-bottom-left-radius:0}
    .cut-r{border-right-style:dashed;border-top-right-radius:0;border-bottom-right-radius:0}
    .empty{padding:26px;text-align:center;color:var(--muted);font-size:13px}

    .modal{position:fixed;inset:0;background:rgba(20,26,34,.45);display:none;align-items:center;
      justify-content:center;z-index:200;padding:14px}
    .modal.on{display:flex}
    .card{background:#fff;border-radius:8px;max-width:470px;width:100%;box-shadow:0 12px 40px rgba(0,0,0,.28);
      max-height:92vh;overflow:auto}
    .card h3{margin:0;padding:12px 16px;font-size:14.5px;border-bottom:1px solid var(--border);
      background:#f8f9fc;color:var(--primary)}
    .card .bd{padding:13px 16px;font-size:13px}
    .card dl{margin:0;display:grid;grid-template-columns:90px 1fr;gap:7px 10px}
    .card dt{color:var(--muted)}.card dd{margin:0;word-break:break-all}
    .card .ft{padding:11px 16px;border-top:1px solid var(--border);display:flex;gap:8px;
      justify-content:flex-end;background:#f8f9fc;align-items:center}
    .msg{font-size:12px;flex:1}
    .msg.ng{color:var(--danger);font-weight:700}
    .note{background:#f8f9fc;border-radius:5px;padding:8px 10px;font-size:11.5px;color:var(--muted);
      line-height:1.6;margin-top:9px}

    #snackbar{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#323232;color:#fff;
      padding:10px 20px;border-radius:6px;font-size:13px;display:none;z-index:999;max-width:90vw}

    @media(max-width:700px){
      :root{--namew:150px;--dayw:110px;--hourw:52px}
      .bar-i .who{display:none}
      #app-view{padding:11px}
    }
    @media print{
      header,.bar,.legend,#status-panel{display:none}
      .scroll{overflow:visible;border:none;box-shadow:none}
      .name,.hname,.hrow{position:static}
      body{background:#fff}
      :root{--dayw:90px;--hourw:46px;--namew:168px;--lane:24px}
    }
  </style>
</head>
<body>

<header>
  <div class="logo">花岡車輌<span>営業車予約 状況確認</span></div>
  <div class="user-info">
    <span class="name" id="user-name"></span>
    <button onclick="signOut()">サインアウト</button>
  </div>
</header>

<div id="login-view">
  <h2>営業車予約 状況確認</h2>
  <p>花岡車輌株式会社の Microsoft アカウントでサインインしてください</p>
  <button id="login-btn" onclick="signIn()">
    <svg width="18" height="18" viewBox="0 0 21 21" fill="none"><path d="M10 0H0v10h10V0z" fill="#F25022"/><path d="M21 0H11v10h10V0z" fill="#7FBA00"/><path d="M10 11H0v10h10V11z" fill="#00A4EF"/><path d="M21 11H11v10h10V11z" fill="#FFB900"/></svg>
    Microsoft アカウントでサインイン
  </button>
</div>

<div id="app-view">
  <div id="app-nav-slot"></div>

  <div id="status-panel">読み込み中...</div>

  <div class="bar">
    <div class="seg">
      <button id="vWeek" class="on">週</button>
      <button id="vDay">日</button>
    </div>
    <select id="loc"></select>
    <input type="search" id="q" placeholder="車両名で検索" style="width:150px">
    <button class="act" id="prev">◀</button>
    <button class="act pri" id="todayBtn">今日</button>
    <button class="act" id="next">▶</button>
    <span class="range" id="range"></span>
    <span class="spacer"></span>
    <button class="act" onclick="loadAll()">🔄 更新</button>
    <button class="act" onclick="window.print()">印刷</button>
  </div>

  <div class="bar" style="margin-bottom:11px">
    <label class="chk"><input type="checkbox" id="onlyres"> 予約がある車だけ</label>
    <label class="chk"><input type="checkbox" id="onlyfree"> 空いている車だけ</label>
    <span class="cnt" id="cnt"></span>
  </div>

  <div class="legend">
    <span><i class="s-予約"></i>予約（開始前）</span>
    <span><i class="s-使用中"></i>使用中（期間中）</span>
    <span><i class="s-終了"></i>終了</span>
    <span><i class="s-重複"></i>重複あり</span>
    <span><i class="s-取消"></i>取消</span>
    <span id="lg-note">│ バーの位置と幅は実時刻に比例（点線＝正午 JST）</span>
  </div>

  <div class="scroll"><div class="grid wk" id="grid"></div></div>
</div>

<div class="modal" id="mDetail"><div class="card">
  <h3 id="dTitle">予約の詳細</h3>
  <div class="bd"><dl id="dBody"></dl><div class="note" id="dNote"></div></div>
  <div class="ft"><span class="msg" id="dMsg"></span><button class="act" onclick="closeM('mDetail')">閉じる</button></div>
</div></div>

<div id="snackbar"></div>

<script>
/* ============================================================
   設定
   ------------------------------------------------------------
   営業車の予約は Outlook のリソース予定表が正本。
   このアプリは参照専用で、書き込みは一切しない。
   ============================================================ */
const MSAL_CONFIG = {
  auth: {
    clientId:    'd338d61b-01dc-4c7c-ac6b-aecf7f30d716',
    authority:   'https://login.microsoftonline.com/3933e8a0-c945-4e97-ae67-c82131087cad',
    redirectUri: new URL('auth.html', window.location.href).href,
  },
  cache: { cacheLocation: 'sessionStorage', storeAuthStateInCookie: false },
};
/* Calendars.Read.Shared がリソース予定表を読むための権限。
   Sites.Read.All は車両マスター（SharePointリスト）を読むためだけに使う。 */
const SCOPES     = ['User.Read', 'Sites.Read.All', 'Calendars.Read', 'Calendars.Read.Shared'];
const GRAPH_BASE = 'https://graph.microsoft.com/v1.0';

const SITE_ID     = 'hanaokacorp.sharepoint.com,57813f25-8b28-40ac-affa-1e7d06d56802,eb428e92-6c63-46a9-a144-f6a2283a2f23';
const MASTER_NAME = '営業車管理一覧';
const HIST_NAME   = '営業車予約履歴';
const HIST_ID_FB  = 'ba6429a0-1ef9-487c-a9e7-91288dc277c5';   /* 名前解決に失敗したときの保険 */

const DAY_H0 = 6, DAY_H1 = 21;          /* 日表示の時間帯（JST） */
const HIST_DAYS = 120;                  /* リストから読むときの窓。範囲を必ず閉じる */

/* ============================================================
   時刻（JST固定。ブラウザのタイムゾーンに依存しない）
   ============================================================ */
const JST = 9 * 3600e3;
const toJ   = ms => new Date(ms + JST);
const pad   = n => String(n).padStart(2, '0');
const jKey  = ms => { const d = toJ(ms); return `${d.getUTCFullYear()}-${pad(d.getUTCMonth()+1)}-${pad(d.getUTCDate())}`; };
const jHM   = ms => { const d = toJ(ms); return `${pad(d.getUTCHours())}:${pad(d.getUTCMinutes())}`; };
const jFull = ms => `${jKey(ms).replace(/-/g,'/')} ${jHM(ms)}`;
const P     = iso => new Date(iso).getTime();
/* Graph の dateTimeTimeZone。Prefer で UTC を指定しているので Z を足して読む */
const pTZ   = x => {
  if (!x || !x.dateTime) return NaN;
  const s = x.dateTime;
  return Date.parse(/[Zz]|[+-]\d\d:?\d\d$/.test(s) ? s : s + 'Z');
};
function dayTopMs(ms){ const d = toJ(ms); return Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate()) - JST; }
function weekTopMs(ms){
  const d = toJ(ms);
  const back = (d.getUTCDay() + 6) % 7;
  return Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate() - back) - JST;
}
const DAY = 86400e3, WK = DAY * 7, DOW = ['日','月','火','水','木','金','土'];
const overlaps = (a, s, e) => a.s < e && a.e > s;       /* 半開区間。12:00返却→12:00出発は重複でない */

/* Outlookの「場所」は予定にTeams会議を付けると勝手に埋まるので、
   行き先として使えない値を弾く。車の予約でオンライン会議名が入っていたら
   それは行き先ではない。同期済みリストの Destination も同じ値が入っているので同様に扱う。 */
const DEST_NOISE_RE = /microsoft\s*teams|teams\s*(会議|meeting)|skype|オンライン会議|online\s*meeting/i;
const cleanDest = v => { const s = String(v ?? '').trim(); return (!s || DEST_NOISE_RE.test(s)) ? '' : s; };
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ============================================================
   認証
   ============================================================ */
let msalInstance = null, currentAccount = null;

async function initMsal(){
  msalInstance = new msal.PublicClientApplication(MSAL_CONFIG);
  await msalInstance.initialize();
  await msalInstance.handleRedirectPromise();
  const a = msalInstance.getAllAccounts();
  if (a.length) { currentAccount = a[0]; msalInstance.setActiveAccount(currentAccount); await showApp(); }
}
async function signIn(){
  try {
    const r = await msalInstance.loginPopup({ scopes: SCOPES });
    currentAccount = r.account; msalInstance.setActiveAccount(currentAccount); await showApp();
  } catch (e) {
    if (e.errorCode !== 'user_cancelled') showSnack('サインインエラー: ' + (e.errorCode || e.message));
  }
}
function signOut(){ msalInstance.logoutPopup({ account: currentAccount }); }
async function getToken(){
  try { return (await msalInstance.acquireTokenSilent({ scopes: SCOPES, account: currentAccount })).accessToken; }
  catch { const r = await msalInstance.acquireTokenPopup({ scopes: SCOPES }); currentAccount = r.account; return r.accessToken; }
}

/* ============================================================
   Graph
   ============================================================ */
async function gGet(path, extra){
  const t = await getToken();
  const r = await fetch(GRAPH_BASE + path, { headers: { Authorization: 'Bearer ' + t, ...(extra||{}) } });
  if (!r.ok) { const e = new Error(`[${r.status}] ${path}`); e.status = r.status; e.body = await r.text(); throw e; }
  return r.json();
}
async function gGetAll(path, extra){
  let out = [], next = path;
  while (next) {
    const d = await gGet(next, extra);
    out = out.concat(d.value || []);
    next = d['@odata.nextLink'] ? d['@odata.nextLink'].replace(GRAPH_BASE, '') : null;
  }
  return out;
}
/* $batch。1回20件まで。車両13台なら1回で終わる */
async function gBatch(requests){
  const t = await getToken(); const out = [];
  for (let i = 0; i < requests.length; i += 20) {
    const chunk = requests.slice(i, i+20).map((r,k) => ({ id: String(i+k), ...r }));
    const res = await fetch(`${GRAPH_BASE}/$batch`, { method:'POST',
      headers:{ Authorization:'Bearer '+t, 'Content-Type':'application/json' },
      body: JSON.stringify({ requests: chunk }) });
    const b = await res.json();
    out.push(...(b.responses || []));
  }
  return out.sort((a,b) => Number(a.id) - Number(b.id));
}

/* ============================================================
   状態
   ============================================================ */
let CARS = [], RES = [];
let VIEW = 'week';                       /* 'week' | 'day' */
let curWeek = weekTopMs(Date.now());
let curDay  = dayTopMs(Date.now());
let SRC = { mode:'—', ok:0, ng:0, errs:[], masterCols:'', histId:null };
let PANEL_DETAIL = '';

const el = id => document.getElementById(id);
function showSnack(m){ const s = el('snackbar'); s.textContent = m; s.style.display='block';
  clearTimeout(showSnack._t); showSnack._t = setTimeout(()=>s.style.display='none', 4200); }
function openM(id){ el(id).classList.add('on'); }
function closeM(id){ el(id).classList.remove('on'); }

async function showApp(){
  el('login-view').style.display = 'none';
  el('app-view').style.display   = 'block';
  el('user-name').textContent    = currentAccount?.name || currentAccount?.username || '';
  await loadAll();
}

/* ============================================================
   車両マスター
   ------------------------------------------------------------
   内部列名が分からないので、フィールド名を正規表現で拾う。
   拾えた対応は準備状況パネルに出すので、外したらすぐ分かる。
   ============================================================ */
const RX_MAIL = /resource.*mail|mail.*resource|resourceemail|^email$|mail$|メール|アドレス/i;
const RX_NAME = /vehicle|車両|車名|^title$/i;
const RX_LOC  = /baselocation|location|拠点|site|base/i;

function pickKey(keys, rx, exclude){
  const cand = keys.filter(k => rx.test(k) && !/^(id|contenttype|_|odata|attachments|edit|linktitle|itemchild|folder|compliance|appauthor|appeditor|author|editor|created|modified|filesystem|servername|encoded|linkfilename|docicon|itemtype|sortbehavior|parentversion|parentleaf|selecttype|order|guid|instanceid|owshidden|progid|scopeid|healthreport|virus|checked|isrecord|displayorder)/i.test(k));
  const f = cand.filter(k => !exclude || !exclude.includes(k));
  return f[0] || cand[0] || null;
}

async function resolveList(name, fallbackId){
  const key = 'listId:' + name;
  const c = sessionStorage.getItem(key);
  if (c) return c;
  const r = await gGet(`/sites/${SITE_ID}/lists?$select=id,displayName&$top=200`);
  const hit = (r.value||[]).find(l => l.displayName === name);
  const id = hit ? hit.id : fallbackId;
  if (id) sessionStorage.setItem(key, id);
  return id;
}

async function loadCars(){
  const listId = await resolveList(MASTER_NAME, null);
  if (!listId) throw new Error(`リスト「${MASTER_NAME}」が見つかりません`);
  const items = await gGetAll(`/sites/${SITE_ID}/lists/${listId}/items?$expand=fields&$top=500`);
  if (!items.length) throw new Error(`「${MASTER_NAME}」に行がありません`);

  const keys = Object.keys(items[0].fields || {});
  const kMail = pickKey(keys, RX_MAIL);
  const kName = pickKey(keys, RX_NAME);
  const kLoc  = pickKey(keys, RX_LOC);
  SRC.masterCols = `車両名=${kName||'—'} / 拠点=${kLoc||'—'} / リソースメール=${kMail||'—'}`;
  PANEL_DETAIL = keys.join(', ');

  CARS = items.map(it => {
    const f = it.fields || {};
    const raw = kLoc ? f[kLoc] : '';
    return {
      itemId: it.id,
      n   : String((kName && f[kName]) || f.Title || '(名称なし)'),
      loc : String((raw && typeof raw === 'object' ? (raw.Value || raw.LookupValue || '') : raw) || ''),
      mail: String((kMail && f[kMail]) || '').trim().toLowerCase(),
      src : 'none'
    };
  });
  return kMail;
}

/* マスターにリソースメールが無い／空のときは、履歴リストの
   車両名→ResourceEmail の対応から補う。履歴には必ず両方入っている。 */
async function fillMailsFromHistory(){
  try {
    const listId = SRC.histId || (SRC.histId = await resolveList(HIST_NAME, HIST_ID_FB));
    if (!listId) return;
    const items = await gGetAll(
      `/sites/${SITE_ID}/lists/${listId}/items?$expand=fields&$top=2000`);
    const map = new Map();
    items.forEach(it => {
      const f = it.fields || {};
      if (f.VehicleName && f.ResourceEmail) map.set(String(f.VehicleName), String(f.ResourceEmail).trim().toLowerCase());
    });
    let n = 0;
    CARS.forEach(c => { if (!c.mail && map.has(c.n)) { c.mail = map.get(c.n); n++; } });
    if (n) SRC.masterCols += `　※ リソースメール ${n}台は履歴リストから補完`;
  } catch (e) {
    SRC.errs.push('履歴リストからのメール補完に失敗：' + e.message);
  }
}

/* ============================================================
   予約（Outlook のリソース予定表）
   ============================================================ */
function viewRange(){
  if (VIEW === 'week') return [curWeek, curWeek + WK];
  return [curDay, curDay + DAY];
}

async function loadRes(){
  const [v0, v1] = viewRange();
  const f0 = v0 - DAY, f1 = v1 + DAY;          /* 前後1日ぶん広く取る（またぎのバーを描くため） */
  const iso = ms => new Date(ms).toISOString();
  const withMail = CARS.filter(c => c.mail);

  SRC = { ...SRC, ok:0, ng:0, errs:[] };
  RES = [];
  if (!withMail.length) { SRC.mode = 'リソースメール未取得'; return; }

  const q = `startDateTime=${encodeURIComponent(iso(f0))}&endDateTime=${encodeURIComponent(iso(f1))}`
          + `&$select=id,subject,start,end,organizer,location,isCancelled,isAllDay,showAs`
          + `&$orderby=start/dateTime&$top=200`;

  const reqs = withMail.map(c => ({
    method: 'GET',
    url: `/users/${encodeURIComponent(c.mail)}/calendarView?${q}`,
    headers: { Prefer: 'outlook.timezone="UTC"' }
  }));

  const res = await gBatch(reqs);
  const failed = [];

  res.forEach((r, i) => {
    const car = withMail[i];
    if (r.status === 200 && r.body && Array.isArray(r.body.value)) {
      SRC.ok++;
      car.src = 'outlook';
      r.body.value.forEach(ev => {
        const s = pTZ(ev.start), e = pTZ(ev.end);
        if (isNaN(s) || isNaN(e)) return;
        RES.push({
          rid : `o:${car.mail}:${ev.id}`,
          car : car.n, mail: car.mail,
          t   : ev.subject || '(件名非公開)',
          s, e,
          who : ev.organizer?.emailAddress?.name    || '',
          mailWho: ev.organizer?.emailAddress?.address || '',
          dest: cleanDest(ev.location?.displayName),
          cancelled: !!ev.isCancelled,
          allDay: !!ev.isAllDay,
          from: 'Outlook'
        });
      });
    } else {
      SRC.ng++;
      car.src = 'error';
      failed.push(car);
      const code = r.body?.error?.code || '';
      SRC.errs.push(`${car.n}：[${r.status}] ${code}`);
    }
  });

  SRC.mode = SRC.ng === 0 ? 'Outlook 直読み' : `Outlook 直読み（${SRC.ng}台は読めず）`;
  if (failed.length) await fallbackFromList(failed, f0, f1);
}

/* 読めなかった車両だけ、同期済みのSharePointリストから補う */
async function fallbackFromList(cars, f0, f1){
  try {
    const listId = SRC.histId || (SRC.histId = await resolveList(HIST_NAME, HIST_ID_FB));
    if (!listId) return;
    const lo = new Date(Math.min(f0, Date.now() - HIST_DAYS*DAY)).toISOString();
    const hi = new Date(Math.max(f1, Date.now() + HIST_DAYS*DAY)).toISOString();
    const items = await gGetAll(
      `/sites/${SITE_ID}/lists/${listId}/items?$expand=fields&$top=2000`
      + `&$filter=fields/BookingStart ge ${lo} and fields/BookingStart le ${hi}`,
      { Prefer: 'HonorNonIndexedQueriesWarningMayFailRandomly' }
    ).catch(async () => gGetAll(`/sites/${SITE_ID}/lists/${listId}/items?$expand=fields&$top=2000`));

    const names = new Set(cars.map(c => c.n));
    const mails = new Set(cars.map(c => c.mail));
    items.forEach(it => {
      const f = it.fields || {};
      const nm = String(f.VehicleName || '');
      const mm = String(f.ResourceEmail || '').trim().toLowerCase();
      if (!names.has(nm) && !mails.has(mm)) return;
      const s = f.BookingStart ? P(f.BookingStart) : NaN;
      const e = f.BookingEnd   ? P(f.BookingEnd)   : NaN;
      if (isNaN(s) || isNaN(e)) return;
      const st = f.BookingStatus?.Value || f.BookingStatus || '';
      RES.push({
        rid: `l:${it.id}`, car: nm, mail: mm,
        t: f.Title || '(件名なし)', s, e,
        who: f.OrganizerName || '', mailWho: f.OrganizerEmail || '',
        dest: cleanDest(f.Destination),
        cancelled: String(st) === '取消',
        allDay: false, from: 'リスト（同期済み）'
      });
    });
    cars.forEach(c => c.src = 'list');
    SRC.mode += ' ＋ リスト補完';
  } catch (e) {
    SRC.errs.push('リスト補完も失敗：' + e.message);
  }
}

/* ============================================================
   状態は保存せず「今」から計算する
   ============================================================ */
function calcStatus(r, now){
  if (r.cancelled) return '取消';
  if (now < r.s) return '予約';
  if (now > r.e) return '終了';
  return '使用中';
}

/* ============================================================
   準備状況パネル
   ============================================================ */
function paintPanel(){
  const p = el('status-panel');
  const bad = SRC.ng > 0 || !CARS.some(c => c.mail);
  p.className = bad ? 'bad' : '';
  const withMail = CARS.filter(c => c.mail).length;
  let h = `<div><b>取得状況</b></div>`
    + `<div class="st-row">データ元：<span class="${SRC.ng?'ng':'ok'}">${esc(SRC.mode)}</span>`
    + `<span style="color:var(--muted)">読めた ${SRC.ok}台 / 読めず ${SRC.ng}台 / メール未設定 ${CARS.length - withMail}台</span></div>`
    + `<div class="st-row">車両マスター：<code>${esc(SRC.masterCols)}</code></div>`
    + `<div class="st-row" style="color:var(--muted)">この画面は参照専用です。予約の作成・変更は Outlook で行ってください。</div>`;
  if (SRC.errs.length){
    h += `<details><summary>読めなかった車両の理由（${SRC.errs.length}件）</summary><pre>${esc(SRC.errs.join('\n'))}\n\n`
      + `403 / ErrorAccessDenied → リソース予定表の参照権限が足りない\n`
      + `  Exchange 管理センターで、その車両のリソースに対して全社員に「表示」以上を付与してください。\n`
      + `401 / 同意エラー → Azure AD アプリに Calendars.Read.Shared が無い\n`
      + `404 → リソースメールが間違っている（マスターの値を確認）\n\n`
      + `マスターのフィールド名一覧：\n${esc(PANEL_DETAIL)}</pre></details>`;
  }
  p.innerHTML = h;
}

/* ============================================================
   読み込み
   ============================================================ */
async function loadAll(){
  el('status-panel').className = '';
  el('status-panel').textContent = '読み込み中...';
  try {
    if (!CARS.length) {
      const kMail = await loadCars();
      if (!kMail || !CARS.some(c => c.mail)) await fillMailsFromHistory();
      paintLocSelect();
    }
    await loadRes();
  } catch (e) {
    el('status-panel').className = 'bad';
    el('status-panel').innerHTML = `<b class="ng">読み込みに失敗しました</b><br><code>${esc(e.message)}</code>`
      + `<div class="st-row" style="color:var(--muted)">Sites.Read.All / Calendars.Read.Shared の同意が済んでいるか確認してください。</div>`;
    return;
  }
  paintPanel();
  render();
}

function paintLocSelect(){
  const locs = [...new Set(CARS.map(c => c.loc).filter(Boolean))].sort();
  el('loc').innerHTML = `<option value="">すべての拠点（${CARS.length}台）</option>`
    + locs.map(l => `<option value="${esc(l)}">${esc(l)}（${CARS.filter(c=>c.loc===l).length}）</option>`).join('');
}

/* ============================================================
   描画
   ============================================================ */
function visibleCars(inView){
  const loc = el('loc').value, q = el('q').value.trim().toLowerCase();
  let list = CARS.filter(c => (!loc || c.loc === loc) && (!q || c.n.toLowerCase().includes(q)));
  if (el('onlyres').checked){
    const has = new Set(inView.filter(r => !r.cancelled).map(r => r.car));
    list = list.filter(c => has.has(c.n));
  }
  if (el('onlyfree').checked){
    const has = new Set(inView.filter(r => !r.cancelled).map(r => r.car));
    list = list.filter(c => !has.has(c.n));
  }
  return list;
}

function render(){ VIEW === 'week' ? renderWeek() : renderDay(); }

function resOf(car, v0, v1){
  return RES.filter(r => r.car === car.n && r.e > v0 && r.s < v1).sort((a,b) => a.s - b.s);
}
function laneAssign(rs){
  const lanes = [];
  rs.forEach(r => {
    r._dup = rs.some(o => o !== r && !o.cancelled && !r.cancelled && overlaps(o, r.s, r.e));
    let i = lanes.findIndex(l => l.every(x => x.e <= r.s || x.s >= r.e));
    if (i < 0) { lanes.push([r]); i = lanes.length - 1; } else lanes[i].push(r);
    r._l = i;
  });
  return Math.max(1, lanes.length);
}
function srcBadge(c){
  if (c.src === 'outlook') return '';
  if (c.src === 'list')  return `<span class="badge b-src list">リスト</span>`;
  if (c.src === 'error') return `<span class="badge b-src err">読めず</span>`;
  return c.mail ? '' : `<span class="badge b-src err">メール未設定</span>`;
}
function barHtml(r, L, R, now, cutL, cutR){
  const st  = r._dup && !r.cancelled ? '重複' : calcStatus(r, now);
  const cls = [`s-${st}`, cutL?'cut-l':'', cutR?'cut-r':''].join(' ');
  return `<div class="bar-i ${cls}" style="left:${L}%;width:${Math.max(R-L,0.6)}%;top:calc(var(--lane)*${r._l} + 3px)"
    data-r="${esc(r.rid)}" title="${esc(r.t)}">
    ${r.allDay ? '' : `<span class="tm">${jHM(r.s)}–${jHM(r.e)}</span>`}
    <b>${esc(r.t)}</b><span class="who">${esc([r.who, r.dest].filter(Boolean).join(' / '))}</span></div>`;
}

function renderWeek(){
  const now = Date.now(), w0 = curWeek, w1 = w0 + WK;
  const days = Array.from({length:7}, (_,i) => w0 + i*DAY);
  el('range').textContent = `${jKey(w0).replace(/-/g,'/')} 〜 ${jKey(w0+6*DAY).replace(/-/g,'/')}`;
  el('lg-note').textContent = '│ バーの位置と幅は実時刻に比例（点線＝正午 JST）';
  const gridEl = el('grid'); gridEl.className = 'grid wk';

  const inView = RES.filter(r => r.e > w0 && r.s < w1);
  const list = visibleCars(inView);
  el('cnt').textContent = `表示 ${list.length}台 / 全 ${CARS.length}台　予約 ${inView.filter(r=>!r.cancelled).length}件`;

  const todayKey = jKey(now);
  let h = `<div class="hrow"><div class="hname">車両（${list.length}）</div><div class="hdays">`;
  days.forEach(ms => {
    const d = toJ(ms), dow = d.getUTCDay();
    const c = [dow===6?'sat':'', dow===0?'sun':'', jKey(ms)===todayKey?'today':''].join(' ');
    h += `<div class="hd ${c}"><div class="dow">${DOW[dow]}</div><div class="dnum">${d.getUTCDate()}</div></div>`;
  });
  h += `</div></div>`;
  if (!list.length) h += `<div class="empty">条件に合う車両がありません</div>`;

  list.forEach(c => {
    const rs = resOf(c, w0, w1), n = laneAssign(rs);
    h += `<div class="row"><div class="name" style="min-height:calc(var(--lane)*${n})">
      <div class="mn">${esc(c.n)}</div><div class="meta">
      ${c.loc ? `<span class="badge b-loc">${esc(c.loc)}</span>` : ''}${srcBadge(c)}
      ${rs.filter(r=>!r.cancelled).length ? '' : '<span class="badge b-free">空き</span>'}
      </div></div><div class="days" style="height:calc(var(--lane)*${n})"><div class="bgs">`;
    days.forEach(ms => {
      const d = toJ(ms), dow = d.getUTCDay();
      const cc = [dow===6?'sat':'', dow===0?'sun':'', jKey(ms)===todayKey?'today':''].join(' ');
      h += `<div class="bg ${cc}"></div>`;
    });
    h += `</div><div class="bars">`;
    rs.forEach(r => {
      const L = Math.max(0, (r.s - w0) / WK * 100), R = Math.min(100, (r.e - w0) / WK * 100);
      h += barHtml(r, L, R, now, r.s < w0, r.e > w1);
    });
    if (now >= w0 && now < w1) h += `<div class="nowline" style="left:${(now-w0)/WK*100}%"></div>`;
    h += `</div></div></div>`;
  });
  gridEl.innerHTML = h;
}

function renderDay(){
  const now = Date.now(), d0 = curDay;
  const t0 = d0 + DAY_H0*3600e3, t1 = d0 + DAY_H1*3600e3, span = t1 - t0;
  const hours = DAY_H1 - DAY_H0;
  const dd = toJ(d0);
  el('range').textContent = `${jKey(d0).replace(/-/g,'/')}（${DOW[dd.getUTCDay()]}）`;
  el('lg-note').textContent = `│ ${DAY_H0}:00〜${DAY_H1}:00 の時間割。赤い縦線＝現在時刻`;
  const gridEl = el('grid'); gridEl.className = 'grid dy';
  gridEl.style.setProperty('--hours', hours);

  const inView = RES.filter(r => r.e > d0 && r.s < d0 + DAY);
  const list = visibleCars(inView);
  /* 表示時間帯の外にある予約は描けないので、隠した件数を必ず出す */
  const hidden = inView.filter(r => r.e <= t0 || r.s >= t1).length;
  el('cnt').textContent = `表示 ${list.length}台 / 全 ${CARS.length}台　この日の予約 ${inView.filter(r=>!r.cancelled).length}件`
    + (hidden ? `　⚠ ${DAY_H0}:00〜${DAY_H1}:00 の外に ${hidden}件（週表示で確認してください）` : '');

  let h = `<div class="hrow"><div class="hname">車両（${list.length}）</div><div class="hdays">`;
  for (let i = 0; i < hours; i++){
    const hh = DAY_H0 + i;
    h += `<div class="hd ${hh===12?'noon':''}"><div class="dnum" style="font-size:12px">${pad(hh)}</div><div class="dow">:00</div></div>`;
  }
  h += `</div></div>`;
  if (!list.length) h += `<div class="empty">条件に合う車両がありません</div>`;

  list.forEach(c => {
    const rs = resOf(c, d0, d0 + DAY), n = laneAssign(rs);
    h += `<div class="row"><div class="name" style="min-height:calc(var(--lane)*${n})">
      <div class="mn">${esc(c.n)}</div><div class="meta">
      ${c.loc ? `<span class="badge b-loc">${esc(c.loc)}</span>` : ''}${srcBadge(c)}
      ${rs.filter(r=>!r.cancelled).length ? '' : '<span class="badge b-free">空き</span>'}
      </div></div><div class="days" style="height:calc(var(--lane)*${n})"><div class="bgs">`;
    for (let i = 0; i < hours; i++){
      const hh = DAY_H0 + i;
      h += `<div class="bg ${(hh<8||hh>=18)?'off':''}"></div>`;
    }
    h += `</div><div class="bars">`;
    rs.forEach(r => {
      const L = Math.max(0, (r.s - t0) / span * 100), R = Math.min(100, (r.e - t0) / span * 100);
      if (R <= 0 || L >= 100) return;                      /* 表示時間帯の外 */
      h += barHtml(r, L, R, now, r.s < t0, r.e > t1);
    });
    if (now >= t0 && now < t1) h += `<div class="nowline" style="left:${(now-t0)/span*100}%"></div>`;
    h += `</div></div></div>`;
  });
  gridEl.innerHTML = h;
}

/* ============================================================
   操作
   ============================================================ */
function setView(v){
  VIEW = v;
  el('vWeek').classList.toggle('on', v === 'week');
  el('vDay').classList.toggle('on',  v === 'day');
  loadAll();
}
el('vWeek').onclick = () => { if (VIEW !== 'week') { curWeek = weekTopMs(curDay); setView('week'); } };
el('vDay').onclick  = () => { if (VIEW !== 'day')  { const t = Date.now();
  curDay = (t >= curWeek && t < curWeek + WK) ? dayTopMs(t) : curWeek; setView('day'); } };

el('prev').onclick = async () => {
  if (VIEW === 'week') curWeek -= WK; else curDay -= DAY;
  await loadRes(); paintPanel(); render();
};
el('next').onclick = async () => {
  if (VIEW === 'week') curWeek += WK; else curDay += DAY;
  await loadRes(); paintPanel(); render();
};
el('todayBtn').onclick = async () => {
  curWeek = weekTopMs(Date.now()); curDay = dayTopMs(Date.now());
  await loadRes(); paintPanel(); render();
};
['loc','onlyres','onlyfree'].forEach(id => el(id).onchange = render);
el('q').oninput = render;

el('grid').addEventListener('click', ev => {
  const bar = ev.target.closest('.bar-i');
  if (bar) openDetail(bar.dataset.r);
});

function openDetail(rid){
  const r = RES.find(x => x.rid === rid); if (!r) return;
  const c = CARS.find(x => x.n === r.car);
  el('dTitle').textContent = r.t;
  el('dBody').innerHTML = [
    ['車両',   `${esc(r.car)}${c && c.loc ? ` <span class="badge b-loc">${esc(c.loc)}</span>` : ''}`],
    ['利用期間', `${jFull(r.s)} 〜 ${jFull(r.e)}${r.allDay ? '（終日）' : ''}`],
    ['状態',   `<b>${calcStatus(r, Date.now())}</b> <span style="color:var(--muted);font-size:11px">日時から計算</span>`],
    ['予約者', r.who ? `${esc(r.who)}${r.mailWho ? `<span style="color:var(--muted);font-size:11px"> ${esc(r.mailWho)}</span>` : ''}` : '—'],
    ['行き先', esc(r.dest) || '—'],
    ['取得元', esc(r.from)]
  ].map(([k,v]) => `<dt>${k}</dt><dd>${v}</dd>`).join('');
  el('dNote').textContent = '予約の変更・取消は Outlook の予定を直接編集してください。この画面からは変更できません。';
  el('dMsg').textContent = r._dup && !r.cancelled ? '⚠ 同じ車両で期間が重なっている予約があります' : '';
  el('dMsg').className = 'msg' + (r._dup && !r.cancelled ? ' ng' : '');
  openM('mDetail');
}
document.querySelectorAll('.modal').forEach(m => m.addEventListener('click', e => { if (e.target === m) m.classList.remove('on'); }));
document.addEventListener('keydown', e => { if (e.key === 'Escape') document.querySelectorAll('.modal.on').forEach(m => m.classList.remove('on')); });

initMsal();
</script>

<script>
'use strict';
/* 経費：請求書を受け付け、AI の読み取りを確かめ、確認の段を通して確定する画面
   ・受付：支払依頼（ワークフロー）の決裁で自動で届く／稟議なしは PDF をここに置く → AP_Invoice（AI状態＝受付）＋ incoming に PDF と task.json → AI が読む
   ・受信トレイ：AI 読み取り中｜読み取り失敗｜確認待ち（1段目）
   ・確認（請求書ごと）：内容・科目・部門・金額・支払方法・仕訳 → ✔ OK で次の段へ。最後の段の OK で確定 → 支払（決裁・出力）が支払指図にする
   決め事は 08_支払決裁.md（ワークフロー作成）。段と担当・仕訳の決まりは AP_Setting の expense.rules、科目・部門は /BILLS/masters の SMILE マスタ。画面に業務データを書かない */
/* 全アプリ共通。HUBのサインインをそのまま使う（→ hanaoka_auth.js） */
const MSAL_CONFIG = HanaokaAuth.msalConfig();
const SCOPES=['User.Read','Sites.ReadWrite.All','Files.ReadWrite.All'];
const GRAPH='https://graph.microsoft.com/v1.0';
const AP_SITE='hanaokacorp.sharepoint.com,d80378dd-76a4-43f0-b939-1af66345d19d,8eaeb70b-2495-4029-affb-eabe80e021bb';
const MOCK=window.AP_MOCK||null;   // MOCK は dev だけ（本番の HTML には無い）
const $=id=>document.getElementById(id);
let msalApp=null,acct=null;
const L={inv:{name:'AP_Invoice'},sl:{name:'AP_PaymentSlip'},vb:{name:'AP_VendorBank'},sp:{name:'AP_SmilePay'},pi:{name:'AP_PaymentInstruction'},sb:{name:'AP_SettleBatch'}};
Object.values(L).forEach(o=>{o.id=null;o.fmap={};});
// AP_Invoice の v3 以降の列は内部名で読み書きする（表示名だと 作成者＝登録者 などとぶつかる）
const V={ai:'AIStatus',com:'AIComment',by:'RegisteredBy',at:'RegisteredAt',loc:'SiteLocation',cby:'CheckedBy',cat:'CheckedAt',wf:'WfRequestNo',step:'ExpenseStep',log:'CheckLog',hold:'CheckHold',note:'CheckNote'};
// 経費の振込先（SMILE の外の支払先。請求書から読み、人が確かめる。確定で振込先マスタ AP_VendorBank に登録）
const BK={code:'PayeeBankCode',name:'PayeeBankName',bcode:'PayeeBranchCode',bname:'PayeeBranchName',type:'PayeeAcctType',no:'PayeeAcctNo',holder:'PayeeAcctHolder',src:'PayeeBankSource'};
const ACCT_TYPES=['普通','当座','貯蓄'];
const ROUNDS=['10日','20日','月末'],METHODS=['総合振込','口座振替','現金','でんさい','海外送金'],RATES=['課税10%','軽減8%','非課税','対象外'],DONE=['確定済（ロック）','先行支払済','支払済'];
const LOCKED=['決裁中','決裁済み','出力済み'];
let RULES=null,KAMOKU=[],BUMON=[],JOURNAL=null;
let listClosed=(()=>{try{return localStorage.getItem('ap.review.list')==='closed';}catch{return false;}})();   // 確認モードの一覧をたたむ（ページ送りが中心）
let ALL=[],LINES={},VB={},SPM=[],PIS=[],SBS=[],items=[],draft=null,hdrDraft=null,cmDraft=null,pdfSel={},pdfCache={},acks={};
const st={tab:'inbox',box:'wait',loc:'',round:'',step:'mine',q:'',sel:null,cmOpen:false,view:'list',editHdr:false,editBank:false,allIss:false,openLines:null,openLog:false};

// ---------- 認証・Graph ----------
async function boot(){
  if(MOCK){acct=MOCK.account;await showApp();return;}
  msalApp=new msal.PublicClientApplication(MSAL_CONFIG);await msalApp.initialize();await msalApp.handleRedirectPromise();
  acct = await HanaokaAuth.restore(msalApp, SCOPES);
  if (acct) { await showApp(); }}
async function signIn(){try{acct = await HanaokaAuth.login(msalApp, SCOPES);await showApp();}catch(e){if(e.errorCode!=='user_cancelled')snack('サインインエラー: '+e.message,true);}}
async function token(){try{const r=await msalApp.acquireTokenSilent({scopes:SCOPES,account:acct});return r.accessToken;}catch{const r=await msalApp.acquireTokenPopup({scopes:SCOPES});acct=r.account;return r.accessToken;}}
async function call(method,p,body,ctype,raw){

  const pi=PIS.find(p=>String(fv(L.pi,p,'元請求書ID')||'').split(',').includes(r.id));if(!pi)return '';
  const bid=String(fv(L.pi,pi,'決裁バッチ')||'');const b=bid&&SBS.find(s=>s.id===bid);const s=b?fv(L.sb,b.f,'状態'):'';return LOCKED.includes(s)?s:'';}
// 気づき：AI のコメント＋アプリで分かること（仕入の請求書では？・二重・前月比・口座・拠点）
function alertsOf(r){
  const a=[];
  r.aicom.split(/\n+/).map(s=>s.trim()).filter(Boolean).forEach(s=>a.push({k:'AI',t:s,ack:true}));
  if(r.failed)a.push({k:'読み取り失敗',t:'AI が読み取れませんでした。請求書を見て、支払先・金額・仕訳を入れてください',ack:false});
  const n=jnorm(r.payee);
  if(n){const sp=(r.code&&SPM.find(s=>s.code===r.code))||SPM.find(s=>s.n&&(s.n===n||(n.length>=4&&(s.n.includes(n)||n.includes(s.n)))));
    if(sp)a.push({k:'仕入では？',t:`SMILE の仕入先「${sp.name}」（${sp.code}）に今月の仕入 ${yen(sp.incl)} 円があります。仕入の請求書なら「その他 → 仕入の請求書として移す」`,ack:true});
    const dup=ALL.filter(o=>o.id!==r.id&&jnorm(fv(L.inv,o.f,'支払先名'))===n&&((r.invNo&&fv(L.inv,o.f,'請求NO')===r.invNo)||(r.amount&&+fv(L.inv,o.f,'金額_税込')===r.amount&&fv(L.inv,o.f,'対象年月')===r.ym)));
    if(dup.length)a.push({k:'二重？',t:`同じ支払先で${r.invNo&&dup.some(o=>fv(L.inv,o.f,'請求NO')===r.invNo)?'同じ請求No':'同じ月・同じ金額'}の請求書がほかに ${dup.length} 枚あります`,ack:true});}
  const al=RULES.alerts||{},pm=prevAmount(r);
  if(r.amount&&pm==null&&r.amount>=(al.newMin||100000))a.push({k:'初めて',t:`前月にない支払先です（${yen(r.amount)} 円）`,ack:false});
  if(pm&&r.amount-pm>=(al.upMin||50000)&&r.amount>=pm*(1+(al.upRate||0.3)))a.push({k:'前月より増',t:`前月 ${yen(pm)} 円 → ${yen(r.amount)} 円`,ack:false});
  if(r.method==='総合振込'&&r.status!=='先行支払済'){const m=masterBankOf(r),b=r.bk,has=bankFull(b);
    if(!has&&!m)a.push({k:'口座',t:'振込先が入っていません。請求書の振込先を「振込先」の欄に入れてください（全銀の出力に要ります）',ack:true,block:true});
    else if(has&&m&&!sameBank(b,m))a.push({k:'口座',t:`振込先が振込先マスタと違います（マスタ：${bankText(m)}／請求書：${bankText(b)}）。電話などで確かめてください`,ack:true,block:true});
    else if(has&&!m)a.push({k:'初めての振込先',t:'振込先マスタに無い支払先です。銀行コード・支店コードを参照元で確かめてください（確定すると振込先マスタに登録します）',ack:true});}
  const pre=RULES.factoryDeptPrefix||'003',fd=r.lines.some(l=>String(fv(L.sl,l.f,'部門コード')||'').startsWith(pre)),hd=r.lines.some(l=>{const c=String(fv(L.sl,l.f,'部門コード')||'');return c&&!c.startsWith(pre);});
  if(r.loc==='本社'&&fd&&!hd)a.push({k:'拠点',t:'仕訳の部門が工場ですが、本社の経費として受け付けています',ack:true});
  if(r.loc==='工場'&&hd&&!fd)a.push({k:'拠点',t:'仕訳の部門が本社ですが、工場の経費として受け付けています',ack:true});
  return a;}
function prevAmount(r){const ym=prevMonth(r.ym||month()),n=jnorm(r.payee);if(!n)return null;
  const p=ALL.filter(o=>fv(L.inv,o.f,'対象年月')===ym&&jnorm(fv(L.inv,o.f,'支払先名'))===n);return p.length?p.reduce((s,o)=>s+(+fv(L.inv,o.f,'金額_税込')||0),0):null;}
function tagsOf(r){const t=[];
  if(r.reading)t.push(['AI 読み取り中','t-pri']);if(r.failed)t.push(['読み取り失敗','t-up']);
  if(r.reading&&r.at&&Date.now()-new Date(r.at)>24*3600e3)t.push(['読み取りが止まっている？','t-up']);
  if(r.wf)t.push(['WF '+r.wf,'t-ok']);if(!r.ym&&!r.reading)t.push(['対象年月なし','t-new']);
  if(!r.code&&!r.reading&&!r.done&&vendorCands(r.payee).length)t.push(['コードの候補','t-pri']);
  // 同じ種類の気づきは1つにまとめる（AI のコメントは行の数を添える：AI 4）
  const ak={};alertsOf(r).filter(a=>a.k!=='読み取り失敗').forEach(a=>{const o=ak[a.k]||(ak[a.k]={n:0,cls:'t-flag'});o.n++;if(a.block||a.k==='二重？'||a.k==='仕入では？')o.cls='t-up';});
  Object.entries(ak).forEach(([k,o])=>t.push([o.n>1?`${k} ${o.n}`:k,o.cls]));
  if(!r.reading&&r.lines.length&&r.lsum!==r.amount)t.push(['仕訳と金額が違う','t-up']);if(!r.reading&&!r.lines.length)t.push(['仕訳なし','t-new']);
  if(r.reject&&!r.done)t.push(['差し戻し','t-up']);if(r.status==='先行支払済')t.push(['先行支払済','t-pri']);
  return t;}
function buildItems(){items=ALL.map(mk);}
const inScope=r=>(!st.loc||r.loc===st.loc)&&(!st.round||r.round===st.round);
const inMonth=r=>r.ym===month()||(!r.ym&&!r.done);

// ---------- 画面 ----------

    +'<span style="width:10px"></span>'+[['','全回'],...ROUNDS.map(r=>[r,r])].map(([k,l])=>`<button class="${st.round===k?'on':''}" data-round="${k}">${l}</button>`).join('');

// ---- 📥 受信トレイ（月をまたいで、まだ1段目の手前にあるもの） ----

function myLoc(){const f=(RULES.steps&&RULES.steps['工場'])||[];return f.some(s=>(s.members||[]).some(n=>sameName(me(),n)))&&!isSub()?'工場':'本社';}

        <label style="font-size:13px;color:var(--sub)">拠点 <select id="rc-loc"><option ${myLoc()==='本社'?'selected':''}>本社</option><option ${myLoc()==='工場'?'selected':''}>工場</option></select></label>

      ${list.sort((x,y)=>String(y.at).localeCompare(String(x.at))).map(r=>`<tr class="row" data-open="${r.id}"><td>${esc(fmtTime(r.at))}<div style="font-size:11.5px;color:var(--sub)">${esc(r.by)}・${esc(r.loc)}</div></td>
        <td style="white-space:normal"><b>${esc(r.payee||r.title||'（読み取り前）')}</b>${r.wf?`<div style="font-size:11.5px;color:var(--sub)">ワークフロー ${esc(r.wf)}（社長決裁済み）</div>`:''}</td>
        <td class="n">${r.reading?'—':yen(r.amount)}</td><td>${esc(r.ym||'')} ${esc(r.round||'')}<div style="font-size:11.5px;color:var(--sub)">${esc(r.method||'')}</div></td>
        <td style="white-space:normal">${tagsOf(r).filter(t=>!/^WF |AI 読み取り中/.test(t[0])).map(t=>`<span class="tag ${t[1]}">${esc(t[0])}</span>`).join('')}</td></tr>`).join('')||'<tr><td colspan="5" style="color:var(--sub);padding:14px">ありません</td></tr>'}</table></div>`;
  const d=$('drop');['dragenter','dragover'].forEach(e=>d.addEventListener(e,ev=>{ev.preventDefault();d.classList.add('over');}));

// ---- 📊 サマリー ----

    <div class="card"><h2>経費の支払（${esc(st.loc||'全拠点')}・${esc(st.round||'全回')}）</h2><div class="big">${yen(tot)}<small> 円</small></div>

    <div class="card"><h2>気づき（${flagged.length}件）</h2><div class="flags">${flagged.length?flagged.map(o=>`<div class="flag" data-open="${o.r.id}"><span class="why">${o.t.map(x=>esc(x[0])).join('・')}</span><span class="who">${esc(o.r.payee||o.r.title)}</span><span class="amt">${yen(o.r.amount)}</span></div>`).join(''):'<div style="color:var(--sub)">ありません</div>'}</div></div></div>
  <div class="card"><h2>支払回 × 拠点</h2><table><tr><th>支払回</th><th>拠点</th><th class="n">件数</th><th class="n">金額</th><th class="n">確定</th><th class="n">前月</th></tr>
    ${[...ROUNDS,''].flatMap(rd=>['本社','工場'].map(lc=>{const l=a.filter(r=>(r.round||'')===rd&&r.loc===lc);if(!l.length)return '';const p=items.filter(r=>r.ym===prevMonth(month())&&r.round===rd&&r.loc===lc).reduce((s,r)=>s+r.amount,0);
      return `<tr><td>${esc(rd||'（未設定）')}</td><td>${lc}</td><td class="n">${l.length}</td><td class="n">${yen(l.reduce((s,r)=>s+r.amount,0))}</td><td class="n">${l.filter(r=>r.done).length}／${l.length}</td><td class="n">${p?yen(p):'—'}</td></tr>`;})).join('')}</table></div>

// 段の名前。全拠点のときは本社と工場で担当が違うので分けて出す（例：確認（Ａ／工場 Ｂ・Ｃ））
function stepLabelAll(i){const locs=st.loc?[st.loc]:['本社','工場'];const parts=[];let label='';
  locs.forEach(l=>{const s=stepsOf(l)[i];if(!s)return;label=label||s.label;parts.push((locs.length>1&&l==='工場'?'工場 ':'')+(s.members||[]).map(n=>String(n).split(/[\s　]/)[0]).join('・'));});
  return `${label}（${parts.join('／')}）`;}

// ---- 📄 確認 ----
// 自分の番：自分の段のもの。自分の段が無い代理の人（substitutes）は、代わりに押せるもの
function mineOf(list){const own=list.filter(r=>canAct(r)&&myStepAt(r));return own.length?own:list.filter(canAct);}
function listRows(){
  let a=items.filter(r=>inMonth(r)&&inScope(r));

  else if(st.step==='done')a=a.filter(r=>r.done);else if(st.step!=='all')a=a.filter(r=>!r.done&&r.step===+st.step);

// ---- 📄 確認：一覧（自分の番・段ごと）→「1件ずつ」（左に請求書を大きく、右に 気づき・支払内容・振込先・仕訳・履歴） ----

function openOne(id){st.sel=id;st.view='one';st.editHdr=false;st.editBank=false;st.allIss=false;draft=null;hdrDraft=null;cmDraft=null;drawReview();}
const cur=()=>items.find(r=>r.id===st.sel)||null;
const linesOf=r=>r.lines.map(l=>({id:l.id,acode:fv(L.sl,l.f,'勘定科目コード')||'',aname:fv(L.sl,l.f,'勘定科目名')||'',dept:fv(L.sl,l.f,'部門コード')||'',tm:fv(L.sl,l.f,'税区分')||'税込',rate:fv(L.sl,l.f,'税率区分')||'課税10%',
  excl:+fv(L.sl,l.f,'金額_税抜')||0,tax:+fv(L.sl,l.f,'消費税')||0,incl:+fv(L.sl,l.f,'金額_税込')||0,note:fv(L.sl,l.f,'摘要')||'',conf:+fv(L.sl,l.f,'AI信頼スコア')||0}));
// 開いている1件は、下書き（直したけれど保存していないもの）で見る
function viewOf(r){const me1=r.id===st.sel;const h=(me1&&hdrDraft)||hdrOf(r),ls=(me1&&draft)||linesOf(r);return {h,ls,lsum:ls.reduce((s,l)=>s+(+l.incl||0),0)};}
const isDirty=r=>!!(hdrDraft||draft||(cmDraft!=null&&cmDraft!==r.note));
// 気づき：要修正（直さないと確認完了できない）／要確認（見て判断する。確認完了で「確かめた」と記録）／参考
function issuesOf(r){

  if(!(h.amount>0))fix('金額がありません','請求書の税込の合計を入れてください');
  if(!h.ym)fix('対象年月（払う月）がありません','2026/10 の形で入れてください');
  if(!h.round)fix('支払回がありません','10日・20日・月末から選んでください');
  if(!h.method)fix('支払方法がありません','総合振込・口座振替などから選んでください');
  if(!ls.length)fix('仕訳がありません','「仕訳を確認」で入れてください（過去の仕訳から案も作れます）');
  else{if(ls.some(l=>!l.acode))fix('科目が空の行があります','「仕訳を確認」で科目を選んでください');
    if(lsum!==h.amount)fix('仕訳の合計が金額と違います',`仕訳 ${yen(lsum)} 円／金額 ${yen(h.amount)} 円`);}
  if(h.method==='総合振込'&&r.status!=='先行支払済'){const b=h.bk,m=masterBankOf(Object.assign({},r,{payee:h.payee,code:h.code,regNo:h.regNo})),full=bankFull(b);
    if(!full&&!m)fix('振込先が登録されていません','請求書の振込先を確認し、口座情報を入力してください');
    else if(full&&m&&!sameBank(b,m))chk('振込先が振込先マスタと違います',`マスタ：${bankText(m)}／請求書：${bankText(b)}。口座は自動で変えません。電話などで確かめてください`);

      const hf=toFields(L.inv,{Title:f.name.replace(/\.pdf$/i,''),'支払区分':cat,'対象年月':month(),'仕分け済':true,'支払ステータス':'確認待','DOCコード':`/Shared Documents/BILLS/incoming/${fname}`});
      hf[V.ai]='受付';hf[V.by]=me();hf[V.at]=new Date().toISOString();hf[V.loc]=loc;hf[V.step]=0;
      const created=await gpost(`/sites/${AP_SITE}/lists/${L.inv.id}/items`,{fields:hf});
      // sidecar：AI（Claude）がどの請求書を埋めるか。経費なので科目・部門・仕訳の案も作る
      const task={ap_code:code,pdf_file:fname,invoice_id:String(created.id),category:cat,location:loc,vendor_code:'',target_ym:month(),
        checks:['支払先・金額・消費税・請求No・登録番号・期日','振込先口座','科目・部門・税率の仕訳の案（過去の仕訳を参考に）','仕入の請求書ではないか','二重請求・前月比'],
        registered_by:me(),registered_at:new Date().toISOString(),source_name:f.name};
      await gputFile(`/BILLS/incoming/${code}.task.json`,new Blob([JSON.stringify(task,null,2)],{type:'application/json'}),'application/json');
      ok++;}catch(e){snack('受付エラー: '+e.message,true);}}
  await loadAll();msg('');st.box='reading';snack(`✓ ${ok}件を受け付けました（AI 読み取り待ち）`);render();}

// ---------- 下：進み具合 ----------
function drawApprove(){
  const a=items.filter(r=>inMonth(r)&&!r.reading),dn=a.filter(r=>r.done).length,mine=mineOf(a).length,hold=a.filter(r=>r.hold&&!r.done).length;
  const byR=ROUNDS.map(rd=>{const l=a.filter(r=>r.round===rd);return l.length?`${rd} ${l.filter(r=>r.done).length}/${l.length}`:'';}).filter(Boolean).join('・');
  $('approve').innerHTML=`<span class="prog">${month().replace('/','年')}月払い：確定 ${dn} / ${a.length} 件${byR?'（'+byR+'）':''}${hold?`　<b style="color:var(--warn)">保留 ${hold}</b>`:''}</span>
    ${mine?`<span class="rest">あなたの番 ${mine} 件</span>`:''}
    <a href="ap_payment.html?month=${encodeURIComponent(month())}"><button class="pri">支払（決裁・出力）へ →</button></a>`;}

// ---------- 操作 ----------
document.addEventListener('click',e=>{
  const tb=e.target.closest('[data-tab]');if(tb){st.tab=tb.dataset.tab;draft=null;hdrDraft=null;render();return;}
  const bx=e.target.closest('[data-box]');if(bx){st.box=bx.dataset.box;render();return;}
  const lc=e.target.closest('[data-loc]');if(lc){st.loc=lc.dataset.loc;render();return;}
  const rd=e.target.closest('[data-round]');if(rd){st.round=rd.dataset.round;render();return;}
  const sp=e.target.closest('[data-step]');if(sp){st.step=sp.dataset.step;draft=null;hdrDraft=null;drawReview();return;}
  const op=e.target.closest('[data-open]');if(op){const r=items.find(x=>x.id===op.dataset.open);if(!r)return;if(r.ym&&r.ym!==month()){setMonth(r.ym);loadAll().then(()=>{openInReview(r.id);});return;}openInReview(r.id);return;}
  const s=e.target.closest('[data-sel]');if(s&&st.tab==='rev'){openOne(s.dataset.sel);}
  if(!e.target.closest('.docs')){const m=$('oDocsM');if(m)m.hidden=true;}});
function openInReview(id){st.tab='rev';st.step='all';buildItems();openOne(id);render();}
document.addEventListener('change',async e=>{if(e.target.id==='month'){st.sel=null;draft=null;hdrDraft=null;await loadAll();render();}});
document.addEventListener('input',e=>{if(e.target.id==='q'){st.q=e.target.value.trim();drawRows();}});
document.addEventListener('keydown',e=>{
  if(st.tab!=='rev'||st.view!=='one'||['INPUT','TEXTAREA','SELECT'].includes(e.target.tagName)||e.ctrlKey||e.altKey||e.metaKey)return;
  if(e.key==='Enter'){e.preventDefault();okRow();}else if(e.key==='ArrowRight'||e.key==='ArrowDown'){e.preventDefault();go(1);}
  else if(e.key==='ArrowLeft'||e.key==='ArrowUp'){e.preventDefault();go(-1);}
  else if(e.key==='h'||e.key==='H'){const r=cur();if(r&&canAct(r)){e.preventDefault();act(r,{[V.hold]:!r.hold},r.hold?'保留を外しました':'保留にしました',{act:r.hold?'保留を外す':'保留',step:r.step});}}});
boot().catch(e=>{console.error(e);snack('起動エラー: '+e.message,true);});
</script>
